<!--
  Race Club — reset-password.html  (v1.0, GitHub Pages edition)

  NEW PAGE (this pass): "Forgot password?" on login.html links here.
  Two-step, single-page flow, reusing patterns already established by
  register.html/verify.html rather than inventing new ones:

  STEP 1 (#rc-reset-step-email): just an email field + "Send Reset Code"
  button, calling the new `forgotPassword` action. The server ALWAYS
  returns the same success message here regardless of whether that email
  actually has an account (see handleForgotPassword's comment in Auth.gs)
  -- so this page can't be used to find out which emails are registered.
  That means step 2 always shows next, even for a typo'd or unregistered
  email; if no code ever arrives, the honest failure mode is "that code
  didn't work" when they try one, not a dead end here.

  STEP 2 (#rc-reset-step-code): the same 6-box code entry UI as
  verify.html (auto-advance, backspace, paste-to-fill, no separate submit
  button for the code itself), plus new-password + confirm-password
  fields underneath, reusing register.html's live-match-check pattern.
  Submits everything together to the new `resetPassword` action once all
  6 code digits are in AND the passwords match. Unlike verify.html's flow,
  this is keyed by EMAIL, not ProfileID -- a locked-out driver only ever
  has their email to give us, and using email here means this page never
  needs a ProfileID handed back to it either (which would itself leak
  whether an email is registered).

  On success: stash a confirmation under 'raceclub_login_message', then
  navigate to login.html after a short readable pause. Login is by
  Username again (see login.html), and this page only ever learns the
  driver's email, so there's nothing valid to prefill there anymore --
  no 'raceclub_prefill_email' key gets set.

  TOASTS: every result message on this page (send/resend results, code
  errors, "Password updated!", the unreachable-server fallback) goes
  through js/header.js's showToast() rather than an inline message box --
  see that file's header comment for why. The password-match hint stays
  inline since it's live field validation, not a result notification.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password · Race Club</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
</head>
<body>
<div id="rc-header"></div>
<script>renderHeader();</script>
<div class="rc-auth-page">
  <div class="rc-auth-wrap" style="max-width:460px;">
    <h1>Reset Your Password</h1>

    <div id="rc-setup-warning" class="rc-message rc-error" style="display:none;text-align:center;"></div>

    <!-- STEP 1 -- email entry -->
    <div class="rc-card" id="rc-reset-step-email" style="margin-top:24px;">
      <p style="margin:0 0 16px;font-size:14px;color:var(--rc-steel);">Enter the email address on your account and we'll send you a 6-digit reset code.</p>
      <form id="rc-reset-email-form">
        <label style="margin-top:0;">Email Address</label>
        <input id="rc-reset-email" type="email" autocomplete="email" required>
        <button id="rc-reset-email-btn" type="submit" class="rc-btn-primary" style="margin-top:14px;">Send Reset Code</button>
      </form>
    </div>

    <!-- STEP 2 -- code + new password, hidden until step 1 succeeds -->
    <div class="rc-card" id="rc-reset-step-code" style="margin-top:24px;display:none;text-align:center;">
      <p id="rc-reset-code-intro" style="margin:0 0 16px;font-size:14px;"></p>
      <div class="rc-code-row">
        <input class="rc-code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code">
        <input class="rc-code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
        <input class="rc-code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
        <input class="rc-code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
        <input class="rc-code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
        <input class="rc-code-box" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off">
      </div>

      <div class="rc-section" style="text-align:left;margin-top:20px;">
        <label style="margin-top:0;">New Password</label>
        <input id="rc-reset-password" type="password" autocomplete="new-password" required minlength="6">
        <div class="rc-hint">At least 6 characters.</div>

        <label>Confirm New Password</label>
        <input id="rc-reset-password2" type="password" autocomplete="new-password" required minlength="6">
        <div id="rc-reset-password-match" class="rc-hint"></div>
      </div>

      <button type="button" id="rc-reset-submit-btn" class="rc-btn-primary" style="margin-top:6px;">Reset Password</button>
      <button type="button" class="rc-link-btn" id="rc-reset-resend" style="margin-top:12px;">Resend code</button>
    </div>

    <p class="rc-auth-footer">
      <button type="button" class="rc-link-btn" onclick="window.location.href='login.html'">Back to login</button>
    </p>
  </div>
</div>

<!-- Site footer -- on every page. -->
<footer class="rc-site-footer">
  Copyright Race Club 2026. All rights reserved. Created and developed with the help of Claude AI.
</footer>

<script>
(function () {
  if (apiBaseUrlIsUnset()) {
    var warn = document.getElementById('rc-setup-warning');
    warn.style.display = 'block';
    warn.textContent = 'API_BASE_URL is not set. Edit js/api.js and paste in your Apps Script Web App URL.';
    document.getElementById('rc-reset-email-form').querySelectorAll('input,button').forEach(function (i) { i.disabled = true; });
    return;
  }

  var pendingEmail = '';

  // -----------------------------------------------------------------------
  // STEP 1 -- request a code
  // -----------------------------------------------------------------------
  document.getElementById('rc-reset-email-form').addEventListener('submit', function (evt) {
    evt.preventDefault();
    var btn = document.getElementById('rc-reset-email-btn');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    pendingEmail = document.getElementById('rc-reset-email').value.trim();

    fetchApi('forgotPassword', { method: 'POST', body: { email: pendingEmail } })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = 'Send Reset Code';
        if (!data.success) {
          showToast(data.message || 'Could not send a reset code.', 'error');
          return;
        }
        document.getElementById('rc-reset-step-email').style.display = 'none';
        var intro = document.getElementById('rc-reset-code-intro');
        intro.textContent = 'If an account exists for ' + pendingEmail + ', a 6-digit code is on its way. Enter it below along with your new password.';
        document.getElementById('rc-reset-step-code').style.display = 'block';
        codeBoxes[0].focus();
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Send Reset Code';
        showToast('Could not reach the server. Check API_BASE_URL and try again.', 'error');
      });
  });

  // -----------------------------------------------------------------------
  // STEP 2 -- code entry (same 6-box UI/behavior as verify.html) + new
  // password. No auto-submit-on-6-digits here, unlike verify.html --
  // resetPassword needs the password fields too, so submission waits for
  // the explicit Reset Password click.
  // -----------------------------------------------------------------------
  var codeBoxes = Array.prototype.slice.call(document.querySelectorAll('.rc-code-box'));

  codeBoxes.forEach(function (box, idx) {
    box.addEventListener('input', function () {
      box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
      box.classList.remove('rc-code-error');
      if (box.value && idx < codeBoxes.length - 1) {
        codeBoxes[idx + 1].focus();
      }
    });
    box.addEventListener('keydown', function (evt) {
      if (evt.key === 'Backspace' && !box.value && idx > 0) {
        codeBoxes[idx - 1].focus();
      }
    });
    box.addEventListener('paste', function (evt) {
      var pasted = ((evt.clipboardData || window.clipboardData).getData('text') || '').replace(/[^0-9]/g, '');
      if (pasted.length >= 6) {
        evt.preventDefault();
        for (var i = 0; i < 6; i++) codeBoxes[i].value = pasted[i];
        codeBoxes[5].focus();
      }
    });
  });

  // Live password-match check, same pattern as register.html.
  var resetPassword = document.getElementById('rc-reset-password');
  var resetPassword2 = document.getElementById('rc-reset-password2');
  var resetPasswordMatch = document.getElementById('rc-reset-password-match');

  function checkPasswordMatch() {
    var p1 = resetPassword.value;
    var p2 = resetPassword2.value;
    if (!p2) {
      resetPasswordMatch.className = 'rc-hint';
      resetPasswordMatch.textContent = '';
      return true;
    }
    var matches = p1 === p2;
    resetPasswordMatch.className = matches ? 'rc-hint rc-ok' : 'rc-hint rc-error';
    resetPasswordMatch.textContent = matches ? 'Passwords match.' : 'Passwords do not match.';
    return matches;
  }
  resetPassword.addEventListener('input', checkPasswordMatch);
  resetPassword2.addEventListener('input', checkPasswordMatch);

  document.getElementById('rc-reset-submit-btn').addEventListener('click', function () {
    var btn = this;

    var code = codeBoxes.map(function (b) { return b.value; }).join('');
    if (code.length !== 6) {
      showToast('Enter the full 6-digit code.', 'error');
      return;
    }
    if (resetPassword.value.length < 6) {
      showToast('New password must be at least 6 characters.', 'error');
      return;
    }
    if (!checkPasswordMatch()) {
      showToast('Passwords do not match.', 'error');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    fetchApi('resetPassword', {
      method: 'POST',
      body: { email: pendingEmail, code: code, newPassword: resetPassword.value }
    })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
        if (!data.success) {
          codeBoxes.forEach(function (box) { box.classList.add('rc-code-error'); });
          showToast(data.message || 'That code did not work. Try again.', 'error');
          return;
        }
        showToast(data.message || 'Password updated!', 'success');
        setTimeout(function () {
          sessionStorage.setItem('raceclub_login_message', "Your password has been reset. Log in below.");
          window.location.href = 'login.html';
        }, 1600);
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Reset Password';
        showToast('Could not reach the server. Try again in a moment.', 'error');
      });
  });

  document.getElementById('rc-reset-resend').addEventListener('click', function () {
    var btn = this;
    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = 'Sending...';
    fetchApi('forgotPassword', { method: 'POST', body: { email: pendingEmail } })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = originalText;
        showToast(data.message || (data.success ? 'Sent.' : 'Could not resend.'), data.success ? 'success' : 'error');
        codeBoxes.forEach(function (box) { box.value = ''; box.classList.remove('rc-code-error'); });
        codeBoxes[0].focus();
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = originalText;
        showToast('Could not reach the server. Try again in a moment.', 'error');
      });
  });
})();
</script>
</body>
</html>
