<!--
  Race Club -- league.html  (added 2026-09-18, reworked 2026-09-19)

  Public ESPN-style league hub: a scrolling results/standings ticker under
  the shared site header, a season hero band (season number + name,
  "League Hub" title, and two stat strips built from real data -- This
  Season and League Format), then Recent Results + League News side by
  side, then Leaderboard, Points, Calendar, and Drivers each full width.
  Public, no login required -- same "usable with no token at all"
  convention as index.html and its getGridTeaser call (see js/league.js ->
  getLeagueHub, Website.gs).

  Header: loaded and mounted exactly like every other page on the site
  (js/header.js's shared #rc-header div + renderHeader() call) -- it reads
  getToken() itself to decide REGISTER/LOGIN vs. the account menu, no
  page-specific logic needed here. The header itself stays the site's
  standard light theme; only the content below it (css/league.css) goes
  dark -- see that file's header comment for the full design rationale.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Hub -- Race Club</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/league.css">
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
</head>
<body class="rc-league-page">

<div id="rc-header"></div>
<script>renderHeader();</script>

<div class="rcl-ticker-wrap">
  <div class="rcl-ticker-label">Highlights</div>
  <div class="rcl-ticker-viewport">
    <div class="rcl-ticker-track" id="rcl-ticker-track"></div>
  </div>
</div>

<section class="rcl-hero">
  <div class="rcl-hero-inner">
    <!-- Eyebrow is static "Race Club" now (2026-09-19) -- the season
         number moved down to its own line between the title and the
         season-context details, filled in by _rclRenderHero. Season NAME
         (added 2026-09-19) sits right after the number on that same line. -->
    <div class="rcl-hero-eyebrow">Race Club</div>
    <h1 class="rcl-hero-title">League Hub</h1>
    <div class="rcl-hero-season" id="rcl-hero-season"></div>
    <!-- Season snapshot + League Format stat strips (added 2026-09-19,
         replacing the old single pipe-separated sentence -- Matt's call:
         "find a better way to display this... boring to look at"). Both
         built by _rclRenderHero/_rclRenderHeroStats in js/league.js;
         rcl-hero-sub is the plain-text fallback for "no season" only. -->
    <div class="rcl-hero-sub" id="rcl-hero-sub"></div>
    <div class="rcl-hero-stats-group" id="rcl-hero-snapshot-group" style="display:none;">
      <div class="rcl-hero-stats-row" id="rcl-hero-snapshot"></div>
    </div>
    <div class="rcl-hero-stats-group" id="rcl-hero-format-group" style="display:none;">
      <div class="rcl-hero-stats-row" id="rcl-hero-format"></div>
    </div>
  </div>
</section>

<main class="rcl-main">
  <div class="rcl-grid">

    <div class="rcl-col">
      <section class="rcl-panel">
        <div class="rcl-panel-head">
          <div class="rcl-panel-title">Recent Results</div>
        </div>
        <div class="rcl-panel-body" id="rcl-results-body"></div>
      </section>
    </div>

    <div class="rcl-col">
      <section class="rcl-panel">
        <div class="rcl-panel-head">
          <div class="rcl-panel-title">League News</div>
        </div>
        <div class="rcl-panel-body" id="rcl-news-body"></div>
      </section>
    </div>

  </div>

  <div class="rcl-row-full">
    <section class="rcl-panel">
      <div class="rcl-panel-head">
        <div class="rcl-panel-title">Leaderboard</div>
      </div>
      <div class="rcl-panel-body" id="rcl-standings-body"></div>
    </section>
  </div>

  <!-- POINTS -- race-length-tier points tables + bonus points, between
       LEADERBOARD and CALENDAR (added 2026-09-19, Matt's ask). -->
  <div class="rcl-row-full">
    <section class="rcl-panel">
      <div class="rcl-panel-head">
        <div class="rcl-panel-title">Points Tables</div>
      </div>
      <div class="rcl-panel-body" id="rcl-points-body"></div>
    </section>
  </div>

  <div class="rcl-row-full">
    <section class="rcl-panel">
      <div class="rcl-panel-head">
        <div class="rcl-panel-title">Calendar</div>
      </div>
      <div class="rcl-panel-body" id="rcl-calendar-body"></div>
    </section>
  </div>

  <div class="rcl-row-full">
    <section class="rcl-panel">
      <div class="rcl-panel-head">
        <div class="rcl-panel-title">Drivers</div>
      </div>
      <div class="rcl-panel-body" id="rcl-drivers-body"></div>
    </section>
  </div>
</main>

<!-- Site footer -- on every page. -->
<footer class="rc-site-footer">
  Copyright Race Club 2026. All rights reserved. Created and developed with the help of Claude AI.
</footer>

<script src="js/league.js"></script>
</body>
</html>
