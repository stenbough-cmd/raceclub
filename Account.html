  // LEAGUE NEWS -- backs league.html's public news/narrative feed and
  // lives directly on the League Tools page now, not in a Data Management
  // popup (moved 2026-09-18, Matt's call). buildLeagueNewsPanel is the
  // panel itself (header + New Post button + chronological list);
  // openNewsPostModal/openEditNewsPostModal are the two popups. Flat list,
  // newest first, no grouping -- there's no natural category to group
  // posts by the way Tracks/Cars have.
  var RC_NEWS_EDIT_REASONS = [
    'Fixed a typo or wording',
    'Corrected a fact or figure',
    'Added new details',
    'Other'
  ];
  // Hero image upload was pulled back out (2026-09-18, Matt's call) --
  // see the matching note above handleAdminCreateNews in Website.gs for
  // why. May return later behind a narrower Drive scope.

  var RC_NEWS_BODY_MAX_CHARS = 2500;

  // Formatting toolbar (added 2026-09-19) -- inserts plain-text markers
  // around the textarea's current selection: **bold**, *italic*,
  // ++underline++, and "> " line-quote. No rich-text editor here on
  // purpose -- the Body column stays a plain string, and js/league.js's
  // public feed is what turns these specific markers into real <strong>/
  // <em>/<u>/<blockquote> tags at render time (see its
  // _rclApplyInlineMarkup/_rclRenderStoryBodyBlocks). Wrapping/prefixing
  // by hand (not execCommand, which is for contenteditable, not a plain
  // textarea) so this works identically in every browser.
  function _rcWrapTextareaSelection(textarea, before, after) {
    var start = textarea.selectionStart;
    var end = textarea.selectionEnd;
    var value = textarea.value;
    var selected = value.slice(start, end);
    textarea.value = value.slice(0, start) + before + selected + after + value.slice(end);
    var newStart = start + before.length;
    textarea.focus();
    textarea.setSelectionRange(newStart, newStart + selected.length);
    textarea.dispatchEvent(new Event('input'));
  }
  function _rcPrefixTextareaLines(textarea, prefix) {
    var start = textarea.selectionStart;
    var end = textarea.selectionEnd;
    var value = textarea.value;
    var lineStart = value.lastIndexOf('\n', start - 1) + 1;
    var lineEnd = value.indexOf('\n', end);
    if (lineEnd === -1) lineEnd = value.length;
    var block = value.slice(lineStart, lineEnd);
    var newBlock = block.split('\n').map(function (line) { return prefix + line; }).join('\n');
    textarea.value = value.slice(0, lineStart) + newBlock + value.slice(lineEnd);
    textarea.focus();
    textarea.setSelectionRange(lineStart, lineStart + newBlock.length);
    textarea.dispatchEvent(new Event('input'));
  }
  function _rcBuildNewsFormattingToolbar(textarea) {
    var bar = el('div', 'display:flex;gap:6px;margin-bottom:6px;');
    function toolBtn(label, title, onClick) {
      var btn = el('button', 'rc-btn-secondary rc-btn-sm', label);
      btn.type = 'button';
      btn.title = title;
      btn.addEventListener('click', function (evt) { evt.preventDefault(); onClick(); });
      bar.appendChild(btn);
      return btn;
    }
    toolBtn('B', 'Bold', function () { _rcWrapTextareaSelection(textarea, '**', '**'); }).style.fontWeight = '800';
    toolBtn('I', 'Italic', function () { _rcWrapTextareaSelection(textarea, '*', '*'); }).style.fontStyle = 'italic';
    toolBtn('U', 'Underline', function () { _rcWrapTextareaSelection(textarea, '++', '++'); }).style.textDecoration = 'underline';
    toolBtn('"', 'Quote', function () { _rcPrefixTextareaLines(textarea, '> '); });
    return bar;
  }
  // Character counter + hard cap -- textarea.maxLength stops typing/most
  // pastes at the limit; this just keeps the "X / 2500" label current.
  function _rcAttachNewsCharCounter(textarea) {
    textarea.maxLength = RC_NEWS_BODY_MAX_CHARS;
    var counter = el('div', 'rc-hint', textarea.value.length + ' / ' + RC_NEWS_BODY_MAX_CHARS);
    textarea.addEventListener('input', function () {
      counter.textContent = textarea.value.length + ' / ' + RC_NEWS_BODY_MAX_CHARS;
    });
    return counter;
  }

  function buildLeagueNewsPanel(newsRows, token, reload) {
    var panel = el('div', 'rc-panel rc-dash-card');
    var headerRow = el('div', 'rc-dash-card-header-row');
    headerRow.appendChild(el('h3', 'rc-dash-card-header-title', 'League News'));
    var newPostBtn = el('button', 'rc-btn-primary rc-btn-sm', 'New Post');
    newPostBtn.type = 'button';
    newPostBtn.addEventListener('click', function () { openNewsPostModal(token, reload); });
    headerRow.appendChild(newPostBtn);
    panel.appendChild(headerRow);

    // Faint divider between the New Post button and the post history --
    // just a plain silver hairline, not a new named rule (Matt: "seperated
    // by a faint gray line").
    panel.appendChild(el('hr', 'border:none;border-top:1px solid var(--rc-silver);margin:0 0 12px;'));

    var sorted = (newsRows || []).slice().sort(function (a, b) {
      return String(b.PublishedAt).localeCompare(String(a.PublishedAt));
    });
    if (!sorted.length) {
      panel.appendChild(el('div', 'rc-dm-empty', 'No news posts yet.'));
      return panel;
    }
    sorted.forEach(function (n) {
      var isActive = _rcRowActive(n);
      var row = el('div', 'rc-dm-row');
      var textCol = el('div', null);
      var titleLine = el('div', 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;');
      titleLine.appendChild(el('span', 'rc-dm-row-label', escapeHtml(n.Title || '(untitled)')));
      if (!isActive) {
        titleLine.appendChild(el('span', 'rc-dm-status-pill rc-dm-status-pill-inactive', 'INACTIVE'));
      }
      textCol.appendChild(titleLine);
      var metaParts = [];
      if (n.AuthorName) metaParts.push('By ' + n.AuthorName);
      var dateLabel = n.PublishedAt ? formatDateLabel(String(n.PublishedAt).slice(0, 10)) : '';
      if (dateLabel) metaParts.push(dateLabel);
      textCol.appendChild(el('div', 'rc-hint', escapeHtml(metaParts.join(' · ') || 'No date')));
      row.appendChild(textCol);
      var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
      editBtn.type = 'button';
      editBtn.addEventListener('click', function () { openEditNewsPostModal(n, token, reload); });
      row.appendChild(editBtn);
      panel.appendChild(row);
    });
    return panel;
  }

  function openNewsPostModal(token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Title'));
    var title = el('input'); title.type = 'text'; title.required = true;
    form.appendChild(title);

    form.appendChild(el('label', null, 'Post'));
    var post = document.createElement('textarea');
    post.rows = 8;
    post.required = true;
    form.appendChild(_rcBuildNewsFormattingToolbar(post));
    form.appendChild(post);
    form.appendChild(_rcAttachNewsCharCounter(post));
    form.appendChild(el('div', 'rc-hint', 'Shows on the public League Hub (league.html). Leave a blank line between paragraphs.'));

    // Post Now vs. Schedule -- radio pair, the datetime field only shows
    // (and is only required) once Schedule is picked.
    var scheduleWrap = el('div', 'margin-top:16px;');
    scheduleWrap.appendChild(el('label', 'margin-top:0;', 'When should this post go live?'));
    var radioRow = el('div', 'display:flex;gap:16px;align-items:center;flex-wrap:wrap;');
    var radioNowLabel = el('label', 'display:flex;gap:6px;align-items:center;font-weight:normal;');
    var radioNow = el('input'); radioNow.type = 'radio'; radioNow.name = 'rc-news-when'; radioNow.value = 'now'; radioNow.checked = true;
    radioNowLabel.appendChild(radioNow);
    radioNowLabel.appendChild(document.createTextNode('Post right away'));
    var radioLaterLabel = el('label', 'display:flex;gap:6px;align-items:center;font-weight:normal;');
    var radioLater = el('input'); radioLater.type = 'radio'; radioLater.name = 'rc-news-when'; radioLater.value = 'later';
    radioLaterLabel.appendChild(radioLater);
    radioLaterLabel.appendChild(document.createTextNode('Schedule for later'));
    radioRow.appendChild(radioNowLabel);
    radioRow.appendChild(radioLaterLabel);
    scheduleWrap.appendChild(radioRow);
    var scheduleWhen = el('input'); scheduleWhen.type = 'datetime-local'; scheduleWhen.style.marginTop = '8px'; scheduleWhen.style.display = 'none';
    scheduleWrap.appendChild(scheduleWhen);
    form.appendChild(scheduleWrap);

    radioNow.addEventListener('change', function () { scheduleWhen.style.display = 'none'; });
    radioLater.addEventListener('change', function () { scheduleWhen.style.display = ''; });

    var saveBtn = el('button', null, 'Publish Post');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    // Wide (2026-09-19, Matt's call: "a bit wider... same height so I can
    // see more of the text box without having to resize right off the
    // bat") -- .rc-modal-wide only changes max-width, so the textarea's
    // rows="8" height is untouched, just more of each line is visible.
    var modalHandle = showModal('New League News Post', { bodyEl: body, wide: true });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!title.value.trim() || !post.value.trim()) {
        showToast('Title and post text are required.', 'error');
        return;
      }
      var publishedAtIso = null;
      if (radioLater.checked) {
        if (!scheduleWhen.value) {
          showToast('Pick a date and time to schedule this post, or choose "Post right away."', 'error');
          return;
        }
        var scheduledDate = new Date(scheduleWhen.value);
        if (isNaN(scheduledDate.getTime())) {
          showToast('That scheduled date and time is not valid.', 'error');
          return;
        }
        publishedAtIso = scheduledDate.toISOString();
      }

      // Deliberately NOT the site's usual "close now, save in the
      // background" pattern (Matt's explicit call for this popup, 2026-
      // 09-19): the button goes gray and reads "Saving..." (free from
      // .rc-btn-primary:disabled's existing style, no new CSS needed)
      // and the popup stays open until the save actually finishes, THEN
      // it closes and League Tools flips to its own "Loading league
      // tools..." refetch -- see renderLeagueManagementSection, which is
      // exactly what `reload` here points at.
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      var reqBody = { title: title.value.trim(), body: post.value.trim() };
      if (publishedAtIso) reqBody.publishedAt = publishedAtIso;

      fetchApi('adminCreateNews', { method: 'POST', token: token, body: reqBody })
        .then(function (data) {
          if (!data.success) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Publish Post';
            showToast(data.message || 'Could not publish this post -- try again.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();
          modalHandle.close();
        })
        .catch(function (err) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Publish Post';
          showToast((err && err.message) || 'Could not reach the server -- post not published.', 'error');
        });
    });
  }

  function openEditNewsPostModal(newsRow, token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Title'));
    var title = el('input'); title.type = 'text'; title.value = newsRow.Title || '';
    form.appendChild(title);

    form.appendChild(el('label', null, 'Post'));
    var post = document.createElement('textarea');
    post.rows = 8;
    post.value = newsRow.Body || '';
    form.appendChild(_rcBuildNewsFormattingToolbar(post));
    form.appendChild(post);
    form.appendChild(_rcAttachNewsCharCounter(post));
    form.appendChild(el('div', 'rc-hint', 'Shows on the public League Hub (league.html). Leave a blank line between paragraphs.'));

    // Required reason-for-edit dropdown -- the date/time on the post never
    // changes (Matt: "the date and time remain the same"); this note is
    // what shows, italicized, at the bottom of the public story instead.
    form.appendChild(el('label', null, 'Reason for This Edit'));
    var reasonSelect = document.createElement('select');
    reasonSelect.appendChild(el('option', null, 'Select a reason…'));
    RC_NEWS_EDIT_REASONS.forEach(function (reasonText) {
      var opt = el('option', null, escapeHtml(reasonText));
      opt.value = reasonText;
      reasonSelect.appendChild(opt);
    });
    reasonSelect.value = '';
    form.appendChild(reasonSelect);
    var reasonOther = el('input'); reasonOther.type = 'text'; reasonOther.placeholder = 'Describe the change';
    reasonOther.style.marginTop = '8px'; reasonOther.style.display = 'none';
    form.appendChild(reasonOther);
    reasonSelect.addEventListener('change', function () {
      reasonOther.style.display = reasonSelect.value === 'Other' ? '' : 'none';
    });
    form.appendChild(el('div', 'rc-hint', 'Shown italicized at the bottom of the story on the public League Hub.'));

    var saveBtn = el('button', null, 'Save Changes');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var isActive = _rcRowActive(newsRow);
    var statusWrap = el('div', 'padding-top:16px;margin-top:16px;border-top:1px solid var(--rc-silver);');
    var toggleBtn = el('button', 'rc-btn-primary rc-btn-sm', isActive ? 'Withdraw This Post' : 'Republish This Post');
    toggleBtn.type = 'button';
    statusWrap.appendChild(toggleBtn);
    body.appendChild(statusWrap);

    // Wide, same reasoning as the New Post popup above.
    var modalHandle = showModal('Edit League News Post', { bodyEl: body, wide: true });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!title.value.trim() || !post.value.trim()) {
        showToast('Title and post text are required.', 'error');
        return;
      }
      var editNote = reasonSelect.value === 'Other' ? reasonOther.value.trim() : reasonSelect.value;
      if (!reasonSelect.value || (reasonSelect.value === 'Other' && !editNote)) {
        showToast('Pick (or describe) a reason for this edit before saving.', 'error');
        return;
      }

      // Same "stay open, go gray, say Saving..." flow as New Post -- see
      // that popup's submit handler for the full explanation.
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      var reqBody = { newsId: newsRow.NewsID, title: title.value.trim(), body: post.value.trim(), editNote: editNote };

      fetchApi('adminUpdateNews', { method: 'POST', token: token, body: reqBody })
        .then(function (data) {
          if (!data.success) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Changes';
            showToast(data.message || 'Could not save changes -- try again.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();
          modalHandle.close();
        })
        .catch(function (err) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          showToast((err && err.message) || 'Could not reach the server -- changes not saved.', 'error');
        });
    });

    toggleBtn.addEventListener('click', function () {
      if (!isActive) {
        // Republishing needs no extra confirmation -- only withdrawing is
        // destructive enough to double-check, same asymmetry the Car/
        // Track deactivate toggles use.
        doToggleNewsActive_();
        return;
      }
      openConfirmModal(
        'Withdraw Post',
        'Withdraw "' + (newsRow.Title || 'this post') + '" from the public League Hub? It stays saved here and can be republished later.',
        'Withdraw This Post',
        doToggleNewsActive_
      );
    });

    function doToggleNewsActive_() {
      modalHandle.close();
      fetchApi('adminSetNewsActive', {
        method: 'POST', token: token,
        body: { newsId: newsRow.NewsID, active: isActive ? 'Inactive' : 'Active' }
      })
        .then(function (data) {
          if (!data.success) {
            showToast(data.message || 'Could not update this post.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();
        })
        .catch(function () {
          showToast('Could not reach the server -- post not updated.', 'error');
        });
    }
  }
