      section.appendChild(el('p', 'rc-sponsors-explainer',
        'Everything money-related in your account lives here -- your running balance, every bonus and penalty that has hit your ledger, what your current sponsors could still pay out or cost you, and your car\'s own Season Objective payout.'));

      section.appendChild(buildFinHeroPanel(finances));

      section.appendChild(buildLoanPanel(loanStatus, token));

      section.appendChild(buildSeasonOutlookPanel(objective, activeSeason, sponsors));

      section.appendChild(buildLedgerPanel((ledger && ledger.success) ? ledger.entries : []));
    });
  }

  // ---------------------------------------------------------------------
  // WAGER PAGE (2026-09-02, Matt's full spec, reordered 2026-09-02:
  // Current Wagers (top, portrait flip-cards + dashed open slots), Place
  // a Wager (middle), Wager History (bottom) -- styled to match the rest
  // of the site (wizField/wizSelect/wizNumberInput, the same
  // .rc-panel/.rc-dash-card shell every other real section already
  // uses). See Wagers.gs for the backend this renders.
  // ---------------------------------------------------------------------
  function renderWagerSection(token) {
    var section = document.getElementById('rc-section-wager');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(buildPageSpinner('Loading your wagers...'));

    // quietRefresh -- re-fetches both endpoints and swaps both remaining
    // containers' CONTENT in place, with no spinner and no section wipe
    // (2026-09-02, Matt's call: "no loading, let it load in the
    // background... I want it to feel instant"). This is what every
    // wager action (propose/accept/deny/counter) triggers AFTER already
    // patching the DOM optimistically itself -- see buildWagerProposeFormBody
    // and buildWagerFlipCard below -- so by the time this actually
    // resolves, the page already shows the right thing and this call just
    // quietly reconciles it against the server's real numbers (accurate
    // opponent stats, updated caps, a driver dropped from the Opponent
    // list once they're no longer available, etc.). Guarded per-card
    // (`if (x && x.parentNode)`) so a background refresh that lands after
    // the driver has already navigated away from this page is a silent
    // no-op instead of an error. Place a Wager is no longer one of these
    // containers (2026-09-03, Matt's call: it lives in a popup now,
    // opened from an empty Current Wagers slot -- see buildWagerOpenSlot/
    // openWagerProposeModal) -- formOptions is still fetched here on
    // every refresh since Current Wagers' own open slots need a current
    // copy of it to hand to that popup.
    var limboCard, historyCard;
    function quietRefresh() {
      Promise.all([
        fetchApi('getWagerFormOptions', { token: token }).catch(function () { return { success: false }; }),
        fetchApi('getMyWagers', { token: token }).catch(function () { return { success: false }; })
      ]).then(function (results) {
        var formOptions = results[0], wagers = results[1];
        var newLimbo = buildWagerLimboPanel(wagers, formOptions, token, quietRefresh);
        var newHistory = buildWagerHistoryPanel(wagers);
        if (limboCard && limboCard.parentNode) limboCard.parentNode.replaceChild(newLimbo, limboCard);
        limboCard = newLimbo;
        if (historyCard && historyCard.parentNode) historyCard.parentNode.replaceChild(newHistory, historyCard);
        historyCard = newHistory;
      });
      // Also quietly refreshes the Dashboard's own Wager preview card
      // (2026-09-03, Matt's bug report -- see rcDashboardWagerCard above)
      // so it's already current by the time the driver flips back over to
      // Dashboard, instead of showing whatever was there at page load.
      if (rcDashboardWagerCard && rcDashboardWagerCard.rcRefresh) rcDashboardWagerCard.rcRefresh();
    }

    Promise.all([
      fetchApi('getWagerFormOptions', { token: token }).catch(function () { return { success: false }; }),
      fetchApi('getMyWagers', { token: token }).catch(function () { return { success: false }; })
    ]).then(function (results) {
      var formOptions = results[0], wagers = results[1];

      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Wager'));
      section.appendChild(el('p', 'rc-sponsors-explainer',
        'Challenge another driver in your season to a head-to-head wager on an upcoming race. Click an empty slot below to place one. Once they accept, both stakes are frozen until the race results come in -- settlement is automatic.'));

      limboCard = buildWagerLimboPanel(wagers, formOptions, token, quietRefresh);
      historyCard = buildWagerHistoryPanel(wagers);
      section.appendChild(limboCard);
      section.appendChild(historyCard);
    });
  }

  // Place a Wager -- lives in a popup now, opened by clicking an empty
  // Current Wagers slot (2026-09-03, Matt's call: "when clicking a slot to
  // place a wager, a popup comes up... instead of a container on the main
  // page"). This builds just the modal's BODY (no card wrapper, no own
  // title -- showModal already renders "Place a Wager" as the popup's
  // header) -- see openWagerProposeModal right below, which wraps this in
  // showModal(), and buildWagerOpenSlot further down, which is what
  // actually triggers it.
  //
  // onPlaced fires the instant the optimistic card is dropped into the
  // grid (2026-09-03, Matt's follow-up: "still keep it instant when the
  // button is pressed and the popup closes and the card appears
  // instantly") -- openWagerProposeModal wires it to close the popup,
  // so pressing Place Wager closes the popup and shows the card in the
  // same beat, with the actual proposeWager write still happening
  // entirely in the background afterward (see the instant-placement
  // comment further down, unchanged from before this became a modal).
  function buildWagerProposeFormBody(formOptions, token, onQuietRefresh, onPlaced) {
    var wrap = el('div');

    if (!formOptions || !formOptions.success) {
      wrap.appendChild(el('p', 'rc-cs-empty', 'Could not load the wager form right now.'));
      return wrap;
    }
    if (!formOptions.hasSeat) {
      wrap.appendChild(el('p', 'rc-cs-empty', 'You need to be registered for a season to place a wager.'));
      return wrap;
    }
    if (!formOptions.opponents.length) {
      wrap.appendChild(el('p', 'rc-cs-empty', 'No other drivers are registered for your season yet.'));
      return wrap;
    }
    if (!formOptions.rounds.length) {
      wrap.appendChild(el('p', 'rc-cs-empty', 'No upcoming races on your season\'s calendar to wager on.'));
      return wrap;
    }
    if (formOptions.atCap) {
      wrap.appendChild(el('p', 'rc-cs-empty', 'You already have 3 active wagers -- resolve one before placing another.'));
      return wrap;
    }

    var form = el('form');

    var oppSelect = document.createElement('select');
    formOptions.opponents.forEach(function (o) {
      var opt = document.createElement('option');
      opt.value = o.profileId;
      opt.textContent = o.displayName + (o.activeCount >= 3 ? ' (at wager cap)' : '');
      opt.disabled = o.activeCount >= 3;
      oppSelect.appendChild(opt);
    });

    var roundSelect = document.createElement('select');
    formOptions.rounds.forEach(function (r) {
      var opt = document.createElement('option');
      opt.value = r.roundId;
      opt.textContent = r.label;
      roundSelect.appendChild(opt);
    });

    var conditionSelect = document.createElement('select');
    formOptions.conditions.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.key;
      opt.textContent = c.label;
      conditionSelect.appendChild(opt);
    });
    var conditionHint = el('div', 'rc-hint', (formOptions.conditions[0] || {}).description || '');
    conditionSelect.addEventListener('change', function () {
      var cd = formOptions.conditions.filter(function (c) { return c.key === conditionSelect.value; })[0];
      conditionHint.textContent = cd ? cd.description : '';
    });

    // Stake stepper -- steps by 100 up to whichever cap is lower right now
    // (this driver's own Wager Stake Cap %, or the chosen opponent's),
    // defaulting to half that cap the moment an opponent is picked
    // (Matt's spec). Recomputed on every opponent change, since each
    // driver's own cap can differ.
    var stakeInput = wizNumberInput(0, function () {}, { min: 0, step: 100 });
    var stakeHint = el('div', 'rc-hint', '');
    function currentCap() {
      var opp = formOptions.opponents.filter(function (o) { return o.profileId === oppSelect.value; })[0];
      if (!opp) return 0;
      return Math.min(formOptions.myMaxStake, opp.maxStake);
    }
    function refreshStakeForOpponent() {
      var cap = currentCap();
      stakeInput.max = cap;
      stakeInput.value = cap > 0 ? Math.floor((cap / 2) / 100) * 100 : 0;
      stakeHint.textContent = 'Max right now: ' + formatMoney(cap) + '.';
    }
    oppSelect.addEventListener('change', refreshStakeForOpponent);
    refreshStakeForOpponent();
    // Clamp to the cap even when the cap itself isn't a multiple of 100
    // (2026-09-02, Matt's call: "the stake goes by 100 but when it gets
    // to the end, allow it to be the max number should it be somewhere
    // in between 100") -- stepping up from e.g. $4,500 toward a $4,550
    // cap would otherwise overshoot to $4,600 and get silently rejected
    // by the server; this snaps that overshoot straight to the real cap
    // instead, so the very last step always lands exactly on the max.
    stakeInput.addEventListener('input', function () {
      var cap = currentCap();
      var v = Number(stakeInput.value);
      if (!isNaN(v) && cap > 0 && v > cap) stakeInput.value = cap;
    });

    var condWrap = el('div', 'rc-wiz-field');
    condWrap.appendChild(wizLabel('Condition'));
    condWrap.appendChild(conditionSelect);
    condWrap.appendChild(conditionHint);

    var stakeWrap = el('div', 'rc-wiz-field');
    stakeWrap.appendChild(wizLabel('Stake'));
    stakeWrap.appendChild(stakeInput);
    stakeWrap.appendChild(stakeHint);

    // Four stacked rows, each field full width (2026-09-03, Matt's latest
    // spec) -- was Opponent full + Race/Condition/Stake each at half
    // width before this. Still the same 4-column .rc-wiz-field-row grid
    // per row, each field wrapper just claiming the whole span now.
    var oppWrap = el('div', 'rc-wiz-field');
    oppWrap.style.gridColumn = 'span 4';
    oppWrap.appendChild(wizLabel('Opponent'));
    oppWrap.appendChild(oppSelect);
    var oppRow = el('div', 'rc-wiz-field-row');
    oppRow.appendChild(oppWrap);

    var raceWrap = el('div', 'rc-wiz-field');
    raceWrap.style.gridColumn = 'span 4';
    raceWrap.appendChild(wizLabel('Race'));
    raceWrap.appendChild(roundSelect);
    var raceRow = el('div', 'rc-wiz-field-row');
    raceRow.appendChild(raceWrap);

    condWrap.style.gridColumn = 'span 4';
    var condRow = el('div', 'rc-wiz-field-row');
    condRow.appendChild(condWrap);

    stakeWrap.style.gridColumn = 'span 4';
    var stakeRow = el('div', 'rc-wiz-field-row');
    stakeRow.appendChild(stakeWrap);

    form.appendChild(oppRow);
    form.appendChild(raceRow);
    form.appendChild(condRow);
    form.appendChild(stakeRow);

    var submitBtn = el('button', 'rc-btn-primary', 'Place Wager');
    submitBtn.type = 'submit';
    submitBtn.style.marginTop = '16px';
    form.appendChild(submitBtn);

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      var stake = Number(stakeInput.value);
      if (!oppSelect.value || !roundSelect.value || !conditionSelect.value) {
        showToast('Please fill out every field.', 'error');
        return;
      }
      if (!(stake > 0)) {
        showToast('Enter a stake greater than $0.', 'error');
        return;
      }
      var chosenOpponent = formOptions.opponents.filter(function (o) { return o.profileId === oppSelect.value; })[0];
      var chosenRound = formOptions.rounds.filter(function (r) { return r.roundId === roundSelect.value; })[0];
      var chosenCondition = formOptions.conditions.filter(function (c) { return c.key === conditionSelect.value; })[0];

      // Instant, no wait on the server AT ALL (2026-09-03, Matt's call:
      // "the card should instantly appear... all the saving happens
      // silently on the backend... the user should not have to wait for
      // the sheet to save or the script to run" -- his stated standing
      // rule for how the whole site should behave, not just this form).
      // The card is built and dropped into the grid synchronously, before
      // proposeWager is even called -- wagerId starts blank since the
      // server hasn't assigned one yet (buildWagerFlipCard only shows the
      // Cancel button once a card has a real wagerId, so there's nothing
      // clickable here that would need one before it exists). The
      // opponent's career stats aren't known client-side either, so the
      // back face shows 0s until the quiet background refresh below fills
      // in the real numbers.
      var optimisticWager = {
        wagerId: '',
        seasonId: formOptions.seasonId, seasonName: '',
        roundId: roundSelect.value, roundLabel: chosenRound ? chosenRound.label : '',
        condition: conditionSelect.value, conditionLabel: chosenCondition ? chosenCondition.label : conditionSelect.value,
        stake: stake, status: 'Pending', isProposedByMe: true, awaitingMe: false,
        opponentProfileId: oppSelect.value,
        opponentDisplayName: chosenOpponent ? chosenOpponent.displayName : '',
        opponentAvatarFilename: chosenOpponent ? chosenOpponent.avatarFilename : '',
        opponentCarClass: chosenOpponent ? chosenOpponent.carClass : '',
        opponentWagerRecord: { wins: 0, losses: 0 }, opponentCareerRaces: 0,
        winnerProfileId: '', iWon: false,
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), settledAt: ''
      };
      var grid = document.getElementById('rc-wager-current-grid');
      var openSlot = grid ? grid.querySelector('.rc-wager-card-open') : null;
      var placedCard = null;
      if (grid && openSlot) {
        placedCard = buildWagerFlipCard(optimisticWager, token, formOptions.conditions, onQuietRefresh, formOptions);
        grid.replaceChild(placedCard, openSlot);
      }

      // Popup closes the instant the card is in the grid -- nothing here
      // waits on the network either (see onPlaced's own doc comment
      // above).
      if (onPlaced) onPlaced();

      // The actual write fires now, entirely in the background -- nothing
      // above waited on it, and nothing below blocks the UI either. A
      // success just quietly reconciles (fills in the real wagerId and
      // everything the client couldn't have known); a failure pulls the
      // optimistic card back out and says why, since the wager was never
      // actually placed.
      fetchApi('proposeWager', {
        method: 'POST', token: token,
        body: { opponentProfileId: oppSelect.value, roundId: roundSelect.value, condition: conditionSelect.value, stake: stake }
      })
        .then(function (data) {
          if (!data.success) {
            if (placedCard && placedCard.parentNode) placedCard.parentNode.replaceChild(buildWagerOpenSlot(token, onQuietRefresh, formOptions), placedCard);
            showToast(data.message || 'Could not place that wager.', 'error');
            return;
          }
          if (onQuietRefresh) onQuietRefresh();
        })
        .catch(function () {
          if (placedCard && placedCard.parentNode) placedCard.parentNode.replaceChild(buildWagerOpenSlot(token, onQuietRefresh, formOptions), placedCard);
          showToast('Could not reach the server -- that wager was not placed.', 'error');
        });
    });

    wrap.appendChild(form);
    return wrap;
  }

  // Opens Place a Wager as a popup (2026-09-03, Matt's call) -- showModal
  // renders the "Place a Wager" title itself, buildWagerProposeFormBody
  // supplies just the form. `modal` is referenced inside the onPlaced
  // callback before it's assigned below, which is safe: that callback
  // only ever runs later, on submit, well after this function has
  // returned and `modal` is set (var hoisting + closures, same pattern
  // used throughout this file).
  function openWagerProposeModal(formOptions, token, onQuietRefresh) {
    var modal;
    var body = buildWagerProposeFormBody(formOptions, token, onQuietRefresh, function () { if (modal) modal.close(); });
    modal = showModal('Place a Wager', { bodyEl: body });
    return modal;
  }

  // Every driver can hold at most 3 active wagers at once (the site-wide
  // cap Wagers.gs itself enforces) -- Current Wagers below always shows
  // exactly this many slots, real flip-cards first, then dashed "Place a
  // Wager" open slots filling out the rest, same "here's your whole
  // roster of slots, filled or not" treatment the Sponsors page's own
  // pick chips already use (.rc-pick-chip-open).
  var RC_WAGER_SLOT_COUNT = 3;

  // ---- Top container: Current Wagers (portrait flip-cards + open slots) ----
  function buildWagerLimboPanel(wagers, formOptions, token, onQuietRefresh) {
    var card = el('div', 'rc-panel rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Current Wagers'));

    if (!wagers || !wagers.success) {
      card.appendChild(el('p', 'rc-cs-empty', 'Could not load your wagers right now.'));
      return card;
    }

    var conditions = (formOptions && formOptions.success) ? formOptions.conditions : WAGER_CONDITIONS_FALLBACK_;
    // Stable id -- every rebuild (initial load, quietRefresh) creates a
    // fresh grid under this same id, so an optimistic action elsewhere
    // (buildWagerProposeFormBody's submit handler) can always find "the
    // current grid on screen right now" via document.getElementById
    // rather than needing its own stale closure reference to it.
    var grid = el('div', 'rc-wager-card-grid');
    grid.id = 'rc-wager-current-grid';
    wagers.active.forEach(function (w) {
      grid.appendChild(buildWagerFlipCard(w, token, conditions, onQuietRefresh, formOptions));
    });
    for (var i = wagers.active.length; i < RC_WAGER_SLOT_COUNT; i++) {
      grid.appendChild(buildWagerOpenSlot(token, onQuietRefresh, formOptions));
    }
    card.appendChild(grid);
    return card;
  }

  // Dashed placeholder slot -- an unfilled wager card, same size/shape as
  // a real one so the grid reads as "your 3 wager slots," filled or not.
  // Clicking it opens the Place a Wager popup (2026-09-03, Matt's call --
  // was a scroll-down-to-an-inline-form before this) via
  // openWagerProposeModal. formOptions is whatever this slot's caller
  // already had on hand (buildWagerLimboPanel's own param, or a
  // Deny/Cancel button's closure elsewhere in this file) -- reused as-is
  // rather than re-fetched, so opening the popup is instant; if it's
  // slightly stale (an opponent stopped being available in the last few
  // seconds, say), the server-side check inside proposeWager still catches
  // it, same "client hint, server enforces" pattern as everywhere else on
  // this page.
  function buildWagerOpenSlot(token, onQuietRefresh, formOptions) {
    var slot = el('div', 'rc-wager-card-open');
    slot.appendChild(el('div', 'rc-wager-card-open-label', 'Place a Wager'));
    slot.addEventListener('click', function () {
      openWagerProposeModal(formOptions, token, onQuietRefresh);
    });
    return slot;
  }

  // Client-side mirror of Wagers.gs's WAGER_CONDITIONS, used ONLY as a
  // fallback for the Counter modal's condition dropdown on the rare path
  // where getWagerFormOptions itself failed to load (so there's no live
  // list to reuse) but getMyWagers still came back fine -- keeps Counter
  // usable even then, rather than leaving the dropdown empty. The server
  // is always the source of truth and re-validates whatever key is sent.
  var WAGER_CONDITIONS_FALLBACK_ = [
    { key: 'RaceFinish', label: 'Race Finish' },
    { key: 'Qualifying', label: 'Qualifying' },
    { key: 'FastestLap', label: 'Fastest Lap' },
    { key: 'CleanRace', label: 'Clean Race' }
  ];

  // One portrait "card in the shape of a card" (Matt's own words) -- a
  // 3D CSS flip, front face showing the opponent's avatar/condition/stake/
  // status (plus Accept/Deny/Counter when it's this driver's turn to act),
  // back face showing that opponent's stats. A rounded arrow button on
  // each face flips it.
  function buildWagerFlipCard(w, token, conditions, onQuietRefresh, formOptions) {
    var outer = el('div', 'rc-wager-card');
    // Class-accent, not a flat red (2026-09-03, Matt's ask: "cards should
    // have class-specific color accents not red") -- same palette as
    // every other class badge on the site (CAR_CLASS_BADGE_COLOR_VAR,
    // js/reference-data.js), keyed off the OPPONENT's own car class.
    // Falls back to red (the CSS default on --rc-wager-accent) when the
    // class is unknown -- an opponent with no seat yet, or a stale wager
    // predating this field.
    var accentVar = (w.opponentCarClass && typeof CAR_CLASS_BADGE_COLOR_VAR !== 'undefined' && CAR_CLASS_BADGE_COLOR_VAR[w.opponentCarClass])
      ? CAR_CLASS_BADGE_COLOR_VAR[w.opponentCarClass] : null;
    if (accentVar) outer.style.setProperty('--rc-wager-accent', 'var(' + accentVar + ')');
    var inner = el('div', 'rc-wager-card-inner');
    var front = el('div', 'rc-wager-card-face rc-wager-card-front');
    var back = el('div', 'rc-wager-card-face rc-wager-card-back');

    // Swaps THIS card for a freshly-built one reflecting an optimistic
    // state change (accepted / countered), without waiting on a reload --
    // same "feel instant, reconcile quietly after" pattern the propose
    // popup uses. deny replaces the card with an open slot instead (see
    // denyBtn below).
    function replaceWithUpdatedWager(updates) {
      var updated = {};
      Object.keys(w).forEach(function (k) { updated[k] = w[k]; });
      Object.keys(updates).forEach(function (k) { updated[k] = updates[k]; });
      if (outer.parentNode) outer.parentNode.replaceChild(buildWagerFlipCard(updated, token, conditions, onQuietRefresh, formOptions), outer);
    }

    function flip() { outer.classList.toggle('rc-wager-card-flipped'); }
    function flipArrow() {
      var btn = el('button', 'rc-icon-btn rc-wager-flip-btn', '&#8635;');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Flip card');
      btn.addEventListener('click', flip);
      return btn;
    }

    // Cancel (X in a rounded square, bottom-left corner -- mirrors
    // flipArrow's rounded circle in the bottom-right) -- 2026-09-03,
    // Matt's ask. Only ever rendered while the wager is still Pending:
    // "once a wager is accepted, it can't be cancelled" (both sides'
    // money is already committed by then). Cancelling also removes the
    // notification(s) this wager created (server-side, see
    // handleCancelWager/_rcDeleteNotificationsForWager_) so the bell
    // clears for whoever it was sent to.
    //
    // Instant + quiet background reconcile (2026-09-03, Matt's call: "it
    // should instantly disappear and then remove the offer from the
    // backend silently") -- same optimistic pattern as everywhere else on
    // this page (propose/accept/deny/counter): the card is swapped out
    // for an open slot the moment the X is clicked, with no wait on the
    // server at all, and the actual cancelWager call fires in the
    // background. A failure is rare (the wager would have to have just
    // been accepted or settled out from under this driver in the last
    // instant) but isn't swallowed silently -- onQuietRefresh() re-fetches
    // and repaints the grid with whatever's actually true server-side, and
    // a toast explains why if the optimistic removal didn't stick.
    function cancelBtn() {
      var btn = el('button', 'rc-icon-btn rc-wager-cancel-btn', '&#10005;');
      btn.type = 'button';
      btn.setAttribute('aria-label', 'Cancel wager');
      btn.addEventListener('click', function () {
        if (outer.parentNode) outer.parentNode.replaceChild(buildWagerOpenSlot(token, onQuietRefresh, formOptions), outer);
        fetchApi('cancelWager', { method: 'POST', token: token, body: { wagerId: w.wagerId } })
          .then(function (data) {
            if (!data.success) showToast(data.message || 'Could not cancel that wager -- refreshing.', 'error');
            if (onQuietRefresh) onQuietRefresh();
          })
          .catch(function () {
            showToast('Could not reach the server -- refreshing.', 'error');
            if (onQuietRefresh) onQuietRefresh();
          });
      });
      return btn;
    }

    var avatarWrap = el('div', 'rc-wager-card-avatar-wrap');
    avatarWrap.appendChild(buildAvatarCircle({ displayName: w.opponentDisplayName, avatarFilename: w.opponentAvatarFilename }, 'rc-avatar-circle-lg'));
    front.appendChild(avatarWrap);
    front.appendChild(el('div', 'rc-wager-card-name', escapeHtml(w.opponentDisplayName)));
    front.appendChild(el('div', 'rc-wager-card-condition', escapeHtml(w.conditionLabel)));
    front.appendChild(el('div', 'rc-wager-card-stake', formatMoney(w.stake)));
    var statusLabel = w.status === 'Accepted' ? 'Locked In' : (w.awaitingMe ? 'Offered' : 'Waiting Response');
    front.appendChild(el('div', 'rc-wager-status-pill' + (w.awaitingMe ? ' rc-wager-status-pill-action' : ''), statusLabel));

    if (w.awaitingMe) {
      // Accept + Deny side by side, Counter as its own full-width button
      // below both (2026-09-03, Matt's call: "make one more additional
      // button below these that says COUNTER" -- was a bare text link
      // before this). Card grew taller specifically to fit this two-row
      // shape without feeling cramped -- see .rc-wager-card's height.
      var actions = el('div', 'rc-wager-card-actions');
      var actionsRow = el('div', 'rc-wager-card-actions-row');
      var acceptBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Accept');
      acceptBtn.type = 'button';
      var denyBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Deny');
      denyBtn.type = 'button';
      var counterBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Counter');
      counterBtn.type = 'button';

      acceptBtn.addEventListener('click', function () {
        acceptBtn.disabled = true; denyBtn.disabled = true;
        fetchApi('respondToWager', { method: 'POST', token: token, body: { wagerId: w.wagerId, action: 'accept' } })
          .then(function (data) {
            if (!data.success) {
              acceptBtn.disabled = false; denyBtn.disabled = false;
              showToast(data.message || 'Could not accept that wager.', 'error');
              return;
            }
            showToast('Wager accepted -- stake frozen.', 'success');
            replaceWithUpdatedWager({ status: 'Accepted', awaitingMe: false, acceptedAt: new Date().toISOString() });
            if (onQuietRefresh) onQuietRefresh();
          })
          .catch(function () {
            acceptBtn.disabled = false; denyBtn.disabled = false;
            showToast('Could not reach the server. Try again in a moment.', 'error');
          });
      });
      denyBtn.addEventListener('click', function () {
        acceptBtn.disabled = true; denyBtn.disabled = true;
        fetchApi('respondToWager', { method: 'POST', token: token, body: { wagerId: w.wagerId, action: 'deny' } })
          .then(function (data) {
            if (!data.success) {
              acceptBtn.disabled = false; denyBtn.disabled = false;
              showToast(data.message || 'Could not deny that wager.', 'error');
              return;
            }
            showToast('Wager denied.', 'success');
            if (outer.parentNode) outer.parentNode.replaceChild(buildWagerOpenSlot(token, onQuietRefresh, formOptions), outer);
            if (onQuietRefresh) onQuietRefresh();
          })
          .catch(function () {
            acceptBtn.disabled = false; denyBtn.disabled = false;
            showToast('Could not reach the server. Try again in a moment.', 'error');
          });
      });
      counterBtn.addEventListener('click', function () { openWagerCounterModal(w, token, conditions, onQuietRefresh, replaceWithUpdatedWager); });

      actionsRow.appendChild(acceptBtn);
      actionsRow.appendChild(denyBtn);
      actions.appendChild(actionsRow);
      actions.appendChild(counterBtn);
      front.appendChild(actions);
    } else if (w.status === 'Accepted') {
      // Both sides' stakes are frozen once Accepted (unchanged).
      front.appendChild(el('div', 'rc-hint', 'Money is frozen -- settles automatically after the race.'));
    } else if (w.isProposedByMe) {
      // 2026-09-02, Matt's call: freezing now starts the moment a wager
      // is PROPOSED, not just once it's accepted -- but only the
      // proposer's own stake, since the other driver hasn't agreed to
      // anything yet (see _rcGetFrozenBalance_, Wagers.gs).
      front.appendChild(el('div', 'rc-hint', 'Your stake is frozen while ' + escapeHtml(w.opponentDisplayName) + ' decides.'));
    } else {
      front.appendChild(el('div', 'rc-hint', 'Waiting on ' + escapeHtml(w.opponentDisplayName) + '.'));
    }
    front.appendChild(flipArrow());
    if (w.status === 'Pending' && w.wagerId && !w.awaitingMe) front.appendChild(cancelBtn());

    back.appendChild(el('div', 'rc-wager-card-back-title', escapeHtml(w.opponentDisplayName)));
    back.appendChild(el('div', 'rc-wager-card-stat-row', 'Career Races: ' + (w.opponentCareerRaces || 0)));
    back.appendChild(el('div', 'rc-wager-card-stat-row', 'Career Wager Record: ' + w.opponentWagerRecord.wins + 'W – ' + w.opponentWagerRecord.losses + 'L'));
    back.appendChild(el('div', 'rc-wager-card-stat-row', 'Race: ' + escapeHtml(w.roundLabel)));
    back.appendChild(el('div', 'rc-wager-card-stat-row', 'Condition: ' + escapeHtml(w.conditionLabel)));
    back.appendChild(flipArrow());
    if (w.status === 'Pending' && w.wagerId && !w.awaitingMe) back.appendChild(cancelBtn());

    inner.appendChild(front);
    inner.appendChild(back);
    outer.appendChild(inner);
    return outer;
  }

  // Counter popup -- a compact form (new Stake + new Condition) reusing
  // the same wizField/wizNumberInput primitives as the propose form
  // above, opened from a flip-card's Counter link.
  //
  // Stake is capped at w.counterCap (2026-09-03, Matt's ask: "I should
  // see and have a max that I can counter") -- the live "min of what
  // either side could still afford on this wager right now" figure
  // handleGetMyWagers now computes and sends down with every wager (see
  // Wagers.gs). Same "type past it and it snaps back" clamp the propose
  // form's own stake stepper uses.
  function openWagerCounterModal(w, token, conditions, onQuietRefresh, replaceWithUpdatedWager) {
    var cap = Number(w.counterCap) || 0;
    var body = el('div');
    body.appendChild(el('p', 'rc-hint', 'Send back a different stake and/or condition -- ' + escapeHtml(w.opponentDisplayName) + ' will need to accept, deny, or counter it again.'));

    var stakeInput = wizNumberInput(cap > 0 ? Math.min(w.stake, cap) : w.stake, function () {}, { min: 0, step: 100, max: cap || undefined });
    var conditionSelect = document.createElement('select');
    conditions.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.key;
      opt.textContent = c.label;
      if (c.key === w.condition) opt.selected = true;
      conditionSelect.appendChild(opt);
    });

    body.appendChild(wizField('New Stake', stakeInput, 'Max right now: ' + formatMoney(cap) + '.'));
    stakeInput.addEventListener('input', function () {
      var v = Number(stakeInput.value);
      if (!isNaN(v) && cap > 0 && v > cap) stakeInput.value = cap;
    });
    var condWrap = el('div', 'rc-wiz-field');
    condWrap.appendChild(wizLabel('Condition'));
    condWrap.appendChild(conditionSelect);
    body.appendChild(condWrap);

    var sendBtn = el('button', 'rc-btn-primary', 'Send Counter');
    sendBtn.type = 'button';
    sendBtn.style.marginTop = '16px';
    body.appendChild(sendBtn);

    var modalHandle = showModal('Counter Wager', { bodyEl: body });

    // Instant + quiet background reconcile (2026-09-03, Matt's call: "it
    // should instantly take me back to the card page after hitting the
    // button and then run in the background") -- same optimistic pattern
    // as everywhere else on this page (propose/accept/deny/cancel): the
    // popup closes and the card updates the moment Send Counter is
    // clicked, with no wait on the server, and the actual respondToWager
    // call fires in the background. A failure is rare (the cap could
    // have moved in the last instant) but isn't swallowed silently --
    // onQuietRefresh() re-fetches and repaints the grid with whatever's
    // actually true server-side, and a toast explains why if the
    // optimistic counter didn't stick.
    sendBtn.addEventListener('click', function () {
      var stake = Number(stakeInput.value);
      if (!(stake > 0)) {
        showToast('Enter a stake greater than $0.', 'error');
        return;
      }
      if (cap > 0 && stake > cap) {
        showToast('That stake is more than one of you can afford -- max right now is ' + formatMoney(cap) + '.', 'error');
        return;
      }
      var chosenCondition = conditions.filter(function (c) { return c.key === conditionSelect.value; })[0];
      modalHandle.close();
      replaceWithUpdatedWager({
        stake: stake, condition: conditionSelect.value,
        conditionLabel: chosenCondition ? chosenCondition.label : conditionSelect.value,
        awaitingMe: false, updatedAt: new Date().toISOString()
      });
      fetchApi('respondToWager', {
        method: 'POST', token: token,
        body: { wagerId: w.wagerId, action: 'counter', stake: stake, condition: conditionSelect.value }
      })
        .then(function (data) {
          if (!data.success) showToast(data.message || 'Could not send that counter -- refreshing.', 'error');
          if (onQuietRefresh) onQuietRefresh();
        })
        .catch(function () {
          showToast('Could not reach the server -- refreshing.', 'error');
          if (onQuietRefresh) onQuietRefresh();
        });
    });
  }

  // ---- Bottom container: Wager History ----
  function buildWagerHistoryPanel(wagers) {
    var card = el('div', 'rc-panel rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Wager History'));

    if (!wagers || !wagers.success) {
      card.appendChild(el('p', 'rc-cs-empty', 'Could not load your wager history right now.'));
      return card;
    }

    card.appendChild(el('div', 'rc-wager-record-line', wagers.record.wins + ' Won — ' + wagers.record.losses + ' Lost (career)'));

    if (!wagers.history.length) {
      card.appendChild(el('p', 'rc-cs-empty', 'No settled wagers yet.'));
      return card;
    }

    // Only the 10 most recent (2026-09-03, Matt's call) -- wagers.history
    // already comes back newest-first (handleGetMyWagers sorts by
    // UpdatedAt desc), so this is just "show the front of the list." The
    // record line above still reflects the driver's whole career, not
    // just what's shown here.
    var list = el('div');
    wagers.history.slice(0, 10).forEach(function (w) {
      var row = el('div', 'rc-ledger-row');
      var main = el('div');
      main.appendChild(el('div', 'rc-ledger-event', escapeHtml(w.opponentDisplayName) + ' — ' + escapeHtml(w.conditionLabel)));
      main.appendChild(el('div', 'rc-hint', escapeHtml(w.seasonName) + ' · ' + escapeHtml(w.roundLabel)));
      row.appendChild(main);

      var amtEl;
      if (w.status === 'Settled' && w.winnerProfileId) {
        amtEl = el('div', 'rc-ledger-amt ' + (w.iWon ? 'rc-ledger-amt-positive' : 'rc-ledger-amt-negative'), (w.iWon ? '+' : '−') + formatMoney(w.stake));
      } else if (w.status === 'Settled') {
        amtEl = el('div', 'rc-ledger-amt', 'Void'); // condition never resolved (e.g. both DNF) -- no money moved
      } else {
        amtEl = el('div', 'rc-ledger-amt', w.status); // Denied / Cancelled
      }
      row.appendChild(amtEl);
      list.appendChild(row);
    });
    card.appendChild(list);
    return card;
  }

  // Recent Results -- placeholder card, second on the third row, next to
  // Next Race (2026-09-01, Matt's call: Next Race in front of Recent
  // Results). No backend/data wired up yet -- just holding the spot in
  // the dashboard layout for whenever this gets built.
  function recentResultsCard() {
    var card = el('div', 'rc-panel rc-finrep-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Recent Results'));
    card.appendChild(el('p', 'rc-cs-empty', 'Coming soon.'));
    return card;
  }

  // Wager -- Dashboard preview card (2026-09-02, real content now that
  // the wager system exists -- see renderWagerSection/Wagers.gs).
  // Fetches its own data OFF the dashboard's own critical path, same
  // self-contained pattern reputationCard already uses -- this briefly
  // rode the shared dashboardDataPromise batch instead, but that turned
  // out to roughly double the WHOLE dashboard's load time (see the long
  // comment on dashboardDataPromise below for why), so it's back to its
  // own request. To still avoid looking like a second, disconnected
  // loading state (the ORIGINAL complaint that led here), this card shows
  // NOTHING in its body while the fetch is in flight -- no "Loading..."
  // text, no spinner -- title and the "<- Make a Wager" link both render
  // immediately, and the wager list/empty-state just quietly fills in
  // once the (small, fast) response lands, with nothing visible flashing
  // in between on the common case. Shows up to 3 active/in-limbo wagers
  // (the site-wide 3-active cap means "up to 3" is really "all of them"
  // in practice).
  function wagerCard(token) {
    // Starts fully transparent and fades in once its data actually lands
    // (2026-09-03, Matt's call: "instead of cards that haven't loaded yet
    // showing empty... completely transparent until it loads and then it
    // fades into place") -- .rc-dash-card-fade/.rc-dash-card-fade-in
    // (style.css) instead of the earlier empty-body approach, since this
    // card renders its title and "<- Make a Wager" link synchronously
    // (nothing to wait on there) but its actual wager rows only exist
    // once getMyWagerSummary resolves -- rather than that gap reading as
    // "an empty card," the whole card (title, link, and all) stays
    // invisible until there's something real to show, then the entire
    // thing fades in together as one finished card.
    var card = el('div', 'rc-panel rc-finrep-card rc-dash-card rc-dash-card-fade');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Wager'));
    var body = el('div');
    card.appendChild(body);

    function reveal() { card.classList.add('rc-dash-card-fade-in'); }

    // Factored out of the initial fetch below so it can also be called as
    // a quiet re-check (2026-09-03, Matt's bug report: placing a wager on
    // the Wager page and clicking over to Dashboard didn't update this
    // card -- Dashboard is built once at page load, not re-fetched on
    // every visit, so this card's data just went stale the moment
    // anything changed elsewhere). Same "stash a refresher on the card
    // element" convention currentSeatCard already uses -- see its own
    // card.rcRefresh above. Rewrites body in place, no reveal()/fade
    // needed on a refresh (the card is already visible by then).
    function loadInto(target) {
      return fetchApi('getMyWagerSummary', { token: token }).then(function (data) {
        target.innerHTML = '';
        if (!data || !data.success) {
          target.appendChild(el('p', 'rc-cs-empty', 'Could not load your wagers right now.'));
        } else if (!data.items.length) {
          target.appendChild(el('p', 'rc-cs-empty', 'No active wagers right now.'));
        } else {
          var list = el('div', 'rc-wager-dash-list');
          data.items.forEach(function (w) {
            var row = el('div', 'rc-wager-dash-row');
            row.appendChild(el('div', 'rc-wager-dash-row-name', escapeHtml(w.opponentDisplayName)));
            // Race the wager belongs to (2026-09-03, Matt's ask: "add more
            // details to the wager like the race it belongs to") -- same
            // roundLabel getMyWagers already sends the full Wager page,
            // now also included in getMyWagerSummary for this mini card.
            if (w.roundLabel) row.appendChild(el('div', 'rc-wager-dash-row-race', escapeHtml(w.roundLabel)));
            var sub = el('div', 'rc-wager-dash-row-sub');
            sub.appendChild(el('span', null, escapeHtml(w.conditionLabel) + ' · ' + formatMoney(w.stake)));
            var statusLabel = w.status === 'Accepted' ? 'Locked In' : (w.awaitingMe ? 'Offered' : 'Waiting Response');
            sub.appendChild(el('span', 'rc-wager-status-pill' + (w.awaitingMe ? ' rc-wager-status-pill-action' : ''), statusLabel));
            row.appendChild(sub);
            list.appendChild(row);
          });
          target.appendChild(list);
        }
      }).catch(function () {
        target.innerHTML = '';
        target.appendChild(el('p', 'rc-cs-empty', 'Could not reach the server.'));
      });
    }

    loadInto(body).then(reveal);

    card.rcRefresh = function () { if (card.parentNode) loadInto(body); };

    var wagerLink = el('button', 'rc-link-btn rc-dash-card-link', '← Make a Wager');
    wagerLink.type = 'button';
    wagerLink.addEventListener('click', function () {
      showLazySection('wager', currentToken);
    });
    card.appendChild(wagerLink);

    return card;
  }

  function protestCard() {
    var card = el('div', 'rc-panel rc-finrep-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Protest'));
    card.appendChild(el('p', 'rc-cs-empty', 'Coming soon.'));
    return card;
  }

  // Sponsors -- Dashboard preview card (2026-09-01, Matt's call: sponsors
  // are no longer picked during the team-joining flow at all, so this card
  // is now the first place a freshly-registered driver is prompted to go
  // pick some). Three states, same gating pattern as Next Race:
  //   1. Not registered -- plain gray note, no link (nothing to pick yet).
  //   2. Registered, no sponsors picked -- a centered, bold gray notice
  //      (Matt's call) with a bottom-left link into the Sponsors page,
  //      same placement/treatment as Next Race's "View full season" link.
  //   3. Registered, at least one sponsor picked -- a compact preview of
  //      the picks (reusing the Sponsors page's own pick-chip look) plus
  //      a "Manage Sponsors" link in that same bottom-left spot.
  function sponsorsCard(data, activeSeasonData) {
    var card = el('div', 'rc-panel rc-sponsors-dash-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Sponsors'));

    var registered = !!(activeSeasonData && activeSeasonData.success && activeSeasonData.hasActiveSeason && activeSeasonData.registered);
    if (!registered) {
      card.appendChild(el('p', 'rc-cs-empty', 'Not on a team yet -- register for a season to pick sponsors.'));
      return card;
    }

    if (!data || !data.success) {
      card.appendChild(el('p', 'rc-cs-empty', 'Could not load your sponsors right now.'));
      return card;
    }

    var hasSponsors = !!(data.sponsors && data.sponsors.length);

    if (!hasSponsors) {
      var emptyWrap = el('div', 'rc-sponsors-dash-empty');
      emptyWrap.appendChild(el('div', 'rc-sponsors-dash-notice', 'Choose a sponsor to start earning bonus and penalty goals.'));
      card.appendChild(emptyWrap);
    } else {
      // Plain rows, no chip containers, separated by the same light gray
      // line the Calendar page's own track name uses (.rc-cal-track's
      // border-bottom) -- and no Tier badge (2026-09-01, Matt's call:
      // "take each sponsor out of their own containers, separate them by
      // light gray lines... and list the bonus and penalty rules for each
      // underneath. Remove the tier it belongs in"). Bonus/penalty line
      // reuses buildSponsorTermsLine, the exact same amount+trigger-name
      // treatment the Choose Sponsors picker list already uses.
      var list = el('div', 'rc-sponsors-dash-list');
      data.sponsors.forEach(function (s) {
        var row = el('div', 'rc-sponsors-dash-row');
        var head = el('div', 'rc-sponsors-dash-row-head');
        var logo = document.createElement('img');
        logo.className = 'rc-sponsors-dash-row-logo';
        logo.alt = '';
        logo.src = sponsorLogoSrc(s.Name || '');
        logo.onerror = function () { this.style.display = 'none'; };
        head.appendChild(logo);
        head.appendChild(el('div', 'rc-sponsors-dash-row-name', escapeHtml(s.Name || '(unnamed sponsor)')));
        row.appendChild(head);
        row.appendChild(buildSponsorTermsLine(s));
        list.appendChild(row);
      });
      card.appendChild(list);
    }

    var sponsorsLink = el('button', 'rc-link-btn rc-dash-card-link', hasSponsors ? '← Manage Sponsors' : '← Choose Sponsors');
    sponsorsLink.type = 'button';
    sponsorsLink.addEventListener('click', function () {
      showLazySection('sponsors', currentToken);
    });
    card.appendChild(sponsorsLink);

    return card;
  }

  // ---------------------------------------------------------------------
  // SEASON REGISTRATION MODAL -- restored from the pre-rebuild dashboard's
  // design (Matt's call: keep the modal's look/flow, drop the pre-ECO
  // cost model it was built around). What changed vs. the old version:
  //   - No more "Season Registration Fee" (a flat per-race fee, same for
  //     every team in a class) -- the current wizard's Economy section
  //     doesn't have one anymore. A team's BuyInCost (already randomized
  //     ±20% around its Tier average -- see the Car Objectives system) is
  //     the WHOLE cost now, not a per-team add-on to a season-long fee.
  //   - No reputation-floor class gating and no beginRegistration call --
  //     Reputation isn't a real computed number yet this season (see
  //     DataCache.gs's financesReputation.reputationScore comment), so
  //     there's nothing real to gate against; every class is open to
  //     every driver.
  //   - No separate chooseClass server action/state -- picking a class is
  //     purely a client-side filter now. The one server write is joinTeam
  //     itself, which locks the team immediately (Registrations.TeamID),
  //     with no sponsor IDs attached. Sponsors aren't picked at
  //     registration at all any more (Matt's call, 2026-09-01) -- a driver
  //     picks them later, any time before the season starts, from the
  //     Sponsors page (renderSponsorsSection below), which the Dashboard
  //     Sponsors card links straight to until they've picked at least one.
  //   - Team cards show this car's assigned Tier + Car Objective (name +
  //     bonus payout) instead of the old bonus/penalty perk chips -- the
  //     actual ECO-era incentive attached to a seat.
  // ---------------------------------------------------------------------

  // Bonus + Penalty on one line, amount and trigger name only, no
  // description text (2026-09-01, Matt's call: "remove the full
  // descriptions from the Choose Sponsors popup to simplify the list" --
  // full trigger descriptions now live in their own glossary panel on the
  // Sponsors page instead, see buildSponsorTriggerGlossary below). Bonus in
  // green, penalty in the same red as the Risk/Reward bar's penalty
  // segments. Used by the Choose/Change Sponsors picker list below.
  function buildSponsorTermsLine(s) {
    var bonusAmt = Number(s.BonusAmount) || 0;
    var penaltyAmt = Math.abs(Number(s.PenaltyAmount) || 0);
    var line = el('div', 'rc-sponsor-pick-terms');
    line.appendChild(el('span', 'rc-sponsor-pick-bonus', '+$' + bonusAmt + (s.BonusType ? ' ' + escapeHtml(s.BonusType) : '')));
    line.appendChild(el('span', 'rc-sponsor-pick-penalty', '−$' + penaltyAmt + (s.PenaltyType ? ' ' + escapeHtml(s.PenaltyType) : '')));
    return line;
  }

  // Sponsor-picking list used by the registration flow's own sponsor-pick
  // step (added 2026-08-30). The Sponsors page used to reuse this exact
  // same list inside a "Choose/Change Sponsors" popup; that popup is gone
  // now (2026-09-02 redesign -- picking there happens inline against the
  // All Sponsors table instead, see renderSponsorsSection), but
  // registration is a different moment (picking a team, not yet on the
  // Sponsors page at all) and still wants its own compact card-grid
  // picker, so this stays as-is for that one caller. Clicking a sponsor
  // toggles it; picking a 4th bumps the oldest of the current 3 rather
  // than refusing the click, so this stays a plain click-to-toggle
  // interaction with no separate "deselect first" step.
  function buildSponsorPickerList(sponsors, preselected) {
    var wrap = el('div', 'rc-sponsor-pick-list');
    var selected = (preselected || []).slice(0, 3);
    var cardBySponsorId = {};

    function refreshSelectedLook() {
      Object.keys(cardBySponsorId).forEach(function (id) {
        cardBySponsorId[id].classList.toggle('rc-sponsor-pick-card-selected', selected.indexOf(id) !== -1);
      });
    }

    function addCard(s) {
      var card = el('div', 'rc-sponsor-pick-card');
      // Fixed-width column (min 150px), logo centered inside it -- same
      // "text column's left edge lands in the same place row to row"
      // reasoning as the admin Sponsors popup's logo column, just wider
      // to fit the 140px logo cap plus breathing room either side.
      var logoCol = el('div', 'rc-sponsor-pick-logo-col');
      var logo = document.createElement('img');
      logo.className = 'rc-sponsor-pick-logo';
      logo.alt = '';
      logo.src = sponsorLogoSrc(s.Name || '');
      // Hides gracefully rather than a broken-image icon -- same pattern
      // every other sponsor/track/manufacturer logo in the site uses.
      logo.onerror = function () { this.style.display = 'none'; };
      logoCol.appendChild(logo);
      card.appendChild(logoCol);

      var textCol = el('div', 'rc-sponsor-pick-text');
      textCol.appendChild(el('div', 'rc-sponsor-pick-name', escapeHtml(s.Name || '(unnamed sponsor)')));
      // Amount + trigger name only, one line, no description (2026-09-01,
      // Matt's call) -- full trigger descriptions live in the Sponsors
      // page's own trigger glossary now, not repeated in this popup.
      textCol.appendChild(buildSponsorTermsLine(s));
      card.appendChild(textCol);

      card.addEventListener('click', function () {
        var idx = selected.indexOf(s.SponsorID);
        if (idx !== -1) {
          selected.splice(idx, 1);
        } else {
          if (selected.length >= 3) selected.shift();
          selected.push(s.SponsorID);
        }
        refreshSelectedLook();
      });

      wrap.appendChild(card);
      cardBySponsorId[s.SponsorID] = card;
    }

    // Grouped by Tier (Safe -> Balanced -> Risky, renamed 2026-08-31 from
    // Safe/Balanced/Aggressive -- Matt's call), same order and same
    // _rcTierBadge() chip the admin Sponsors popup already uses (Matt's
    // call, 2026-08-30: "make it obvious" which risk tier each sponsor
    // is) -- a driver picking sponsors sees the same risk-level grouping
    // an admin managing the catalog does.
    var TIER_ORDER = ['Safe', 'Balanced', 'Risky'];
    var byTier = {};
    sponsors.forEach(function (s) {
      var tier = s.Tier || 'Unclassified';
      if (!byTier[tier]) byTier[tier] = [];
      byTier[tier].push(s);
    });
    var tierOrder = TIER_ORDER.slice();
    Object.keys(byTier).forEach(function (t) { if (tierOrder.indexOf(t) === -1) tierOrder.push(t); });
    tierOrder.forEach(function (tier) {
      var list = byTier[tier];
      if (!list) return;
      wrap.appendChild(_rcTierBadge(tier));
      list.forEach(addCard);
    });

    refreshSelectedLook();
    return { el: wrap, getSelected: function () { return selected.slice(); } };
  }
  function buildRegistrationModal(profile, token, activeSeasonData, onDone) {
    var modal = showModal('Choose Your Class', { wide: true, onClose: function () { if (onDone) onDone(); } });
    var titleEl = modal.el.querySelector('.rc-modal-head h3');
    // pillNode is optional -- pass a real badge element (see buildClassBadge
    // below) to render "TITLE Class Pill" in the modal header, e.g.
    // "Choose Your Team LMGT3" with LMGT3 shown as its actual colored chip.
    function setTitle(t, pillNode) {
      if (!titleEl) return;
      titleEl.textContent = t + ' ';
      if (pillNode) titleEl.appendChild(pillNode);
    }
    function buildClassBadge(cls) {
      var colorVar = (typeof CAR_CLASS_BADGE_COLOR_VAR !== 'undefined' && CAR_CLASS_BADGE_COLOR_VAR[cls]) ? CAR_CLASS_BADGE_COLOR_VAR[cls] : '--rc-steel';
      var badge = el('span', 'rc-badge-chip', escapeHtml(cls));
      badge.style.background = 'var(' + colorVar + ')';
      return badge;
    }

    function fetchAllTeams() {
      return fetchApi('getAvailableTeams', { token: token, params: { seasonId: activeSeasonData.seasonId } });
    }

    function showClassScreen() {
      setTitle('Choose Your Class');
      var body = modal.body;
      body.innerHTML = '';
      body.appendChild(buildSpinner('Loading classes...'));
      fetchAllTeams().then(function (data) {
        body.innerHTML = '';
        if (!data.success) { body.appendChild(el('p', 'color:var(--rc-red);', data.message || 'Could not load classes.')); return; }
        renderClassScreenBody(data.teams || []);
      }).catch(function () {
        body.innerHTML = '';
        body.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server. Try again in a moment.'));
      });
    }

    function renderClassScreenBody(allTeams) {
      var body = modal.body;
      body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin-bottom:10px;',
        'Pick the class you’ll compete in this season. You’ll choose a specific car/team next -- each car’s Buy-In cost and Season Objective are set individually.'));

      var classesPresent = [];
      allTeams.forEach(function (t) { if (t.carClass && classesPresent.indexOf(t.carClass) === -1) classesPresent.push(t.carClass); });
      var classOrder = (typeof CAR_CLASS_LIST !== 'undefined') ? CAR_CLASS_LIST : classesPresent;
      var classes = classOrder.filter(function (c) { return classesPresent.indexOf(c) !== -1; });

      if (!classes.length) {
        body.appendChild(el('p', 'color:var(--rc-steel);', 'No cars are set up for this season yet.'));
        return;
      }

      classes.forEach(function (cls) {
        var teamsInClass = allTeams.filter(function (t) { return t.carClass === cls; });
        var openTeams = teamsInClass.filter(function (t) { return !t.taken; });
        var row = el('div', 'rc-class-pick-row');
        var label = el('div', null);
        var badge = buildClassBadge(cls);
        label.appendChild(badge);
        // Gray buy-in range pill sits right next to the class badge instead
        // of living in its own centered column (Matt's call, 2026-08-30).
        var costs = teamsInClass.map(function (t) { return t.buyInCost; });
        if (costs.length) {
          var costPill = el('span', 'rc-badge-chip rc-badge-cost-range',
            formatMoney(Math.min.apply(null, costs)) + ' – ' + formatMoney(Math.max.apply(null, costs)));
          label.appendChild(costPill);
        }
        // Inset 10px from the badge/pill above it (2026-08-30, Matt's
        // call) rather than flush with their left edge.
        label.appendChild(el('div', 'color:var(--rc-steel);font-size:12px;margin-top:4px;padding-left:10px;',
          openTeams.length + ' of ' + teamsInClass.length + ' seat' + (teamsInClass.length === 1 ? '' : 's') + ' open'));
        row.appendChild(label);

        var pickBtn = el('button', null, openTeams.length ? 'Choose' : 'Full');
        pickBtn.type = 'button';
        pickBtn.className = 'rc-btn-secondary rc-btn-sm';
        pickBtn.disabled = !openTeams.length;
        row.appendChild(pickBtn);
        if (!openTeams.length) row.classList.add('rc-class-pick-row-dim');

        pickBtn.addEventListener('click', function () { showTeamScreen(cls); });
        body.appendChild(row);
      });
    }

    function showTeamScreen(carClass) {
      setTitle('Choose Your Team');
      var body = modal.body;
      body.innerHTML = '';

      var backBtn = el('button', 'rc-link-btn', '← Choose a different class');
      backBtn.type = 'button';
      backBtn.style.cssText = 'display:block;margin-bottom:10px;';
      backBtn.addEventListener('click', showClassScreen);
      body.appendChild(backBtn);

      var contentSlot = el('div');
      body.appendChild(contentSlot);
      loadTeamsInto(contentSlot, carClass);
    }

    function loadTeamsInto(contentSlot, carClass) {
      contentSlot.innerHTML = '';
      contentSlot.appendChild(buildSpinner('Loading ' + carClass + ' teams...'));
      fetchApi('getAvailableTeams', { token: token, params: { seasonId: activeSeasonData.seasonId, carClass: carClass } }).then(function (data) {
        contentSlot.innerHTML = '';
        if (!data.success) { contentSlot.appendChild(el('p', 'color:var(--rc-red);', data.message || 'Could not load teams.')); return; }
        if (!data.teams || !data.teams.length) { contentSlot.appendChild(el('p', 'color:var(--rc-steel);', 'No cars are set up for ' + escapeHtml(carClass) + ' yet.')); return; }
        // Elite always sorts to the top regardless of its actual randomized
        // buy-in cost, then everything else by cost descending (Matt's
        // call: "Elite tier put the car at the top").
        var sorted = data.teams.slice().sort(function (a, b) {
          if (a.tier === 'Elite' && b.tier !== 'Elite') return -1;
          if (b.tier === 'Elite' && a.tier !== 'Elite') return 1;
          return b.buyInCost - a.buyInCost;
        });
        sorted.forEach(function (team) { contentSlot.appendChild(buildTeamCard(team, carClass)); });
      }).catch(function () {
        contentSlot.innerHTML = '';
        contentSlot.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server. Try again in a moment.'));
      });
    }

    // Reuses the pre-rebuild team card's exact CSS classes (.rc-team-card,
    // .rc-team-logo-box, .rc-team-perks/-perk-chip, .rc-team-card-footer
    // -- all still in style.css, never removed) so this looks like the
    // card Matt originally signed off on. What's shown inside it is new:
    // Tier + Car Objective (this car's actual ECO-era incentive) instead
    // of the old bonus/penalty perks, and one flat Buy-In cost instead of
    // a Season Registration Fee + Team Buy-In breakdown.
    function buildTeamCard(team, carClass) {
      var card = el('div', 'rc-team-card' + (team.taken ? ' rc-team-card-taken' : '') + (team.tier === 'Elite' ? ' rc-team-card-elite' : ''));

      var head = el('div', 'rc-team-card-head');
      var identity = el('div', 'rc-team-card-identity');
      var logoBox = el('div', 'rc-team-logo-box');
      if (team.manufacturer && typeof manufacturerLogoSrc === 'function') {
        var logo = document.createElement('img');
        logo.src = manufacturerLogoSrc(team.manufacturer);
        logo.alt = team.manufacturer;
        logo.onerror = function () { logoBox.style.display = 'none'; };
        logoBox.appendChild(logo);
      }
      identity.appendChild(logoBox);
      var nameCol = el('div');
      nameCol.appendChild(el('div', 'rc-team-name', escapeHtml((team.teamName || 'Unnamed Team') + (team.carNumber ? ' #' + team.carNumber : ''))));
      if (team.manufacturer || team.carModel) {
        nameCol.appendChild(el('div', 'rc-team-subtitle', escapeHtml([team.manufacturer, team.carModel].filter(Boolean).join(' '))));
      }
      identity.appendChild(nameCol);
      head.appendChild(identity);
      head.appendChild(el('div', 'rc-team-cost-total', formatMoney(team.buyInCost)));
      // Light gray line under the car header, separating it from the team
      // description below (2026-08-30, Matt's call) -- only added when
      // there's actually a description underneath to separate it from.
      if (team.teamDesc) {
        head.style.cssText = 'padding-bottom:14px;border-bottom:1px solid var(--rc-offwhite);';
      }
      card.appendChild(head);

      // Team description (Cars.TeamDesc) -- lives between the header and
      // the Tier/Objective perks below, in gray body text (Matt's call,
      // 2026-08-30). Skipped entirely if the car has no description set.
      if (team.teamDesc) {
        card.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin:8px 0;', escapeHtml(team.teamDesc)));
      }

      // Tier chip colored per-Tier (2026-08-30, Matt's call: "the colors
      // we discussed") -- same Low/Mid/High/Elite palette as the Data
      // Management Cars popup's tier pill (.rc-badge-cartier-*) and the
      // Current Seat dashboard card, just tinted light here instead of a
      // solid fill, matching this page's existing green/red perk-chip
      // style. 25% width against the objective chip's 75% (Matt's call) --
      // the objective is the more decision-relevant of the two, so it gets
      // the bulk of the row.
      var perks = el('div', 'rc-team-perks');
      var tierKey = team.tier || 'Mid';
      var tierColorClass = {
        Low: 'rc-team-perk-tier-low', Mid: 'rc-team-perk-tier-mid',
        High: 'rc-team-perk-tier-high', Elite: 'rc-team-perk-tier-elite'
      }[tierKey] || 'rc-team-perk-tier-mid';
      var tierChip = el('div', 'rc-team-perk-chip rc-team-perk-tier ' + tierColorClass);
      tierChip.appendChild(el('span', 'rc-team-perk-icon', '▲'));
      tierChip.appendChild(el('span', null, '<strong>' + escapeHtml(tierKey) + ' Tier</strong> Team'));
      perks.appendChild(tierChip);
      if (team.objectiveName) {
        var objDescMap = (typeof CAR_OBJECTIVE_DESCRIPTIONS !== 'undefined') ? CAR_OBJECTIVE_DESCRIPTIONS : {};
        var objChip = el('div', 'rc-team-perk-chip rc-team-perk-objective rc-team-perk-bonus rc-tooltip');
        if (objDescMap[team.objectiveName]) objChip.setAttribute('data-tooltip', objDescMap[team.objectiveName]);
        objChip.appendChild(el('span', 'rc-team-perk-icon', '★'));
        objChip.appendChild(el('span', null, 'Season Objective: <strong>' + escapeHtml(team.objectiveName) + '</strong> · ' + formatMoney(team.objectiveBonus) + ' bonus'));
        perks.appendChild(objChip);
      }
      card.appendChild(perks);

      var footer = el('div', 'rc-team-card-footer');
      if (team.taken) {
        footer.appendChild(el('div', 'color:var(--rc-steel);font-size:13px;', 'This seat is already taken.'));
      } else {
        var joinBtn = el('button', null, 'Join This Team');
        joinBtn.type = 'button';
        joinBtn.className = 'rc-btn-primary';
        joinBtn.addEventListener('click', function () { doJoinTeamDirect(team, carClass, joinBtn); });
        footer.appendChild(joinBtn);
        var joinErrorLine = el('div', 'color:var(--rc-red);font-size:12px;margin-top:6px;');
        footer.appendChild(joinErrorLine);
        joinBtn.rcErrorLine = joinErrorLine;
      }
      card.appendChild(footer);
      return card;
    }

    // Sponsors are picked later, from the Sponsors page, never at
    // registration (Matt's call, 2026-09-01: "instead of giving the full
    // breakdown and making the driver pick sponsors from the joining a
    // team popup"). Joining a team now locks in immediately on click, with
    // no separate sponsor-pick screen in between -- straight from "Join
    // This Team" into the signing sequence.
    function doJoinTeamDirect(team, carClass, joinBtn) {
      joinBtn.disabled = true;
      joinBtn.textContent = 'Locking In...';
      if (joinBtn.rcErrorLine) joinBtn.rcErrorLine.textContent = '';
      fetchApi('joinTeam', { method: 'POST', token: token, body: { seasonId: activeSeasonData.seasonId, teamId: team.teamId } }).then(function (data) {
        if (!data.success) {
          joinBtn.disabled = false;
          joinBtn.textContent = 'Join This Team';
          if (joinBtn.rcErrorLine) {
            joinBtn.rcErrorLine.textContent = data.message || (data.error === 'TEAM_TAKEN' ? 'That seat was just taken. Pick a different team.' : 'Could not complete registration.');
          }
          if (data.error === 'TEAM_TAKEN') showTeamScreen(carClass);
          return;
        }
        // Registration itself is done the instant the API call above
        // succeeds -- everything from here down is presentation. The old
        // immediate toast+close (now moved into finishRegistration below)
        // is deferred until the driver has actually watched the signing
        // sequence and hit Continue on the congratulations screen (Matt's
        // call, 2026-08-30: "I want this to feel EPIC").
        function finishRegistration() {
          showToast('You’re registered! Pick your sponsors any time from the Sponsors page.', 'success');
          // Registering for a season dismisses its bell notification the
          // same way closing the bell after seeing it would (Matt's call,
          // 2026-08-30) -- see rcDismissSeasonNotification in header.js.
          if (typeof rcDismissSeasonNotification === 'function') rcDismissSeasonNotification(activeSeasonData.seasonId);
          rcReloadAfterSave();
        }
        openSigningSequence(team, carClass, finishRegistration);
      }).catch(function () {
        joinBtn.disabled = false;
        joinBtn.textContent = 'Join This Team';
        if (joinBtn.rcErrorLine) joinBtn.rcErrorLine.textContent = 'Could not reach the server. Try again in a moment.';
      });
    }

    showClassScreen();
  }

  // ---------------------------------------------------------------------
  // SIGNING SEQUENCE (2026-08-30, Matt's call: "I want this to feel
  // EPIC") -- plays after a driver locks in a team (with or without
  // sponsors), before the old immediate "you're registered" toast. Its
  // own full-viewport overlay, stacked above the registration modal's own
  // backdrop (z-index 5000 vs. the modal's 2000) rather than replacing
  // it -- the registration modal is left open but hidden behind this
  // overlay the whole time, so closing it (and everything that used to
  // fire immediately on join: the toast, the notification dismiss,
  // onDone()) is deferred to whenever this sequence actually finishes.
  //
  // Three beats:
  //   1. SUSPENSE -- a small dark card cycles contract-flavor status
  //      lines ("Drafting team documents...") while assets/videos/
  //      signing-a-team.mp4 preloads in the background, reusing the same
  //      .rc-startlights gantry as every other loading state sitewide.
  //      Held for at least SIGNING_SUSPENSE_MIN_MS even if the video is
  //      already cached, so it never flashes past unnoticed; extended for
  //      as long as the video actually needs past that floor.
  //   2. FILM -- the card grows into a 16:9 box (capped at 1280x720,
  //      matching the video's own native size) and it autoplays muted --
  //      browser autoplay policies are the reason it can't safely
  //      autoplay WITH sound -- with a small icon-only mute/unmute control
  //      (bottom-left, standard volume glyph) fading in after a beat for
  //      anyone who wants sound. No skip button at all, by design (Matt's
  //      call) -- every driver watches the full 14 seconds.
  //      SIGNING_FAILSAFE_MS guards against a video that never fires
  //      'canplay' (a bad connection, a renamed file) by moving on anyway
  //      instead of trapping the driver on a blank screen forever. Once
  //      the video ends, it does NOT auto-advance -- a dark gradient +
  //      "Continue" button fades in over the last frame, and only that
  //      click moves on to REVEAL (Matt's call: don't move on until the
  //      driver clicks continue).
  //   3. REVEAL -- the whole dark stage collapses to a true full-viewport
  //      beat: the Race Club wordmark, "CONGRATULATIONS", and the new
  //      team's manufacturer logo/name scale up together, with "Continue"
  //      and "Replay Video" fading in. This beat HOLDS here indefinitely --
  //      no auto-advance timer -- only Continue moves on to the contract
  //      screen (Matt's call, 2026-08-30).
  //
  // From there the whole dark overlay is torn down and onFinish() (the
  // caller's finishRegistration) fires immediately -- Continue on the
  // congratulations screen now goes straight to the toast + reload (Matt's
  // call, 2026-09-01), no contract-recap modal step in between. Sponsors
  // aren't picked at signing time any more either, so there was nothing
  // left for that recap to add beyond what's already on the dashboard.
  // ---------------------------------------------------------------------
  var SIGNING_MESSAGES_ = [
    'Drafting team documents...',
    'Securing season entry fees...',
    'Notifying the team principal...',
    'Verifying sponsorship terms...',
    'Fitting your race suit...',
    'Calibrating the seat...',
    'Finalizing your contract...',
    'Bringing the car to pit lane...'
  ];

  // Ten team-principal-to-new-driver lines for the REVEAL beat (2026-08-30,
  // Matt's ask: "feels like something a team principal would say to their
  // new driver... make it feel personal"), replacing the single generic
  // "You just earned a seat at ___. Time to make it count." One is picked
  // at random per signing (rcPickWelcomeLine_ below) -- {team} is the only
  // placeholder since a driver's own name is already all over the header
  // chrome; these are written as if spoken TO the driver, not about them.
  // Second pass, same day (Matt: "make the hype messages... only positive!
  // ... 3 sentences long and cmon give it some energy!!!") -- every line
  // rewritten as an upbeat, energetic, exactly-3-sentence quote (no mixed
  // "don't make us regret it"/challenge-toned lines from the first draft),
  // rendered inside big quotation marks with a "— Team Principal"
  // attribution underneath (see advanceToReveal below).
  var SIGNING_WELCOME_LINES_ = [
    'Welcome to {team}! We’ve been waiting for a driver like you, and we finally found one. This seat is yours, now let’s go show everyone what we can do!',
    'You earned this, plain and simple! {team} doesn’t hand out seats, we award them. Buckle up, this is going to be a season to remember!',
    'From everyone at {team}: congratulations! You’re not just joining a team, you’re joining a family that believes in you. Let’s get out there and win!',
    'This is the moment every driver dreams about, and it’s yours! {team} is fully behind you, every lap, every race. Now go make us proud!',
    'Welcome aboard, driver! We built this car for someone special, and that someone is you. Let’s make {team} history together!',
    'The whole {team} garage is buzzing about you! You’ve got the talent, we’ve got the car, together we’re unstoppable. Let’s go racing!',
    'You should be incredibly proud of yourself right now! {team} chose you because we believe you can do great things. Now it’s time to prove it!',
    'Congratulations, and welcome to the team! Every great champion started exactly where you are right now. Let’s write your story together!',
    'This seat has your name on it for a reason! {team} sees the potential in you, and we can’t wait to watch it grow. Let’s hit the track!',
    'Welcome to {team}, driver! Today you take the first step toward something incredible. Strap in, the season starts now!'
  ];
  function rcPickWelcomeLine_(team) {
    var template = SIGNING_WELCOME_LINES_[Math.floor(Math.random() * SIGNING_WELCOME_LINES_.length)];
    return template.split('{team}').join(escapeHtml(team.teamName || 'the team'));
  }
  var SIGNING_SUSPENSE_MIN_MS = 3800;
  var SIGNING_FAILSAFE_MS = 20000;

  // Standard flat mute/unmute glyphs (Feather-style "volume-2"/"volume-x")
  // for the FILM stage's sound control -- plain line icons, not the emoji
  // speakers used before (Matt: "make it a standard speaker icon, not the
  // 3d one you chose").
  function rcVolumeIconSvg_(muted) {
    var speaker = '<path d="M11 5 6 9H2v6h4l5 4V5z"></path>';
    var rest = muted
      ? '<line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>'
      : '<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>';
    return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + speaker + rest + '</svg>';
  }

  function openSigningSequence(team, carClass, onFinish) {
    var overlay = el('div', 'rc-signing-overlay');
    var stage = el('div', 'rc-signing-stage rc-signing-stage-suspense');
    overlay.appendChild(stage);
    document.body.appendChild(overlay);

    // ---- Stage 1: SUSPENSE ------------------------------------------
    stage.appendChild(el('div', 'rc-signing-wordmark', 'RACE CLUB'));
    var lights = el('div', 'rc-startlights');
    for (var i = 0; i < 5; i++) lights.appendChild(el('div', 'rc-startlight'));
    stage.appendChild(lights);
    var msgLine = el('div', 'rc-signing-message', SIGNING_MESSAGES_[0]);
    stage.appendChild(msgLine);

    var msgIndex = 0;
    var msgTimer = setInterval(function () {
      msgIndex = (msgIndex + 1) % SIGNING_MESSAGES_.length;
      msgLine.style.opacity = '0';
      setTimeout(function () {
        msgLine.textContent = SIGNING_MESSAGES_[msgIndex];
        msgLine.style.opacity = '1';
      }, 180);
    }, 1400);

    var video = document.createElement('video');
    video.className = 'rc-signing-video-preload';
    video.src = 'assets/videos/signing-a-team.mp4';
    video.muted = true;
    video.setAttribute('muted', ''); // belt-and-suspenders -- some browsers
    // weigh the HTML attribute more heavily than the JS property when
    // deciding whether muted autoplay is allowed.
    video.playsInline = true;
    video.setAttribute('playsinline', ''); // required as an attribute (not
    // just the property) on older iOS Safari to avoid forcing fullscreen.
    video.preload = 'auto';
    // Attached to the overlay (hidden, 1x1) from the very start rather than
    // held detached in memory -- some browsers (mobile Safari especially)
    // only actually fetch a <video>'s data once it's a real part of the
    // document, so a detached element's 'canplay'/'canplaythrough' can
    // simply never fire, silently falling through to the failsafe timer
    // every time (2026-08-30 bug: "the video didn't play at all... held
    // onto what seemed like the entire length of the video"). Moving this
    // same node into the visible video-wrap in advanceToFilm() below
    // preserves whatever it already buffered -- reparenting a media
    // element doesn't reset its network state, only changing .src does.
    overlay.appendChild(video);

    var startedAt = Date.now();
    var videoReady = false;
    var advancedToFilm = false;
    var failsafeTimer = setTimeout(function () { videoReady = true; tryAdvanceToFilm(); }, SIGNING_FAILSAFE_MS);
    // 'canplay' (enough data for the current frame) rather than
    // 'canplaythrough' (confident it can play to the end without
    // buffering) -- canplaythrough can take a very long time to fire for a
    // multi-megabyte file depending on how the browser estimates download
    // speed, and playback can start smoothly well before that point since
    // the browser keeps buffering during playback anyway.
    video.addEventListener('canplay', function onReady() {
      video.removeEventListener('canplay', onReady);
      videoReady = true;
      tryAdvanceToFilm();
    });
    video.addEventListener('error', function () { videoReady = true; tryAdvanceToFilm(); });
    video.load();

    function tryAdvanceToFilm() {
      if (advancedToFilm) return;
      var wait = Math.max(0, SIGNING_SUSPENSE_MIN_MS - (Date.now() - startedAt));
      setTimeout(function () {
        if (advancedToFilm || !videoReady) return;
        advancedToFilm = true;
        clearInterval(msgTimer);
        clearTimeout(failsafeTimer);
        advanceToFilm();
      }, wait);
    }

    // ---- Stage 2: FILM ------------------------------------------------
    // Its own function (not inlined into advanceToFilm) so "Replay Video"
    // on the REVEAL beat below can re-enter this exact same stage a
    // second time. { once: true } on the ended/error listeners means each
    // call wires up its own independent, self-cleaning pair -- a replay's
    // fresh listeners don't stack on top of whichever ones the first
    // playthrough already used and already fired.
    function playFilmStage() {
      stage.className = 'rc-signing-stage rc-signing-stage-film';
      stage.innerHTML = '';
      var videoWrap = el('div', 'rc-signing-video-wrap');
      video.className = 'rc-signing-video';
      videoWrap.appendChild(video);

      // Bottom-left icon-only control, standard flat volume/mute SVG glyphs
      // (2026-08-30, Matt: "make it a standard speaker icon, not the 3d one
      // you chose" -- the emoji speakers read as too illustrative/"3D" next
      // to the rest of the site's plain-line iconography; also moved from
      // top-right to bottom-left per Matt's call, matching where a mute
      // control normally sits on a video player).
      var unmuteBtn = el('button', 'rc-signing-unmute');
      unmuteBtn.type = 'button';
      var unmuteIcon = el('span', 'rc-signing-unmute-icon');
      unmuteIcon.innerHTML = rcVolumeIconSvg_(video.muted);
      unmuteBtn.appendChild(unmuteIcon);
      unmuteBtn.setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video');
      unmuteBtn.addEventListener('click', function () {
        video.muted = !video.muted;
        unmuteIcon.innerHTML = rcVolumeIconSvg_(video.muted);
        unmuteBtn.setAttribute('aria-label', video.muted ? 'Unmute video' : 'Mute video');
      });
      videoWrap.appendChild(unmuteBtn);

      stage.appendChild(videoWrap);
      setTimeout(function () { unmuteBtn.classList.add('rc-signing-unmute-visible'); }, 900);

      // Goes straight to REVEAL the instant the video ends -- no "Continue"
      // gate (Matt's call, 2026-08-30: "I want it to go right to the
      // congratulations screen without stopping to hit continue"). 'error'
      // (a genuine playback failure, or play() rejecting below) advances
      // the same way -- there's no last frame worth pausing on either way.
      // advanceToReveal's own revealStarted guard means only the first of
      // these to fire on a given playthrough matters.
      video.addEventListener('ended', advanceToReveal, { once: true });
      video.addEventListener('error', advanceToReveal, { once: true });
      video.currentTime = 0;
      var playAttempt = video.play();
      if (playAttempt && typeof playAttempt.catch === 'function') {
        playAttempt.catch(function () { advanceToReveal(); });
      }
    }
    function advanceToFilm() { playFilmStage(); }

    // ---- Stage 3: REVEAL ------------------------------------------------
