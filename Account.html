    ));
    var noShowFreeInput = wizNumberInput(state.economy.noShowFreeCount, function (v) { state.economy.noShowFreeCount = v; }, { min: 0 }); requireField(noShowFreeInput, requiredEls);
    var noShowFeeInput = wizNumberInput(state.economy.noShowFee, function (v) { state.economy.noShowFee = v; }, { min: 0 }); requireField(noShowFeeInput, requiredEls);
    container.appendChild(wizFieldPairRow(
      'Free No-Shows / Season', noShowFreeInput,
      'Missed races allowed before the fee (right) kicks in.',
      'No-Show Fee After That ($)', noShowFeeInput,
      'Charged automatically once the free no-shows are used up, paid into the season prize pool.'
    ));
    var seatCostPoolInput = wizNumberInput(state.economy.seatCostPoolPct, function (v) { state.economy.seatCostPoolPct = v; }, { min: 0, max: 100 }); requireField(seatCostPoolInput, requiredEls);
    var leagueCutInput = wizNumberInput(state.economy.leagueEarningsCutPct, function (v) { state.economy.leagueEarningsCutPct = v; }, { min: 0, max: 100 }); requireField(leagueCutInput, requiredEls);
    container.appendChild(wizFieldPairRow(
      'Per-Race Seat Cost → Pool (%)', seatCostPoolInput,
      'Cut of every retainer payment that feeds the season prize pool.',
      'League Cut Of Race Earnings (%)', leagueCutInput,
      'Cut of every race\'s salary/bonus payout that feeds the same prize pool.'
    ));
    container.appendChild(el('div', 'rc-hint',
      'The penalty fine schedule and sponsor tier payouts reuse the design doc\'s working values automatically and aren\'t editable from this pass of the wizard yet.'));
  }

  // Keeps state.races the right length whenever Race Events opens --
  // Number Of Races is set on the previous page and can change any time
  // the admin goes Back, so this reconciles rather than assuming.
  function syncRaceCount(state) {
    var n = Math.max(0, parseInt(state.numRaces, 10) || 0);
    while (state.races.length < n) {
      state.races.push({
        track: WIZARD_TRACK_LIST[0], layout: trackLayoutOptions(WIZARD_TRACK_LIST[0])[0], weather: 'Clear', tier: 'Sprint',
        chanceOfRain: 0, temperatureC: 20,
        passwordOverride: '', registrationLink: '',
        igPracticeStart: '12:00', igQualifyStart: '13:00', igRaceStart: '14:00'
      });
    }
    if (state.races.length > n) state.races.length = n;
  }

  // Keeps state.byeWeekDates the right length whenever Race Events opens
  // -- capped at (races - 1), 4 max (Matt's call), same reconcile-not-
  // assume pattern as syncRaceCount. Each date also gets revalidated
  // against the season's actual slot list (computeSeasonSlots) and reset
  // to a sane default (a trailing slot) if it's missing or no longer one
  // of the valid choices -- e.g. after Number Of Races, Frequency, or
  // Season Start Date changed on the previous page.
  function syncByeWeekDates(state) {
    var n = Math.max(0, Math.min(maxByeDropForRaces(state.numRaces), parseInt(state.byeWeeks, 10) || 0));
    if (!state.byeWeekDates) state.byeWeekDates = [];
    while (state.byeWeekDates.length < n) state.byeWeekDates.push('');
    if (state.byeWeekDates.length > n) state.byeWeekDates.length = n;
    var raceCount = Math.max(0, parseInt(state.numRaces, 10) || 0);
    var slots = computeSeasonSlots(state);
    for (var i = 0; i < n; i++) {
      if (!state.byeWeekDates[i] || slots.indexOf(state.byeWeekDates[i]) === -1) {
        state.byeWeekDates[i] = slots[raceCount + i] || slots[slots.length - 1] || '';
      }
    }
  }

  // Keeps state.specialEvents the right length whenever Race Events opens
  // -- capped at 2, same pattern again.
  function syncSpecialEvents(state) {
    var n = Math.max(0, Math.min(2, parseInt(state.specialEventsCount, 10) || 0));
    if (!state.specialEvents) state.specialEvents = [];
    while (state.specialEvents.length < n) state.specialEvents.push(defaultSpecialEvent());
    if (state.specialEvents.length > n) state.specialEvents.length = n;
  }

  // Page 2 — mirrors Step 2 (Per-Race Details) of the design doc,
  // repeated once per race slot generated from Number Of Races. Setup
  // rules/pit stops/fuel/tires/track limits/practice+qualifying length
  // all moved to Season Details' new Race Settings subsection (season-
  // wide, not per-race); this page now also carries the three in-game
  // session start times, which DO vary race to race (a night race needs
  // a different in-game clock time than an afternoon one).
  function renderWizardRaceEventsPage(state, container, requiredEls) {
    // Every race card's date box (below) is locked/auto-calculated, so it
    // needs to stay in sync whenever a Bye Week dropdown changes -- this
    // array holds a reference to each race's date input in order, filled
    // in as the cards are built below, so a bye week change can update
    // them directly in place instead of re-rendering the whole page (that
    // full-page re-render is exactly what caused the old scroll-jump bug
    // on the class checkboxes, so it's avoided here on purpose).
    var raceDateInputs = [];
    function refreshRaceDates() {
      var dates = computeRaceDates(state);
      raceDateInputs.forEach(function (input, i) { input.value = dates[i] || ''; });
    }

    // Bye week dropdowns -- one per bye week (max 4, capped at races - 1
    // on the previous page), at the very top of this page since that's
    // where the admin is looking at the actual week-by-week schedule.
    // Each is restricted to exactly the dates the season's cadence could
    // land on (Matt's call: "only the dates it could possibly be") --
    // picking one there automatically bumps whichever race would have
    // landed on that date (and everything after it) to the next slot,
    // since race dates are just "the slots byes didn't claim."
    if (state.byeWeeks > 0) {
      container.appendChild(wizSubhead('Bye Weeks'));
      container.appendChild(el('p', 'color:var(--rc-steel);font-size:12.5px;margin-bottom:12px;',
        'Pick which scheduled week each bye lands on -- any race that would have landed there automatically moves to the next available week.'));
      var byeRow = el('div', 'rc-wiz-field-pair');
      var slots = computeSeasonSlots(state);
      state.byeWeekDates.forEach(function (val, idx) {
        var select = document.createElement('select');
        slots.forEach(function (s) {
          var o = document.createElement('option');
          o.value = s; o.textContent = formatDateLabel(s);
          if (s === val) o.selected = true;
          select.appendChild(o);
        });
        select.addEventListener('change', function () {
          state.byeWeekDates[idx] = select.value;
          refreshRaceDates();
        });
        requireField(select, requiredEls);
        var col = el('div', 'rc-wiz-field');
        col.appendChild(wizLabel('Bye Week ' + (idx + 1) + ' Date'));
        col.appendChild(select);
        byeRow.appendChild(col);
      });
      container.appendChild(byeRow);
    }

    if (!state.races.length) {
      container.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;',
        'No races yet — go back to Season Details and set "Number Of Races" above 0.'));
      return;
    }
    var computedRaceDates = computeRaceDates(state);
    state.races.forEach(function (race, idx) {
      var card = el('div', 'rc-panel rc-wizard-race-card');
      card.appendChild(el('h4', 'margin-top:0;color:var(--rc-red);', 'Race ' + (idx + 1)));

      // Auto-calculated from Season Start Date + Frequency + Bye Weeks on
      // the previous page -- not editable here, greyed out (Matt's call).
      var raceDateInput = el('input'); raceDateInput.type = 'date';
      raceDateInput.value = computedRaceDates[idx] || '';
      raceDateInput.disabled = true;
      raceDateInput.className = 'rc-field-locked';
      // Half as wide as a normal date box (Matt's call) -- the shared
      // wizard rule already caps date inputs at 50% of the field column,
      // so 25% here is half of that standard width.
      raceDateInput.style.maxWidth = '25%';
      raceDateInputs.push(raceDateInput);
      card.appendChild(wizField('Race Date (auto-calculated)', raceDateInput));

      // Layout is a dropdown populated from whichever Track is currently
      // selected, not free text (Matt's call: "it won't be a free text
      // box"). Changing Track swaps the Layout select's own options in
      // place instead of re-rendering the whole page, so the admin's
      // scroll position doesn't jump while editing a later race card.
      if (!race.layout || trackLayoutOptions(race.track).indexOf(race.layout) === -1) {
        race.layout = trackLayoutOptions(race.track)[0];
      }
      var layoutSelect = wizSelect(trackLayoutOptions(race.track), race.layout, function (v) { race.layout = v; });
      var trackSelect = wizSelect(WIZARD_TRACK_LIST, race.track, function (v) {
        race.track = v;
        var opts = trackLayoutOptions(v);
        race.layout = opts[0];
        layoutSelect.innerHTML = '';
        opts.forEach(function (o) {
          var oe = document.createElement('option');
          oe.value = o; oe.textContent = o;
          layoutSelect.appendChild(oe);
        });
        layoutSelect.value = race.layout;
      });
      // Fills its whole column (50% of the card) instead of the wizard's
      // usual 50%-of-column cap -- track names run long, and this is the
      // one dropdown Matt specifically called out as too narrow.
      trackSelect.style.maxWidth = '100%';
      card.appendChild(fieldPairRow('Track', trackSelect, 'Layout / Configuration', layoutSelect));

      var weatherSelect = wizSelect(WIZARD_WEATHER_LIST, race.weather, function (v) {
        race.weather = v;
        syncRainInputToWeather(weatherSelect, rainInput, function () { race.chanceOfRain = 0; });
      });
      card.appendChild(fieldPairRow(
        'Weather', weatherSelect,
        'Race Length Tier', wizSelect(['Sprint', 'Medium', 'Long'], race.tier, function (v) { race.tier = v; })
      ));
      // Chance of Rain steps by 5% (Matt's call); Temperature is Celsius,
      // bounded to a realistic normal-low-to-normal-high range for a race
      // weekend (-10C to 45C) rather than a physically unbounded box.
      // Only enabled for actual rain-capable Weather values -- see
      // syncRainInputToWeather() above (Matt's call).
      var rainInput = wizNumberInput(race.chanceOfRain, function (v) { race.chanceOfRain = v; }, { min: 0, max: 100, step: 5 });
      requireField(rainInput, requiredEls);
      var tempInput = wizNumberInput(race.temperatureC, function (v) { race.temperatureC = v; }, { min: -10, max: 45, step: 1 });
      requireField(tempInput, requiredEls);
      card.appendChild(fieldPairRow('Chance Of Rain (%)', rainInput, 'Temperature (°C)', tempInput));
      syncRainInputToWeather(weatherSelect, rainInput, function () { race.chanceOfRain = 0; });
      var regLinkInput = wizTextInput(race.registrationLink, function (v) { race.registrationLink = v; });
      regLinkInput.style.maxWidth = '100%';
      card.appendChild(wizField('Registration Link', regLinkInput));
      var igPractice = el('input'); igPractice.type = 'time'; igPractice.value = race.igPracticeStart || '';
      igPractice.addEventListener('input', function () { race.igPracticeStart = igPractice.value; });
      requireField(igPractice, requiredEls);
      var igQualify = el('input'); igQualify.type = 'time'; igQualify.value = race.igQualifyStart || '';
      igQualify.addEventListener('input', function () { race.igQualifyStart = igQualify.value; });
      requireField(igQualify, requiredEls);
      var igRace = el('input'); igRace.type = 'time'; igRace.value = race.igRaceStart || '';
      igRace.addEventListener('input', function () { race.igRaceStart = igRace.value; });
      igRace.style.maxWidth = '25%';
      requireField(igRace, requiredEls);
      card.appendChild(fieldPairRow('In-Game Practice Start Time', wizTimeWithBadge(igPractice, 'Sim Time'), 'In-Game Qualify Start Time', wizTimeWithBadge(igQualify, 'Sim Time')));
      card.appendChild(wizField('In-Game Race Start Time', wizTimeWithBadge(igRace, 'Sim Time')));
      container.appendChild(card);
    });

    // Special events -- strictly money, no championship points (Matt's
    // call). One card per event, after every regular race card.
    if (state.specialEvents.length) {
      container.appendChild(wizSubhead('Special Events'));
      container.appendChild(el('p', 'color:var(--rc-steel);font-size:12.5px;margin-bottom:12px;',
        'Money-only mini-events -- no championship points.'));
      state.specialEvents.forEach(function (evt, idx) {
        var card = el('div', 'rc-panel rc-wizard-race-card');
        card.appendChild(el('h4', 'margin-top:0;color:var(--rc-red);', 'Special Event ' + (idx + 1)));

        var evtNameInput = wizTextInput(evt.eventName, function (v) { evt.eventName = v; });
        requireField(evtNameInput, requiredEls);
        card.appendChild(wizField('Event Name', evtNameInput));

        var evtDate = el('input'); evtDate.type = 'date'; evtDate.value = evt.date || '';
        evtDate.style.maxWidth = '50%';
        evtDate.addEventListener('input', function () { evt.date = evtDate.value; });
        requireField(evtDate, requiredEls);
        var evtStartTime = el('input'); evtStartTime.type = 'time'; evtStartTime.value = evt.startTime || '';
        evtStartTime.addEventListener('input', function () { evt.startTime = evtStartTime.value; });
        requireField(evtStartTime, requiredEls);
        card.appendChild(fieldPairRow('Event Date', evtDate, 'Start Time', evtStartTime));

        // Track/Layout -- same in-place-swap pattern as the regular race
        // cards above (changing Track repopulates Layout's own options
        // instead of a full page re-render).
        if (!evt.layout || trackLayoutOptions(evt.track).indexOf(evt.layout) === -1) {
          evt.layout = trackLayoutOptions(evt.track)[0];
        }
        var evtLayoutSelect = wizSelect(trackLayoutOptions(evt.track), evt.layout, function (v) { evt.layout = v; });
        var evtTrackSelect = wizSelect(WIZARD_TRACK_LIST, evt.track, function (v) {
          evt.track = v;
          var opts = trackLayoutOptions(v);
          evt.layout = opts[0];
          evtLayoutSelect.innerHTML = '';
          opts.forEach(function (o) {
            var oe = document.createElement('option');
            oe.value = o; oe.textContent = o;
            evtLayoutSelect.appendChild(oe);
          });
          evtLayoutSelect.value = evt.layout;
        });
        evtTrackSelect.style.maxWidth = '100%';
        card.appendChild(fieldPairRow('Track', evtTrackSelect, 'Layout / Configuration', evtLayoutSelect));

        // Race Length is a plain minutes box here, not the Sprint/Medium/
        // Long tier dropdown regular races use -- a special event doesn't
        // tie into the championship points tables, so there's no tier for
        // it to correlate with (Matt's call). Steps by 10, defaults 60.
        var evtLengthInput = wizNumberInput(evt.raceLengthMinutes, function (v) { evt.raceLengthMinutes = v; }, { min: 5, step: 5 });
        requireField(evtLengthInput, requiredEls);
        var evtWeatherSelect = wizSelect(WIZARD_WEATHER_LIST, evt.weather, function (v) {
          evt.weather = v;
          syncRainInputToWeather(evtWeatherSelect, evtRainInput, function () { evt.chanceOfRain = 0; });
        });
        card.appendChild(fieldPairRow(
          'Race Length (min)', evtLengthInput,
          'Weather', evtWeatherSelect
        ));
        // Only enabled for actual rain-capable Weather values -- see
        // syncRainInputToWeather() (Matt's call).
        var evtRainInput = wizNumberInput(evt.chanceOfRain, function (v) { evt.chanceOfRain = v; }, { min: 0, max: 100, step: 5 });
        requireField(evtRainInput, requiredEls);
        var evtTempInput = wizNumberInput(evt.temperatureC, function (v) { evt.temperatureC = v; }, { min: -10, max: 45, step: 1 });
        requireField(evtTempInput, requiredEls);
        card.appendChild(fieldPairRow('Chance Of Rain (%)', evtRainInput, 'Temperature (°C)', evtTempInput));
        syncRainInputToWeather(evtWeatherSelect, evtRainInput, function () { evt.chanceOfRain = 0; });

        var evtRegLinkInput = wizTextInput(evt.registrationLink, function (v) { evt.registrationLink = v; });
        evtRegLinkInput.style.maxWidth = '100%';
        card.appendChild(wizField('Registration Link', evtRegLinkInput));
        var evtIgPractice = el('input'); evtIgPractice.type = 'time'; evtIgPractice.value = evt.igPracticeStart || '';
        evtIgPractice.addEventListener('input', function () { evt.igPracticeStart = evtIgPractice.value; });
        requireField(evtIgPractice, requiredEls);
        var evtIgQualify = el('input'); evtIgQualify.type = 'time'; evtIgQualify.value = evt.igQualifyStart || '';
        evtIgQualify.addEventListener('input', function () { evt.igQualifyStart = evtIgQualify.value; });
        requireField(evtIgQualify, requiredEls);
        var evtIgRace = el('input'); evtIgRace.type = 'time'; evtIgRace.value = evt.igRaceStart || '';
        evtIgRace.addEventListener('input', function () { evt.igRaceStart = evtIgRace.value; });
        evtIgRace.style.maxWidth = '25%';
        requireField(evtIgRace, requiredEls);
        card.appendChild(fieldPairRow('In-Game Practice Start Time', wizTimeWithBadge(evtIgPractice, 'Sim Time'), 'In-Game Qualify Start Time', wizTimeWithBadge(evtIgQualify, 'Sim Time')));
        card.appendChild(wizField('In-Game Race Start Time', wizTimeWithBadge(evtIgRace, 'Sim Time')));

        // Top-10 money table -- same P1-P10 layout as the championship
        // points tables on the previous page, but every cell is a dollar
        // amount (stepping by $100 instead of 1, Matt's call) instead of a
        // points value. The "Prize Pool ($)" box top-right is the WHOLE
        // pool -- the 10 places below AND the 6 bonus categories both come
        // out of it, not on top of it (Matt's call: "prize pool means the
        // whole prize pool"). It's editable: typing a new total rescales
        // all 16 payouts proportionally to their prior share of the old
        // total, rounded to whole dollars with any rounding remainder
        // absorbed into P1 so the 16 boxes always sum to exactly what was
        // typed. Still re-sums live (read-only direction) whenever any of
        // the 16 boxes changes by hand, same as before.
        var moneyWrap = el('div', 'rc-panel'); moneyWrap.style.marginTop = '10px';
        var moneyHead = el('div', 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;');
        moneyHead.appendChild(el('h4', 'margin:0;font-size:13px;', 'Top 10 Money Payout'));
        var poolTotalInput = el('input'); poolTotalInput.type = 'number'; poolTotalInput.min = 0; poolTotalInput.step = 100;
        poolTotalInput.style.cssText = 'width:90px;max-width:90px;display:inline-block;margin:0;';
        var poolWrap = el('span', 'font-size:12px;color:var(--rc-steel);display:flex;align-items:center;gap:6px;');
        poolWrap.appendChild(document.createTextNode('Prize Pool ($)'));
        poolWrap.appendChild(poolTotalInput);
        moneyHead.appendChild(poolWrap);
        moneyWrap.appendChild(moneyHead);
        var moneyInputs = [];
        var bonusInputs = [];
        function poolTotalNow() {
          var placesSum = evt.moneyPlaces.reduce(function (s, v) { return s + (Number(v) || 0); }, 0);
          var bonusSum = SPECIAL_EVENT_BONUS_CATEGORIES.reduce(function (s, c) { return s + (Number(evt.bonusPayouts[c.key]) || 0); }, 0);
          return placesSum + bonusSum;
        }
        function refreshPoolTotal() {
          poolTotalInput.value = poolTotalNow();
        }
        // Typing a new total and tabbing/clicking away rescales all 16
        // payouts to match it, keeping each one's prior share of the pool.
        poolTotalInput.addEventListener('change', function () {
          var newTotal = Math.max(0, Number(poolTotalInput.value) || 0);
          var oldTotal = poolTotalNow();
          var allVals = evt.moneyPlaces.concat(SPECIAL_EVENT_BONUS_CATEGORIES.map(function (c) { return Number(evt.bonusPayouts[c.key]) || 0; }));
          var scaled;
          if (oldTotal > 0) {
            scaled = allVals.map(function (v) { return Math.round((Number(v) || 0) / oldTotal * newTotal); });
          } else {
            // Nothing to scale a share FROM (every box was $0) -- split
            // the new total evenly across all 16 as a reasonable fallback.
            var share = Math.floor(newTotal / allVals.length);
            scaled = allVals.map(function () { return share; });
          }
          // Rounding to whole dollars can leave the 16 boxes a few dollars
          // short of/over what was typed -- the remainder goes to P1 so
          // the total always matches exactly (Matt's call elsewhere on
          // this same remainder pattern for points tables).
          var scaledSum = scaled.reduce(function (s, v) { return s + v; }, 0);
          scaled[0] += (newTotal - scaledSum);

          evt.moneyPlaces.forEach(function (v, i) { evt.moneyPlaces[i] = scaled[i]; moneyInputs[i].value = scaled[i]; });
          SPECIAL_EVENT_BONUS_CATEGORIES.forEach(function (c, i) {
            var v = scaled[evt.moneyPlaces.length + i];
            evt.bonusPayouts[c.key] = v;
            bonusInputs[i].value = v;
          });
          refreshPoolTotal();
        });
        var moneyTable = document.createElement('table');
        moneyTable.style.cssText = 'width:100%;margin-top:8px;border-collapse:collapse;';
        var moneyHeadRow = document.createElement('tr');
        for (var p = 1; p <= 10; p++) {
          var th = document.createElement('td');
          th.style.cssText = 'font-size:10px;color:var(--rc-steel);text-align:center;padding:2px;';
          th.textContent = 'P' + p;
          moneyHeadRow.appendChild(th);
        }
        moneyTable.appendChild(moneyHeadRow);
        var moneyInputRow = document.createElement('tr');
        evt.moneyPlaces.forEach(function (val, pIdx) {
          var td = document.createElement('td');
          td.style.padding = '2px';
          var input = wizNumberInput(val, function (v) { evt.moneyPlaces[pIdx] = v; refreshPoolTotal(); }, { min: 0, step: 100 });
          input.style.cssText = 'width:100%;max-width:100%;text-align:center;padding:4px;margin:0;box-sizing:border-box;';
          requireField(input, requiredEls);
          moneyInputs.push(input);
          td.appendChild(input);
          moneyInputRow.appendChild(td);
        });
        moneyTable.appendChild(moneyInputRow);
        moneyWrap.appendChild(moneyTable);
        card.appendChild(moneyWrap);
        refreshPoolTotal();

        // Fun one-off bonus categories, each with its own payout box --
        // laid out two columns wide instead of one long stacked column
        // (Matt's call). These come OUT OF the Prize Pool total above,
        // not on top of it, so changing one re-sums the pool too.
        var bonusWrap = el('div', 'rc-panel'); bonusWrap.style.marginTop = '10px';
        bonusWrap.appendChild(el('h4', 'margin:0 0 8px;font-size:13px;', 'Bonus Categories'));
        var bonusGrid = el('div', 'rc-bonus-payout-grid');
        SPECIAL_EVENT_BONUS_CATEGORIES.forEach(function (cat) {
          var catInput = wizNumberInput(evt.bonusPayouts[cat.key], function (v) { evt.bonusPayouts[cat.key] = v; refreshPoolTotal(); }, { min: 0 });
          requireField(catInput, requiredEls);
          bonusInputs.push(catInput);
          var field = el('div');
          field.appendChild(wizLabel(cat.label + ' ($)'));
          field.appendChild(catInput);
          bonusGrid.appendChild(field);
        });
        bonusWrap.appendChild(bonusGrid);
        card.appendChild(bonusWrap);

        container.appendChild(card);
      });
    }
  }

  function openSeasonWizard() {
    var existingDraft = loadWizardDraft();
    var state = existingDraft || defaultWizardState();
    var stepIndex = 0;
    var modal = showModal('Create a Season', { wide: true, onClose: function () { if (typeof renderLeagueSection === 'function') renderLeagueSection(); } });
    var body = modal.body;
    var stepsBar = el('div', 'rc-wizard-steps');
    var contentWrap = el('div', 'rc-wizard-content');
    var footerBar = el('div', 'rc-wizard-actions');
    body.appendChild(stepsBar);
    body.appendChild(contentWrap);
    body.appendChild(footerBar);

    var lastStep = WIZARD_STEPS.length - 1;
    var currentRequiredEls = [];
    // Highest step the admin has actually earned by clearing validation --
    // step pills beyond this are dimmed and inert until Next successfully
    // clears the current page (Matt's call: pills "unlock" one at a time
    // instead of being freely clickable ahead of where the admin is).
    var maxUnlockedStep = 0;

    // Resuming an already-started draft: unlock pills up through any page
    // that's already fully filled out, so the admin can jump straight to
    // where they left off by clicking a pill instead of re-clicking Next
    // through pages they already finished (Matt's call). Each page is
    // rendered once into a detached, never-shown container purely to run
    // its real requireField/requireGroup validity checks against the
    // saved state -- same validation the live page uses, just off-screen
    // and thrown away afterward.
    if (existingDraft) {
      var probeEls0 = [];
      renderWizardSeasonDetailsPage(state, el('div'), probeEls0);
      if (probeEls0.every(function (entry) { return entry.isValid(); })) {
        maxUnlockedStep = 1;
        syncRaceCount(state); syncByeWeekDates(state); syncSpecialEvents(state);
        var probeEls1 = [];
        renderWizardRaceEventsPage(state, el('div'), probeEls1);
        if (probeEls1.every(function (entry) { return entry.isValid(); })) {
          maxUnlockedStep = 2;
        }
      }
    }

    function goToStep(i) {
      saveWizardDraft(state);
      stepIndex = i;
      renderStep();
    }

    // Hard stop before Next is allowed to advance -- "every box has to be
    // filled out" (Matt's call). Marks every currently-invalid field red
    // and returns false; a field that's now valid gets cleared even if it
    // was previously marked, so fixing things and clicking Next again
    // only shows what's STILL wrong.
    function validateCurrentStep() {
      var allValid = true;
      currentRequiredEls.forEach(function (entry) {
        if (entry.isValid()) { entry.clearInvalid(); }
        else { entry.markInvalid(); allValid = false; }
      });
      return allValid;
    }
    function shakeModal() {
      modal.el.classList.remove('rc-shake');
      void modal.el.offsetWidth; // force reflow so back-to-back failed attempts still shake
      modal.el.classList.add('rc-shake');
    }

    function renderStep() {
      stepsBar.innerHTML = '';
      WIZARD_STEPS.forEach(function (label, i) {
        var locked = i > maxUnlockedStep;
        var cls = 'rc-wizard-step' + (i === stepIndex ? ' rc-wizard-step-active' : '') + (i < stepIndex ? ' rc-wizard-step-done' : '') + (locked ? ' rc-wizard-step-locked' : '');
        var bubble = el('div', cls, (i + 1) + '. ' + escapeHtml(label));
        // Bubbles are clickable so the admin can jump straight to any
        // page they've already earned access to instead of only stepping
        // through Next/Back (Matt's call) -- but a step ahead of where
        // Next has actually validated stays dimmed and inert until it
        // unlocks.
        if (!locked) {
          bubble.style.cursor = 'pointer';
          bubble.addEventListener('click', function () { if (i !== stepIndex) goToStep(i); });
        }
        stepsBar.appendChild(bubble);
      });

      contentWrap.innerHTML = '';
      currentRequiredEls = [];
      if (stepIndex === 0) renderWizardSeasonDetailsPage(state, contentWrap, currentRequiredEls);
      else if (stepIndex === 1) {
        syncRaceCount(state); syncByeWeekDates(state); syncSpecialEvents(state);
        renderWizardRaceEventsPage(state, contentWrap, currentRequiredEls);
      }
      else renderWizardPreviewPage(state, contentWrap);
      contentWrap.scrollTop = 0;

      footerBar.innerHTML = '';

      if (stepIndex === lastStep) {
        // Last page (Season Preview): Save & Close stays lower-LEFT, same
        // spot as every other page (Matt's call: "keep Save and Close
        // button on lower left side for every page") -- it used to move
        // over to the right just on this page, which was the odd one out.
        // Back, then Create Season/Create a Future Season to ITS right,
        // both sit lower-right (Matt's call: "move the create season and
        // create future season button to the right of the back button").
        footerBar.style.alignItems = 'flex-end';

        var saveBtn = el('button', null, 'Save & Close');
        saveBtn.className = 'rc-btn-secondary rc-btn-sm'; saveBtn.type = 'button';
        saveBtn.addEventListener('click', function () { saveWizardDraft(state); modal.close(); });
        footerBar.appendChild(saveBtn);

        var rightGroup = el('div', 'display:flex;gap:8px;align-items:flex-end;');

        var backBtn = el('button', null, 'Back');
        backBtn.className = 'rc-btn-secondary rc-btn-sm rc-btn-nav'; backBtn.type = 'button';
        backBtn.addEventListener('click', function () { goToStep(stepIndex - 1); });
        rightGroup.appendChild(backBtn);

        // position:relative so the Release Date/Time panel below can be
        // absolutely positioned OUT of normal flow -- it floats above
        // this button row instead of pushing it (and Back/Save & Close,
        // its footerBar siblings) downward when it opens (Matt's call:
        // "don't let the release date and time move the BACK and SAVE &
        // CLOSE buttons down with it").
        var createWrap = el('div', 'position:relative;');
        var btnRow = el('div', 'display:flex;gap:8px;flex-wrap:wrap;');
        var createNowBtn = el('button', null, 'Create Season');
        createNowBtn.className = 'rc-btn-primary rc-btn-sm'; createNowBtn.type = 'button';
        createNowBtn.addEventListener('click', function () { state.releaseMode = 'now'; finishWizard(); });
        btnRow.appendChild(createNowBtn);

        var futureBtn = el('button', null, 'Create a Future Season');
        futureBtn.className = 'rc-btn-secondary rc-btn-sm'; futureBtn.type = 'button';
        btnRow.appendChild(futureBtn);
        createWrap.appendChild(btnRow);

        // Floats above the button row (bottom:100%) rather than sitting
        // inline below it, so opening it never changes createWrap's own
        // height/flow.
        var futurePanel = el('div', 'rc-panel');
        futurePanel.style.cssText = 'position:absolute;bottom:calc(100% + 8px);right:0;display:none;width:320px;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,0.15);';
        var futureHead = el('div', 'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;');
        futureHead.appendChild(el('span', 'font-family:var(--rc-font-heading);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--rc-carbon);', 'Release Date/Time'));
        var closeFutureBtn = el('button', null, '×');
        closeFutureBtn.type = 'button';
        closeFutureBtn.style.cssText = 'background:none;border:none;font-size:18px;line-height:1;color:var(--rc-steel);cursor:pointer;padding:0 2px;';
        futureHead.appendChild(closeFutureBtn);
        futurePanel.appendChild(futureHead);
        var dt = el('input'); dt.type = 'datetime-local'; dt.value = state.releaseDateTime || '';
        dt.style.margin = '0';
        dt.addEventListener('input', function () { state.releaseDateTime = dt.value; });
        futurePanel.appendChild(dt);
        futurePanel.appendChild(el('div', 'rc-hint',
          'Real team seats are first-come-first-served, so a scheduled release gives every driver an equal shot at one.'));
        var confirmFutureBtn = el('button', null, 'Confirm & Create');
        confirmFutureBtn.className = 'rc-btn-primary rc-btn-sm'; confirmFutureBtn.type = 'button';
        confirmFutureBtn.addEventListener('click', function () { state.releaseMode = 'scheduled'; finishWizard(); });
        futurePanel.appendChild(confirmFutureBtn);
        createWrap.appendChild(futurePanel);

        // While the Release Date/Time panel is open, Create Season/Create
        // a Future Season are inert (disabled, not just visually dimmed)
        // -- the admin either Confirms & Creates or X's out first (Matt's
        // call). Closing via X re-enables both.
        function openFuturePanel() {
          futurePanel.style.display = 'block';
          createNowBtn.disabled = true;
          futureBtn.disabled = true;
        }
        function closeFuturePanel() {
          futurePanel.style.display = 'none';
          createNowBtn.disabled = false;
          futureBtn.disabled = false;
        }
        futureBtn.addEventListener('click', openFuturePanel);
        closeFutureBtn.addEventListener('click', closeFuturePanel);
        rightGroup.appendChild(createWrap);

        footerBar.appendChild(rightGroup);
      } else {
        // Pages 1-2: unchanged layout -- Save & Close on the left,
        // Back (if any)/Next on the right.
        footerBar.style.alignItems = 'center';

        var saveBtnNorm = el('button', null, 'Save & Close');
        saveBtnNorm.className = 'rc-btn-secondary rc-btn-sm'; saveBtnNorm.type = 'button';
        saveBtnNorm.addEventListener('click', function () { saveWizardDraft(state); modal.close(); });
        footerBar.appendChild(saveBtnNorm);

        var navOuter = el('div');
        var navGroup = el('div', 'display:flex;gap:8px;');
        if (stepIndex > 0) {
          var backBtnNorm = el('button', null, 'Back');
          backBtnNorm.className = 'rc-btn-secondary rc-btn-sm rc-btn-nav'; backBtnNorm.type = 'button';
          backBtnNorm.addEventListener('click', function () { goToStep(stepIndex - 1); });
          navGroup.appendChild(backBtnNorm);
        }
        var nextBtn = el('button', null, 'Next');
        nextBtn.className = 'rc-btn-primary rc-btn-sm rc-btn-nav'; nextBtn.type = 'button';
        nextBtn.addEventListener('click', function () {
          if (validateCurrentStep()) {
            maxUnlockedStep = Math.max(maxUnlockedStep, stepIndex + 1);
            goToStep(stepIndex + 1);
          } else {
            // No banner text -- the shake plus every still-empty box
            // turning red is enough on its own (Matt's call).
            shakeModal();
            var firstInvalid = contentWrap.querySelector('.rc-field-invalid, .rc-field-invalid-group');
            if (firstInvalid) firstInvalid.scrollIntoView({ block: 'center' });
          }
        });
        navGroup.appendChild(nextBtn);
        navOuter.appendChild(navGroup);
        footerBar.appendChild(navOuter);
      }
    }

    // v0.19 -- wired to the real backend. Reuses buildSpinner()'s visual
    // language (see above) for the round-trip to action=createSeason
    // (handleCreateSeason, 4_DataCache.gs). Payload field names mirror
    // that handler's own contract exactly (see 1_Core.gs's router-doc
    // comment above doGet/doPost) -- races gets its `date` field filled
    // in here from computeRaceDates(state), same client-side scheduling
    // math the Race Events page and Preview page already use, since the
    // wizard's own state.races entries never carry a date themselves
    // (it's always derived, not stored, so Bye Week changes stay in
    // sync automatically). On success the draft is cleared (this season
    // is now real, there's nothing left to resume) and League
    // Management's button flips back to "Create Season" the moment the
    // modal closes (see openSeasonWizard's onClose above). On failure or
    // a network error, the draft is left untouched so the admin can
    // just try again -- nothing about this call is destructive to their
    // work if it doesn't go through.
    function finishWizard() {
      saveWizardDraft(state);
      contentWrap.innerHTML = '';
      contentWrap.appendChild(buildSpinner('Creating season...'));
      footerBar.innerHTML = '';

      var raceDates = computeRaceDates(state);
      var racesPayload = state.races.map(function (race, idx) {
        return {
          date: raceDates[idx] || '',
          track: race.track, layout: race.layout, weather: race.weather, tier: race.tier,
          chanceOfRain: race.chanceOfRain, temperatureC: race.temperatureC,
          passwordOverride: race.passwordOverride, registrationLink: race.registrationLink,
          igPracticeStart: race.igPracticeStart, igQualifyStart: race.igQualifyStart, igRaceStart: race.igRaceStart
        };
      });

      var payload = {
        seasonName: state.seasonName,
        releaseMode: state.releaseMode,
        releaseDateTime: state.releaseDateTime,
        classes: state.classes,
        classSeasons: state.classSeasons,
        dropWeeks: state.dropWeeks,
        bonusPole: state.bonusPole,
        bonusFastestLap: state.bonusFastestLap,
        bonusMostLapsLed: state.bonusMostLapsLed,
        pointsTables: state.pointsTables,
        seasonStartDate: state.seasonStartDate,
        seasonStartTime: state.seasonStartTime,
        defaultPassword: state.defaultPassword,
        raceSettings: state.raceSettings,
        economy: state.economy,
        byeWeekDates: state.byeWeekDates,
        specialEvents: state.specialEvents,
        races: racesPayload
      };

      function showResultPanel(ok, title, message) {
        contentWrap.innerHTML = '';
        var note = el('div', 'rc-panel');
        note.style.borderColor = ok ? 'var(--rc-ok)' : 'var(--rc-red)';
        note.appendChild(el('h3', 'margin-top:0;', title));
        note.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', message));
        var closeBtn = el('button', null, 'Close');
        closeBtn.className = 'rc-btn-primary rc-btn-sm'; closeBtn.type = 'button';
        closeBtn.addEventListener('click', modal.close);
        note.appendChild(closeBtn);
        contentWrap.appendChild(note);
      }

      fetchApi('createSeason', { method: 'POST', token: token, body: payload })
        .then(function (data) {
          if (data && data.success) {
            clearWizardDraft();
            showResultPanel(true, 'Season Created',
              data.message || ('Season "' + (data.seasonName || state.seasonName) + '" created.'));
          } else {
            showResultPanel(false, 'Could Not Create Season',
              (data && data.message) || 'Something went wrong talking to the server. Your draft is untouched, so it\'s safe to try again.');
          }
        })
        .catch(function () {
          showResultPanel(false, 'Could Not Reach The Server',
            'Check your connection and try again — your draft is untouched.');
        });
    }

    renderStep();
  }

  // -----------------------------------------------------------------------
  // DRIVERS — lists every ProfileID row (not just logins -- a driver added
  // without a login still shows up, see handleAdminListDrivers). Sortable
  // by first or last name (Matt's call). Add opens handleAdminAddDriver's
  // combined profile+optional-login flow; Edit covers the profile fields
  // handleAdminUpdateProfile supports, plus username/email/reset-password
  // if a login exists, plus a one-click "Create Login" if it doesn't.
  // Approving/rejecting a PENDING signup still happens from Admin >
  // Pending Approvals (unchanged) -- this panel is the full roster, not
  // the approval queue, so it isn't duplicated here.
  // -----------------------------------------------------------------------
  function driversManagementSection(token, preloaded) {
    var box = el('div', 'rc-panel');
    box.appendChild(el('h3', 'margin-top:0;margin-bottom:14px;', 'Drivers'));

    var toolbar = el('div', 'display:flex;align-items:center;gap:8px;margin-bottom:10px;');
    var addBtn = el('button', null, 'Add Driver');
    addBtn.className = 'rc-btn-primary rc-btn-sm';
    toolbar.appendChild(addBtn);
    box.appendChild(toolbar);

    var listBody = el('div', 'font-size:13px;color:var(--rc-steel);', 'Loading...');
    box.appendChild(listBody);

    var driversData = [];

    // Always alphabetical by first name, then last name as a tiebreaker --
    // no sort-choice buttons (Matt's call: he'll never want anything but
    // alphabetical, so a toolbar full of sort options is just clutter).
    function renderList() {
      var sorted = driversData.slice().sort(function (a, b) {
        var av = ((a.firstName || '') + ' ' + (a.lastName || '') || a.primaryName || '').toLowerCase();
        var bv = ((b.firstName || '') + ' ' + (b.lastName || '') || b.primaryName || '').toLowerCase();
        return av < bv ? -1 : av > bv ? 1 : 0;
      });
      listBody.innerHTML = '';
      if (!sorted.length) { listBody.textContent = 'No drivers yet.'; return; }
      sorted.forEach(function (d) { listBody.appendChild(driverRow(d)); });
    }

    function loadDrivers() {
      fetchApi('adminListDrivers', { token: token }).then(function (data) {
        if (!data.success) { listBody.textContent = data.message || 'Could not load drivers.'; return; }
        driversData = data.drivers || [];
        renderList();
      });
    }

    function driverRow(d) {
      var wrap = el('div', 'padding:10px 0;border-bottom:1px solid var(--rc-silver);');
      var summary = el('div', 'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;');
      var left = el('div', 'display:flex;align-items:center;flex-wrap:wrap;');
      var fullName = [d.firstName, d.lastName, d.suffix].filter(Boolean).join(' ') || d.primaryName || '(no name)';
      left.innerHTML = '<strong>' + escapeHtml(fullName) + '</strong> &middot; ' + escapeHtml(d.profileId);
      if (d.username) {
        left.innerHTML += ' &middot; @' + escapeHtml(d.username) + ' (' + escapeHtml(d.role || '') + ')';
      } else {
        var noLogin = el('span', 'font-size:12px;color:var(--rc-steel);margin-left:6px;', '(no login)');
        left.appendChild(noLogin);
      }
      summary.appendChild(left);
      var editBtn = el('button', null, 'Edit');
      editBtn.className = 'rc-btn-secondary rc-btn-row';
      editBtn.addEventListener('click', function () { openEditDriverModal(d); });
      summary.appendChild(editBtn);
      wrap.appendChild(summary);
      return wrap;
    }

    function openAddDriverModal() {
      var modal = showModal('Add Driver');
      var body = modal.body;
      var firstInput = wizTextInput('', function () {});
      var lastInput = wizTextInput('', function () {});
      var suffixSelect = wizSuffixSelect('');
      body.appendChild(wizLabel('First Name')); body.appendChild(firstInput);
      body.appendChild(wizLabel('Last Name')); body.appendChild(lastInput);
      body.appendChild(wizLabel('Suffix (optional)')); body.appendChild(suffixSelect);

      var loginNote = el('div', 'margin-top:14px;padding-top:12px;border-top:1px solid var(--rc-silver);font-size:12px;font-weight:600;color:var(--rc-steel);', 'LOGIN (OPTIONAL)');
      body.appendChild(loginNote);
      var userInput = wizTextInput('', function () {});
      var passInput = wizTextInput('', function () {}); passInput.type = 'password';
      var roleSelect = wizSelect(['Driver', 'Organizer', 'Admin'], 'Driver', function () {});
      var emailInput = wizTextInput('', function () {});
      body.appendChild(wizLabel('Username')); body.appendChild(userInput);
      body.appendChild(wizLabel('Password')); body.appendChild(passInput);
      body.appendChild(wizLabel('Role')); body.appendChild(roleSelect);
      body.appendChild(wizLabel('Email')); body.appendChild(emailInput);

      var saveBtn = el('button', null, 'Add Driver'); saveBtn.className = 'rc-btn-primary rc-btn-sm'; saveBtn.style.marginTop = '14px';
      var status = el('div', 'margin-top:6px;font-size:13px;');
      saveBtn.addEventListener('click', function () {
        if (!firstInput.value.trim() || !lastInput.value.trim()) {
          status.style.color = 'var(--rc-red)'; status.textContent = 'First and last name are required.'; return;
        }
        fetchApi('adminAddDriver', {
          method: 'POST', token: token, body: {
            firstName: firstInput.value.trim(), lastName: lastInput.value.trim(), suffix: suffixSelect.value,
            username: userInput.value.trim(), password: passInput.value, role: roleSelect.value, email: emailInput.value.trim()
          }
        }).then(function (data) {
          status.style.color = data.success ? 'var(--rc-ok)' : 'var(--rc-red)';
          status.textContent = data.message || (data.success ? 'Added.' : 'Could not add driver.');
          if (data.success) { loadDrivers(); setTimeout(modal.close, 900); }
        });
      });
      body.appendChild(saveBtn);
      body.appendChild(status);
    }
    addBtn.addEventListener('click', openAddDriverModal);

    function openEditDriverModal(d) {
      var modal = showModal('Edit ' + (d.firstName || d.primaryName));
      var body = modal.body;
      var firstInput = wizTextInput(d.firstName || '', function () {});
      var lastInput = wizTextInput(d.lastName || '', function () {});
      var suffixSelect = wizSuffixSelect(d.suffix || '');
      body.appendChild(wizLabel('First Name')); body.appendChild(firstInput);
      body.appendChild(wizLabel('Last Name')); body.appendChild(lastInput);
      body.appendChild(wizLabel('Suffix')); body.appendChild(suffixSelect);

      // One combined Save Changes button at the bottom handles the profile
      // fields plus whichever login action applies -- updating the
      // username (and, if filled in, resetting the password) if a login
      // already exists, or creating one if it doesn't and the admin
      // filled in the optional fields below. No more separate save
      // buttons per sub-form (Matt's call). Password reset lives here now
      // instead of the old Admin > Manage Users panel, which is gone --
      // this Drivers panel is the one place to manage a driver's account.
      var unameInput = null, resetPassInput = null, newUserInput = null, newPassInput = null;

      if (d.userId) {
        var loginWrap = el('div', 'margin-top:16px;padding-top:12px;border-top:1px solid var(--rc-silver);');
        loginWrap.appendChild(el('div', 'font-size:12px;font-weight:600;color:var(--rc-steel);', 'LOGIN ACCOUNT'));
        unameInput = wizTextInput(d.username || '', function () {});
        loginWrap.appendChild(wizLabel('Username')); loginWrap.appendChild(unameInput);
        resetPassInput = wizTextInput('', function () {}); resetPassInput.type = 'password';
        loginWrap.appendChild(wizLabel('Reset Password (optional, 6+ chars)')); loginWrap.appendChild(resetPassInput);
        body.appendChild(loginWrap);
      } else {
        var createLoginWrap = el('div', 'margin-top:16px;padding-top:12px;border-top:1px solid var(--rc-silver);');
        createLoginWrap.appendChild(el('div', 'font-size:12px;font-weight:600;color:var(--rc-steel);', 'NO LOGIN YET (optional -- fill in to create one)'));
        newUserInput = wizTextInput('', function () {});
        newPassInput = wizTextInput('', function () {}); newPassInput.type = 'password';
        createLoginWrap.appendChild(wizLabel('Username')); createLoginWrap.appendChild(newUserInput);
        createLoginWrap.appendChild(wizLabel('Temporary Password')); createLoginWrap.appendChild(newPassInput);
        body.appendChild(createLoginWrap);
      }

      var saveBtn = el('button', null, 'Save Changes'); saveBtn.className = 'rc-btn-primary rc-btn-sm'; saveBtn.style.marginTop = '14px';
      var status = el('div', 'margin-top:6px;font-size:13px;');
      saveBtn.addEventListener('click', function () {
        saveBtn.disabled = true;
        var calls = [
          fetchApi('adminUpdateProfile', {
            method: 'POST', token: token, body: {
              targetProfileId: d.profileId, firstName: firstInput.value.trim(), lastName: lastInput.value.trim(), suffix: suffixSelect.value
            }
          })
        ];
        if (d.userId && unameInput) {
          calls.push(fetchApi('adminUpdateUser', { method: 'POST', token: token, body: { targetUserId: d.userId, username: unameInput.value.trim() } }));
          if (resetPassInput && resetPassInput.value) {
            calls.push(fetchApi('adminResetPassword', { method: 'POST', token: token, body: { targetUserId: d.userId, newPassword: resetPassInput.value } }));
          }
        } else if (!d.userId && newUserInput && newUserInput.value.trim()) {
          calls.push(fetchApi('adminCreateUser', { method: 'POST', token: token, body: { username: newUserInput.value.trim(), password: newPassInput.value, role: 'Driver', profileId: d.profileId } }));
        }
        Promise.all(calls).then(function (results) {
          saveBtn.disabled = false;
          var allOk = results.every(function (r) { return r && r.success; });
          status.style.color = allOk ? 'var(--rc-ok)' : 'var(--rc-red)';
          status.textContent = allOk ? 'Saved.' : results.map(function (r) { return r && r.message; }).filter(Boolean).join(' ');
          if (allOk) { loadDrivers(); setTimeout(modal.close, 900); }
        });
      });
      body.appendChild(saveBtn);
      body.appendChild(status);
    }

    if (preloaded && preloaded.success) { driversData = preloaded.drivers || []; renderList(); }
    else loadDrivers();
    return box;
  }

  // -----------------------------------------------------------------------
  // TRACKS — one collapsible group per TrackName, always alphabetical.
  // v0.19 -- manual reordering (up/down arrows, persisted SortOrder) is
  // gone (Matt's call: no controls needed when it's always A-Z anyway).
  // The Season Wizard's track dropdown reads the same alphabetical order
  // now too -- see loadWizardTrackList() sorting WIZARD_TRACK_LIST/
  // WIZARD_TRACK_LAYOUTS client-side, so nothing downstream is still
  // silently keyed off the old SortOrder column. That column and
  // adminReorderTracks still exist server-side (6_Auth.gs/5_Website.gs,
  // untouched) -- just nothing in the UI calls them anymore. Deactivate/
  // Reactivate never deletes a row.
  // -----------------------------------------------------------------------
  function tracksManagementSection(token, preloaded) {
    var box = el('div', 'rc-panel');
    box.appendChild(el('h3', 'margin-top:0;margin-bottom:14px;', 'Tracks'));

    var toolbar = el('div', 'display:flex;align-items:center;gap:8px;margin-bottom:10px;');
    var addBtn = el('button', null, 'Add Track'); addBtn.className = 'rc-btn-primary rc-btn-sm';
    toolbar.appendChild(addBtn);
    box.appendChild(toolbar);

    var listBody = el('div', 'font-size:13px;color:var(--rc-steel);', 'Loading...');
    box.appendChild(listBody);

    var tracksData = [];
    var groupExpanded = {}; // trackName -> bool, defaults COLLAPSED on load (Matt's call), same pattern as the Cars panel below

    function renderGroup(g) {
      var expanded = groupExpanded.hasOwnProperty(g.name) ? groupExpanded[g.name] : false;
      var groupWrap = el('div', 'padding:8px 0;border-bottom:1px solid var(--rc-silver);');
      var header = el('div', null, (expanded ? '▼ ' : '▶ ') + g.name + ' (' + g.rows.length + ' layout' + (g.rows.length === 1 ? '' : 's') + ')');
      header.style.cssText = 'font-weight:700;font-family:var(--rc-font-head);font-size:14px;cursor:pointer;user-select:none;';
      header.addEventListener('click', function () { groupExpanded[g.name] = !expanded; renderList(); });
      groupWrap.appendChild(header);
      if (expanded) {
        var rowsWrap = el('div', 'margin-top:4px;');
        g.rows.forEach(function (t) { rowsWrap.appendChild(trackRow(t)); });
        groupWrap.appendChild(rowsWrap);
      }
      listBody.appendChild(groupWrap);
    }

    function renderList() {
      listBody.innerHTML = '';
      if (!tracksData.length) { listBody.textContent = 'No tracks yet.'; return; }
      var alpha = function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0; };
      var byName = {};
      tracksData.forEach(function (t) {
        if (!byName[t.trackName]) byName[t.trackName] = { name: t.trackName, rows: [] };
        byName[t.trackName].rows.push(t);
      });
      var groups = Object.keys(byName).sort(alpha).map(function (name) { return byName[name]; });
      groups.forEach(function (g) { g.rows.sort(function (a, b) { return alpha(a.layout, b.layout); }); });
      groups.forEach(function (g) { renderGroup(g); });
    }

    function loadTracks() {
      fetchApi('adminListTracks', { token: token }).then(function (data) {
        if (!data.success) { listBody.textContent = data.message || 'Could not load tracks.'; return; }
        tracksData = data.tracks || [];
        renderList();
      });
    }

    function trackRow(t) {
      var wrap = el('div', 'padding:4px 0 4px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;');
      var left = el('div', 'display:flex;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--rc-steel);');
      left.innerHTML = escapeHtml(t.layout);
      left.appendChild(activePill(t.active));
      wrap.appendChild(left);

      var actions = el('div', 'display:flex;gap:6px;align-items:center;');
      var toggleBtn = el('button', null, t.active ? 'Deactivate' : 'Reactivate');
      toggleBtn.type = 'button'; toggleBtn.className = 'rc-btn-secondary rc-btn-row';
      toggleBtn.addEventListener('click', function () {
        // Optimistic: flip the pill/label right away, save in the
        // background, only revert + repaint if the save actually fails.
        // We never need to re-read the sheet to know what we just wrote.
        var prevActive = t.active;
        t.active = !t.active;
        renderList();
        fetchApi('adminSetTrackActive', { method: 'POST', token: token, body: { trackName: t.trackName, layout: t.layout, active: t.active } })
          .then(function (data) { if (!data.success) { t.active = prevActive; renderList(); } });
      });
      actions.appendChild(toggleBtn);
      wrap.appendChild(actions);
      return wrap;
    }

    function openAddTrackModal() {
      var modal = showModal('Add Track');
      var body = modal.body;
      var nameInput = wizTextInput('', function () {});
      var layoutInput = wizTextInput('', function () {});
      body.appendChild(wizLabel('Track Name')); body.appendChild(nameInput);
      body.appendChild(wizLabel('Layout')); body.appendChild(layoutInput);
      var saveBtn = el('button', null, 'Add Track'); saveBtn.className = 'rc-btn-primary rc-btn-sm'; saveBtn.style.marginTop = '14px';
      var status = el('div', 'margin-top:6px;font-size:13px;');
      saveBtn.addEventListener('click', function () {
        fetchApi('adminAddTrack', { method: 'POST', token: token, body: { trackName: nameInput.value.trim(), layout: layoutInput.value.trim() } })
          .then(function (data) {
            status.style.color = data.success ? 'var(--rc-ok)' : 'var(--rc-red)';
            status.textContent = data.message || '';
            if (data.success) { loadTracks(); setTimeout(modal.close, 900); }
          });
      });
      body.appendChild(saveBtn);
      body.appendChild(status);
    }
    addBtn.addEventListener('click', openAddTrackModal);

    if (preloaded && preloaded.success) { tracksData = preloaded.tracks || []; renderList(); }
    else loadTracks();
    return box;
  }

  // -----------------------------------------------------------------------
  // CARS — grouped into one collapsible section per class (LMGT3, LMP2,
  // LMP3, Hypercar -- Matt's call, replacing the old flat wall-of-text
  // list), and inside each class, one collapsible sub-group per season
  // (oldest first) instead of a "· 2026" tag hanging off every car name.
  // Everything loads collapsed -- no sort-choice buttons anywhere in this
  // panel, since it's always alphabetical by Manufacturer within a
  // season (Matt's call: he'll never want it sorted any other way, so a
  // row of sort buttons was just clutter). A class with zero cars still
  // shows its header (greyed) so it's obvious nothing's missing, just
  // empty. EntryID is always auto-assigned server-side (nextCarEntryId,
  // 5_Website.gs) -- never typed here, and (per Matt's call) it's tucked
  // into the Edit modal only, not shown in the at-a-glance list.
  // -----------------------------------------------------------------------
  function carsManagementSection(token, preloaded) {
    var box = el('div', 'rc-panel');
    box.appendChild(el('h3', 'margin-top:0;margin-bottom:14px;', 'Cars'));

    var toolbar = el('div', 'display:flex;align-items:center;gap:8px;margin-bottom:10px;');
    var addBtn = el('button', null, 'Add Car'); addBtn.className = 'rc-btn-primary rc-btn-sm';
    toolbar.appendChild(addBtn);
    box.appendChild(toolbar);

    var listBody = el('div', 'font-size:13px;color:var(--rc-steel);', 'Loading...');
    box.appendChild(listBody);

    var carsData = [];
    var classExpanded = {};  // class -> bool, defaults COLLAPSED on load
    var seasonExpanded = {}; // "class||season" -> bool, defaults COLLAPSED on load

    function alphabetical(list) {
      return list.slice().sort(function (a, b) {
        var av = String(a.manufacturer || '').toLowerCase();
        var bv = String(b.manufacturer || '').toLowerCase();
        return av < bv ? -1 : av > bv ? 1 : 0;
      });
    }

    function renderSeasonGroup(cls, season, carsInSeason) {
      var key = cls + '||' + season;
      var expanded = seasonExpanded.hasOwnProperty(key) ? seasonExpanded[key] : false;
      var wrap = el('div', 'padding:6px 0;');
      var header = el('div', null, (expanded ? '▼ ' : '▶ ') + season + ' (' + carsInSeason.length + ' car' + (carsInSeason.length === 1 ? '' : 's') + ')');
      header.style.cssText = 'font-weight:600;font-family:var(--rc-font-head);font-size:13px;color:var(--rc-steel);cursor:pointer;user-select:none;';
      header.addEventListener('click', function () { seasonExpanded[key] = !expanded; renderList(); });
      wrap.appendChild(header);
      if (expanded) {
        var rowsWrap = el('div', 'margin-top:4px;');
        alphabetical(carsInSeason).forEach(function (c) { rowsWrap.appendChild(carRow(c)); });
        wrap.appendChild(rowsWrap);
      }
      return wrap;
    }

    function renderClassGroup(label, inClass) {
      var expanded = classExpanded.hasOwnProperty(label) ? classExpanded[label] : false;
      var groupWrap = el('div', 'padding:8px 0;border-bottom:1px solid var(--rc-silver);');
      var header = el('div', null, (expanded ? '▼ ' : '▶ ') + label + ' (' + inClass.length + ' car' + (inClass.length === 1 ? '' : 's') + ')');
      header.style.cssText = 'font-weight:700;font-family:var(--rc-font-head);font-size:14px;cursor:pointer;user-select:none;' + (inClass.length ? '' : 'opacity:0.55;');
      header.addEventListener('click', function () { classExpanded[label] = !expanded; renderList(); });
      groupWrap.appendChild(header);
      if (expanded && inClass.length) {
        // Wrapped one collapsible group per season, oldest first (Matt's
        // OCD-organization request) -- replaces the old inline "· 2026"
        // tag on every car row.
        var bySeason = {};
        inClass.forEach(function (c) { var s = String(c.season || '(no season)'); (bySeason[s] = bySeason[s] || []).push(c); });
        var seasons = Object.keys(bySeason).sort(function (a, b) { return (Number(a) || 0) - (Number(b) || 0); });
        var seasonsWrap = el('div', 'margin-top:4px;margin-left:14px;');
        seasons.forEach(function (season) { seasonsWrap.appendChild(renderSeasonGroup(label, season, bySeason[season])); });
        groupWrap.appendChild(seasonsWrap);
      }
      listBody.appendChild(groupWrap);
    }

    function renderList() {
      listBody.innerHTML = '';
      if (!carsData.length) { listBody.textContent = 'No cars yet.'; return; }
      CAR_CLASS_LIST.forEach(function (cls) {
        renderClassGroup(cls, carsData.filter(function (c) { return c.carClass === cls; }));
      });
      // Legacy/unexpected class values never vanish silently -- they get
      // their own group at the bottom instead.
      var known = {};
      CAR_CLASS_LIST.forEach(function (cls) { known[cls] = true; });
      var leftovers = {};
      carsData.forEach(function (c) {
        if (!known[c.carClass]) { var key = c.carClass || '(no class)'; (leftovers[key] = leftovers[key] || []).push(c); }
      });
      Object.keys(leftovers).forEach(function (key) { renderClassGroup(key, leftovers[key]); });
    }

    function loadCars() {
      fetchApi('adminListCars', { token: token }).then(function (data) {
        if (!data.success) { listBody.textContent = data.message || 'Could not load cars.'; return; }
        carsData = data.cars || [];
        renderList();
      });
    }

    function carRow(c) {
      // Class and Season are both dropped from this line -- they're
      // implied by the two group headers this row now sits under. Only
      // EntryID/Pro/Con still live in the Edit modal only. A car-number
      // badge leads the line so the most-scanned field (number) doesn't
      // get lost in the text.
      var wrap = el('div', 'padding:6px 0 6px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;');
      var left = el('div', 'display:flex;align-items:center;flex-wrap:wrap;font-size:13px;');
      var numBadge = el('span', 'display:inline-block;min-width:24px;text-align:center;padding:2px 7px;border-radius:4px;background:var(--rc-asphalt,#1e2328);color:#fff;font-weight:700;font-size:12px;margin-right:8px;', '#' + escapeHtml(String(c.carNumber || '?')));
      left.appendChild(numBadge);
      var titleSpan = el('span', null, '');
      titleSpan.innerHTML = '<strong>' + escapeHtml(c.manufacturer + ' ' + c.carModel) + '</strong> &middot; ' + escapeHtml(c.teamName || '');
      left.appendChild(titleSpan);
      left.appendChild(activePill(c.active));
      wrap.appendChild(left);

      var actions = el('div', 'display:flex;gap:6px;align-items:center;');
      var editBtn = el('button', null, 'Edit'); editBtn.type = 'button'; editBtn.className = 'rc-btn-secondary rc-btn-row';
      editBtn.addEventListener('click', function () { openEditCarModal(c); });
      var toggleBtn = el('button', null, c.active ? 'Deactivate' : 'Reactivate');
      toggleBtn.type = 'button'; toggleBtn.className = 'rc-btn-secondary rc-btn-row';
      toggleBtn.addEventListener('click', function () {
        // Same optimistic pattern as Tracks -- flip state + repaint now,
        // save in the background, revert only on a real failure.
        var prevActive = c.active;
        c.active = !c.active;
        renderList();
        fetchApi('adminSetCarActive', { method: 'POST', token: token, body: { entryId: c.entryId, active: c.active } })
          .then(function (data) { if (!data.success) { c.active = prevActive; renderList(); } });
      });
      actions.appendChild(editBtn); actions.appendChild(toggleBtn);
      wrap.appendChild(actions);
      return wrap;
    }

    function carFormFields(body, initial) {
      var seasonInput = wizNumberInput(initial.season || new Date().getFullYear(), function () {}, { min: 2000, max: 2100 });
      var classSelect = wizSelect(CAR_CLASS_LIST, initial.carClass || CAR_CLASS_LIST[0], function () {});
      var manufacturerInput = wizTextInput(initial.manufacturer || '', function () {});
      var modelInput = wizTextInput(initial.carModel || '', function () {});
      var numberInput = wizTextInput(initial.carNumber || '', function () {});
      var teamInput = wizTextInput(initial.teamName || '', function () {});
      var avatarInput = wizTextInput(initial.avatarFile || '', function () {});
      var proInput = wizTextInput(initial.pro || '', function () {});
      var conInput = wizTextInput(initial.con || '', function () {});
      body.appendChild(wizLabel('Season')); body.appendChild(seasonInput);
      body.appendChild(wizLabel('Class')); body.appendChild(classSelect);
      body.appendChild(wizLabel('Manufacturer')); body.appendChild(manufacturerInput);
      body.appendChild(wizLabel('Car Model')); body.appendChild(modelInput);
      body.appendChild(wizLabel('Car Number')); body.appendChild(numberInput);
      body.appendChild(wizLabel('Team Name')); body.appendChild(teamInput);
      body.appendChild(wizLabel('Avatar File')); body.appendChild(avatarInput);
      body.appendChild(wizLabel('Pro')); body.appendChild(proInput);
      body.appendChild(wizLabel('Con')); body.appendChild(conInput);
      return {
        season: seasonInput, carClass: classSelect, manufacturer: manufacturerInput, carModel: modelInput,
        carNumber: numberInput, teamName: teamInput, avatarFile: avatarInput, pro: proInput, con: conInput
      };
    }

    function openAddCarModal() {
      var modal = showModal('Add Car');
      var fields = carFormFields(modal.body, {});
      var saveBtn = el('button', null, 'Add Car'); saveBtn.className = 'rc-btn-primary rc-btn-sm'; saveBtn.style.marginTop = '14px';
      var status = el('div', 'margin-top:6px;font-size:13px;');
      saveBtn.addEventListener('click', function () {
        fetchApi('adminAddCar', {
          method: 'POST', token: token, body: {
            season: String(fields.season.value), class: fields.carClass.value, manufacturer: fields.manufacturer.value.trim(),
            carModel: fields.carModel.value.trim(), carNumber: fields.carNumber.value.trim(), teamName: fields.teamName.value.trim(),
            avatarFile: fields.avatarFile.value.trim(), pro: fields.pro.value.trim(), con: fields.con.value.trim()
          }
        }).then(function (data) {
          status.style.color = data.success ? 'var(--rc-ok)' : 'var(--rc-red)';
          status.textContent = data.message || '';
          if (data.success) { loadCars(); setTimeout(modal.close, 900); }
        });
      });
      modal.body.appendChild(saveBtn);
      modal.body.appendChild(status);
    }
    addBtn.addEventListener('click', openAddCarModal);

    function openEditCarModal(c) {
      var modal = showModal('Edit ' + c.entryId);
      var fields = carFormFields(modal.body, c);
      var saveBtn = el('button', null, 'Save Changes'); saveBtn.className = 'rc-btn-primary rc-btn-sm'; saveBtn.style.marginTop = '14px';
      var status = el('div', 'margin-top:6px;font-size:13px;');
      saveBtn.addEventListener('click', function () {
        fetchApi('adminUpdateCar', {
          method: 'POST', token: token, body: {
            entryId: c.entryId, season: String(fields.season.value), class: fields.carClass.value, manufacturer: fields.manufacturer.value.trim(),
            carModel: fields.carModel.value.trim(), carNumber: fields.carNumber.value.trim(), teamName: fields.teamName.value.trim(),
            avatarFile: fields.avatarFile.value.trim(), pro: fields.pro.value.trim(), con: fields.con.value.trim()
          }
        }).then(function (data) {
          status.style.color = data.success ? 'var(--rc-ok)' : 'var(--rc-red)';
          status.textContent = data.message || '';
          if (data.success) loadCars();
        });
      });
      modal.body.appendChild(saveBtn);
      modal.body.appendChild(status);
    }

    if (preloaded && preloaded.success) { carsData = preloaded.cars || []; renderList(); }
    else loadCars();
    return box;
  }

  // ---------------------------------------------------------------------
  // TOP-LEVEL RENDER
  // ---------------------------------------------------------------------
  function buildFullProfileUI(profile, token) {
    adminSectionBuilt = false; // fresh per page load/render, not per session
    dataMgmtSectionBuilt = false;
    currentProfile = profile; // so the Admin nav button's click handler (built in buildSidebarNav, before this profile object exists in its scope) can reach it
    buildSidebarNav();
    renderDashboardSection(profile, token);
    renderPlaceholderSections();
    renderObjectivesSection(profile);
    renderCalendarSection(profile);
    renderHelpSection(profile);
    renderSettingsSection(profile, token);

    var perms = profile.permissions || [];
    if (perms.indexOf('manageSchedule') !== -1 || perms.indexOf('uploadResults') !== -1) {
      renderLeagueSection();
    }
    if (perms.indexOf('manageUsers') !== -1) {
      document.getElementById('rc-nav-admin').style.display = 'flex';
      showUpperNavDivider();
      // Lightweight only -- just enough to know whether to light up the
      // dot. Does NOT build the Admin panel itself (see
      // loadAdminSectionIfNeeded, wired to the nav click in
      // buildSidebarNav).
      fetchPendingAccountsOnce(token).then(updatePendingDots);
    }
    if (perms.indexOf('manageReferenceData') !== -1) {
      document.getElementById('rc-nav-datamgmt').style.display = 'flex';
      showUpperNavDivider();
      // No lightweight pre-fetch here (unlike Admin's pending-accounts
      // dot) -- Data Management has nothing time-sensitive to flag before
      // it's opened, and per Matt's call, nothing should load until the
      // admin actually asks for it by clicking in.
    }

    showSection('dashboard');
  }

  // mustChangePassword forces a password change before the driver can do
  // anything else -- in v0.2.5 that was just another box on one long
  // scrolling page; with real section-based nav there's no single page
  // for it to sit within, so instead the whole sidebar/section UI stays
  // hidden and #rc-forced-password shows ONLY the (unchanged)
  // passwordChangeSection() form until it succeeds. passwordChangeSection
  // removes its own box from the DOM on a successful change (see its
  // `box.remove()` call) -- rather than modifying that function to add a
  // callback, a MutationObserver watches for that removal and then builds
  // the normal dashboard, so the forced-password logic itself is 100%
  // untouched from v0.2.5.
  function renderProfile(profile, token) {
    if (profile.mustChangePassword) {
      document.getElementById('rc-sidebar').style.display = 'none';
      document.getElementById('rc-topbar').style.display = 'none';

      var lockWrap = document.getElementById('rc-forced-password');
      lockWrap.style.display = 'block';
      lockWrap.innerHTML = '';

      var container = el('div', 'rc-forced-password-wrap');
      container.appendChild(el('p', null, 'For security, please set a new password before continuing to your profile.'));
      var box = passwordChangeSection(token);
      container.appendChild(box);
      lockWrap.appendChild(container);

      var observer = new MutationObserver(function () {
        if (!document.body.contains(box)) {
          observer.disconnect();
          lockWrap.style.display = 'none';
          document.getElementById('rc-sidebar').style.display = '';
          document.getElementById('rc-topbar').style.display = '';
          profile.mustChangePassword = false;
          buildFullProfileUI(profile, token);
        }
      });
      observer.observe(container, { childList: true, subtree: true });
      return;
    }

    buildFullProfileUI(profile, token);
  }

  // ---------------------------------------------------------------------
  // LOAD PROFILE — deliberately the LAST thing in this script (see the
  // long comment near the top, right after the auth gate, for why: every
  // `var` and `function` this depends on further up this file needs its
  // assignment line to have already run, and calling this from the very
  // top of the script was doing that too early on the synchronous
  // fresh-login path specifically).
  //
  // PERFORMANCE FIX: arriving here right after a successful login used to
  // ALWAYS fire a fresh getProfile call, even though login.html's own
  // response already IS a full profile payload (see buildProfilePayload
  // server-side). That meant every login paid for two full Apps Script
  // round-trips back to back -- the login call, then this getProfile call
  // immediately after redirecting -- and Apps Script's cold-start cost
  // (often several seconds) made that feel like the page had hung. Now:
  // login.html stashes its response in sessionStorage under
  // 'raceclub_fresh_profile' right before redirecting here; if that's
  // present, render straight from it and skip the network call entirely.
  // It's read-once (removed immediately), so a manual refresh or any
  // OTHER way of arriving at this page (bookmark, typing the URL, coming
  // back from another page) still fetches properly fresh data as before.
  // ---------------------------------------------------------------------
  var freshProfileRaw = sessionStorage.getItem('raceclub_fresh_profile');
  if (freshProfileRaw) sessionStorage.removeItem('raceclub_fresh_profile');
  var freshProfile = null;
  if (freshProfileRaw) {
    try { freshProfile = JSON.parse(freshProfileRaw); } catch (err) { freshProfile = null; }
  }

  // The header stayed logo-only (renderHeaderPending(), set at the top of
  // <body>) until now -- it only gets the real, full render below once we
  // actually know whether this session checks out, so it can never show
  // the logged-in avatar for a session that was never confirmed.
  if (freshProfile && freshProfile.success) {
    // Came straight from a successful login (which DID just verify the
    // password against the API) -- safe to render the confirmed header.
    renderHeader({ skipNotifCheck: true });
    document.getElementById('rc-loading').style.display = 'none';
    document.getElementById('rc-profile-root').style.display = 'block';
    renderProfile(freshProfile, token);
  } else {
    fetchApi('getProfile', { token: token })
      .then(function (data) {
        if (!data.success) {
          clearToken();
          sessionStorage.setItem('raceclub_login_message', 'Your session expired — please log in again.');
          window.location.href = 'login.html';
          return;
        }
        setProfileCache(data); // keeps the header avatar current on every other page too
        renderHeader({ skipNotifCheck: true }); // confirmed by the API -- safe to show as logged in
        document.getElementById('rc-loading').style.display = 'none';
        document.getElementById('rc-profile-root').style.display = 'block';
        renderProfile(data, token);
      })
      .catch(function () {
        // Couldn't even reach the API -- we have no way to confirm this
        // session is valid, so the header falls back to the logged-out
        // look instead of optimistically showing an avatar for a login
        // that was never actually verified. The token itself is left
        // alone (not cleared) since this might just be a momentary
        // connection problem, not an actually-invalid session.
        renderHeader({ forceLoggedOut: true });
        document.getElementById('rc-loading').style.display = 'none';
        var err = document.getElementById('rc-error');
        err.style.display = 'block';
        err.textContent = 'Could not reach the server. Check API_BASE_URL and try again.';
      });
  }
})();
</script>
</body>
