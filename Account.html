  // Alphabetical by DisplayName, one row per driver, Edit button on each
  // opening openEditDriverModal(). A separate "Pending Approval" group
  // sits on top when there's anyone waiting -- these are Prospects
  // (Status PendingApproval, not yet a Role at all), so they're not part
  // of the main list below; Approve promotes Status straight to Active
  // (adminApproveAccount), Deny sets it to Rejected (adminRejectAccount).
  // Both call `reload` (the Members popup's own refresh, from
  // openAdminListModal) afterward, plus the sidebar dot/header bell, so
  // nothing here goes stale. No panel heading here -- this renders inside
  // the Members popup, whose modal title already says "Members".
  // ---------------------------------------------------------------------
  // SHARED GROUPED-LIST BUILDER (2026-09-13, Matt's call: "I want lists to
  // appear the same way on the website... function nearly the same...
  // don't want the user to feel like they're learning a new function every
  // time they visit a new page"). Every Data Management list (Drivers/
  // Tracks/Cars) groups its rows under a canonically-ordered set of group
  // headers (Role, Region, Season), falls back to alphabetical for any
  // group key the reference data doesn't already know about, and shows one
  // shared empty-state message when there's nothing at all -- each list
  // used to duplicate this exact "bucket by key, order the buckets, render
  // a header, don't lose an unrecognized key" loop with its own slightly
  // different variable
  // names. This is that loop, written once. What's genuinely different
  // per entity -- a Sponsor row carries a logo, a Track's group nests a
  // venue row under each of which sit its own layout sub-rows, a Car's
  // group nests a Season sub-head above each of ITS cars -- stays with
  // the caller via buildGroupHeader/buildBody, since there's no single
  // row shape that fits all four honestly.
  //
  // opts:
  //   groupKey(item) -> string key this item belongs under.
  //   canonicalOrder -> array of keys that should always lead, in this
  //     order, even with zero rows right now to show (omit to sort every
  //     key purely by sortExtraKeys instead, e.g. Tracks' Region groups,
  //     which have no fixed canonical list).
  //   sortExtraKeys(a, b) -> comparator for keys NOT in canonicalOrder
  //     (default: plain alphabetical).
  //   buildGroupHeader(key, itemsInGroup) -> the group header DOM element
  //     (a .rc-group-head/.rc-dm-row/.rc-dm-season-head, whichever this
  //     list already uses).
  //   buildBody(key, itemsInGroup, group) -> called once per non-empty
  //     group; appends whatever rows/sub-rows that group needs onto
  //     `group` (already appended to the panel by the time this runs).
  //   emptyMessage -> shown instead of any groups when there are zero
  //     items total.
  // ---------------------------------------------------------------------
  function buildGroupedAdminList(items, opts) {
    var panel = el('div', 'rc-panel');
    if (!items || !items.length) {
      panel.appendChild(el('div', 'rc-dm-empty', opts.emptyMessage));
      return panel;
    }

    var byKey = {};
    items.forEach(function (item) {
      var key = opts.groupKey(item);
      if (!byKey[key]) byKey[key] = [];
      byKey[key].push(item);
    });

    var sortExtras = opts.sortExtraKeys || function (a, b) { return a.localeCompare(b); };
    var keyOrder;
    if (opts.canonicalOrder) {
      // Canonical keys keep their given order (even ones with zero rows
      // right now, so a caller can rely on them always appearing) --
      // anything else found in the actual data (a real key the reference
      // data doesn't list yet, rather than dropped silently) sorts after
      // them via sortExtraKeys.
      var extras = Object.keys(byKey).filter(function (k) { return opts.canonicalOrder.indexOf(k) === -1; }).sort(sortExtras);
      keyOrder = opts.canonicalOrder.concat(extras);
    } else {
      keyOrder = Object.keys(byKey).sort(sortExtras);
    }

    var renderedAny = false;
    keyOrder.forEach(function (key) {
      var itemsInGroup = byKey[key];
      if (!itemsInGroup || !itemsInGroup.length) return;
      renderedAny = true;
      var group = el('div', 'rc-dm-group');
      group.appendChild(opts.buildGroupHeader(key, itemsInGroup));
      panel.appendChild(group);
      opts.buildBody(key, itemsInGroup, group);
    });
    if (!renderedAny) panel.appendChild(el('div', 'rc-dm-empty', opts.emptyMessage));
    return panel;
  }

  // Members list -- reorganized 2026-08-30 (Matt's call) into one list
  // grouped by Role, same black-pill-plus-indented-rows pattern as the
  // Seasons list's year grouping and the Tracks list's Region grouping
  // (.rc-group-head/.rc-group-row). Prospect (pending accounts -- not a
  // real Role, see Auth.gs) is its own top group so it reads alongside
  // the real roles instead of living in a separate box above them.
  // Groups always render in the documented access-hierarchy order --
  // Prospect, Driver, Steward, Organizer, Admin -- low to high, regardless
  // of which ones happen to have members right now; alphabetical by
  // display name within each group. Prospect rows get Approve/Deny
  // alongside Edit (added 2026-08-30 -- previously Edit wasn't offered
  // for a pending account at all); every other row just gets Edit.
  function buildDriversPanel(drivers, pending, token, reload) {
    // Prospects don't carry a real Role (see Auth.gs) -- tagged here so
    // groupKey below can bucket them separately without a second data
    // source threaded through buildGroupedAdminList itself.
    var items = (pending || []).map(function (p) {
      p._isProspect = true;
      return p;
    }).concat(drivers || []);
    var ROLE_ORDER = ['Prospect', 'Driver', 'Steward', 'Organizer', 'Admin'];

    return buildGroupedAdminList(items, {
      emptyMessage: 'No members yet.',
      // A Role not in the canonical list (shouldn't happen, but data can
      // drift) still shows -- bucketed under Driver rather than silently
      // dropped, same "don't lose the row" instinct as _rcClassBadge uses
      // for cars.
      groupKey: function (d) { return d._isProspect ? 'Prospect' : (ROLE_ORDER.indexOf(d.Role) !== -1 ? d.Role : 'Driver'); },
      canonicalOrder: ROLE_ORDER,
      buildGroupHeader: function (role) {
        var head = el('div', 'rc-group-head');
        head.appendChild(el('span', 'rc-badge-chip rc-badge-group', role.toUpperCase()));
        return head;
      },
      buildBody: function (role, people, group) {
        var isPending = role === 'Prospect';
        people.slice().sort(function (a, b) {
          return (a.DisplayName || a.Username || '').localeCompare(b.DisplayName || b.Username || '');
        }).forEach(function (person) {
          var row = el('div', 'rc-group-row');
          var info = el('div', 'rc-dm-row-info');
          info.appendChild(el('span', 'rc-dm-row-label', escapeHtml(person.DisplayName || person.Username || '(no name)')));
          row.appendChild(info);

          var btnGroup = el('div', 'display:flex;gap:8px;flex:none;');

          if (isPending) {
            // Approve/Deny both write straight to the sheet the instant
            // they're clicked (no confirm step), so per the sitewide button
            // rule (2026-09-13, Matt's call: gray outline/text unless a
            // button saves to a sheet, then solid red) both get the
            // save-style red button rather than the row's usual gray --
            // dropped the old green/red text-only treatment that used to
            // distinguish them, since that was a status-pill borrow, not
            // this site's actual save/non-save convention.
            var approveBtn = el('button', 'rc-btn-primary rc-btn-sm rc-btn-row', 'Approve');
            approveBtn.type = 'button';
            approveBtn.addEventListener('click', function () {
              // Instant, no wait on the server (2026-09-03, Matt's call:
              // "all the admin/data management functions work the same" as
              // the rest of the site). The row drops out of Pending Approval
              // the instant Approve is clicked; the actual promotion happens
              // silently in the background. A failure puts the row back and
              // explains why via toast, since it was never actually approved.
              var nextSibling = row.nextSibling, parent = row.parentNode;
              if (parent) parent.removeChild(row);
              fetchApi('adminApproveAccount', { method: 'POST', token: token, body: { profileId: person.ProfileID } }).then(function (data) {
                if (data && data.success) {
                  if (reload) reload();
                } else {
                  if (parent) parent.insertBefore(row, nextSibling);
                  showToast((data && data.message) || 'Could not approve this account -- restored.', 'error');
                }
              }).catch(function () {
                if (parent) parent.insertBefore(row, nextSibling);
                showToast('Could not reach the server -- account not approved.', 'error');
              });
            });
            var denyBtn = el('button', 'rc-btn-primary rc-btn-sm rc-btn-row', 'Deny');
            denyBtn.type = 'button';
            denyBtn.addEventListener('click', function () {
              // Same instant pattern as Approve above.
              var nextSibling = row.nextSibling, parent = row.parentNode;
              if (parent) parent.removeChild(row);
              fetchApi('adminRejectAccount', { method: 'POST', token: token, body: { profileId: person.ProfileID } }).then(function (data) {
                if (data && data.success) {
                  if (reload) reload();
                } else {
                  if (parent) parent.insertBefore(row, nextSibling);
                  showToast((data && data.message) || 'Could not deny this account -- restored.', 'error');
                }
              }).catch(function () {
                if (parent) parent.insertBefore(row, nextSibling);
                showToast('Could not reach the server -- account not denied.', 'error');
              });
            });
            btnGroup.appendChild(approveBtn);
            btnGroup.appendChild(denyBtn);
          }

          var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
          editBtn.type = 'button';
          editBtn.addEventListener('click', function () { openEditDriverModal(person, token, reload); });
          btnGroup.appendChild(editBtn);

          row.appendChild(btnGroup);
          group.appendChild(row);
        });
      }
    });
  }

  // Add Driver (2026-09-19, Matt's ask: "give me the ability to add
  // drivers in the members list as an admin") -- Username/First/Last/
  // Suffix/Email, same identity fields as Edit Driver above minus
  // Location/Time Zone/Role (new accounts always start Role: Driver,
  // Status: Active; Location/Time Zone can be filled in later from this
  // same Edit Driver popup). Backed by adminAddDriver, which generates a
  // random temporary password server-side -- unlike every other Add-X
  // popup on this page, this one deliberately stays open through the
  // save (same "Saving..." pattern openNewsPostModal uses, for the same
  // reason: there's a one-time value the admin needs to actually see
  // before the popup can close) and then swaps its own body for a
  // confirmation screen showing that password, since it's never
  // recoverable again after this screen closes. The new driver can also
  // always get in on their own afterward via the ordinary Forgot
  // Password email flow.
  function openAddDriverModal(token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Username'));
    var username = el('input'); username.type = 'text'; username.required = true;
    form.appendChild(username);

    form.appendChild(el('label', null, 'First Name'));
    var firstName = el('input'); firstName.type = 'text'; firstName.required = true;
    form.appendChild(firstName);

    form.appendChild(el('label', null, 'Last Name'));
    var lastName = el('input'); lastName.type = 'text'; lastName.required = true;
    form.appendChild(lastName);

    form.appendChild(el('label', null, 'Suffix (optional)'));
    var suffix = document.createElement('select');
    var suffixBlank = document.createElement('option'); suffixBlank.value = ''; suffixBlank.textContent = 'None';
    suffix.appendChild(suffixBlank);
    (typeof DRIVER_NAME_SUFFIXES !== 'undefined' ? DRIVER_NAME_SUFFIXES : []).forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s; opt.textContent = s;
      suffix.appendChild(opt);
    });
    form.appendChild(suffix);

    form.appendChild(el('label', null, 'Email Address'));
    var email = el('input'); email.type = 'email'; email.required = true;
    form.appendChild(email);
    form.appendChild(el('div', 'rc-hint', 'Used for password-reset delivery only -- this driver logs in with their username, not this email.'));

    var saveBtn = el('button', null, 'Add Driver');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var modalHandle = showModal('Add Driver', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!username.value.trim() || !firstName.value.trim() || !lastName.value.trim() || !email.value.trim()) {
        showToast('Username, first name, last name, and email are required.', 'error');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      fetchApi('adminAddDriver', {
        method: 'POST', token: token,
        body: {
          username: username.value.trim(), firstName: firstName.value.trim(),
          lastName: lastName.value.trim(), suffix: suffix.value, email: email.value.trim()
        }
      })
        .then(function (data) {
          if (!data.success) {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Add Driver';
            showToast(data.message || 'Could not add this driver -- try again.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();

          // Swap the form out for a one-time confirmation screen -- the
          // temp password is only ever returned in this one response, so
          // it has to be shown here or it's gone for good.
          body.innerHTML = '';
          body.appendChild(el('div', 'rc-message rc-ok', 'Driver account created.'));
          var credWrap = el('div', 'margin-top:14px;');
          credWrap.appendChild(el('label', 'margin-top:0;', 'Username'));
          credWrap.appendChild(el('div', 'rc-dm-row-label', escapeHtml(username.value.trim())));
          credWrap.appendChild(el('label', null, 'Temporary Password'));
          var pwEl = el('div', 'rc-dm-row-label', escapeHtml(data.tempPassword));
          pwEl.style.userSelect = 'all';
          pwEl.style.fontFamily = 'monospace';
          credWrap.appendChild(pwEl);
          body.appendChild(credWrap);
          body.appendChild(el('div', 'rc-hint', 'This password only shows once -- copy it now and pass it along to ' + escapeHtml(firstName.value.trim()) + '. They can also set their own password anytime via Forgot Password on the login page, using ' + escapeHtml(email.value.trim()) + '.'));
        })
        .catch(function (err) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Add Driver';
          showToast((err && err.message) || 'Could not reach the server -- driver not added.', 'error');
        });
    });
  }

  // Same field set as openEditProfileModal (Username/First/Last/Suffix/
  // Email/Location/Time Zone), plus Role -- this is the admin-on-someone-
  // else's-profile equivalent, backed by the expanded handleAdminUpdateProfile.
  // "Disable This Account" is a separate action (adminSetUserStatus, same
  // endpoint Status changes already went through) rather than a field on
  // this form, matching the Track/Car popups' edit-fields vs. deactivate
  // split below.
  function openEditDriverModal(driver, token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Username'));
    var username = el('input'); username.type = 'text'; username.value = driver.Username || ''; username.required = true;
    form.appendChild(username);

    form.appendChild(el('label', null, 'First Name'));
    var firstName = el('input'); firstName.type = 'text'; firstName.value = driver.FirstName || ''; firstName.required = true;
    form.appendChild(firstName);

    form.appendChild(el('label', null, 'Last Name'));
    var lastName = el('input'); lastName.type = 'text'; lastName.value = driver.LastName || ''; lastName.required = true;
    form.appendChild(lastName);

    form.appendChild(el('label', null, 'Suffix (optional)'));
    var suffix = document.createElement('select');
    var suffixBlank = document.createElement('option'); suffixBlank.value = ''; suffixBlank.textContent = 'None';
    suffix.appendChild(suffixBlank);
    (typeof DRIVER_NAME_SUFFIXES !== 'undefined' ? DRIVER_NAME_SUFFIXES : []).forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s; opt.textContent = s;
      if (driver.Suffix === s) opt.selected = true;
      suffix.appendChild(opt);
    });
    form.appendChild(suffix);

    form.appendChild(el('label', null, 'Email Address'));
    var email = el('input'); email.type = 'email'; email.value = driver.Email || ''; email.required = true;
    form.appendChild(email);

    form.appendChild(el('label', null, 'Location'));
    var location = document.createElement('select');
    var locBlank = document.createElement('option'); locBlank.value = ''; locBlank.textContent = 'Select a country';
    location.appendChild(locBlank);
    (typeof COUNTRIES !== 'undefined' ? COUNTRIES : []).forEach(function (country) {
      var opt = document.createElement('option'); opt.value = country; opt.textContent = country;
      if (driver.Location === country) opt.selected = true;
      location.appendChild(opt);
    });
    form.appendChild(location);

    form.appendChild(el('label', null, 'Time Zone'));
    var timeZone = document.createElement('select');
    var tzBlank = document.createElement('option'); tzBlank.value = ''; tzBlank.textContent = 'Select a time zone';
    timeZone.appendChild(tzBlank);
    (typeof getTimezoneList === 'function' ? getTimezoneList() : []).forEach(function (tz) {
      var opt = document.createElement('option'); opt.value = tz; opt.textContent = typeof timezoneLabel === 'function' ? timezoneLabel(tz) : tz;
      if (driver.TimeZone === tz) opt.selected = true;
      timeZone.appendChild(opt);
    });
    form.appendChild(timeZone);

    form.appendChild(el('label', null, 'Role'));
    var role = document.createElement('select');
    // Cumulative access hierarchy, lowest to highest (see
    // race-club-v03-system-map.html, Section 0): Driver < Steward <
    // Organizer < Admin. Prospect isn't in this list -- it's a Status
    // (PendingVerification/PendingApproval), not a Role; see Auth.gs.
    ['Driver', 'Steward', 'Organizer', 'Admin'].forEach(function (r) {
      var opt = document.createElement('option'); opt.value = r; opt.textContent = r;
      if (driver.Role === r) opt.selected = true;
      role.appendChild(opt);
    });
    form.appendChild(role);

    var saveBtn = el('button', null, 'Save Changes');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var isActive = driver.Status !== 'Disabled';
    var statusWrap = el('div', 'padding-top:16px;margin-top:16px;border-top:1px solid var(--rc-silver);');
    var toggleBtn = el('button', 'rc-btn-primary rc-btn-sm', isActive ? 'Disable This Account' : 'Reactivate This Account');
    toggleBtn.type = 'button';
    statusWrap.appendChild(toggleBtn);
    body.appendChild(statusWrap);

    var modalHandle = showModal('Edit Driver', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!username.value.trim() || !firstName.value.trim() || !lastName.value.trim() || !email.value.trim()) {
        showToast('Username, first name, last name, and email are required.', 'error');
        return;
      }
      // Instant, no wait on the server (2026-09-03, Matt's call: "all the
      // admin/data management functions work the same" as the rest of
      // the site). The popup closes the moment Save Changes is submitted;
      // the actual write happens silently in the background. A failure
      // can't un-close an already-closed modal, so it just says so via
      // toast -- the admin can reopen Edit Driver and try again.
      modalHandle.close();
      fetchApi('adminUpdateProfile', {
        method: 'POST',
        token: token,
        body: {
          profileId: driver.ProfileID,
          username: username.value.trim(),
          firstName: firstName.value.trim(),
          lastName: lastName.value.trim(),
          suffix: suffix.value,
          email: email.value.trim(),
          location: location.value,
          timeZone: timeZone.value,
          role: role.value
        }
      })
        .then(function (data) {
          if (!data.success) {
            showToast(data.message || 'Could not save changes -- reopen Edit Driver and try again.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();
        })
        .catch(function () {
          showToast('Could not reach the server -- changes not saved.', 'error');
        });
    });

    toggleBtn.addEventListener('click', function () {
      // Confirm step added (2026-09-13 fix) -- this used to fire the write
      // the instant it was clicked, the one admin toggle on the site with
      // no undo-before-you-commit step at all, unlike every other
      // moderately-destructive action here. Disabling an account is
      // reversible (Reactivate undoes it), so this uses the light
      // openConfirmModal rather than the heavier type-to-confirm dialog
      // reserved for truly irreversible actions like End Season/Erase.
      if (!isActive) {
        // Reactivating needs no extra confirmation -- only the
        // disable direction is destructive enough to double-check.
        doToggleAccountStatus_();
        return;
      }
      openConfirmModal(
        'Disable Account',
        'Disable ' + (driver.DisplayName || driver.ProfileID) + '\'s account? They will be signed out and unable to log back in until an admin reactivates it.',
        'Disable This Account',
        doToggleAccountStatus_
      );
    });

    function doToggleAccountStatus_() {
      // Same instant pattern as Save Changes above.
      modalHandle.close();
      fetchApi('adminSetUserStatus', {
        method: 'POST',
        token: token,
        body: { profileId: driver.ProfileID, status: isActive ? 'Disabled' : 'Active' }
      })
        .then(function (data) {
          if (!data.success) {
            showToast(data.message || 'Could not update this account -- reopen Edit Driver and try again.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();
        })
        .catch(function () {
          showToast('Could not reach the server -- account status not changed.', 'error');
        });
    }
  }

  // Grouped by Region (added 2026-08-30, Matt's call), same black-pill-
  // plus-indented-rows pattern as the Seasons list's year grouping and the
  // Members list's role grouping (.rc-group-head/.rc-group-row); venues
  // alphabetically within each region. Region lives on every Layout row
  // for a venue but is venue-level in practice -- set/renamed together via
  // adminUpdateTrackRegion, same as TrackName -- so the first row's Region
  // is authoritative for the whole venue. Blank Region groups under
  // "Unassigned", always sorted last so it doesn't jump around
  // alphabetically as regions get filled in. Edit button on the venue row
  // only, opening openEditTrackModal(). Only ACTIVE layouts show in this
  // main list -- the edit popup is where inactive ones are visible (and
  // can be reactivated).
  function buildTracksPanel(tracks, token, reload) {
    var venues = {};
    var venueNames = [];
    (tracks || []).forEach(function (t) {
      var name = t.TrackName || '(unnamed)';
      if (!venues[name]) { venues[name] = []; venueNames.push(name); }
      venues[name].push(t);
    });
    // buildGroupedAdminList groups ITEMS by key -- here each "item" is a
    // venue (one TrackName, however many layout rows it has), not a raw
    // row, since Region grouping happens one level up from the raw
    // Tracks rows.
    var venueItems = venueNames.map(function (name) { return { name: name, rows: venues[name] }; });

    return buildGroupedAdminList(venueItems, {
      emptyMessage: 'No tracks yet.',
      groupKey: function (v) { return (v.rows[0] && v.rows[0].Region) || 'Unassigned'; },
      // No fixed Region list exists (free-text field, see openAddTrackModal's
      // comment) -- alphabetical, except "Unassigned" always sorts last so
      // venues nobody's tagged yet don't scatter alphabetically among real
      // regions.
      sortExtraKeys: function (a, b) {
        if (a === 'Unassigned') return 1;
        if (b === 'Unassigned') return -1;
        return a.localeCompare(b);
      },
      buildGroupHeader: function (region) {
        var head = el('div', 'rc-group-head');
        head.appendChild(el('span', 'rc-badge-chip rc-badge-group', escapeHtml(region.toUpperCase())));
        return head;
      },
      buildBody: function (region, venuesInRegion, regionGroup) {
        venuesInRegion.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (v) {
          var rows = v.rows;
          // Each venue keeps its own .rc-dm-group (Edit row + its layout
          // sub-rows nested inside), same as before this became a shared-
          // helper call -- the region's own .rc-dm-group from
          // buildGroupedAdminList just wraps the whole set of them now,
          // which only adds a few px of shared margin, nothing visible.
          // Divider moved to sit BETWEEN tracks (2026-09-19, Matt's call:
          // "make the faded gray line appear in between each track, not in
          // between the location and layout") -- the venue name row no
          // longer carries its own border-bottom; instead .rc-dm-venue-group
          // draws a top border on every venue after the first within a
          // region, via the adjacent-sibling CSS rule.
          var group = el('div', 'rc-dm-group rc-dm-venue-group');
          var row = el('div', 'rc-dm-row rc-dm-row-light rc-dm-row-noborder');
          row.appendChild(el('span', 'rc-dm-row-label', escapeHtml(v.name)));
          var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
          editBtn.type = 'button';
          editBtn.addEventListener('click', function () { openEditTrackModal(v.name, rows, token, reload); });
          row.appendChild(editBtn);
          group.appendChild(row);

          var activeLayouts = rows.filter(_rcRowActive).map(function (r) { return r.Layout; })
            .filter(Boolean).sort(function (a, b) { return a.localeCompare(b); });
          if (activeLayouts.length === 0) {
            var noneRow = el('div', 'rc-dm-subrow');
            noneRow.appendChild(el('span', 'rc-dm-tree', '└'));
            noneRow.appendChild(el('span', null, 'No active layouts.'));
            group.appendChild(noneRow);
          } else {
            activeLayouts.forEach(function (layout) {
              var layoutRow = el('div', 'rc-dm-subrow');
              layoutRow.appendChild(el('span', 'rc-dm-tree', '└'));
              layoutRow.appendChild(el('span', null, escapeHtml(layout)));
              group.appendChild(layoutRow);
            });
          }
          regionGroup.appendChild(group);
        });
      }
    });
  }

  // Track edit popup -- ONLY the venue name is editable here (Matt's
  // call), applying to every row sharing that TrackName at once
  // (adminUpdateTrackName). Layouts are managed separately underneath:
  // every layout row (active AND inactive) with a status pill and a
  // Deactivate/Reactivate toggle (adminSetTrackLayoutActive -- never
  // deletes the row), plus an add-a-layout input (adminAddTrackLayout).
  // Layout changes update the popup's own list in place (no need to
  // close/reopen it to keep managing layouts) AND call reload() in the
  // background so the Tracks list sitting underneath this modal is never
  // stale by the time it's closed (added 2026-08-30, Matt's call: "any
  // page/panel that's open should refresh when something's saved or
  // changed"). The rename additionally closes this modal outright, since
  // that's the one change that affects the main panel's grouping/heading.
  function openEditTrackModal(venueName, rows, token, reload) {
    var body = el('div');

    var form = el('form');
    form.appendChild(el('label', 'margin-top:0;', 'Track Name'));
    var nameInput = el('input'); nameInput.type = 'text'; nameInput.value = venueName; nameInput.required = true;
    form.appendChild(nameInput);
    var saveNameBtn = el('button', null, 'Save Name');
    saveNameBtn.type = 'submit';
    saveNameBtn.className = 'rc-btn-primary';
    saveNameBtn.style.marginTop = '14px';
    form.appendChild(saveNameBtn);
    body.appendChild(form);

    // Region (added 2026-08-30) -- its own field + Save button, separate
    // from the Track Name form above (same "one save button per concern"
    // split the deactivate-vs-edit-fields pattern already uses elsewhere
    // in Data Management), venue-level so it applies to every row sharing
    // this TrackName at once via adminUpdateTrackRegion.
    var regionWrap = el('div', 'margin-top:16px;');
    regionWrap.appendChild(el('label', 'margin-top:0;', 'Region'));
    var regionInput = el('input'); regionInput.type = 'text';
    regionInput.value = (rows[0] && rows[0].Region) || '';
    regionInput.placeholder = 'e.g. Europe, North America';
    regionWrap.appendChild(regionInput);
    var saveRegionBtn = el('button', 'rc-btn-primary', 'Save Region');
    saveRegionBtn.type = 'button';
    saveRegionBtn.style.marginTop = '10px';
    regionWrap.appendChild(saveRegionBtn);
    body.appendChild(regionWrap);

    saveRegionBtn.addEventListener('click', function () {
      // Instant, no wait on the server (2026-09-03, Matt's call: "all
      // the admin/data management functions work the same" as the rest
      // of the site). rows[] updates and the modal stays open on this
      // same screen right away; the actual write happens silently in
      // the background. A failure puts the previous region back into
      // the field and explains why via toast.
      var newRegion = regionInput.value.trim();
      var previousRegion = (rows[0] && rows[0].Region) || '';
      rows.forEach(function (r) { r.Region = newRegion; });
      fetchApi('adminUpdateTrackRegion', {
        method: 'POST', token: token,
        body: { trackName: venueName, region: newRegion }
      })
        .then(function (data) {
          if (!data.success) {
            rows.forEach(function (r) { r.Region = previousRegion; });
            regionInput.value = previousRegion;
            showToast(data.message || 'Could not update this track\'s region -- reverted.', 'error');
            return;
          }
        })
        .catch(function () {
          rows.forEach(function (r) { r.Region = previousRegion; });
          regionInput.value = previousRegion;
          showToast('Could not reach the server -- region change reverted.', 'error');
        });
    });

    body.appendChild(el('h3', 'margin:22px 0 0;font-size:14px;', 'Layouts'));
    var listWrap = el('div', 'rc-dm-layout-list');
    body.appendChild(listWrap);

    function renderLayoutList() {
      listWrap.innerHTML = '';
      if (rows.length === 0) {
        listWrap.appendChild(el('div', 'rc-dm-empty', 'No layouts yet.'));
        return;
      }
      rows.slice().sort(function (a, b) { return (a.Layout || '').localeCompare(b.Layout || ''); }).forEach(function (r) {
        var active = _rcRowActive(r);
        var layoutRow = el('div', 'rc-dm-layout-row' + (active ? '' : ' rc-dm-layout-inactive'));
        layoutRow.appendChild(el('span', 'rc-dm-layout-name', escapeHtml(r.Layout || '(unnamed layout)')));
        layoutRow.appendChild(el('span', 'rc-dm-status-pill ' + (active ? 'rc-dm-status-pill-active' : 'rc-dm-status-pill-inactive'), active ? 'Active' : 'Inactive'));
        var toggleBtn = el('button', 'rc-btn-primary rc-btn-sm rc-btn-row', active ? 'Deactivate' : 'Reactivate');
        toggleBtn.type = 'button';
        toggleBtn.addEventListener('click', function () {
          // Instant, no wait on the server (2026-09-03, Matt's call: "all
          // the admin/data management functions work the same" as the
          // rest of the site). The row flips to its new Active/Inactive
          // state (and the list repaints) the instant this is clicked;
          // the actual write happens silently in the background. A
          // failure flips it back and explains why via toast.
          var newActive = active ? 'Inactive' : 'Active';
          r.Active = newActive;
          renderLayoutList();
          fetchApi('adminSetTrackLayoutActive', {
            method: 'POST', token: token,
            body: { trackId: r.TrackID, active: newActive }
          })
            .then(function (data) {
              if (!data.success) {
                r.Active = active ? 'Active' : 'Inactive';
                renderLayoutList();
                showToast(data.message || 'Could not update that layout -- reverted.', 'error');
              }
            })
            .catch(function () {
              r.Active = active ? 'Active' : 'Inactive';
              renderLayoutList();
              showToast('Could not reach the server -- layout change reverted.', 'error');
            });
        });
        layoutRow.appendChild(toggleBtn);
        listWrap.appendChild(layoutRow);
      });
    }
    renderLayoutList();

    var addRow = el('div', 'rc-dm-add-row');
    var addInput = el('input'); addInput.type = 'text'; addInput.placeholder = 'New layout name';
    var addBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Add Layout');
    addBtn.type = 'button';
    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    body.appendChild(addRow);

    addBtn.addEventListener('click', function () {
      var layoutName = addInput.value.trim();
      if (!layoutName) {
        showToast('Enter a layout name first.', 'error');
        return;
      }

      // Instant, no wait on the server (2026-09-03, Matt's call: "all
      // the admin/data management functions work the same" as the rest
      // of the site). The new layout shows up in the list right away;
      // its real TrackID isn't known until the server assigns one, but
      // nothing on screen needs it before then (the row's own Deactivate
      // button is the only thing that reads it, and this layout is
      // brand new -- there's nothing to deactivate yet). The quiet
      // background reconcile below fills the real TrackID in once the
      // write lands; a failure removes the row and explains why.
      var provisionalRow = { TrackID: '', TrackName: venueName, Layout: layoutName, Region: (rows[0] && rows[0].Region) || '', Active: 'Active' };
      rows.push(provisionalRow);
      addInput.value = '';
      renderLayoutList();
      fetchApi('adminAddTrackLayout', {
        method: 'POST', token: token,
        body: { trackName: venueName, layout: layoutName }
      })
        .then(function (data) {
          if (!data.success) {
            rows.splice(rows.indexOf(provisionalRow), 1);
            renderLayoutList();
            showToast(data.message || 'Could not add that layout -- removed.', 'error');
            return;
          }
          provisionalRow.TrackID = data.trackId || '';
        })
        .catch(function () {
          rows.splice(rows.indexOf(provisionalRow), 1);
          renderLayoutList();
          showToast('Could not reach the server -- layout not added.', 'error');
        });
    });

    var modalHandle = showModal('Edit Track', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      var newName = nameInput.value.trim();
      if (!newName) {
        showToast('Track name is required.', 'error');
        return;
      }
      if (newName === venueName) {
        modalHandle.close();
        return;
      }
      // Instant, no wait on the server (2026-09-03, Matt's call: "all the
      // admin/data management functions work the same" as the rest of
      // the site). The popup closes the moment Save Name is submitted;
      // the actual rename happens silently in the background. A failure
      // can't un-close an already-closed modal, so it just says so via
      // toast -- the admin can reopen Edit Track and try again.
      modalHandle.close();
      fetchApi('adminUpdateTrackName', {
        method: 'POST', token: token,
        body: { oldName: venueName, newName: newName }
      })
        .then(function (data) {
          if (!data.success) {
            showToast(data.message || 'Could not rename this track -- reopen Edit Track and try again.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();
        })
        .catch(function () {
          showToast('Could not reach the server -- track not renamed.', 'error');
        });
    });
  }

  // Pill display label for a class (2026-09-19, Matt's call: "Make the
  // HYPERCAR display HY in ALL instances where it's a pill class
  // description") -- every other class name (LMGT3/LMP3/LMP2) is already
  // short enough to read fine inside a pill; Hypercar is the one outlier,
  // so it's the only one abbreviated here. Not the same thing as
  // CAR_CLASS_ABBREV (reference-data.js), which abbreviates every class
  // for the Current Seat corner pill specifically -- this is used by every
  // OTHER class pill on the site (the full class badge, the Calendar page's
  // class pills, the Choose Your Class modal title pill).
  function _rcClassPillLabel(cls) {
    return cls === 'Hypercar' ? 'HY' : cls;
  }

  // Class badge -- LMGT3/LMP3/LMP2/Hypercar get their canonical colors
  // (same CSS vars CAR_CLASS_BADGE_COLOR_VAR points at); any other class
  // name still shows, just uncolored, rather than being silently dropped.
  function _rcClassBadge(cls) {
    var key = String(cls || '').trim();
    var map = { LMGT3: 'rc-badge-lmgt3', LMP3: 'rc-badge-lmp3', LMP2: 'rc-badge-lmp2', Hypercar: 'rc-badge-hypercar' };
    var colorClass = map[key] || '';
    return el('span', 'rc-badge-chip' + (colorClass ? ' ' + colorClass : ''), escapeHtml(_rcClassPillLabel(key) || 'Unclassified'));
  }

  // Compact, abbreviated class pill (2026-09-19) -- same rounded-rectangle
  // colored treatment as _rcClassBadge above, just a short label (HY/GT3/
  // P3/P2, from CAR_CLASS_ABBREV in reference-data.js) for the Dashboard's
  // Current Seat card corner figure, where it sits directly in front of
  // the car number (Matt's ask: "a hypercar would have a red rectangle,
  // rounded edges with HY in it").
  function _rcClassAbbrevPill(cls) {
    var key = String(cls || '').trim();
    var map = { LMGT3: 'rc-badge-lmgt3', LMP3: 'rc-badge-lmp3', LMP2: 'rc-badge-lmp2', Hypercar: 'rc-badge-hypercar' };
    var colorClass = map[key] || '';
    var label = (typeof CAR_CLASS_ABBREV !== 'undefined' && CAR_CLASS_ABBREV[key]) ? CAR_CLASS_ABBREV[key] : key;
    return el('span', 'rc-badge-chip rc-badge-chip-abbrev' + (colorClass ? ' ' + colorClass : ''), escapeHtml(label || '?'));
  }

  // Grouped by Class (fixed order: LMGT3 -> LMP3 -> LMP2 -> Hypercar, per
  // CAR_CLASS_LIST -- the same canonical order used everywhere else on the
  // site a class list appears), then by Season within each class (most
  // recent first, black badge per Matt's call), then one row per car --
  // manufacturer logo, then details, then its own Edit button. A class
  // with zero ACTIVE cars entered is skipped entirely rather than shown
  // empty; deactivated cars just don't appear in this browsing view (they
  // still exist -- see openEditCarModal's Reactivate button, reachable
  // once you know the car's still-active season/class to find it, or
  // directly in the Sheet).
  function buildCarsPanel(cars, token, reload) {
    var activeCars = (cars || []).filter(_rcRowActive);
    return buildGroupedAdminList(activeCars, {
      emptyMessage: 'No cars yet.',
      groupKey: function (c) { return c.Class || 'Unclassified'; },
      canonicalOrder: (typeof CAR_CLASS_LIST !== 'undefined' ? CAR_CLASS_LIST : []).slice(),
      buildGroupHeader: function (cls) {
        // No divider line under the class badge itself (2026-09-19, Matt's
        // call) -- the season/car rows beneath it already carry their own
        // lighter dividers, so the heavier .rc-dm-row line here just read
        // as a redundant rule right under the pill.
        var classHead = el('div', 'rc-dm-row rc-dm-row-noborder');
        classHead.appendChild(_rcClassBadge(cls));
        return classHead;
      },
      buildBody: function (cls, carsInClass, group) {
        var bySeason = {};
        carsInClass.forEach(function (c) {
          var season = c.Season || 'Unknown Season';
          if (!bySeason[season]) bySeason[season] = [];
          bySeason[season].push(c);
        });
        var seasonKeys = Object.keys(bySeason).sort(function (a, b) {
          var na = parseFloat(a), nb = parseFloat(b);
          if (!isNaN(na) && !isNaN(nb)) return nb - na; // numeric seasons, most recent first
          return String(b).localeCompare(String(a)); // fallback: reverse alpha
        });

        seasonKeys.forEach(function (season) {
          var seasonHead = el('div', 'rc-dm-season-head');
          seasonHead.appendChild(el('span', 'rc-dm-tree', '└'));
          seasonHead.appendChild(el('span', 'rc-badge-chip rc-badge-group', escapeHtml(season)));
          group.appendChild(seasonHead);

          bySeason[season].forEach(function (c) {
            var row = el('div', 'rc-dm-subrow-edit');
            var info = el('div', 'rc-dm-car-info');

            // Fixed-width, centered logo column -- same centered-column
            // treatment as the Sponsors popup's logo column (capped 80px
            // wide / 40px tall here, narrower than the sponsor logos' 100px),
            // so the text column's left edge lands in the same place row to
            // row regardless of a given manufacturer logo's own aspect ratio.
            var logoCol = el('div', 'rc-dm-car-logo-col');
            var logo = document.createElement('img');
            logo.className = 'rc-dm-car-logo';
            logo.alt = '';
            logo.src = manufacturerLogoSrc(c.Manufacturer || '');
            // Hides gracefully rather than showing a broken-image icon when
            // that manufacturer's logo file hasn't been uploaded yet -- same
            // pattern currentSeatBlock() uses elsewhere for this exact file
            // naming convention (see manufacturerLogoSrc()'s own comment).
            logo.onerror = function () { this.style.display = 'none'; };
            logoCol.appendChild(logo);
            info.appendChild(logoCol);

            // Two-line text column, left-justified: Team Name (black, primary),
            // Manufacturer + Car Model below it in a lighter color (Matt's
            // call). The tier pill this line used to also carry was removed
            // entirely 2026-09-19 -- car Tier classification doesn't matter
            // anymore.
            var textCol = el('div', null);
            var nameLine = el('div', 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;');
            nameLine.appendChild(el('span', 'color:var(--rc-carbon);font-weight:600;', escapeHtml(c.TeamName || '(unnamed team)')));
            textCol.appendChild(nameLine);
            var subParts = [];
            if (c.CarNumber) subParts.push('#' + c.CarNumber);
            var makeModel = [c.Manufacturer, c.CarModel].filter(Boolean).join(' ');
            if (makeModel) subParts.push(makeModel);
            textCol.appendChild(el('div', 'rc-hint', escapeHtml(subParts.join(' · ') || '(unspecified car)')));
            info.appendChild(textCol);
            row.appendChild(info);
            var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
            editBtn.type = 'button';
            editBtn.addEventListener('click', function () { openEditCarModal(c, token, reload); });
            row.appendChild(editBtn);
            group.appendChild(row);
          });
        });
      }
    });
  }

  // Car edit popup -- Season/Class/Manufacturer/Car Model/Car Number/Team
  // Name, posting to adminUpdateCar, plus a separate Deactivate/Reactivate
  // button (adminSetCarActive -- never deletes the row), same edit-fields-
  // vs-deactivate split as the Track popup above.
  function openEditCarModal(car, token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Season'));
    var season = el('input'); season.type = 'text'; season.value = car.Season || '';
    form.appendChild(season);

    form.appendChild(el('label', null, 'Class'));
    var carClass = document.createElement('select');
    (typeof CAR_CLASS_LIST !== 'undefined' ? CAR_CLASS_LIST : []).forEach(function (cls) {
      var opt = document.createElement('option'); opt.value = cls; opt.textContent = cls;
      if (car.Class === cls) opt.selected = true;
      carClass.appendChild(opt);
    });
    form.appendChild(carClass);

    form.appendChild(el('label', null, 'Manufacturer'));
    var manufacturer = el('input'); manufacturer.type = 'text'; manufacturer.value = car.Manufacturer || '';
    form.appendChild(manufacturer);
    form.appendChild(el('div', 'rc-hint', 'Used to find that manufacturer’s logo (assets/manufacturers/) -- a space becomes a dash, e.g. "Aston Martin" → aston-martin.png.'));

    form.appendChild(el('label', null, 'Car Model'));
    var carModel = el('input'); carModel.type = 'text'; carModel.value = car.CarModel || '';
    form.appendChild(carModel);

    form.appendChild(el('label', null, 'Car Number'));
    var carNumber = el('input'); carNumber.type = 'text'; carNumber.value = car.CarNumber || '';
    form.appendChild(carNumber);

    form.appendChild(el('label', null, 'Team Name'));
    var teamName = el('input'); teamName.type = 'text'; teamName.value = car.TeamName || '';
    form.appendChild(teamName);

    // Tier and PreviousTier fields removed entirely 2026-09-19 -- Matt's
    // call: car Tier classification doesn't matter anymore. Cars.Tier/
    // PreviousTier are now archived columns in the backend (see Core.gs's
    // TAB_SCHEMAS), untouched but never read or written going forward.

    form.appendChild(el('label', null, 'Team Description'));
    var teamDesc = document.createElement('textarea');
    teamDesc.rows = 3;
    teamDesc.value = car.TeamDesc || '';
    form.appendChild(teamDesc);
    form.appendChild(el('div', 'rc-hint', 'A short paragraph shown to drivers on the Choose Your Team screen, between the team header and its Car Objective.'));

    var saveBtn = el('button', null, 'Save Changes');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var isActive = _rcRowActive(car);
    var statusWrap = el('div', 'padding-top:16px;margin-top:16px;border-top:1px solid var(--rc-silver);');
    var toggleBtn = el('button', 'rc-btn-primary rc-btn-sm', isActive ? 'Deactivate This Car' : 'Reactivate This Car');
    toggleBtn.type = 'button';
    statusWrap.appendChild(toggleBtn);
    body.appendChild(statusWrap);

    var modalHandle = showModal('Edit Car', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      // Instant, no wait on the server (2026-09-03, Matt's call: "all the
      // admin/data management functions work the same" as the rest of
      // the site). The popup closes the moment Save Changes is
      // submitted; the actual write happens silently in the background.
      // A failure can't un-close an already-closed modal, so it just
      // says so via toast -- the admin can reopen Edit Car and try again.
      modalHandle.close();
      fetchApi('adminUpdateCar', {
        method: 'POST', token: token,
        body: {
          carId: car.CarID,
          Season: season.value.trim(),
          Class: carClass.value,
          Manufacturer: manufacturer.value.trim(),
          CarModel: carModel.value.trim(),
          CarNumber: carNumber.value.trim(),
          TeamName: teamName.value.trim(),
          TeamDesc: teamDesc.value.trim()
        }
      })
        .then(function (data) {
          if (!data.success) {
            showToast(data.message || 'Could not save changes -- reopen Edit Car and try again.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();
        })
        .catch(function () {
          showToast('Could not reach the server -- changes not saved.', 'error');
        });
    });

    toggleBtn.addEventListener('click', function () {
      // Confirm step added (2026-09-13 fix) -- same reasoning as the
      // account status toggle above: deactivating a car is reversible
      // (Reactivate undoes it) but had no undo-before-you-commit step at
      // all, unlike every other moderately-destructive action here. Use
      // the light openConfirmModal, not the heavier type-to-confirm
      // dialog reserved for truly irreversible actions like End Season/Erase.
      if (!isActive) {
        // Reactivating needs no extra confirmation -- only the
        // deactivate direction is destructive enough to double-check.
        doToggleCarActive_();
        return;
      }
      openConfirmModal(
        'Deactivate Car',
        'Deactivate car #' + (car.CarNumber || '') + ' (' + (car.Manufacturer || '') + ' ' + (car.CarModel || '') + ', ' + (car.TeamName || '') + ')? It will no longer be available for a driver to select.',
        'Deactivate This Car',
        doToggleCarActive_
      );
    });

    function doToggleCarActive_() {
      // Same instant pattern as Save Changes above.
      modalHandle.close();
      fetchApi('adminSetCarActive', {
        method: 'POST', token: token,
        body: { carId: car.CarID, active: isActive ? 'Inactive' : 'Active' }
      })
        .then(function (data) {
          if (!data.success) {
            showToast(data.message || 'Could not update this car -- reopen Edit Car and try again.', 'error');
            return;
          }
          if (reload) reload(); else rcReloadAfterSave();
        })
        .catch(function () {
          showToast('Could not reach the server -- car status not changed.', 'error');
        });
    }
  }

  // Dropdown for a standardized option list (Matt's call: "use dropdown
  // boxes anytime there are options which are standardized and use text
  // boxes for only custom things that do not have set options"). If the
  // record's current value isn't already in that list (an older/one-off
  // entry), it's prepended as an extra option so editing never silently
  // discards it -- the dropdown always has to contain whatever's already
  // selected.
  function _rcBuildSelectWithFallback(options, currentValue) {
    var select = document.createElement('select');
    var list = options.slice();
    if (currentValue && list.indexOf(currentValue) === -1) list = [currentValue].concat(list);
    list.forEach(function (opt) {
      var o = document.createElement('option'); o.value = opt; o.textContent = opt;
      if (opt === currentValue) o.selected = true;
      select.appendChild(o);
    });
    return select;
  }

  // _rcCarTierBadge (the Car Objectives Low/Mid/High/Elite tier pill) was
  // removed entirely 2026-09-19 -- Matt's call: car Tier classification
  // doesn't matter anymore, and tier information should never surface on
  // the dashboard, Car Management's list, or the Choose Your Team screen.
  // The new compact abbreviated class pill (_rcClassAbbrevPill, above)
  // replaces it on the Current Seat card.

  // ---------------------------------------------------------------------
  // TOP-LEVEL RENDER
  // ---------------------------------------------------------------------
  function buildFullProfileUI(profile, token, dashboardData) {
    currentProfile = profile;
    currentToken = token;

    // Cross-page bridge for the header's Edit Profile menu item
    // (2026-09-01, Matt's call) -- js/header.js runs on every page in its
    // own scope and can't reach openEditProfileModal directly (it's
    // closured inside this page's own IIFE), so it calls this instead
    // whenever it's here. See header.js's own comment for the fallback
    // path (a page where this bridge doesn't exist yet).
    window.rcOpenEditProfileModal = function () { openEditProfileModal(currentProfile, currentToken); };

    // Same bridge pattern, for the header bell's notification links
    // (2026-09-02, Matt's call: notifications should link straight to the
    // page they're about, not just carry an OK button). A plain
    // href="Account.html#admin" would only work correctly when clicked
    // from a DIFFERENT page -- clicking it while already ON Account.html
    // is a same-document hash change (no reload), which showSection() is
    // never told about, so the visible section wouldn't actually switch.
    // js/header.js calls this instead whenever it's here (this page,
    // already loaded); its own click handler falls back to a real
    // navigation (window.location.href) when this bridge doesn't exist,
    // same "call it directly if present, otherwise navigate and let the
    // other side pick it up" shape as rcOpenEditProfileModal above. Runs
    // the section's own lazy renderer too, same as an actual nav-item
    // click (see RC_LAZY_SECTION_RENDERERS/makeNavButton above) so the
    // section shows current data rather than whatever it last held (or
    // nothing, if it was never opened this page load).
    window.rcNavigateToSection = function (id) {
      showLazySection(id, currentToken);
    };

    // Same bridge, other direction -- a click on Edit Profile from a page
    // OTHER than Account.html sets this flag and navigates here; once
    // this driver's own profile/token are actually loaded (right here),
    // open the modal immediately, same one-shot "consume and clear"
    // handoff pattern raceclub_fresh_profile already uses below.
    if (sessionStorage.getItem('raceclub_open_edit_profile')) {
      sessionStorage.removeItem('raceclub_open_edit_profile');
      openEditProfileModal(currentProfile, currentToken);
    }

    buildSidebarNav();
    document.getElementById('rc-sidebar-nav').classList.remove('rc-nav-loading');
    renderPlaceholderSections();
    renderHelpSection();

    // Cumulative access hierarchy (race-club-v03-system-map.html, Section
    // 0): Driver < Steward < Organizer < Admin. Organizer's own
    // capability is "edit season info & schedule", which is exactly
    // League Management -- so Organizer unlocks that nav item too, same
    // as Admin (who has every Organizer capability plus more). Protests
    // is no longer gated here (2026-09-08) -- filing one is an ordinary
    // Driver action, moved into the main nav list above; only RULING on
    // one (League Management's EDIT popup) stays Steward-and-above,
    // enforced server-side. Admin (which now hosts what Data Management
    // used to show -- Members/Tracks/Cars/Sponsors popups) stays
    // Admin-only -- that maps to Level 4 capabilities ("change anyone's
    // access level", manage reference data), not anything Organizer has
    // per the system map. Revisit if that design changes.
    if (profile.role === 'Admin' || profile.role === 'Organizer') {
      document.getElementById('rc-nav-league').style.display = 'flex';
      showUpperNavDivider();
    }
    // Stewarding -- Steward and above (cumulative hierarchy: Steward <
    // Organizer < Admin), same level Protests RULING already requires
    // server-side (Protests.gs). See the nav-button comment above for why
    // this link exists ahead of the page it opens.
    if (profile.role === 'Admin' || profile.role === 'Organizer' || profile.role === 'Steward') {
      document.getElementById('rc-nav-stewarding').style.display = 'flex';
      showUpperNavDivider();
    }
    if (profile.role === 'Admin') {
      document.getElementById('rc-nav-admin').style.display = 'flex';
      showUpperNavDivider();
    }

    renderDashboardSection(profile, token, dashboardData);

    // No more background prefetching of Calendar/Results/Protests after
    // the Dashboard loads (2026-09-18, Matt's call: "kill the load
    // everything on the page when visiting Account.html... just load the
    // dashboard, and when someone clicks on a link from the sidebar, then
    // load that page" -- reversing the 2026-09-03/09-08 calls that put
    // this prefetch chain here in the first place). Visiting Account.html
    // now only ever fetches the Dashboard's own cards; every other
    // section (Calendar, Results, Career, Protests, League Management,
    // Admin) still loads itself the first time its nav item is actually
    // clicked, via RC_LAZY_SECTION_RENDERERS/showLazySection below --
    // that on-click behavior was already there and needed no changes,
    // this only removes the extra silent fetching that used to run ahead
    // of it.

    // Same-page restore after a popup save (2026-09-01, Matt's call) --
    // see rcReloadAfterSave() above for the full story. Only trusts the
    // URL hash if it names a section that both actually exists AND this
    // driver's own role currently has a visible nav button for (covers
    // Admin/League Management/Protests, which are permission-gated above
    // this point) -- anything else falls back to Dashboard, same as a
    // plain visit to this page always has.
    var restoreSectionId = 'dashboard';
    var hashSectionId = (window.location.hash || '').replace(/^#/, '');
    if (hashSectionId && document.getElementById('rc-section-' + hashSectionId)) {
      var hashNavBtn = document.getElementById('rc-nav-' + hashSectionId);
      if (!hashNavBtn || hashNavBtn.style.display !== 'none') restoreSectionId = hashSectionId;
    }
    if (RC_LAZY_SECTION_RENDERERS[restoreSectionId]) {
      rcLoadedLazySections[restoreSectionId] = true;
      RC_LAZY_SECTION_RENDERERS[restoreSectionId](token);
    }
    showSection(restoreSectionId);
    // Clean the hash off the URL bar once it's been consumed -- leaves the
    // reload's destination unmarked in history rather than piling up a
    // '#sponsors' etc. that a plain refresh or back-button visit would
    // otherwise keep re-landing on.
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  }

  // updateAdminNavDot() removed (2026-09-02, Matt's call: "get rid of
  // notification bubbles on the links" -- the sidebar Admin link used to
  // carry its own red dot for a pending sign-up, duplicating the header
  // bell's own pending-approval notification for the same event. One
  // signal (the bell) now covers it.

  // mustChangePassword forces a password change before the driver can do
  // anything else -- the sidebar/topbar stay hidden and #rc-forced-password
  // shows ONLY the passwordChangeSection() form until it succeeds.
  // passwordChangeSection now does a full rcReloadAfterSave() on success
  // (2026-08-30, Matt's call: every popup save reloads) rather than
  // removing its own box -- the reload re-fetches the profile fresh, sees
  // mustChangePassword is no longer set, and lands on the normal
  // dashboard on its own. The MutationObserver below is dead code left in
  // place as a harmless fallback (it would only ever fire if something
  // removed `box` from the DOM without a reload following) rather than
  // ripped out for a change this narrow.
  function renderProfile(profile, token, dashboardData) {
    if (profile.mustChangePassword) {
      document.getElementById('rc-sidebar').style.display = 'none';
      document.getElementById('rc-topbar').style.display = 'none';

      var lockWrap = document.getElementById('rc-forced-password');
      lockWrap.style.display = 'block';
      lockWrap.innerHTML = '';

      var container = el('div', 'rc-forced-password-wrap');
      container.appendChild(el('p', null, 'For security, please set a new password before continuing to your profile.'));
      var box = passwordChangeSection(token);
      container.appendChild(box);
      lockWrap.appendChild(container);

      var observer = new MutationObserver(function () {
        if (!document.body.contains(box)) {
          observer.disconnect();
          lockWrap.style.display = 'none';
          document.getElementById('rc-sidebar').style.display = '';
          document.getElementById('rc-topbar').style.display = '';
          profile.mustChangePassword = false;
          buildFullProfileUI(profile, token, dashboardData);
        }
      });
      observer.observe(container, { childList: true, subtree: true });
      return;
    }

    buildFullProfileUI(profile, token, dashboardData);
  }

  // ---------------------------------------------------------------------
  // SESSION EXPIRED LOCK (2026-09-18) -- the header now paints
  // optimistically from cache the instant the page loads (see the
  // <script>renderHeader() call up top), instead of waiting on the
  // server to confirm the token first. That's a trade: most of the time
  // the session really is still valid and the driver gets an instant,
  // no-flash avatar; but if the background getProfile check below comes
  // back and says the token is no longer good, we can't just quietly
  // redirect to login.html anymore -- the driver may have already been
  // looking at (stale, cached) account chrome for a moment. This swaps
  // the whole page over to a plain "you got logged out, here's how to
  // get back in" screen instead, same shape as the mustChangePassword
  // lock above (sidebar/topbar hidden, one centered panel), so it reads
  // as an intentional state rather than the page silently vanishing out
  // from under them.
  // ---------------------------------------------------------------------
  function showSessionExpiredLock() {
    document.getElementById('rc-sidebar').style.display = 'none';
    document.getElementById('rc-topbar').style.display = 'none';
    document.getElementById('rc-profile-root').style.display = 'none';

    var lockWrap = document.getElementById('rc-session-locked');
    lockWrap.style.display = 'block';
    lockWrap.innerHTML = '';

    var container = el('div', 'rc-session-locked-wrap');
    container.appendChild(el('div', 'rc-session-locked-icon', ICON_LOCK.replace('width="18" height="18"', 'width="26" height="26"')));
    container.appendChild(el('h2', 'margin:0 0 8px;', 'Your Session Has Expired'));
    container.appendChild(el('p', null, 'For your security, you\'ve been logged out. Log back in to keep going.'));
    var link = document.createElement('a');
    link.href = 'login.html';
    link.className = 'rc-btn-primary';
    link.textContent = 'Log Back In';
    container.appendChild(link);
    lockWrap.appendChild(container);
  }

  // ---------------------------------------------------------------------
  // LOAD PROFILE -- deliberately the LAST thing in this script (see the
  // comment near the top of the auth gate for why).
  //
  // Arriving here right after a successful login skips a second getProfile
  // round-trip: login.html's own response already IS a full profile
  // payload, stashed in sessionStorage under 'raceclub_fresh_profile'
  // right before redirecting here. It's read-once (removed immediately),
  // so any other way of arriving at this page still fetches fresh data.
  // ---------------------------------------------------------------------
  document.getElementById('rc-sidebar-nav').classList.add('rc-nav-loading');
  buildSidebarNav();

  // Dashboard cards never show their own loading state (Matt's call: "no
  // loaders in any of the cards, ever, I don't even want the
  // functionality to exist") -- every card fetch is fired here,
  // immediately, in parallel with the profile load itself.
  //
  // 2026-09-03 rewrite (Matt's ask: "instead of loading everything in on
  // the dash, have the dash populate instantly and load the cards one by
  // one like the wager card loads, fading into place"): NOTHING here
  // gates the page anymore -- not even the 3-call "priority batch" from
  // earlier the same day. All 6 dashboard-data calls fire in this same
  // breath (fetchDashboardData below) and are handed straight through as
  // still-in-flight promises; the Dashboard section is built (see
  // renderProfile -> renderDashboardSection) the instant the PROFILE
  // fetch itself resolves, and every single card fades its real content
  // in independently the moment its own fetch resolves, via
  // asyncDashCard/buildDashboardDataRows above. The only thing the
  // page-wide loading spinner still waits on is the profile fetch.
  //
  // A failed card fetch still resolves (to a {success:false} stand-in via
  // .catch) rather than rejecting, so one card's server error never
  // leaves that one card's own placeholder hanging forever or blocks any
  // other card.
  //
  // getMyWagerSummary is deliberately NOT part of this batch -- folding
  // it in here (2026-09-02) roughly DOUBLED the whole dashboard's load
  // time, because Apps Script Web Apps don't actually run several
  // fetch() calls from the same user fully in parallel server-side
  // (per-user concurrent-execution limits mean they queue up behind each
  // other to some degree). The Wager dashboard card fetches its own data
  // separately, same as it always has.
  var dashboardData = fetchDashboardData(token);

  // See the stagger comment below, at the getProfile call this gates.
  var RC_PROFILE_FETCH_STAGGER_MS = 150;

  var freshProfileRaw = sessionStorage.getItem('raceclub_fresh_profile');
  if (freshProfileRaw) sessionStorage.removeItem('raceclub_fresh_profile');
  var freshProfile = null;
  if (freshProfileRaw) {
    try { freshProfile = JSON.parse(freshProfileRaw); } catch (err) { freshProfile = null; }
  }

  if (freshProfile && freshProfile.success) {
    renderHeader(); // header fetches its own notifications now -- see js/header.js
    document.getElementById('rc-loading').style.display = 'none';
    document.getElementById('rc-profile-root').style.display = 'block';
    renderProfile(freshProfile.profile, token, dashboardData);
  } else {
    // Staggered by RC_PROFILE_FETCH_STAGGER_MS behind the dashboard fetch
    // above, rather than fired in the very same breath (2026-09-14 fix,
    // part of the same "dashboard sometimes never loads" report). These
    // two used to hit the Apps Script Web App at the exact same instant on
    // every page load; since Apps Script queues same-user requests instead
    // of truly running them in parallel (see the long comment above
    // fetchDashboardData), sending them simultaneously just meant they
    // fought over the same queue slot right out of the gate. A short delay
    // is enough to let the heavier 8-lookup dashboard call actually get
    // queued first, without meaningfully lengthening the wait for either
    // one -- this is a small head start, not a "wait for the dashboard to
    // fully finish" sequencing.
    new Promise(function (resolve) { setTimeout(resolve, RC_PROFILE_FETCH_STAGGER_MS); })
      .then(function () { return fetchApi('getProfile', { token: token }); })
      .then(function (data) {
        if (!data.success) {
          // Token confirmed invalid/expired by the server (2026-09-18,
          // Matt's call) -- no more silently yanking the driver away to
          // login.html mid-read. clearToken() still actually logs them
          // out locally, and the header swaps from its optimistic
          // (possibly stale) logged-in avatar to a plain logged-out
          // state, but the page itself stays put and explains what
          // happened via showSessionExpiredLock() instead of vanishing.
          clearToken();
          renderHeader({ forceLoggedOut: true });
          document.getElementById('rc-loading').style.display = 'none';
          showSessionExpiredLock();
          return;
        }
        setProfileCache(data.profile); // keeps the header avatar current on every other page too
        renderHeader(); // confirmed by the API -- safe to show as logged in; fetches its own notifications now
        document.getElementById('rc-loading').style.display = 'none';
        document.getElementById('rc-profile-root').style.display = 'block';
        renderProfile(data.profile, token, dashboardData);
      })
      .catch(function () {
        // Couldn't even REACH the server -- unlike the branch above, this
        // says nothing about whether the token itself is still good (see
        // the long-standing comment on renderHeader's opts.forceLoggedOut
        // in js/header.js), so the header is deliberately left exactly as
        // it was optimistically painted on page load instead of being
        // forced to a logged-out state over what might just be a dropped
        // connection.
        document.getElementById('rc-loading').style.display = 'none';
        var err = document.getElementById('rc-error');
        err.style.display = 'block';
        err.textContent = 'Could not reach the server. Check API_BASE_URL and try again.';
      });
  }
})();
</script>
</body>
</html>
