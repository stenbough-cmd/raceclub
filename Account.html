    // Holds here indefinitely -- no auto-advance timer (Matt's call,
    // 2026-08-30: "What the video SHOULD do is go [to] the congratulations
    // screen at the end with the CONTINUE/REPLAY options and hold"). Only
    // the Continue button below moves on to the contract screen.
    var revealStarted = false;
    var advancedPastReveal = false;
    function advanceToReveal() {
      if (revealStarted) return;
      revealStarted = true;
      stage.className = 'rc-signing-stage rc-signing-stage-reveal';
      stage.innerHTML = '';
      stage.appendChild(el('div', 'rc-signing-wordmark rc-signing-wordmark-lg', 'RACE CLUB'));
      stage.appendChild(el('div', 'rc-signing-congrats', 'CONGRATULATIONS'));
      // Big open/close quote marks + a "— Team Principal" attribution
      // underneath, right-aligned (2026-08-30, Matt: "add larger
      // quotations in front and after it to show that someone from the
      // team said it... Add emdash Team Principal underneath to the
      // right") -- reads as an actual quote from someone at the team, not
      // just hype copy.
      // Wrapped together in one block with an explicit width (rather than
      // each just being its own flex child) so the attribution's
      // text-align: right below actually has real room to align against
      // -- .rc-signing-stage's flex column otherwise shrink-wraps every
      // child to its own content width, which would leave "— Team
      // Principal" with nothing to the right of it to align away from.
      var hypeWrap = el('div', 'rc-signing-hype-wrap');
      var hypeQuote = el('div', 'rc-signing-hype');
      hypeQuote.appendChild(el('span', 'rc-signing-hype-mark rc-signing-hype-mark-open', '“'));
      hypeQuote.appendChild(el('span', 'rc-signing-hype-text', rcPickWelcomeLine_(team)));
      hypeQuote.appendChild(el('span', 'rc-signing-hype-mark rc-signing-hype-mark-close', '”'));
      hypeWrap.appendChild(hypeQuote);
      hypeWrap.appendChild(el('div', 'rc-signing-hype-attribution', '· Team Principal'));
      stage.appendChild(hypeWrap);

      var identity = el('div', 'rc-signing-reveal-identity');
      if (team.manufacturer && typeof manufacturerLogoSrc === 'function') {
        var logo = document.createElement('img');
        logo.className = 'rc-signing-reveal-logo';
        logo.alt = team.manufacturer;
        logo.src = manufacturerLogoSrc(team.manufacturer);
        logo.onerror = function () { this.style.display = 'none'; };
        identity.appendChild(logo);
      }
      identity.appendChild(el('div', 'rc-signing-reveal-team',
        escapeHtml((team.teamName || 'Unnamed Team') + (team.carNumber ? ' #' + team.carNumber : ''))));
      stage.appendChild(identity);

      var btnRow = el('div', 'rc-signing-reveal-btn-row');
      btnRow.style.opacity = '0';

      var replayBtn = el('button', 'rc-btn-secondary rc-signing-replay', '↻ Replay Video');
      replayBtn.type = 'button';
      replayBtn.addEventListener('click', function () {
        revealStarted = false;
        playFilmStage();
      });
      btnRow.appendChild(replayBtn);

      var continueBtn = el('button', 'rc-btn-primary rc-signing-continue', 'Continue');
      continueBtn.type = 'button';
      continueBtn.addEventListener('click', advanceToContract);
      btnRow.appendChild(continueBtn);

      stage.appendChild(btnRow);
      setTimeout(function () { btnRow.style.opacity = '1'; }, 1400);
    }

    // Continue on the congratulations screen goes straight to the reload
    // now (Matt's call, 2026-09-01) -- no contract-recap modal in between.
    // Team identity, seat cost, tier, and Car Objective bonus are all
    // already visible on the dashboard the reload lands back on (Current
    // Seat, Registration Status), and sponsors are no longer picked at
    // signing time, so that recap card had nothing left to add.
    //
    // The registration modal (Choose Your Class/Team) itself was never
    // actually closed -- see the "SIGNING SEQUENCE" comment above: it's
    // deliberately left open the whole time, just visually hidden behind
    // this overlay (which stacks on top of it). That's exactly what Matt
    // saw as "something loaded for a split second" (2026-09-01 bug
    // report): overlay.remove() revealed that still-open modal -- whatever
    // screen it was last showing -- for a frame before onFinish() below
    // could navigate/refresh it away. Fix: close it here FIRST, silently
    // (skipOnClose -- its own onClose would re-fetch Registration
    // Status/Current Seat/etc. in place, which is redundant work right
    // before onFinish()'s reload and was contributing to the same flash),
    // so there's nothing left behind for overlay.remove() to expose.
    function advanceToContract() {
      if (advancedPastReveal) return;
      advancedPastReveal = true;
      if (rcActiveModalCloseFn) rcActiveModalCloseFn(true);
      overlay.remove();
      onFinish();
    }
  }

  // ---------------------------------------------------------------------
  // SPONSORS PAGE (2026-08-30) -- fetches fresh every time the link is
  // clicked, same lazy-fetch-on-click pattern as Calendar/League
  // Management, backed by action=getMySponsors (handleGetMySponsors,
  // DataCache.gs). Four states:
  //   1. Not on a team -- nothing to show, no button (matches Next Race's
  //      own "not registered" gate).
  //   2. On a team, sponsors not chosen yet, season not started -- a
  //      notice + "Choose Sponsors" button.
  //   3. On a team, sponsors chosen, season not started -- the 3 sponsors
  //      + a "Change Sponsors" button (still swappable pre-season).
  //   4. Season started (Active/Completed) -- the 3 sponsors (or a "you
  //      never picked" notice if still blank) with no button at all --
  //      locked for the rest of the season, same rule that always applied,
  //      just enforced at season-start now instead of at registration.
  // ---------------------------------------------------------------------
  // Comparison Table redesign (2026-09-01, Matt's call -- picked this
  // direction after reviewing 3 mockups: "I like the DIRECTION 1 page...
  // I especially like the explanation at the top under the SPONSORS
  // header"). Four pieces top to bottom: an explainer paragraph, the
  // driver's own up-to-3 picks as a compact chip strip, a race-by-race
  // "Sponsor Goals" quick-glance panel built only from those picks, then
  // every active sponsor as one tier-grouped table with a Bonus/Penalty
  // swing bar per row so options are a straight down-the-column scan
  // instead of separate cards. No tooltips anywhere on this page (Matt's
  // standing call) -- everything is spelled out in the row/column itself.
  var _RC_TIER_TEXT_CLASS = { Safe: 'rc-tier-text-safe', Balanced: 'rc-tier-text-balanced', Risky: 'rc-tier-text-risky' };

  // "Current Picks" -- a compact chip strip (logo, name, tier label),
  // always 3 slots wide; any slot this driver hasn't filled renders as an
  // "Open Slot" placeholder -- dashed border, muted, same treatment as
  // the Calendar page's Bye Week card. Chips are always sorted easiest to
  // riskiest (Safe -> Balanced -> Risky) regardless of pick order. "Sponsor
  // Goals" (2026-09-01: folded into this same container, one panel instead
  // of two, plus this driver's own "Current Picks"/"All Sponsors" panels
  // now carry the same rc-dash-card chrome the Dashboard's own cards use --
  // both Matt's calls) lives right underneath, inside the same card: only
  // this driver's picked sponsors' Bonus/Penalty triggers, as two
  // side-by-side columns, so what's actually "in play" for the next race
  // reads as one quick-glance checklist without leaving the picks panel.
  // In-place picker (2026-09-02 redesign, replacing the "Choose/Change
  // Sponsors" popup, Matt's call): instead of opening a modal, clicking a
  // slot here -- an Open Slot, or a chip you already picked and want to
  // swap -- targets that slot and scrolls down to the All Sponsors table,
  // where clicking a row fills it. The pick shows up in this strip (and
  // checkmarks in the table) THE INSTANT it's clicked; the actual
  // chooseSponsors save happens quietly in the background (see saveNow()
  // in renderSponsorsSection) with no spinner, no "Saving..." state, no
  // popup to close -- the driver never has to wait on it. ctx (built by
  // renderSponsorsSection) is the shared state/behavior this panel and
  // buildSponsorComparisonTable both read and drive:
  //   ctx.getPickedIds()    -> current up-to-3 SponsorIDs (may include one
  //                            just picked but not yet confirmed saved)
  //   ctx.getActiveTarget() -> null | '__open__' | a SponsorID -- which
  //                            slot (if any) is currently awaiting a pick
  //   ctx.catalogById       -> SponsorID -> full sponsor row, for display
  //   ctx.locked            -> true once the season's started
  //   ctx.onSlotClick(id)   -> called with a SponsorID or '__open__'
  // Returns { el, refresh() } -- refresh() rebuilds just the strip/goals
  // in place (called after every pick/removal) without touching the rest
  // of the page.
  function buildCurrentPicksPanel(ctx) {
    var panel = el('div', 'rc-panel rc-dash-card');
    panel.appendChild(el('h3', 'rc-dash-card-title', 'Current Picks'));
    panel.appendChild(el('p', 'rc-hint', ctx.locked
      ? 'You can choose up to 3 sponsors for the season.'
      : 'You can choose up to 3 sponsors for the season. Click a slot below, then pick a sponsor from the list to fill it.'));

    var stripHolder = el('div');
    panel.appendChild(stripHolder);
    var goalsHolder = el('div');
    panel.appendChild(goalsHolder);

    var TIER_ORDER = ['Safe', 'Balanced', 'Risky'];
    function sortedPicks() {
      var ids = ctx.getPickedIds();
      var sponsors = ids.map(function (id) { return ctx.catalogById[id]; }).filter(Boolean);
      sponsors.sort(function (a, b) {
        var ai = TIER_ORDER.indexOf(a.Tier); if (ai === -1) ai = TIER_ORDER.length;
        var bi = TIER_ORDER.indexOf(b.Tier); if (bi === -1) bi = TIER_ORDER.length;
        return ai - bi;
      });
      return sponsors;
    }

    function renderStrip() {
      stripHolder.innerHTML = '';
      var sponsors = sortedPicks();
      var activeTarget = ctx.getActiveTarget();
      var strip = el('div', 'rc-picks-strip');
      sponsors.forEach(function (s) {
        var isActive = activeTarget === s.SponsorID;
        var chip = el('div', 'rc-pick-chip' + (!ctx.locked ? ' rc-pick-chip-clickable' : '') + (isActive ? ' rc-pick-chip-active' : ''));
        var logo = document.createElement('img');
        logo.className = 'rc-pick-chip-logo';
        logo.alt = '';
        logo.src = sponsorLogoSrc(s.Name || '');
        logo.onerror = function () { this.style.display = 'none'; };
        chip.appendChild(logo);

        var textCol = el('div', 'rc-pick-chip-text');
        textCol.appendChild(el('div', 'rc-pick-chip-name', escapeHtml(s.Name || '(unnamed sponsor)')));
        var tierClass = _RC_TIER_TEXT_CLASS[s.Tier] || '';
        textCol.appendChild(el('div', 'rc-pick-chip-tier' + (tierClass ? ' ' + tierClass : ''), escapeHtml(s.Tier || 'Unclassified')));
        chip.appendChild(textCol);

        if (!ctx.locked) {
          chip.setAttribute('role', 'button');
          chip.tabIndex = 0;
          chip.addEventListener('click', function () { ctx.onSlotClick(s.SponsorID); });
          chip.addEventListener('keydown', function (evt) { if (evt.key === 'Enter' || evt.key === ' ') { evt.preventDefault(); ctx.onSlotClick(s.SponsorID); } });
        }
        strip.appendChild(chip);
      });
      for (var i = sponsors.length; i < 3; i++) {
        var isOpenActive = activeTarget === '__open__';
        var open = el('div', 'rc-pick-chip rc-pick-chip-open' + (!ctx.locked ? ' rc-pick-chip-clickable' : '') + (isOpenActive ? ' rc-pick-chip-active' : ''));
        open.appendChild(el('div', 'rc-pick-chip-open-label', 'Open Slot'));
        if (!ctx.locked) {
          open.setAttribute('role', 'button');
          open.tabIndex = 0;
          open.addEventListener('click', function () { ctx.onSlotClick('__open__'); });
          open.addEventListener('keydown', function (evt) { if (evt.key === 'Enter' || evt.key === ' ') { evt.preventDefault(); ctx.onSlotClick('__open__'); } });
        }
        strip.appendChild(open);
      }
      stripHolder.appendChild(strip);
    }

    // Sponsor Goals -- folded into this same card (2026-09-01, Matt's
    // call), separated from the picks strip above by its own light rule +
    // sub-heading rather than a second rc-dash-card-title (only the outer
    // card gets that treatment). Explicitly calls out that these are
    // race-by-race, unlike the car's own season-long Season Objective,
    // since that distinction isn't obvious just from looking at a
    // sponsor's terms.
    function renderGoals() {
      goalsHolder.innerHTML = '';
      goalsHolder.appendChild(el('div', 'rc-panel-subhead', 'Sponsor Goals'));
      var sponsors = sortedPicks();
      if (!sponsors.length) {
        // Short empty-state note only (2026-09-01, Matt's call) -- not the
        // longer two-line explainer this used to have, just enough to say
        // why the section below is blank.
        goalsHolder.appendChild(el('p', 'rc-hint', 'Goals will appear once sponsors are chosen.'));
        return;
      }
      var goalsGrid = el('div', 'rc-sponsor-goals-grid');
      var bonusCol = el('div', 'rc-sponsor-goals-col');
      bonusCol.appendChild(el('div', 'rc-sponsor-goals-col-head rc-sponsor-goals-col-head-bonus', 'Bonuses'));
      var penaltyCol = el('div', 'rc-sponsor-goals-col');
      penaltyCol.appendChild(el('div', 'rc-sponsor-goals-col-head rc-sponsor-goals-col-head-penalty', 'Penalties'));

      sponsors.forEach(function (s) {
        var bonusAmt = Number(s.BonusAmount) || 0;
        var penaltyAmt = Math.abs(Number(s.PenaltyAmount) || 0);

        var bRow = el('div', 'rc-sponsor-goal-row');
        bRow.appendChild(el('div', 'rc-sponsor-goal-amt rc-sponsor-goal-amt-bonus', '+$' + bonusAmt));
        var bText = el('div', 'rc-sponsor-goal-text');
        bText.appendChild(el('div', 'rc-sponsor-goal-trigger', escapeHtml(s.BonusType || 'Bonus')));
        bText.appendChild(el('div', 'rc-sponsor-goal-sponsor', escapeHtml(s.Name || '')));
        bRow.appendChild(bText);
        bonusCol.appendChild(bRow);

        var pRow = el('div', 'rc-sponsor-goal-row');
        pRow.appendChild(el('div', 'rc-sponsor-goal-amt rc-sponsor-goal-amt-penalty', '−$' + penaltyAmt));
        var pText = el('div', 'rc-sponsor-goal-text');
        pText.appendChild(el('div', 'rc-sponsor-goal-trigger', escapeHtml(s.PenaltyType || 'Penalty')));
        pText.appendChild(el('div', 'rc-sponsor-goal-sponsor', escapeHtml(s.Name || '')));
        pRow.appendChild(pText);
        penaltyCol.appendChild(pRow);
      });

      goalsGrid.appendChild(bonusCol);
      goalsGrid.appendChild(penaltyCol);
      goalsHolder.appendChild(goalsGrid);
    }

    if (ctx.locked) {
      panel.appendChild(el('p', 'color:var(--rc-steel);font-size:12.5px;margin-top:14px;', ctx.getPickedIds().length
        ? 'The season has started -- sponsors are locked in for the rest of it.'
        : 'The season started before you chose your sponsors -- sponsors can no longer be picked this season.'));
    }

    renderStrip();
    renderGoals();
    return { el: panel, refresh: function () { renderStrip(); renderGoals(); } };
  }

  // Trigger glossary -- the Sponsors page's third container (2026-09-01,
  // Matt's call): every possible bonus trigger and every possible penalty
  // trigger, name in a left column and its full plain-language description
  // in a column to the right, same rc-dash-card chrome as the other two
  // Sponsors-page panels. This is where the full trigger descriptions live
  // now that the Choose/Change Sponsors popup only shows amount + trigger
  // name (see buildSponsorTermsLine above) -- one place to read exactly
  // what each trigger means instead of repeating it in every popup.
  function buildSponsorTriggerGlossary() {
    var panel = el('div', 'rc-panel rc-dash-card rc-trigger-glossary-panel');
    panel.appendChild(el('h3', 'rc-dash-card-title', 'Bonus & Penalty Triggers'));
    panel.appendChild(el('p', 'rc-hint', 'Every trigger a sponsor can be built around, and exactly what it takes to earn or avoid it. All of these are read straight off the race XML, no steward judgment involved.'));

    function buildGroup(title, triggers, descMap, kindClass) {
      var group = el('div', 'rc-trigger-glossary-group');
      group.appendChild(el('div', 'rc-trigger-glossary-group-head rc-trigger-glossary-group-head-' + kindClass, title));
      triggers.forEach(function (t) {
        var row = el('div', 'rc-trigger-glossary-row');
        row.appendChild(el('div', 'rc-trigger-glossary-name rc-trigger-glossary-name-' + kindClass, escapeHtml(t)));
        row.appendChild(el('div', 'rc-trigger-glossary-desc', escapeHtml(descMap[t] || t)));
        group.appendChild(row);
      });
      return group;
    }

    panel.appendChild(buildGroup('Bonuses', (typeof SPONSOR_BONUS_TRIGGERS !== 'undefined') ? SPONSOR_BONUS_TRIGGERS : [], (typeof SPONSOR_BONUS_TRIGGER_DESCRIPTIONS !== 'undefined') ? SPONSOR_BONUS_TRIGGER_DESCRIPTIONS : {}, 'bonus'));
    panel.appendChild(buildGroup('Penalties', (typeof SPONSOR_PENALTY_TRIGGERS !== 'undefined') ? SPONSOR_PENALTY_TRIGGERS : [], (typeof SPONSOR_PENALTY_TRIGGER_DESCRIPTIONS !== 'undefined') ? SPONSOR_PENALTY_TRIGGER_DESCRIPTIONS : {}, 'penalty'));

    return panel;
  }

  // Full sponsor catalog as one tier-grouped comparison table (2026-09-01
  // redesign, replacing the old rows-inside-a-folder list) -- Sponsor /
  // Tier / Bonus / Penalty / Risk-Reward swing bar, one row per active
  // sponsor, grouped Safe -> Balanced -> Risky with a group-header row
  // per tier. This driver's own current picks are checkmarked and
  // highlighted (green, same selected-card treatment the car-picking
  // popup uses -- 2026-09-01 correction from an earlier red highlight,
  // Matt's call: red already means something else on this site) wherever
  // they land in the full list, so comparing "what I have" against "what
  // else is out there" is one scan down the page instead of cross-
  // referencing two separate panels. Inactive sponsors are left out --
  // unlike the admin catalog view, a driver can't pick one anyway, so
  // there's nothing useful about showing it retired. No separate Tier
  // column (2026-09-01, Matt's call) -- the tier badge already sits on
  // the group-header row above each tier's sponsors, so repeating it per
  // row was redundant; sponsor rows are inset further under their group
  // header instead, the same "rows nested under their group" look Cars/
  // Members use.
  // ctx.interactive (2026-09-02 redesign) makes every row clickable --
  // ctx.onRowClick(SponsorID) fires the pick/replace/remove/duplicate-guard
  // logic in renderSponsorsSection, which then calls updateMarks() (see
  // the returned object below) to flip that row's checkmark instantly,
  // without rebuilding the whole table. Not interactive on the "no seat
  // yet" call site (Matt's original browse-only table), where there's
  // nothing to click into.
  function buildSponsorComparisonTable(ctx) {
    var panel = el('div', 'rc-panel rc-dash-card rc-sponsor-table-panel');
    panel.appendChild(el('h3', 'rc-dash-card-title', 'All Sponsors'));

    var active = (ctx.catalog || []).filter(function (s) { return _rcRowActive(s); });
    if (!active.length) {
      panel.appendChild(el('div', 'rc-dm-empty', 'No sponsors in the catalog yet.'));
      return { el: panel, updateMarks: function () {} };
    }

    var TIER_ORDER = ['Safe', 'Balanced', 'Risky'];
    var byTier = {};
    active.forEach(function (s) {
      var tier = s.Tier || 'Unclassified';
      if (!byTier[tier]) byTier[tier] = [];
      byTier[tier].push(s);
    });
    var tierOrder = TIER_ORDER.slice();
    Object.keys(byTier).forEach(function (t) { if (tierOrder.indexOf(t) === -1) tierOrder.push(t); });

    var table = el('div', 'rc-sponsor-table');
    var headRow = el('div', 'rc-sponsor-table-head-row');
    headRow.appendChild(el('div'));
    headRow.appendChild(el('div', 'rc-sponsor-table-head-cell', 'Sponsor'));
    headRow.appendChild(el('div', 'rc-sponsor-table-head-cell', 'Bonus'));
    headRow.appendChild(el('div', 'rc-sponsor-table-head-cell', 'Penalty'));
    headRow.appendChild(el('div', 'rc-sponsor-table-head-cell', 'Risk / Reward'));
    table.appendChild(headRow);

    // SponsorID -> its row's pickmark element, so updateMarks() can flip
    // just the affected rows after a pick/removal instead of rebuilding
    // the whole table (which would lose scroll position mid-pick).
    var marksById = {};

    tierOrder.forEach(function (tier) {
      var list = byTier[tier];
      if (!list) return;
      var groupHead = el('div', 'rc-sponsor-tier-group-head');
      groupHead.appendChild(_rcTierBadge(tier));
      groupHead.appendChild(el('span', 'rc-sponsor-tier-group-count', list.length + (list.length === 1 ? ' sponsor' : ' sponsors')));
      table.appendChild(groupHead);

      list.slice().sort(function (a, b) { return (a.Name || '').localeCompare(b.Name || ''); }).forEach(function (s) {
        var picked = ctx.getPickedIds ? ctx.getPickedIds().indexOf(s.SponsorID) !== -1 : false;
        var row = el('div', 'rc-sponsor-table-row' + (ctx.interactive ? ' rc-sponsor-table-row-clickable' : ''));

        var mark = el('div', 'rc-sponsor-pickmark' + (picked ? ' rc-sponsor-pickmark-on' : ' rc-sponsor-pickmark-off'));
        if (picked) mark.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>';
        row.appendChild(mark);
        marksById[s.SponsorID] = mark;

        var sponsorCol = el('div', 'rc-sponsor-table-sponsor');
        var logo = document.createElement('img');
        logo.className = 'rc-sponsor-table-logo';
        logo.alt = '';
        logo.src = sponsorLogoSrc(s.Name || '');
        logo.onerror = function () { this.style.display = 'none'; };
        sponsorCol.appendChild(logo);
        sponsorCol.appendChild(el('div', 'rc-sponsor-table-name', escapeHtml(s.Name || '(unnamed sponsor)')));
        row.appendChild(sponsorCol);

        var bonusAmt = Number(s.BonusAmount) || 0;
        var penaltyAmt = Math.abs(Number(s.PenaltyAmount) || 0);

        var bonusCol = el('div', 'rc-sponsor-table-bonus-col');
        bonusCol.appendChild(el('div', 'rc-sponsor-table-amt rc-sponsor-table-amt-bonus', '+$' + bonusAmt));
        bonusCol.appendChild(el('div', 'rc-sponsor-table-trigger', escapeHtml(s.BonusType || '')));
        row.appendChild(bonusCol);

        var penaltyCol = el('div', 'rc-sponsor-table-penalty-col');
        penaltyCol.appendChild(el('div', 'rc-sponsor-table-amt rc-sponsor-table-amt-penalty', '−$' + penaltyAmt));
        penaltyCol.appendChild(el('div', 'rc-sponsor-table-trigger', escapeHtml(s.PenaltyType || '')));
        row.appendChild(penaltyCol);

        // Two stacked 24-block meters on a shared $0-$1,200 scale
        // (2026-09-01, Matt's call) -- bonus on top, penalty on bottom,
        // each block worth $50, so every sponsor amount (which always
        // lands on a $50 step) fills a whole number of blocks with no
        // rounding. A fixed shared scale (rather than each row's own
        // bonus+penalty total) is what makes Risky sponsors visibly carry
        // both a bigger reward AND a bigger downside than Safe/Balanced,
        // instead of every row just showing its own internal split.
        var SWING_SCALE_MAX = 1200;
        var SWING_SEG_COUNT = 24;
        var SWING_SEG_VALUE = SWING_SCALE_MAX / SWING_SEG_COUNT; // $50
        function buildSwingRow(amount, kind) {
          var swingRow = el('div', 'rc-sponsor-swing-row');
          var filledSegs = Math.min(SWING_SEG_COUNT, Math.round(amount / SWING_SEG_VALUE));
          for (var seg = 0; seg < SWING_SEG_COUNT; seg++) {
            swingRow.appendChild(el('div', 'rc-sponsor-swing-seg ' + (seg < filledSegs ? 'rc-sponsor-swing-seg-' + kind : 'rc-sponsor-swing-seg-empty')));
          }
          return swingRow;
        }
        var swing = el('div', 'rc-sponsor-swing');
        swing.appendChild(buildSwingRow(bonusAmt, 'bonus'));
        swing.appendChild(buildSwingRow(penaltyAmt, 'penalty'));

        // Scale labels under the bar: 0 on the left, the shared scale's
        // ceiling on the right, and a small centered tick mark -- lets a
        // driver read the bars as an actual dollar scale, not just a
        // relative meter (2026-09-01, Matt's call). Same $0-$1,200 scale on
        // every row, Safe/Balanced/Risky alike. Nested inside the swing
        // element itself (not a sixth grid column) so it stays under the
        // bars in the same table cell.
        var swingScale = el('div', 'rc-sponsor-swing-scale');
        swingScale.appendChild(el('span', 'rc-sponsor-swing-scale-label', '0'));
        swingScale.appendChild(el('span', 'rc-sponsor-swing-scale-tick'));
        swingScale.appendChild(el('span', 'rc-sponsor-swing-scale-label', '$' + SWING_SCALE_MAX.toLocaleString()));
        swing.appendChild(swingScale);

        row.appendChild(swing);

        // Clicking a row is a no-op unless a slot is currently targeted
        // (ctx.onRowClick itself checks that and just returns) -- there's
        // no separate "select a slot first" error state here, clicking
        // with nothing targeted simply does nothing.
        if (ctx.interactive) {
          row.addEventListener('click', function () { ctx.onRowClick(s.SponsorID); });
        }

        table.appendChild(row);
      });
    });
    panel.appendChild(table);

    panel.appendChild(el('p', 'rc-sponsor-table-legend',
      'Risk / Reward shows bonus (top) and penalty (bottom) on the same $0-$1,200 scale, so a longer bar in either row means a bigger dollar swing.'));

    function updateMarks() {
      var pickedIds = ctx.getPickedIds ? ctx.getPickedIds() : [];
      Object.keys(marksById).forEach(function (sponsorId) {
        var mark = marksById[sponsorId];
        var picked = pickedIds.indexOf(sponsorId) !== -1;
        mark.className = 'rc-sponsor-pickmark' + (picked ? ' rc-sponsor-pickmark-on' : ' rc-sponsor-pickmark-off');
        mark.innerHTML = picked ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>' : '';
      });
    }

    // Toggles the hover/pointer-cursor affordance on the whole table
    // (see the CSS's .rc-sponsor-table-picking guard) -- called whenever
    // a Current Picks slot becomes targeted or un-targeted, so a click
    // here only ever LOOKS clickable while it actually does something.
    function setPicking(isPicking) {
      table.classList.toggle('rc-sponsor-table-picking', !!isPicking);
    }

    return { el: panel, updateMarks: updateMarks, setPicking: setPicking };
  }

  // 2026-09-02 redesign (Matt's call): no more "Choose/Change Sponsors"
  // popup. Clicking a slot in Current Picks targets it and scrolls down to
  // this page's own All Sponsors table; clicking a sponsor row there fills
  // it -- instantly, in both places at once -- while chooseSponsors saves
  // quietly in the background with nothing on screen showing it's in
  // flight. See buildCurrentPicksPanel/buildSponsorComparisonTable above
  // for the two halves of that interaction; everything below just wires
  // them together and owns the actual pickedIds/activeTarget state.
  function renderSponsorsSection(token) {
    var section = document.getElementById('rc-section-sponsors');
    if (!section) return;
    section.innerHTML = '';
    // Page-level spinner sits directly in the section, same as Calendar's
    // own loading state -- no extra .rc-panel wrapped around it (2026-08-31
    // fix; Matt's call: it was reading as "a popup style that sits in a
    // large container" -- that was this spinner nested inside a second
    // bordered card on top of its own boxed styling, not how any other
    // section's loading state looks).
    section.appendChild(buildPageSpinner('Loading your sponsors...'));

    function render(data, catalog) {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Sponsors'));
      // Explainer paragraph under the page header (2026-09-01, Matt's
      // call -- the one piece of the Direction 1 mockup he called out by
      // name). Also does double duty as the place that spells out the
      // race-by-race vs. season-long distinction Matt asked for.
      section.appendChild(el('p', 'rc-sponsors-explainer',
        'Every sponsor lines up in one table below so you can compare tier, bonus, and penalty side by side instead of digging through separate cards. Sponsor bonuses and penalties are evaluated race by race for the rest of the season; your car carries its own separate, season-long Season Objective.'));

      if (!data || !data.success) {
        var errPanel = el('div', 'rc-panel');
        errPanel.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'Could not load your sponsors right now.'));
        section.appendChild(errPanel);
        return;
      }
      if (!data.hasSeat) {
        // Same "Current Picks" container title + red line as the
        // registered version below, just with the note in place of the
        // picks strip (2026-09-01, Matt's call: "keep the container
        // title with the red line and below it add this note").
        var notSeatedPanel = el('div', 'rc-panel rc-dash-card');
        notSeatedPanel.appendChild(el('h3', 'rc-dash-card-title', 'Current Picks'));
        notSeatedPanel.appendChild(el('p', 'rc-hint', 'Not on a team yet -- register for a season to choose sponsors.'));
        section.appendChild(notSeatedPanel);
        if (catalog.length) section.appendChild(buildSponsorComparisonTable({ catalog: catalog, interactive: false }).el);
        section.appendChild(buildSponsorTriggerGlossary());
        return;
      }

      // pickedIds: up to 3 SponsorIDs, the single source of truth both
      // panels below read through ctx.getPickedIds(). lastSavedIds is
      // whatever the server last actually confirmed -- saveNow() rolls
      // pickedIds back to it if a save fails, so a dropped request can't
      // leave the screen showing a pick that never actually landed.
      var catalogById = {};
      catalog.forEach(function (s) { catalogById[s.SponsorID] = s; });
      var pickedIds = (data.sponsors || []).map(function (s) { return s.SponsorID; }).slice(0, 3);
      var lastSavedIds = pickedIds.slice();
      // null | '__open__' | a SponsorID -- which slot (if any) is currently
      // waiting for a click in the table below.
      var activeTarget = null;
      var locked = !!data.locked;
      var picksPanel, tablePanel;

      function refreshBoth() {
        picksPanel.refresh();
        if (tablePanel) {
          tablePanel.updateMarks();
          // Hover/pointer-cursor on the table only while a slot is
          // actually targeted (Matt's call, 2026-09-02) -- outside of
          // that, a row click is a no-op (see handleRowClick's guard
          // above), so it shouldn't look clickable either.
          tablePanel.setPicking(activeTarget !== null);
        }
      }

      // Fire-and-forget by design (Matt's call: "the backend does its
      // thing without the user being aware that it's still saving") -- no
      // spinner, no disabled state, no toast on success. The only visible
      // trace of a save is if it FAILS: pickedIds rolls back to the last
      // confirmed-good state and a toast explains why, since silently
      // losing a pick would be worse than a brief interruption.
      function saveNow() {
        var idsToSend = pickedIds.slice();
        fetchApi('chooseSponsors', {
          method: 'POST', token: token,
          body: { seasonId: data.seasonId, sponsorId1: idsToSend[0] || '', sponsorId2: idsToSend[1] || '', sponsorId3: idsToSend[2] || '' }
        }).then(function (result) {
          if (!result || !result.success) {
            pickedIds = lastSavedIds.slice();
            refreshBoth();
            showToast((result && result.message) || 'Could not save your sponsor pick. Try again.', 'error');
            return;
          }
          lastSavedIds = idsToSend.slice();
          // Clears the "Choose your sponsors" bell notification right away
          // instead of leaving it up to the next 45s poll tick (2026-09-01,
          // Matt's call: acknowledge automatically on the relevant action,
          // without requiring a visit to the notification dropdown) -- see
          // rcRefreshNotificationsNow in header.js.
          if (typeof rcRefreshNotificationsNow === 'function') rcRefreshNotificationsNow();
        }).catch(function () {
          pickedIds = lastSavedIds.slice();
          refreshBoth();
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
      }

      function handleSlotClick(targetId) {
        if (locked) return;
        // Clicking the already-active slot again cancels targeting instead
        // of re-triggering the scroll -- an escape hatch for "actually
        // never mind."
        activeTarget = (activeTarget === targetId) ? null : targetId;
        refreshBoth();
        if (activeTarget !== null) {
          tablePanel.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      function handleRowClick(sponsorId) {
        if (locked || activeTarget === null) return; // nothing targeted -- a row click is a no-op
        if (activeTarget === '__open__') {
          if (pickedIds.indexOf(sponsorId) !== -1) {
            showToast('Already picked in another slot.', 'error');
            return;
          }
          if (pickedIds.length >= 3) { activeTarget = null; refreshBoth(); return; } // shouldn't happen -- no open slot to have targeted
          pickedIds.push(sponsorId);
        } else {
          var targetId = activeTarget;
          if (sponsorId === targetId) {
            // Clicking the slot's own current sponsor again removes it --
            // the pick and its removal share the same gesture, no separate
            // "x" button needed.
            pickedIds = pickedIds.filter(function (id) { return id !== targetId; });
          } else if (pickedIds.indexOf(sponsorId) !== -1) {
            showToast('Already picked in another slot.', 'error');
            return;
          } else {
            pickedIds = pickedIds.map(function (id) { return id === targetId ? sponsorId : id; });
          }
        }
        activeTarget = null;
        refreshBoth();
        saveNow();
      }

      picksPanel = buildCurrentPicksPanel({
        getPickedIds: function () { return pickedIds; },
        getActiveTarget: function () { return activeTarget; },
        catalogById: catalogById,
        locked: locked,
        onSlotClick: handleSlotClick
      });
      section.appendChild(picksPanel.el);

      if (catalog.length) {
        tablePanel = buildSponsorComparisonTable({
          catalog: catalog,
          getPickedIds: function () { return pickedIds; },
          interactive: !locked,
          onRowClick: handleRowClick
        });
        section.appendChild(tablePanel.el);
      }

      // Third container: every possible bonus/penalty trigger with its
      // plain description (2026-09-01, Matt's call) -- independent of this
      // driver's own picks or the live catalog, so it always renders once
      // there's a seat, same list every time.
      section.appendChild(buildSponsorTriggerGlossary());
    }

    Promise.all([
      fetchApi('getMySponsors', { token: token }).catch(function () { return { success: false }; }),
      fetchApi('getSponsors', { token: token }).catch(function () { return { success: false }; })
    ]).then(function (results) {
      var catalog = (results[1] && results[1].success && results[1].sponsors) ? results[1].sponsors : [];
      render(results[0], catalog);
    });
  }

  // ---------------------------------------------------------------------
  // CHANGE PASSWORD -- kept fully functional because the forced-password
  // lock screen below depends on it directly. Not currently reachable any
  // other way, since Edit Profile itself is just a placeholder for now.
  // Result messaging goes through showToast() (js/header.js) rather than
  // its own inline status line, per Matt's sitewide toast call.
  // ---------------------------------------------------------------------
  function passwordChangeSection(token) {
    var box = document.createElement('div');
    box.className = 'rc-panel';
    box.style.borderColor = 'var(--rc-red)';
    box.appendChild(el('h3', 'margin-top:0;font-size:15px;', 'Change Password'));
    var cur = el('input'); cur.type = 'password'; cur.placeholder = 'Current password';
    var next = el('input'); next.type = 'password'; next.placeholder = 'New password (8+ characters)';
    var confirm = el('input'); confirm.type = 'password'; confirm.placeholder = 'Confirm new password';
    var btn = el('button', null, 'Update Password'); btn.className = 'rc-btn-primary rc-btn-sm'; btn.style.marginTop = '14px';

    btn.addEventListener('click', function () {
      if (next.value !== confirm.value) {
        showToast('New password and confirmation don\'t match.', 'error');
        return;
      }
      fetchApi('changeOwnPassword', { method: 'POST', token: token, body: { currentPassword: cur.value, newPassword: next.value } })
        .then(function (data) {
          showToast(data.message || (data.success ? 'Updated.' : 'Failed.'), data.success ? 'success' : 'error');
          // A full reload (rather than box.remove()) covers both callers
          // at once: the forced-password lock screen (mustChangePassword
          // re-checks fresh on reload and drops the lock on its own) and
          // the Edit Profile modal's embedded copy of this form.
          if (data.success) rcReloadAfterSave();
        });
    });

    box.appendChild(cur); box.appendChild(next); box.appendChild(confirm); box.appendChild(btn);
    return box;
  }

  // ---------------------------------------------------------------------
  // GENERIC MODAL -- backdrop + centered card, Escape/backdrop-click/X all
  // close it. Reintroduced this pass (the CSS classes it needs,
  // .rc-modal-backdrop/.rc-modal/.rc-modal-head/.rc-modal-close/
  // .rc-modal-body/.rc-modal-wide, survived the v0.5.0 rebuild even though
  // this function didn't). opts.wide adds the .rc-modal-wide class for
  // content-heavier popups; opts.bodyEl is the element to place inside
  // .rc-modal-body.
  // ---------------------------------------------------------------------
  function showModal(title, opts) {
    opts = opts || {};
    var backdrop = el('div', 'rc-modal-backdrop');
    var modal = el('div', 'rc-modal' + (opts.wide ? ' rc-modal-wide' : ''));
    var head = el('div', 'rc-modal-head');
    head.appendChild(el('h3', 'margin:0;font-size:16px;', escapeHtml(title)));
    var closeBtn = el('button', 'rc-modal-close', '&times;');
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label', 'Close');
    head.appendChild(closeBtn);
    var body = el('div', 'rc-modal-body');
    if (opts.bodyEl) body.appendChild(opts.bodyEl);
    modal.appendChild(head);
    modal.appendChild(body);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);

    // Lock the page behind the popup -- same iOS-Safari-safe pattern the
    // mobile menu already uses (see .rc-modal-scroll-locked in
    // style.css): pin body with position:fixed (not just overflow:hidden,
    // which doesn't reliably stop touch scrolling), remembering the
    // scroll position so it can be restored on close without a jump.
    var scrollYBeforeModal = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = '-' + scrollYBeforeModal + 'px';
    document.body.classList.add('rc-modal-scroll-locked');

    // Closable ONLY via the X button here, or a Cancel button the caller
    // wires up itself against the returned { close } (Matt's call,
    // 2026-08-30: "you either have to hit a cancel button or hit the X...
    // this avoids accidental clicks and nothing saves"). Backdrop-click
    // and Escape-key close are deliberately gone -- neither the dimmed
    // backdrop nor document keydown gets a listener anymore.
    // skipOnClose (2026-09-01): lets a caller tear this modal down WITHOUT
    // firing opts.onClose -- see openSigningSequence's advanceToContract,
    // which closes the registration modal silently right before a reload/
    // in-place refresh is about to happen anyway. Every other caller
    // (the X button, a Cancel button) calls close() with no argument, so
    // onClose still fires normally there.
    function close(skipOnClose) {
      backdrop.remove();
      document.body.classList.remove('rc-modal-scroll-locked');
      document.body.style.top = '';
      window.scrollTo(0, scrollYBeforeModal);
      // Only clear the tracker if THIS modal is still the one it's
      // pointing at -- guards against a theoretical stale clear if a
      // second modal somehow opened before this one's close() ran.
      if (rcActiveModalCloseFn === close) rcActiveModalCloseFn = null;
      if (opts.onClose && !skipOnClose) opts.onClose();
    }
    rcActiveModalCloseFn = close;
    closeBtn.addEventListener('click', close);

    // el: the modal card itself (not the dimmed backdrop) -- exposed so a
    // caller can add a one-off class to it, e.g. the Season Wizard's
    // shake-on-invalid-Next animation (.rc-shake).
    return { close: close, body: body, el: modal };
  }

  // Small reusable confirm popup for destructive actions (added 2026-08-30
  // for Season Tools' Delete button) -- built on showModal so it inherits
  // the same X-button-or-Cancel-only close rule. onConfirm runs when the
  // confirm button is clicked; the modal closes itself either way (Cancel,
  // X, or after onConfirm fires) rather than making every caller remember
  // to call .close().
  function openConfirmModal(title, message, confirmLabel, onConfirm) {
    var body = el('div');
    body.appendChild(el('p', 'color:var(--rc-carbon);font-size:14px;margin-top:0;', message));
    var btnRow = el('div', 'display:flex;gap:10px;justify-content:flex-end;margin-top:16px;');
    var cancelBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Cancel');
    cancelBtn.type = 'button';
    var confirmBtn = el('button', 'rc-btn-primary rc-btn-sm', confirmLabel || 'Confirm');
    confirmBtn.type = 'button';
    confirmBtn.style.cssText = 'background:var(--rc-red);';
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    body.appendChild(btnRow);

    var modal = showModal(title, { bodyEl: body });
    cancelBtn.addEventListener('click', modal.close);
    confirmBtn.addEventListener('click', function () {
      modal.close();
      onConfirm();
    });
  }

  // Heavier version of openConfirmModal for an action Matt wants real
  // deliberation behind (added 2026-08-30 for Season Tools' End Season
  // button) -- the confirm button stays disabled until the exact phrase
  // is typed into the box, same "type ERASE to confirm" weight as the
  // spreadsheet's own eraseAllSeasonDataPrompt, just as a proper popup
  // instead of a browser prompt() since this is reachable from the
  // website, not just the Apps Script menu.
  function openTypeToConfirmModal(title, message, requiredPhrase, confirmLabel, onConfirm) {
    var body = el('div');
    body.appendChild(el('p', 'color:var(--rc-carbon);font-size:14px;margin-top:0;', message));
    body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'Type ' + requiredPhrase + ' below to continue.'));
    var input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.placeholder = requiredPhrase;
    input.style.cssText = 'width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--rc-silver);border-radius:6px;font-size:14px;font-family:var(--rc-font-body);';
    body.appendChild(input);

    var btnRow = el('div', 'display:flex;gap:10px;justify-content:flex-end;margin-top:16px;');
    var cancelBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Cancel');
    cancelBtn.type = 'button';
    var confirmBtn = el('button', 'rc-btn-primary rc-btn-sm', confirmLabel || 'Confirm');
    confirmBtn.type = 'button';
    confirmBtn.style.cssText = 'background:var(--rc-red);';
    confirmBtn.disabled = true;
    input.addEventListener('input', function () { confirmBtn.disabled = input.value !== requiredPhrase; });
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    body.appendChild(btnRow);

    var modal = showModal(title, { bodyEl: body });
    cancelBtn.addEventListener('click', modal.close);
    confirmBtn.addEventListener('click', function () {
      if (input.value !== requiredPhrase) return; // belt-and-suspenders -- button is already disabled until this matches
      modal.close();
      onConfirm();
    });
    input.focus();
  }

  // Inline branded loading indicator (the "Starting Grid Lights" sequence
  // also used for full-page/section loading states) -- reused here for the
  // Season Wizard's "fetching tracks & cars" and "creating season" waits so
  // every spinner on the site looks the same.
  function buildSpinner(message) {
    var wrap = el('div', 'rc-inline-spinner-wrap');
    var lightsRow = el('div', 'rc-startlights');
    for (var li = 0; li < 5; li++) lightsRow.appendChild(el('span', 'rc-startlight'));
    wrap.appendChild(lightsRow);
    wrap.appendChild(el('div', 'rc-loading-text', escapeHtml(message)));
    return wrap;
  }

  // Standardized top-of-page loading position (Matt's call, 2026-08-29):
  // every full-section loading state -- the initial #rc-loading markup
  // AND any in-page section that fetches on click (Calendar, and any
  // future one built the same way) -- sits at the exact same vertical
  // height via .rc-inline-spinner-page's margin-top, instead of drifting
  // depending on whether a heading happened to render above it first.
  // NOT for spinners inside a modal (buildSpinner() alone is still right
  // there -- the modal card itself is already the container, and modal
  // body centering handles its own vertical position).
  function buildPageSpinner(message) {
    var wrap = buildSpinner(message);
    wrap.classList.add('rc-inline-spinner-page');
    return wrap;
  }

  // Generic two-column field-pair row (label + field, twice) -- the plain,
  // no-hint version used across the site's other forms (Edit Profile, Edit
  // Track/Car, and most of the Season Wizard's own field pairs). The
  // wizard-specific wizFieldPairRow further down is the richer version that
  // also gives each column its own hint line.
  function fieldPairRow(labelA, fieldA, labelB, fieldB) {
    var row = el('div', 'rc-field-pair');
    var colA = el('div', null);
    colA.appendChild(el('label', 'margin-top:0;', escapeHtml(labelA)));
    colA.appendChild(fieldA);
    var colB = el('div', null);
    colB.appendChild(el('label', 'margin-top:0;', escapeHtml(labelB)));
    colB.appendChild(fieldB);
    row.appendChild(colA);
    row.appendChild(colB);
    return row;
  }

  // Fixed set of 15 preset avatar images a driver can pick from (2026-08-30,
  // Matt's ask) -- assets/avatars/avatar-01.png through avatar-15.png,
  // zero-padded to 2 digits to match the files on disk. No admin/catalog
  // sheet involved -- this is just a fixed image set, same spirit as the
  // fixed CAR_OBJECTIVE_CATALOG_/SPONSOR_*_TRIGGERS vocabularies elsewhere.
  var RC_AVATAR_FILENAMES_ = (function () {
    var list = [];
    for (var i = 1; i <= 15; i++) list.push('avatar-' + (i < 10 ? '0' + i : i) + '.png');
    return list;
  })();

  // Shared avatar circle -- an uploaded/picked image (profile.avatarFilename,
  // from assets/avatars/) when one is set, otherwise the same initials
  // fallback the header uses (_rcHeaderInitials(), global from header.js --
  // loaded before this script, so it's safe to call directly here without
  // duplicating that logic). onerror falls back to initials too, in case a
  // stored filename doesn't actually exist under assets/avatars/.
  function buildAvatarCircle(profile, extraClass) {
    var circle = el('div', 'rc-avatar-circle' + (extraClass ? ' ' + extraClass : ''));
    var initials = (typeof _rcHeaderInitials === 'function') ? _rcHeaderInitials(profile && profile.displayName) : '?';
    if (profile && profile.avatarFilename) {
      var img = document.createElement('img');
      img.className = 'rc-avatar-circle-img';
      img.alt = '';
      img.src = 'assets/avatars/' + profile.avatarFilename;
      img.onerror = function () {
        img.remove();
        circle.textContent = initials;
      };
      circle.appendChild(img);
    } else {
      circle.textContent = initials;
    }
    return circle;
  }

  // ---------------------------------------------------------------------
  // CHANGE AVATAR POPUP -- a fixed grid of the 15 preset images (5 rows of
  // 3), opened from a link inside Edit Profile. Selecting one and hitting
  // Save posts straight to updateOwnProfile with the driver's OWN current
  // field values (this action requires username/firstName/lastName/email
  // every call -- there's no avatar-only endpoint) plus the new
  // avatarFilename, so this is a genuinely standalone action: it doesn't
  // touch or depend on whatever the driver may be mid-editing in the Edit
  // Profile form behind it. onSaved(newProfile) lets the caller (Edit
  // Profile's own avatar circle) refresh immediately without a page reload.
  // ---------------------------------------------------------------------
  function openAvatarPickerModal(profile, token, onSaved) {
    var body = el('div');
    // el(tag, style, html) only takes 3 args -- this used to pass 4
    // ('rc-hint' AND a stray 'margin-top:0;' string), so the real message
    // silently got shifted out and el() rendered the literal text
    // "margin-top:0;" instead (2026-09-01 bug report: "this displays on
    // the change avatar popup"). Fixed to the intended 2-arg call.
    body.appendChild(el('p', 'rc-hint', 'Choose a profile picture. You can change this again any time.'));

    var grid = el('div', 'rc-avatar-picker-grid');
    var selected = profile.avatarFilename || null;
    var itemButtons = [];

    function refreshSelection() {
      itemButtons.forEach(function (btn) {
        btn.classList.toggle('rc-avatar-picker-item-selected', btn.getAttribute('data-filename') === selected);
      });
    }

    RC_AVATAR_FILENAMES_.forEach(function (filename) {
      var btn = el('button', 'rc-avatar-picker-item');
      btn.type = 'button';
      btn.setAttribute('data-filename', filename);
      var img = document.createElement('img');
      img.src = 'assets/avatars/' + filename;
      img.alt = 'Avatar option';
      img.loading = 'lazy';
      // Hides the button entirely instead of showing a broken-image icon if
      // a filename in RC_AVATAR_FILENAMES_ doesn't actually exist under
      // assets/avatars/ (e.g. a mismatched name on disk).
      img.onerror = function () { btn.style.display = 'none'; };
      btn.appendChild(img);
      btn.addEventListener('click', function () {
        selected = filename;
        refreshSelection();
      });
      grid.appendChild(btn);
      itemButtons.push(btn);
    });
    refreshSelection();
    body.appendChild(grid);

    var saveBtn = el('button', 'rc-btn-primary', 'Save Avatar');
    saveBtn.type = 'button';
    saveBtn.style.marginTop = '18px';
    saveBtn.addEventListener('click', function () {
      if (!selected) {
        showToast('Pick an avatar first.', 'error');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      fetchApi('updateOwnProfile', {
        method: 'POST',
        token: token,
        body: {
          username: profile.username,
          firstName: profile.firstName,
          lastName: profile.lastName,
          suffix: profile.suffix || '',
          email: profile.email,
          location: profile.location || '',
          timeZone: profile.timeZone || '',
          avatarFilename: selected
        }
      })
        .then(function (data) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Avatar';
          if (!data.success) {
            showToast(data.message || 'Could not save your avatar.', 'error');
            return;
          }
          setProfileCache(data.profile);
          showToast('Avatar updated.', 'success');
          rcReloadAfterSave();
        })
        .catch(function () {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Avatar';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
    body.appendChild(saveBtn);

    var pickerModal = showModal('Change Avatar', { bodyEl: body });
  }

  // ---------------------------------------------------------------------
  // EDIT PROFILE POPUP -- Username / First / Last / Suffix / Email /
  // Location / Time Zone, posting to the `updateOwnProfile` action, plus
  // the existing passwordChangeSection() embedded underneath so Change
  // Password lives in the same popup. DisplayName is never directly
  // editable here -- it's computed server-side from First/Last/Suffix,
  // same rule as registration.
  // ---------------------------------------------------------------------
  function openEditProfileModal(profile, token) {
    if (!profile || !token) return;

    var body = el('div');

    // Avatar circle (2x size, centered -- 2026-08-30, Matt's call) with
    // "Change Avatar" then "Delete Avatar" stacked underneath it. Rebuilt
    // in place (avatarRow.replaceChild) when the picker popup saves a new
    // avatarFilename, so the driver sees their new picture the instant
    // they close the picker, without this whole popup re-opening.
    var avatarRow = el('div', 'rc-avatar-edit-row');
    var avatarCircle = buildAvatarCircle(profile, 'rc-avatar-circle-xl');
    avatarRow.appendChild(avatarCircle);
    var changeAvatarLink = el('a', 'rc-avatar-change-link', 'Change Avatar');
    changeAvatarLink.href = '#';
    changeAvatarLink.addEventListener('click', function (evt) {
      evt.preventDefault();
      openAvatarPickerModal(profile, token, function (newProfile) {
        profile = newProfile;
        var freshCircle = buildAvatarCircle(profile, 'rc-avatar-circle-xl');
        avatarRow.replaceChild(freshCircle, avatarCircle);
        avatarCircle = freshCircle;
      });
    });
    avatarRow.appendChild(changeAvatarLink);

    // Delete Avatar (added 2026-08-30) -- sends avatarFilename: '' rather
    // than omitting the field, which is what actually clears the stored
    // filename instead of leaving it untouched (see handleUpdateOwnProfile,
    // Auth.gs). A full rcReloadAfterSave() follows success, same as every
    // other popup save, so the header avatar and this popup (on reopen)
    // both reflect "back to initials" immediately.
    var deleteAvatarLink = el('a', 'rc-avatar-delete-link', 'Delete Avatar');
    deleteAvatarLink.href = '#';
    deleteAvatarLink.addEventListener('click', function (evt) {
      evt.preventDefault();
      if (!profile.avatarFilename) return; // nothing to delete
      deleteAvatarLink.textContent = 'Removing...';
      fetchApi('updateOwnProfile', {
        method: 'POST',
        token: token,
        body: {
          username: profile.username, firstName: profile.firstName, lastName: profile.lastName,
          suffix: profile.suffix || '', email: profile.email,
          location: profile.location || '', timeZone: profile.timeZone || '',
          avatarFilename: ''
        }
      })
        .then(function (data) {
          deleteAvatarLink.textContent = 'Delete Avatar';
          if (!data.success) {
            showToast(data.message || 'Could not remove your avatar.', 'error');
            return;
          }
          setProfileCache(data.profile);
          showToast('Avatar removed.', 'success');
          rcReloadAfterSave();
        })
        .catch(function () {
          deleteAvatarLink.textContent = 'Delete Avatar';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
    avatarRow.appendChild(deleteAvatarLink);
    body.appendChild(avatarRow);

    var form = el('form');
    form.appendChild(el('label', 'margin-top:0;', 'Username'));
    var username = el('input'); username.type = 'text'; username.value = profile.username || ''; username.required = true;
    form.appendChild(username);

    form.appendChild(el('label', null, 'First Name'));
    var firstName = el('input'); firstName.type = 'text'; firstName.value = profile.firstName || ''; firstName.required = true;
    form.appendChild(firstName);

    form.appendChild(el('label', null, 'Last Name'));
    var lastName = el('input'); lastName.type = 'text'; lastName.value = profile.lastName || ''; lastName.required = true;
    form.appendChild(lastName);

    form.appendChild(el('label', null, 'Suffix (optional)'));
    var suffix = document.createElement('select');
    var suffixBlank = document.createElement('option'); suffixBlank.value = ''; suffixBlank.textContent = 'None';
    suffix.appendChild(suffixBlank);
    (typeof DRIVER_NAME_SUFFIXES !== 'undefined' ? DRIVER_NAME_SUFFIXES : []).forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s; opt.textContent = s;
      if (profile.suffix === s) opt.selected = true;
      suffix.appendChild(opt);
    });
    form.appendChild(suffix);

    form.appendChild(el('label', null, 'Email Address'));
    var email = el('input'); email.type = 'email'; email.value = profile.email || ''; email.required = true;
    form.appendChild(email);
    form.appendChild(el('div', 'rc-hint', 'Only used for verification and password resets.'));

    form.appendChild(el('label', null, 'Location'));
    var location = document.createElement('select');
    var locBlank = document.createElement('option'); locBlank.value = ''; locBlank.textContent = 'Select a country';
    location.appendChild(locBlank);
    (typeof COUNTRIES !== 'undefined' ? COUNTRIES : []).forEach(function (country) {
      var opt = document.createElement('option'); opt.value = country; opt.textContent = country;
      if (profile.location === country) opt.selected = true;
      location.appendChild(opt);
    });
    form.appendChild(location);

    form.appendChild(el('label', null, 'Time Zone'));
    var timeZone = document.createElement('select');
    var tzBlank = document.createElement('option'); tzBlank.value = ''; tzBlank.textContent = 'Select a time zone';
    timeZone.appendChild(tzBlank);
    (typeof getTimezoneList === 'function' ? getTimezoneList() : []).forEach(function (tz) {
      var opt = document.createElement('option'); opt.value = tz; opt.textContent = typeof timezoneLabel === 'function' ? timezoneLabel(tz) : tz;
      if (profile.timeZone === tz) opt.selected = true;
      timeZone.appendChild(opt);
    });
    form.appendChild(timeZone);

    // Email-notification opt-in (2026-09-02, Matt's ask: same checkbox as
    // registration, now editable here too -- defaults off at signup,
    // this is where a driver turns it on/off afterward). See
    // rcSendPendingNotificationEmails (DataCache.gs) for what it actually
    // gates: an automatic email for a notification still unread 24 hours
    // after it was created (season starts, account upgrades, a pending
    // wager awaiting a response).
    var emailNotifyRow = el('div', 'rc-check-row');
    emailNotifyRow.style.marginTop = '16px';
    var emailNotify = document.createElement('input');
    emailNotify.type = 'checkbox';
    emailNotify.id = 'rc-editprofile-email-notify';
    emailNotify.checked = !!profile.emailNotificationsOptIn;
    var emailNotifyLabel = document.createElement('label');
    emailNotifyLabel.setAttribute('for', 'rc-editprofile-email-notify');
    emailNotifyLabel.textContent = 'Email me about things I might miss, like pending wagers and season starts.';
    emailNotifyRow.appendChild(emailNotify);
    emailNotifyRow.appendChild(emailNotifyLabel);
    form.appendChild(emailNotifyRow);

    var saveBtn = el('button', null, 'Save Changes');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);

    body.appendChild(form);
    body.appendChild(el('hr', 'rc-nav-divider', null));
    body.appendChild(passwordChangeSection(token));

    var modalHandle = showModal('Edit Profile', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!username.value.trim() || !firstName.value.trim() || !lastName.value.trim() || !email.value.trim()) {
        showToast('Username, first name, last name, and email are required.', 'error');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      fetchApi('updateOwnProfile', {
        method: 'POST',
        token: token,
        body: {
          username: username.value.trim(),
          firstName: firstName.value.trim(),
          lastName: lastName.value.trim(),
          suffix: suffix.value,
          email: email.value.trim(),
          location: location.value,
          timeZone: timeZone.value,
          emailNotificationsOptIn: emailNotify.checked ? '1' : '0'
        }
      })
        .then(function (data) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          if (!data.success) {
            showToast(data.message || 'Could not save your changes.', 'error');
            return;
          }
          setProfileCache(data.profile); // keeps the header avatar current here and on every other page, once the reload below actually re-renders it
          showToast('Profile updated.', 'success');
          rcReloadAfterSave();
        })
        .catch(function () {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
  }

  // ---------------------------------------------------------------------
  // HELP SECTION -- Website Help + Rules and Regulations (the Rulebook),
  // in that order, each its own .rc-panel container. This briefly lived
  // as a standalone page (help.html) so the Rulebook would have more
  // room to grow, but Matt's call was to fold it back into the sidebar
  // shell -- losing the sidebar/nav chrome on its own separate page felt
  // like leaving the site, not like part of the account. help.html has
  // been removed; the Help nav button goes back to showSection('help')
  // like every other link.
  //
  // Content here is fully static -- Website Help's two contact lines are
  // hand-written below, and the Rulebook comes from js/rulebook-content.js's
  // RULEBOOK_SECTIONS (kept separate from this file for the same reason as
  // before: updating the rulebook as it grows should be a small edit
  // there, not a hunt through this already-large file). Nothing here
  // needs a live fetch, so this renders once, eagerly, rather than
  // lazily like Data Management does.
  // ---------------------------------------------------------------------
  function renderHelpSection() {
    var section = document.getElementById('rc-section-help');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(el('h2', 'margin-top:0;', 'Help'));

    var websiteHelp = el('div', 'rc-panel');
    websiteHelp.appendChild(el('h3', 'margin-top:0;font-size:15px;', 'Website Help'));
    websiteHelp.appendChild(el('p', 'rc-help-panel-note', 'A fuller set of how-to topics for using the site is still being written. In the meantime:'));
    var contactList = el('ul', 'rc-help-list');
    contactList.appendChild(el('li', null, 'Questions about your account, results, or standings: email <a href="mailto:raceclub@example.com">raceclub@example.com</a>.'));
    contactList.appendChild(el('li', null, 'Locked out or can\'t remember your password? Use <a href="reset-password.html">Forgot password?</a> on the login page.'));
    // Points at the Rulebook's own Getting Started section (2026-09-01)
    // rather than duplicating the registration/sponsor-picking steps here
    // -- one place to keep that content current instead of two.
    contactList.appendChild(el('li', null, 'New here? See Section 2, Getting Started, in the Rulebook below for how registering for a team and choosing sponsors works.'));
    websiteHelp.appendChild(contactList);
    section.appendChild(websiteHelp);

    var rulebook = el('div', 'rc-panel');
    rulebook.appendChild(el('h3', 'margin-top:0;font-size:15px;', 'Rules and Regulations'));
    rulebook.appendChild(el('p', 'rc-help-panel-note', 'The Race Club Rulebook is a work in progress. Sections are written and added periodically as the season design comes together. Anything marked "Not yet drafted" is on the plan but not written yet.'));

    var rbIndex = el('div', 'rc-rulebook-index');
    var rbSections = el('div');
    if (typeof RULEBOOK_SECTIONS !== 'undefined') {
      RULEBOOK_SECTIONS.forEach(function (sec) {
        var link = document.createElement('a');
        link.href = '#rc-rulebook-sec-' + sec.id;
        if (sec.draft) link.className = 'rc-rulebook-draft';
        link.textContent = sec.num + '. ' + sec.title;
        rbIndex.appendChild(link);

        var secWrap = el('div', 'rc-rulebook-section');
        secWrap.id = 'rc-rulebook-sec-' + sec.id;
        secWrap.appendChild(el('h3', null, sec.num + '. ' + sec.title));
        if (sec.draft) {
          secWrap.appendChild(el('p', 'rc-rulebook-draft-note', sec.draftNote ? ('Not yet drafted. ' + sec.draftNote) : 'Not yet drafted.'));
        } else {
          // Safe to use innerHTML here -- RULEBOOK_SECTIONS' html strings
          // are hand-authored by us, not sourced from user input (see
          // that file's own header comment).
          var body = document.createElement('div');
          body.innerHTML = sec.html || '';
          secWrap.appendChild(body);
        }
        rbSections.appendChild(secWrap);
      });
    }
    rulebook.appendChild(rbIndex);
    rulebook.appendChild(rbSections);
    section.appendChild(rulebook);
  }

  // ---------------------------------------------------------------------
  // LEAGUE MANAGEMENT -- one panel, two buttons, for now (Matt's call:
  // "these will be the only two buttons in League Management for now").
  // Create a Season opens the full Season Creation Wizard below -- ported
  // back from the pre-v0.5 archive at Matt's request ("I don't like the
  // way this wizard looks... make it look identical to the previous
  // iteration -- then we can go through and remove parts we don't need").
  // The button's own label still flips to "Resume Season Draft" when a
  // local draft exists (same as the archived version) -- that's still one
  // button, not a third one, so it doesn't violate the two-button rule.
  // Edit Season is a stub -- there's no season list/edit endpoint yet, so
  // it just says so; wiring it up is future work, same shape as Create
  // once there's something to point it at.
  // ---------------------------------------------------------------------
  // Status pill for the Season Tools list (added 2026-08-30) -- same chip
  // shape/pattern as _rcClassBadge/_rcCarTierBadge, colored per status so
  // Draft/Scheduled/Registration/Active/Completed read apart from each
  // other in a flat list. Falls back to Draft's color for a blank/unknown
  // status, same "old rows never break" convention as everywhere else a
  // status column can be empty.
  function _rcSeasonStatusBadge(status) {
    var key = status || 'Draft';
    var classMap = {
      Draft: 'rc-badge-status-draft', Scheduled: 'rc-badge-status-scheduled',
      Registration: 'rc-badge-status-registration', Active: 'rc-badge-status-active',
      Completed: 'rc-badge-status-completed'
    };
    return el('span', 'rc-badge-chip ' + (classMap[key] || 'rc-badge-status-draft'), escapeHtml(key));
  }

  // One row for a single season -- own row builder (2026-08-30) so it can
  // be dropped straight into Season Tools' own panel underneath a year
  // pill (see buildSeasonsListFragment below), same "row with an Edit
  // button on the right" shape the Data Management Cars/Tracks lists
  // already use, just under its own .rc-group-row class since it's
  // indented one level deeper (year -> season) than those lists ever go.
  function buildSeasonRow(s, token, reload) {
    var row = el('div', 'rc-group-row');
    var info = el('div', 'rc-dm-row-info');
    var textCol = el('div', null);

    var nameLine = el('div', 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;');
    nameLine.appendChild(el('span', 'rc-dm-row-label', escapeHtml(s.name || s.seasonId)));
    nameLine.appendChild(_rcSeasonStatusBadge(s.status));
    textCol.appendChild(nameLine);

    var metaParts = [];
    metaParts.push(s.classes && s.classes.length ? s.classes.join(', ') : 'No classes selected');
    metaParts.push(s.raceCount + ' race' + (s.raceCount === 1 ? '' : 's'));
    metaParts.push(s.registrationCount + ' driver' + (s.registrationCount === 1 ? '' : 's') + ' registered');
    if (s.createdAt) metaParts.push('Created ' + formatDateLabel(String(s.createdAt).slice(0, 10)));
    textCol.appendChild(el('div', 'rc-hint', escapeHtml(metaParts.join(' · '))));

    info.appendChild(textCol);
    row.appendChild(info);

    var btnGroup = el('div', 'display:flex;gap:8px;flex:none;');

    var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
    editBtn.type = 'button';
    editBtn.addEventListener('click', function () { openSeasonEditWizardWithLoad(token, s.seasonId); });
    btnGroup.appendChild(editBtn);

    if (s.locked) {
      // Already raced -- Delete is refused server-side anyway, so the
      // button isn't even offered. End Season (renamed from Archive,
      // 2026-08-30 -- Matt's call, same handleAdminArchiveSeason call
      // underneath, just a heavier typed-confirmation popup so hitting it
      // takes real deliberation) only makes sense once -- a season
      // already Completed has already been ended.
      if (s.status !== 'Completed') {
        var endSeasonBtn = el('button', 'rc-btn-secondary rc-btn-row', 'End Season');
        endSeasonBtn.type = 'button';
        endSeasonBtn.style.cssText = 'color:var(--rc-red);border-color:var(--rc-red);';
        endSeasonBtn.addEventListener('click', function () {
          openTypeToConfirmModal(
            'End Season',
            'End "' + (s.name || s.seasonId) + '"? Ending a season is irreversible.',
            'END SEASON',
            'End Season',
            function () {
              endSeasonBtn.disabled = true;
              fetchApi('adminArchiveSeason', { method: 'POST', token: token, body: { seasonId: s.seasonId } }).then(function (data) {
                if (!data.success) {
                  showToast(data.message || 'Could not end this season.', 'error');
                  endSeasonBtn.disabled = false;
                  return;
                }
                showToast(escapeHtml(s.name) + ' ended.', 'success');
                rcReloadAfterSave();
              }).catch(function () {
                showToast('Could not reach the server. Try again in a moment.', 'error');
                endSeasonBtn.disabled = false;
              });
            }
          );
        });
        btnGroup.appendChild(endSeasonBtn);
      }
    } else {
      var deleteBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Delete');
      deleteBtn.type = 'button';
      deleteBtn.style.cssText = 'color:var(--rc-red);border-color:var(--rc-red);';
      deleteBtn.addEventListener('click', function () {
        openConfirmModal('Delete Season', 'Permanently delete "' + (s.name || s.seasonId) + '"? This removes its rounds and registrations too. This can\'t be undone.', 'Delete', function () {
          fetchApi('adminDeleteSeason', { method: 'POST', token: token, body: { seasonId: s.seasonId } }).then(function (data) {
            if (!data.success) {
              showToast(data.message || 'Could not delete this season.', 'error');
              return;
            }
            showToast(escapeHtml(s.name) + ' deleted.', 'success');
            rcReloadAfterSave();
          }).catch(function () {
            showToast('Could not reach the server. Try again in a moment.', 'error');
          });
        });
      });
      btnGroup.appendChild(deleteBtn);
    }

    row.appendChild(btnGroup);
    return row;
  }

  // Every season, grouped by the year it was CREATED (not the season's own
  // in-game year/number) -- same black-pill-plus-indented-children shape
  // the Cars list uses for Class -> Season (2026-08-30, Matt's ask: "arrange
  // season list like cars"). A season with no CreatedAt (created before
  // that column existed) groups under "Unknown Year" rather than guessing.
  // Returns a plain fragment-like container -- buildSeasonsPanel wraps the
  // result in its own bordered .rc-panel box (2026-08-30), same as every
  // other Data Management list, rather than this function owning that
  // border itself.
  function buildSeasonsListFragment(seasons, token, reload) {
    var wrap = el('div');
    if (!seasons.length) {
      wrap.appendChild(el('div', 'rc-dm-empty', 'No seasons yet.'));
      return wrap;
    }

    var byYear = {};
    var years = [];
    seasons.forEach(function (s) {
      var year = s.createdAt ? String(s.createdAt).slice(0, 4) : 'Unknown Year';
      if (!byYear[year]) { byYear[year] = []; years.push(year); }
      byYear[year].push(s);
    });
    // Seasons already arrive most-recently-created first (handleAdminListSeasons)
    // -- sorting years the same way keeps this year first without a second
    // pass over createdAt strings.
    years.sort(function (a, b) { return b.localeCompare(a); });

    years.forEach(function (year) {
      var yearHead = el('div', 'rc-group-head');
      yearHead.appendChild(el('span', 'rc-badge-chip rc-badge-group', escapeHtml(year)));
      wrap.appendChild(yearHead);
      byYear[year].forEach(function (s) {
        wrap.appendChild(buildSeasonRow(s, token, reload));
      });
    });

    return wrap;
  }

  // The whole Seasons panel -- button row (Create/Resume, Clear Draft) plus
  // the season list underneath it, both built together in one shot once
  // `seasons` has actually loaded. Named "Seasons" now (renamed from
  // "Season Tools", 2026-08-30), using the same card chrome as the
  // Dashboard's own cards (rc-dash-card/rc-dash-card-title) for visual
  // consistency across the site. `reload` is a full re-render of the
  // whole League Management section (see renderLeagueManagementSection)
  // rather than patching just this panel in place -- keeps "nothing shows
  // until it's loaded" true after a mutation too, not just on first load.
  function buildSeasonsPanel(seasons, token, reload) {
    var panel = el('div', 'rc-panel rc-dash-card');
    panel.appendChild(el('h3', 'rc-dash-card-title', 'Seasons'));

    var row = el('div', 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;');
    var hasDraft = !!loadWizardDraft();
    var createBtn = el('button', 'rc-btn-primary rc-btn-sm', hasDraft ? 'Resume Season Draft' : 'Create a Season');
    createBtn.type = 'button';
    createBtn.addEventListener('click', function () { openSeasonWizardWithLoad(); });
    row.appendChild(createBtn);

    // The standalone Edit Season button is gone (2026-08-30) -- editing
    // now happens per-row in the season list below, which can point at
    // ANY season instead of always whichever one is most recent.
    //
    // Only shows up once a draft actually exists -- there's nothing to
    // clear otherwise, so this never adds a second button to the steady-
    // state row.
    if (hasDraft) {
      var clearDraftBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Clear Season Draft');
      clearDraftBtn.type = 'button';
      clearDraftBtn.addEventListener('click', function () {
        clearWizardDraft();
        showToast('Season draft cleared.', 'success');
        reload();
      });
      row.appendChild(clearDraftBtn);
    }

    panel.appendChild(row);

    // The season list gets its own bordered box, separate from the button
    // row above it (2026-08-30, Matt's call: "add a border around the
    // season list like every other data management list popup -- the add
    // [season] button sits outside of the box on top") -- same shape as
    // Members/Tracks/Cars/Sponsors, where each one's own Add button sits
    // in the modal above a bordered .rc-panel holding just the list.
    var listBox = el('div', 'rc-panel');
    listBox.appendChild(buildSeasonsListFragment(seasons, token, reload));
    panel.appendChild(listBox);

    return panel;
  }

  function renderLeagueManagementSection(token) {
    var section = document.getElementById('rc-section-league');
    if (!section) return;
    section.innerHTML = '';

    // No "League Management" heading while loading, and buildPageSpinner
    // (not the bare buildSpinner) for the wait itself -- Matt's standing
    // call: every full-section loading state across the Account pages sits
    // at the exact same vertical height as the initial #rc-loading screen,
    // which has no heading above it either (see renderCalendarSection for
    // the same pattern). Nothing else renders until the season list has
    // actually loaded (Matt's 2026-08-30 call) -- no flash of buttons
    // appearing before the list underneath them is ready.
    section.appendChild(buildPageSpinner('Loading seasons...'));

    fetchApi('adminListSeasons', { token: token }).then(function (data) {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'League Management'));
      if (!data.success) {
        section.appendChild(el('p', 'color:var(--rc-red);', 'Could not load seasons.'));
        return;
      }
      section.appendChild(buildSeasonsPanel(data.seasons || [], token, function () { renderLeagueManagementSection(token); }));
    }).catch(function () {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'League Management'));
      section.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server.'));
    });
  }

  // ---------------------------------------------------------------------
  // CALENDAR (2026-08-29) -- visual design restored verbatim from the
  // pre-v0.5 archive (commit ab231e0: withTooltip/calStat/weatherIcon/
  // formatRaceDateTime/formatByeDate/formatPointsList/raceCard/
  // seasonDetailsPanel), but every data source is real now instead of the
  // old CALENDAR_MOCK_SEASON -- see handleGetSeasonCalendar (DataCache.gs)
  // for how Rounds + seasonDetails.specialEvents + seasonDetails.
  // byeWeekDates get merged into one chronological list server-side.
  // Fetches fresh every time the link is clicked (same pattern as Data/
  // League Management) -- Matt's "no loaders, ever" rule was specifically
