<!--
  Race Club — Account.html  (v0.5.0, sidebar-only rebuild)

  WHY THIS REBUILD: the v0.4.0 file had grown to ~5,200 lines of real
  section content (Dashboard widgets, Calendar, Objectives, League
  Management's Season Creation Wizard, Admin's approval queue + user
  management, Data Management's Tracks/Cars/Drivers editors, Settings'
  edit-profile form) built against features and schema that have since
  moved out from under it (see login.html/register.html/verify.html's
  email-based-login rebuild). Rather than patch a page full of stale
  assumptions one section at a time, Matt's call was to strip it back to
  just the shell -- the black sidebar, its full set of links, the
  section-switching behavior, the auth gate, and the one truly essential
  piece of business logic (the forced password-change lock screen) -- and
  rebuild each section's real content one link at a time going forward.

  WHAT'S KEPT, EXACTLY AS BEFORE:
  - The full sidebar nav: the same 10 primary items (Dashboard / Calendar
    / Finances / Results / Career / Reputation / Objectives / Sponsors /
    Hall of Fame / Settings) in the same order, plus the same
    permission-gated items (League Management, Admin, Data Management)
    and the same Help / Settings / Log Out row at the bottom, all with
    their original icons.
  - showSection() section-switching, the mobile hamburger menu + scroll
    lock, the 30-minute inactivity auto-logout, the auth gate, and the
    "arrived via a fresh login vs. need a getProfile call" fast path --
    all unchanged in behavior.
  - The mustChangePassword forced password-change lock screen. This is
    the one section this pass did NOT hollow out: it's a security gate
    that runs before the sidebar even shows, not a link a driver clicks
    into, so it stays fully functional using the same passwordChangeSection()
    form as before.

  WHAT'S GONE (for now): every section's actual content. Each of the 14
  content sections now renders a single centered "Coming soon" placeholder
  panel (see renderPlaceholderSections()) instead of real data, widgets,
  or admin tooling. That includes the profile-edit form -- normal profile
  editing goes through that link same as any other, so it's empty too for
  now; only the change-password FORM ITSELF survives, because the
  forced-password lock screen depends on it directly.

  PREVIOUS PASS (header/notification redesign): passwordChangeSection()'s
  result ("Password updated"/"New password and confirmation don't
  match"/etc.) now goes through js/header.js's showToast() instead of its
  own inline status line, per Matt's sitewide toast-notifications call.
  Also fixed: buildFullProfileUI was gating League Management/Admin/Data
  Management visibility on a `profile.permissions` array that
  buildProfilePayload (Auth.gs) never actually sends -- those links could
  never have shown for anyone. Until a real roles/permissions system is
  designed, this now just checks `profile.role === 'Admin'` for all three
  (Admin is the only role with anything to manage right now anyway). Also
  fixed: both the fresh-login fast path and the getProfile fallback were
  handing the whole API response wrapper ({success, profile}) to
  renderProfile() instead of its nested .profile, so every field this page
  reads off `profile` (including .role, just fixed above) was silently
  reading undefined.

  THIS PASS (Help + Edit Profile become popups, not sections): the
  'settings' and 'help' entries are gone from PLACEHOLDER_LABELS and their
  <section> elements are gone from the HTML -- both are now popups
  (showModal(), reintroduced this pass, backed by the .rc-modal* CSS
  classes that survived the v0.5.0 rebuild even though the JS function
  that used them didn't). The sidebar's Edit Profile and Help buttons now
  call openEditProfileModal()/openHelpModal() directly instead of falling
  through to showSection(id) -- both need live profile/token data that
  doesn't exist yet at buildSidebarNav() time (same problem the Admin nav
  item already had), so this pass adds module-level currentProfile/
  currentToken vars, set once in buildFullProfileUI(), for those handlers
  to read at click-time. The now-pointless ?section= deep-link handling is
  gone too -- Edit Profile is a popup now, not a URL a header link can
  point at.

  openEditProfileModal() lets a driver edit Username / First Name / Last
  Name / Suffix / Email / Location / Time Zone, posts to the
  `updateOwnProfile` action (Auth.gs's handleUpdateOwnProfile, expanded
  this pass to accept exactly these fields), refreshes the cached profile
  and header on success, and embeds the existing passwordChangeSection()
  form underneath so Change Password lives in the same popup. DisplayName
  is still never directly editable -- it's computed server-side from
  First/Last/Suffix, same rule as registration.

  LATER PASS -- Help becomes an in-page section again, not a popup, not a
  standalone page. It was briefly help.html (its own page, so the
  Rulebook would have room to grow), but that page dropped the sidebar/
  nav chrome entirely -- it read as leaving the site, not as part of the
  account (Matt's call to fold it back in). help.html is gone;
  openHelpModal() is also gone (that was the popup before it). The
  sidebar's Help button is back to a normal showSection('help') click,
  and renderHelpSection() builds the section content once, eagerly, at
  buildFullProfileUI() time: a "Website Help" .rc-panel (the same couple
  of contact/support lines the old popup had) followed by a "Rules and
  Regulations" .rc-panel that renders js/rulebook-content.js's
  RULEBOOK_SECTIONS -- index up top, every section's real content below
  it, unwritten sections marked "Not yet drafted" rather than hidden.
-->
<!DOCTYPE html>

<body>

<div id="rc-header"></div>
<!-- Paint the header immediately from whatever's already cached in
     localStorage (2026-09-18, Matt's call: "paint the avatar immediately

     continuous between pages") -- same renderHeader() index.html already
     calls on load, so navigating here from anywhere else shows the same
     avatar without a blank flash while the real check happens in the
     background. This is optimistic: the LOAD PROFILE section below still
     verifies the token against the server, and if it turns out to be
     invalid, showSessionExpiredLock() swaps the whole page (header
     included, via renderHeader({forceLoggedOut:true})) over to a
     logged-out state with a link back to login.html -- see that function
     for the full story. -->
<script>renderHeader();</script>

<!-- Mobile-only topbar. -->
<div class="rc-topbar" id="rc-topbar">

</div>

<div class="rc-shell">

  <main class="rc-main">
    <div id="rc-loading" class="rc-inline-spinner-wrap rc-inline-spinner-page">

        <span class="rc-startlight"></span>

      </div>

    </div>
    <div id="rc-error" class="rc-message rc-error" style="display:none;"></div>

         normal dashboard whenever profile.mustChangePassword is true. -->
    <div id="rc-forced-password" style="display:none;"></div>

    <!-- Session-expired lock screen (2026-09-18) -- shown instead of the
         normal dashboard when the background token check comes back
         invalid, now that the header paints optimistically from cache
         instead of waiting to confirm the session first. See
         showSessionExpiredLock() below. -->

    <div id="rc-profile-root" style="display:none;">
      <section id="rc-section-dashboard" class="rc-content-section"></section>
      <section id="rc-section-calendar" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-results" class="rc-content-section" style="display:none;"></section>

      <section id="rc-section-stewarding" class="rc-content-section" style="display:none;"></section>

  </main>
</div>

<!-- Site footer -- on every page. -->
<footer class="rc-site-footer">
  Copyright Race Club 2026. All rights reserved. Created and developed with the help of Claude AI.
</footer>

<script>
(function () {
  // ---------------------------------------------------------------------
  // SETUP / AUTH GATE
  // ---------------------------------------------------------------------
  if (apiBaseUrlIsUnset()) {
    document.getElementById('rc-loading').style.display = 'none';
    var err = document.getElementById('rc-error');
    err.style.display = 'block';
    err.textContent = 'API_BASE_URL is not set. Edit js/api.js and paste in your Apps Script Web App URL.';
    return;
  }

  var token = redirectIfNoToken();
  if (!token) return; // already redirected to login.html

  startInactivityWatcher();

  // Called by the Logout nav item built in buildSidebarNav() below.
  // Clears the local token and redirects immediately, without waiting on
  // the server-side logout call to finish -- if it never completes, the
  // token just sits unused until its normal 7-day expiry, harmless.
  function doLogout() {
    fetchApi('logout', { method: 'POST', token: token }).catch(function () {});
    clearToken();
    window.location.href = 'login.html';
  }

  // Mobile menu open/close. While open, the page itself can't scroll (see
  // .rc-scroll-locked in style.css). Remembers scroll position so it can
  // be restored on close.
  var scrollYBeforeLock = 0;
  function openMobileMenu() {
    document.getElementById('rc-sidebar').classList.add('rc-sidebar-open');
    scrollYBeforeLock = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = '-' + scrollYBeforeLock + 'px';
    document.body.classList.add('rc-scroll-locked');
  }
  function closeMobileMenu() {
    document.getElementById('rc-sidebar').classList.remove('rc-sidebar-open');
    document.body.classList.remove('rc-scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, scrollYBeforeLock);
  }
  document.getElementById('rc-hamburger').addEventListener('click', function (evt) {
    evt.stopPropagation();
    var sidebar = document.getElementById('rc-sidebar');
    if (sidebar.classList.contains('rc-sidebar-open')) closeMobileMenu();
    else openMobileMenu();
  });
  document.addEventListener('click', function (evt) {
    var sidebar = document.getElementById('rc-sidebar');
    if (!sidebar.classList.contains('rc-sidebar-open')) return;
    if (sidebar.contains(evt.target)) return; // click was on a nav link/inside the menu -- let it do its own thing
    closeMobileMenu();
  });

  // NOTE: the actual profile-loading code is at the very bottom of this
  // script, not here -- renderProfile()/buildFullProfileUI() below touch
  // `var`s (NAV_ITEMS, the ICON_* constants) whose VALUE ASSIGNMENTS
  // aren't hoisted, so calling them this early (before those assignments
  // have run, on the synchronous fresh-login path) would throw partway
  // through. Moving the load/render call to the bottom fixes that
  // unconditionally.

  // `style` accepts EITHER an inline CSS string ("margin:0;color:red;")
  // OR a plain class name ("rc-hint") -- disambiguated by whether it
  // contains a colon.
  function el(tag, style, html) {
    var e = document.createElement(tag);
    if (style) {
      if (style.indexOf(':') !== -1) e.style.cssText = style;
      else e.className = style;
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------------------------------------------------------------------
  // THEMED TOOLTIP (rebuilt 2026-08-30, Matt's call: "stop all tooltips
  // from being cut off when hovering over something in a popup") -- see
  // .rc-tooltip-bubble in style.css for the full story on why. Any
  // element with class "rc-tooltip" plus a data-tooltip="..." attribute
  // gets this bubble on hover/focus; nothing else needs to change at any
  // existing call site, since this reads the same attribute the old
  // pure-CSS version did. One bubble is created lazily and reused for
  // every tooltip on the page rather than one per trigger -- delegated
  // document-level listeners mean a tooltip added to the DOM later (a
  // freshly rendered popup row, say) works automatically with no wiring.
  //
  // position:fixed + JS-measured coordinates is the actual fix: fixed
  // positioning is computed against the viewport, not any scrolling
  // ancestor, so a modal's own overflow:auto can never clip this bubble
  // the way it clipped the old ::after-based one. showTooltipBubble()
  // also flips the bubble below its target (instead of above) and clamps
  // it horizontally when it would otherwise run off the top or a side of
  // the screen, so this also covers a tooltip near the edge of the
  // browser window itself, not just inside a popup.
  // ---------------------------------------------------------------------
  var rcTooltipBubbleEl = null;
  var rcTooltipArrowEl = null;
  var rcTooltipTextEl = null;
  var rcTooltipCurrentTarget = null;

  function rcEnsureTooltipBubble() {
    if (rcTooltipBubbleEl) return;
    rcTooltipBubbleEl = el('div', 'rc-tooltip-bubble');
    rcTooltipTextEl = el('div');
    rcTooltipArrowEl = el('div', 'rc-tooltip-bubble-arrow');
    rcTooltipBubbleEl.appendChild(rcTooltipTextEl);
    rcTooltipBubbleEl.appendChild(rcTooltipArrowEl);
    document.body.appendChild(rcTooltipBubbleEl);
  }

  function rcShowTooltipBubble(target) {
    var text = target.getAttribute('data-tooltip');
    if (!text) return;
    rcEnsureTooltipBubble();
    rcTooltipCurrentTarget = target;
    rcTooltipTextEl.textContent = text; // textContent, not innerHTML --
    // this is arbitrary catalog/sponsor text, not markup, so this also
    // keeps it XSS-safe by construction regardless of what's in it.
    rcTooltipBubbleEl.classList.add('rc-tooltip-bubble-visible');
    rcPositionTooltipBubble(target);
  }

  function rcHideTooltipBubble() {
    if (!rcTooltipBubbleEl) return;
    rcTooltipBubbleEl.classList.remove('rc-tooltip-bubble-visible');
    rcTooltipCurrentTarget = null;
  }

  function rcPositionTooltipBubble(target) {
    var rect = target.getBoundingClientRect();
    var gap = 9;
    var margin = 8;
    var bubbleRect = rcTooltipBubbleEl.getBoundingClientRect();
    var above = true;
    var top = rect.top - bubbleRect.height - gap;
    if (top < margin) { above = false; top = rect.bottom + gap; }
    var left = rect.left + rect.width / 2 - bubbleRect.width / 2;
    var maxLeft = window.innerWidth - bubbleRect.width - margin;
    left = Math.max(margin, Math.min(maxLeft, left));
    rcTooltipBubbleEl.style.top = top + 'px';
    rcTooltipBubbleEl.style.left = left + 'px';
    rcTooltipBubbleEl.classList.toggle('rc-tooltip-bubble-above', above);
    rcTooltipBubbleEl.classList.toggle('rc-tooltip-bubble-below', !above);
    // The arrow points at the target's own horizontal center regardless
    // of how far the bubble itself got clamped sideways to stay
    // on-screen -- clamped to the bubble's own width so it never pokes
    // out past the bubble's rounded corners.
    var arrowLeft = rect.left + rect.width / 2 - left;
    arrowLeft = Math.max(10, Math.min(bubbleRect.width - 10, arrowLeft));
    rcTooltipArrowEl.style.left = arrowLeft + 'px';
  }

  (function rcInitTooltips() {
    function findTooltipTarget(node) {
      return (node && node.closest) ? node.closest('.rc-tooltip[data-tooltip]') : null;
    }
    document.addEventListener('mouseover', function (e) {
      var t = findTooltipTarget(e.target);
      if (t) rcShowTooltipBubble(t);
    });
    document.addEventListener('mouseout', function (e) {
      var t = findTooltipTarget(e.target);
      // relatedTarget is where the pointer is headed -- skip hiding when
      // it's just moving to a child of the same tooltip trigger, same as
      // the old CSS :hover would have kept it open in that case.
      if (t && (!e.relatedTarget || !t.contains(e.relatedTarget))) rcHideTooltipBubble();
    });
    document.addEventListener('focusin', function (e) {
      var t = findTooltipTarget(e.target);
      if (t) rcShowTooltipBubble(t);
    });
    document.addEventListener('focusout', function (e) {
      var t = findTooltipTarget(e.target);
      if (t) rcHideTooltipBubble();
    });
    // A visible tooltip is positioned against its target's coordinates at
    // the moment it opened -- if the page scrolls or resizes underneath
    // it without a matching mouseout (scrolling a popup's list with the
    // mouse held still over a row, say), those coordinates go stale.
    // capture:true is required for scroll specifically -- it doesn't
    // bubble, so a listener on document only ever sees it this way.
    document.addEventListener('scroll', function () {
      if (rcTooltipCurrentTarget) rcPositionTooltipBubble(rcTooltipCurrentTarget);
    }, true);
    window.addEventListener('resize', function () {
      if (rcTooltipCurrentTarget) rcPositionTooltipBubble(rcTooltipCurrentTarget);
    });
  })();

  // Flat, stroke-based icons (no emoji) -- one per sidebar item, unchanged
  // from v0.4.0.
  var ICON_DASHBOARD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>';
  var ICON_CALENDAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
  var ICON_RESULTS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="11"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="19" y1="20" x2="19" y2="14"></line></svg>';
  var ICON_CAREER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
  var ICON_NAV_STAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"></polygon></svg>';

  var ICON_LEAGUE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M9 3v2h6V3"></path><line x1="8" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="16" y2="15"></line></svg>';
  var ICON_LOCK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';
  var ICON_ADMIN = ICON_LOCK.replace('width="18" height="18"', 'width="16" height="16"');
  var ICON_DATAMGMT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path></svg>';
  var ICON_LOGOUT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>';
  var ICON_HELP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.2 9a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2-2.6 3.6"></path><line x1="12" y1="17" x2="12" y2="17.2"></line></svg>';
  // Same glyph as the header's own notification bell (js/header.js) --
  // duplicated here rather than shared, since that file runs in its own
  // separate scope. Used by the Help page's page-by-page guide.
  var ICON_BELL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>';
  var ICON_MAIL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>';

  // Restored from the pre-v0.5 archive (commit ab231e0) for the Calendar
  // page -- weather/session/setup chip icons, none of which the current

    if (hiddenByDefault) btn.style.display = 'none';

    btn.addEventListener('click', onClick || function () { showSection(id); });
    return btn;

  // ---------------------------------------------------------------------
  // DASHBOARD (2026-08-29) -- starting fresh. The old widget-heavy
  // dashboard from before the ECO rebuild is gone; nothing from it is
  // being restored. This is the first card back -- Registration Status,
  // in its own top row by itself (Matt's call: build/verify cards one at
  // a time, more join this row later).
  // ---------------------------------------------------------------------
  // ONE combined call instead of 8 separate ones (2026-09-13, Matt's
  // report: Dashboard taking 20+ seconds to load). Each card used to fire
  // its own action call -- 8 separate HTTP round trips to the Apps
  // Script Web App, and Apps Script does not run several requests from
  // the same user in true parallel, so those 8 stacked up one after
  // another instead of finishing together. action=getDashboardData
  // (handleGetDashboardData, DataCache.gs) does the same 8 lookups
  // server-side, in one execution, and returns them all in one response.
  //
  // Every card still gets its own promise, exactly as before -- they all
  // just resolve (or reject) together off that one underlying fetch,
  // instead of off 8 independent ones. This is why every card render
  // function below (asyncDashCard, the Registration Status/Current Seat
  // pair, etc.) needed no changes at all: as far as they know, they're
  // still each waiting on their own fetch. The tradeoff, since this is
  // one response now instead of 8: the cards no longer fade in one by
  // one as each finishes (2026-09-03 rewrite) -- they now all populate
  // together the moment the one combined call resolves. Matt's call,
  // trading that fade-in for the much shorter total wait.
  function fetchDashboardData(token) {
    var combined = fetchApi('getDashboardData', { token: token }).catch(function () { return { success: false }; });
    function slice(key) {
      return combined.then(function (data) {
        return (data && data.success && data[key]) ? data[key] : { success: false };
      });
    }
    return {
      activeSeasonPromise: slice('activeSeason'),
      currentSeatPromise: slice('currentSeat'),
      nextRacePromise: slice('nextRace'),
      myProtestsPromise: slice('myProtests')
    };
  }

  // Builds the two data-driven rows (Registration Status/Current Seat,
  // Next Race/Protest) as instantly-painted placeholders that each
  // fade their real content in the moment their own fetch resolves -- no
  // card waits on any other card, and nothing here waits on this
  // function's caller either. Registration Status and Current Seat are
  // handled by hand (not via the generic asyncDashCard helper) because
  // they need to be built together: Registration Status' onRegistered
  // callback needs a live handle to Current Seat's own rcRefresh, which
  // only exists once currentSeatCard() has actually run.
  //
  // Finances/Reputation/Sponsors/Season Objective cards removed entirely
  // (V1 scope cut, 2026-09-18) -- those systems no longer exist.
  //
  // Returns { topRow, resultsRow } -- callers own attaching them to the
  // page and (for a refresh) swapping their children out.
  function buildDashboardDataRows(profile, token, dashboardData, onRegistered) {
    var topRow = el('div', 'rc-quick-row');
    var resultsRow = el('div', 'rc-quick-row');

    var seatPlaceholder = el('div', 'rc-panel rc-currentseat-card rc-dash-card rc-dash-card-fade');
    var regPlaceholder = el('div', 'rc-panel rc-regstatus-card rc-dash-card rc-dash-card-fade');

    Promise.all([
      dashboardData.activeSeasonPromise.catch(function () { return { success: false }; }),
      dashboardData.currentSeatPromise.catch(function () { return { success: false }; })
    ]).then(function (results) {
      var activeSeason = results[0];
      var currentSeat = results[1];
      // Wrapped in try/catch (2026-09-14 fix) -- these two cards are built
      // by hand here rather than through asyncDashCard, but shared the
      // same gap: nothing caught a render-function exception, so either
      // card throwing left BOTH placeholders permanently blank (they're
      // built together in this one block) with no error, no fade-in, no
      // trace. Same fallback message as asyncDashCard's own fix above.
      try {
        var seatCard = currentSeatCard(profile, token, currentSeat);
        var regCard = registrationStatusCard(profile, token, activeSeason, function () {
          if (seatCard.rcRefresh) seatCard.rcRefresh();
          if (onRegistered) onRegistered();
        });
        while (seatCard.firstChild) seatPlaceholder.appendChild(seatCard.firstChild);
        if (seatCard.rcRefresh) seatPlaceholder.rcRefresh = seatCard.rcRefresh;
        while (regCard.firstChild) regPlaceholder.appendChild(regCard.firstChild);
      } catch (err) {
        if (window.console && console.error) console.error('Dashboard card failed to render:', err);
        seatPlaceholder.appendChild(el('p', 'rc-cs-empty', 'Could not load this right now.'));
        regPlaceholder.appendChild(el('p', 'rc-cs-empty', 'Could not load this right now.'));
      }
      seatPlaceholder.classList.add('rc-dash-card-fade-in');
      regPlaceholder.classList.add('rc-dash-card-fade-in');
    });

    topRow.appendChild(regPlaceholder);
    topRow.appendChild(seatPlaceholder);

    resultsRow.appendChild(asyncDashCard('rc-panel rc-nextrace-card rc-dash-card', dashboardData.nextRacePromise, nextRaceCard, dashboardData.activeSeasonPromise));
    // Protest card moved up here, next to Next Race (2026-09-19, Matt's
    // call: "Move protests next to NEXT RACE card") -- replaces Recent
    // Results, which is removed from the Dashboard entirely (same call).
    // Used to be its own full-width row further down (see the now-removed
    // protestRow in renderDashboardSection) -- same protestCard renderer
    // and myProtestsPromise, just placed here instead.
    resultsRow.appendChild(asyncDashCard('rc-panel rc-finrep-card rc-dash-card', dashboardData.myProtestsPromise, protestCard));

    return { topRow: topRow, resultsRow: resultsRow };
  }

  // Every promise buildDashboardDataRows/the Protest card read off, bundled
  // so both the first paint and a post-registration rebuild can wait on
  // "the whole combined fetch is back" in one place.
  function _rcDashboardAllSettled_(dashboardData) {
    return Promise.all([
      dashboardData.activeSeasonPromise, dashboardData.currentSeatPromise,
      dashboardData.nextRacePromise, dashboardData.myProtestsPromise
    ]);
  }

  function renderDashboardSection(profile, token, dashboardData) {
    var section = document.getElementById('rc-section-dashboard');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(el('h2', null, 'Dashboard'));

    // Two rows of cards (2026-09-19 -- Recent Results removed entirely,
    // Protest moved up into the row it used to sit below, Matt's call:
    // "remove RECENT RESULTS card from dashboard. Move protests next to
    // NEXT RACE card"):
    //   Row 1: Registration Status, Current Seat
    //   Row 2: Next Race, Protest (last 3 filed protests, same
    //   asyncDashCard treatment as every other data-driven card)
    //
    // Branded loading spinner while the combined fetch is in flight
    // (2026-09-13, Matt's call: "add the loading popup that we use
    // throughout the account page" -- keep the Dashboard's own wait
    // consistent with Calendar/League Management/every other section that
    // fetches on load, now that fetchDashboardData is one combined
    // action=getDashboardData round trip instead of 8 separate ones. The
    // 2026-09-03 "every card fades in independently, nothing blocks
    // anything else" treatment doesn't really apply anymore since all 8
    // cards' data now arrives together in that one response -- they still
    // use the exact same asyncDashCard/fade-in code as before, it just
    // all resolves at once, so showing the standard spinner for that one
    // wait (instead of a grid of blank fading cards) reads better and
    // matches how every other page on the site shows a loading state.
    var spinner = buildPageSpinner('Loading your dashboard...');
    section.appendChild(spinner);

    var rows = null;

    function paintRows(data, onRegistered) {
      var built = buildDashboardDataRows(profile, token, data, onRegistered);
      section.appendChild(built.topRow);
      section.appendChild(built.resultsRow);

      return built;
    }

    function onRegisteredRebuild() {
      // Registration just completed -- re-fetch everything that's
      // gated/built on registration state and swap both rows'
      // contents in place, same "fresh promises, fade in again" path as
      // the very first paint. Named (not anonymous) so it can pass
      // itself back in as the next rebuild's own onRegistered callback.
      // Shows the same spinner while the fresh combined fetch is in
      // flight, rather than swapping stale content for a moment.
      var freshDashboardData = fetchDashboardData(token);
      var rebuildSpinner = buildPageSpinner('Loading your dashboard...');
      rows.topRow.parentNode.insertBefore(rebuildSpinner, rows.topRow);
      _rcDashboardAllSettled_(freshDashboardData).then(function () {
        rebuildSpinner.remove();
        var fresh = buildDashboardDataRows(profile, token, freshDashboardData, onRegisteredRebuild);
        rows.topRow.innerHTML = '';
        while (fresh.topRow.firstChild) rows.topRow.appendChild(fresh.topRow.firstChild);
        rows.resultsRow.innerHTML = '';
        while (fresh.resultsRow.firstChild) rows.resultsRow.appendChild(fresh.resultsRow.firstChild);
      });
    }

    _rcDashboardAllSettled_(dashboardData).then(function () {
      spinner.remove();
      rows = paintRows(dashboardData, onRegisteredRebuild);
    });
  }

  // Runs after ANY popup save (added 2026-08-30, Matt's call: "Whenever
  // I'm in a popup and saves some kind of information, it should reload
  // ... so that notifications popup and items on the screen refresh").
  //
  // 2026-09-01 rewrite ("make it seamless -- go from saving the sponsors
  // straight back to the sponsors page with an updated list, without
  // reloading"): a hard window.location.reload() -- even a working one --
  // re-runs the ENTIRE page bootstrap, which shows its own full-screen
  // "loading account" spinner before Account.html has even decided which
  // section to show, and THEN that section's own lazy renderer (e.g.
  // renderSponsorsSection) shows a second, page-level spinner while it
  // re-fetches. Two stacked loading states for what should just be "the
  // list you were looking at, now current."
  //
  // Seamless path: if the section the popup was opened from is one of the
  // lazy, fetch-on-click sections (RC_LAZY_SECTION_RENDERERS above --
  // Sponsors/Calendar/Admin/League), just call that section's own
  // renderer again in place. It already does exactly what a reload would
  // have accomplished for that section -- re-fetch fresh data and rebuild
  // the section's DOM -- without leaving the page at all. The popup no
  // longer disappears via navigation wiping the DOM, so this path closes
  // it explicitly via rcActiveModalCloseFn (set by showModal() above)
  // once the fresh render is in.
  //
  // Fallback path: sections with no lazy renderer -- Dashboard chief among
  // them -- were only ever built once by buildFullProfileUI() and have no
  // stand-alone "re-fetch and rebuild just this section" entry point (a
  // save's ripple effects there can touch several cards, the header
  // avatar, the notification bell, etc. all at once). For those, fall
  // back to the original hard-reload behavior so nothing goes stale;
  // rcActiveSectionId travels through the URL hash across the reload and
  // buildFullProfileUI() reads it back on the other side (see below) to
  // land back on the same section instead of always Dashboard. Setting
  // location.hash to a DIFFERENT value is a same-document navigation (no
  // real reload by itself) -- only window.location.reload() actually
  // re-fetches the page, which is why it's called unconditionally here
  // rather than relying on the href assignment alone (2026-09-01 bug:
  // Save just sat on "Saving..." forever because that assumption was
  // wrong -- see git history for the full story).
  function rcReloadAfterSave() {
    var sectionId = rcActiveSectionId || 'dashboard';
    // A save just happened -- every lazy section counts as stale now, not
    // just the one on screen (an Admin edit on one page can ripple into
    // another page's numbers, e.g. an Economy change touching Finances'
    // starting balance while the driver is looking at Sponsors), so the whole
    // showLazySection cache above gets cleared. The section on screen
    // right now still gets its fresh data immediately below; every other
    // one just re-fetches the next time it's actually opened.
    Object.keys(RC_LAZY_SECTION_RENDERERS).forEach(function (id) { rcLoadedLazySections[id] = false; });
    var lazyRenderer = RC_LAZY_SECTION_RENDERERS[sectionId];
    if (lazyRenderer && currentToken) {
      rcLoadedLazySections[sectionId] = true;
      lazyRenderer(currentToken);
      if (rcActiveModalCloseFn) rcActiveModalCloseFn();
      return;
    }
    // Dashboard rebuilt in place now instead of falling through to a full
    // window.location.reload() (2026-09-14 fix, Matt's report: "Could not
    // reach the server" right after joining a team). Dashboard was never
    // in RC_LAZY_SECTION_RENDERERS -- it's built unconditionally up front,
    // not fetch-on-click -- so it used to be the one section that fell
    // through to a hard reload after every save. A hard reload re-runs the
    // ENTIRE page bootstrap: a fresh getProfile call (profile hasn't
    // actually changed, just refetched anyway) PLUS a fresh combined
    // getDashboardData call, fired right after whatever heavy write just
    // happened (joinTeam especially -- Registration/Team/Transaction rows,
    // sponsor bookkeeping) is still the freshest thing Apps Script has
    // done for this user. currentProfile/currentToken (set once in
    // buildFullProfileUI) are already in hand -- there's no need to
    // refetch the profile at all, only the dashboard's own data, exactly
    // like onRegisteredRebuild already does inside renderDashboardSection.
    if (sectionId === 'dashboard' && currentProfile && currentToken) {
      renderDashboardSection(currentProfile, currentToken, fetchDashboardData(currentToken));
      if (rcActiveModalCloseFn) rcActiveModalCloseFn();
      return;
    }
    var targetHash = '#' + encodeURIComponent(sectionId);
    if (window.location.hash !== targetHash) window.location.hash = targetHash;
    window.location.reload();
  }

  // "Season N" -- N is the numeric suffix off a SeasonID (e.g. "SZN-0003"
  // -> "Season 3"), the same sequential number the ID itself already
  // encodes, so there's no separate "season number" field to maintain.
  // Shared by the Calendar page's season header and Registration Status'
  // "REGISTERED FOR" headline (2026-08-31, Matt's call: show the season
  // number there too, not just the name) so both read the number the
  // same way.
  function seasonNumberLabel(seasonId) {
    var m = /(\d+)\s*$/.exec(String(seasonId || ''));
    return m ? String(parseInt(m[1], 10)) : '';
  }

  // "1st"/"2nd"/"3rd"/"4th"... -- only ever fed a positive integer
  // (season standings position), so no negative/zero handling needed.
  function ordinal(n) {
    n = Number(n) || 0;
    var rem100 = n % 100;
    if (rem100 >= 11 && rem100 <= 13) return n + 'th';
    switch (n % 10) {
      case 1: return n + 'st';
      case 2: return n + 'nd';
      case 3: return n + 'rd';
      default: return n + 'th';
    }
  }

  // Three states, rendered directly from data the page already prefetched
  // in parallel with the profile itself (see the bottom of this script) --
  // this card NEVER fetches or spinners on its own, first paint or
  // otherwise (Matt's call: "no loaders in any of the cards, ever").
  //   1. No season currently open to registration -- gray X, "Unregistered."
  //   2. A season IS open and this driver hasn't joined it yet -- yellow
  //      +, clickable, opens the team-pick modal.
  //   3. This driver already has a Registrations row for the open season
  //      -- green check, "Registered," with Registered On / Class / Team.
  // Prospects (pending account approval) skip this card entirely, same
  // convention the pre-rebuild Register button used -- there's nothing
  // for them to register for yet.
  //
  // After a driver actually registers (buildRegistrationModal's onDone),
  // the card DOES need to reflect the new state -- refreshStatus() below
  // re-fetches quietly and swaps the content in once it lands, but never
  // shows a spinner in between; the old content just stays put for that
  // brief moment instead of being replaced by a loading state.
  function registrationStatusCard(profile, token, initialData, onRegistered) {
    var card = el('div', 'rc-panel rc-regstatus-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Registration Status'));
    var body = el('div', 'rc-regstatus-body');
    card.appendChild(body);

    // status, not role -- Role is set to 'Driver' at registration time
    // and never actually reads 'Prospect' (Prospect is a Status concept,
    // PendingApproval/PendingVerification, not a Role -- see Auth.gs).
    // Fixed 2026-09-13 alongside letting Prospects log in at all (Matt's
    // call: verified-but-not-yet-approved accounts can reach the
    // dashboard now, they just can't register for a season yet).
    if (profile.status !== 'Active') {
      body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'Registration opens once your account is approved.'));
      return card;
    }

    function renderUnregistered() {
      body.innerHTML = '';
      var row = el('div', 'rc-regstatus-row');
      row.appendChild(el('div', 'rc-regstatus-icon rc-regstatus-icon-none', '&#10005;'));
      var text = el('div');
      text.appendChild(el('div', 'rc-regstatus-headline rc-regstatus-headline-none', 'UNREGISTERED'));
      text.appendChild(el('div', 'rc-regstatus-sub', 'No season is currently open for registration.'));
      row.appendChild(text);
      body.appendChild(row);
    }

    // Season Full (2026-09-07, Matt's call: registration should stay open
    // "until there are no more seats left to pick from" -- this is the
    // other half of that: once they ARE gone, say so plainly instead of
    // still inviting an unregistered driver to click in and discover every
    // team card already disabled. Not clickable -- there's genuinely
    // nothing to pick.
    function renderSeasonFull(data) {
      body.innerHTML = '';
      var row = el('div', 'rc-regstatus-row');
      row.appendChild(el('div', 'rc-regstatus-icon rc-regstatus-icon-none', '&#10005;'));
      var text = el('div');
      var fullSeasonNum = seasonNumberLabel(data.seasonId);
      var fullSeasonLabel = fullSeasonNum ? ('SEASON ' + fullSeasonNum) : 'SEASON';
      text.appendChild(el('div', 'rc-regstatus-headline rc-regstatus-headline-none', escapeHtml(fullSeasonLabel) + ' FULL'));
      text.appendChild(el('div', 'rc-regstatus-sub', 'Every seat is taken -- check back if a spot opens up.'));
      row.appendChild(text);
      body.appendChild(row);
    }

    function renderOpenToRegister(data) {
      body.innerHTML = '';
      var row = el('div', 'rc-regstatus-row rc-regstatus-row-clickable');
      row.appendChild(el('div', 'rc-regstatus-icon rc-regstatus-icon-open', '+'));
      var text = el('div');
      var openSeasonNum = seasonNumberLabel(data.seasonId);
      var openSeasonLabel = openSeasonNum ? ('SEASON ' + openSeasonNum) : 'SEASON';
      text.appendChild(el('div', 'rc-regstatus-headline rc-regstatus-headline-open', 'REGISTER FOR ' + escapeHtml(openSeasonLabel)));
      // Seats-remaining count (2026-09-07) -- only shown once it's
      // gotten low enough to matter (Matt's call is about the "no more
      // seats" edge, not turning this into a running counter from day
      // one of the season).
      var subLine = 'Click to choose your car and lock in your seat.';
      if (typeof data.seatsRemaining === 'number' && data.seatsRemaining <= 5) {
        subLine += ' Only ' + data.seatsRemaining + ' seat' + (data.seatsRemaining === 1 ? '' : 's') + ' left.';
      }
      text.appendChild(el('div', 'rc-regstatus-sub', subLine));
      row.appendChild(text);
      body.appendChild(row);
      row.addEventListener('click', function () {
        buildRegistrationModal(profile, token, data, function () {
          refreshStatus();
          if (onRegistered) onRegistered();
        });
      });
    }

    function renderRegistered(data) {
      body.innerHTML = '';
      var row = el('div', 'rc-regstatus-row');
      row.appendChild(el('div', 'rc-regstatus-icon rc-regstatus-icon-done', '&#10003;'));
      var text = el('div');
      // Just "REGISTERED FOR SEASON n" now (2026-09-01, Matt's call) --
      // dropped the season name, which was redundant with the season
      // number right next to it.
      var regSeasonNum = seasonNumberLabel(data.seasonId);
      var regSeasonLabel = regSeasonNum ? ('SEASON ' + regSeasonNum) : 'SEASON';
      text.appendChild(el('div', 'rc-regstatus-headline rc-regstatus-headline-done', 'REGISTERED FOR ' + escapeHtml(regSeasonLabel)));
      text.appendChild(el('div', 'rc-regstatus-sub', 'Your registration is complete.'));
      row.appendChild(text);
      body.appendChild(row);

      var reg = data.registration || {};

      // Yellow/red status flag (2026-09-08, Matt's call) -- only shown
      // when this driver's Registration Status for the active season is
      // actually Probation or Suspended/Removed; the ordinary Active case
      // (the vast majority of the time) renders nothing here at all, same
      // "REGISTERED FOR SEASON n" card as before. Makes this card more
      // than just an "I signed up" confirmation once something real is
      // going on with a driver's standing.
      if (reg.status === 'Probation') {
        var flagP = el('div', 'rc-regstatus-flag rc-regstatus-flag-probation');
        flagP.appendChild(el('div', 'rc-regstatus-flag-dot rc-regstatus-flag-dot-probation'));
        var flagPText = el('div');
        flagPText.appendChild(el('div', 'rc-regstatus-flag-label rc-regstatus-flag-label-probation', 'PROBATION'));
        if (reg.statusReason) flagPText.appendChild(el('div', 'rc-regstatus-flag-reason', escapeHtml(reg.statusReason)));
        flagP.appendChild(flagPText);
        body.appendChild(flagP);
      } else if (reg.status === 'Suspended' || reg.status === 'Removed') {
        var flagS = el('div', 'rc-regstatus-flag rc-regstatus-flag-suspended');
        flagS.appendChild(el('div', 'rc-regstatus-flag-dot rc-regstatus-flag-dot-suspended'));
        var flagSText = el('div');
        flagSText.appendChild(el('div', 'rc-regstatus-flag-label rc-regstatus-flag-label-suspended', reg.status === 'Removed' ? 'REMOVED FROM LEAGUE' : 'SUSPENDED'));
        if (reg.statusReason) flagSText.appendChild(el('div', 'rc-regstatus-flag-reason', escapeHtml(reg.statusReason)));
        flagS.appendChild(flagSText);
        body.appendChild(flagS);
      }

      var footer = el('div', 'rc-regstatus-footer');
      var joinedDate = reg.joinedAt ? formatDateLabel(String(reg.joinedAt).slice(0, 10)) : '—';
      var joinedStat = el('div', 'rc-regstatus-stat');
      joinedStat.appendChild(el('div', 'rc-regstatus-stat-label', 'Registered On'));
      joinedStat.appendChild(el('div', 'rc-regstatus-stat-value', escapeHtml(joinedDate)));
      footer.appendChild(joinedStat);

      // Class shown as plain text again (2026-09-19, Matt's call: "remove
      // the pill class design from the REGISTRATION STATUS card and leave
      // the class as text") -- reverts the 2026-09-19 pill treatment above;
      // every other stat on this footer (Registered On, etc.) is plain
      // text too, so this now matches its own row instead of standing out.
      var classStat = el('div', 'rc-regstatus-stat');
      classStat.appendChild(el('div', 'rc-regstatus-stat-label', 'Class'));
      var classValue = el('div', 'rc-regstatus-stat-value', escapeHtml(reg.carClass || '—'));
      classStat.appendChild(classValue);
      footer.appendChild(classStat);

      body.appendChild(footer);
    }

    // "Couldn't check" is NOT the same thing as "checked, and there's
    // genuinely nothing open" (2026-09-14 fix, Matt's report: "the
    // dashboard sometimes returns 'no season is currently open for
    // registration' when there actually is"). Before this, data.success
    // being false -- which happens whenever the fetch itself failed, timed
    // out, or the server-side lookup threw -- was folded into the exact
    // same branch as a real "success:true, hasActiveSeason:false" answer,
    // so a driver had no way to tell a transient hiccup apart from an
    // actual answer. This state is deliberately non-alarming (a season IS
    // probably open) and self-heals once via refreshStatus() below rather
    // than asking the driver to do anything.
    function renderLoadError() {
      body.innerHTML = '';
      var row = el('div', 'rc-regstatus-row');
      row.appendChild(el('div', 'rc-regstatus-icon rc-regstatus-icon-none', '&#8635;'));
      var text = el('div');
      text.appendChild(el('div', 'rc-regstatus-headline rc-regstatus-headline-none', 'CHECKING...'));
      text.appendChild(el('div', 'rc-regstatus-sub', 'Could not reach the server just now -- trying again.'));
      row.appendChild(text);
      body.appendChild(row);
    }

    var didRetryLoad = false;
    function renderFromData(data) {
      if (!data || !data.success) {
        renderLoadError();
        // One silent, automatic retry (not a loop -- didRetryLoad only
        // ever lets this fire once per page view) so the common case, a
        // single bad round trip, resolves itself without the driver
        // needing to notice anything or refresh the page by hand.
        if (!didRetryLoad) {
          didRetryLoad = true;
          setTimeout(refreshStatus, 2500);
        }
        return;
      }
      if (!data.hasActiveSeason) { renderUnregistered(); return; }
      if (data.registered) { renderRegistered(data); return; }
      if (data.seasonFull) { renderSeasonFull(data); return; }
      renderOpenToRegister(data);
    }

    // Quiet re-check after a registration completes (or after a load
    // failure above) -- no spinner, the card's current content stays
    // exactly as-is until the new data actually arrives, then swaps in one
    // shot. Routed through renderFromData on failure too now (rather than
    // straight to renderUnregistered) so a retry that ALSO fails still
    // reads as "couldn't check," not as a false "nothing open."
    function refreshStatus() {
      fetchApi('getActiveSeason', { token: token }).then(renderFromData).catch(function () { renderFromData({ success: false }); });
    }

    renderFromData(initialData);
    return card;
  }

  // Manufacturer logo left, team/car identity + class pill next to it,
  // Position/Points/Podiums stat row underneath. Sourced from data the
  // page already prefetched in parallel with the profile (see the bottom
  // of this script) -- like Registration Status, this card never fetches
  // or spinners on its own (Matt's call: "no loaders in any of the cards,
  // ever"). handleGetMyCurrentSeat (DataCache.gs) prefers the richest
  // source available: the most recent SeasonHistory.CurrentSeat JSON
  // blob (real season stats, written after each round's results are
  // ingested) and falls back to the live Registrations/Teams/Cars rows
  // -- with blank stats -- for a driver who just locked in a seat before
  // any round has run yet. No car photo -- unlike the reference mockup,
  // there's no car-render asset in this project, logo + text only.
  function currentSeatCard(profile, token, initialData) {
    var card = el('div', 'rc-panel rc-currentseat-card rc-dash-card');
    // Title + car number share one flex row now (2026-09-01, Matt's call:
    // the car number needs to be ON the same row as the header, not
    // absolutely positioned over the card -- that approach kept
    // conflicting with .rc-dash-card > *'s own position rule and/or
    // ending up nested too deep to line up right). A genuine flex row is
    // more robust than fighting the cascade with specificity tricks.
    var headerRow = el('div', 'rc-dash-card-header-row');
    headerRow.appendChild(el('h3', 'rc-dash-card-header-title', 'Current Seat'));
    card.appendChild(headerRow);
    var body = el('div', 'rc-cs-body');
    card.appendChild(body);

    // Adds/replaces/removes the car-number figure in the header row --
    // called from every render path below so it's never stale (e.g. still
    // showing a car number after switching to the "not on a team" empty
    // state). carClass (added 2026-09-19, Matt's ask: "put a class pill
    // before the number of the car") prepends a small colored, abbreviated
    // class pill (HY/GT3/P3/P2) right before the "#n" text, reusing the
    // same class color tokens as everywhere else on the site.
    function setCornerNumber(text, carClass) {
      var existing = headerRow.querySelector('.rc-dash-card-corner-figure');
      if (existing) existing.remove();
      if (!text) return;
      var figure = el('div', 'rc-dash-card-corner-figure');
      if (carClass) figure.appendChild(_rcClassAbbrevPill(carClass));
      figure.appendChild(document.createTextNode(text));
      headerRow.appendChild(figure);
    }

    // status, not role -- Role is set to 'Driver' at registration time
    // and never actually reads 'Prospect' (Prospect is a Status concept,
    // PendingApproval/PendingVerification, not a Role -- see Auth.gs).
    // Fixed 2026-09-13 alongside letting Prospects log in at all (Matt's
    // call: verified-but-not-yet-approved accounts can reach the
    // dashboard now, they just can't register for a season yet).
    if (profile.status !== 'Active') {
      body.appendChild(el('p', 'rc-cs-empty', 'Available once your account is approved.'));
      return card;
    }

    function renderEmpty(message) {
      body.innerHTML = '';
      body.appendChild(el('p', 'rc-cs-empty', message));
      setCornerNumber('');
    }

    function renderSeat(data) {
      body.innerHTML = '';

      // Car number, top-right corner of the card header (2026-09-01,
      // Matt's call) -- replaces the old "#n Manufacturer Model" text
      // line below, which also drops the manufacturer name entirely
      // (Matt's call, same request) -- the manufacturer logo image
      // still shows, just not its name spelled out in text too.
      setCornerNumber('#' + (data.carNumber || '?'), data.carClass);

      var row = el('div', 'rc-cs-row');

      if (data.manufacturer && typeof manufacturerLogoSrc === 'function') {
        // Wrapped in rc-cs-logo-wrap (2026-09-02, Matt's call: "minimum
        // width of the manufacturer logo... 60px -- if the graphic is
        // less than 60px wide, add padding to each side") -- a narrow/
        // tall logo scaled down to the 50px height cap can render well
        // under 60px wide on its own; the wrap's min-width + centering is
        // what actually adds the padding, rather than trying to pad the
        // <img> itself (object-fit: contain wouldn't add visible padding,
        // just letterbox inside whatever box the img itself is given).
        var logoWrap = el('div', 'rc-cs-logo-wrap');
        var logo = document.createElement('img');
        logo.className = 'rc-cs-logo';
        logo.src = manufacturerLogoSrc(data.manufacturer);
        logo.alt = data.manufacturer;
        logo.onerror = function () { logoWrap.style.display = 'none'; };
        logoWrap.appendChild(logo);
        row.appendChild(logoWrap);
      }

      var textCol = el('div');
      textCol.appendChild(el('div', 'rc-cs-team-name', escapeHtml(data.team || 'Unnamed Team')));
      var carLine = data.carModel || '';
      if (carLine) textCol.appendChild(el('div', 'rc-cs-car-line', escapeHtml(carLine)));
      // Full-name class pill (e.g. "Hypercar") under the car model removed
      // entirely 2026-09-19 (Matt's call: "remove hypercar from below car
      // in current seat card") -- the abbreviated, colored class pill in
      // the card's top-right corner (setCornerNumber/_rcClassAbbrevPill,
      // above) already says the same thing, so this was pure duplication.
      row.appendChild(textCol);
      body.appendChild(row);

      var stats = el('div', 'rc-cs-stats');
      var posValue = (data.statsKnown && data.position) ? (String(data.position) + (data.positionOutOf ? '/' + data.positionOutOf : '')) : '—';
      var pointsValue = data.statsKnown ? String(data.points || 0) : '—';
      var podiumsValue = data.statsKnown ? String(data.podiums || 0) : '—';
      [['Position', posValue], ['Points', pointsValue], ['Podiums', podiumsValue]].forEach(function (pair) {
        var stat = el('div', 'rc-cs-stat');
        stat.appendChild(el('div', 'rc-cs-stat-label', pair[0]));
        stat.appendChild(el('div', 'rc-cs-stat-value', escapeHtml(pair[1])));
        stats.appendChild(stat);
      });
      body.appendChild(stats);
    }

    // Quiet re-check after a registration completes (wired from
    // renderDashboardSection into Registration Status's onRegistered
    // callback) -- no spinner, current content stays put until the new
    // data actually arrives, then swaps in one shot. Stashed directly on
    // the card element since this function's only return value is the
    // element itself.
    card.rcRefresh = function () {
      fetchApi('getMyCurrentSeat', { token: token }).then(function (data) {
        if (!data || !data.success || !data.hasSeat) { renderEmpty('Not on a team yet -- register for a season to lock in a seat.'); return; }
        renderSeat(data);
      }).catch(function () { /* leave whatever was already shown */ });
    };

    if (!initialData || !initialData.success || !initialData.hasSeat) {
      renderEmpty('Not on a team yet -- register for a season to lock in a seat.');
    } else {
      renderSeat(initialData);
    }

    return card;
  }

  // Generic wrapper that turns any "sync data -> card" builder (one that
  // takes (data, activeSeasonData) and returns a fully-built card element,
  // like nextRaceCard/protestCard below) into a card that fetches
  // its own data and fades into place once it lands -- 2026-09-03, Matt's
  // ask: "would it work the same if all cards did that on the
  // dashboard... limited to like 3 of the most important cards and let
  // the rest organically load after and fade into existence."
  //
  // Returns a placeholder card immediately, already carrying the real
  // card's own classes (so it takes up the exact same grid slot, same
  // size, from the very first paint) plus .rc-dash-card-fade (invisible).
  // Once fetchPromise resolves (or fails), the real card is built via
  // buildFn(data, activeSeasonData) and its children are moved (not
  // cloned -- keeps any event listeners intact) into the placeholder,
  // which then gets .rc-dash-card-fade-in added to fade to fully opaque.
  // If the fetch was already fast/instant, this reads as no visible fade
  // at all (the class flip lands before the placeholder's first paint) --
  // only a genuinely slow card visibly fades in, which is exactly the
  // point: nothing is EVER artificially delayed for the animation's sake.
  // activeSeasonData may be an already-resolved value OR a promise --
  // Promise.resolve() wraps a plain value as a genuine (already-settled)
  // promise, so the same Promise.all works either way (2026-09-03: now
  // needed since the priority-batch rewrite hands this a still-in-flight
  // getActiveSeason promise instead of a pre-resolved value).
  function asyncDashCard(cardClass, fetchPromise, buildFn, activeSeasonData) {
    var placeholder = el('div', cardClass + ' rc-dash-card-fade');
    Promise.all([
      fetchPromise.catch(function () { return { success: false }; }),
      Promise.resolve(activeSeasonData).catch(function () { return { success: false }; })
    ]).then(function (results) {
      var built;
      try {
        built = buildFn(results[0], results[1]);
      } catch (err) {
        // A card's own render function throwing on some unexpected data
        // shape used to leave this placeholder permanently blank -- no
        // fade-in, no message, nothing (2026-09-14 fix, same report as the
        // registrationStatusCard change above: "the dashboard sometimes
        // never loads anything"). Every OTHER promise in this chain was
        // already defensively .catch()-guarded; the actual card-building
        // step was the one place that wasn't. Logs to the console for
        // debugging rather than failing completely silently.
        if (window.console && console.error) console.error('Dashboard card failed to render:', err);
        built = el('div');
        built.appendChild(el('p', 'rc-cs-empty', 'Could not load this right now.'));
      }
      while (built.firstChild) placeholder.appendChild(built.firstChild);
      placeholder.classList.add('rc-dash-card-fade-in');
    });
    return placeholder;
  }

  // Full-width "quick glance" banner, backed by action=getNextRace
  // (handleGetNextRace, DataCache.gs) -- reuses the exact same merged
  // round/special/bye entries the Calendar page computes, so this can
  // never show a different "next race" than Calendar would (Matt's call).
  // Like every other Dashboard card, this never fetches or spinners on
  // its own, first paint or otherwise -- rendered straight from data the
  // page already prefetched in parallel with the profile. Reuses the same
  // JSON shape/fields the Calendar's raceCard() already works with
  // (eventName/track/layout/startUtc/trackId/roundNum) rather than
  // inventing a second one, and the same trackImageSrc() convention for
  // the track image (assets/images/tracks/{TrackID}.png, silently hidden if
  // missing) -- no live location/country data exists on Tracks yet, so
  // (unlike the WEC reference mockup) there's no flag/location line here.
  //
  // Matt's call (2026-08-30): this card stays gated behind registration,
  // same as Current Seat -- a driver who hasn't joined the open season
  // gets the same "Not on a team yet" nudge rather than seeing the
  // schedule for a season they're not part of. Gated client-side off
  // activeSeasonData (the same getActiveSeason payload Registration
  // Status already renders from) rather than a second server-side check,
  // since getNextRace's schedule data isn't otherwise driver-specific.
  function nextRaceCard(data, activeSeasonData) {
    var card = el('div', 'rc-panel rc-nextrace-card rc-dash-card');
    // Title + "Round n" share one flex row now (2026-09-01, Matt's call) --
    // same .rc-dash-card-header-row treatment as Current Seat's car
    // number, more robust than the earlier absolute-positioning attempt.
    var headerRow = el('div', 'rc-dash-card-header-row');
    headerRow.appendChild(el('h3', 'rc-dash-card-header-title', 'Next Race'));
    card.appendChild(headerRow);

    var registered = !!(activeSeasonData && activeSeasonData.success && activeSeasonData.hasActiveSeason && activeSeasonData.registered);
    if (!registered) {
      card.appendChild(el('p', 'rc-cs-empty', 'Not on a team yet -- register for a season to view the next race.'));
      return card;
    }

    if (!data || !data.success) {
      card.appendChild(el('p', 'rc-cs-empty', 'Could not load the next race right now.'));
      return card;
    }
    if (!data.hasNextRace) {
      card.appendChild(el('p', 'rc-cs-empty', 'No season currently open, or the schedule has already finished.'));
      return card;
    }

    var driverTz = '';
    try { driverTz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (err) { driverTz = ''; }

    var isSpecial = data.kind === 'special';

    // "Round n", right side of the header row, same treatment as Current
    // Seat's car number (2026-09-01, Matt's call). Special Events don't
    // consume a round number, so they don't get this either -- same rule
    // the Calendar page's own round-number column follows.
    if (!isSpecial && data.roundNum) {
      // "ROUND n OF total" (2026-09-02, Matt's call) -- totalRounds comes
      // straight off _rcBuildActiveSeasonCalendar_'s own rounds.length
      // (DataCache.gs), the same season the round number itself is drawn
      // from, so this can never disagree with the Calendar page's own
      // round count. Falls back to the bare "ROUND n" if a season somehow
      // has no totalRounds figure (defensive only -- shouldn't happen).
      var roundLabel = 'ROUND ' + data.roundNum + (data.totalRounds ? (' OF ' + data.totalRounds) : '');
      headerRow.appendChild(el('div', 'rc-dash-card-corner-figure', roundLabel));
    }

    var body = el('div', 'rc-nextrace-body');

    // Left-justified info column (Event title, then Track/Layout, then the
    // rest), track image to the right, vertically centered against the
    // whole text block (2026-08-30, Matt's call) -- .rc-nextrace-body
    // centers this row's cross-axis so the image lines up regardless of
    // how tall the text column ends up.
    var info = el('div', 'rc-nextrace-info');
    // Date/time as a plain line above the event title, not a pill
    // (2026-08-31, Matt's call: "move the date out of a pill and put it
    // above the event title") -- was one of the .rc-cal-stats chips below
    // the title; that row now carries Weather, Race Length, In-Game Race
    // Start, and the server password.
    info.appendChild(el('div', 'rc-nextrace-date', escapeHtml(formatRaceDateTime(data.startUtc, driverTz))));
    var nameWrap = el('div', 'rc-nextrace-name');
    // Just the event name now -- "Round n" moved to the card's top-right
    // corner instead (2026-09-01, Matt's call: "do the same to Round n
    // for Next Race card -- move it to the top right of the card and
    // give it the same styling as the car number"), see the corner
    // figure appended to the card header below.
    var nameText = data.eventName || (isSpecial ? 'Special Event' : ('Round ' + data.roundNum));
    nameWrap.appendChild(document.createTextNode(nameText));
    // Space before the star (2026-09-13, Matt's call) -- .rc-nextrace-name
    // isn't a flex row with its own gap the way Calendar's .rc-cal-race-name
    // is, so the plain text node and the star span were sitting flush
    // against each other with nothing between them.
    if (isSpecial) nameWrap.appendChild(document.createTextNode(' '));
    if (isSpecial) nameWrap.appendChild(withTooltip(el('span', 'rc-cal-race-star', ICON_NAV_STAR), 'Special Event -- fun race, no championship points.'));
    info.appendChild(nameWrap);

    // Same track-name/layout text treatment as the Calendar page's own
    // .rc-cal-track (bold track name, layout trailing in lighter steel
    // text with an em dash) -- 2026-08-31, Matt's call: read the same way
    // in both places instead of this card's own plain, unbolded line.
    var trackLine = el('div', 'rc-nextrace-track');
    trackLine.innerHTML = '<strong>' + escapeHtml(data.track || '(no track)') + '</strong>' +
      (data.layout ? ' <span class="rc-cal-layout">· ' + escapeHtml(data.layout) + '</span>' : '');
    info.appendChild(trackLine);

    var stats = el('div', 'rc-cal-stats');
    // Weather pill (2026-08-31, Matt's call) -- same chip the Calendar
    // page's own race cards use (weatherIcon() + "N% Rain · N°C").
    stats.appendChild(calStat(weatherIcon(data), (data.chanceOfRain || 0) + '% Rain' + (data.temperatureC !== null && data.temperatureC !== undefined ? ' · ' + data.temperatureC + '°C' : ''), 'Weather'));
    // Race length in minutes (2026-09-19, replaces the Sprint/Medium/Long
    // tier label -- Matt's call: "instead of labeling race length with
    // sprint medium or long, display length in mins").
    if (data.raceLengthMinutes) stats.appendChild(calStat(ICON_CLOCK, data.raceLengthMinutes + ' min', 'Race length'));
    // In-Game Race Start, as its own gray pill next to Race Length
    // (2026-09-01, Matt's call) -- replaces the earlier flag-icon line
    // version, and drops Practice/Qualifying entirely (Calendar's own
    // race cards still show all three -- just this card that trims down
    // to Race Start only).
    if (data.igRaceStart) stats.appendChild(calStat(ICON_FLAG, 'In-Game ' + data.igRaceStart, 'In-game race start time'));
    // Server password pill (added 2026-09-19, Matt's ask: "add password
    // pill to next race in account") -- the password a driver needs to
    // actually join the server, same round-override-or-season-default
    // value handleGetNextRace resolves server-side. Shows "Password Set"
    // rather than the password itself, revealed on hover via the tooltip
    // (2026-09-19 follow-up, Matt's call) -- same pattern the Calendar
    // page's own season-details password stat already uses.
    if (data.password) stats.appendChild(calStat(ICON_LOCK, 'Password Set', 'Server password: ' + data.password));
    info.appendChild(stats);

    // Round X of Y pill removed (2026-09-01, Matt's call) -- Special
    // Event's gold pill stays, since that one's flagging something the
    // round count alone doesn't say (no championship points).
    if (isSpecial) {
      info.appendChild(el('span', 'rc-nextrace-pill rc-nextrace-pill-gold', 'SPECIAL EVENT'));
    }
    body.appendChild(info);

    // Silently omitted if the track has no image on disk -- same onerror
    // pattern used everywhere else on the site (Matt: "if one doesn't
    // exist let it silently not show anything").
    if (data.trackId) {
      var trackImg = document.createElement('img');
      trackImg.className = 'rc-nextrace-track-img';
      trackImg.src = trackImageSrc(data.trackId);
      trackImg.alt = data.track || '';
      trackImg.onerror = function () { trackImg.style.display = 'none'; };
      body.appendChild(trackImg);
    }

    card.appendChild(body);

    // Link to the full Calendar page (2026-08-30, Matt's call) -- same
    // "show the section, then fetch it" pair the Calendar nav button
    // itself uses (see buildSidebarNav above), just reachable from this
    // card too instead of only the sidebar.
    var viewSeasonBtn = el('button', 'rc-link-btn rc-dash-card-link', '← View full season');
    viewSeasonBtn.type = 'button';
    viewSeasonBtn.addEventListener('click', function () {
      showLazySection('calendar', currentToken);
    });
    card.appendChild(viewSeasonBtn);

    return card;
  }

  // ---------------------------------------------------------------------
  // CAREER PAGE (2026-09-13, Matt's spec: "a complete history of the
  // driver's season by season record... kept in numerical order (newest
  // season on top)... arrange them so it feels like you're looking at a
  // CAREER CARD vs. a wall of data"). Backed by handleGetMyCareerHistory
  // (DataCache.gs), which already returns everything pre-aggregated,
  // newest season first -- this function only has to render it.
  // ---------------------------------------------------------------------
  function renderCareerSection(token) {
    var section = document.getElementById('rc-section-career');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(buildPageSpinner('Loading your career...'));

    return fetchApi('getMyCareerHistory', { token: token }).catch(function () { return { success: false }; })
      .then(function (result) {
        section.innerHTML = '';
        section.appendChild(el('h2', 'margin-top:0;', 'Career'));
        // Explainer paragraph removed (2026-09-18, Matt's call) -- see
        // renderHelpSection's Career entry instead.

        if (!result || !result.success || !result.seasons || !result.seasons.length) {
          section.appendChild(buildEmptyStatePanel('No Data To Display', 'Your first Career card appears here once you\'ve registered for a season.'));
          return;
        }

        var list = el('div', 'rc-career-list');
        result.seasons.forEach(function (s) { list.appendChild(buildCareerCard(s, token)); });
        section.appendChild(list);
      });
  }

  // One season's "career card." Keeps the numbers-first hero row up top
  // (rank/points/wins/podiums -- the things a driver actually brags
  // about), then groups everything else into small labeled clusters
  // rather than one long stat list, so the card reads as a handful of
  // digestible chunks instead of a wall of numbers.
  function buildCareerCard(s, token) {
    var card = el('div', 'rc-career-card' + (s.statsKnown ? '' : ' rc-career-card-noStats'));

    // --- Header: season number/name, date range, status pills ---------
    var head = el('div', 'rc-career-card-head');
    var title = el('div', 'rc-career-card-title');
    title.appendChild(el('div', 'rc-career-season-num', escapeHtml(seasonNumberLabel(s.seasonId) || '?')));
    var titleText = el('div');
    titleText.appendChild(el('h3', null, escapeHtml(s.seasonName || s.seasonId)));
    var dateRange = (s.startDate || s.endDate)
      ? [s.startDate, s.endDate].filter(Boolean).map(function (d) {
        var dt = new Date(d);
        return isNaN(dt.getTime()) ? d : dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      }).join(' - ')
      : 'No races run yet';
    titleText.appendChild(el('div', 'rc-career-card-dates', escapeHtml(dateRange)));
    title.appendChild(titleText);
    head.appendChild(title);

    var badges = el('div', 'rc-career-card-badges');
    badges.appendChild(_rcSeasonStatusBadge(s.seasonStatus));
    // Registration-status pill -- only Probation/Suspended/Removed ever
    // show here; a clean Active registration says nothing extra (same
    // "only flag it when it's not fine" convention as the Dashboard's own
    // Registration Status card, see .rc-regstatus-flag above).
    if (s.registrationStatus && s.registrationStatus !== 'Active') {
      var regKey = String(s.registrationStatus).toLowerCase();
      badges.appendChild(el('span', 'rc-badge-chip rc-badge-regstatus-' + regKey, escapeHtml(s.registrationStatus)));
    }
    head.appendChild(badges);
    card.appendChild(head);

    if (!s.statsKnown) {
      var body0 = el('div', 'rc-career-card-body');
      var teamLine = [s.teamName, [s.manufacturer, s.carModel].filter(Boolean).join(' '), s.class]
        .filter(Boolean).join(' &middot; ');
      if (teamLine) body0.appendChild(el('p', 'rc-career-line', teamLine));
      body0.appendChild(el('p', 'rc-career-empty-note', 'No round results have been recorded for this season yet.'));
      card.appendChild(body0);
      return card;
    }

    // --- Hero row: the headline numbers -------------------------------
    var hero = el('div', 'rc-career-hero');
    hero.appendChild(buildCareerStat(
      s.finalRank ? (ordinal(s.finalRank) + (s.finalRankOutOf ? ' / ' + s.finalRankOutOf : '')) : '--',
      'Class Standing'));
    hero.appendChild(buildCareerStat(Number(s.finalPoints || 0).toLocaleString(), 'Points'));
    hero.appendChild(buildCareerStat(s.wins || 0, 'Wins'));
    hero.appendChild(buildCareerStat(s.podiums || 0, 'Podiums'));
    card.appendChild(hero);

    var body = el('div', 'rc-career-card-body');

    // --- Team & Car ------------------------------------------------------
    var teamGroup = el('div');
    teamGroup.appendChild(el('div', 'rc-career-group-title', 'Team &amp; Car'));
    var carLine = [s.manufacturer, s.carModel].filter(Boolean).join(' ') + (s.carNumber ? ' #' + escapeHtml(s.carNumber) : '');
    teamGroup.appendChild(el('p', 'rc-career-line',
      '<strong>Team:</strong> ' + escapeHtml(s.teamName || '--') +
      ' &nbsp; <strong>Car:</strong> ' + (carLine.trim() || '--') +
      ' &nbsp; <strong>Class:</strong> ' + escapeHtml(s.class || '--')));
    body.appendChild(teamGroup);

    // --- Race Record ------------------------------------------------------
    var raceGroup = el('div');
    raceGroup.appendChild(el('div', 'rc-career-group-title', 'Race Record'));
    var raceGrid = el('div', 'rc-career-stat-grid');
    raceGrid.appendChild(buildCareerStat(s.racesStarted || 0, 'Started'));
    raceGrid.appendChild(buildCareerStat(s.poles || 0, 'Poles'));
    raceGrid.appendChild(buildCareerStat(s.fastestLaps || 0, 'Fastest Laps'));
    raceGrid.appendChild(buildCareerStat(s.cleanRaces || 0, 'Clean Races'));
    raceGrid.appendChild(buildCareerStat(s.dnfs || 0, 'DNFs'));
    raceGrid.appendChild(buildCareerStat((s.avgFinish != null) ? s.avgFinish.toFixed(1) : '--', 'Avg. Finish'));
    raceGroup.appendChild(raceGrid);
    body.appendChild(raceGroup);

    // --- Discipline ------------------------------------------------------
    // Finances/Sponsors/Car Objective/Wagers groups removed (V1 scope cut,
    // 2026-09-18) -- the fields they read (seasonNetEarnings,
    // seasonEndingBalance, largestWin, sponsorBonusTotal/PenaltyTotal,
    // sponsors, objectiveName/objectiveBonus/objectiveMet, wagerWins/
    // Losses/Earnings) no longer come back from handleGetMyCareerHistory.
    var incidents = (s.statusHistory || []).slice().reverse();
    if (incidents.length || s.penaltyCount) {
      var discGroup = el('div');
      discGroup.appendChild(el('div', 'rc-career-group-title', 'Discipline'));
      if (s.penaltyCount) {
        // Fines removed from Protests (V1 scope cut) -- only the upheld
        // count is shown now, no dollar amount.
        discGroup.appendChild(el('p', 'rc-career-line', '<strong>Upheld Protests:</strong> ' + s.penaltyCount));
      }
      incidents.forEach(function (h) {
        var when = h.at ? new Date(h.at) : null;
        var whenStr = (when && !isNaN(when.getTime())) ? when.toLocaleDateString() : '';
        var line = el('div', 'rc-career-incident',
          escapeHtml(h.status || '') + (h.reason ? ' -- ' + escapeHtml(h.reason) : ''));
        if (whenStr) line.appendChild(el('span', 'rc-career-incident-date', whenStr));
        discGroup.appendChild(line);
      });
      body.appendChild(discGroup);
    }

    // --- Races (2026-09-19) -- full per-race lap+event detail, one
    // container per race, for PAST seasons only -- Matt's split: the
    // Results page already covers the CURRENT season in full, so a
    // driver's currently-underway season just points them there instead
    // of duplicating the same fetch here. Lazy-loaded on click
    // (handleGetCareerSeasonRaceDetail, DataCache.gs) so a driver with
    // many seasons of history doesn't pay for every one of them on the
    // Career page's initial load -- only the season actually expanded
    // ever fetches its races.
    if (s.seasonStatus === 'Registration') {
      var currentNote = el('div');
      currentNote.appendChild(el('div', 'rc-career-group-title', 'Races'));
      currentNote.appendChild(el('p', 'rc-career-empty-note', 'This season is still underway -- full race-by-race detail is on the Results page.'));
      body.appendChild(currentNote);
    } else {
      var racesGroup = el('div');
      racesGroup.appendChild(el('div', 'rc-career-group-title', 'Races'));
      var racesBody = el('div', 'rc-career-races-body');
      racesBody.style.display = 'none';
      var toggleBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'View Race Details');
      toggleBtn.type = 'button';
      var racesLoaded = false;
      toggleBtn.addEventListener('click', function () {
        if (racesBody.style.display === 'block') {
          racesBody.style.display = 'none';
          toggleBtn.textContent = 'View Race Details';
          return;
        }
        racesBody.style.display = 'block';
        toggleBtn.textContent = 'Hide Race Details';
        if (racesLoaded) return;
        racesLoaded = true;
        racesBody.appendChild(buildSpinner('Loading races...'));
        fetchApi('getCareerSeasonRaceDetail', { token: token, seasonId: s.seasonId }).then(function (result) {
          racesBody.innerHTML = '';
          if (!result || !result.success || !result.rounds || !result.rounds.length) {
            racesBody.appendChild(el('p', 'rc-career-empty-note', 'No race results recorded for this season.'));
            return;
          }
          var list = el('div', 'rc-results-round-list');
          result.rounds.slice().sort(function (a, b) {
            var at = a.startUtc ? new Date(a.startUtc).getTime() : 0;
            var bt = b.startUtc ? new Date(b.startUtc).getTime() : 0;
            return bt - at;
          }).forEach(function (race) { list.appendChild(resultsRoundPanel(race)); });
          racesBody.appendChild(list);
        }).catch(function () {
          racesBody.innerHTML = '';
          racesBody.appendChild(el('p', 'rc-career-empty-note', 'Could not load races right now.'));
        });
      });
      racesGroup.appendChild(toggleBtn);
      racesGroup.appendChild(racesBody);
      body.appendChild(racesGroup);
    }

    card.appendChild(body);
    return card;
  }

  // Same tile shape as the Wager page's .rc-cs-stat -- reused rather than
  // reinvented so every "important number in a box" on the site looks
  // like the same component.
  function buildCareerStat(value, label) {
    var tile = el('div', 'rc-cs-stat');
    tile.appendChild(el('div', 'rc-cs-stat-value', String(value)));
    tile.appendChild(el('div', 'rc-cs-stat-label', escapeHtml(label)));
    return tile;
  }

  // Protest -- Dashboard preview card (2026-09-08, Matt's call: "the
  // PROTEST card shows the last 3 PROTESTS that the driver submitted and
  // whether they're Pending, Upheld or Denied... a link to the PROTEST
  // page at the bottom left like the other cards"). Backed by
  // action=getMyProtests with no `full`/`limit` param, which the server
