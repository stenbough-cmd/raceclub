<!--
  Race Club — Account.html  (v0.5.0, sidebar-only rebuild)

  WHY THIS REBUILD: the v0.4.0 file had grown to ~5,200 lines of real
  section content (Dashboard widgets, Calendar, Objectives, League
  Management's Season Creation Wizard, Admin's approval queue + user
  management, Data Management's Tracks/Cars/Drivers editors, Settings'
  edit-profile form) built against features and schema that have since
  moved out from under it (see login.html/register.html/verify.html's
  email-based-login rebuild). Rather than patch a page full of stale
  assumptions one section at a time, Matt's call was to strip it back to
  just the shell -- the black sidebar, its full set of links, the
  section-switching behavior, the auth gate, and the one truly essential
  piece of business logic (the forced password-change lock screen) -- and
  rebuild each section's real content one link at a time going forward.

  WHAT'S KEPT, EXACTLY AS BEFORE:
  - The full sidebar nav: the same 10 primary items (Dashboard / Calendar
    / Finances / Results / Career / Reputation / Objectives / Sponsors /
    Hall of Fame / Settings) in the same order, plus the same
    permission-gated items (League Management, Admin, Data Management)
    and the same Help / Settings / Log Out row at the bottom, all with
    their original icons.
  - showSection() section-switching, the mobile hamburger menu + scroll
    lock, the 30-minute inactivity auto-logout, the auth gate, and the
    "arrived via a fresh login vs. need a getProfile call" fast path --
    all unchanged in behavior.
  - The mustChangePassword forced password-change lock screen. This is
    the one section this pass did NOT hollow out: it's a security gate
    that runs before the sidebar even shows, not a link a driver clicks
    into, so it stays fully functional using the same passwordChangeSection()
    form as before.

  WHAT'S GONE (for now): every section's actual content. Each of the 14
  content sections now renders a single centered "Coming soon" placeholder
  panel (see renderPlaceholderSections()) instead of real data, widgets,
  or admin tooling. That includes the profile-edit form -- normal profile
  editing goes through that link same as any other, so it's empty too for
  now; only the change-password FORM ITSELF survives, because the
  forced-password lock screen depends on it directly.

  PREVIOUS PASS (header/notification redesign): passwordChangeSection()'s
  result ("Password updated"/"New password and confirmation don't
  match"/etc.) now goes through js/header.js's showToast() instead of its
  own inline status line, per Matt's sitewide toast-notifications call.
  Also fixed: buildFullProfileUI was gating League Management/Admin/Data
  Management visibility on a `profile.permissions` array that
  buildProfilePayload (Auth.gs) never actually sends -- those links could
  never have shown for anyone. Until a real roles/permissions system is
  designed, this now just checks `profile.role === 'Admin'` for all three
  (Admin is the only role with anything to manage right now anyway). Also
  fixed: both the fresh-login fast path and the getProfile fallback were
  handing the whole API response wrapper ({success, profile}) to
  renderProfile() instead of its nested .profile, so every field this page
  reads off `profile` (including .role, just fixed above) was silently
  reading undefined.

  THIS PASS (Help + Edit Profile become popups, not sections): the
  'settings' and 'help' entries are gone from PLACEHOLDER_LABELS and their
  <section> elements are gone from the HTML -- both are now popups
  (showModal(), reintroduced this pass, backed by the .rc-modal* CSS
  classes that survived the v0.5.0 rebuild even though the JS function
  that used them didn't). The sidebar's Edit Profile and Help buttons now
  call openEditProfileModal()/openHelpModal() directly instead of falling
  through to showSection(id) -- both need live profile/token data that
  doesn't exist yet at buildSidebarNav() time (same problem the Admin nav
  item already had), so this pass adds module-level currentProfile/
  currentToken vars, set once in buildFullProfileUI(), for those handlers
  to read at click-time. The now-pointless ?section= deep-link handling is
  gone too -- Edit Profile is a popup now, not a URL a header link can
  point at.

  openEditProfileModal() lets a driver edit Username / First Name / Last
  Name / Suffix / Email / Location / Time Zone, posts to the
  `updateOwnProfile` action (Auth.gs's handleUpdateOwnProfile, expanded
  this pass to accept exactly these fields), refreshes the cached profile
  and header on success, and embeds the existing passwordChangeSection()
  form underneath so Change Password lives in the same popup. DisplayName
  is still never directly editable -- it's computed server-side from
  First/Last/Suffix, same rule as registration.

  LATER PASS -- Help becomes an in-page section again, not a popup, not a
  standalone page. It was briefly help.html (its own page, so the
  Rulebook would have room to grow), but that page dropped the sidebar/
  nav chrome entirely -- it read as leaving the site, not as part of the
  account (Matt's call to fold it back in). help.html is gone;
  openHelpModal() is also gone (that was the popup before it). The
  sidebar's Help button is back to a normal showSection('help') click,
  and renderHelpSection() builds the section content once, eagerly, at
  buildFullProfileUI() time: a "Website Help" .rc-panel (the same couple
  of contact/support lines the old popup had) followed by a "Rules and
  Regulations" .rc-panel that renders js/rulebook-content.js's
  RULEBOOK_SECTIONS -- index up top, every section's real content below
  it, unwritten sections marked "Not yet drafted" rather than hidden.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Race Club</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/reference-data.js"></script>
<script src="js/rulebook-content.js"></script>
<script src="js/header.js"></script>
</head>
<body>

<div id="rc-header"></div>
<!-- Logo-only placeholder until we actually know whether this session is
     valid -- see the LOAD PROFILE section below, which calls the real
     renderHeader() once its own API call resolves (or forceLoggedOut if
     it couldn't even reach the server). -->
<script>renderHeaderPending();</script>

<!-- Mobile-only topbar. -->
<div class="rc-topbar" id="rc-topbar">
  <button class="rc-hamburger" id="rc-hamburger" aria-label="Menu">&#9776;</button>
</div>

<div class="rc-shell">
  <aside class="rc-sidebar" id="rc-sidebar">
    <!-- Filled in by buildSidebarNav() below. -->
    <nav class="rc-sidebar-nav" id="rc-sidebar-nav"></nav>
  </aside>

  <main class="rc-main">
    <div id="rc-loading" class="rc-inline-spinner-wrap rc-inline-spinner-page">
      <div class="rc-startlights" aria-hidden="true">
        <span class="rc-startlight"></span>
        <span class="rc-startlight"></span>
        <span class="rc-startlight"></span>
        <span class="rc-startlight"></span>
        <span class="rc-startlight"></span>
      </div>
      <div class="rc-loading-text">Loading account information&hellip;</div>
    </div>
    <div id="rc-error" class="rc-message rc-error" style="display:none;"></div>

    <!-- Forced password-change lock screen -- shown instead of the
         normal dashboard whenever profile.mustChangePassword is true. -->
    <div id="rc-forced-password" style="display:none;"></div>

    <div id="rc-profile-root" style="display:none;">
      <section id="rc-section-dashboard" class="rc-content-section"></section>
      <section id="rc-section-calendar" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-finances" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-results" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-career" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-reputation" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-objectives" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-sponsors" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-halloffame" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-league" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-admin" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-datamgmt" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-help" class="rc-content-section" style="display:none;"></section>
    </div>
  </main>
</div>

<!-- Site footer -- on every page. -->
<footer class="rc-site-footer">
  Copyright Race Club 2026. All rights reserved. Created and developed with the help of Claude AI.
</footer>

<script>
(function () {
  // ---------------------------------------------------------------------
  // SETUP / AUTH GATE
  // ---------------------------------------------------------------------
  if (apiBaseUrlIsUnset()) {
    document.getElementById('rc-loading').style.display = 'none';
    var err = document.getElementById('rc-error');
    err.style.display = 'block';
    err.textContent = 'API_BASE_URL is not set. Edit js/api.js and paste in your Apps Script Web App URL.';
    return;
  }

  var token = redirectIfNoToken();
  if (!token) return; // already redirected to login.html

  startInactivityWatcher();

  // Called by the Logout nav item built in buildSidebarNav() below.
  // Clears the local token and redirects immediately, without waiting on
  // the server-side logout call to finish -- if it never completes, the
  // token just sits unused until its normal 7-day expiry, harmless.
  function doLogout() {
    fetchApi('logout', { method: 'POST', token: token }).catch(function () {});
    clearToken();
    window.location.href = 'login.html';
  }

  // Mobile menu open/close. While open, the page itself can't scroll (see
  // .rc-scroll-locked in style.css). Remembers scroll position so it can
  // be restored on close.
  var scrollYBeforeLock = 0;
  function openMobileMenu() {
    document.getElementById('rc-sidebar').classList.add('rc-sidebar-open');
    scrollYBeforeLock = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = '-' + scrollYBeforeLock + 'px';
    document.body.classList.add('rc-scroll-locked');
  }
  function closeMobileMenu() {
    document.getElementById('rc-sidebar').classList.remove('rc-sidebar-open');
    document.body.classList.remove('rc-scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, scrollYBeforeLock);
  }
  document.getElementById('rc-hamburger').addEventListener('click', function (evt) {
    evt.stopPropagation();
    var sidebar = document.getElementById('rc-sidebar');
    if (sidebar.classList.contains('rc-sidebar-open')) closeMobileMenu();
    else openMobileMenu();
  });
  document.addEventListener('click', function (evt) {
    var sidebar = document.getElementById('rc-sidebar');
    if (!sidebar.classList.contains('rc-sidebar-open')) return;
    if (sidebar.contains(evt.target)) return; // click was on a nav link/inside the menu -- let it do its own thing
    closeMobileMenu();
  });

  // NOTE: the actual profile-loading code is at the very bottom of this
  // script, not here -- renderProfile()/buildFullProfileUI() below touch
  // `var`s (NAV_ITEMS, the ICON_* constants) whose VALUE ASSIGNMENTS
  // aren't hoisted, so calling them this early (before those assignments
  // have run, on the synchronous fresh-login path) would throw partway
  // through. Moving the load/render call to the bottom fixes that
  // unconditionally.

  // `style` accepts EITHER an inline CSS string ("margin:0;color:red;")
  // OR a plain class name ("rc-hint") -- disambiguated by whether it
  // contains a colon.
  function el(tag, style, html) {
    var e = document.createElement(tag);
    if (style) {
      if (style.indexOf(':') !== -1) e.style.cssText = style;
      else e.className = style;
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Flat, stroke-based icons (no emoji) -- one per sidebar item, unchanged
  // from v0.4.0.
  var ICON_DASHBOARD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>';
  var ICON_CALENDAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
  var ICON_RESULTS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="11"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="19" y1="20" x2="19" y2="14"></line></svg>';
  var ICON_CAREER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
  var ICON_FINANCES = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 6H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H7"></path></svg>';
  var ICON_NAV_STAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"></polygon></svg>';
  var ICON_SPONSORS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V4h7z"></path><circle cx="7.5" cy="7.5" r="1"></circle></svg>';
  var ICON_HALLOFFAME = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 5H4a3 3 0 0 0 3 4"></path><path d="M17 5h3a3 3 0 0 1-3 4"></path></svg>';
  var ICON_SETTINGS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path></svg>';
  var ICON_LEAGUE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M9 3v2h6V3"></path><line x1="8" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="16" y2="15"></line></svg>';
  var ICON_OBJECTIVES = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 11l2 2 4-4"></path><line x1="8" y1="16" x2="16" y2="16"></line></svg>';
  var ICON_LOCK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';
  var ICON_ADMIN = ICON_LOCK.replace('width="18" height="18"', 'width="16" height="16"');
  var ICON_DATAMGMT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path></svg>';
  var ICON_LOGOUT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>';
  var ICON_HELP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.2 9a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2-2.6 3.6"></path><line x1="12" y1="17" x2="12" y2="17.2"></line></svg>';

  // Same 10-item primary nav, same order, as v0.4.0. League Management,
  // Admin, and Data Management are appended separately in buildSidebarNav
  // below since they're permission-gated rather than always shown.
  var NAV_ITEMS = [
    { id: 'dashboard', label: 'Dashboard', icon: ICON_DASHBOARD },
    { id: 'calendar', label: 'Calendar', icon: ICON_CALENDAR },
    { id: 'finances', label: 'Finances', icon: ICON_FINANCES },
    { id: 'results', label: 'Results', icon: ICON_RESULTS },
    { id: 'career', label: 'Career', icon: ICON_CAREER },
    { id: 'reputation', label: 'Reputation', icon: ICON_NAV_STAR },
    { id: 'objectives', label: 'Objectives', icon: ICON_OBJECTIVES },
    { id: 'sponsors', label: 'Sponsors', icon: ICON_SPONSORS },
    { id: 'halloffame', label: 'Hall of Fame', icon: ICON_HALLOFFAME },
    { id: 'settings', label: 'Edit Profile', icon: ICON_SETTINGS }
  ];

  // Every section is a placeholder for now (see renderPlaceholderSections
  // below) -- this list is what drives both the placeholder panels and
  // their headings. Order doesn't matter here, only section IDs and labels.
  // League Management is real content now (see renderLeagueManagementSection),
  // not a placeholder -- removed from this list the same way Data
  // Management was.
  var PLACEHOLDER_LABELS = {
    dashboard: 'Dashboard', calendar: 'Calendar', finances: 'Finances',
    results: 'Results', career: 'Career', reputation: 'Reputation',
    objectives: 'Objectives', sponsors: 'Sponsors', halloffame: 'Hall of Fame',
    admin: 'Admin'
  };

  // Set once, in buildFullProfileUI() -- lets the Edit Profile/Help nav
  // button handlers (built earlier, in buildSidebarNav(), before profile/
  // token exist yet) reach live data at click-time. Same pattern the
  // Admin nav item's visibility check already needed.
  var currentProfile = null;
  var currentToken = null;

  // ---------------------------------------------------------------------
  // SIDEBAR NAV + SECTION SWITCHING
  // ---------------------------------------------------------------------
  function makeNavButton(id, label, icon, elId, hiddenByDefault, onClick) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rc-nav-item';
    btn.dataset.section = id;
    if (elId) btn.id = elId;
    if (hiddenByDefault) btn.style.display = 'none';
    btn.innerHTML = icon + '<span>' + escapeHtml(label) + '</span>';
    btn.addEventListener('click', onClick || function () { showSection(id); });
    return btn;
  }

  function navDivider(elId) {
    var hr = document.createElement('hr');
    hr.className = 'rc-nav-divider';
    if (elId) hr.id = elId;
    return hr;
  }

  function showUpperNavDivider() {
    document.getElementById('rc-nav-divider-upper').style.display = '';
  }

  // Order: the 10 general section links, a divider, Admin/Data
  // Management/League Management (only if this user's permissions unlock
  // them), a second divider, then Help, Settings, Log Out -- identical
  // order to v0.4.0.
  function buildSidebarNav() {
    var nav = document.getElementById('rc-sidebar-nav');
    nav.innerHTML = '';
    NAV_ITEMS.slice(0, -1).forEach(function (item) { // everything except Settings
      nav.appendChild(makeNavButton(item.id, item.label, item.icon, 'rc-nav-' + item.id));
    });
    var upperDivider = navDivider('rc-nav-divider-upper');
    upperDivider.style.display = 'none';
    nav.appendChild(upperDivider);
    // Admin is still just a placeholder for now -- Matt's not sure yet
    // what lives here, so it stays a plain link (default showSection(id)
    // handler, same as any other placeholder nav item) rather than having
    // its own render function.
    var adminBtn = makeNavButton('admin', 'Admin', ICON_ADMIN, 'rc-nav-admin', true);
    nav.appendChild(adminBtn);
    // Data Management is real content now, not a placeholder -- it fetches
    // fresh every time the link is clicked (see renderDataManagementSection),
    // same currentToken-closure pattern the Edit Profile/Help popups use,
    // since this button is built before profile/token exist on first load.
    // Members/Tracks/Cars/Sponsors each open their own popup from here
    // (openMembersModal etc.) rather than rendering inline.
    var dataMgmtBtn = makeNavButton('datamgmt', 'Data Management', ICON_DATAMGMT, 'rc-nav-datamgmt', true, function () {
      showSection('datamgmt');
      renderDataManagementSection(currentToken);
    });
    nav.appendChild(dataMgmtBtn);
    // League Management is real content now (renderLeagueManagementSection),
    // same lazy-fetch-on-click pattern as Data Management.
    var leagueBtn = makeNavButton('league', 'League Management', ICON_LEAGUE, 'rc-nav-league', true, function () {
      showSection('league');
      renderLeagueManagementSection(currentToken);
    });
    nav.appendChild(leagueBtn);
    nav.appendChild(navDivider());
    // Edit Profile is a popup, not a section -- its click handler opens a
    // modal instead of falling through to showSection(id); it reads
    // currentProfile/currentToken, set once buildFullProfileUI() actually
    // has that data (see the vars declared above). Help is an ordinary
    // in-page section again (see renderHelpSection()) -- it briefly lived
    // on its own page (help.html) so the Rulebook would have room to
    // grow, but that meant losing the sidebar/nav chrome, which read as
    // leaving the site rather than part of the account (Matt's call to
    // fold it back in).
    nav.appendChild(makeNavButton('help', 'Help', ICON_HELP, 'rc-nav-help', false, function () { showSection('help'); }));
    var settingsItem = NAV_ITEMS[NAV_ITEMS.length - 1];
    nav.appendChild(makeNavButton(settingsItem.id, settingsItem.label, settingsItem.icon, null, false, function () { openEditProfileModal(currentProfile, currentToken); }));
    nav.appendChild(makeNavButton('logout', 'Log Out', ICON_LOGOUT, 'rc-nav-logout', false, doLogout));
  }

  // Shows exactly one .rc-content-section and marks the matching sidebar
  // item active.
  function showSection(id) {
    document.querySelectorAll('.rc-content-section').forEach(function (s) { s.style.display = 'none'; });
    var target = document.getElementById('rc-section-' + id);
    if (target) target.style.display = 'block';
    document.querySelectorAll('.rc-nav-item').forEach(function (btn) {
      btn.classList.toggle('rc-nav-active', btn.dataset.section === id);
    });
    closeMobileMenu();
  }

  // ---------------------------------------------------------------------
  // PLACEHOLDER PANELS -- every section, no fake data, just a centered
  // heading + message. Replace one at a time with real content as each
  // link gets built out.
  // ---------------------------------------------------------------------
  function renderPlaceholderSections() {
    Object.keys(PLACEHOLDER_LABELS).forEach(function (id) {

  // ---------------------------------------------------------------------
  // GENERIC MODAL -- backdrop + centered card, Escape/backdrop-click/X all
  // close it. Reintroduced this pass (the CSS classes it needs,
  // .rc-modal-backdrop/.rc-modal/.rc-modal-head/.rc-modal-close/
  // .rc-modal-body/.rc-modal-wide, survived the v0.5.0 rebuild even though
  // this function didn't). opts.wide adds the .rc-modal-wide class for
  // content-heavier popups; opts.bodyEl is the element to place inside
  // .rc-modal-body.
  // ---------------------------------------------------------------------
  function showModal(title, opts) {
    opts = opts || {};
    var backdrop = el('div', 'rc-modal-backdrop');
    var modal = el('div', 'rc-modal' + (opts.wide ? ' rc-modal-wide' : ''));
    var head = el('div', 'rc-modal-head');
    head.appendChild(el('h3', 'margin:0;font-size:16px;', escapeHtml(title)));
    var closeBtn = el('button', 'rc-modal-close', '&times;');
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label', 'Close');
    head.appendChild(closeBtn);
    var body = el('div', 'rc-modal-body');
    if (opts.bodyEl) body.appendChild(opts.bodyEl);
    modal.appendChild(head);
    modal.appendChild(body);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);

    // Lock the page behind the popup -- same iOS-Safari-safe pattern the
    // mobile menu already uses (see .rc-modal-scroll-locked in
    // style.css): pin body with position:fixed (not just overflow:hidden,
    // which doesn't reliably stop touch scrolling), remembering the
    // scroll position so it can be restored on close without a jump.
    var scrollYBeforeModal = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = '-' + scrollYBeforeModal + 'px';
    document.body.classList.add('rc-modal-scroll-locked');

    function close() {
      backdrop.remove();
      document.removeEventListener('keydown', onKeydown);
      document.body.classList.remove('rc-modal-scroll-locked');
      document.body.style.top = '';
      window.scrollTo(0, scrollYBeforeModal);
      if (opts.onClose) opts.onClose();
    }
    function onKeydown(evt) {
      if (evt.key === 'Escape') close();
    }
    closeBtn.addEventListener('click', close);
    backdrop.addEventListener('click', function (evt) {
      if (evt.target === backdrop) close();
    });
    document.addEventListener('keydown', onKeydown);

    // el: the modal card itself (not the dimmed backdrop) -- exposed so a
    // caller can add a one-off class to it, e.g. the Season Wizard's
    // shake-on-invalid-Next animation (.rc-shake).
    return { close: close, body: body, el: modal };
  }

    location.appendChild(locBlank);
    (typeof COUNTRIES !== 'undefined' ? COUNTRIES : []).forEach(function (country) {

      if (profile.location === country) opt.selected = true;

    form.addEventListener('submit', function (evt) {

        showToast('Username, first name, last name, and email are required.', 'error');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      fetchApi('updateOwnProfile', {
        method: 'POST',
        token: token,
        body: {
          username: username.value.trim(),
          firstName: firstName.value.trim(),
          lastName: lastName.value.trim(),
          suffix: suffix.value,

        }

          modalHandle.close();

        .catch(function () {
          saveBtn.disabled = false;

          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });

  // =======================================================================
  // SEASON CREATION WIZARD -- ported back from the pre-v0.5 archive
  // (commit ab231e0), restoring its full look/behavior: 3 pages (Season
  // Details / Race Events / Season Preview), a shared requireField/
  // requireGroup hard-stop validation pattern, progressive step-unlocking,
  // and a localStorage-backed draft so a half-finished wizard survives
  // closing the tab. This is intentionally still built around the OLD
  // (pre-ECO) economy/multiclass/Special Events design -- Matt's own
  // framing for this restore was "make it look identical... then we can
  // go through and remove parts we don't need" as a second, separate pass.
  //
  // Two integration points were adapted to the CURRENT backend rather than
  // ported verbatim, since they're plumbing, not "look":
  //   1) Track/Layout are looked up against real TrackID rows (the
  //      current Tracks tab is one row per Track+Layout combo) instead of
  //      the archive's name-only WIZARD_TRACK_LAYOUTS map -- see
  //      loadWizardTrackList()/resolveTrackId() below.
  //   2) finishWizard() packs everything the current handleCreateSeason
  //      (4_DataCache.gs) doesn't look up individually -- classes,
  //      classSeasons, economy, raceSettings, specialEvents, etc. -- into
  //      one seasonDetails JSON blob, matching the SeasonDetails/
  //      RoundDetails "one JSON column" convention the rest of the site
  //      already uses, instead of the archive's flatter ad hoc payload.
  //      Special Events and the multiclass fields ride along inertly in
  //      that JSON for now (same treatment Core.gs already gives Special
  //      Events on the Rounds side: "explicitly deferred until that
  //      system gets designed").
  // =======================================================================
  var WIZARD_DRAFT_KEY = 'raceclub_season_wizard_draft';
  var WIZARD_STEPS = ['Season Details', 'Race Events', 'Season Preview'];

  // Real LMU track/layout list -- hardcoded FALLBACK only. loadWizardTrackList()
  // below overwrites WIZARD_TRACK_LIST/WIZARD_TRACK_LAYOUTS/WIZARD_TRACK_ROWS
  // in place (so every closure already holding a reference keeps working)
  // with whatever the Tracks tab returns from action=getTracks the moment
  // the wizard opens. If that fetch fails, this list is what the wizard
  // uses instead -- never a blank dropdown.
  var WIZARD_TRACK_LIST = [
    'Autódromo Internacional do Algarve (Portimão)',
    'Autódromo José Carlos Pace (Interlagos)',
    'Autodromo Internazionale Enzo e Dino Ferrari (Imola)',
    'Autodromo Nazionale Monza',
    'Bahrain International Circuit',
    'Circuit de Barcelona-Catalunya',
    'Circuit de la Sarthe',
    'Circuit of the Americas (COTA)',
    'Circuit Paul Ricard',
    'Circuit de Spa-Francorchamps',
    'Daytona International Speedway',
    'Fuji International Speedway',
    'Lusail International Circuit',
    'Sebring International Raceway',
    'Silverstone Circuit',
    'WeatherTech Raceway Laguna Seca'
  ];
  var WIZARD_TRACK_LAYOUTS = {
    'Autódromo Internacional do Algarve (Portimão)': ['WEC', 'ELMS'],
    'Autódromo José Carlos Pace (Interlagos)': ['WEC'],
    'Autodromo Internazionale Enzo e Dino Ferrari (Imola)': ['WEC', 'ELMS'],
    'Autodromo Nazionale Monza': ['WEC', 'Curva Grande Layout'],
    'Bahrain International Circuit': ['WEC', 'Bahrain International Endurance Circuit', 'Bahrain International Outer Circuit', 'Bahrain International Paddock Circuit'],
    'Circuit de Barcelona-Catalunya': ['ELMS'],
    'Circuit de la Sarthe': ['WEC', 'Mulsanne No Chicanes'],
    'Circuit of the Americas (COTA)': ['WEC', 'COTA National'],
    'Circuit Paul Ricard': ['ELMS', '1A', '1A v2', '1A v2 Short', '3A'],
    'Circuit de Spa-Francorchamps': ['WEC', 'ELMS'],
    'Daytona International Speedway': ['Standard'],
    'Fuji International Speedway': ['WEC', 'Fuji Classic (No Chicane)'],
    'Lusail International Circuit': ['WEC', 'Lusail Short Circuit'],
    'Sebring International Raceway': ['WEC', 'Sebring School Circuit'],
    'Silverstone Circuit': ['WEC', 'ELMS', 'Silverstone International', 'Silverstone National'],
    'WeatherTech Raceway Laguna Seca': ['Standard']
  };
  // Raw rows fetched by loadWizardTrackList() -- {TrackID, TrackName, Layout}
  // -- kept alongside the name-only list above so a Track+Layout pick made
  // in the UI can be resolved back to a real TrackID at Create Season time
  // (see resolveTrackId()). Empty until the wizard actually loads.
  var WIZARD_TRACK_ROWS = [];
  function trackLayoutOptions(track) { return WIZARD_TRACK_LAYOUTS[track] || ['Standard']; }
  function resolveTrackId(trackName, layout) {
    var row = WIZARD_TRACK_ROWS.filter(function (r) { return r.TrackName === trackName && r.Layout === layout; })[0]
      || WIZARD_TRACK_ROWS.filter(function (r) { return r.TrackName === trackName; })[0];
    return row ? row.TrackID : '';
  }
  // Pulls the live track/layout list from the Tracks tab (action=getTracks,
  // Website.gs) and overwrites WIZARD_TRACK_LIST/WIZARD_TRACK_LAYOUTS/
  // WIZARD_TRACK_ROWS IN PLACE. Only runs the moment "Create a Season" is
  // actually clicked (see openSeasonWizardWithLoad below) -- never at page
  // load, so drivers never pay for data they'll never use. Silently keeps
  // the hardcoded fallback above on any failure -- a broken track fetch
  // should never block season creation.
  function loadWizardTrackList() {
    if (typeof fetchApi !== 'function') return Promise.resolve();
    return fetchApi('getTracks', { token: token }).then(function (res) {
      if (!res || !res.success || !res.tracks || !res.tracks.length) return;
      var rows = res.tracks.filter(_rcRowActive);
      if (!rows.length) return;
      var names = [];
      var layouts = {};
      rows.forEach(function (t) {
        if (!t || !t.TrackName) return;
        if (names.indexOf(t.TrackName) === -1) { names.push(t.TrackName); layouts[t.TrackName] = []; }
        var layoutName = t.Layout || 'Standard';
        if (layouts[t.TrackName].indexOf(layoutName) === -1) layouts[t.TrackName].push(layoutName);
      });
      if (!names.length) return;
      names.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0; });
      Object.keys(layouts).forEach(function (k) { layouts[k].sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0; }); });
      WIZARD_TRACK_LIST.length = 0;
      names.forEach(function (n) { WIZARD_TRACK_LIST.push(n); });
      Object.keys(WIZARD_TRACK_LAYOUTS).forEach(function (k) { delete WIZARD_TRACK_LAYOUTS[k]; });
      Object.keys(layouts).forEach(function (k) { WIZARD_TRACK_LAYOUTS[k] = layouts[k]; });
      WIZARD_TRACK_ROWS.length = 0;
      rows.forEach(function (r) { WIZARD_TRACK_ROWS.push(r); });
    }).catch(function (err) { /* offline/endpoint not deployed yet -- keep the hardcoded fallback */ });
  }
  // Every active car (Data Management > Cars, action=getCars) -- fetched
  // fresh the moment the wizard opens by loadWizardCarList(). Starts empty;
  // the Format section's class checkboxes treat "no data yet" the same as
  // "no cars this season" (greyed out) rather than guessing, since
  // openSeasonWizardWithLoad() always waits for this fetch to settle
  // (success OR failure) before the wizard itself ever opens.
  var WIZARD_CARS = [];
  function loadWizardCarList() {
    if (typeof fetchApi !== 'function') return Promise.resolve();
    return fetchApi('getCars', { token: token }).then(function (res) {
      WIZARD_CARS.length = 0;
      if (!res || !res.success || !res.cars) return;
      res.cars.filter(_rcRowActive).forEach(function (c) { if (c && c.Class) WIZARD_CARS.push(c); });
    }).catch(function (err) { /* offline/endpoint not deployed yet -- every class just shows greyed out */ });
  }
  var WIZARD_WEATHER_LIST = ['Clear', 'Light Clouds', 'Partially Cloudy', 'Overcast', 'Cloudy & Drizzle', 'Cloudy & Light Rain', 'Overcast & Light Rain', 'Overcast & Rain', 'Overcast & Heavy Rain', 'Overcast & Storm'];
  // Only weather that actually involves rain gets a Chance of Rain box --
  // Clear/Light Clouds/Partially Cloudy/Overcast are all dry.
  var WIZARD_RAIN_WEATHER = ['Cloudy & Drizzle', 'Cloudy & Light Rain', 'Overcast & Light Rain', 'Overcast & Rain', 'Overcast & Heavy Rain', 'Overcast & Storm'];
  function weatherAllowsRainChance(weather) { return WIZARD_RAIN_WEATHER.indexOf(weather) !== -1; }
  // Keeps a Chance of Rain box's disabled/greyed state (and value) in sync
  // with its Weather select -- call once up front to set the initial
  // state, then again every time Weather changes. onForceZero fires only
  // when the box gets locked back to 0 so the caller can update its own
  // state object to match what's now shown on screen.
  function syncRainInputToWeather(weatherSelect, rainInput, onForceZero) {
    var allowed = weatherAllowsRainChance(weatherSelect.value);
    rainInput.disabled = !allowed;
    rainInput.classList.toggle('rc-field-locked', !allowed);
    if (!allowed && Number(rainInput.value) !== 0) {
      rainInput.value = 0;
      onForceZero();
    }
  }
  // Fuel Consumption Multiplier / Tire Wear Multiplier options (Race
  // Settings) -- multipliers on the sim's own base consumption rate, not

  var SPECIAL_EVENT_BONUS_CATEGORIES = [

    { key: 'mostPositionsGained', label: 'Most Positions Gained' },

  // Local-timezone YYYY-MM-DD for today -- used to default date pickers to
  // today instead of leaving them blank.
  function todayDateStr() {
    var d = new Date();
    var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = '0' + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  function isoFromDate(d) {
    var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = '0' + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  // Human-readable label for a schedule dropdown option, e.g. "Sat, Sep 5,
  // 2026" -- so the bye week picker reads like a real calendar choice
  // instead of a raw ISO string.
  function formatDateLabel(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  // Same idea as formatDateLabel but for a <input type="datetime-local">
  // value ("2026-09-05T20:00") -- used only for the wizard's scheduled
  // season-release preview line. Reads in the BROWSER's local time, same
  // as the datetime-local input itself, so the label always matches what
  // the admin actually picked.
  function formatDateTimeLabel(dtLocal) {
    if (!dtLocal) return '';
    var d = new Date(dtLocal);
    if (isNaN(d.getTime())) return '';
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var hours = d.getHours();
    var ampm = hours >= 12 ? 'PM' : 'AM';
    var hour12 = hours % 12 || 12;
    var mins = String(d.getMinutes()).padStart(2, '0');
    return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() +
      ' at ' + hour12 + ':' + mins + ' ' + ampm;
  }
  // Wraps a plain <input type="time"> with a small static badge next to it
  // -- "Sim Time" for the In-Game Practice/Qualify/Race start times, which
  // are the simulated LMU clock and not a real-world join time.
  function wizTimeWithBadge(inputEl, badgeText) {
    var wrap = el('div', 'display:flex;align-items:center;gap:8px;width:100%;');
    wrap.appendChild(inputEl);
    if (badgeText) wrap.appendChild(el('span', 'rc-wiz-badge', badgeText));
    return wrap;
  }
  // Adds `steps` cadence periods (Weekly/Biweekly/Monthly) to a YYYY-MM-DD
  // date -- Monthly advances by calendar month (not a fixed day count) so
  // "the 5th of every month" stays the 5th regardless of month length.
  function addCadence(dateStr, frequency, steps) {
    var d = new Date(dateStr + 'T00:00:00');
    if (frequency === 'Monthly') {
      d.setMonth(d.getMonth() + steps);
    } else {
      d.setDate(d.getDate() + (frequency === 'Biweekly' ? 14 : 7) * steps);
    }
    return isoFromDate(d);
  }
  // Bye weeks and drop weeks are both capped at (races this season - 1), 4
  // max either way -- a season can't be ALL byes.
  function maxByeDropForRaces(numRaces) {
    return Math.max(0, Math.min(4, (parseInt(numRaces, 10) || 0) - 1));
  }
  // The full set of calendar slots this season could possibly use -- races
  // AND bye weeks each consume one slot, spaced by Frequency, starting at
  // Season Start Date. Bye week dropdowns are restricted to exactly this
  // list; race dates are whichever slots aren't claimed by a bye week (see
  // computeRaceDates() below).
  function computeSeasonSlots(state) {
    var byeCount = Math.max(0, Math.min(4, parseInt(state.byeWeeks, 10) || 0));
    var raceCount = Math.max(0, parseInt(state.numRaces, 10) || 0);
    var total = raceCount + byeCount;
    var start = state.seasonStartDate || todayDateStr();
    var slots = [];
    for (var i = 0; i < total; i++) slots.push(addCadence(start, state.frequency, i));
    return slots;
  }
  // Race dates = the season's slots minus whichever ones are claimed as bye
  // weeks, taken in calendar order and capped to Number Of Races.
  function computeRaceDates(state) {
    var slots = computeSeasonSlots(state);
    var byeSet = {};
    (state.byeWeekDates || []).forEach(function (d) { if (d) byeSet[d] = true; });
    var raceDates = slots.filter(function (d) { return !byeSet[d]; });
    return raceDates.slice(0, Math.max(0, parseInt(state.numRaces, 10) || 0));
  }
  // The admin's own IANA timezone id from their profile -- falls back to
  // the browser's own zone if the profile hasn't loaded one.
  function wizardAdminTimeZone() {
    if (currentProfile && currentProfile.timeZone) return currentProfile.timeZone;
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (err) { return ''; }
  }

  function loadWizardDraft() {

      return raw ? JSON.parse(raw) : null;
    } catch (err) { return null; }
  }

    try { localStorage.setItem(WIZARD_DRAFT_KEY, JSON.stringify(state)); } catch (err) { /* storage full/unavailable -- draft just won't persist this time */ }

  // Shows the branded spinner in a small modal, fetches tracks + cars
  // together, then opens the real wizard once both have settled -- success
  // or failure either way, since both loaders already fall back gracefully

  function openSeasonWizardWithLoad() {

  // ---- small field-building helpers, reusing the site's el()/fieldPairRow()
  // primitives so the wizard looks and behaves like the rest of the site. ----
  function wizLabel(text) { return el('label', 'margin-top:0;', escapeHtml(text)); }
  function wizField(labelText, inputEl, hintText) {
    var wrap = el('div', 'rc-wiz-field');
    wrap.appendChild(wizLabel(labelText));
    wrap.appendChild(inputEl);
    if (hintText) wrap.appendChild(el('div', 'rc-hint', hintText));
    return wrap;
  }
  // Two-column version of wizField/fieldPairRow -- each column is its own
  // .rc-wiz-field (label + input + optional hint), so a hint lives
  // directly under the box it explains instead of one combined hint
  // floating below the whole row. Pass null/omit either hint to leave that
  // column without one.
  function wizFieldPairRow(labelA, fieldA, hintA, labelB, fieldB, hintB) {
    var row = el('div', 'rc-wiz-field-pair');
    var colA = el('div', 'rc-wiz-field');
    colA.appendChild(wizLabel(labelA));
    colA.appendChild(fieldA);
    if (hintA) colA.appendChild(el('div', 'rc-hint', hintA));
    var colB = el('div', 'rc-wiz-field');
    colB.appendChild(wizLabel(labelB));
    colB.appendChild(fieldB);
    if (hintB) colB.appendChild(el('div', 'rc-hint', hintB));
    row.appendChild(colA);
    row.appendChild(colB);
    return row;
  }
  function wizTextInput(value, onInput) {
    var input = el('input'); input.type = 'text'; input.value = value || '';
    input.addEventListener('input', function () { onInput(input.value); });
    return input;
  }
  function wizNumberInput(value, onInput, opts) {
    opts = opts || {};
    var input = el('input'); input.type = 'number';
    input.value = (value === undefined || value === null || value === '') ? '' : value;
    if (opts.min !== undefined) input.min = opts.min;
    if (opts.max !== undefined) input.max = opts.max;
    if (opts.step !== undefined) input.step = opts.step;
    input.addEventListener('input', function () { onInput(input.value === '' ? '' : Number(input.value)); });
    return input;
  }
  // No blank "-- Select --" option -- every dropdown in this wizard already
  // defaults to a real value. `value` should always be one of `options`.
  function wizSelect(options, value, onChange) {
    var select = document.createElement('select');
    options.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      if (opt === value) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener('change', function () { onChange(select.value); });
    return select;
  }
  function wizCheckboxRow(labelText, checked, onChange) {
    var label = document.createElement('label');
    var input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!checked;
    input.addEventListener('change', function () { onChange(input.checked); });
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + labelText));
    return label;
  }
  // ---- hard-stop validation ("every box has to be filled out" before Next
  // is allowed to advance). Each page-render function is handed a shared
  // `requiredEls` array and pushes one entry per mandatory field/group;
  // openSeasonWizard's Next handler walks the array on click. Entries are
  // duck-typed {isValid, markInvalid, clearInvalid} rather than raw
  // elements so a single-input field and a multi-checkbox group can both
  // be validated the same way. ----
  function requireField(inputEl, requiredEls) {
    var entry = {
      isValid: function () { return String(inputEl.value).trim() !== ''; },
      markInvalid: function () { inputEl.classList.add('rc-field-invalid'); },
      clearInvalid: function () { inputEl.classList.remove('rc-field-invalid'); }
    };
    inputEl.addEventListener('input', function () { if (entry.isValid()) entry.clearInvalid(); });
    requiredEls.push(entry);
    return inputEl;
  }
  function requireGroup(wrapEl, isValidFn, requiredEls) {
    var entry = {
      isValid: isValidFn,
      markInvalid: function () { wrapEl.classList.add('rc-field-invalid-group'); },
      clearInvalid: function () { wrapEl.classList.remove('rc-field-invalid-group'); }
    };
    requiredEls.push(entry);
    return entry;
  }
  function wizSubhead(text) { return el('div', 'rc-wizard-subhead', escapeHtml(text)); }
  function previewLine(label, value) {
    var row = el('div', 'display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--rc-offwhite);font-size:12.5px;');
    row.appendChild(el('span', 'color:var(--rc-steel);', escapeHtml(label)));
    row.appendChild(el('span', 'font-weight:600;text-align:right;', escapeHtml(String(value))));
    return row;
  }

  // Compact editable P1-P10 table for one race-length tier, plus its
  // season-wide duration.
  function renderWizardPointsTable(state, tier, requiredEls) {
    var wrap = el('div', 'rc-panel');
    wrap.style.marginTop = '10px';
    var head = el('div', 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;');
    head.appendChild(el('h4', 'margin:0;font-size:13px;', tier + ' Tier'));
    var durationInput = wizNumberInput(state.pointsTables[tier].duration, function (v) { state.pointsTables[tier].duration = v; }, { min: 5 });
    durationInput.style.cssText = 'width:70px;max-width:70px;display:inline-block;margin:0;';
    requireField(durationInput, requiredEls);
    var durWrap = el('span', 'font-size:12px;color:var(--rc-steel);display:flex;align-items:center;gap:6px;');
    durWrap.appendChild(document.createTextNode('Duration (min)'));
    durWrap.appendChild(durationInput);
    head.appendChild(durWrap);
    wrap.appendChild(head);

    var table = document.createElement('table');
    table.style.cssText = 'width:100%;margin-top:8px;border-collapse:collapse;';
    var headRow = document.createElement('tr');
    for (var p = 1; p <= 10; p++) {
      var th = document.createElement('td');
      th.style.cssText = 'font-size:10px;color:var(--rc-steel);text-align:center;padding:2px;';
      th.textContent = 'P' + p;
      headRow.appendChild(th);
    }
    table.appendChild(headRow);
    var inputRow = document.createElement('tr');
    state.pointsTables[tier].points.forEach(function (val, idx) {
      var td = document.createElement('td');
      td.style.padding = '2px';
      var input = wizNumberInput(val, function (v) { state.pointsTables[tier].points[idx] = v; }, { min: 0 });
      input.style.cssText = 'width:100%;max-width:100%;text-align:center;padding:4px;margin:0;box-sizing:border-box;';
      requireField(input, requiredEls);
      td.appendChild(input);
      inputRow.appendChild(td);
    });
    table.appendChild(inputRow);
    wrap.appendChild(table);
    return wrap;
  }

  // Page 1 -- Identity, Access & server behavior, Format, Points, Schedule,
  // Race Settings, Economy.
  function renderWizardSeasonDetailsPage(state, container, requiredEls) {
    container.appendChild(wizSubhead('Identity'));
    var nameInput = wizTextInput(state.seasonName, function (v) { state.seasonName = v; });
    nameInput.maxLength = 24;
    nameInput.style.maxWidth = '50%';
    requireField(nameInput, requiredEls);
    container.appendChild(wizField('Season Name', nameInput));

    container.appendChild(wizSubhead('Access & Server Behavior'));
    var pwInput = wizTextInput(state.defaultPassword, function (v) { state.defaultPassword = v; });
    pwInput.style.maxWidth = '50%';
    requireField(pwInput, requiredEls);
    container.appendChild(wizField('Default Password', pwInput));

    container.appendChild(fieldPairRow(
      'Private Qualifying', wizSelect(['Yes', 'No'], state.privateQualifying, function (v) { state.privateQualifying = v; }),
      'Track Limits Preset', wizSelect(['Strict', 'Relaxed', 'Default'], state.trackLimitsPreset, function (v) { state.trackLimitsPreset = v; })
    ));

    container.appendChild(wizSubhead('Format'));
    var classesWrap = el('div');
    var classesGroupEntry;
    function recheckClassesGroup() { if (classesGroupEntry && classesGroupEntry.isValid()) classesGroupEntry.clearInvalid(); }
    function availableSeasonsForClass(cls) {
      var seasons = {};
      (typeof WIZARD_CARS !== 'undefined' ? WIZARD_CARS : []).forEach(function (c) {
        if (c && c.Class === cls && c.Season) seasons[String(c.Season)] = true;
      });
      return Object.keys(seasons).sort(function (a, b) { return (Number(b) || 0) - (Number(a) || 0); });
    }
    var classRows = {};
    CAR_CLASS_LIST.forEach(function (cls) {
      var seasons = availableSeasonsForClass(cls);
      var available = seasons.length > 0;
      if (!available && state.classes[cls]) { state.classes[cls] = false; state.classSeasons[cls] = ''; }
      var row = el('div', 'padding:6px 0;' + (available ? '' : 'opacity:0.55;'));
      var topRow = el('div', 'display:flex;align-items:center;gap:12px;');

      var classLabel = wizCheckboxRow(cls, state.classes[cls] && available, function (c) {
        state.classes[cls] = c;
        var refs = classRows[cls];
        seasons.forEach(function (season) {
          refs.radios[season].disabled = !c;
        });
        if (!c) {
          state.classSeasons[cls] = '';
          seasons.forEach(function (season) { refs.radios[season].checked = false; });
        }
        recheckClassesGroup();
      });
      var classCb = classLabel.querySelector('input');
      classCb.disabled = !available;
      classLabel.style.cssText = 'display:flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:400;text-transform:none;letter-spacing:normal;font-family:var(--rc-font-body);color:var(--rc-carbon);';
      topRow.appendChild(classLabel);
      var noCarsHint = el('span', 'font-size:12px;color:var(--rc-steel);font-style:italic;display:' + (available ? 'none' : ''), 'no cars entered for this class yet');
      topRow.appendChild(noCarsHint);
      row.appendChild(topRow);

      var radios = {};
      if (available) {
        var seasonsRow = el('div', 'display:flex;gap:16px;flex-wrap:wrap;margin-left:26px;margin-top:4px;');
        seasons.forEach(function (season) {
          var radioLabel = document.createElement('label');
          radioLabel.style.cssText = 'display:flex;align-items:center;gap:5px;margin:0;font-size:13px;font-weight:400;color:var(--rc-steel);';
          var radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = 'wizard-class-season-' + cls;
          radio.checked = state.classSeasons[cls] === season;
          radio.disabled = !state.classes[cls];
          radio.addEventListener('change', function () {
            if (radio.checked) { state.classSeasons[cls] = season; recheckClassesGroup(); }
          });
          radioLabel.appendChild(radio);
          radioLabel.appendChild(document.createTextNode(' ' + season));
          seasonsRow.appendChild(radioLabel);
          radios[season] = radio;
        });
        row.appendChild(seasonsRow);
      }
      classesWrap.appendChild(row);

      classRows[cls] = { row: row, classCb: classCb, radios: radios, noCarsHint: noCarsHint };
    });

    classesGroupEntry = requireGroup(classesWrap, function () {
      var anySelected = Object.keys(state.classes).some(function (c) { return state.classes[c]; });
      return anySelected && Object.keys(state.classes).every(function (c) { return !state.classes[c] || !!state.classSeasons[c]; });
    }, requiredEls);
    container.appendChild(wizField('Car Class(es) For The Season', classesWrap));

    var byeWeeksInput = wizNumberInput(state.byeWeeks, function (v) { state.byeWeeks = v; }, { min: 0, max: maxByeDropForRaces(state.numRaces) });
    requireField(byeWeeksInput, requiredEls);
    container.appendChild(wizFieldPairRow(
      'Frequency', wizSelect(['Weekly', 'Biweekly', 'Monthly'], state.frequency, function (v) { state.frequency = v; }), null,
      'Bye Weeks', byeWeeksInput, null
    ));
    var numRacesInput = wizNumberInput(state.numRaces, function (v) { state.numRaces = v; }, { min: 1 });
    requireField(numRacesInput, requiredEls);
    var dropWeeksInput = wizNumberInput(state.dropWeeks, function (v) { state.dropWeeks = v; }, { min: 0, max: maxByeDropForRaces(state.numRaces) });
    requireField(dropWeeksInput, requiredEls);
    numRacesInput.addEventListener('input', function () {
      var cap = maxByeDropForRaces(numRacesInput.value);
      byeWeeksInput.max = cap;
      dropWeeksInput.max = cap;
      if (Number(byeWeeksInput.value) > cap) { byeWeeksInput.value = cap; state.byeWeeks = cap; }
      if (Number(dropWeeksInput.value) > cap) { dropWeeksInput.value = cap; state.dropWeeks = cap; }
    });
    container.appendChild(wizFieldPairRow(
      'Number Of Races', numRacesInput, null,
      'Drop Weeks Allowed', dropWeeksInput, null
    ));

  // Keeps state.races the right length whenever Race Events opens.
  function syncRaceCount(state) {
    var n = Math.max(0, parseInt(state.numRaces, 10) || 0);
    while (state.races.length < n) {
      state.races.push({
        track: WIZARD_TRACK_LIST[0], layout: trackLayoutOptions(WIZARD_TRACK_LIST[0])[0], weather: 'Clear', tier: 'Sprint',
        chanceOfRain: 0, temperatureC: 20,
        passwordOverride: '',
        igPracticeStart: '12:00', igQualifyStart: '13:00', igRaceStart: '14:00'
      });
    }
    if (state.races.length > n) state.races.length = n;
  }
  // Keeps state.byeWeekDates the right length whenever Race Events opens.
  function syncByeWeekDates(state) {
    var n = Math.max(0, Math.min(maxByeDropForRaces(state.numRaces), parseInt(state.byeWeeks, 10) || 0));
    if (!state.byeWeekDates) state.byeWeekDates = [];
    while (state.byeWeekDates.length < n) state.byeWeekDates.push('');
    if (state.byeWeekDates.length > n) state.byeWeekDates.length = n;
    var raceCount = Math.max(0, parseInt(state.numRaces, 10) || 0);
    var slots = computeSeasonSlots(state);
    for (var i = 0; i < n; i++) {
      if (!state.byeWeekDates[i] || slots.indexOf(state.byeWeekDates[i]) === -1) {
        state.byeWeekDates[i] = slots[raceCount + i] || slots[slots.length - 1] || '';
      }
    }
  }
  // Keeps state.specialEvents the right length whenever Race Events opens.
  function syncSpecialEvents(state) {
    var n = Math.max(0, Math.min(2, parseInt(state.specialEventsCount, 10) || 0));
    if (!state.specialEvents) state.specialEvents = [];
    while (state.specialEvents.length < n) state.specialEvents.push(defaultSpecialEvent());
    if (state.specialEvents.length > n) state.specialEvents.length = n;
  }

        poolWrap.appendChild(poolTotalInput);

          var placesSum = evt.moneyPlaces.reduce(function (s, v) { return s + (Number(v) || 0); }, 0);
          var bonusSum = SPECIAL_EVENT_BONUS_CATEGORIES.reduce(function (s, c) { return s + (Number(evt.bonusPayouts[c.key]) || 0); }, 0);
          return placesSum + bonusSum;
        }
        function refreshPoolTotal() {
          poolTotalInput.value = poolTotalNow();
        }
        poolTotalInput.addEventListener('change', function () {
          var newTotal = Math.max(0, Number(poolTotalInput.value) || 0);
          var oldTotal = poolTotalNow();
          var allVals = evt.moneyPlaces.concat(SPECIAL_EVENT_BONUS_CATEGORIES.map(function (c) { return Number(evt.bonusPayouts[c.key]) || 0; }));
          var scaled;
          if (oldTotal > 0) {
            scaled = allVals.map(function (v) { return Math.round((Number(v) || 0) / oldTotal * newTotal); });
          } else {
            var share = Math.floor(newTotal / allVals.length);
            scaled = allVals.map(function () { return share; });
          }
          var scaledSum = scaled.reduce(function (s, v) { return s + v; }, 0);
          scaled[0] += (newTotal - scaledSum);

          evt.moneyPlaces.forEach(function (v, i) { evt.moneyPlaces[i] = scaled[i]; moneyInputs[i].value = scaled[i]; });
          SPECIAL_EVENT_BONUS_CATEGORIES.forEach(function (c, i) {

          requireField(input, requiredEls);
          moneyInputs.push(input);
          td.appendChild(input);
          moneyInputRow.appendChild(td);
        });
        moneyTable.appendChild(moneyInputRow);
        moneyWrap.appendChild(moneyTable);
        card.appendChild(moneyWrap);
        refreshPoolTotal();

        var bonusPayoutWrap = el('div', 'rc-panel'); bonusPayoutWrap.style.marginTop = '10px';
        bonusPayoutWrap.appendChild(el('h4', 'margin:0 0 8px;font-size:13px;', 'Bonus Categories'));

          requireField(catInput, requiredEls);

          field.appendChild(catInput);
          bonusGrid.appendChild(field);
        });
        bonusPayoutWrap.appendChild(bonusGrid);
        card.appendChild(bonusPayoutWrap);

        container.appendChild(card);
      });
    }
