<!--
  Race Club — Account.html  (v0.4.0, renamed from profile.html)

  WHY THE RENAME: profile.html is reserved for a future PUBLIC profile page
  (viewing another driver's stats/rank in the league) -- a genuinely
  different page with different data and no login required. This file is
  the logged-in driver's own account/dashboard, so it needed its own name
  before the public page gets built, to avoid a collision later. Every
  link that used to point at profile.html (login.html, register.html,
  header.js's Account dropdown item) now points here instead.

  v0.4.0 also: replaced the plain "Loading your profile..." text with a
  branded spinner (see the CSS ".rc-inline-spinner-wrap"/".rc-spinner"
  rules and buildSpinner() below) shown in the main content area next to
  the sidebar rather than a full-screen overlay, and made the Admin
  section load lazily -- only a lightweight pending-accounts count fetches
  on page load now (just to light up the notification dot), with the full
  approval queue + Manage Users list deferred until the Admin nav item is
  actually clicked. See the ADMIN LAZY LOAD section further down for
  details.

  WHAT CHANGED IN THIS PASS (Aug 2026 "HUGE build session"):
  - Removed the 5-box "coming soon" stack (Schedule/Driver Score/
    Attributes/Rivalries/Objectives) that used to sit under the dashboard
    hero card -- see the removed lockedSectionsBlock(). Rivalries is gone
    for good (Matt's call: it "morphed into the wager system" and isn't a
    separate feature); Objectives graduated into a real nav section
    instead (see NAV_ITEMS/renderObjectivesSection()); Schedule/Driver
    Score/Attributes were just removed outright per direct instruction.
  - Sidebar reordered: Finances now sits right after Calendar, and
    Objectives is a new item directly before Sponsors. No Rivalries item.
  - Dashboard widgets rebuilt into three explicit rows instead of one
    auto-flowing grid, plus two new placeholder widgets (Wagers, Team
    Details) -- see buildDashboardWidgets()/.rc-dash-row in style.css.
  - Notification-bubble infra generalized from "Admin only" to any
    sidebar category -- see setNavNotif()/addNavDot(). Still only Admin
    actually feeds it; the mechanism is ready for future features.
  - League Management's "Create Season" now opens a real multi-page
    Season Creation Wizard (Season Details -> Race Events -> Season
    Preview) inside the existing showModal(), with a client-side
    (localStorage) draft save/resume -- see openSeasonWizard() and the
    SEASON CREATION WIZARD section below for the full design-doc mapping
    and its one honest limitation (no backend endpoint to actually save
    a season yet).

  WHAT CHANGED VS. v0.2.5:
  The sidebar used to have 3 anchor links (Profile / League Management /
  Admin) that scroll-jumped down one long page. It's now a real 9-item
  primary nav (Dashboard / Calendar / Results / Career / Reputation /
  Finances / Sponsors / Hall of Fame / Settings) plus the same two
  permission-gated items as before (League Management, Admin), and
  clicking an item shows only that section's <section> element and hides
  the rest (see showSection() below) instead of scrolling.

  IMPORTANT — nothing about the underlying business logic changed:
  - dashboardHeroCard()/renderProfileViewBlock()/lockedSectionsBlock()
    are the same profile-card rendering as before, just now living inside
    the Dashboard section instead of one big "Profile" section, and merged
    into one hero card together with the quick-glance widgets. The
    initials-placeholder avatar and Prospect/Rookie badge stack that used
    to sit in the sidebar are gone -- the driver's real avatar image now
    lives inside this hero card instead (see avatarImageSrc()), and the
    sidebar nav starts right at the top.
  - editProfilePanel() and passwordChangeSection() are copied verbatim
    (same fields, same fetchApi() calls, same validation) from v0.2.5 —
    they just render inside the Settings section now instead of behind
    the header card's pencil-icon toggle. See the code comment above
    renderSettingsSection() for the one small, deliberate behavior change
    this required (the pencil-icon show/hide toggle went away since the
    form is always visible in its own section now). Preferred Race
    Length, Preferred Class, and Accomplishments were later removed from
    both this form and the read-only view per a follow-up request.
  - approvalQueueSection() is untouched -- same admin API calls, same
    fields. accountManagementSection()'s data/API calls are also
    untouched, but its Edit action now opens a centered modal (see
    showModal()/openEditUserModal()) instead of expanding a panel in
    place.
  - The League Management placeholder-buttons block is untouched, though
    it and Admin now sit above Settings/Log Out in the sidebar order
    (see buildSidebarNav()) instead of below.
  - mustChangePassword still forces a password change before anything
    else is usable — see renderProfile()/observePasswordBoxRemoval()
    below for how that's now implemented against the section-based nav
    (previously it was just another box on the one long page; now it
    replaces the whole dashboard until resolved, since there's no longer
    a single page for it to sit within).
  - The 30-minute inactivity auto-logout, the auth gate, and the Log Out
    button behavior are all unchanged.

  The shared fixed header (js/header.js) is now included too, same as
  every other page.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Race Club</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/reference-data.js"></script>
<script src="js/rulebook-content.js"></script>
<script src="js/header.js"></script>
</head>
<body>

<div id="rc-header"></div>
<!-- Logo-only placeholder until we actually know whether this session is
     valid -- see the LOAD PROFILE section below, which calls the real
     renderHeader() once its own API call resolves (or forceLoggedOut if
     it couldn't even reach the server). Showing the full logged-in avatar
     here immediately, before that's confirmed, was exactly the misleading
     "navbar looks logged in even though the API is unreachable" bug. -->
<script>renderHeaderPending();</script>

<!-- Mobile-only topbar. Logo removed -- the shared fixed site header
     (js/header.js, above) already shows it, so a second logo here was
     redundant. Hamburger sits alone on the left (see .rc-topbar's
     justify-content in style.css). -->
<div class="rc-topbar" id="rc-topbar">
  <button class="rc-hamburger" id="rc-hamburger" aria-label="Menu">&#9776;</button>
</div>

<div class="rc-shell">
  <aside class="rc-sidebar" id="rc-sidebar">
    <!-- The initials-placeholder avatar and Prospect/Rookie badge stack
         that used to sit here are gone -- the driver's avatar now lives
         inside the Dashboard's hero card instead (see dashboardHeroCard()
         below), so the nav list starts right at the top of the sidebar.
         Filled in by buildSidebarNav() below. League Management/Admin
         (when applicable) sit above Settings/Log Out at the bottom of
         this list -- see buildSidebarNav() for the exact order. -->
    <nav class="rc-sidebar-nav" id="rc-sidebar-nav"></nav>
  </aside>

  <main class="rc-main">
    <!-- Initial-load spinner -- sits in-page in the main content area,
         same "rc-inline-spinner-wrap" markup buildSpinner() below produces
         for Admin/Data Management's own first loads, so the sidebar and
         header stay visible (not dimmed out) while the account loads
         (Matt's call: show the spinner to the right of the sidebar, like
         Data Management does, instead of washing out the whole screen). -->
    <div id="rc-loading" class="rc-inline-spinner-wrap">
      <div class="rc-spinner"></div>
      <div class="rc-loading-text">Loading account information&hellip;</div>
    </div>
    <div id="rc-error" class="rc-message rc-error" style="display:none;"></div>

    <!-- Forced password-change lock screen -- shown instead of the
         normal dashboard whenever profile.mustChangePassword is true. -->
    <div id="rc-forced-password" style="display:none;"></div>

    <div id="rc-profile-root" style="display:none;">
      <section id="rc-section-dashboard" class="rc-content-section"></section>
      <section id="rc-section-calendar" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-finances" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-results" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-career" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-reputation" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-objectives" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-sponsors" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-halloffame" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-help" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-settings" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-league" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-admin" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-datamgmt" class="rc-content-section" style="display:none;"></section>
    </div>
  </main>
</div>

<script>
(function () {
  // ---------------------------------------------------------------------
  // SETUP / AUTH GATE (unchanged from v0.2.5)
  // ---------------------------------------------------------------------
  if (apiBaseUrlIsUnset()) {
    document.getElementById('rc-loading').style.display = 'none';
    var err = document.getElementById('rc-error');
    err.style.display = 'block';
    err.textContent = 'API_BASE_URL is not set. Edit js/api.js and paste in your Apps Script Web App URL.';
    return;
  }

  var token = redirectIfNoToken();
  if (!token) return; // already redirected to login.html

  startInactivityWatcher();

  // Called by the Logout nav item built in buildSidebarNav() below --
  // it used to be a static button wired here directly, but Logout now
  // lives inside the dynamically-built nav list itself, right after
  // Settings, so it's a named function the nav builder can attach instead.
  //
  // PERFORMANCE NOTE: this used to await the logout API call (fetchApi(...)
  // .catch().finally(() => { clearToken(); redirect })) before navigating
  // away -- so if Apps Script was slow to respond (cold start), the whole
  // page just sat there looking hung on click, even though nothing about
  // logging out actually depends on the server confirming first. Clearing
  // the local token and redirecting is what actually logs the browser
  // out; the server-side AuthTokens row getting deleted is just cleanup
  // that can happen in the background -- if it never completes (page
  // navigates away mid-request), the token simply sits unused until its
  // normal 7-day expiry, harmless. So now: clear + redirect immediately,
  // fire the API call without waiting on it.
  function doLogout() {
    fetchApi('logout', { method: 'POST', token: token }).catch(function () {});
    clearToken();
    window.location.href = 'login.html';
  }

  // Mobile menu open/close. While open: the page itself can't scroll (see
  // .rc-scroll-locked in style.css) -- the only ways out are picking a
  // link (showSection() below already closes the menu, see
  // closeMobileMenu() there), clicking anywhere outside the menu panel,
  // or clicking the hamburger again. A capturing document-level click
  // listener handles the "click off the menu" case: it only acts when
  // the menu is actually open, and ignores clicks on the hamburger itself
  // (which already has its own toggle handler -- without this check,
  // clicking the hamburger to close would immediately re-open it via the
  // same click bubbling to this listener).
  // Remembers where the page was scrolled to when the menu opened, so it
  // can be restored on close. Needed because the lock itself works by
  // pinning body to position: fixed (see .rc-scroll-locked in
  // style.css -- plain overflow: hidden alone doesn't reliably stop
  // touch scrolling on iOS Safari), which on its own would silently
  // snap the page back to the very top while locked.
  var scrollYBeforeLock = 0;
  function openMobileMenu() {
    document.getElementById('rc-sidebar').classList.add('rc-sidebar-open');
    scrollYBeforeLock = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = '-' + scrollYBeforeLock + 'px';
    document.body.classList.add('rc-scroll-locked');
  }
  function closeMobileMenu() {
    document.getElementById('rc-sidebar').classList.remove('rc-sidebar-open');
    document.body.classList.remove('rc-scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, scrollYBeforeLock);
  }
  document.getElementById('rc-hamburger').addEventListener('click', function (evt) {
    evt.stopPropagation();
    var sidebar = document.getElementById('rc-sidebar');
    if (sidebar.classList.contains('rc-sidebar-open')) closeMobileMenu();
    else openMobileMenu();
  });
  document.addEventListener('click', function (evt) {
    var sidebar = document.getElementById('rc-sidebar');
    if (!sidebar.classList.contains('rc-sidebar-open')) return;
    if (sidebar.contains(evt.target)) return; // click was on a nav link/inside the menu -- let it do its own thing
    closeMobileMenu();
  });

  // NOTE: the actual profile-loading code (fetch/render) is NOT here --
  // see the very bottom of this script, right before the IIFE closes, for
  // why. Short version: it calls renderProfile(), which touches `var`s
  // (NAV_ITEMS, the ICON_* constants, PLACEHOLDER_SECTION_IDS/LABELS)
  // declared further down this file. `var` declarations are hoisted but
  // their VALUE ASSIGNMENTS are not -- calling renderProfile() from here,
  // this early, read those as still-`undefined` and threw partway through
  // buildFullProfileUI() (right after setting the sidebar avatar's
  // initials, which is why that one thing DID show up), silently halting
  // the rest of this script. A page refresh worked fine because refresh
  // takes the async getProfile() branch instead of the synchronous
  // fresh-login branch, and by the time that .then() callback fires, the
  // whole script (including everything below) has already finished
  // running once, top to bottom -- so those vars were assigned by then.
  // Moving the load/render call to the bottom fixes the login-redirect
  // path the same way, unconditionally. This is the exact same bug class
  // as the TIMEZONE_LIST/populateRegisterTimezone issue documented
  // elsewhere in this project's history -- call order matters even for
  // hoisted `var`s.

  // `style` accepts EITHER an inline CSS string ("margin:0;color:red;") OR
  // a plain class name ("rc-hint") -- disambiguated by whether it contains
  // a colon. Unchanged from v0.2.5.
  function el(tag, style, html) {
    var e = document.createElement(tag);
    if (style) {
      if (style.indexOf(':') !== -1) e.style.cssText = style;
      else e.className = style;
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Same branded spinner used for the initial account load (see the
  // "#rc-loading" markup in <body> above, which is hand-written HTML
  // rather than built through here since it needs to exist before this
  // script even runs) -- this is the reusable, in-page version, e.g. for
  // the Admin section's first load (see ADMIN LAZY LOAD below). Just sits
  // inline wherever it's appended, not fixed-position.
  function buildSpinner(message) {
    var wrap = el('div', 'rc-inline-spinner-wrap');
    wrap.appendChild(el('div', 'rc-spinner'));
    wrap.appendChild(el('div', 'rc-loading-text', escapeHtml(message)));
    return wrap;
  }

  // ---------------------------------------------------------------------
  // GENERIC MODAL — centered dialog over a dimmed backdrop. Used by
  // Manage Users' "Edit" action (see openEditUserModal below) in place of
  // the old click-to-expand-in-place panel, per Matt's call that the
  // in-place pattern felt dated. Closes on: the X button, clicking the
  // dimmed backdrop outside the card, or Escape. Returns { body, close }
  // -- the caller appends whatever fields/buttons it needs into `body`.
  //
  // opts.wide: adds .rc-modal-wide (see style.css) for content that needs
  // more than the default 460px -- currently just the Season Creation
  // Wizard (see openSeasonWizard below).
  // opts.onClose: fired on EVERY close path (X, Escape, backdrop click,
  // or a caller-triggered modal.close()) -- the wizard uses this to
  // refresh League Management's button label ("Create Season" vs.
  // "Resume Season Draft") the moment the popup goes away, regardless of
  // how it was closed.
  // ---------------------------------------------------------------------
  function showModal(title, opts) {
    opts = opts || {};
    var backdrop = el('div', 'rc-modal-backdrop');
    var modal = el('div', 'rc-modal' + (opts.wide ? ' rc-modal-wide' : ''));

    var head = el('div', 'rc-modal-head');
    head.appendChild(el('h3', 'margin:0;', escapeHtml(title)));
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'rc-modal-close';
    closeBtn.innerHTML = '&times;';
    closeBtn.setAttribute('aria-label', 'Close');
    head.appendChild(closeBtn);
    modal.appendChild(head);

    var body = el('div', 'rc-modal-body');
    modal.appendChild(body);

    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);

    function close() {
      document.removeEventListener('keydown', onKeydown);
      backdrop.remove();
      if (opts.onClose) opts.onClose();
    }
    function onKeydown(evt) { if (evt.key === 'Escape') close(); }
    document.addEventListener('keydown', onKeydown);
    backdrop.addEventListener('click', function (evt) { if (evt.target === backdrop) close(); });
    closeBtn.addEventListener('click', close);

    return { body: body, close: close, el: modal };
  }

  // Flat, stroke-based icons (no emoji) -- inline SVG, same technique as
  // v0.2.5's ICON_LOCK/ICON_STAR/ICON_PEN, extended with one icon per new
  // sidebar item.
  var ICON_LOCK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';
  var ICON_STAR = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"></polygon></svg>';
  var ICON_PEN = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>';

  var ICON_NAV_STAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"></polygon></svg>';
  var ICON_DASHBOARD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>';
  var ICON_CALENDAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
  var ICON_RESULTS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="11"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="19" y1="20" x2="19" y2="14"></line></svg>';
  var ICON_CAREER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
  var ICON_FINANCES = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 6H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H7"></path></svg>';
  var ICON_SPONSORS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V4h7z"></path><circle cx="7.5" cy="7.5" r="1"></circle></svg>';
  var ICON_HALLOFFAME = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 5H4a3 3 0 0 0 3 4"></path><path d="M17 5h3a3 3 0 0 1-3 4"></path></svg>';
  var ICON_SETTINGS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path></svg>';
  var ICON_LEAGUE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M9 3v2h6V3"></path><line x1="8" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="16" y2="15"></line></svg>';
  var ICON_OBJECTIVES = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 11l2 2 4-4"></path><line x1="8" y1="16" x2="16" y2="16"></line></svg>';
  var ICON_ADMIN = ICON_LOCK.replace('width="18" height="18"', 'width="16" height="16"');
  var ICON_DATAMGMT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path></svg>';
  var ICON_LOGOUT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>';
  var ICON_HELP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.2 9a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2-2.6 3.6"></path><line x1="12" y1="17" x2="12" y2="17.2"></line></svg>';

  // ---------------------------------------------------------------------
  // CALENDAR ICONS — same flat, stroke-based technique as ICON_LOCK/
  // ICON_STAR above, one per race-detail stat the Calendar page shows
  // (see renderCalendarSection() and calStat() below). Kept a bit smaller
  // (16px, matching the sidebar icons) so a row of 5-6 of them next to
  // their values doesn't overwhelm a race card.
  // ---------------------------------------------------------------------

  // Primary 10-item nav. Reordered per Matt's call: Finances moved up to

  // Auto-inserts "/" while typing and blocks anything but digits, so the
  // field can only ever end up as MM/DD/YYYY -- backed up by the same
  // format check server-side in handleUpdateOwnProfile. Unchanged.
  function attachBirthdayFormatter(input) {
    input.setAttribute('placeholder', 'MM/DD/YYYY');
    input.setAttribute('maxlength', '10');
    input.addEventListener('input', function () {
      var digits = input.value.replace(/[^0-9]/g, '').slice(0, 8);
      var out = digits;
      if (digits.length > 4) out = digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4);
      else if (digits.length > 2) out = digits.slice(0, 2) + '/' + digits.slice(2);
      input.value = out;
    });
  }

  function initials(name) {
    var parts = (name || '').trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '?';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  // ---------------------------------------------------------------------
  // SIDEBAR NAV + SECTION SWITCHING
  // ---------------------------------------------------------------------
  // onClick defaults to showSection(id); Logout overrides it with doLogout
  // instead, since it's not a section at all.
  function makeNavButton(id, label, icon, elId, hiddenByDefault, onClick) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rc-nav-item';
    btn.dataset.section = id;
    if (elId) btn.id = elId;
    if (hiddenByDefault) btn.style.display = 'none';
    btn.innerHTML = icon + '<span>' + escapeHtml(label) + '</span>';
    btn.addEventListener('click', onClick || function () { showSection(id); });
    return btn;
  }

  function navDivider(elId) {
    var hr = document.createElement('hr');
    hr.className = 'rc-nav-divider';
    if (elId) hr.id = elId;
    return hr;
  }

  // Appends a hidden-by-default notification dot to a nav button, wired
  // to the button's own section id (rc-nav-dot-<id>) -- see setNavNotif()
  // below for what actually turns these on. Every primary nav item gets
  // one now (not just Admin), per the general design rule that ANY
  // sidebar link can have something waiting behind it (a sponsor offer,
  // a wager challenge, a finalized incident ruling, etc.), not just the
  // Admin approval queue.
  function addNavDot(btn, categoryId) {
    var dot = document.createElement('span');
    dot.className = 'rc-nav-dot';
    dot.id = 'rc-nav-dot-' + categoryId;
    dot.style.display = 'none';
    btn.appendChild(dot);
    return dot;
  }

  // Order, per Matt's call: the 9 general section links, a divider,
  // League Management and/or Admin (only if this user's permissions
  // unlock them), a second divider directly above Settings, then
  // Settings, then Log Out. The UPPER divider is hidden by default and
  // only revealed by renderLeagueSection()/renderAdminSection() (see
  // below) if at least one of League Management/Admin actually ends up
  // visible -- for a plain Driver, neither does, so without this it was
  // rendering as two dividers back to back with nothing shown between
  // them (both hidden buttons still sat there, just invisible), which is
  // exactly what looked like "two lines" instead of one.
  function buildSidebarNav() {
    var nav = document.getElementById('rc-sidebar-nav');
    nav.innerHTML = '';
    NAV_ITEMS.slice(0, -1).forEach(function (item) { // everything except Settings
      var btn = makeNavButton(item.id, item.label, item.icon, 'rc-nav-' + item.id);
      addNavDot(btn, item.id);
      nav.appendChild(btn);
    });
    var upperDivider = navDivider('rc-nav-divider-upper');
    upperDivider.style.display = 'none';
    nav.appendChild(upperDivider);
    // Order below Admin/Data Management/League Management (Matt's call) --
    // Admin's onClick does the normal section-switch AND triggers the lazy
    // load (see loadAdminSectionIfNeeded) -- the panel itself only builds
    // the first time this is actually clicked, not on every page load.
    var adminBtn = makeNavButton('admin', 'Admin', ICON_ADMIN, 'rc-nav-admin', true, function () {
      showSection('admin');
      loadAdminSectionIfNeeded(currentProfile, token);
    });
    // Notification dot -- see updatePendingDots()/approvalQueueSection()
    // below, which toggle this on (through setNavNotif()) once the
    // pending-approvals count is known. Same signal as the header
    // avatar's dot, just in-page.
    addNavDot(adminBtn, 'admin');
    nav.appendChild(adminBtn);
    // Data Management -- Admin only (gated on the 'manageReferenceData'
    // permission, see buildFullProfileUI below), lazy-built on first click
    // same as Admin itself. Tracks/Cars/Drivers reference data lives here
    // instead of being edited by hand in the Sheet.
    var dataMgmtBtn = makeNavButton('datamgmt', 'Data Management', ICON_DATAMGMT, 'rc-nav-datamgmt', true, function () {
      showSection('datamgmt');
      loadDataManagementSectionIfNeeded(currentProfile, token);
    });
    nav.appendChild(dataMgmtBtn);
    // League Management -- visible to Organizers and Admins, but the
    // "Create Season" button inside it is locked to Admins only (see
    // renderLeagueSection below).
    var leagueBtn = makeNavButton('league', 'League Management', ICON_LEAGUE, 'rc-nav-league', true);
    addNavDot(leagueBtn, 'league');
    nav.appendChild(leagueBtn);
    nav.appendChild(navDivider());
    // Help -- same section as Settings/Log Out (below the divider), sits
    // directly above Settings per Matt's call. Just a section-switch like
    // any other nav item (see renderHelpSection() below) -- no lazy load,
    // no permission gate, no notification dot.
    nav.appendChild(makeNavButton('help', 'Help', ICON_HELP, 'rc-nav-help'));
    var settingsItem = NAV_ITEMS[NAV_ITEMS.length - 1];
    nav.appendChild(makeNavButton(settingsItem.id, settingsItem.label, settingsItem.icon));
    nav.appendChild(makeNavButton('logout', 'Log Out', ICON_LOGOUT, 'rc-nav-logout', false, doLogout));
  }

  // Shows exactly one .rc-content-section and marks the matching sidebar
  // item active -- this replaces v0.2.5's anchor-scroll + highlight-only
  // behavior now that each nav item maps to genuinely different content.
  function showSection(id) {
    document.querySelectorAll('.rc-content-section').forEach(function (s) { s.style.display = 'none'; });
    var target = document.getElementById('rc-section-' + id);
    if (target) target.style.display = 'block';
    document.querySelectorAll('.rc-nav-item').forEach(function (btn) {
      btn.classList.toggle('rc-nav-active', btn.dataset.section === id);
    });
    closeMobileMenu(); // also lifts the scroll lock, not just the class the old direct removal handled
  }

  // PROFILE HEADER CARD (view-only) — ported from v0.2.5's
  // profileHeaderCard(), minus the pencil-icon edit toggle, since editing
  // now lives entirely in the Settings section (see renderSettingsSection
  // below). Every other bit of markup/behavior here (name/flag line, meta
  // row, view block) is identical. The Prospect/Rookie badge stack that
  // used to render alongside the sidebar avatar is gone entirely (per
  // Matt's call) -- Prospect status is still communicated via the banner
  // in renderDashboardSection() below; there's currently no other spot
  // Rookie status is shown.
  // ---------------------------------------------------------------------
  // Resolves which avatar image a driver shows: manufacturer-level image
  // once they've claimed a season entry (profile.avatarFile, set by the
  // not-yet-built claim system), generic.jpg otherwise. Every driver
  // currently falls back to generic.jpg since claiming isn't wired up
  // yet -- this is intentional, matches the stated default behavior.
  function avatarImageSrc(profile) {
    return 'assets/avatars/' + (profile.avatarFile || 'generic.jpg');
  }

  function buildNameLine(profile) {
    var nameLine = document.createElement('h2');
    nameLine.className = 'rc-name-line';
    var nameText = document.createElement('span');
    nameText.textContent = profile.displayName || profile.username;
    nameLine.appendChild(nameText);
    // Country shows as a styled code badge (e.g. "US") instead of an
    // emoji flag glyph -- emoji flags render inconsistently across OSes
    // (Windows shows the 2-letter code as plain text, not an image) and
    // looked out of place next to the rest of the site's flat, branded
    // UI. COUNTRY_CODES (js/reference-data.js) already has the 2-letter
    // code for every country in the picker, so no new data is needed.
    var code = COUNTRY_CODES[profile.country];
    if (code) {
      var codeBadge = document.createElement('span');
      codeBadge.className = 'rc-country-badge';
      codeBadge.textContent = code;
      nameLine.appendChild(codeBadge);
    }
    // Role pill (Driver/Organizer/Admin/Prospect) -- same chip styling as
    // the country badge (.rc-role-badge mirrors .rc-country-badge, see
    // style.css), sits right next to it per Matt's call.
    if (profile.role) {
      var roleBadge = document.createElement('span');
      roleBadge.className = 'rc-role-badge';
      roleBadge.textContent = profile.role;
      nameLine.appendChild(roleBadge);
    }
    return nameLine;
  }

  // Single "hero" container for the Dashboard: the driver's avatar image
  // top-left, name/meta/details alongside it, and the quick-glance
  // category widgets (Bank Balance, Reputation, etc.) inside the same
  // card underneath -- replaces the old two-piece layout (a separate
  // profile header card, then a separate widgets grid below it).
  function dashboardHeroCard(profile, token) {
    var card = el('div', 'rc-card rc-dashboard-hero');

    var topRow = el('div', 'rc-dash-hero-top');

    var avatarImg = document.createElement('img');
    avatarImg.className = 'rc-dash-avatar';
    avatarImg.src = avatarImageSrc(profile);
    avatarImg.alt = (profile.displayName || profile.username) + ' avatar';
    topRow.appendChild(avatarImg);

    var infoCol = el('div', 'min-width:0;flex:1;');
    infoCol.appendChild(buildNameLine(profile));
    var metaBits = ['@' + profile.username];
    if (profile.profileId) metaBits.push('Driver Profile: ' + profile.profileId);
    infoCol.appendChild(el('div', 'rc-meta-row', metaBits.join(' &middot; ')));
    var viewBlock = el('div', 'margin-top:14px;');
    renderProfileViewBlock(viewBlock, profile, token);
    infoCol.appendChild(viewBlock);
    topRow.appendChild(infoCol);

    card.appendChild(topRow);
    card.appendChild(buildDashboardWidgets(profile));

    return card;
  }

  function detailItem(label, value, isEmail) {
    var item = el('div', null);
    item.appendChild(el('div', 'rc-detail-label', escapeHtml(label)));
    if (isEmail) {
      var mailLink = document.createElement('a');
      mailLink.href = 'mailto:' + value;
      mailLink.className = 'rc-detail-value';
      mailLink.style.display = 'block';
      mailLink.textContent = value;
      item.appendChild(mailLink);
    } else {
      item.appendChild(el('div', 'rc-detail-value', escapeHtml(value)));
    }
    return item;

  // Maps a car class to the CSS variable holding its badge color -- see
  // CAR_CLASS_BADGE_COLOR_VAR in js/reference-data.js (single source,
  // shared with anywhere else a class needs the same color, e.g. the
  // Cars data-management list).
  function carClassBadgeColorVar(carClass) {
    return (typeof CAR_CLASS_BADGE_COLOR_VAR !== 'undefined' && CAR_CLASS_BADGE_COLOR_VAR[carClass]) || '--rc-steel';
  }

  // Current Seat block -- replaces the old Time Zone/Birthday/Contact
  // Email row per Matt's call. Shows the driver's real-world team seat:
  // manufacturer logo + team name + car number in a class-colored badge.
  // v0.20, Matt's follow-up correction: there is no "Unsigned" text state
  // any more -- a driver with no locked team sees the Register button
  // here instead (see registerButtonBlock() below), never a bare label.
  // v0.20.2, Matt's further follow-up: the "Current Seat" label itself is
  // gone too -- this block now renders just its content (the seat row, or
  // the Register button) with no heading above it at all.
  // carClass reads profile.currentClass (the season-cache field
  // buildProfilePayload actually returns, see Auth.gs) -- not the
  // never-populated profile.currentCarClass this originally (and
  // incorrectly) read.
  function currentSeatBlock(profile, token) {
    var wrap = el('div', 'rc-details-wrap');
    var teamName = profile.currentTeamName || '';
    var carNumber = profile.currentCarNumber || '';
    if (!teamName && !carNumber) {
      // No locked team -- the Register button IS the Current Seat content
      // in this state, per Matt's call. registerButtonBlock() itself
      // decides red-and-clickable vs. grey-and-disabled based on a live
      // getActiveSeason read; it is never hidden. Only Prospects (who
      // have no season visibility server-side -- getActiveSeason's
      // requireRole excludes that role) skip it entirely.
      if (profile.role !== 'Prospect') wrap.appendChild(registerButtonBlock(profile, token));
      return wrap;
    }
    var carClass = profile.currentClass || '';
    var manufacturer = profile.currentManufacturer || '';
    var row = el('div', 'rc-seat-row');
    if (manufacturer && typeof manufacturerLogoSrc === 'function') {
      var logo = document.createElement('img');
      logo.className = 'rc-seat-logo';
      logo.src = manufacturerLogoSrc(manufacturer);
      logo.alt = manufacturer;
      logo.onerror = function () { logo.style.display = 'none'; };
      row.appendChild(logo);
    }
    if (teamName) row.appendChild(el('span', 'rc-seat-team', escapeHtml(teamName)));
    if (carNumber) {
      var numBadge = el('span', 'rc-seat-number', escapeHtml(String(carNumber)));
      numBadge.style.background = 'var(' + carClassBadgeColorVar(carClass) + ')';
      row.appendChild(numBadge);
    }
    wrap.appendChild(row);
    return wrap;
  }

  function renderProfileViewBlock(container, profile, token) {
    if (profile.aboutMe) container.appendChild(el('p', 'rc-about-me', '“' + escapeHtml(profile.aboutMe) + '”'));

    // Time Zone/Birthday/Contact Email used to render here as a details
    // row -- replaced with the Current Seat block below per Matt's call
    // (see currentSeatBlock() above). Preferred Race Length, Preferred
    // Class, and Accomplishments were removed from both this view and the
    // Settings edit form per an earlier follow-up request -- the backend
    // fields/columns still exist (untouched), they're just not shown or
    // editable here. TimeZone/Birthday/ContactEmail are the same: still
    // collected/editable in Settings, just no longer displayed here.
    container.appendChild(currentSeatBlock(profile, token));
  }

  // ---------------------------------------------------------------------
  // SEASON REGISTRATION (v0.20, Phase 2) -- the Register button under
  // Current Seat, the Choose Class popup (Step 1), and the Choose Team
  // popup (Step 2), wired to the getActiveSeason/chooseClass/
  // getAvailableTeams/joinTeam actions (see 4_DataCache.gs). Sponsors/
  // Objectives (Steps 3-4) are a later phase -- a driver who locks a team
  // here lands back on a Dashboard that still shows those as "Coming
  // soon" until that phase exists.
  //
  // COST MODEL (Matt's v0.19 correction, load-bearing for this whole
  // section): every driver in a class pays the SAME per-race retainer --
  // set once per season, identical across every team. What varies per
  // team is a ONE-TIME entrance fee, charged once at lock, on top of
  // that season-standard retainer. Never show a per-team "per race" cost
  // anywhere in this UI.
  // ---------------------------------------------------------------------
  function formatMoney(n) {
    n = Number(n) || 0;
    return '$' + n.toLocaleString();
  }

  // Renders the Register button (or hides itself entirely) based on a
  // fresh getActiveSeason read -- always re-fetched on render rather than
  // trusted off the cached profile object, since profile.registrationStatus
  // isn't part of buildProfilePayload's response today and this is the
  // one place that actually needs to know it live.
  function registerButtonBlock(profile, token) {
    var wrap = el('div', 'margin-top:12px;');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rc-btn-secondary rc-btn-sm';
    btn.disabled = true;
    btn.textContent = 'Checking season status...';
    wrap.appendChild(btn);

    // Grey + disabled -- the default/fallback look, used for every state
    // where there's nothing to click right now: no active season, a
    // season that hasn't opened registration, or a failed/loading fetch.
    // Per Matt's call, this button is NEVER hidden -- only a locked team
    // (handled one level up, in currentSeatBlock) replaces it entirely.
    function setGreyed(label) {
      btn.className = 'rc-btn-secondary rc-btn-sm';
      btn.disabled = true;
      btn.onclick = null;
      btn.textContent = label;
    }

    function refresh() {
      fetchApi('getActiveSeason', { token: token }).then(function (data) {
        if (!data || !data.success || !data.hasActiveSeason) { setGreyed('No Season Open For Registration'); return; }

        // Already locked in for THIS season -- shouldn't normally reach
        // here at all (currentSeatBlock only calls registerButtonBlock
        // when profile has no locked team), but a driver's cached profile
        // object can be stale for a moment if a lock happened in another
        // tab -- grey-disabled rather than pretending nothing changed.
        if (data.registrationStatus === 'TeamLocked' || data.registrationStatus === 'Complete') {
          setGreyed('Already Registered — Refresh the Page');
          return;
        }

        if (!data.registrationOpen) { setGreyed('Registration Not Open Yet'); return; }

        btn.className = 'rc-btn-primary rc-btn-sm';
        btn.disabled = false;
        btn.textContent = (data.registrationStatus === 'ClassChosen' && data.currentClass)
          ? 'Continue Registration — Choose a Team'
          : 'Register for ' + (data.seasonName || 'This Season');

        btn.onclick = function () {
          if (data.registrationStatus === 'ClassChosen' && data.currentClass) {
            openTeamSelectModal(profile, token, data.seasonId, data.currentClass, refresh);
          } else {
            openChooseClassModal(profile, token, data, refresh);
          }
        };
      }).catch(function () {
        setGreyed('Could Not Load Season Status');
      });
    }

    refresh();
    return wrap;
  }

  // Step 1 -- Choose a Class. Shows every class this season tracks
  // (data.classesTracked), each greyed out with its Reputation
  // requirement if this driver doesn't clear CAR_CLASS_REPUTATION_FLOOR
  // for it yet (client-side hint only -- handleChooseClass re-checks
  // server-side regardless, same as every other gated action on this
  // site). Classes with no floor (LMGT3/LMP3) are always clickable.
  function openChooseClassModal(profile, token, activeSeasonData, onDone) {
    // Closing without picking a class (X/Escape/backdrop) still refreshes
    // the Register button so it reflects reality -- harmless no-op if
    // nothing changed, but needed if the driver picked a class, THEN
    // closed the team-select modal that opened on top of this one without
    // locking a team (registerButtonBlock's own refresh call handles
    // that "Continue Registration" state on the next render).
    var closedByPick = false;
    var modal = showModal('Choose Your Class — ' + (activeSeasonData.seasonName || ''), {
      onClose: function () { if (onDone && !closedByPick) onDone(); }
    });
    var body = modal.body;
    body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin-bottom:14px;',
      'Pick the class you’ll compete in this season. You’ll choose a specific team next -- the per-race retainer is the same for every team in a class, only the one-time entrance fee to join varies.'));

    var status = el('div', 'margin-top:10px;font-size:13px;color:var(--rc-red);');
    var reputation = (profile.reputationScore === null || profile.reputationScore === undefined) ? 300 : Number(profile.reputationScore);

    var classes = (activeSeasonData.classesTracked && activeSeasonData.classesTracked.length)
      ? activeSeasonData.classesTracked : CAR_CLASS_LIST;

    classes.forEach(function (cls) {
      var floor = (typeof CAR_CLASS_REPUTATION_FLOOR !== 'undefined' && CAR_CLASS_REPUTATION_FLOOR[cls] !== undefined) ? CAR_CLASS_REPUTATION_FLOOR[cls] : 0;
      var eligible = reputation >= floor;

      var row = el('div', 'padding:12px 0;border-bottom:1px solid var(--rc-silver);display:flex;align-items:center;justify-content:space-between;gap:12px;');
      var label = el('div', null);
      var badge = el('span', null, escapeHtml(cls));
      badge.style.cssText = 'display:inline-block;padding:2px 8px;border-radius:4px;color:#fff;font-weight:700;font-size:12px;background:var(' + carClassBadgeColorVar(cls) + ');';
      label.appendChild(badge);
      label.appendChild(el('div', 'color:var(--rc-steel);font-size:12px;margin-top:4px;',
        floor > 0 ? ('Requires ' + floor + '+ Reputation (you have ' + reputation + ')') : 'Open to every driver'));
      row.appendChild(label);

      var pickBtn = el('button', null, eligible ? 'Choose' : 'Not Yet Eligible');
      pickBtn.type = 'button';
      pickBtn.className = 'rc-btn-secondary rc-btn-sm';
      pickBtn.disabled = !eligible;
      row.appendChild(pickBtn);

      pickBtn.addEventListener('click', function () {
        pickBtn.disabled = true;
        status.style.color = 'var(--rc-red)';
        status.textContent = '';
        fetchApi('chooseClass', { method: 'POST', token: token, body: { seasonId: activeSeasonData.seasonId, carClass: cls } })
          .then(function (data) {
            if (!data.success) {
              pickBtn.disabled = false;
              status.textContent = data.message || 'Could not choose that class.';
              return;
            }
            closedByPick = true;
            modal.close();
            openTeamSelectModal(profile, token, activeSeasonData.seasonId, cls, onDone);
          })
          .catch(function () {
            pickBtn.disabled = false;
            status.textContent = 'Could not reach the server. Try again in a moment.';
          });
      });

      body.appendChild(row);
    });

    body.appendChild(status);
  }

  // Step 2 -- Choose a Team. seasonId/carClass are already locked in
  // (chooseClass already succeeded, or this is a "Continue Registration"
  // re-open). Renders every team getAvailableTeams returns, each with its
  // one-time entrance fee + the season-standard per-race retainer shown
  // separately so the cost model reads honestly, not as one lump number
  // that looks per-team. `taken` teams render disabled, not hidden, per
  // the design doc. onLocked is called after a successful joinTeam so the
  // caller (registerButtonBlock's refresh, or the button's own onclick)
  // can re-render the dashboard.
  function openTeamSelectModal(profile, token, seasonId, carClass, onLocked) {
    var modal = showModal('Choose Your Team — ' + carClass, { wide: true, onClose: function () { if (onLocked) onLocked(); } });
    var body = modal.body;
    body.appendChild(buildSpinner('Loading available teams...'));

    function load() {
      body.innerHTML = '';
      body.appendChild(buildSpinner('Loading available teams...'));
      fetchApi('getAvailableTeams', { token: token, params: { seasonId: seasonId, carClass: carClass } })
        .then(function (data) {
          body.innerHTML = '';
          if (!data.success) {
            body.appendChild(el('p', 'color:var(--rc-red);', data.message || 'Could not load teams.'));
            return;
          }
          renderTeams(data);
        })
        .catch(function () {
          body.innerHTML = '';
          body.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server. Try again in a moment.'));
        });
    }

    function renderTeams(data) {
      body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin-bottom:6px;',
        'Every team’s per-race retainer is the same for ' + carClass + ' this season: ' + formatMoney(data.perRaceRetainerRate) +
        ' × ' + data.raceCount + ' race' + (data.raceCount === 1 ? '' : 's') + ' = ' + formatMoney(data.seasonRetainerTotal) +
        ' (escrowed, not spent). What varies below is each team’s one-time entrance fee, charged once when you lock in.'));

      var noticeSlot = el('div');
      body.appendChild(noticeSlot);

      if (!data.teams || !data.teams.length) {
        body.appendChild(el('p', 'color:var(--rc-steel);', 'No teams are available for ' + carClass + ' yet.'));
        return;
      }

      data.teams.forEach(function (team) {
        var totalCost = data.seasonRetainerTotal + team.oneTimeEntryFee;
        var card = el('div', 'rc-panel');
        card.style.marginTop = '12px';
        if (team.taken) card.style.opacity = '0.5';

        var head = el('div', 'display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;');
        var nameCol = el('div');
        var titleRow = el('div', null);
        if (team.manufacturer && typeof manufacturerLogoSrc === 'function') {
          var logo = document.createElement('img');
          logo.src = manufacturerLogoSrc(team.manufacturer);
          logo.alt = team.manufacturer;
          logo.style.cssText = 'height:20px;vertical-align:middle;margin-right:8px;';
          logo.onerror = function () { logo.style.display = 'none'; };
          titleRow.appendChild(logo);
        }
        var teamNameSpan = document.createElement('span');
        teamNameSpan.style.fontWeight = '700';
        teamNameSpan.textContent = (team.teamName || 'Unnamed Team') + (team.carNumber ? ' #' + team.carNumber : '');
        titleRow.appendChild(teamNameSpan);
        nameCol.appendChild(titleRow);
        if (team.manufacturer || team.carModel) {
          nameCol.appendChild(el('div', 'color:var(--rc-steel);font-size:12px;margin-top:2px;',
            escapeHtml([team.manufacturer, team.carModel].filter(Boolean).join(' · '))));
        }
        head.appendChild(nameCol);

        var costCol = el('div', 'text-align:right;');
        costCol.appendChild(el('div', 'font-weight:700;', formatMoney(totalCost) + ' up front'));
        costCol.appendChild(el('div', 'color:var(--rc-steel);font-size:12px;',
          'Entrance fee ' + formatMoney(team.oneTimeEntryFee) + ' + retainer ' + formatMoney(data.seasonRetainerTotal)));
        head.appendChild(costCol);
        card.appendChild(head);

        if (team.pro || team.con) {
          var proCon = el('div', 'margin-top:8px;font-size:12px;');
          if (team.pro) proCon.appendChild(el('div', 'color:var(--rc-ok);', '+ ' + escapeHtml(team.pro)));
          if (team.con) proCon.appendChild(el('div', 'color:var(--rc-red);', '− ' + escapeHtml(team.con)));
          card.appendChild(proCon);
        }
        if (team.bonusTrigger || team.penaltyTrigger) {
          var perks = el('div', 'margin-top:6px;font-size:12px;color:var(--rc-steel);');
          if (team.bonusTrigger) perks.appendChild(el('div', null, 'Bonus: ' + escapeHtml(team.bonusTrigger) + ' → +' + formatMoney(team.bonusAmount)));
          if (team.penaltyTrigger) perks.appendChild(el('div', null, 'Penalty: ' + escapeHtml(team.penaltyTrigger) + ' → −' + formatMoney(team.penaltyAmount)));
          card.appendChild(perks);
        }

        var joinBtn = el('button', null, team.taken ? 'Seat Taken' : 'Join This Team');
        joinBtn.type = 'button';
        joinBtn.className = 'rc-btn-primary rc-btn-sm';
        joinBtn.style.marginTop = '12px';
        joinBtn.disabled = !!team.taken;
        card.appendChild(joinBtn);

        var rowStatus = el('div', 'margin-top:6px;font-size:12px;');
        card.appendChild(rowStatus);

        joinBtn.addEventListener('click', function () {
          joinBtn.disabled = true;
          rowStatus.style.color = 'var(--rc-red)';
          rowStatus.textContent = '';
          fetchApi('joinTeam', { method: 'POST', token: token, body: { seasonId: seasonId, entryId: team.entryId } })
            .then(function (res) {
              if (res.success) {
                Object.assign(profile, {
                  currentTeamName: res.teamName, currentCarNumber: res.carNumber,
                  currentManufacturer: res.manufacturer, currentClass: carClass,
                  bankBalanceAvailable: res.bankBalanceAvailable, bankBalanceFrozen: res.bankBalanceFrozen
                });
                setProfileCache(profile);
                showTeamLockedConfirmation(modal, res, carClass, function () {
                  renderDashboardSection(profile, token);
                  showSection('dashboard');
                });
                return;
              }
              if (res.error === 'TEAM_TAKEN') {
                noticeSlot.innerHTML = '';
                noticeSlot.appendChild(el('div', 'rc-banner',
                  'That team was just claimed by another driver — pick a different one below.'));
                load(); // refetch so the taken seat now shows disabled and any other changes are current
                return;
              }
              joinBtn.disabled = team.taken;
              rowStatus.textContent = res.message || 'Could not lock that seat.';
            })
            .catch(function () {
              joinBtn.disabled = false;
              rowStatus.textContent = 'Could not reach the server. Try again in a moment.';
            });
        });

        body.appendChild(card);
      });
    }

    load();
  }

  // Replaces the team-select modal's body with a short confirmation once
  // joinTeam succeeds -- same "land back on an updated view is the
  // confirmation" pattern as editProfilePanel's save, but this one
  // involves real money moving so it gets an explicit summary first
  // rather than just silently closing.
  function showTeamLockedConfirmation(modal, res, carClass, onDone) {
    var body = modal.body;
    body.innerHTML = '';
    body.appendChild(el('h3', 'margin-top:0;color:var(--rc-ok);', 'Seat Locked'));
    body.appendChild(el('p', null, escapeHtml(res.teamName || '') + ' #' + escapeHtml(String(res.carNumber || '')) + ' — ' + escapeHtml(carClass)));
    var summary = el('div', 'rc-panel');
    summary.appendChild(el('div', null, 'One-time entrance fee: ' + formatMoney(res.oneTimeEntryFeePaid)));
    summary.appendChild(el('div', null, 'Season retainer escrowed: ' + formatMoney(res.seasonRetainerEscrowed)));
    summary.appendChild(el('div', 'font-weight:700;margin-top:6px;', 'Total charged: ' + formatMoney(res.totalCost)));
    summary.appendChild(el('div', 'color:var(--rc-steel);font-size:12px;margin-top:10px;',
      'Available balance: ' + formatMoney(res.bankBalanceAvailable) + ' · Frozen (escrowed): ' + formatMoney(res.bankBalanceFrozen)));
    body.appendChild(summary);
    var doneBtn = el('button', null, 'Done'); doneBtn.className = 'rc-btn-primary rc-btn-sm'; doneBtn.style.marginTop = '14px';
    doneBtn.addEventListener('click', function () {
      // modal.close() also fires openTeamSelectModal's own onClose (which
      // refreshes the Register button -- it'll now hide itself since this
      // driver just locked a seat), but that's a different callback from
      // onDone here (the actual dashboard re-render) -- both need to run.
      modal.close();
      if (onDone) onDone();
    });
    body.appendChild(doneBtn);
  }

  function buildSelect(options, selectedValue, placeholder) {
    var select = document.createElement('select');
    var blankOpt = document.createElement('option');
    blankOpt.value = ''; blankOpt.textContent = placeholder;
    select.appendChild(blankOpt);
    options.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      if (opt === selectedValue) o.selected = true;
      select.appendChild(o);
    });
    return select;
  }

  function fieldPairRow(labelA, fieldA, labelB, fieldB) {
    var row = el('div', 'rc-field-pair');
    var colA = el('div', null);
    colA.appendChild(el('label', 'margin-top:0;', labelA));
    colA.appendChild(fieldA);
    var colB = el('div', null);
    colB.appendChild(el('label', 'margin-top:0;', labelB));
    colB.appendChild(fieldB);
    row.appendChild(colA);
    row.appendChild(colB);
    return row;
  }

  // ---------------------------------------------------------------------
  // EDIT PROFILE FORM — identical fields/validation/fetchApi('updateOwnProfile')
  // call as v0.2.5's editProfilePanel(). Only the outer show/hide wiring
  // changed: v0.2.5 toggled this panel open/closed behind a pencil icon on
  // the header card; now it always renders inline in the Settings section,
  // so onCancel just resets the fields instead of hiding a panel.
  // ---------------------------------------------------------------------
  function editProfilePanel(profile, token, onSaved, onCancel) {
    var panel = el('div');

    var dnInput = el('input'); dnInput.value = profile.displayName || '';
    var aboutInput = el('input'); aboutInput.value = profile.aboutMe || ''; aboutInput.maxLength = 140;

    var countrySelect = buildSelect(COUNTRIES, profile.country, 'Select a country');
    var timezoneList = getTimezoneList();
    var timezoneSelect = buildSelect(timezoneList, profile.timeZone, 'Select a time zone');
    timezoneList.forEach(function (tz, i) { timezoneSelect.options[i + 1].textContent = timezoneLabel(tz); });

    var birthdayInput = el('input'); birthdayInput.type = 'text'; birthdayInput.value = profile.birthday || '';
    attachBirthdayFormatter(birthdayInput);
    var contactEmailInput = el('input'); contactEmailInput.type = 'email'; contactEmailInput.value = profile.contactEmail || ''; contactEmailInput.placeholder = 'you@example.com';

    // Preferred Race Length, Preferred Class, and Accomplishments were
    // removed from this form (and from the read-only view above) per
    // Matt's call. The backend fields/columns and updateOwnProfile's
    // handling of them are untouched -- just not sent from here anymore,
    // so any existing saved values are left alone, not cleared.
    function resetFields() {
      dnInput.value = profile.displayName || '';
      aboutInput.value = profile.aboutMe || '';
      countrySelect.value = profile.country || '';
      timezoneSelect.value = profile.timeZone || '';
      birthdayInput.value = profile.birthday || '';
      contactEmailInput.value = profile.contactEmail || '';
      status.textContent = '';
    }

    var basicsGroup = el('div', 'rc-section');
    [
      el('label', 'margin-top:0;', 'Display Name'), dnInput,
      el('label', null, 'About Me'), aboutInput,
      el('div', 'rc-hint', 'Describe yourself in one phrase, or insert a fact about yourself.')
    ].forEach(function (elm) { basicsGroup.appendChild(elm); });
    panel.appendChild(basicsGroup);

    var detailsGroup = el('div', 'rc-section');
    detailsGroup.appendChild(fieldPairRow('Country', countrySelect, 'Time Zone', timezoneSelect));
    detailsGroup.appendChild(fieldPairRow('Birthday', birthdayInput, 'Contact Email', contactEmailInput));
    panel.appendChild(detailsGroup);

    // .rc-btn-sm on both -- same fix as the League Management action row
    // and the wizard footer (see the .rc-btn-sm comment in style.css):
    // .rc-btn-primary alone is sized for a full-width form submit (12px
    // padding), .rc-btn-secondary alone is sized smaller (8px padding),
    // so side by side without .rc-btn-sm they render at different
    // heights ("make the save button the same height as the cancel
    // button" -- Matt's bug report). .rc-btn-sm's own min-width was later
    // reduced (see style.css) so "Save" doesn't look like a small word in
    // a wide button.
    var saveBtn = el('button', null, 'Save');
    saveBtn.className = 'rc-btn-primary rc-btn-sm';
    // Gap above the button row so it doesn't sit crammed right under the
    // Birthday/Contact Email fields (Matt's bug report) -- .rc-btn-sm
    // resets margin-top to 0 (needed for the side-by-side row itself to
    // line up), so the spacing has to be added back here explicitly.
    saveBtn.style.marginTop = '24px';

    var cancelBtn = el('button', null, 'Cancel');
    cancelBtn.className = 'rc-btn-secondary rc-btn-sm';
    cancelBtn.type = 'button';
    cancelBtn.style.marginLeft = '8px';
    cancelBtn.style.marginTop = '24px';

    var status = el('div', 'margin-top:8px;font-size:13px;');

    cancelBtn.addEventListener('click', function () {
      resetFields();
      if (onCancel) onCancel();
    });

    saveBtn.addEventListener('click', function () {
      if (birthdayInput.value && !/^\d{2}\/\d{2}\/\d{4}$/.test(birthdayInput.value)) {
        status.style.color = 'var(--rc-red)';
        status.textContent = 'Birthday must be a complete MM/DD/YYYY date.';
        return;
      }
      saveBtn.disabled = true;
      var payload = {
        displayName: dnInput.value.trim(),
        aboutMe: aboutInput.value.trim(),
        country: countrySelect.value,
        timeZone: timezoneSelect.value,
        birthday: birthdayInput.value.trim(),
        contactEmail: contactEmailInput.value.trim()
      };
      fetchApi('updateOwnProfile', { method: 'POST', token: token, body: payload })
        .then(function (data) {
          saveBtn.disabled = false;
          if (data.success) {
            // No "Saved." notification -- landing back on the Dashboard
            // with the updated info visible is confirmation enough.
            status.textContent = '';
            onSaved(payload);
          } else {
            status.style.color = 'var(--rc-red)';
            status.textContent = data.message || 'Could not save.';
          }
        })
        .catch(function () {
          saveBtn.disabled = false;
          status.style.color = 'var(--rc-red)';
          status.textContent = 'Could not reach the server. Try again in a moment.';
        });
    });

    panel.appendChild(saveBtn);
    panel.appendChild(cancelBtn);
    panel.appendChild(status);
    return panel;
  }

  // ---------------------------------------------------------------------
  // DASHBOARD — widget cards (Bank Balance, Reputation, Season Progress,
  // Recent Results, Objectives, Sponsor Status). v0.20, Phase 3: Bank
  // Balance/Reputation/Team Details/Season Progress now read the real
  // per-driver cache fields buildProfilePayload already returns
  // (bankBalanceAvailable/Frozen, reputationScore, currentTeamName/etc.,
  // registrationStatus) and drop the "Coming Soon" badge once real data
  // exists -- same "goes real, badge disappears" pattern Calendar/Help/
  // Objectives already established. Recent Results and Upcoming Race stay
  // placeholders -- there's still no backend action that returns a
  // driver's own race history or the season's real schedule yet (see the
  // "Known gap" note in site-status.md). Objectives/Sponsor Status stay
  // placeholders too -- Steps 3-4 of Season Registration (the actual
  // sponsor/objective catalogs and pick UI) aren't built yet, so showing
  // anything there would be fabricated, not real.
  // ---------------------------------------------------------------------
  function widgetCard(title, bodyHtml) {
    var card = el('div', 'rc-card rc-widget-card');
    var head = el('div', 'rc-widget-head');
    head.appendChild(el('h4', 'rc-widget-title', title));
    head.appendChild(el('span', 'rc-coming-soon-badge', 'Coming Soon'));
    card.appendChild(head);
    card.appendChild(el('div', 'rc-widget-body', bodyHtml));
    return card;
  }

  // Same shell as widgetCard(), minus the "Coming Soon" badge -- for a
  // widget that's showing genuinely real data, not a placeholder.
  function liveWidgetCard(title, bodyEl) {
    var card = el('div', 'rc-card rc-widget-card');
    var head = el('div', 'rc-widget-head');
    head.appendChild(el('h4', 'rc-widget-title', title));
    card.appendChild(head);
    var body = el('div', 'rc-widget-body');
    if (typeof bodyEl === 'string') body.innerHTML = bodyEl;
    else body.appendChild(bodyEl);
    card.appendChild(body);
    return card;
  }

  // Three explicit rows, per Matt's exact layout call, instead of one
  // auto-flowing grid -- each row is its own flex container with
  // proportional widths (see .rc-dash-row/.rc-widget-wide in style.css),
  // deliberately kept to the same 4-unit split (two 1-unit cards + one
  // 2-unit wide card) on Row 1 and Row 3 so equivalent-role cards
  // (Bank Balance/Reputation vs. Season Progress/Recent Results, Team
  // Details vs. Upcoming Race) render at identical widths across rows --
  // Matt's call: "make Season Progress and Recent Results the same size
  // as Bank Balance and Reputation" / "upcoming race the same size as
  // team details." Row 2 groups Wagers in with Objectives and Sponsor
  // Status, all three wide -- Matt asked for a wide Wagers card but
  // didn't say which row it belongs in, and it reads as the same kind of
  // "what's waiting on you" widget as those two, so that's where it
  // landed; easy to move if that's not the fit.
  function dashRow() {
    return el('div', 'rc-dash-row');
  }

  function buildDashboardWidgets(profile) {
    var wrap = el('div');
    var hasTeam = !!(profile.currentTeamName || profile.currentCarNumber);

    // Row 1: Bank Balance - Reputation - Team Details (wide)
    var row1 = dashRow();

    if (profile.bankBalanceAvailable !== null && profile.bankBalanceAvailable !== undefined) {
      row1.appendChild(liveWidgetCard('Bank Balance',
        '<div class="rc-widget-big">' + formatMoney(profile.bankBalanceAvailable) + '</div>' +
        '<p class="rc-widget-sub">' + formatMoney(profile.bankBalanceFrozen || 0) + ' frozen (escrowed)</p>'));
    } else {
      row1.appendChild(widgetCard('Bank Balance',
        '<div class="rc-widget-big">$--</div><p class="rc-widget-sub">Career earnings tracking is coming soon.</p>'));
    }

    if (profile.reputationScore !== null && profile.reputationScore !== undefined) {
      var repPct = Math.max(0, Math.min(100, profile.reputationScore / 10));
      row1.appendChild(liveWidgetCard('Reputation',
        '<div class="rc-meter"><div class="rc-meter-fill" style="width:' + repPct + '%;"></div></div>' +
        '<p class="rc-widget-sub">' + profile.reputationScore + ' / 1000</p>'));
    } else {
      row1.appendChild(widgetCard('Reputation',
        '<div class="rc-meter"><div class="rc-meter-fill" style="width:0%;"></div></div><p class="rc-widget-sub">No reputation data yet.</p>'));
    }

    var teamDetails;
    if (hasTeam) {
      var tdBody = el('div');
      var tdRow = el('div', 'rc-seat-row');
      if (profile.currentManufacturer && typeof manufacturerLogoSrc === 'function') {
        var tdLogo = document.createElement('img');
        tdLogo.className = 'rc-seat-logo';
        tdLogo.src = manufacturerLogoSrc(profile.currentManufacturer);
        tdLogo.alt = profile.currentManufacturer;
        tdLogo.onerror = function () { tdLogo.style.display = 'none'; };
        tdRow.appendChild(tdLogo);
      }
      if (profile.currentTeamName) tdRow.appendChild(el('span', 'rc-seat-team', escapeHtml(profile.currentTeamName)));
      if (profile.currentCarNumber) {
        var tdBadge = el('span', 'rc-seat-number', escapeHtml(String(profile.currentCarNumber)));
        tdBadge.style.background = 'var(' + carClassBadgeColorVar(profile.currentClass || '') + ')';
        tdRow.appendChild(tdBadge);
      }
      tdBody.appendChild(tdRow);
      if (profile.currentClass) tdBody.appendChild(el('p', 'rc-widget-sub', escapeHtml(profile.currentClass) + ' Class'));
      teamDetails = liveWidgetCard('Team Details', tdBody);
    } else {
      teamDetails = widgetCard('Team Details',
        '<p class="rc-widget-sub">No team seat claimed yet — your team, car, and seat details will show here once you join a season.</p>');
    }
    teamDetails.classList.add('rc-widget-wide');
    row1.appendChild(teamDetails);
    wrap.appendChild(row1);

    // Row 2: Objectives - Sponsor Status - Wagers, all wide. Still
    // placeholders -- Season Registration Steps 3-4 (the sponsor/
    // objective catalogs and the pick-3 UI) aren't built yet, so there's
    // no real data to show here even for a driver who's locked a team.
    var row2 = dashRow();
    var objectivesWidget = widgetCard('Objectives',
      '<div class="rc-checklist">' +
        '<label><input type="checkbox" disabled> --</label>' +
        '<label><input type="checkbox" disabled> --</label>' +
        '<label><input type="checkbox" disabled> --</label>' +
      '</div>');
    objectivesWidget.classList.add('rc-widget-wide');
    row2.appendChild(objectivesWidget);
    var sponsorStatus = widgetCard('Sponsor Status',
      '<p class="rc-widget-sub">No sponsor relationships yet.</p>');
    sponsorStatus.classList.add('rc-widget-wide');
    row2.appendChild(sponsorStatus);
    var wagers = widgetCard('Wagers',
      '<p class="rc-widget-sub">No active wagers. Wagering unlocks once Season Registration is complete.</p>');
    wagers.classList.add('rc-widget-wide');
    row2.appendChild(wagers);
    wrap.appendChild(row2);

    // Row 3: Season Progress - Recent Results (wide) - Upcoming Race (wide)
    var row3 = dashRow();
    var seasonProgress;
    var status = profile.registrationStatus || '';
    if (status === 'TeamLocked' || status === 'Complete') {
      seasonProgress = liveWidgetCard('Season Progress',
        '<div class="rc-meter"><div class="rc-meter-fill" style="width:100%;"></div></div>' +
        '<p class="rc-widget-sub">Registered' + (profile.currentClass ? ' — ' + escapeHtml(profile.currentClass) : '') + '. Seat locked in.</p>');
    } else if (status === 'ClassChosen') {
      seasonProgress = liveWidgetCard('Season Progress',

  function passwordChangeSection(token) {
    var box = document.createElement('div');
    box.className = 'rc-panel';
    box.style.borderColor = 'var(--rc-red)';
    box.appendChild(el('h3', 'margin-top:0;font-size:15px;', 'Change Password'));
    var cur = el('input'); cur.type = 'password'; cur.placeholder = 'Current password';
    var next = el('input'); next.type = 'password'; next.placeholder = 'New password (8+ characters)';
    var confirm = el('input'); confirm.type = 'password'; confirm.placeholder = 'Confirm new password';
    // rc-btn-sm -- same standard row-button size as Save/Cancel above it
    // (Matt's call: "make the Update Password button the same height and
    // font size as the Save/Cancel buttons"). Bare .rc-btn-primary alone
    // is sized for a full-width form submit (14px font, 12px padding),
    // which read visibly bigger/taller than the Settings panel's other
    // buttons right above it.
    var btn = el('button', null, 'Update Password'); btn.className = 'rc-btn-primary rc-btn-sm'; btn.style.marginTop = '14px';
    var status = el('div', 'margin-top:8px;font-size:13px;');

    btn.addEventListener('click', function () {
      if (next.value !== confirm.value) {
        status.style.color = 'var(--rc-red)';
        status.textContent = 'New password and confirmation don\'t match.';
        return;
      }
      fetchApi('changeOwnPassword', { method: 'POST', token: token, body: { currentPassword: cur.value, newPassword: next.value } })
        .then(function (data) {
          status.style.color = data.success ? 'var(--rc-ok)' : 'var(--rc-red)';
          status.textContent = data.message || (data.success ? 'Updated.' : 'Failed.');
          if (data.success) { cur.value = ''; next.value = ''; confirm.value = ''; box.remove(); }
        });
    });

    box.appendChild(cur); box.appendChild(next); box.appendChild(confirm); box.appendChild(btn); box.appendChild(status);
    return box;
  }
