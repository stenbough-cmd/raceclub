<!--
  Race Club — Account.html  (v0.5.0, sidebar-only rebuild)

  WHY THIS REBUILD: the v0.4.0 file had grown to ~5,200 lines of real
  section content (Dashboard widgets, Calendar, Objectives, League
  Management's Season Creation Wizard, Admin's approval queue + user
  management, Data Management's Tracks/Cars/Drivers editors, Settings'
  edit-profile form) built against features and schema that have since
  moved out from under it (see login.html/register.html/verify.html's
  email-based-login rebuild). Rather than patch a page full of stale
  assumptions one section at a time, Matt's call was to strip it back to
  just the shell -- the black sidebar, its full set of links, the
  section-switching behavior, the auth gate, and the one truly essential
  piece of business logic (the forced password-change lock screen) -- and
  rebuild each section's real content one link at a time going forward.

  WHAT'S KEPT, EXACTLY AS BEFORE:
  - The full sidebar nav: the same 10 primary items (Dashboard / Calendar
    / Finances / Results / Career / Reputation / Objectives / Sponsors /
    Hall of Fame / Settings) in the same order, plus the same
    permission-gated items (League Management, Admin, Data Management)
    and the same Help / Settings / Log Out row at the bottom, all with
    their original icons.
  - showSection() section-switching, the mobile hamburger menu + scroll
    lock, the 30-minute inactivity auto-logout, the auth gate, and the
    "arrived via a fresh login vs. need a getProfile call" fast path --
    all unchanged in behavior.
  - The mustChangePassword forced password-change lock screen. This is
    the one section this pass did NOT hollow out: it's a security gate
    that runs before the sidebar even shows, not a link a driver clicks
    into, so it stays fully functional using the same passwordChangeSection()
    form as before.

  WHAT'S GONE (for now): every section's actual content. Each of the 14
  content sections now renders a single centered "Coming soon" placeholder
  panel (see renderPlaceholderSections()) instead of real data, widgets,
  or admin tooling. That includes Settings' edit-profile form -- normal
  profile editing goes through Settings same as any other link, so it's
  empty too for now; only the change-password FORM ITSELF survives,
  because the forced-password lock screen depends on it directly.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Race Club</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/reference-data.js"></script>
<script src="js/rulebook-content.js"></script>
<script src="js/header.js"></script>
</head>
<body>

<div id="rc-header"></div>
<!-- Logo-only placeholder until we actually know whether this session is
     valid -- see the LOAD PROFILE section below, which calls the real
     renderHeader() once its own API call resolves (or forceLoggedOut if
     it couldn't even reach the server). -->
<script>renderHeaderPending();</script>

<!-- Mobile-only topbar. -->
<div class="rc-topbar" id="rc-topbar">
  <button class="rc-hamburger" id="rc-hamburger" aria-label="Menu">&#9776;</button>
</div>

<div class="rc-shell">
  <aside class="rc-sidebar" id="rc-sidebar">
    <!-- Filled in by buildSidebarNav() below. -->
    <nav class="rc-sidebar-nav" id="rc-sidebar-nav"></nav>
  </aside>

  <main class="rc-main">
    <div id="rc-loading" class="rc-inline-spinner-wrap">
      <div class="rc-spinner"></div>
      <div class="rc-loading-text">Loading account information&hellip;</div>
    </div>
    <div id="rc-error" class="rc-message rc-error" style="display:none;"></div>

    <!-- Forced password-change lock screen -- shown instead of the
         normal dashboard whenever profile.mustChangePassword is true. -->
    <div id="rc-forced-password" style="display:none;"></div>

    <div id="rc-profile-root" style="display:none;">
      <section id="rc-section-dashboard" class="rc-content-section"></section>
      <section id="rc-section-calendar" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-finances" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-results" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-career" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-reputation" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-objectives" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-sponsors" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-halloffame" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-help" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-settings" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-league" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-admin" class="rc-content-section" style="display:none;"></section>
      <section id="rc-section-datamgmt" class="rc-content-section" style="display:none;"></section>
    </div>
  </main>
</div>

<!-- Site footer -- on every page. -->
<footer class="rc-site-footer">
  Copyright Race Club 2026. All rights reserved. Created and developed with the help of Claude AI.
</footer>

<script>
(function () {
  // ---------------------------------------------------------------------
  // SETUP / AUTH GATE
  // ---------------------------------------------------------------------
  if (apiBaseUrlIsUnset()) {
    document.getElementById('rc-loading').style.display = 'none';
    var err = document.getElementById('rc-error');
    err.style.display = 'block';
    err.textContent = 'API_BASE_URL is not set. Edit js/api.js and paste in your Apps Script Web App URL.';
    return;
  }

  var token = redirectIfNoToken();
  if (!token) return; // already redirected to login.html

  startInactivityWatcher();

  // Called by the Logout nav item built in buildSidebarNav() below.
  // Clears the local token and redirects immediately, without waiting on
  // the server-side logout call to finish -- if it never completes, the
  // token just sits unused until its normal 7-day expiry, harmless.
  function doLogout() {
    fetchApi('logout', { method: 'POST', token: token }).catch(function () {});
    clearToken();
    window.location.href = 'login.html';
  }

  // Mobile menu open/close. While open, the page itself can't scroll (see
  // .rc-scroll-locked in style.css). Remembers scroll position so it can
  // be restored on close.
  var scrollYBeforeLock = 0;
  function openMobileMenu() {
    document.getElementById('rc-sidebar').classList.add('rc-sidebar-open');
    scrollYBeforeLock = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = '-' + scrollYBeforeLock + 'px';
    document.body.classList.add('rc-scroll-locked');
  }
  function closeMobileMenu() {
    document.getElementById('rc-sidebar').classList.remove('rc-sidebar-open');
    document.body.classList.remove('rc-scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, scrollYBeforeLock);
  }
  document.getElementById('rc-hamburger').addEventListener('click', function (evt) {
    evt.stopPropagation();
    var sidebar = document.getElementById('rc-sidebar');
    if (sidebar.classList.contains('rc-sidebar-open')) closeMobileMenu();
    else openMobileMenu();
  });
  document.addEventListener('click', function (evt) {
    var sidebar = document.getElementById('rc-sidebar');
    if (!sidebar.classList.contains('rc-sidebar-open')) return;
    if (sidebar.contains(evt.target)) return; // click was on a nav link/inside the menu -- let it do its own thing
    closeMobileMenu();
  });

  // NOTE: the actual profile-loading code is at the very bottom of this
  // script, not here -- renderProfile()/buildFullProfileUI() below touch
  // `var`s (NAV_ITEMS, the ICON_* constants) whose VALUE ASSIGNMENTS
  // aren't hoisted, so calling them this early (before those assignments
  // have run, on the synchronous fresh-login path) would throw partway
  // through. Moving the load/render call to the bottom fixes that
  // unconditionally.

  // `style` accepts EITHER an inline CSS string ("margin:0;color:red;")
  // OR a plain class name ("rc-hint") -- disambiguated by whether it
  // contains a colon.
  function el(tag, style, html) {
    var e = document.createElement(tag);
    if (style) {
      if (style.indexOf(':') !== -1) e.style.cssText = style;
      else e.className = style;
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // Flat, stroke-based icons (no emoji) -- one per sidebar item, unchanged
  // from v0.4.0.
  var ICON_DASHBOARD = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"></rect><rect x="13" y="3" width="8" height="8" rx="1"></rect><rect x="3" y="13" width="8" height="8" rx="1"></rect><rect x="13" y="13" width="8" height="8" rx="1"></rect></svg>';
  var ICON_CALENDAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>';
  var ICON_RESULTS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="11"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="19" y1="20" x2="19" y2="14"></line></svg>';
  var ICON_CAREER = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>';
  var ICON_FINANCES = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 6H9.5a2.5 2.5 0 0 0 0 5h5a2.5 2.5 0 0 1 0 5H7"></path></svg>';
  var ICON_NAV_STAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"></polygon></svg>';
  var ICON_SPONSORS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12l-8 8-9-9V4h7z"></path><circle cx="7.5" cy="7.5" r="1"></circle></svg>';
  var ICON_HALLOFFAME = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M7 5H4a3 3 0 0 0 3 4"></path><path d="M17 5h3a3 3 0 0 1-3 4"></path></svg>';
  var ICON_SETTINGS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path></svg>';
  var ICON_LEAGUE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M9 3v2h6V3"></path><line x1="8" y1="11" x2="16" y2="11"></line><line x1="8" y1="15" x2="16" y2="15"></line></svg>';
  var ICON_OBJECTIVES = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 11l2 2 4-4"></path><line x1="8" y1="16" x2="16" y2="16"></line></svg>';
  var ICON_LOCK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';
  var ICON_ADMIN = ICON_LOCK.replace('width="18" height="18"', 'width="16" height="16"');
  var ICON_DATAMGMT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path></svg>';
  var ICON_LOGOUT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>';
  var ICON_HELP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.2 9a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2-2.6 3.6"></path><line x1="12" y1="17" x2="12" y2="17.2"></line></svg>';

  // Same 10-item primary nav, same order, as v0.4.0. League Management,
  // Admin, and Data Management are appended separately in buildSidebarNav
  // below since they're permission-gated rather than always shown.
  var NAV_ITEMS = [
    { id: 'dashboard', label: 'Dashboard', icon: ICON_DASHBOARD },
    { id: 'calendar', label: 'Calendar', icon: ICON_CALENDAR },
    { id: 'finances', label: 'Finances', icon: ICON_FINANCES },
    { id: 'results', label: 'Results', icon: ICON_RESULTS },
    { id: 'career', label: 'Career', icon: ICON_CAREER },
    { id: 'reputation', label: 'Reputation', icon: ICON_NAV_STAR },
    { id: 'objectives', label: 'Objectives', icon: ICON_OBJECTIVES },
    { id: 'sponsors', label: 'Sponsors', icon: ICON_SPONSORS },
    { id: 'halloffame', label: 'Hall of Fame', icon: ICON_HALLOFFAME },
    { id: 'settings', label: 'Settings', icon: ICON_SETTINGS }
  ];

  // Every section is a placeholder for now (see renderPlaceholderSections
  // below) -- this list is what drives both the placeholder panels and
  // their headings. Order doesn't matter here, only sectio IDs and labels.
  var PLACEHOLDER_LABELS = {
    dashboard: 'Dashboard', calendar: 'Calendar', finances: 'Finances',
    results: 'Results', career: 'Career', reputation: 'Reputation',
    objectives: 'Objectives', sponsors: 'Sponsors', halloffame: 'Hall of Fame',
    settings: 'Settings', help: 'Help', league: 'League Management',
    admin: 'Admin', datamgmt: 'Data Management'
  };

  // ---------------------------------------------------------------------
  // SIDEBAR NAV + SECTION SWITCHING
  // ---------------------------------------------------------------------
  function makeNavButton(id, label, icon, elId, hiddenByDefault, onClick) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rc-nav-item';
    btn.dataset.section = id;
    if (elId) btn.id = elId;
    if (hiddenByDefault) btn.style.display = 'none';
    btn.innerHTML = icon + '<span>' + escapeHtml(label) + '</span>';
    btn.addEventListener('click', onClick || function () { showSection(id); });
    return btn;
  }

  function navDivider(elId) {
    var hr = document.createElement('hr');
    hr.className = 'rc-nav-divider';
    if (elId) hr.id = elId;
    return hr;
  }

  function showUpperNavDivider() {
    document.getElementById('rc-nav-divider-upper').style.display = '';
  }

  // Order: the 10 general section links, a divider, Admin/Data
  // Management/League Management (only if this user's permissions unlock
  // them), a second divider, then Help, Settings, Log Out -- identical
  // order to v0.4.0.
  function buildSidebarNav() {
    var nav = document.getElementById('rc-sidebar-nav');
    nav.innerHTML = '';
    NAV_ITEMS.slice(0, -1).forEach(function (item) { // everything except Settings
      nav.appendChild(makeNavButton(item.id, item.label, item.icon, 'rc-nav-' + item.id));
    });
    var upperDivider = navDivider('rc-nav-divider-upper');
    upperDivider.style.display = 'none';
    nav.appendChild(upperDivider);
    var adminBtn = makeNavButton('admin', 'Admin', ICON_ADMIN, 'rc-nav-admin', true);
    nav.appendChild(adminBtn);
    var dataMgmtBtn = makeNavButton('datamgmt', 'Data Management', ICON_DATAMGMT, 'rc-nav-datamgmt', true);
    nav.appendChild(dataMgmtBtn);
    var leagueBtn = makeNavButton('league', 'League Management', ICON_LEAGUE, 'rc-nav-league', true);
    nav.appendChild(leagueBtn);
    nav.appendChild(navDivider());
    nav.appendChild(makeNavButton('help', 'Help', ICON_HELP, 'rc-nav-help'));
    var settingsItem = NAV_ITEMS[NAV_ITEMS.length - 1];
    nav.appendChild(makeNavButton(settingsItem.id, settingsItem.label, settingsItem.icon));
    nav.appendChild(makeNavButton('logout', 'Log Out', ICON_LOGOUT, 'rc-nav-logout', false, doLogout));
  }

  // Shows exactly one .rc-content-section and marks the matching sidebar
  // item active.
  function showSection(id) {
    document.querySelectorAll('.rc-content-section').forEach(function (s) { s.style.display = 'none'; });
    var target = document.getElementById('rc-section-' + id);
    if (target) target.style.display = 'block';
    document.querySelectorAll('.rc-nav-item').forEach(function (btn) {
      btn.classList.toggle('rc-nav-active', btn.dataset.section === id);
    });
    closeMobileMenu();
  }

  // ---------------------------------------------------------------------
  // PLACEHOLDER PANELS -- every section, no fake data, just a centered
  // heading + message. Replace one at a time with real content as each
  // link gets built out.
  // ---------------------------------------------------------------------
  function renderPlaceholderSections() {
    Object.keys(PLACEHOLDER_LABELS).forEach(function (id) {
      var section = document.getElementById('rc-section-' + id);
      if (!section) return;
      section.innerHTML = '';
      var wrap = el('div', 'rc-placeholder-panel');
      wrap.appendChild(el('h2', null, PLACEHOLDER_LABELS[id]));
      wrap.appendChild(el('p', 'color:var(--rc-steel);', 'Coming soon.'));
      section.appendChild(wrap);
    });
  }

  // ---------------------------------------------------------------------
  // CHANGE PASSWORD -- kept fully functional (unchanged from v0.4.0)
  // because the forced-password lock screen below depends on it directly.
  // Not currently reachable any other way, since Settings itself is just
  // a placeholder for now.
  // ---------------------------------------------------------------------
  function passwordChangeSection(token) {
    var box = document.createElement('div');
    box.className = 'rc-panel';
    box.style.borderColor = 'var(--rc-red)';
    box.appendChild(el('h3', 'margin-top:0;font-size:15px;', 'Change Password'));
    var cur = el('input'); cur.type = 'password'; cur.placeholder = 'Current password';
    var next = el('input'); next.type = 'password'; next.placeholder = 'New password (8+ characters)';
    var confirm = el('input'); confirm.type = 'password'; confirm.placeholder = 'Confirm new password';
    var btn = el('button', null, 'Update Password'); btn.className = 'rc-btn-primary rc-btn-sm'; btn.style.marginTop = '14px';
    var status = el('div', 'margin-top:8px;font-size:13px;');

    btn.addEventListener('click', function () {
      if (next.value !== confirm.value) {
        status.style.color = 'var(--rc-red)';
        status.textContent = 'New password and confirmation don\'t match.';
        return;
      }
      fetchApi('changeOwnPassword', { method: 'POST', token: token, body: { currentPassword: cur.value, newPassword: next.value } })
        .then(function (data) {
          status.style.color = data.success ? 'var(--rc-ok)' : 'var(--rc-red)';
          status.textContent = data.message || (data.success ? 'Updated.' : 'Failed.');
          if (data.success) { cur.value = ''; next.value = ''; confirm.value = ''; box.remove(); }
        });
    });

    box.appendChild(cur); box.appendChild(next); box.appendChild(confirm); box.appendChild(btn); box.appendChild(status);
    return box;
  }

  // ---------------------------------------------------------------------
  // TOP-LEVEL RENDER
  // ---------------------------------------------------------------------
  function buildFullProfileUI(profile, token) {
    buildSidebarNav();
    document.getElementById('rc-sidebar-nav').classList.remove('rc-nav-loading');
    renderPlaceholderSections();

    var perms = profile.permissions || [];
    if (perms.indexOf('manageSchedule') !== -1 || perms.indexOf('uploadResults') !== -1) {
      document.getElementById('rc-nav-league').style.display = 'flex';
      showUpperNavDivider();
    }
    if (perms.indexOf('manageUsers') !== -1) {
      document.getElementById('rc-nav-admin').style.display = 'flex';
      showUpperNavDivider();
    }
    if (perms.indexOf('manageReferenceData') !== -1) {
      document.getElementById('rc-nav-datamgmt').style.display = 'flex';
      showUpperNavDivider();
    }

    showSection('dashboard');
  }

  // mustChangePassword forces a password change before the driver can do
  // anything else -- the sidebar/topbar stay hidden and #rc-forced-password
  // shows ONLY the passwordChangeSection() form until it succeeds.
  // passwordChangeSection removes its own box from the DOM on a
  // successful change (see its `box.remove()` call); a MutationObserver
  // watches for that removal and then builds the normal shell, so the
  // forced-password logic is otherwise untouched from v0.4.0.
  function renderProfile(profile, token) {
    if (profile.mustChangePassword) {
      document.getElementById('rc-sidebar').style.display = 'none';
      document.getElementById('rc-topbar').style.display = 'none';

      var lockWrap = document.getElementById('rc-forced-password');
      lockWrap.style.display = 'block';
      lockWrap.innerHTML = '';

      var container = el('div', 'rc-forced-password-wrap');
      container.appendChild(el('p', null, 'For security, please set a new password before continuing to your profile.'));
      var box = passwordChangeSection(token);
      container.appendChild(box);
      lockWrap.appendChild(container);

      var observer = new MutationObserver(function () {
        if (!document.body.contains(box)) {
          observer.disconnect();
          lockWrap.style.display = 'none';
          document.getElementById('rc-sidebar').style.display = '';
          document.getElementById('rc-topbar').style.display = '';
          profile.mustChangePassword = false;
          buildFullProfileUI(profile, token);
        }
      });
      observer.observe(container, { childList: true, subtree: true });
      return;
    }

    buildFullProfileUI(profile, token);
  }

  // ---------------------------------------------------------------------
  // LOAD PROFILE -- deliberately the LAST thing in this script (see the
  // comment near the top of the auth gate for why).
  //
  // Arriving here right after a successful login skips a second getProfile
  // round-trip: login.html's own response already IS a full profile
  // payload, stashed in sessionStorage under 'raceclub_fresh_profile'
  // right before redirecting here. It's read-once (removed immediately),
  // so any other way of arriving at this page still fetches fresh data.
  // ---------------------------------------------------------------------
  document.getElementById('rc-sidebar-nav').classList.add('rc-nav-loading');
  buildSidebarNav();

  var freshProfileRaw = sessionStorage.getItem('raceclub_fresh_profile');
  if (freshProfileRaw) sessionStorage.removeItem('raceclub_fresh_profile');
  var freshProfile = null;
  if (freshProfileRaw) {
    try { freshProfile = JSON.parse(freshProfileRaw); } catch (err) { freshProfile = null; }
  }

  if (freshProfile && freshProfile.success) {
    renderHeader({ skipNotifCheck: true });
    document.getElementById('rc-loading').style.display = 'none';
    document.getElementById('rc-profile-root').style.display = 'block';
    renderProfile(freshProfile, token);
  } else {
    fetchApi('getProfile', { token: token })
      .then(function (data) {
        if (!data.success) {
          clearToken();
          sessionStorage.setItem('raceclub_login_message', 'Your session expired — please log in again.');
          window.location.href = 'login.html';
          return;
        }
        setProfileCache(data); // keeps the header avatar current on every other page too
        renderHeader({ skipNotifCheck: true }); // confirmed by the API -- safe to show as logged in
        document.getElementById('rc-loading').style.display = 'none';
        document.getElementById('rc-profile-root').style.display = 'block';
        renderProfile(data, token);
      })
      .catch(function () {
        renderHeader({ forceLoggedOut: true });
        document.getElementById('rc-loading').style.display = 'none';
        var err = document.getElementById('rc-error');
        err.style.display = 'block';
        err.textContent = 'Could not reach the server. Check API_BASE_URL and try again.';
      });
  }
})();
</script>
</body>
</html>
