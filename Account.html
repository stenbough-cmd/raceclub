    econPanel.appendChild(previewLine('Wager Stake Cap', state.economy.wagerStakeCapPct + '% of available'));
    container.appendChild(econPanel);

    var racesPanel = el('div', 'rc-panel'); racesPanel.style.marginTop = '12px';
    racesPanel.appendChild(el('h4', 'margin-top:0;color:var(--rc-red);', 'Race Events (' + state.races.length + ')'));
    if (!state.races.length) {
      racesPanel.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'No races configured.'));
    } else {
      var previewRaceDates = computeRaceDates(state);
      state.races.forEach(function (race, idx) {
        var trackLine = (previewRaceDates[idx] || '(date not set)') + ' — ' +
          (race.track || '(no track)') + (race.layout ? ' — ' + race.layout : '');
        var detailsLine = race.tier + ' · ' + (race.weather || 'Clear') +
          ' · ' + (race.chanceOfRain || 0) + '% Rain / ' + (race.temperatureC === undefined ? 20 : race.temperatureC) + '°C' +
          ' · Race Start ' + (race.igRaceStart || '(not set)');
        racesPanel.appendChild(previewLine('Race ' + (idx + 1), trackLine));
        racesPanel.appendChild(previewLine('', detailsLine));
      });
    }
    container.appendChild(racesPanel);

    if (state.specialEvents.length) {
      var specialPanel = el('div', 'rc-panel'); specialPanel.style.marginTop = '12px';
      specialPanel.appendChild(el('h4', 'margin-top:0;color:var(--rc-red);', 'Special Events (' + state.specialEvents.length + ')'));
      state.specialEvents.forEach(function (evt, idx) {
        var moneyTotal = evt.moneyPlaces.reduce(function (sum, v) { return sum + (Number(v) || 0); }, 0);
        var bonusTotal = SPECIAL_EVENT_BONUS_CATEGORIES.reduce(function (sum, c) { return sum + (Number(evt.bonusPayouts[c.key]) || 0); }, 0);
        var trackLine = (evt.date || '(date not set)') + ' at ' + (evt.startTime || '(time not set)') +
          ' · ' + (evt.track || '(no track)') + (evt.layout ? ' — ' + evt.layout : '');
        var detailsLine = (evt.raceLengthMinutes || '?') + ' min · ' + (evt.weather || 'Clear') +
          ' · ' + (evt.chanceOfRain || 0) + '% Rain / ' + (evt.temperatureC === undefined ? 20 : evt.temperatureC) + '°C' +
          ' · Race Start ' + (evt.igRaceStart || '(not set)') +
          ' · Top 10 pool $' + moneyTotal.toLocaleString() + ' · Bonus categories $' + bonusTotal.toLocaleString();
        specialPanel.appendChild(previewLine((evt.eventName || 'Special Event ' + (idx + 1)), trackLine));
        specialPanel.appendChild(previewLine('', detailsLine));
      });
      container.appendChild(specialPanel);
    }
  }

  // A saved draft can predate a wizard field/shape change (e.g. Bonus
  // Points moving from three booleans to a bonusPoints{} map, or the old
  // per-class Economy fields being removed) -- reading a field that no
  // longer exists on an old draft used to throw mid-render and leave the
  // "Resume Season Draft" popup completely empty (the exception aborted
  // openSeasonWizard() before renderStep() ever ran). Layering the saved
  // draft on top of a fresh defaultWizardState() -- deep-merged for the
  // nested objects -- guarantees every field the current wizard expects
  // is present, using the saved value where there is one and today's
  // default everywhere else.
  function normalizeWizardState(saved) {
    var base = defaultWizardState();
    if (!saved) return base;
    var merged = Object.assign({}, base, saved);
    merged.classes = Object.assign({}, base.classes, saved.classes || {});
    merged.classSeasons = Object.assign({}, base.classSeasons, saved.classSeasons || {});
    merged.bonusPoints = Object.assign({}, base.bonusPoints, saved.bonusPoints || {});
    merged.raceSettings = Object.assign({}, base.raceSettings, saved.raceSettings || {});
    merged.economy = Object.assign({}, base.economy, saved.economy || {});
    merged.pointsTables = saved.pointsTables || base.pointsTables;
    return merged;
  }

  function openSeasonWizard() {
    var existingDraft = loadWizardDraft();
    var state = normalizeWizardState(existingDraft);
    var stepIndex = 0;
    var modal = showModal('Create a Season', { wide: true, onClose: function () { if (typeof renderLeagueManagementSection === 'function') renderLeagueManagementSection(token); } });
    var body = modal.body;
    var stepsBar = el('div', 'rc-wizard-steps');
    var contentWrap = el('div', 'rc-wizard-content');
    var footerBar = el('div', 'rc-wizard-actions');
    body.appendChild(stepsBar);
    body.appendChild(contentWrap);
    body.appendChild(footerBar);

    var lastStep = WIZARD_STEPS.length - 1;
    var currentRequiredEls = [];
    var maxUnlockedStep = 0;

    if (existingDraft) {
      // Belt-and-suspenders: normalizeWizardState() above should already
      // make this safe, but a probe render is throwaway work anyway --
      // never let it take the whole wizard down if some future field
      // mismatch slips through. Worst case, the admin just starts back at
      // Step 1 instead of wherever they left off.
      try {
        var probeEls0 = [];
        renderWizardSeasonDetailsPage(state, el('div'), probeEls0);
        if (probeEls0.every(function (entry) { return entry.isValid(); })) {
          maxUnlockedStep = 1;
          syncRaceCount(state); syncByeWeekDates(state); syncSpecialEvents(state);
          var probeEls1 = [];
          renderWizardRaceEventsPage(state, el('div'), probeEls1);
          if (probeEls1.every(function (entry) { return entry.isValid(); })) {
            maxUnlockedStep = 2;
          }
        }
      } catch (err) {
        maxUnlockedStep = 0;
      }
    }

    function goToStep(i) {
      saveWizardDraft(state);
      stepIndex = i;
      renderStep();
    }

    function validateCurrentStep() {
      var allValid = true;
      currentRequiredEls.forEach(function (entry) {
        if (entry.isValid()) { entry.clearInvalid(); }
        else { entry.markInvalid(); allValid = false; }
      });
      return allValid;
    }
    function shakeModal() {
      modal.el.classList.remove('rc-shake');
      void modal.el.offsetWidth;
      modal.el.classList.add('rc-shake');
    }

    function renderStep() {
      stepsBar.innerHTML = '';
      WIZARD_STEPS.forEach(function (label, i) {
        var locked = i > maxUnlockedStep;
        var cls = 'rc-wizard-step' + (i === stepIndex ? ' rc-wizard-step-active' : '') + (i < stepIndex ? ' rc-wizard-step-done' : '') + (locked ? ' rc-wizard-step-locked' : '');
        var bubble = el('div', cls, (i + 1) + '. ' + escapeHtml(label));
        if (!locked) {
          bubble.style.cursor = 'pointer';
          bubble.addEventListener('click', function () { if (i !== stepIndex) goToStep(i); });
        }
        stepsBar.appendChild(bubble);
      });

      contentWrap.innerHTML = '';
      currentRequiredEls = [];
      if (stepIndex === 0) renderWizardSeasonDetailsPage(state, contentWrap, currentRequiredEls);
      else if (stepIndex === 1) {
        syncRaceCount(state); syncByeWeekDates(state); syncSpecialEvents(state);
        renderWizardRaceEventsPage(state, contentWrap, currentRequiredEls);
      }
      else renderWizardPreviewPage(state, contentWrap);
      contentWrap.scrollTop = 0;

      footerBar.innerHTML = '';

      if (stepIndex === lastStep) {
        footerBar.style.alignItems = 'flex-end';

        var saveBtn = el('button', null, 'Save & Close');
        saveBtn.className = 'rc-btn-secondary rc-btn-sm'; saveBtn.type = 'button';
        saveBtn.addEventListener('click', function () { saveWizardDraft(state); modal.close(); });
        footerBar.appendChild(saveBtn);

        var rightGroup = el('div', 'display:flex;gap:8px;align-items:flex-end;');

        var backBtn = el('button', null, 'Back');
        backBtn.className = 'rc-btn-secondary rc-btn-sm rc-btn-nav'; backBtn.type = 'button';
        backBtn.addEventListener('click', function () { goToStep(stepIndex - 1); });
        rightGroup.appendChild(backBtn);

        var createWrap = el('div', 'position:relative;');
        var btnRow = el('div', 'display:flex;gap:8px;flex-wrap:wrap;');
        var createNowBtn = el('button', null, 'Create Season');
        createNowBtn.className = 'rc-btn-primary rc-btn-sm'; createNowBtn.type = 'button';
        createNowBtn.addEventListener('click', function () { state.releaseMode = 'now'; finishWizard(); });
        btnRow.appendChild(createNowBtn);

        var futureBtn = el('button', null, 'Create a Future Season');
        futureBtn.className = 'rc-btn-secondary rc-btn-sm'; futureBtn.type = 'button';
        btnRow.appendChild(futureBtn);
        createWrap.appendChild(btnRow);

        var futurePanel = el('div', 'rc-panel');
        futurePanel.style.cssText = 'position:absolute;bottom:calc(100% + 8px);right:0;display:none;width:320px;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,0.15);';
        var futureHead = el('div', 'display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;');
        futureHead.appendChild(el('span', 'font-family:var(--rc-font-heading);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--rc-carbon);', 'Release Date/Time'));
        var closeFutureBtn = el('button', null, '×');
        closeFutureBtn.type = 'button';
        closeFutureBtn.style.cssText = 'background:none;border:none;font-size:18px;line-height:1;color:var(--rc-steel);cursor:pointer;padding:0 2px;';
        futureHead.appendChild(closeFutureBtn);
        futurePanel.appendChild(futureHead);
        var dt = el('input'); dt.type = 'datetime-local'; dt.value = state.releaseDateTime || '';
        dt.style.margin = '0';
        dt.addEventListener('input', function () { state.releaseDateTime = dt.value; });
        futurePanel.appendChild(dt);
        futurePanel.appendChild(el('div', 'rc-hint',
          'Real team seats are first-come-first-served, so a scheduled release gives every driver an equal shot at one.'));
        var confirmFutureBtn = el('button', null, 'Confirm & Create');
        confirmFutureBtn.className = 'rc-btn-primary rc-btn-sm'; confirmFutureBtn.type = 'button';
        confirmFutureBtn.addEventListener('click', function () {
          // The backend flips a Scheduled season to Registration by comparing
          // against this same clock (see seasonDetails.releaseAtUtc in
          // finishWizard) -- a blank or already-past pick would either never
          // fire or fire immediately, neither of which is what "Create a
          // Future Season" promises, so it's caught here before the call.
          var releaseAt = state.releaseDateTime ? new Date(state.releaseDateTime) : null;
          if (!releaseAt || isNaN(releaseAt.getTime()) || releaseAt.getTime() <= Date.now()) {
            showToast('Pick a release date/time in the future first.', 'error');
            return;
          }
          state.releaseMode = 'scheduled';
          finishWizard();
        });
        futurePanel.appendChild(confirmFutureBtn);
        createWrap.appendChild(futurePanel);

        function openFuturePanel() {
          futurePanel.style.display = 'block';
          createNowBtn.disabled = true;
          futureBtn.disabled = true;
        }
        function closeFuturePanel() {
          futurePanel.style.display = 'none';
          createNowBtn.disabled = false;
          futureBtn.disabled = false;
        }
        futureBtn.addEventListener('click', openFuturePanel);
        closeFutureBtn.addEventListener('click', closeFuturePanel);
        rightGroup.appendChild(createWrap);

        footerBar.appendChild(rightGroup);
      } else {
        footerBar.style.alignItems = 'center';

        var saveBtnNorm = el('button', null, 'Save & Close');
        saveBtnNorm.className = 'rc-btn-secondary rc-btn-sm'; saveBtnNorm.type = 'button';
        saveBtnNorm.addEventListener('click', function () { saveWizardDraft(state); modal.close(); });
        footerBar.appendChild(saveBtnNorm);

        var navOuter = el('div');
        var navGroup = el('div', 'display:flex;gap:8px;');
        if (stepIndex > 0) {
          var backBtnNorm = el('button', null, 'Back');
          backBtnNorm.className = 'rc-btn-secondary rc-btn-sm rc-btn-nav'; backBtnNorm.type = 'button';
          backBtnNorm.addEventListener('click', function () { goToStep(stepIndex - 1); });
          navGroup.appendChild(backBtnNorm);
        }
        var nextBtn = el('button', null, 'Next');
        nextBtn.className = 'rc-btn-primary rc-btn-sm rc-btn-nav'; nextBtn.type = 'button';
        nextBtn.addEventListener('click', function () {
          if (validateCurrentStep()) {
            maxUnlockedStep = Math.max(maxUnlockedStep, stepIndex + 1);
            goToStep(stepIndex + 1);
          } else {
            shakeModal();
            var firstInvalid = contentWrap.querySelector('.rc-field-invalid, .rc-field-invalid-group');
            if (firstInvalid) firstInvalid.scrollIntoView({ block: 'center' });
          }
        });
        navGroup.appendChild(nextBtn);
        navOuter.appendChild(navGroup);
        footerBar.appendChild(navOuter);
      }
    }

    // Wired to the real backend (action=createSeason, handleCreateSeason in
    // DataCache.gs). Everything the backend doesn't look up individually
    // (classes/classSeasons/economy/raceSettings/specialEvents/etc.) is
    // bundled into one seasonDetails JSON blob, matching the
    // Seasons.SeasonDetails / Rounds.RoundDetails "one JSON column"
    // convention already used everywhere else on the site. Each race's
    // Track+Layout is resolved to a real TrackID here via resolveTrackId()
    // -- the wizard's own dropdowns work in names, but the backend's Rounds
    // schema keys races to Tracks by TrackID.
    function finishWizard() {
      saveWizardDraft(state);
      contentWrap.innerHTML = '';
      contentWrap.appendChild(buildSpinner('Creating season...'));
      footerBar.innerHTML = '';

      var raceDates = computeRaceDates(state);
      var racesPayload = state.races.map(function (race, idx) {
        return {
          trackId: resolveTrackId(race.track, race.layout),
          roundNumber: idx + 1,
          date: raceDates[idx] || '',
          weather: race.weather,
          chanceOfRain: race.chanceOfRain,
          temperatureC: race.temperatureC,
          layout: race.layout,
          raceLengthTier: race.tier,
          igPracticeStart: race.igPracticeStart,
          igQualifyStart: race.igQualifyStart,
          igRaceStart: race.igRaceStart,
          passwordOverride: race.passwordOverride
        };
      });

      // releaseAtUtc is computed HERE, in the admin's own browser, rather
      // than left for the backend to work out from releaseDateTime (a bare
      // "2026-09-05T20:00" with no zone info) + enteredTimeZone (a label,
      // not something Apps Script can reliably parse an arbitrary IANA name
      // against). new Date(a plain datetime-local string) is interpreted in
      // THIS browser's local zone, which is the zone the admin actually
      // picked the date/time in -- so converting to a UTC instant right here
      // is exact, and the backend's scheduled-release checker only ever has
      // to compare two absolute timestamps.
      var releaseAtUtc = '';
      if (state.releaseMode === 'scheduled' && state.releaseDateTime) {
        var releaseAtDate = new Date(state.releaseDateTime);
        if (!isNaN(releaseAtDate.getTime())) releaseAtUtc = releaseAtDate.toISOString();
      }

      var seasonDetails = {
        defaultPassword: state.defaultPassword,
        privateQualifying: state.privateQualifying,
        trackLimitsPreset: state.trackLimitsPreset,
        releaseMode: state.releaseMode,
        releaseDateTime: state.releaseDateTime,
        releaseAtUtc: releaseAtUtc,
        enteredTimeZone: state.enteredTimeZone,
        classes: state.classes,
        classSeasons: state.classSeasons,
        frequency: state.frequency,
        byeWeeks: state.byeWeeks,
        byeWeekDates: state.byeWeekDates,
        dropWeeks: state.dropWeeks,
        specialEventsCount: state.specialEventsCount,
        specialEvents: state.specialEvents,
        bonusPoints: state.bonusPoints,
        pointsTables: state.pointsTables,
        seasonStartDate: state.seasonStartDate,
        seasonStartTime: state.seasonStartTime,
        raceSettings: state.raceSettings,
        economy: state.economy
      };

      function showResultPanel(ok, title, message) {
        contentWrap.innerHTML = '';
        var note = el('div', 'rc-panel');
        note.style.borderColor = ok ? 'var(--rc-ok)' : 'var(--rc-red)';
        note.appendChild(el('h3', 'margin-top:0;', title));
        note.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', message));
        var closeBtn = el('button', null, 'Close');
        closeBtn.className = 'rc-btn-primary rc-btn-sm'; closeBtn.type = 'button';
        closeBtn.addEventListener('click', modal.close);
        note.appendChild(closeBtn);
        contentWrap.appendChild(note);
      }

      fetchApi('createSeason', {
        method: 'POST',
        token: token,
        body: {
          name: state.seasonName,
          seasonDetails: JSON.stringify(seasonDetails),
          races: JSON.stringify(racesPayload)
        }
      }).then(function (data) {
        if (data && data.success) {
          clearWizardDraft();
          showResultPanel(true, 'Season Created',
            data.message || ('Season "' + (data.seasonName || state.seasonName) + '" created.'));
        } else {
          showResultPanel(false, 'Could Not Create Season',
            (data && data.message) || 'Something went wrong talking to the server. Your draft is untouched, so it\'s safe to try again.');
        }
      }).catch(function () {
        showResultPanel(false, 'Could Not Reach The Server',
          'Check your connection and try again -- your draft is untouched.');
      });
    }

    renderStep();
  }

  // ---------------------------------------------------------------------
  // DATA MANAGEMENT -- three panels (Drivers/Tracks/Cars) built from the
  // same data every other part of the site already sources from
  // (adminListDrivers, getTracks, getCars), now with real Edit popups
  // (Matt's call: "make them work just like the Edit Profile popup").
  // Fetched fresh every time the sidebar link is clicked rather than
  // cached, since this is an infrequently-visited admin screen where
  // staleness would be a worse trade than a couple extra Apps Script
  // calls -- also fetched fresh again after any save/deactivate so the
  // panels never show stale data next to a just-changed record.
  //
  // NO PERMANENT DELETION (Matt's direct call, applies sitewide to
  // reference data): Tracks and Cars both gained an Active field this
  // pass (Users already had one -- Status) so "removing" a layout or a
  // car deactivates it instead of deleting the row. Nothing that already
  // points at a TrackID or CarID (a Round, a Team, historical results)
  // ever breaks because the record vanished -- it's still there, just
  // filtered out of the normal browsing view. getTracks/getCars return
  // every row (active + inactive) when called with an admin token, which
  // is exactly what this page always does -- see the file header comment
  // in Website.gs. Cars filters to active-only for the main browsing list
  // (buildCarsPanel); Tracks does the same for its Layouts sub-list, but
  // its Edit popup deliberately shows BOTH active and inactive layouts
  // together (with a Reactivate button on the inactive ones), since
  // that's the one place an admin needs to actually manage that history.
  // ---------------------------------------------------------------------
  function _rcRowActive(row) {
    return (row.Active || 'Active') !== 'Inactive';
  }

  // ---------------------------------------------------------------------
  // DATA MANAGEMENT PAGE -- a League-Management-style container (h2 + one
  // rc-panel labeled "Data Tools") with a row of buttons: Members / Tracks
  // / Cars / Sponsors. Each button opens its own popup (openAdminListModal
  // below) that fetches and renders just that data set -- nothing loads
  // until its button is clicked (Matt's call: "Each section loads up
  // separately AFTER the button is clicked, with the loading lights
  // showing up in the popup", same pattern the Season Wizard's own
  // modal-internal loading already uses via buildSpinner). Separate from
  // the plain "Admin" placeholder link (Matt's call: "I'm unsure what I
  // will use it for" -- kept as its own link, not merged in here).
  // ---------------------------------------------------------------------
  function renderDataManagementSection(token) {
    var section = document.getElementById('rc-section-datamgmt');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(el('h2', 'margin-top:0;', 'Data Management'));

    var panel = el('div', 'rc-panel');
    panel.appendChild(el('h3', 'margin-top:0;', 'Data Tools'));
    panel.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'Admin-only. Manage members, tracks, cars, and sponsors.'));

    var row = el('div', 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;');

    var membersBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Members');
    membersBtn.type = 'button';
    membersBtn.addEventListener('click', function () { openMembersModal(token); });
    row.appendChild(membersBtn);

    var tracksBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Tracks');
    tracksBtn.type = 'button';
    tracksBtn.addEventListener('click', function () { openTracksModal(token); });
    row.appendChild(tracksBtn);

    var carsBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Cars');
    carsBtn.type = 'button';
    carsBtn.addEventListener('click', function () { openCarsModal(token); });
    row.appendChild(carsBtn);

    var sponsorsBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Sponsors');
    sponsorsBtn.type = 'button';
    sponsorsBtn.addEventListener('click', function () { openSponsorsModal(token); });
    row.appendChild(sponsorsBtn);

    panel.appendChild(row);
    section.appendChild(panel);
  }

  // Generic "open a popup, show the loading lights, then fetch and render
  // its content" helper -- shared by all four Admin buttons above so every
  // popup loads the same way. `fetchFn` returns a promise (a single
  // fetchApi call, or a Promise.all of a few); `renderFn(result, reload)`
  // gets the resolved value back plus a `reload` callback it can hand to
  // its rows (e.g. after an Approve/Deny/Save) to refresh the popup in
  // place without closing it. `addButtonConfig` ({label, onClick}) is
  // optional -- Tracks/Cars/Sponsors pass one so an "Add <name>" button
  // sits at the top of the popup, above the list; Members doesn't (new
  // members only ever arrive by signing up themselves).
  function openAdminListModal(title, loadingText, fetchFn, renderFn, addButtonConfig) {
    var modal = showModal(title, { wide: true });
    function load() {
      modal.body.innerHTML = '';
      modal.body.appendChild(buildSpinner(loadingText));
      fetchFn().then(function (result) {
        modal.body.innerHTML = '';
        if (addButtonConfig) {
          var addRow = el('div', 'display:flex;justify-content:flex-end;margin-bottom:14px;');
          var addBtn = el('button', 'rc-btn-primary rc-btn-sm', addButtonConfig.label);
          addBtn.type = 'button';
          addBtn.addEventListener('click', function () { addButtonConfig.onClick(load); });
          addRow.appendChild(addBtn);
          modal.body.appendChild(addRow);
        }
        modal.body.appendChild(renderFn(result, load));
      }).catch(function () {
        modal.body.innerHTML = '';
        modal.body.appendChild(el('div', 'rc-message rc-error', 'Could not load. Try again in a moment.'));
      });
    }
    load();
    return modal;
  }

  function openMembersModal(token) {
    openAdminListModal('Members', 'Loading members…', function () {
      return Promise.all([
        fetchApi('adminListDrivers', { token: token }),
        fetchApi('adminListPendingAccounts', { token: token })
      ]);
    }, function (results, reload) {
      var driversData = results[0], pendingData = results[1];
      return buildDriversPanel(
        driversData && driversData.success ? driversData.drivers : [],
        pendingData && pendingData.success ? pendingData.pending : [],
        token,
        reload
      );
    });
  }

  function openTracksModal(token) {
    openAdminListModal('Tracks', 'Loading tracks…', function () {
      return fetchApi('getTracks', { token: token });
    }, function (tracksData, reload) {
      return buildTracksPanel(tracksData && tracksData.success ? tracksData.tracks : [], token, reload);
    }, { label: 'Add Track', onClick: function (reload) { openAddTrackModal(token, reload); } });
  }

  function openCarsModal(token) {
    openAdminListModal('Cars', 'Loading cars…', function () {
      return fetchApi('getCars', { token: token });
    }, function (carsData, reload) {
      return buildCarsPanel(carsData && carsData.success ? carsData.cars : [], token, reload);
    }, { label: 'Add Car', onClick: function (reload) { openAddCarModal(token, reload); } });
  }

  function openSponsorsModal(token) {
    openAdminListModal('Sponsors', 'Loading sponsors…', function () {
      return fetchApi('getSponsors', { token: token });
    }, function (sponsorsData, reload) {
      return buildSponsorsPanel(sponsorsData && sponsorsData.success ? sponsorsData.sponsors : [], token, reload);
    }, { label: 'Add Sponsor', onClick: function (reload) { openAddSponsorModal(token, reload); } });
  }

  // Add Track -- Track Name + first Layout, posting to the same
  // adminAddTrackLayout endpoint the Edit Track popup's "Add Layout" row
  // already uses (that endpoint creates the venue if the name doesn't
  // exist yet, so a brand-new track and a new layout on an existing one
  // are literally the same server action).
  function openAddTrackModal(token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Track Name'));
    var name = el('input'); name.type = 'text'; name.required = true;
    form.appendChild(name);

    form.appendChild(el('label', null, 'Layout'));
    var layout = el('input'); layout.type = 'text'; layout.required = true;
    form.appendChild(layout);
    form.appendChild(el('div', 'rc-hint', 'Every track needs at least one layout -- add more from its Edit popup afterward.'));

    var saveBtn = el('button', null, 'Add Track');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var modalHandle = showModal('Add Track', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();

      saveBtn.textContent = 'Adding...';
      fetchApi('adminAddTrackLayout', {

        body: { trackName: name.value.trim(), layout: layout.value.trim() }
      })
        .then(function (data) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Add Track';
          if (!data.success) {
            showToast(data.message || 'Could not add this track.', 'error');
            return;
          }
          showToast('Track added.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {

          saveBtn.textContent = 'Add Track';

        });

  // Add Car -- same field set as the Edit Car popup, minus Active (new

  function openAddCarModal(token, reload) {

  // Alphabetical by DisplayName, one row per driver, Edit button on each
  // opening openEditDriverModal(). A separate "Pending Approval" group
  // sits on top when there's anyone waiting -- these are Prospects
  // (Status PendingApproval, not yet a Role at all), so they're not part
  // of the main list below; Approve promotes Status straight to Active
  // (adminApproveAccount), Deny sets it to Rejected (adminRejectAccount).
  // Both call `reload` (the Members popup's own refresh, from
  // openAdminListModal) afterward, plus the sidebar dot/header bell, so
  // nothing here goes stale. No panel heading here -- this renders inside
  // the Members popup, whose modal title already says "Members".
  function buildDriversPanel(drivers, pending, token, reload) {
    var panel = el('div', 'rc-panel');

    var pendingList = pending || [];
    if (pendingList.length > 0) {
      var pendingWrap = el('div', 'margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--rc-silver);');
      pendingWrap.appendChild(el('h4', 'margin:0 0 4px;font-size:13px;color:var(--rc-red);', 'Pending Approval (' + pendingList.length + ')'));
      pendingList.slice().sort(function (a, b) {
        return (a.DisplayName || '').localeCompare(b.DisplayName || '');
      }).forEach(function (p) {
        var row = el('div', 'rc-dm-row');
        row.appendChild(el('span', 'rc-dm-row-label', escapeHtml(p.DisplayName || p.Username || '(no name)')));
        var btnGroup = el('div', 'display:flex;gap:8px;');
        // Row actions are always .rc-btn-secondary (site convention -- see
        // .rc-btn-row in style.css), so Approve/Deny read as equal-weight
        // choices, colored via the same green/red already used for
        // Active/Inactive status pills elsewhere in Data Management.
        var approveBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Approve');
        approveBtn.style.cssText = 'color:#1f5c25;border-color:#1f5c25;';
        approveBtn.type = 'button';
        approveBtn.addEventListener('click', function () {
          approveBtn.disabled = true; denyBtn.disabled = true;
          fetchApi('adminApproveAccount', { method: 'POST', token: token, body: { profileId: p.ProfileID } }).then(function (data) {
            if (data && data.success) {
              showToast((p.DisplayName || 'Driver') + ' approved.', 'success');
              reload();
              if (typeof updateDataMgmtNavDot === 'function') updateDataMgmtNavDot(token);
              if (typeof renderHeader === 'function') renderHeader();
            } else {
              showToast((data && data.message) || 'Could not approve this account.', 'error');
              approveBtn.disabled = false; denyBtn.disabled = false;
            }
          }).catch(function () {
            showToast('Could not reach the server. Try again in a moment.', 'error');
            approveBtn.disabled = false; denyBtn.disabled = false;
          });
        });
        var denyBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Deny');
        denyBtn.style.cssText = 'color:var(--rc-red);border-color:var(--rc-red);';
        denyBtn.type = 'button';
        denyBtn.addEventListener('click', function () {
          approveBtn.disabled = true; denyBtn.disabled = true;
          fetchApi('adminRejectAccount', { method: 'POST', token: token, body: { profileId: p.ProfileID } }).then(function (data) {
            if (data && data.success) {
              showToast((p.DisplayName || 'Driver') + ' denied.', 'success');
              reload();
              if (typeof updateDataMgmtNavDot === 'function') updateDataMgmtNavDot(token);
              if (typeof renderHeader === 'function') renderHeader();
            } else {
              showToast((data && data.message) || 'Could not deny this account.', 'error');
              approveBtn.disabled = false; denyBtn.disabled = false;
            }
          }).catch(function () {
            showToast('Could not reach the server. Try again in a moment.', 'error');
            approveBtn.disabled = false; denyBtn.disabled = false;
          });
        });
        btnGroup.appendChild(approveBtn);
        btnGroup.appendChild(denyBtn);
        row.appendChild(btnGroup);
        pendingWrap.appendChild(row);
      });
      panel.appendChild(pendingWrap);
    }

    var sorted = (drivers || []).slice().sort(function (a, b) {
      return (a.DisplayName || '').localeCompare(b.DisplayName || '');
    });
    if (sorted.length === 0) {
      panel.appendChild(el('div', 'rc-dm-empty', 'No members yet.'));
      return panel;
    }
    sorted.forEach(function (d) {
      var row = el('div', 'rc-dm-row');
      row.appendChild(el('span', 'rc-dm-row-label', escapeHtml(d.DisplayName || '(no name)')));
      var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
      editBtn.type = 'button';
      editBtn.addEventListener('click', function () { openEditDriverModal(d, token, reload); });
      row.appendChild(editBtn);
      panel.appendChild(row);
    });
    return panel;
  }

  // Same field set as openEditProfileModal (Username/First/Last/Suffix/
  // Email/Location/Time Zone), plus Role -- this is the admin-on-someone-
  // else's-profile equivalent, backed by the expanded handleAdminUpdateProfile.
  // "Disable This Account" is a separate action (adminSetUserStatus, same
  // endpoint Status changes already went through) rather than a field on
  // this form, matching the Track/Car popups' edit-fields vs. deactivate
  // split below.
  function openEditDriverModal(driver, token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Username'));
    var username = el('input'); username.type = 'text'; username.value = driver.Username || ''; username.required = true;
    form.appendChild(username);

    form.appendChild(el('label', null, 'First Name'));
    var firstName = el('input'); firstName.type = 'text'; firstName.value = driver.FirstName || ''; firstName.required = true;
    form.appendChild(firstName);

    form.appendChild(el('label', null, 'Last Name'));
    var lastName = el('input'); lastName.type = 'text'; lastName.value = driver.LastName || ''; lastName.required = true;
    form.appendChild(lastName);

    form.appendChild(el('label', null, 'Suffix (optional)'));
    var suffix = document.createElement('select');
    var suffixBlank = document.createElement('option'); suffixBlank.value = ''; suffixBlank.textContent = 'None';
    suffix.appendChild(suffixBlank);
    (typeof DRIVER_NAME_SUFFIXES !== 'undefined' ? DRIVER_NAME_SUFFIXES : []).forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s; opt.textContent = s;
      if (driver.Suffix === s) opt.selected = true;
      suffix.appendChild(opt);
    });
    form.appendChild(suffix);

    form.appendChild(el('label', null, 'Email Address'));
    var email = el('input'); email.type = 'email'; email.value = driver.Email || ''; email.required = true;
    form.appendChild(email);

    form.appendChild(el('label', null, 'Location'));
    var location = document.createElement('select');
    var locBlank = document.createElement('option'); locBlank.value = ''; locBlank.textContent = 'Select a country';
    location.appendChild(locBlank);
    (typeof COUNTRIES !== 'undefined' ? COUNTRIES : []).forEach(function (country) {
      var opt = document.createElement('option'); opt.value = country; opt.textContent = country;
      if (driver.Location === country) opt.selected = true;
      location.appendChild(opt);
    });
    form.appendChild(location);

    form.appendChild(el('label', null, 'Time Zone'));
    var timeZone = document.createElement('select');
    var tzBlank = document.createElement('option'); tzBlank.value = ''; tzBlank.textContent = 'Select a time zone';
    timeZone.appendChild(tzBlank);
    (typeof getTimezoneList === 'function' ? getTimezoneList() : []).forEach(function (tz) {
      var opt = document.createElement('option'); opt.value = tz; opt.textContent = typeof timezoneLabel === 'function' ? timezoneLabel(tz) : tz;
      if (driver.TimeZone === tz) opt.selected = true;
      timeZone.appendChild(opt);
    });
    form.appendChild(timeZone);

    form.appendChild(el('label', null, 'Role'));
    var role = document.createElement('select');
    // Cumulative access hierarchy, lowest to highest (see
    // race-club-v03-system-map.html, Section 0): Driver < Steward <
    // Organizer < Admin. Prospect isn't in this list -- it's a Status
    // (PendingVerification/PendingApproval), not a Role; see Auth.gs.
    ['Driver', 'Steward', 'Organizer', 'Admin'].forEach(function (r) {
      var opt = document.createElement('option'); opt.value = r; opt.textContent = r;
      if (driver.Role === r) opt.selected = true;
      role.appendChild(opt);
    });
    form.appendChild(role);

    var saveBtn = el('button', null, 'Save Changes');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var isActive = driver.Status !== 'Disabled';
    var statusWrap = el('div', 'padding-top:16px;margin-top:16px;border-top:1px solid var(--rc-silver);');
    var toggleBtn = el('button', 'rc-btn-secondary rc-btn-sm', isActive ? 'Disable This Account' : 'Reactivate This Account');
    toggleBtn.type = 'button';
    statusWrap.appendChild(toggleBtn);
    body.appendChild(statusWrap);

    var modalHandle = showModal('Edit Driver', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!username.value.trim() || !firstName.value.trim() || !lastName.value.trim() || !email.value.trim()) {
        showToast('Username, first name, last name, and email are required.', 'error');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      fetchApi('adminUpdateProfile', {
        method: 'POST',
        token: token,
        body: {
          profileId: driver.ProfileID,
          username: username.value.trim(),
          firstName: firstName.value.trim(),
          lastName: lastName.value.trim(),
          suffix: suffix.value,
          email: email.value.trim(),
          location: location.value,
          timeZone: timeZone.value,
          role: role.value
        }
      })
        .then(function (data) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          if (!data.success) {
            showToast(data.message || 'Could not save changes.', 'error');
            return;
          }
          showToast('Driver updated.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });

    toggleBtn.addEventListener('click', function () {
      toggleBtn.disabled = true;
      fetchApi('adminSetUserStatus', {
        method: 'POST',
        token: token,
        body: { profileId: driver.ProfileID, status: isActive ? 'Disabled' : 'Active' }
      })
        .then(function (data) {
          toggleBtn.disabled = false;
          if (!data.success) {
            showToast(data.message || 'Could not update this account.', 'error');
            return;
          }
          showToast(isActive ? 'Account disabled.' : 'Account reactivated.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {
          toggleBtn.disabled = false;
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
  }

  // Venues (grouped by TrackName) alphabetically, Edit button on the venue
  // row only, opening openEditTrackModal(). Only ACTIVE layouts show in
  // this main list -- the edit popup is where inactive ones are visible
  // (and can be reactivated).
  function buildTracksPanel(tracks, token, reload) {
    var panel = el('div', 'rc-panel');
    var venues = {};
    var names = [];
    (tracks || []).forEach(function (t) {
      var name = t.TrackName || '(unnamed)';
      if (!venues[name]) { venues[name] = []; names.push(name); }
      venues[name].push(t);
    });
    names.sort(function (a, b) { return a.localeCompare(b); });
    if (names.length === 0) {
      panel.appendChild(el('div', 'rc-dm-empty', 'No tracks yet.'));
      return panel;
    }
    names.forEach(function (name) {
      var rows = venues[name];
      var group = el('div', 'rc-dm-group');
      var row = el('div', 'rc-dm-row');
      row.appendChild(el('span', 'rc-dm-row-label', escapeHtml(name)));
      var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
      editBtn.type = 'button';
      editBtn.addEventListener('click', function () { openEditTrackModal(name, rows, token, reload); });
      row.appendChild(editBtn);
      group.appendChild(row);

      var activeLayouts = rows.filter(_rcRowActive).map(function (r) { return r.Layout; })
        .filter(Boolean).sort(function (a, b) { return a.localeCompare(b); });
      if (activeLayouts.length === 0) {
        var noneRow = el('div', 'rc-dm-subrow');
        noneRow.appendChild(el('span', 'rc-dm-tree', '└'));
        noneRow.appendChild(el('span', null, 'No active layouts.'));
        group.appendChild(noneRow);
      } else {
        activeLayouts.forEach(function (layout) {
          var layoutRow = el('div', 'rc-dm-subrow');
          layoutRow.appendChild(el('span', 'rc-dm-tree', '└'));
          layoutRow.appendChild(el('span', null, escapeHtml(layout)));
          group.appendChild(layoutRow);
        });
      }
      panel.appendChild(group);
    });
    return panel;
  }

  // Track edit popup -- ONLY the venue name is editable here (Matt's
  // call), applying to every row sharing that TrackName at once
  // (adminUpdateTrackName). Layouts are managed separately underneath:
  // every layout row (active AND inactive) with a status pill and a
  // Deactivate/Reactivate toggle (adminSetTrackLayoutActive -- never
  // deletes the row), plus an add-a-layout input (adminAddTrackLayout).
  // Layout changes update the popup's own list in place (no need to
  // close/reopen it to keep managing layouts); only the rename triggers a
  // full section refresh, since that's the one change that affects the
  // main panel's grouping/heading.
  function openEditTrackModal(venueName, rows, token, reload) {
    var body = el('div');

    var form = el('form');
    form.appendChild(el('label', 'margin-top:0;', 'Track Name'));
    var nameInput = el('input'); nameInput.type = 'text'; nameInput.value = venueName; nameInput.required = true;
    form.appendChild(nameInput);
    var saveNameBtn = el('button', null, 'Save Name');
    saveNameBtn.type = 'submit';
    saveNameBtn.className = 'rc-btn-primary';
    saveNameBtn.style.marginTop = '14px';
    form.appendChild(saveNameBtn);
    body.appendChild(form);

    body.appendChild(el('h3', 'margin:22px 0 0;font-size:14px;', 'Layouts'));
    var listWrap = el('div', 'rc-dm-layout-list');
    body.appendChild(listWrap);

    function renderLayoutList() {
      listWrap.innerHTML = '';
      if (rows.length === 0) {
        listWrap.appendChild(el('div', 'rc-dm-empty', 'No layouts yet.'));
        return;
      }
      rows.slice().sort(function (a, b) { return (a.Layout || '').localeCompare(b.Layout || ''); }).forEach(function (r) {
        var active = _rcRowActive(r);
        var layoutRow = el('div', 'rc-dm-layout-row' + (active ? '' : ' rc-dm-layout-inactive'));
        layoutRow.appendChild(el('span', 'rc-dm-layout-name', escapeHtml(r.Layout || '(unnamed layout)')));
        layoutRow.appendChild(el('span', 'rc-dm-status-pill ' + (active ? 'rc-dm-status-pill-active' : 'rc-dm-status-pill-inactive'), active ? 'Active' : 'Inactive'));
        var toggleBtn = el('button', 'rc-btn-secondary rc-btn-row', active ? 'Deactivate' : 'Reactivate');
        toggleBtn.type = 'button';
        toggleBtn.addEventListener('click', function () {
          toggleBtn.disabled = true;
          fetchApi('adminSetTrackLayoutActive', {
            method: 'POST', token: token,
            body: { trackId: r.TrackID, active: active ? 'Inactive' : 'Active' }
          })
            .then(function (data) {
              toggleBtn.disabled = false;
              if (!data.success) {
                showToast(data.message || 'Could not update that layout.', 'error');
                return;
              }
              r.Active = active ? 'Inactive' : 'Active';
              renderLayoutList();
              showToast(active ? 'Layout deactivated.' : 'Layout reactivated.', 'success');
            })
            .catch(function () {
              toggleBtn.disabled = false;
              showToast('Could not reach the server. Try again in a moment.', 'error');
            });
        });
        layoutRow.appendChild(toggleBtn);
        listWrap.appendChild(layoutRow);
      });
    }
    renderLayoutList();

    var addRow = el('div', 'rc-dm-add-row');
    var addInput = el('input'); addInput.type = 'text'; addInput.placeholder = 'New layout name';
    var addBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Add Layout');
    addBtn.type = 'button';
    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    body.appendChild(addRow);

    addBtn.addEventListener('click', function () {
      var layoutName = addInput.value.trim();
      if (!layoutName) {
        showToast('Enter a layout name first.', 'error');
        return;
      }
      addBtn.disabled = true;
      fetchApi('adminAddTrackLayout', {
        method: 'POST', token: token,
        body: { trackName: venueName, layout: layoutName }
      })
        .then(function (data) {
          addBtn.disabled = false;
          if (!data.success) {
            showToast(data.message || 'Could not add that layout.', 'error');
            return;
          }
          rows.push({ TrackID: data.trackId, TrackName: venueName, Layout: layoutName, Active: 'Active' });
          addInput.value = '';
          renderLayoutList();
          showToast('Layout added.', 'success');
        })
        .catch(function () {
          addBtn.disabled = false;
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });

    var modalHandle = showModal('Edit Track', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      var newName = nameInput.value.trim();
      if (!newName) {
        showToast('Track name is required.', 'error');
        return;
      }
      if (newName === venueName) {
        modalHandle.close();
        return;
      }
      saveNameBtn.disabled = true;
      saveNameBtn.textContent = 'Saving...';
      fetchApi('adminUpdateTrackName', {
        method: 'POST', token: token,
        body: { oldName: venueName, newName: newName }
      })
        .then(function (data) {
          saveNameBtn.disabled = false;
          saveNameBtn.textContent = 'Save Name';
          if (!data.success) {
            showToast(data.message || 'Could not rename this track.', 'error');
            return;
          }
          showToast('Track renamed.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {
          saveNameBtn.disabled = false;
          saveNameBtn.textContent = 'Save Name';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
  }

  // Class badge -- LMGT3/LMP3/LMP2/Hypercar get their canonical colors
  // (same CSS vars CAR_CLASS_BADGE_COLOR_VAR points at); any other class
  // name still shows, just uncolored, rather than being silently dropped.
  function _rcClassBadge(cls) {
    var key = String(cls || '').trim();
    var map = { LMGT3: 'rc-badge-lmgt3', LMP3: 'rc-badge-lmp3', LMP2: 'rc-badge-lmp2', Hypercar: 'rc-badge-hypercar' };
    var colorClass = map[key] || '';
    return el('span', 'rc-badge-chip' + (colorClass ? ' ' + colorClass : ''), escapeHtml(key || 'Unclassified'));
  }

  // Grouped by Class (fixed order: LMGT3 -> LMP3 -> LMP2 -> Hypercar, per
  // CAR_CLASS_LIST -- the same canonical order used everywhere else on the
  // site a class list appears), then by Season within each class (most
  // recent first, black badge per Matt's call), then one row per car --
  // manufacturer logo, then details, then its own Edit button. A class
  // with zero ACTIVE cars entered is skipped entirely rather than shown
  // empty; deactivated cars just don't appear in this browsing view (they
  // still exist -- see openEditCarModal's Reactivate button, reachable
  // once you know the car's still-active season/class to find it, or
  // directly in the Sheet).
  function buildCarsPanel(cars, token, reload) {
    var panel = el('div', 'rc-panel');

    var activeCars = (cars || []).filter(_rcRowActive);

    var byClass = {};
    activeCars.forEach(function (c) {
      var cls = c.Class || 'Unclassified';
      if (!byClass[cls]) byClass[cls] = {};
      var season = c.Season || 'Unknown Season';
      if (!byClass[cls][season]) byClass[cls][season] = [];
      byClass[cls][season].push(c);
    });

    if (Object.keys(byClass).length === 0) {
      panel.appendChild(el('div', 'rc-dm-empty', 'No cars yet.'));
      return panel;
    }

    var classOrder = (typeof CAR_CLASS_LIST !== 'undefined' ? CAR_CLASS_LIST : []).slice();
    // A class present in the data but missing from the canonical list
    // (typo, a future class not added there yet) still shows -- appended
    // after the canonical ones rather than silently dropped.
    Object.keys(byClass).forEach(function (cls) {
      if (classOrder.indexOf(cls) === -1) classOrder.push(cls);
    });

    classOrder.forEach(function (cls) {
      var seasons = byClass[cls];
      if (!seasons) return; // canonical class with zero active cars entered
      var group = el('div', 'rc-dm-group');
      var classHead = el('div', 'rc-dm-row');
      classHead.appendChild(_rcClassBadge(cls));
      group.appendChild(classHead);

      var seasonKeys = Object.keys(seasons).sort(function (a, b) {
        var na = parseFloat(a), nb = parseFloat(b);
        if (!isNaN(na) && !isNaN(nb)) return nb - na; // numeric seasons, most recent first
        return String(b).localeCompare(String(a)); // fallback: reverse alpha
      });

      seasonKeys.forEach(function (season) {
        var seasonHead = el('div', 'rc-dm-season-head');
        seasonHead.appendChild(el('span', 'rc-dm-tree', '└'));
        seasonHead.appendChild(el('span', 'rc-badge-chip rc-badge-season', escapeHtml(season)));
        group.appendChild(seasonHead);

        seasons[season].forEach(function (c) {
          var row = el('div', 'rc-dm-subrow-edit');
          var info = el('div', 'rc-dm-car-info');
          var logo = document.createElement('img');
          logo.className = 'rc-dm-car-logo';
          logo.alt = '';
          logo.src = manufacturerLogoSrc(c.Manufacturer || '');
          // Hides gracefully rather than showing a broken-image icon when
          // that manufacturer's logo file hasn't been uploaded yet -- same
          // pattern currentSeatBlock() uses elsewhere for this exact file
          // naming convention (see manufacturerLogoSrc()'s own comment).
          logo.onerror = function () { this.style.display = 'none'; };
          info.appendChild(logo);
          // Manufacturer isn't repeated in text here -- the logo to the
          // left of this label already identifies it (Matt's call).
          var labelParts = [];
          if (c.CarNumber) labelParts.push('#' + c.CarNumber);
          if (c.CarModel) labelParts.push(c.CarModel);
          if (c.TeamName) labelParts.push('(' + c.TeamName + ')');
          info.appendChild(el('span', null, escapeHtml(labelParts.join(' — ') || '(unnamed car)')));
          row.appendChild(info);
          var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
          editBtn.type = 'button';
          editBtn.addEventListener('click', function () { openEditCarModal(c, token, reload); });
          row.appendChild(editBtn);
          group.appendChild(row);
        });
      });
      panel.appendChild(group);
    });
    return panel;
  }

  // Car edit popup -- Season/Class/Manufacturer/Car Model/Car Number/Team
  // Name, posting to adminUpdateCar, plus a separate Deactivate/Reactivate
  // button (adminSetCarActive -- never deletes the row), same edit-fields-
  // vs-deactivate split as the Track popup above.
  function openEditCarModal(car, token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Season'));
    var season = el('input'); season.type = 'text'; season.value = car.Season || '';
    form.appendChild(season);

    form.appendChild(el('label', null, 'Class'));
    var carClass = document.createElement('select');
    (typeof CAR_CLASS_LIST !== 'undefined' ? CAR_CLASS_LIST : []).forEach(function (cls) {
      var opt = document.createElement('option'); opt.value = cls; opt.textContent = cls;
      if (car.Class === cls) opt.selected = true;
      carClass.appendChild(opt);
    });
    form.appendChild(carClass);

    form.appendChild(el('label', null, 'Manufacturer'));
    var manufacturer = el('input'); manufacturer.type = 'text'; manufacturer.value = car.Manufacturer || '';
    form.appendChild(manufacturer);
    form.appendChild(el('div', 'rc-hint', 'Used to find that manufacturer’s logo (assets/manufacturers/) -- a space becomes a dash, e.g. "Aston Martin" → aston-martin.png.'));

    form.appendChild(el('label', null, 'Car Model'));
    var carModel = el('input'); carModel.type = 'text'; carModel.value = car.CarModel || '';
    form.appendChild(carModel);

    form.appendChild(el('label', null, 'Car Number'));
    var carNumber = el('input'); carNumber.type = 'text'; carNumber.value = car.CarNumber || '';
    form.appendChild(carNumber);

    form.appendChild(el('label', null, 'Team Name'));
    var teamName = el('input'); teamName.type = 'text'; teamName.value = car.TeamName || '';
    form.appendChild(teamName);

    var saveBtn = el('button', null, 'Save Changes');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var isActive = _rcRowActive(car);
    var statusWrap = el('div', 'padding-top:16px;margin-top:16px;border-top:1px solid var(--rc-silver);');
    var toggleBtn = el('button', 'rc-btn-secondary rc-btn-sm', isActive ? 'Deactivate This Car' : 'Reactivate This Car');
    toggleBtn.type = 'button';
    statusWrap.appendChild(toggleBtn);
    body.appendChild(statusWrap);

    var modalHandle = showModal('Edit Car', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      fetchApi('adminUpdateCar', {
        method: 'POST', token: token,
        body: {
          carId: car.CarID,
          Season: season.value.trim(),
          Class: carClass.value,
          Manufacturer: manufacturer.value.trim(),
          CarModel: carModel.value.trim(),
          CarNumber: carNumber.value.trim(),
          TeamName: teamName.value.trim()
        }
      })
        .then(function (data) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          if (!data.success) {
            showToast(data.message || 'Could not save changes.', 'error');
            return;
          }
          showToast('Car updated.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });

    toggleBtn.addEventListener('click', function () {
      toggleBtn.disabled = true;
      fetchApi('adminSetCarActive', {
        method: 'POST', token: token,
        body: { carId: car.CarID, active: isActive ? 'Inactive' : 'Active' }
      })
        .then(function (data) {
          toggleBtn.disabled = false;
          if (!data.success) {
            showToast(data.message || 'Could not update this car.', 'error');
            return;
          }
          showToast(isActive ? 'Car deactivated.' : 'Car reactivated.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {
          toggleBtn.disabled = false;
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
  }

  // Dropdown for a standardized option list (Matt's call: "use dropdown
  // boxes anytime there are options which are standardized and use text
  // boxes for only custom things that do not have set options"). If the
  // record's current value isn't already in that list (an older/one-off
  // entry), it's prepended as an extra option so editing never silently
  // discards it -- the dropdown always has to contain whatever's already
  // selected.
  function _rcBuildSelectWithFallback(options, currentValue) {
    var select = document.createElement('select');
    var list = options.slice();
    if (currentValue && list.indexOf(currentValue) === -1) list = [currentValue].concat(list);
    list.forEach(function (opt) {
      var o = document.createElement('option'); o.value = opt; o.textContent = opt;
      if (opt === currentValue) o.selected = true;
      select.appendChild(o);
    });
    return select;
  }

  // Tier badge -- Safe/Balanced/Aggressive, same colored-chip pattern as
  // _rcClassBadge above, just a different color mapping (risk level, not
  // car class).
  function _rcTierBadge(tier) {
    var key = String(tier || '').trim();
    var map = { Safe: 'rc-badge-tier-safe', Balanced: 'rc-badge-tier-balanced', Aggressive: 'rc-badge-tier-aggressive' };
    var colorClass = map[key] || '';
    return el('span', 'rc-badge-chip' + (colorClass ? ' ' + colorClass : ''), escapeHtml(key || 'Unclassified'));
  }

  // Grouped by Tier (Safe -> Balanced -> Aggressive, the same order the
  // catalog was designed in -- see v0.3-Economy-Reputation-Design.md's
  // Sponsorship System), then one row per sponsor -- logo, name, bonus/
  // penalty summary, Edit button. Unlike Cars, deactivated sponsors stay
  // visible right here (dimmed, with an Inactive pill) instead of being
  // hidden -- Matt's call ("stays in the sheet for reference"), and this
  // catalog is small enough that hiding them would just make them hard to
  // find again to reactivate.
  function buildSponsorsPanel(sponsors, token, reload) {
    var panel = el('div', 'rc-panel');
    var all = sponsors || [];
    if (all.length === 0) {
      panel.appendChild(el('div', 'rc-dm-empty', 'No sponsors yet.'));
      return panel;
    }

    var TIER_ORDER = ['Safe', 'Balanced', 'Aggressive'];
    var byTier = {};
    all.forEach(function (s) {
      var tier = s.Tier || 'Unclassified';
      if (!byTier[tier]) byTier[tier] = [];
      byTier[tier].push(s);
    });
    var tierOrder = TIER_ORDER.slice();
    Object.keys(byTier).forEach(function (t) { if (tierOrder.indexOf(t) === -1) tierOrder.push(t); });

    tierOrder.forEach(function (tier) {
      var list = byTier[tier];
      if (!list) return;
      var group = el('div', 'rc-dm-group');
      var tierHead = el('div', 'rc-dm-row');
      tierHead.appendChild(_rcTierBadge(tier));
      group.appendChild(tierHead);

      list.slice().sort(function (a, b) { return (a.Name || '').localeCompare(b.Name || ''); }).forEach(function (s) {
        var active = _rcRowActive(s);
        var row = el('div', 'rc-dm-subrow-edit');
        var info = el('div', 'rc-dm-car-info');
        // Fixed-width column, logo right-justified inside it -- so the
        // text column's left edge lands in the same place row to row no
        // matter how wide any one sponsor's actual logo file is (a narrow
        // square mark vs. a wide wordmark would otherwise push textCol
        // around unpredictably).
        var logoCol = el('div', 'rc-dm-sponsor-logo-col');
        var logo = document.createElement('img');
        logo.className = 'rc-dm-sponsor-logo';
        logo.alt = '';
        logo.src = sponsorLogoSrc(s.Name || '');
        // Hides gracefully rather than showing a broken-image icon when
        // that sponsor's logo file hasn't been uploaded yet -- same
        // pattern buildCarsPanel uses for manufacturer logos.
        logo.onerror = function () { this.style.display = 'none'; };
        logoCol.appendChild(logo);
        info.appendChild(logoCol);

        var textCol = el('div', null);
        var nameLine = el('div', null, escapeHtml(s.Name || '(unnamed sponsor)'));
        if (!active) nameLine.style.cssText = 'color:var(--rc-steel);text-decoration:line-through;';
        textCol.appendChild(nameLine);
        var bonusAmt = Number(s.BonusAmount) || 0;
        var penaltyAmt = Math.abs(Number(s.PenaltyAmount) || 0);
        textCol.appendChild(el('div', 'rc-hint', 'Bonus: ' + (s.BonusType || '—') + ' (+$' + bonusAmt + ')  ·  Penalty: ' + (s.PenaltyType || '—') + ' (−$' + penaltyAmt + ')'));
        info.appendChild(textCol);
        row.appendChild(info);

        if (!active) row.appendChild(el('span', 'rc-dm-status-pill rc-dm-status-pill-inactive', 'Inactive'));

        var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit');
        editBtn.type = 'button';
        editBtn.addEventListener('click', function () { openEditSponsorModal(s, token, reload); });
        row.appendChild(editBtn);
        group.appendChild(row);
      });
      panel.appendChild(group);
    });
    return panel;
  }

  // Sponsor edit popup -- Name/Tier/Bonus Trigger/Bonus Amount/Penalty
  // Trigger/Penalty Amount, posting to adminUpdateSponsor, plus a separate
  // Deactivate/Reactivate button (adminSetSponsorActive -- never deletes
  // the row), same edit-fields-vs-deactivate split as Track/Car above.
  // Amounts are GT3-base dollar figures (see Core.gs's TAB_SCHEMAS
  // comment) -- the Penalty Amount field always shows/accepts a positive
  // number (the size of the deduction); the sign gets applied on save so
  // the sheet stores it as a negative, ready for whenever penalties
  // actually apply to payouts.
  function openEditSponsorModal(sponsor, token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Sponsor Name'));
    var name = el('input'); name.type = 'text'; name.value = sponsor.Name || ''; name.required = true;
    form.appendChild(name);

    form.appendChild(el('label', null, 'Tier'));
    var tier = _rcBuildSelectWithFallback(SPONSOR_TIER_LIST, sponsor.Tier);
    form.appendChild(tier);

    form.appendChild(el('label', null, 'Bonus Trigger'));
    var bonusType = _rcBuildSelectWithFallback(SPONSOR_BONUS_TRIGGERS, sponsor.BonusType);
    form.appendChild(bonusType);

    form.appendChild(el('label', null, 'Bonus Amount ($, GT3 base)'));
    var bonusAmount = el('input'); bonusAmount.type = 'number'; bonusAmount.min = '0'; bonusAmount.step = '1';
    bonusAmount.value = Number(sponsor.BonusAmount) || 0;
    form.appendChild(bonusAmount);

    form.appendChild(el('label', null, 'Penalty Trigger'));
    var penaltyType = _rcBuildSelectWithFallback(SPONSOR_PENALTY_TRIGGERS, sponsor.PenaltyType);
    form.appendChild(penaltyType);
    form.appendChild(el('div', 'rc-hint', 'Stored for later -- sponsor penalties aren’t applied to payouts yet this season.'));

    form.appendChild(el('label', null, 'Penalty Amount ($, GT3 base)'));
    var penaltyAmount = el('input'); penaltyAmount.type = 'number'; penaltyAmount.min = '0'; penaltyAmount.step = '1';
    penaltyAmount.value = Math.abs(Number(sponsor.PenaltyAmount) || 0);
    form.appendChild(penaltyAmount);

    var saveBtn = el('button', null, 'Save Changes');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var isActive = _rcRowActive(sponsor);
    var statusWrap = el('div', 'padding-top:16px;margin-top:16px;border-top:1px solid var(--rc-silver);');
    var toggleBtn = el('button', 'rc-btn-secondary rc-btn-sm', isActive ? 'Deactivate This Sponsor' : 'Reactivate This Sponsor');
    toggleBtn.type = 'button';
    statusWrap.appendChild(toggleBtn);
    body.appendChild(statusWrap);

    var modalHandle = showModal('Edit Sponsor', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!name.value.trim() || !bonusType.value.trim()) {
        showToast('Sponsor name and bonus trigger are required.', 'error');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      fetchApi('adminUpdateSponsor', {
        method: 'POST', token: token,
        body: {
          sponsorId: sponsor.SponsorID,
          Name: name.value.trim(),
          Tier: tier.value,
          BonusType: bonusType.value.trim(),
          BonusAmount: Number(bonusAmount.value) || 0,
          PenaltyType: penaltyType.value.trim(),
          PenaltyAmount: -Math.abs(Number(penaltyAmount.value) || 0)
        }
      })
        .then(function (data) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          if (!data.success) {
            showToast(data.message || 'Could not save changes.', 'error');
            return;
          }
          showToast('Sponsor updated.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });

    toggleBtn.addEventListener('click', function () {
      toggleBtn.disabled = true;
      fetchApi('adminSetSponsorActive', {
        method: 'POST', token: token,
        body: { sponsorId: sponsor.SponsorID, active: isActive ? 'Inactive' : 'Active' }
      })
        .then(function (data) {
          toggleBtn.disabled = false;
          if (!data.success) {
            showToast(data.message || 'Could not update this sponsor.', 'error');
            return;
          }
          showToast(isActive ? 'Sponsor deactivated.' : 'Sponsor reactivated.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {
          toggleBtn.disabled = false;
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
  }

  // Add Sponsor -- same field set as Edit Sponsor minus the Deactivate
  // toggle (a brand-new sponsor always starts Active). Tier/Bonus Trigger/
  // Penalty Trigger are all dropdowns (SPONSOR_TIER_LIST/
  // SPONSOR_BONUS_TRIGGERS/SPONSOR_PENALTY_TRIGGERS, reference-data.js) --
  // only Name and the two dollar amounts stay free-entry, since those are
  // the only genuinely custom values here.
  function openAddSponsorModal(token, reload) {
    var body = el('div');
    var form = el('form');

    form.appendChild(el('label', 'margin-top:0;', 'Sponsor Name'));
    var name = el('input'); name.type = 'text'; name.required = true;
    form.appendChild(name);

    form.appendChild(el('label', null, 'Tier'));
    var tier = _rcBuildSelectWithFallback(SPONSOR_TIER_LIST, '');
    form.appendChild(tier);

    form.appendChild(el('label', null, 'Bonus Trigger'));
    var bonusType = _rcBuildSelectWithFallback(SPONSOR_BONUS_TRIGGERS, '');
    form.appendChild(bonusType);

    form.appendChild(el('label', null, 'Bonus Amount ($, GT3 base)'));
    var bonusAmount = el('input'); bonusAmount.type = 'number'; bonusAmount.min = '0'; bonusAmount.step = '1'; bonusAmount.value = 0;
    form.appendChild(bonusAmount);

    form.appendChild(el('label', null, 'Penalty Trigger'));
    var penaltyType = _rcBuildSelectWithFallback(SPONSOR_PENALTY_TRIGGERS, '');
    form.appendChild(penaltyType);
    form.appendChild(el('div', 'rc-hint', 'Stored for later -- sponsor penalties aren’t applied to payouts yet this season.'));

    form.appendChild(el('label', null, 'Penalty Amount ($, GT3 base)'));
    var penaltyAmount = el('input'); penaltyAmount.type = 'number'; penaltyAmount.min = '0'; penaltyAmount.step = '1'; penaltyAmount.value = 0;
    form.appendChild(penaltyAmount);

    var saveBtn = el('button', null, 'Add Sponsor');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);
    body.appendChild(form);

    var modalHandle = showModal('Add Sponsor', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!name.value.trim()) {
        showToast('Sponsor name is required.', 'error');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Adding...';
      fetchApi('adminAddSponsor', {
        method: 'POST', token: token,
        body: {
          Name: name.value.trim(),
          Tier: tier.value,
          BonusType: bonusType.value,
          BonusAmount: Number(bonusAmount.value) || 0,
          PenaltyType: penaltyType.value,
          PenaltyAmount: -Math.abs(Number(penaltyAmount.value) || 0)
        }
      })
        .then(function (data) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Add Sponsor';
          if (!data.success) {
            showToast(data.message || 'Could not add this sponsor.', 'error');
            return;
          }
          showToast('Sponsor added.', 'success');
          modalHandle.close();
          reload();
        })
        .catch(function () {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Add Sponsor';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
  }

  // ---------------------------------------------------------------------
  // TOP-LEVEL RENDER
  // ---------------------------------------------------------------------
  function buildFullProfileUI(profile, token) {
    currentProfile = profile;
    currentToken = token;
    buildSidebarNav();
    document.getElementById('rc-sidebar-nav').classList.remove('rc-nav-loading');
    renderPlaceholderSections();
    renderHelpSection();

    // Cumulative access hierarchy (race-club-v03-system-map.html, Section
    // 0): Organizer's own capability is "edit season info & schedule",
    // which is exactly League Management -- so Organizer unlocks that nav
    // item too, same as Admin (who has every Organizer capability plus
    // more). Admin nav (still just a placeholder -- Matt's not sure yet
    // what lives there) and Data Management (Members/Tracks/Cars/Sponsors
    // popups) both stay Admin-only for now -- that maps to Level 4
    // capabilities ("change anyone's access level", manage reference
    // data), not anything Organizer has per the system map. Revisit if
    // that design changes.
    if (profile.role === 'Admin' || profile.role === 'Organizer') {
      document.getElementById('rc-nav-league').style.display = 'flex';
      showUpperNavDivider();
    }
    if (profile.role === 'Admin') {
      document.getElementById('rc-nav-admin').style.display = 'flex';
      document.getElementById('rc-nav-datamgmt').style.display = 'flex';
      showUpperNavDivider();
      updateDataMgmtNavDot(token);
    }

    showSection('dashboard');
  }

  // Red dot on the Data Management sidebar link itself, same "something's
  // waiting on you" signal as the header bell -- lets an Admin see there's
  // a pending sign-up without having to open Data Management/Members
  // first. Re-run after Approve/Deny (see buildDriversPanel) so it clears
  // the instant the queue is empty, not just on next page load.
  function updateDataMgmtNavDot(token) {
    fetchApi('adminListPendingAccounts', { token: token }).then(function (data) {
      var btn = document.getElementById('rc-nav-datamgmt');
      if (!btn) return;
      var hasPending = !!(data && data.success && data.pending && data.pending.length);
      var dot = btn.querySelector('.rc-nav-dot');
      if (hasPending && !dot) {
        btn.appendChild(el('span', 'rc-nav-dot'));
      } else if (!hasPending && dot) {
        dot.remove();
      }
    }).catch(function () { /* leave whatever dot state was already showing */ });
  }

  // mustChangePassword forces a password change before the driver can do
  // anything else -- the sidebar/topbar stay hidden and #rc-forced-password
  // shows ONLY the passwordChangeSection() form until it succeeds.
  // passwordChangeSection removes its own box from the DOM on a
  // successful change (see its `box.remove()` call); a MutationObserver
  // watches for that removal and then builds the normal shell, so the
  // forced-password logic is otherwise untouched from v0.4.0.
  function renderProfile(profile, token) {
    if (profile.mustChangePassword) {
      document.getElementById('rc-sidebar').style.display = 'none';
      document.getElementById('rc-topbar').style.display = 'none';

      var lockWrap = document.getElementById('rc-forced-password');
      lockWrap.style.display = 'block';
      lockWrap.innerHTML = '';

      var container = el('div', 'rc-forced-password-wrap');
      container.appendChild(el('p', null, 'For security, please set a new password before continuing to your profile.'));
      var box = passwordChangeSection(token);
      container.appendChild(box);
      lockWrap.appendChild(container);

      var observer = new MutationObserver(function () {
        if (!document.body.contains(box)) {
          observer.disconnect();
          lockWrap.style.display = 'none';
          document.getElementById('rc-sidebar').style.display = '';
          document.getElementById('rc-topbar').style.display = '';
          profile.mustChangePassword = false;
          buildFullProfileUI(profile, token);
        }
      });
      observer.observe(container, { childList: true, subtree: true });
      return;
    }

    buildFullProfileUI(profile, token);
  }

  // ---------------------------------------------------------------------
  // LOAD PROFILE -- deliberately the LAST thing in this script (see the
  // comment near the top of the auth gate for why).
  //
  // Arriving here right after a successful login skips a second getProfile
  // round-trip: login.html's own response already IS a full profile
  // payload, stashed in sessionStorage under 'raceclub_fresh_profile'
  // right before redirecting here. It's read-once (removed immediately),
  // so any other way of arriving at this page still fetches fresh data.
  // ---------------------------------------------------------------------
  document.getElementById('rc-sidebar-nav').classList.add('rc-nav-loading');
  buildSidebarNav();

  var freshProfileRaw = sessionStorage.getItem('raceclub_fresh_profile');
  if (freshProfileRaw) sessionStorage.removeItem('raceclub_fresh_profile');
  var freshProfile = null;
  if (freshProfileRaw) {
    try { freshProfile = JSON.parse(freshProfileRaw); } catch (err) { freshProfile = null; }
  }

  if (freshProfile && freshProfile.success) {
    renderHeader(); // header fetches its own notifications now -- see js/header.js
    document.getElementById('rc-loading').style.display = 'none';
    document.getElementById('rc-profile-root').style.display = 'block';
    renderProfile(freshProfile.profile, token);
  } else {
    fetchApi('getProfile', { token: token })
      .then(function (data) {
        if (!data.success) {
          clearToken();
          sessionStorage.setItem('raceclub_login_message', 'Your session expired — please log in again.');
          window.location.href = 'login.html';
          return;
        }
        setProfileCache(data.profile); // keeps the header avatar current on every other page too
        renderHeader(); // confirmed by the API -- safe to show as logged in; fetches its own notifications now
        document.getElementById('rc-loading').style.display = 'none';
        document.getElementById('rc-profile-root').style.display = 'block';
        renderProfile(data.profile, token);
      })
      .catch(function () {
        renderHeader({ forceLoggedOut: true });
        document.getElementById('rc-loading').style.display = 'none';
        var err = document.getElementById('rc-error');
        err.style.display = 'block';
        err.textContent = 'Could not reach the server. Check API_BASE_URL and try again.';
      });
  }
})();
</script>
