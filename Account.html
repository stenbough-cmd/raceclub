  // Car-class badge colors -- reuses the site's existing --rc-class-*
  // theme variables (same ones the class economy/reputation displays use
  // elsewhere) rather than inventing new colors just for this pill.
  var CLASS_COLOR_VAR = { LMGT3: '--rc-class-lmgt3', LMP2: '--rc-class-lmp2', LMP3: '--rc-class-lmp3', Hypercar: '--rc-class-hypercar' };

  // Five-tier weather icon, per Matt's exact spec:
  //   clear skies (0% rain, sky:'clear')            -> sun
  //   any cloud variation at 0% rain (sky:'cloudy')  -> partly cloudy
  //   25% or less chance of rain                     -> cloud
  //   25-75% chance of rain                           -> medium rain
  //   more than 75% chance of rain                    -> heavy rain
  function weatherIcon(race) {
    var rc = race.rainChance;
    if (rc <= 0) return race.sky === 'cloudy' ? ICON_CLOUD_PARTLY : ICON_SUN;
    if (rc <= 25) return ICON_CLOUD;
    if (rc <= 75) return ICON_RAIN;
    return ICON_RAIN_HEAVY;
  }

  // ---------------------------------------------------------------------
  // THEMED TOOLTIP -- replaces the native `title` attribute (the browser's
  // generic gray tooltip) everywhere a calendar stat or icon needs an
  // on-hover explanation, per Matt's call: "make the tooltip themed
  // similar to our website, not generic, and keep tooltip style the same
  // across any tooltip on the website." Just a class + a data attribute
  // (see .rc-tooltip in style.css for the actual bubble) -- add
  // `rc-tooltip` to any element and set data-tooltip, and it gets the
  // site-styled hover bubble for free. tooltipText() escapes for safe use
  // in the data-tooltip attribute; content is CSS attr()-driven, so
  // updating the attribute later (see the copy-password button) updates
  // the bubble live with no extra re-render.
  // ---------------------------------------------------------------------
  function withTooltip(el_, text) {
    el_.classList.add('rc-tooltip');
    el_.setAttribute('data-tooltip', text);
    return el_;
  }

  // One small icon + value chip -- tires, fuel, setup, weather, points/
  // prize all reuse this so the row stays visually consistent.
  function calStat(iconSvg, text, tooltip) {
    var chip = el('span', 'rc-cal-stat', iconSvg + '<span>' + escapeHtml(text) + '</span>');
    if (tooltip) withTooltip(chip, tooltip);
    return chip;
  }

  // Formats an ISO UTC race start in the driver's own timezone (falling
  // back to the browser's zone if the profile hasn't got one saved) --
  // same fallback approach as wizardAdminTimeZone() above.
  function formatRaceDateTime(iso, tz) {
    try {
      var d = new Date(iso);
      var opts = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' };
      if (tz) opts.timeZone = tz;
      return d.toLocaleString('en-US', opts);
    } catch (err) {
      return iso;
    }
  }

  // Date-only version for bye weeks -- no race time to show.
  function formatByeDate(iso, tz) {
    try {
      var d = new Date(iso);
      var opts = { weekday: 'short', month: 'short', day: 'numeric' };
      if (tz) opts.timeZone = tz;
      return d.toLocaleString('en-US', opts);
    } catch (err) {
      return iso;
    }
  }

  // "P1 25 · P2 18 · ..." -- full points spread for a tier's tooltip, so
  // the visible chip can stay short ("Sprint · 40 min") while hover still
  // gives the whole breakdown.
  function formatPointsList(points) {
    return points.map(function (p, i) { return 'P' + (i + 1) + ' ' + p; }).join(' · ');
  }

  // Season-wide settings from the Create a Season wizard -- server
  // password, classes, points tables, drop weeks, race day/frequency,
  // track limits, private qualifying -- shown once below the season name
  // (Matt's call), same icon-chip styling as each race card's own stat
  // row so the whole Calendar page reads as one visual language.
  function seasonDetailsPanel(details) {
    var wrap = el('div', 'rc-cal-season-details');
    wrap.appendChild(el('h4', 'rc-cal-season-details-title', 'Season Settings'));

    var chips = el('div', 'rc-cal-stats');
    chips.appendChild(calStat(ICON_LOCK, details.serverPassword, 'Season server password'));
    chips.appendChild(calStat(ICON_CALENDAR, details.raceDayOfWeek + 's · ' + details.frequency,
      'Races run every ' + details.raceDayOfWeek + ', ' + details.frequency.toLowerCase()));
    chips.appendChild(calStat(ICON_CALENDAR, details.dropWeeks + ' Drop Week' + (details.dropWeeks === 1 ? '' : 's'),
      'Your worst ' + details.dropWeeks + ' result' + (details.dropWeeks === 1 ? '' : 's') + ' this season won\'t count against your standing'));
    chips.appendChild(calStat(ICON_TRACK, details.trackLimitsPreset + ' Track Limits',
      'Track Limits Preset: ' + details.trackLimitsPreset + ' · Drive-through penalty after ' + details.trackLimitPoints + ' points'));
    chips.appendChild(calStat(details.privateQualifying ? ICON_LOCK : ICON_UNLOCK,
      details.privateQualifying ? 'Private Qualifying' : 'Public Qualifying',
      details.privateQualifying ? 'Qualifying results are hidden until the race' : 'Qualifying results are visible to everyone as soon as the session ends'));
    wrap.appendChild(chips);

    var classesRow = el('div', 'rc-cal-classes');
    classesRow.appendChild(el('span', 'rc-cal-classes-label', 'Classes:'));
    details.classes.forEach(function (c) {
      var pill = el('span', 'rc-cal-class-pill', escapeHtml(c.key) + ' ' + escapeHtml(c.season));
      pill.style.background = 'var(' + CLASS_COLOR_VAR[c.key] + ')';
      classesRow.appendChild(pill);
    });
    wrap.appendChild(classesRow);

    var pointsRow = el('div', 'rc-cal-stats');
    pointsRow.style.marginTop = '10px';
    ['Sprint', 'Medium', 'Long'].forEach(function (tier) {
      var t = details.pointsTables[tier];
      pointsRow.appendChild(calStat(ICON_FLAG, tier + ' · ' + t.duration + ' min', 'Points: ' + formatPointsList(t.points)));
    });
    wrap.appendChild(pointsRow);

    return wrap;
  }

  // roundNum is null for special events -- per Matt's call, special
  // events don't get counted as a numbered "Race 0N" round, they just
  // carry their own name. Assigned by renderCalendarSection() based on
  // chronological position among the non-special races only.
  function raceCard(race, driverTz, roundNum) {
    // Bye week -- a blank placeholder container, per Matt's call, instead
    // of any detail screen. Just enough to show a gap in the schedule was
    // intentional, not a missing race.
    if (race.bye) {
      var byeCard = el('div', 'rc-cal-race rc-cal-bye');
      byeCard.appendChild(el('div', null, 'Bye Week'));
      byeCard.appendChild(el('div', 'rc-cal-bye-date', escapeHtml(formatByeDate(race.startUtc, driverTz))));
      return byeCard;
    }

    var card = el('div', 'rc-cal-race' + (race.finished ? ' rc-cal-finished' : ''));

    var head = el('div', 'rc-cal-race-head');
    var roundLabel = roundNum ? ('Race ' + (roundNum < 10 ? '0' + roundNum : roundNum)) : '';
    var nameHtml = escapeHtml(race.name || roundLabel);
    var nameEl = el('div', 'rc-cal-race-name', nameHtml);
    if (race.special) {
      var star = el('span', 'rc-cal-race-star', ICON_NAV_STAR);
      withTooltip(star, 'Special event — does not count toward the championship');
      nameEl.insertBefore(star, nameEl.firstChild);
    }
    head.appendChild(nameEl);
    if (race.finished) head.appendChild(el('span', 'rc-cal-finished-pill', 'Completed'));
    card.appendChild(head);

    card.appendChild(el('div', 'rc-cal-track',
      ICON_TRACK + ' <strong>' + escapeHtml(race.track) + '</strong>' +
      (race.layout ? ' <span class="rc-cal-layout">(' + escapeHtml(race.layout) + ')</span>' : '')));

    var dt = el('div', 'rc-cal-datetime');
    dt.innerHTML =
      '<span>' + ICON_CALENDAR + escapeHtml(formatRaceDateTime(race.startUtc, driverTz)) + '</span>' +
      '<span>' + ICON_CLOCK + 'In-game: ' + escapeHtml(race.igTime) + '</span>';
    card.appendChild(dt);

    card.appendChild(el('div', 'rc-cal-sessions',
      'Practice ' + race.practiceMin + ' min &middot; Qualifying ' + race.qualifyingMin + ' min &middot; Race ' + race.raceLengthMin + ' min'));

    var stats = el('div', 'rc-cal-stats');
    stats.appendChild(calStat(weatherIcon(race), race.rainChance + '% rain', 'Weather'));
    stats.appendChild(calStat(ICON_TIRE, race.tireSets + ' sets · ' + race.tireWearX + 'x wear', 'Tires'));
    stats.appendChild(calStat(ICON_FUEL, race.fuelX + 'x fuel', 'Fuel multiplier'));
    stats.appendChild(calStat(race.fixedSetup ? ICON_LOCK : ICON_UNLOCK, race.fixedSetup ? 'Fixed Setup' : 'Open Setup', 'Setup'));
    // Special events run for a prize pool instead of championship points
    // (Matt's call) -- the chip just says "Prize Pool"; hovering reveals
    // the actual prize pool and event-points values, since those never
    // show up in the championship standings otherwise.
    if (race.special) {
      stats.appendChild(calStat(ICON_FINANCES, 'Prize Pool',
        '$' + race.prizePool + ' prize pool · ' + race.bonusPoints + ' event points (does not count toward the championship)'));
    } else {
      stats.appendChild(calStat(ICON_FLAG, race.pointsTier, 'Awards full championship points for this round'));
    }
    card.appendChild(stats);

    return card;
  }

  function renderCalendarSection(profile) {
    var section = document.getElementById('rc-section-calendar');
    section.innerHTML = '';
    section.appendChild(el('h2', 'margin-top:0;', 'Calendar'));

    var driverTz = (profile && profile.timeZone) || (function () {
      try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (err) { return ''; }
    })();

    var season = el('div', 'rc-panel rc-cal-season');
    var seasonHead = el('div', 'rc-cal-season-head');
    seasonHead.appendChild(el('h3', 'rc-cal-season-title', escapeHtml(CALENDAR_MOCK_SEASON.seasonName)));
    seasonHead.appendChild(el('p', 'rc-cal-season-sub',
      'Mock schedule shown below — the live season calendar isn\'t wired up to real data yet. Times are shown in your saved time zone' +
      (driverTz ? ' (' + escapeHtml(driverTz) + ').' : '.')));
    season.appendChild(seasonHead);
    season.appendChild(seasonDetailsPanel(CALENDAR_MOCK_SEASON.details));

    // Chronological by date, full stop -- special events (and bye weeks)
    // sort right in alongside normal rounds (Matt's call), they just
    // never get a "Race 0N" number of their own (see roundNum below).
    // Once Season Creation actually bakes round numbers + dates into the
    // sheet, this sort becomes redundant with the data itself, but costs
    // nothing to keep.
    var sorted = CALENDAR_MOCK_SEASON.races.slice().sort(function (a, b) {
      return new Date(a.startUtc) - new Date(b.startUtc);
    });

    var list = el('div', 'rc-cal-race-list');
    var roundCounter = 0;
    sorted.forEach(function (race) {
      var roundNum = null;
      if (!race.special && !race.bye) { roundCounter++; roundNum = roundCounter; }
      list.appendChild(raceCard(race, driverTz, roundNum));
    });
    season.appendChild(list);

    section.appendChild(season);
  }

  // ---------------------------------------------------------------------
  // HELP — a real page (same h2-title convention as every other section),
  // currently just a Rulebook launcher. RULEBOOK_SECTIONS comes from
  // js/rulebook-content.js (included in <head>) so growing the rulebook

  function renderHelpSection(profile) {
    var section = document.getElementById('rc-section-help');

    section.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;max-width:640px;line-height:1.6;margin-bottom:24px;',

      'The full Race Club Rulebook — driving standards, penalties, reputation, class progression, and more. Still growing as we finish designing each section.'));
    var openBtn = el('button', null, 'Open Rulebook');
    openBtn.type = 'button';
    openBtn.className = 'rc-btn-primary rc-btn-sm';
    openBtn.addEventListener('click', openRulebookModal);
    panel.appendChild(openBtn);
    section.appendChild(panel);
  }

  // Builds one <a> in the popup's index and one section in its body from
  // the same RULEBOOK_SECTIONS entry, so the two can never drift out of
  // sync with each other.
  function openRulebookModal() {
    var modal = showModal('Race Club Rulebook', { wide: true });
    var body = modal.body;

    var index = el('div', 'rc-rulebook-index');
    RULEBOOK_SECTIONS.forEach(function (sec) {
      var a = document.createElement('a');
      a.href = '#rc-rulebook-sec-' + sec.id;
      a.className = sec.draft ? 'rc-rulebook-draft' : '';
      a.textContent = sec.num + '. ' + sec.title + (sec.draft ? ' (not yet drafted)' : '');
      a.addEventListener('click', function (evt) {
        evt.preventDefault();
        var target = document.getElementById('rc-rulebook-sec-' + sec.id);
        if (target) target.scrollIntoView({ block: 'start' });
      });
      index.appendChild(a);
    });
    body.appendChild(index);

    RULEBOOK_SECTIONS.forEach(function (sec) {
      var secEl = el('div', 'rc-rulebook-section');
      secEl.id = 'rc-rulebook-sec-' + sec.id;
      secEl.appendChild(el('h3', null, sec.num + '. ' + escapeHtml(sec.title)));
      if (sec.draft) {
        secEl.appendChild(el('p', 'rc-rulebook-draft-note', sec.draftNote || 'Not yet drafted.'));
      } else {
        secEl.appendChild(el('div', null, sec.html));
      }
      body.appendChild(secEl);
    });
  }

  // ---------------------------------------------------------------------
  // NOTIFICATION BUBBLES — generic infra, per the site's design rule: if
  // new content is awaiting a driver (a sponsor offer, a wager challenge,
  // a finalized incident ruling, an Admin approval queue item, whatever
  // the case may be), a dot shows on BOTH the relevant sidebar link
  // (rc-nav-dot-<categoryId>, added to every nav button by addNavDot()
  // above) AND the header avatar (js/header.js's updateHeaderNotifDot()).
  // Today only Admin actually feeds this (see updatePendingDots() below)
  // -- none of sponsors/wagers/reputation rulings are wired up on the
  // backend yet -- but the mechanism itself is fully general so wiring a
  // future feature in is just a setNavNotif('sponsors', true) call away,
  // not a new pattern to invent.
  //
  // RC_NOTIF_STATE tracks each category independently so one category
  // clearing its own dot never wipes out a different category's --
  // the header dot only goes fully dark once EVERY tracked category is
  // clear (see the .some(...) check below).
  // ---------------------------------------------------------------------
  var RC_NOTIF_STATE = {};
  function setNavNotif(categoryId, hasPending) {
    RC_NOTIF_STATE[categoryId] = !!hasPending;
    var dot = document.getElementById('rc-nav-dot-' + categoryId);
    if (dot) dot.style.display = hasPending ? 'block' : 'none';
    var anyPending = Object.keys(RC_NOTIF_STATE).some(function (k) { return RC_NOTIF_STATE[k]; });
    if (typeof updateHeaderNotifDot === 'function') updateHeaderNotifDot(anyPending);
  }

  // ---------------------------------------------------------------------
  // ADMIN NOTIFICATION CACHE — one shared pending-accounts fetch, reused
  // by both the notification dot (fired immediately on page load, see
  // buildFullProfileUI) and the approval queue panel itself (fired lazily
  // the first time Admin is opened, see ADMIN LAZY LOAD below). Without
  // this, opening Admin would always re-fetch data that was, in most
  // cases, already sitting there from the moment the page loaded.
  // ---------------------------------------------------------------------
  var pendingAccountsPromise = null;
  var currentProfile = null; // set in buildFullProfileUI, read by the Admin nav button's onClick
  function fetchPendingAccountsOnce(token) {
    if (!pendingAccountsPromise) {
      pendingAccountsPromise = fetchApi('adminListPendingAccounts', { token: token });
    }
    return pendingAccountsPromise;
  }
  // Called after any action that changes the queue (approve/reject) so the
  // NEXT read (dot or panel) reflects reality instead of stale cached data.
  function refreshPendingAccounts(token) {
    pendingAccountsPromise = fetchApi('adminListPendingAccounts', { token: token });
    return pendingAccountsPromise;
  }
  // Shared between the eager on-load dot check and the approval queue
  // panel's own render -- one place that knows how to light up (or clear)
  // both the sidebar nav dot and the header avatar's dot from the same
  // response shape. Reusable for future Organizer/Driver notifications
  // too, whenever those exist -- same pattern, different data source.
  function updatePendingDots(data) {
    if (!data || !data.success) return;
    var total = data.organizerRequests.length + data.driverRequests.length + data.unverifiedSignups.length;
    setNavNotif('admin', total > 0);
  }

  // ---------------------------------------------------------------------
  // APPROVAL QUEUE (Admin only) — Prospects grouped by request type.
  // preloadedData, when passed, skips the initial fetch entirely and
  // renders straight from data the caller already has (see ADMIN LAZY
  // LOAD below, which passes in whatever fetchPendingAccountsOnce()
  // already resolved for the notification dot). Approve/Reject actions
  // still always do a live refetch (loadQueue()) since the data has
  // genuinely changed at that point.
  // ---------------------------------------------------------------------
  function approvalQueueSection(token, preloadedData) {
    var box = document.createElement('div');
    box.className = 'rc-panel';
    box.appendChild(el('h3', 'margin-top:0;', 'Pending Approvals'));
    var body = el('div', 'font-size:13px;color:var(--rc-steel);', 'Loading...');
    box.appendChild(body);

    function actOn(action, userId, extra, onDone) {
      var payload = Object.assign({ targetUserId: userId }, extra || {});
      fetchApi(action, { method: 'POST', token: token, body: payload }).then(onDone);
    }

    function renderEntry(entry, group) {
      var row = el('div', 'padding:10px 0;border-bottom:1px solid var(--rc-silver);');
      row.appendChild(el('div', 'font-weight:600;', entry.realName + ' &middot; @' + entry.username +
        (group === 'organizer' ? '<span class="rc-badge">ORGANIZER REQUEST</span>' : '')));
      row.appendChild(el('div', 'color:var(--rc-steel);font-size:12px;margin-top:2px;',
        entry.email + (entry.emailVerified ? '' : ' &mdash; email not verified yet')));

      if (entry.emailVerified) {
        var actions = el('div', 'margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;');
        var roleSelect = el('select');
        roleSelect.style.cssText = 'width:auto;display:inline-block;padding:6px;margin:0;height:auto;';
        ['Driver', 'Organizer'].forEach(function (r) {
          var opt = el('option', null, r); opt.value = r;
          if (r === entry.requestedRole) opt.selected = true;
          roleSelect.appendChild(opt);
        });
        // rc-btn-sm on both -- same site-wide standard as every other
        // button row (was a bare .rc-btn-primary with a hand-rolled
        // padding override next to a bare .rc-btn-secondary, which put
        // Approve at a different font size than Reject right beside it).
        var approveBtn = el('button', null, 'Approve'); approveBtn.className = 'rc-btn-primary rc-btn-sm';
        var rejectBtn = el('button', null, 'Reject'); rejectBtn.className = 'rc-btn-secondary rc-btn-sm';
        var status = el('span', 'font-size:12px;');

        approveBtn.addEventListener('click', function () {
          actOn('adminApproveAccount', entry.userId, { grantedRole: roleSelect.value }, function (data) {
            status.style.color = data.success ? 'var(--rc-ok)' : 'var(--rc-red)';
            status.textContent = data.message || '';
            if (data.success) loadQueue();
          });
        });
        rejectBtn.addEventListener('click', function () {
          actOn('adminRejectAccount', entry.userId, {}, function (data) {
            status.style.color = data.success ? 'var(--rc-ok)' : 'var(--rc-red)';
            status.textContent = data.message || '';
            if (data.success) loadQueue();
          });
        });

        actions.appendChild(roleSelect);
        actions.appendChild(approveBtn);
        actions.appendChild(rejectBtn);
        actions.appendChild(status);
        row.appendChild(actions);
      }
      return row;
    }

    function renderData(data) {
      body.innerHTML = '';
      if (!data.success) { body.textContent = data.message || 'Could not load pending accounts.'; return; }

      updatePendingDots(data);
      var total = data.organizerRequests.length + data.driverRequests.length + data.unverifiedSignups.length;
      if (total === 0) {
        body.appendChild(el('div', 'color:var(--rc-steel);', 'No pending accounts.'));
      }
      if (data.organizerRequests.length) {
        body.appendChild(el('div', 'font-weight:700;margin-top:10px;color:var(--rc-red);', 'Organizer Requests'));
        data.organizerRequests.forEach(function (e) { body.appendChild(renderEntry(e, 'organizer')); });
      }
      if (data.driverRequests.length) {
        body.appendChild(el('div', 'font-weight:700;margin-top:10px;', 'Driver Requests'));
        data.driverRequests.forEach(function (e) { body.appendChild(renderEntry(e, 'driver')); });
      }
      if (data.unverifiedSignups.length) {
        body.appendChild(el('div', 'font-weight:700;margin-top:10px;color:var(--rc-steel);', 'Awaiting Email Verification'));
        data.unverifiedSignups.forEach(function (e) { body.appendChild(renderEntry(e, 'unverified')); });
      }
    }

    // Used after Approve/Reject -- always a genuine refetch, since the
    // data just changed. Also re-syncs the notification dots.
    function loadQueue() {
      refreshPendingAccounts(token).then(renderData);
    }

    if (preloadedData) {
      renderData(preloadedData);
    } else {
      loadQueue();
    }

    return box;
  }

  // v0.18 -- the old "Manage Users" panel (accountManagementSection) that
  // used to live here has been removed: editing a driver's username,
  // creating a login, and resetting a password all now live in Data
  // Management > Drivers' Edit modal instead (see driversManagementSection
  // below), which is the one place to manage a driver's account end to
  // end (profile fields + login together). adminUpdateUser/
  // adminResetPassword/adminCreateUser are unchanged server-side --
  // only this duplicate front-end panel is gone.

  // Shared by renderLeagueSection() and the Admin-enabling branch in
  // buildFullProfileUI() below -- either one showing up means the upper
  // divider (between the general links and League/Admin) should show too.
  function showUpperNavDivider() {
    var divider = document.getElementById('rc-nav-divider-upper');
    if (divider) divider.style.display = '';
  }

  // =======================================================================
  // SEASON CREATION WIZARD — opened from League Management's "Create
  // Season" button. Per Matt's design rule, any detailed management
  // screen (more than simple toggles) opens as a popup -- this reuses
  // showModal() (see above) with Next/Back page navigation across three
  // pages: Season Details, Race Events, Season Preview, matching the
  // design doc's two-step wizard (Season Setup / Per-Race Details) plus
  // the Preview page Matt asked for on top of it. Field set mirrors the
  // "Season Creation Wizard" section of v0.3-Economy-Reputation-Design.md
  // as closely as a front-end-only build reasonably can.
  //
  // HONEST LIMITATION: there is no backend endpoint yet to actually save
  // a season -- clicking "Create Season" on the Preview page shows the
  // same branded spinner used everywhere else on the site for a moment,
  // then plainly says so instead of pretending to succeed. The draft
  // itself is real, though: every field is written to localStorage
  // (device/browser-only, per Matt's call -- not real server-side
  // persistence) as the admin moves between pages, so a half-finished
  // wizard survives closing the tab and can be resumed later.
  // =======================================================================
  var WIZARD_DRAFT_KEY = 'raceclub_season_wizard_draft';
  var WIZARD_STEPS = ['Season Details', 'Race Events', 'Season Preview'];

  // Real LMU track/layout list (Matt's exact list). This is the hardcoded
  // FALLBACK -- loadWizardTrackList() below overwrites both of these
  // module-level vars in place (so every closure already holding a
  // reference keeps working) with whatever the Tracks tab returns from
  // action=getTracks, the moment the wizard's page loads and that fetch
  // resolves. If the fetch fails (offline, endpoint not deployed yet),
  // this list is what the wizard uses instead -- never a blank dropdown.
  // A season drafted against a track name that later disappears from a
  // refreshed list still displays fine: trackLayoutOptions() below falls
  // back to ['Standard'] for any track it doesn't recognize.
  var WIZARD_TRACK_LIST = [
    'Autódromo Internacional do Algarve (Portimão)',
    'Autódromo José Carlos Pace (Interlagos)',
    'Autodromo Internazionale Enzo e Dino Ferrari (Imola)',
    'Autodromo Nazionale Monza',
    'Bahrain International Circuit',
    'Circuit de Barcelona-Catalunya',
    'Circuit de la Sarthe',
    'Circuit of the Americas (COTA)',
    'Circuit Paul Ricard',
    'Circuit de Spa-Francorchamps',
    'Daytona International Speedway',
    'Fuji International Speedway',
    'Lusail International Circuit',
    'Sebring International Raceway',
    'Silverstone Circuit',
    'WeatherTech Raceway Laguna Seca'
  ];
  // Every active car entry (Data Management > Cars), fetched fresh the
  // moment the wizard is opened by loadWizardCarList() -- see
  // openSeasonWizardWithLoad() further down. Starts empty (not fetched
  // yet); the Format section's class checkboxes treat "no data yet" the
  // same as "no cars this season" (greyed out) rather than guessing, since
  // openSeasonWizardWithLoad() always waits for this fetch to settle
  // (success OR failure) before the wizard itself ever opens.
  var WIZARD_CARS = [];
  var WIZARD_WEATHER_LIST = ['Clear', 'Light Clouds', 'Partially Cloudy', 'Overcast', 'Cloudy & Drizzle', 'Cloudy & Light Rain', 'Overcast & Light Rain', 'Overcast & Rain', 'Overcast & Heavy Rain', 'Overcast & Storm'];
  // Only weather that actually involves rain gets a Chance of Rain box --
  // Clear/Light Clouds/Partially Cloudy/Overcast are all dry (Matt's
  // call: "only cloudy and drizzle and all rain options below that can
  // have a percentage of rain -- otherwise the rain percentage is grayed
  // out and unclickable"). Listed explicitly rather than derived from
  // WIZARD_WEATHER_LIST's index so the split stays correct even if the
  // list above is ever reordered.
  var WIZARD_RAIN_WEATHER = ['Cloudy & Drizzle', 'Cloudy & Light Rain', 'Overcast & Light Rain', 'Overcast & Rain', 'Overcast & Heavy Rain', 'Overcast & Storm'];
  function weatherAllowsRainChance(weather) { return WIZARD_RAIN_WEATHER.indexOf(weather) !== -1; }
  // Keeps a Chance of Rain box's disabled/greyed state (and value) in
  // sync with its Weather select -- call once up front to set the
  // initial state, then again every time Weather changes. onForceZero
  // fires only when the box gets locked back to 0 so the caller can
  // update its own state object to match what's now shown on screen.
  function syncRainInputToWeather(weatherSelect, rainInput, onForceZero) {
    var allowed = weatherAllowsRainChance(weatherSelect.value);
    rainInput.disabled = !allowed;
    rainInput.classList.toggle('rc-field-locked', !allowed);
    if (!allowed && Number(rainInput.value) !== 0) {
      rainInput.value = 0;
      onForceZero();
    }
  }
  // Layout/configuration options per track. Matt's call: Layout should be
  // a dropdown populated from the chosen Track, not a free-text box ("it
  // won't be a free text box"). These aren't generic "Standard" base
  // configs -- most of these tracks host both WEC and/or ELMS rounds on
  // slightly different base layouts, so WEC/ELMS are their own separate
  // base options (Matt's call: "instead of just the track names, these
  // are the base tracks for each series -- WEC and ELMS base variants
  // should be separate options"). A track that races in only one series
  // gets just that one base option; Daytona and Laguna Seca are IMSA-only
  // (no WEC/ELMS round), so they keep the generic 'Standard' base. Any
  // OTHER named variant that already existed (short circuits, no-chicane
  // configs, club layouts) stays alongside the WEC/ELMS base(s) -- those
  // are genuinely different physical configurations, not a series split.
  var WIZARD_TRACK_LAYOUTS = {
    'Autódromo Internacional do Algarve (Portimão)': ['WEC', 'ELMS'],
    'Autódromo José Carlos Pace (Interlagos)': ['WEC'],
    'Autodromo Internazionale Enzo e Dino Ferrari (Imola)': ['WEC', 'ELMS'],
    'Autodromo Nazionale Monza': ['WEC', 'Curva Grande Layout'],
    'Bahrain International Circuit': ['WEC', 'Bahrain International Endurance Circuit', 'Bahrain International Outer Circuit', 'Bahrain International Paddock Circuit'],
    'Circuit de Barcelona-Catalunya': ['ELMS'],
    'Circuit de la Sarthe': ['WEC', 'Mulsanne No Chicanes'],
    'Circuit of the Americas (COTA)': ['WEC', 'COTA National'],
    'Circuit Paul Ricard': ['ELMS', '1A', '1A v2', '1A v2 Short', '3A'],
    'Circuit de Spa-Francorchamps': ['WEC', 'ELMS'],
    'Daytona International Speedway': ['Standard'],
    'Fuji International Speedway': ['WEC', 'Fuji Classic (No Chicane)'],
    'Lusail International Circuit': ['WEC', 'Lusail Short Circuit'],
    'Sebring International Raceway': ['WEC', 'Sebring School Circuit'],
    'Silverstone Circuit': ['WEC', 'ELMS', 'Silverstone International', 'Silverstone National'],
    'WeatherTech Raceway Laguna Seca': ['Standard']
  };
  function trackLayoutOptions(track) { return WIZARD_TRACK_LAYOUTS[track] || ['Standard']; }
  // Pulls the live track/layout list from the Tracks tab (action=getTracks,
  // see 5_Website.gs) and overwrites WIZARD_TRACK_LIST/WIZARD_TRACK_LAYOUTS
  // IN PLACE (length reset + push, not reassignment) so every wizard
  // closure/dropdown built against the original array reference stays in
  // sync automatically.
  //
  // v0.17 -- NOT called at page load anymore. Per Matt's call ("only
  // relevant information at the time should ever be loaded" -- admins
  // shouldn't wait on data they haven't asked for, and drivers should
  // never pay for it at all since they never open this wizard), this now
  // only runs the moment "Create Season" is actually clicked -- see
  // openSeasonWizardWithLoad() below, which shows the same branded
  // spinner used everywhere else on the site while this (and
  // loadWizardCarList(), alongside it) resolves. Returns the fetchApi
  // promise so the caller can wait on it. Silently keeps the hardcoded
  // fallback above on any failure (offline, endpoint not deployed yet,
  // malformed response) -- a broken track fetch should never block season
  // creation.
  function loadWizardTrackList() {
    if (typeof fetchApi !== 'function') return Promise.resolve();
    return fetchApi('getTracks').then(function (res) {
      if (!res || !res.success || !res.tracks || !res.tracks.length) return;
      var names = [];
      var layouts = {};
      res.tracks.forEach(function (t) {
        if (!t || !t.trackName) return;
        if (names.indexOf(t.trackName) === -1) { names.push(t.trackName); layouts[t.trackName] = []; }
        var layoutName = t.layout || 'Standard';
        if (layouts[t.trackName].indexOf(layoutName) === -1) layouts[t.trackName].push(layoutName);
      });
      if (!names.length) return;
      // Alphabetical, not whatever order the Sheet's SortOrder column
      // happens to have -- Data Management > Tracks no longer offers
      // manual reordering (Matt's call), so this dropdown shouldn't stay
      // pinned to old/insertion order either. Same rule as everywhere
      // else in this project now: tracks are always A-Z.
      names.sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0; });
      Object.keys(layouts).forEach(function (k) { layouts[k].sort(function (a, b) { return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0; }); });
      WIZARD_TRACK_LIST.length = 0;
      names.forEach(function (n) { WIZARD_TRACK_LIST.push(n); });
      Object.keys(WIZARD_TRACK_LAYOUTS).forEach(function (k) { delete WIZARD_TRACK_LAYOUTS[k]; });
      Object.keys(layouts).forEach(function (k) { WIZARD_TRACK_LAYOUTS[k] = layouts[k]; });
    }).catch(function (err) {
      // Offline/endpoint not deployed yet -- keep the hardcoded fallback.
    });
  }

  // Sibling of loadWizardTrackList() -- pulls every active car (Data
  // Management > Cars, action=getCars, see 5_Website.gs) into WIZARD_CARS
  // IN PLACE, same reasoning as above. No season filter is sent -- each
  // class picks its own season independently (Matt's call: a 2026 LMGT3
  // roster and a 2025 LMP2 roster can coexist in the same Race Club
  // season, just not two different seasons of the SAME class at once).
  // availableSeasonsForClass() in renderWizardSeasonDetailsPage reads the
  // full fetched list client-side, per class.
  function loadWizardCarList() {
    if (typeof fetchApi !== 'function') return Promise.resolve();
    return fetchApi('getCars').then(function (res) {
      WIZARD_CARS.length = 0;
      if (!res || !res.success || !res.cars) return;
      res.cars.forEach(function (c) { if (c && c.carClass) WIZARD_CARS.push(c); });
    }).catch(function (err) {
      // Offline/endpoint not deployed yet -- WIZARD_CARS stays whatever it
      // already was (empty on first open), so every class just shows
      // greyed out rather than the wizard breaking.
    });
  }

  // Shows the branded spinner in a small modal, fetches tracks + cars
  // together, then opens the real wizard (openSeasonWizard, defined
  // further down) once both have settled -- success or failure either way,
  // since both loaders already fall back gracefully on their own. This is
  // the ONLY place either loader gets called from (see the Create Season
  // button in renderLeagueSection below) -- replaces the old load-on-
  // page-load behavior.
  function openSeasonWizardWithLoad() {
    var loadingModal = showModal('Create a Season', { wide: true });
    loadingModal.body.appendChild(buildSpinner('Loading season variables...'));
    Promise.all([loadWizardTrackList(), loadWizardCarList()]).then(function () {
      loadingModal.close();
      openSeasonWizard();
    });
  }

  // Local-timezone YYYY-MM-DD for today -- used to default date pickers
  // to today instead of leaving them blank (Matt's call: real default
  // values, not placeholder text).
  function todayDateStr() {
    var d = new Date();
    var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = '0' + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  function isoFromDate(d) {
    var mm = String(d.getMonth() + 1); if (mm.length < 2) mm = '0' + mm;
    var dd = String(d.getDate()); if (dd.length < 2) dd = '0' + dd;
    return d.getFullYear() + '-' + mm + '-' + dd;
  }
  // Human-readable label for a schedule dropdown option -- e.g.
  // "Sat, Sep 5, 2026" -- so the bye week picker reads like a real
  // calendar choice instead of a raw ISO string.
  function formatDateLabel(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  // Wraps a plain <input type="time"> with a small static badge next to
  // it -- currently just "Sim Time" for the In-Game Practice/Qualify/Race
  // start times, which are the simulated LMU clock and not a real-world
  // join time. Real-world wall-clock time fields (Event/Season/Special
  // Event Start Time) no longer get a visible badge here (Matt's call:
  // "remove the time zone behind the time boxes") -- see
  // wizardAdminTimeZone()/state.enteredTimeZone below for how the admin's
  // timezone is still captured, just not displayed inline anymore.
  function wizTimeWithBadge(inputEl, badgeText) {
    var wrap = el('div', 'display:flex;align-items:center;gap:8px;width:100%;');
    wrap.appendChild(inputEl);
    if (badgeText) wrap.appendChild(el('span', 'rc-wiz-badge', badgeText));
    return wrap;
  }
  // Adds `steps` cadence periods (Weekly/Biweekly/Monthly) to a YYYY-MM-DD
  // date -- Monthly advances by calendar month (not a fixed day count) so
  // "the 5th of every month" stays the 5th regardless of month length.
  function addCadence(dateStr, frequency, steps) {
    var d = new Date(dateStr + 'T00:00:00');
    if (frequency === 'Monthly') {
      d.setMonth(d.getMonth() + steps);
    } else {
      d.setDate(d.getDate() + (frequency === 'Biweekly' ? 14 : 7) * steps);
    }
    return isoFromDate(d);
  }
  // Bye weeks and drop weeks are both capped at (races this season - 1),
  // 4 max either way (Matt's call) -- a season can't be ALL byes, and 4 is
  // the hard ceiling regardless of how many races are scheduled.
  function maxByeDropForRaces(numRaces) {
    return Math.max(0, Math.min(4, (parseInt(numRaces, 10) || 0) - 1));
  }
  // The full set of calendar slots this season could possibly use --
  // races AND bye weeks each consume one slot, spaced by Frequency,
  // starting at Season Start Date. Bye week dropdowns are restricted to
  // exactly this list ("only the dates it could possibly be"); race dates
  // are whichever slots aren't claimed by a bye week (see
  // computeRaceDates() below) -- so picking a bye week on what would have
  // been a race's slot automatically pushes that race (and everything
  // after it) to the next available slot, with no separate "collision"
  // logic needed.
  function computeSeasonSlots(state) {
    var byeCount = Math.max(0, Math.min(4, parseInt(state.byeWeeks, 10) || 0));
    var raceCount = Math.max(0, parseInt(state.numRaces, 10) || 0);
    var total = raceCount + byeCount;
    var start = state.seasonStartDate || todayDateStr();
    var slots = [];
    for (var i = 0; i < total; i++) slots.push(addCadence(start, state.frequency, i));
    return slots;
  }
  // Race dates = the season's slots minus whichever ones are claimed as
  // bye weeks, taken in calendar order and capped to Number Of Races. A
  // duplicate bye week pick (two byes landing on the same date) just
  // leaves one slot unused at the end rather than causing a collision.
  function computeRaceDates(state) {
    var slots = computeSeasonSlots(state);
    var byeSet = {};
    (state.byeWeekDates || []).forEach(function (d) { if (d) byeSet[d] = true; });
    var raceDates = slots.filter(function (d) { return !byeSet[d]; });
    return raceDates.slice(0, Math.max(0, parseInt(state.numRaces, 10) || 0));
  }

  // ---- small field-building helpers, reusing the exact same el()/
  // fieldPairRow() primitives the rest of this file uses (see EDIT
  // PROFILE FORM above) so the wizard looks and behaves like the rest of
  // the site rather than inventing new form patterns. ----
  //
  // wizField wraps every field in .rc-wiz-field (margin-bottom, see
  // style.css) so there's always breathing room before the next field or
  // subhead, even for fields that don't carry a hint underneath them.
  function wizLabel(text) { return el('label', 'margin-top:0;', escapeHtml(text)); }
  function wizField(labelText, inputEl, hintText) {
    var wrap = el('div', 'rc-wiz-field');
    wrap.appendChild(wizLabel(labelText));
    wrap.appendChild(inputEl);
    if (hintText) wrap.appendChild(el('div', 'rc-hint', hintText));
    return wrap;
  }
  // Two-column version of wizField/fieldPairRow -- each column is its own
  // .rc-wiz-field (label + input + optional hint), so a hint lives
  // directly under the box it explains instead of one combined hint
  // floating below the whole row (Matt's call: economy notes joined with
  // a semicolon were "sloppy" -- "why can't each have a note that lives
  // directly underneath the box?"). Pass null/omit either hint to leave
  // that column without one.
  function wizFieldPairRow(labelA, fieldA, hintA, labelB, fieldB, hintB) {
    var row = el('div', 'rc-wiz-field-pair');
    var colA = el('div', 'rc-wiz-field');
    colA.appendChild(wizLabel(labelA));
    colA.appendChild(fieldA);
    if (hintA) colA.appendChild(el('div', 'rc-hint', hintA));
    var colB = el('div', 'rc-wiz-field');
    colB.appendChild(wizLabel(labelB));
    colB.appendChild(fieldB);
    if (hintB) colB.appendChild(el('div', 'rc-hint', hintB));
    row.appendChild(colA);
    row.appendChild(colB);
    return row;
  }
  function wizTextInput(value, onInput) {
    var input = el('input'); input.type = 'text'; input.value = value || '';
    input.addEventListener('input', function () { onInput(input.value); });
    return input;
  }
  function wizNumberInput(value, onInput, opts) {
    opts = opts || {};
    var input = el('input'); input.type = 'number';
    input.value = (value === undefined || value === null || value === '') ? '' : value;
    if (opts.min !== undefined) input.min = opts.min;
    if (opts.max !== undefined) input.max = opts.max;
    if (opts.step !== undefined) input.step = opts.step;
    input.addEventListener('input', function () { onInput(input.value === '' ? '' : Number(input.value)); });
    return input;
  }
  // Fuel Consumption Multiplier / Tire Wear Multiplier options (Race
  // Settings) -- Matt's correction: these are multipliers on the sim's
  // own base consumption rate, not raw percentages. "Realistic" is LMU's
  // own normal/1x rate; "Off" disables consumption entirely.
  var RACE_SETTINGS_MULTIPLIER_OPTIONS = ['Off', 'Realistic', '2x', '3x'];

  // No blank "— Select —" option -- every dropdown in this wizard already
  // defaults to a real value, so Matt's call is there's nothing to force a
  // choice on. `value` should always be one of `options`.
  function wizSelect(options, value, onChange) {
    var select = document.createElement('select');
    options.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      if (opt === value) o.selected = true;
      select.appendChild(o);
    });
    select.addEventListener('change', function () { onChange(select.value); });
    return select;
  }
  // Suffix dropdown for the Data Management > Drivers Add/Edit forms --
  // same DRIVER_NAME_SUFFIXES list the registration form uses, with a
  // real "None" label on the blank option instead of an empty-looking row.
  function wizSuffixSelect(value) {
    var select = document.createElement('select');
    var blank = document.createElement('option'); blank.value = ''; blank.textContent = 'None';
    if (!value) blank.selected = true;
    select.appendChild(blank);
    DRIVER_NAME_SUFFIXES.forEach(function (s) {
      var o = document.createElement('option'); o.value = s; o.textContent = s;
      if (s === value) o.selected = true;
      select.appendChild(o);
    });
    return select;
  }
  function wizCheckboxRow(labelText, checked, onChange) {
    var label = document.createElement('label');
    var input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = !!checked;
    input.addEventListener('change', function () { onChange(input.checked); });
    label.appendChild(input);
    label.appendChild(document.createTextNode(' ' + labelText));
    return label;
  }
  // ---- hard-stop validation ("every box has to be filled out" before
  // Next is allowed to advance -- Matt's call). Each page-render function
  // is handed a shared `requiredEls` array and pushes one entry per
  // mandatory field/group; openSeasonWizard's Next handler walks the
  // array on click. Entries are duck-typed {isValid, markInvalid,
  // clearInvalid} rather than raw elements so a single-input field and a
  // multi-checkbox group can both be validated the same way. ----
  //
  // Wraps a text/number/date/time input as required: registers it into
  // requiredEls and clears ITS OWN red state the moment it becomes valid
  // again, so the admin gets instant per-field feedback while fixing
  // things rather than waiting for another Next click.
  function requireField(inputEl, requiredEls) {
    var entry = {
      isValid: function () { return String(inputEl.value).trim() !== ''; },
      markInvalid: function () { inputEl.classList.add('rc-field-invalid'); },
      clearInvalid: function () { inputEl.classList.remove('rc-field-invalid'); }
    };
    inputEl.addEventListener('input', function () { if (entry.isValid()) entry.clearInvalid(); });
    requiredEls.push(entry);
    return inputEl;
  }
  // Wraps a checkbox/checkbox-group container as required via a custom
  // isValid check (e.g. "at least one class picked") instead of a single
  // field's own value -- red state renders as a left border on the
  // wrapping element since there's no single box to redden.
  function requireGroup(wrapEl, isValidFn, requiredEls) {
    var entry = {
      isValid: isValidFn,
      markInvalid: function () { wrapEl.classList.add('rc-field-invalid-group'); },
      clearInvalid: function () { wrapEl.classList.remove('rc-field-invalid-group'); }
    };
    requiredEls.push(entry);
    return entry;
  }
  function wizSubhead(text) { return el('div', 'rc-wizard-subhead', escapeHtml(text)); }
  function previewLine(label, value) {
    var row = el('div', 'display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--rc-offwhite);font-size:12.5px;');
    row.appendChild(el('span', 'color:var(--rc-steel);', escapeHtml(label)));
    row.appendChild(el('span', 'font-weight:600;text-align:right;', escapeHtml(String(value))));
    return row;
  }

  // Compact editable P1–P10 table for one race-length tier, plus its
  // season-wide duration -- see the design doc's Points table (Sprint
  // 40min/25-18-...-1, Medium 60min, Long 80min working values). Both the
  // duration box and the P1–P10 cells get an explicit max-width so the
  // wizard's global "shrink every text/number/select box" rule (see
  // .rc-wizard-content input/select in style.css) doesn't squash these --
  // they're already as small as they should get.
  function renderWizardPointsTable(state, tier, requiredEls) {
    var wrap = el('div', 'rc-panel');
    wrap.style.marginTop = '10px';
    var head = el('div', 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;');
    head.appendChild(el('h4', 'margin:0;font-size:13px;', tier + ' Tier'));
    var durationInput = wizNumberInput(state.pointsTables[tier].duration, function (v) { state.pointsTables[tier].duration = v; }, { min: 5 });
    durationInput.style.cssText = 'width:70px;max-width:70px;display:inline-block;margin:0;';
    requireField(durationInput, requiredEls);
    var durWrap = el('span', 'font-size:12px;color:var(--rc-steel);display:flex;align-items:center;gap:6px;');
    durWrap.appendChild(document.createTextNode('Duration (min)'));
    durWrap.appendChild(durationInput);
    head.appendChild(durWrap);
    wrap.appendChild(head);

    var table = document.createElement('table');
    table.style.cssText = 'width:100%;margin-top:8px;border-collapse:collapse;';
    var headRow = document.createElement('tr');
    for (var p = 1; p <= 10; p++) {
      var th = document.createElement('td');
      th.style.cssText = 'font-size:10px;color:var(--rc-steel);text-align:center;padding:2px;';
      th.textContent = 'P' + p;
      headRow.appendChild(th);
    }
    table.appendChild(headRow);
    var inputRow = document.createElement('tr');
    state.pointsTables[tier].points.forEach(function (val, idx) {
      var td = document.createElement('td');
      td.style.padding = '2px';
      var input = wizNumberInput(val, function (v) { state.pointsTables[tier].points[idx] = v; }, { min: 0 });
      input.style.cssText = 'width:100%;max-width:100%;text-align:center;padding:4px;margin:0;box-sizing:border-box;';
      requireField(input, requiredEls);
      td.appendChild(input);
      inputRow.appendChild(td);
    });
    table.appendChild(inputRow);
    wrap.appendChild(table);
    return wrap;
  }

  // Page 1 — mirrors Step 1 (Season Setup) of the design doc: Identity,
  // Access & server behavior, Format, Points, Schedule, Race Settings,
  // Economy.
  function renderWizardSeasonDetailsPage(state, container, requiredEls) {
    container.appendChild(wizSubhead('Identity'));
    // Grayed-out, non-editable "Race Club - Season # -" prefix, then the
    // actual editable box -- the admin only ever types the part after it,
    // capped at 24 characters (see the hint below and maxLength on the
    // input itself).
    // height:36px matches the wizard-scoped input height set globally in
    // style.css (.rc-wizard-content input { height: 36px; ... }) -- this
    // prefix used to be sized for the site-wide 44px input height from
    // before that wizard-specific shorter box height existed, so the two
    // no longer lined up (Matt's call: "needs to have the height reduced
    // to the same as the text box height so it matches up").
    var namePrefix = el('span',
      'display:inline-flex;align-items:center;box-sizing:border-box;padding:0 10px;height:36px;background:var(--rc-offwhite);border:1px solid var(--rc-silver);border-right:none;border-radius:4px 0 0 4px;color:var(--rc-steel);font-size:13px;font-weight:600;white-space:nowrap;flex:none;',
      'Race Club - Season # -');
    var nameInput = wizTextInput(state.seasonName, function (v) { state.seasonName = v; });
    nameInput.maxLength = 24;
    // 2/3 of the wizard's default 50% width (Matt's call) = 1/3 overall.
    nameInput.style.cssText = 'border-radius:0 4px 4px 0;margin:0;max-width:33%;flex:0 1 33%;';
    requireField(nameInput, requiredEls);
    var nameRow = el('div', 'display:flex;align-items:stretch;');
    nameRow.appendChild(namePrefix);
    nameRow.appendChild(nameInput);
    container.appendChild(wizField('Season Name', nameRow));

    container.appendChild(wizSubhead('Access & Server Behavior'));
    var pwInput = wizTextInput(state.defaultPassword, function (v) { state.defaultPassword = v; });
    pwInput.style.maxWidth = '50%';
    requireField(pwInput, requiredEls);
    container.appendChild(wizField('Default Password', pwInput));

    container.appendChild(fieldPairRow(
      'Private Qualifying', wizSelect(['Yes', 'No'], state.privateQualifying, function (v) { state.privateQualifying = v; }),
      'Track Limits Preset', wizSelect(['Strict', 'Relaxed', 'Default'], state.trackLimitsPreset, function (v) { state.trackLimitsPreset = v; })
    ));

    container.appendChild(wizSubhead('Format'));
    // Each class gets its own checkbox, plus a season checkbox right
    // behind it -- greyed out/disabled until that class is checked, then
    // active so the admin can pick which real-world car-data SEASON that
    // class draws its roster from (Data Management > Cars).
    //
    // v0.18 -- season selection is now per-class radio buttons, not one
    // shared Season Year field: each class independently offers a radio
    // per season that actually has active cars in Data Management > Cars
    // for that class, e.g. LMGT3 might offer 2025/2026 while LMP2 only
    // offers 2025. Radios (not checkboxes) enforce Matt's rule directly --
    // "you can't have a 2026 and 2025 season of GT3 in the same season"
    // -- while different classes stay fully independent of each other
    // ("2026 GT3 cars and 2025 LMP2 cars in the same race club season" is
    // fine). A class with zero cars in ANY season still shows as an
    // option (never hidden entirely), just greyed out/disabled with a
    // hint explaining why (Matt's original call, unchanged). WIZARD_CARS
    // is populated by loadWizardCarList() the moment the wizard was
    // opened -- see openSeasonWizardWithLoad().
    var classesWrap = el('div');
    // "Every box has to be filled out" (Matt's call) extends to this
    // group too: at least one class must be picked, AND every picked
    // class needs a season radio picked -- both conditions live in one
    // group check below, re-evaluated (and cleared) live as the admin
    // toggles either control, same instant-feedback behavior as a plain
    // required text field.
    var classesGroupEntry;
    function recheckClassesGroup() { if (classesGroupEntry && classesGroupEntry.isValid()) classesGroupEntry.clearInvalid(); }
    // Populated once the Economy section's retainer boxes exist further
    // down this same render pass -- referenced here by the class/season
    // handlers via closure, so it's safe that they're assigned AFTER this
    // forEach runs (the handlers only fire later, on click). A retainer
    // only applies if BOTH its class is checked AND a season is picked
    // for it (Matt's call); otherwise it's grayed out and locked.
    var retainerInputs = {};
    function updateRetainerLock(cls) {
      var input = retainerInputs[cls];
      if (!input) return;
      var applies = !!(state.classes[cls] && state.classSeasons[cls]);
      input.disabled = !applies;
      input.classList.toggle('rc-field-locked', !applies);
    }
    // Every distinct Season value WIZARD_CARS has for this class, NEWEST
    // first (Matt's call -- opposite of the Cars admin panel's season
    // groups, which stay oldest-first for that OCD-organization request).
    // Here, the season an admin is about to pick from is almost always
    // the current/most recent one, so it should be the first radio, not
    // the last.
    function availableSeasonsForClass(cls) {
      var seasons = {};
      (typeof WIZARD_CARS !== 'undefined' ? WIZARD_CARS : []).forEach(function (c) {
        if (c && c.carClass === cls && c.season) seasons[String(c.season)] = true;
      });
      return Object.keys(seasons).sort(function (a, b) { return (Number(b) || 0) - (Number(a) || 0); });
    }
    var classRows = {};
    CAR_CLASS_LIST.forEach(function (cls) {
      var seasons = availableSeasonsForClass(cls);
      var available = seasons.length > 0;
      // Keep state in sync with what's actually rendered -- a class that
      // defaults to checked (LMGT3) but turns out to have zero cars in
      // any season shouldn't silently stay "selected" in state while
      // showing unchecked on screen.
      if (!available && state.classes[cls]) { state.classes[cls] = false; state.classSeasons[cls] = ''; }
      var row = el('div', 'padding:6px 0;' + (available ? '' : 'opacity:0.55;'));
      var topRow = el('div', 'display:flex;align-items:center;gap:12px;');

      var classLabel = wizCheckboxRow(cls, state.classes[cls] && available, function (c) {
        state.classes[cls] = c;
        var refs = classRows[cls];
        seasons.forEach(function (season) {
          refs.radios[season].disabled = !c;
        });
        if (!c) {
          state.classSeasons[cls] = '';
          seasons.forEach(function (season) { refs.radios[season].checked = false; });
        }
        recheckClassesGroup();
        updateRetainerLock(cls);
      });
      var classCb = classLabel.querySelector('input');
      classCb.disabled = !available;
      // margin:0 keeps the class checkbox and the season radios sitting
      // on the exact same visual rhythm -- without it, the sitewide
      // `label { margin-top: 14px }` rule was still landing on this
      // label even though every OTHER property here overrides it.
      classLabel.style.cssText = 'display:flex;align-items:center;gap:8px;margin:0;font-size:14px;font-weight:400;text-transform:none;letter-spacing:normal;font-family:var(--rc-font-body);color:var(--rc-carbon);';
      topRow.appendChild(classLabel);
      var noCarsHint = el('span', 'font-size:12px;color:var(--rc-steel);font-style:italic;display:' + (available ? 'none' : ''), 'no cars entered for this class yet');
      topRow.appendChild(noCarsHint);
      row.appendChild(topRow);

      var radios = {};
      if (available) {

      return anySelected && Object.keys(state.classes).every(function (c) { return !state.classes[c] || !!state.classSeasons[c]; });
    }, requiredEls);

    var byeWeeksInput = wizNumberInput(state.byeWeeks, function (v) { state.byeWeeks = v; }, { min: 0, max: maxByeDropForRaces(state.numRaces) });

    requireField(dropWeeksInput, requiredEls);
    // Bye Weeks and Drop Weeks are both capped at (races - 1), 4 max

    numRacesInput.addEventListener('input', function () {

    ));
    // 0-2 special events this season (was a Yes/No toggle, then a

    var specialEventsInput = wizNumberInput(state.specialEventsCount, function (v) { state.specialEventsCount = v; }, { min: 0, max: 2 });
    specialEventsInput.style.maxWidth = '25%';
    requireField(specialEventsInput, requiredEls);
    container.appendChild(wizField('Special Events This Season (max 2)', specialEventsInput));

    container.appendChild(wizSubhead('Points'));
    // Row layout instead of stacked, and slightly larger checkboxes/text

    var bonusWrap = el('div', 'rc-checklist rc-bonus-checklist');

    bonusWrap.appendChild(wizCheckboxRow('Fastest Lap (+1)', state.bonusFastestLap, function (c) { state.bonusFastestLap = c; }));

    container.appendChild(wizSubhead('Schedule'));
    var startDate = el('input'); startDate.type = 'date'; startDate.value = state.seasonStartDate || '';
    startDate.addEventListener('input', function () { state.seasonStartDate = startDate.value; });
    requireField(startDate, requiredEls);
    var startTime = el('input'); startTime.type = 'time'; startTime.value = state.seasonStartTime || '';

    var tireWearInput = wizSelect(RACE_SETTINGS_MULTIPLIER_OPTIONS, state.raceSettings.tireWearMultiplier, function (v) { state.raceSettings.tireWearMultiplier = v; });
    container.appendChild(fieldPairRow('Fuel Consumption Multiplier', fuelInput, 'Tire Wear Multiplier', tireWearInput));
    var tireCountInput = wizNumberInput(state.raceSettings.tireCount, function (v) { state.raceSettings.tireCount = v; }, { min: 0 }); requireField(tireCountInput, requiredEls);
    var trackLimitInput = wizNumberInput(state.raceSettings.trackLimitPoints, function (v) { state.raceSettings.trackLimitPoints = v; }, { min: 0 }); requireField(trackLimitInput, requiredEls);
    container.appendChild(fieldPairRow('Tire Count Allowed', tireCountInput, 'Track Limit Points Before DT', trackLimitInput));
    var practiceLenInput = wizNumberInput(state.raceSettings.practiceLengthMin, function (v) { state.raceSettings.practiceLengthMin = v; }, { min: 0 }); requireField(practiceLenInput, requiredEls);
    var qualifyLenInput = wizNumberInput(state.raceSettings.qualifyLengthMin, function (v) { state.raceSettings.qualifyLengthMin = v; }, { min: 0 }); requireField(qualifyLenInput, requiredEls);
    container.appendChild(fieldPairRow('Practice Length (min)', practiceLenInput, 'Qualifying Length (min)', qualifyLenInput));

    // Economy — every pair below uses wizFieldPairRow so each box gets

    // (previously joined with a ";") floating below the whole row with

    container.appendChild(wizSubhead('Economy'));
    var balInput = wizNumberInput(state.economy.startingBalance, function (v) { state.economy.startingBalance = v; }, { min: 0, step: 100 });
    balInput.style.maxWidth = '25%';
    requireField(balInput, requiredEls);
    container.appendChild(wizField('Starting Bank Balance ($)', balInput,
      'For brand-new drivers only. Returning drivers carry their balance over from last season — if that\'s somehow below this value, they\'re automatically brought up to it at season start.'));
    var retLMGT3 = wizNumberInput(state.economy.retainerLMGT3, function (v) { state.economy.retainerLMGT3 = v; }, { min: 0, step: 50 }); requireField(retLMGT3, requiredEls);
    var retLMP2 = wizNumberInput(state.economy.retainerLMP2, function (v) { state.economy.retainerLMP2 = v; }, { min: 0, step: 50 }); requireField(retLMP2, requiredEls);
    container.appendChild(wizFieldPairRow(
      'LMGT3 Retainer ($/race)', retLMGT3,
      'Season default — a driver\'s actual cost is whatever their claimed seat costs, escrowed in full when they lock it in.',
      'LMP2 Retainer ($/race)', retLMP2,
      'Season default — a driver\'s actual cost is whatever their claimed seat costs, escrowed in full when they lock it in.'
    ));
    var retLMP3 = wizNumberInput(state.economy.retainerLMP3, function (v) { state.economy.retainerLMP3 = v; }, { min: 0, step: 50 }); requireField(retLMP3, requiredEls);
    var retHyper = wizNumberInput(state.economy.retainerHypercar, function (v) { state.economy.retainerHypercar = v; }, { min: 0, step: 50 }); requireField(retHyper, requiredEls);
    container.appendChild(wizFieldPairRow(
      'LMP3 Retainer ($/race)', retLMP3,
      'Season default — a driver\'s actual cost is whatever their claimed seat costs, escrowed in full when they lock it in.',
      'Hypercar Retainer ($/race)', retHyper,
      'Season default — a driver\'s actual cost is whatever their claimed seat costs, escrowed in full when they lock it in.'
    ));
    // Wire up the class/season checkbox handlers (built earlier in this
    // same render pass, above) now that the retainer boxes actually
    // exist, then set every retainer's initial locked/unlocked state to
    // match today's checkbox state (Matt's call: a retainer only applies
    // if BOTH its class AND that class's season box are checked).
    retainerInputs.LMGT3 = retLMGT3; retainerInputs.LMP2 = retLMP2; retainerInputs.LMP3 = retLMP3; retainerInputs.Hypercar = retHyper;
    CAR_CLASS_LIST.forEach(updateRetainerLock);
    var stakeCapInput = wizNumberInput(state.economy.wagerStakeCapPct, function (v) { state.economy.wagerStakeCapPct = v; }, { min: 0, max: 100 }); requireField(stakeCapInput, requiredEls);
    var houseCutInput = wizNumberInput(state.economy.wagerHouseCutPct, function (v) { state.economy.wagerHouseCutPct = v; }, { min: 0, max: 100 }); requireField(houseCutInput, requiredEls);
    container.appendChild(wizFieldPairRow(
      'Wager Stake Cap (% of available)', stakeCapInput,

      'Wager House Cut (%)', houseCutInput,
      'The league\'s cut on every settled wager.'
    ));
    var forfeitureInput = wizNumberInput(state.economy.wagerForfeiturePct, function (v) { state.economy.wagerForfeiturePct = v; }, { min: 0, max: 100 }); requireField(forfeitureInput, requiredEls);
    var vanityInput = wizNumberInput(state.economy.vanitySpendCutPct, function (v) { state.economy.vanitySpendCutPct = v; }, { min: 0, max: 100 }); requireField(vanityInput, requiredEls);
    container.appendChild(wizFieldPairRow(
      'Wager Forfeiture Fee (%)', forfeitureInput,

      'Vanity Spend Cut (%)', vanityInput,
