<!--
  Race Club — Account.html  (v0.5.0, sidebar-only rebuild)

  WHY THIS REBUILD: the v0.4.0 file had grown to ~5,200 lines of real
  section content (Dashboard widgets, Calendar, Objectives, League
  Management's Season Creation Wizard, Admin's approval queue + user
  management, Data Management's Tracks/Cars/Drivers editors, Settings'
  edit-profile form) built against features and schema that have since
  moved out from under it (see login.html/register.html/verify.html's
  email-based-login rebuild). Rather than patch a page full of stale
  assumptions one section at a time, Matt's call was to strip it back to
  just the shell -- the black sidebar, its full set of links, the
  section-switching behavior, the auth gate, and the one truly essential
  piece of business logic (the forced password-change lock screen) -- and
  rebuild each section's real content one link at a time going forward.

  WHAT'S KEPT, EXACTLY AS BEFORE:
  - The full sidebar nav: the same 10 primary items (Dashboard / Calendar
    / Finances / Results / Career / Reputation / Objectives / Sponsors /
    Hall of Fame / Settings) in the same order, plus the same
    permission-gated items (League Management, Admin, Data Management)
    and the same Help / Settings / Log Out row at the bottom, all with
    their original icons.
  - showSection() section-switching, the mobile hamburger menu + scroll
    lock, the 30-minute inactivity auto-logout, the auth gate, and the
    "arrived via a fresh login vs. need a getProfile call" fast path --
    all unchanged in behavior.
  - The mustChangePassword forced password-change lock screen. This is
    the one section this pass did NOT hollow out: it's a security gate
    that runs before the sidebar even shows, not a link a driver clicks
    into, so it stays fully functional using the same passwordChangeSection()
    form as before.

  WHAT'S GONE (for now): every section's actual content. Each of the 14
  content sections now renders a single centered "Coming soon" placeholder
  panel (see renderPlaceholderSections()) instead of real data, widgets,
  or admin tooling. That includes the profile-edit form -- normal profile
  editing goes through that link same as any other, so it's empty too for
  now; only the change-password FORM ITSELF survives, because the
  forced-password lock screen depends on it directly.

  PREVIOUS PASS (header/notification redesign): passwordChangeSection()'s
  result ("Password updated"/"New password and confirmation don't
  match"/etc.) now goes through js/header.js's showToast() instead of its
  own inline status line, per Matt's sitewide toast-notifications call.
  Also fixed: buildFullProfileUI was gating League Management/Admin/Data
  Management visibility on a `profile.permissions` array that
  buildProfilePayload (Auth.gs) never actually sends -- those links could
  never have shown for anyone. Until a real roles/permissions system is
  designed, this now just checks `profile.role === 'Admin'` for all three
  (Admin is the only role with anything to manage right now anyway). Also
  fixed: both the fresh-login fast path and the getProfile fallback were
  handing the whole API response wrapper ({success, profile}) to
  renderProfile() instead of its nested .profile, so every field this page
  reads off `profile` (including .role, just fixed above) was silently
  reading undefined.

  THIS PASS (Help + Edit Profile become popups, not sections): the
  'settings' and 'help' entries are gone from PLACEHOLDER_LABELS and their
  <section> elements are gone from the HTML -- both are now popups
  (showModal(), reintroduced this pass, backed by the .rc-modal* CSS
  classes that survived the v0.5.0 rebuild even though the JS function
  that used them didn't). The sidebar's Edit Profile and Help buttons now
  call openEditProfileModal()/openHelpModal() directly instead of falling
  through to showSection(id) -- both need live profile/token data that
  doesn't exist yet at buildSidebarNav() time (same problem the Admin nav
  item already had), so this pass adds module-level currentProfile/
  currentToken vars, set once in buildFullProfileUI(), for those handlers
  to read at click-time. The now-pointless ?section= deep-link handling is
  gone too -- Edit Profile is a popup now, not a URL a header link can
  point at.

  openEditProfileModal() lets a driver edit Username / First Name / Last
  Name / Suffix / Email / Location / Time Zone, posts to the
  `updateOwnProfile` action (Auth.gs's handleUpdateOwnProfile, expanded
  this pass to accept exactly these fields), refreshes the cached profile
  and header on success, and embeds the existing passwordChangeSection()
  form underneath so Change Password lives in the same popup. DisplayName
  is still never directly editable -- it's computed server-side from
  First/Last/Suffix, same rule as registration.

  LATER PASS -- Help becomes an in-page section again, not a popup, not a
  standalone page. It was briefly help.html (its own page, so the
  Rulebook would have room to grow), but that page dropped the sidebar/
  nav chrome entirely -- it read as leaving the site, not as part of the
  account (Matt's call to fold it back in). help.html is gone;
  openHelpModal() is also gone (that was the popup before it). The
  sidebar's Help button is back to a normal showSection('help') click,
  and renderHelpSection() builds the section content once, eagerly, at
  buildFullProfileUI() time: a "Website Help" .rc-panel (the same couple
  of contact/support lines the old popup had) followed by a "Rules and
  Regulations" .rc-panel that renders js/rulebook-content.js's
  RULEBOOK_SECTIONS -- index up top, every section's real content below
  it, unwritten sections marked "Not yet drafted" rather than hidden.
-->

<script>
(function () {
  // ---------------------------------------------------------------------
  // SETUP / AUTH GATE
  // ---------------------------------------------------------------------
  if (apiBaseUrlIsUnset()) {
    document.getElementById('rc-loading').style.display = 'none';
    var err = document.getElementById('rc-error');
    err.style.display = 'block';
    err.textContent = 'API_BASE_URL is not set. Edit js/api.js and paste in your Apps Script Web App URL.';
    return;
  }

  var token = redirectIfNoToken();
  if (!token) return; // already redirected to login.html

  startInactivityWatcher();

  // Called by the Logout nav item built in buildSidebarNav() below.
  // Clears the local token and redirects immediately, without waiting on
  // the server-side logout call to finish -- if it never completes, the
  // token just sits unused until its normal 7-day expiry, harmless.
  function doLogout() {
    fetchApi('logout', { method: 'POST', token: token }).catch(function () {});
    clearToken();
    window.location.href = 'login.html';
  }

  // Mobile menu open/close. While open, the page itself can't scroll (see
  // .rc-scroll-locked in style.css). Remembers scroll position so it can
  // be restored on close.
  var scrollYBeforeLock = 0;
  function openMobileMenu() {
    document.getElementById('rc-sidebar').classList.add('rc-sidebar-open');
    scrollYBeforeLock = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = '-' + scrollYBeforeLock + 'px';
    document.body.classList.add('rc-scroll-locked');
  }
  function closeMobileMenu() {
    document.getElementById('rc-sidebar').classList.remove('rc-sidebar-open');
    document.body.classList.remove('rc-scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, scrollYBeforeLock);
  }
  document.getElementById('rc-hamburger').addEventListener('click', function (evt) {
    evt.stopPropagation();
    var sidebar = document.getElementById('rc-sidebar');
    if (sidebar.classList.contains('rc-sidebar-open')) closeMobileMenu();
    else openMobileMenu();
  });
  document.addEventListener('click', function (evt) {
    var sidebar = document.getElementById('rc-sidebar');
    if (!sidebar.classList.contains('rc-sidebar-open')) return;
    if (sidebar.contains(evt.target)) return; // click was on a nav link/inside the menu -- let it do its own thing
    closeMobileMenu();
  });

  // NOTE: the actual profile-loading code is at the very bottom of this
  // script, not here -- renderProfile()/buildFullProfileUI() below touch
  // `var`s (NAV_ITEMS, the ICON_* constants) whose VALUE ASSIGNMENTS
  // aren't hoisted, so calling them this early (before those assignments
  // have run, on the synchronous fresh-login path) would throw partway
  // through. Moving the load/render call to the bottom fixes that
  // unconditionally.

  // `style` accepts EITHER an inline CSS string ("margin:0;color:red;")
  // OR a plain class name ("rc-hint") -- disambiguated by whether it
  // contains a colon.
  function el(tag, style, html) {
    var e = document.createElement(tag);
    if (style) {
      if (style.indexOf(':') !== -1) e.style.cssText = style;
      else e.className = style;
    }
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------------------------------------------------------------------
  // THEMED TOOLTIP (rebuilt 2026-08-30, Matt's call: "stop all tooltips
  // from being cut off when hovering over something in a popup") -- see
  // .rc-tooltip-bubble in style.css for the full story on why. Any
  // element with class "rc-tooltip" plus a data-tooltip="..." attribute
  // gets this bubble on hover/focus; nothing else needs to change at any
  // existing call site, since this reads the same attribute the old
  // pure-CSS version did. One bubble is created lazily and reused for
  // every tooltip on the page rather than one per trigger -- delegated
  // document-level listeners mean a tooltip added to the DOM later (a
  // freshly rendered popup row, say) works automatically with no wiring.
  //
  // position:fixed + JS-measured coordinates is the actual fix: fixed
  // positioning is computed against the viewport, not any scrolling
  // ancestor, so a modal's own overflow:auto can never clip this bubble
  // the way it clipped the old ::after-based one. showTooltipBubble()
  // also flips the bubble below its target (instead of above) and clamps
  // it horizontally when it would otherwise run off the top or a side of
  // the screen, so this also covers a tooltip near the edge of the
  // browser window itself, not just inside a popup.
  // ---------------------------------------------------------------------
  var rcTooltipBubbleEl = null;
  var rcTooltipArrowEl = null;
  var rcTooltipTextEl = null;
  var rcTooltipCurrentTarget = null;

  function rcEnsureTooltipBubble() {
    if (rcTooltipBubbleEl) return;
    rcTooltipBubbleEl = el('div', 'rc-tooltip-bubble');
    rcTooltipTextEl = el('div');
    rcTooltipArrowEl = el('div', 'rc-tooltip-bubble-arrow');
    rcTooltipBubbleEl.appendChild(rcTooltipTextEl);
    rcTooltipBubbleEl.appendChild(rcTooltipArrowEl);
    document.body.appendChild(rcTooltipBubbleEl);
  }

  function rcShowTooltipBubble(target) {
    var text = target.getAttribute('data-tooltip');
    if (!text) return;
    rcEnsureTooltipBubble();
    rcTooltipCurrentTarget = target;
    rcTooltipTextEl.textContent = text; // textContent, not innerHTML --
    // this is arbitrary catalog/sponsor text, not markup, so this also
    // keeps it XSS-safe by construction regardless of what's in it.
    rcTooltipBubbleEl.classList.add('rc-tooltip-bubble-visible');
    rcPositionTooltipBubble(target);
  }

  function rcHideTooltipBubble() {
    if (!rcTooltipBubbleEl) return;
    rcTooltipBubbleEl.classList.remove('rc-tooltip-bubble-visible');
    rcTooltipCurrentTarget = null;
  }

  function rcPositionTooltipBubble(target) {
    var rect = target.getBoundingClientRect();
    var gap = 9;
    var margin = 8;
    var bubbleRect = rcTooltipBubbleEl.getBoundingClientRect();
    var above = true;
    var top = rect.top - bubbleRect.height - gap;
    if (top < margin) { above = false; top = rect.bottom + gap; }
    var left = rect.left + rect.width / 2 - bubbleRect.width / 2;
    var maxLeft = window.innerWidth - bubbleRect.width - margin;
    left = Math.max(margin, Math.min(maxLeft, left));
    rcTooltipBubbleEl.style.top = top + 'px';
    rcTooltipBubbleEl.style.left = left + 'px';
    rcTooltipBubbleEl.classList.toggle('rc-tooltip-bubble-above', above);
    rcTooltipBubbleEl.classList.toggle('rc-tooltip-bubble-below', !above);
    // The arrow points at the target's own horizontal center regardless
    // of how far the bubble itself got clamped sideways to stay
    // on-screen -- clamped to the bubble's own width so it never pokes
    // out past the bubble's rounded corners.
    var arrowLeft = rect.left + rect.width / 2 - left;
    arrowLeft = Math.max(10, Math.min(bubbleRect.width - 10, arrowLeft));
    rcTooltipArrowEl.style.left = arrowLeft + 'px';
  }

  (function rcInitTooltips() {
    function findTooltipTarget(node) {
      return (node && node.closest) ? node.closest('.rc-tooltip[data-tooltip]') : null;
    }
    document.addEventListener('mouseover', function (e) {
      var t = findTooltipTarget(e.target);
      if (t) rcShowTooltipBubble(t);
    });
    document.addEventListener('mouseout', function (e) {
      var t = findTooltipTarget(e.target);
      // relatedTarget is where the pointer is headed -- skip hiding when
      // it's just moving to a child of the same tooltip trigger, same as
      // the old CSS :hover would have kept it open in that case.
      if (t && (!e.relatedTarget || !t.contains(e.relatedTarget))) rcHideTooltipBubble();
    });
    document.addEventListener('focusin', function (e) {
      var t = findTooltipTarget(e.target);
      if (t) rcShowTooltipBubble(t);
    });
    document.addEventListener('focusout', function (e) {
      var t = findTooltipTarget(e.target);
      if (t) rcHideTooltipBubble();
    });
    // A visible tooltip is positioned against its target's coordinates at
    // the moment it opened -- if the page scrolls or resizes underneath
    // it without a matching mouseout (scrolling a popup's list with the
    // mouse held still over a row, say), those coordinates go stale.
    // capture:true is required for scroll specifically -- it doesn't
    // bubble, so a listener on document only ever sees it this way.
    document.addEventListener('scroll', function () {
      if (rcTooltipCurrentTarget) rcPositionTooltipBubble(rcTooltipCurrentTarget);
    }, true);
    window.addEventListener('resize', function () {
      if (rcTooltipCurrentTarget) rcPositionTooltipBubble(rcTooltipCurrentTarget);
    });
  })();

  // Flat, stroke-based icons (no emoji) -- one per sidebar item, unchanged
  // from v0.4.0.

  var ICON_RESULTS = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="11"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="19" y1="20" x2="19" y2="14"></line></svg>';

  var ICON_LOCK = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>';
  var ICON_ADMIN = ICON_LOCK.replace('width="18" height="18"', 'width="16" height="16"');
  var ICON_DATAMGMT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"></path><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path></svg>';

  var ICON_HELP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.2 9a2.8 2.8 0 0 1 5.4 1c0 1.8-2.6 2-2.6 3.6"></path><line x1="12" y1="17" x2="12" y2="17.2"></line></svg>';

  // Restored from the pre-v0.5 archive (commit ab231e0) for the Calendar
  // page -- weather/session/setup chip icons, none of which the current

  var PLACEHOLDER_LABELS = {
    finances: 'Finances',

    objectives: 'Objectives', halloffame: 'Hall of Fame',
    protests: 'Protests'
  };

  // Set once, in buildFullProfileUI() -- lets the Edit Profile/Help nav
  // button handlers (built earlier, in buildSidebarNav(), before profile/
  // token exist yet) reach live data at click-time. Same pattern the
  // Admin nav item's visibility check already needed.
  var currentProfile = null;
  var currentToken = null;

  // ---------------------------------------------------------------------
  // SIDEBAR NAV + SECTION SWITCHING
  // ---------------------------------------------------------------------
  function makeNavButton(id, label, icon, elId, hiddenByDefault, onClick) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rc-nav-item';
    btn.dataset.section = id;
    if (elId) btn.id = elId;
    if (hiddenByDefault) btn.style.display = 'none';
    btn.innerHTML = icon + '<span>' + escapeHtml(label) + '</span>';
    btn.addEventListener('click', onClick || function () { showSection(id); });
    return btn;
  }

  function navDivider(elId) {
    var hr = document.createElement('hr');
    hr.className = 'rc-nav-divider';
    if (elId) hr.id = elId;
    return hr;
  }

  function showUpperNavDivider() {
    document.getElementById('rc-nav-divider-upper').style.display = '';
  }

  // Order: the 10 general section links, a divider, Admin/Data
  // Management/League Management (only if this user's permissions unlock
  // them), a second divider, then Help, Settings, Log Out -- identical
  // order to v0.4.0.
  function buildSidebarNav() {
    var nav = document.getElementById('rc-sidebar-nav');
    nav.innerHTML = '';
    NAV_ITEMS.slice(0, -1).forEach(function (item) { // everything except Settings
      // Calendar fetches fresh every time the link is clicked (same
      // lazy-fetch-on-click pattern as Data/League Management) rather than
      // being prefetched at login like the Dashboard cards -- it's not
      // shown until the driver actually opens it.
      if (item.id === 'calendar') {
        nav.appendChild(makeNavButton(item.id, item.label, item.icon, 'rc-nav-' + item.id, false, function () {
          showSection('calendar');
          renderCalendarSection(currentToken);
        }));
        return;
      }
      // Sponsors is real content now (renderSponsorsSection), same
      // lazy-fetch-on-click pattern as Calendar -- it's not shown until
      // the driver actually opens it.
      if (item.id === 'sponsors') {
        nav.appendChild(makeNavButton(item.id, item.label, item.icon, 'rc-nav-' + item.id, false, function () {
          showSection('sponsors');
          renderSponsorsSection(currentToken);
        }));
        return;
      }
      nav.appendChild(makeNavButton(item.id, item.label, item.icon, 'rc-nav-' + item.id));
    });
    var upperDivider = navDivider('rc-nav-divider-upper');
    upperDivider.style.display = 'none';
    nav.appendChild(upperDivider);
    // Admin (2026-08-30: no longer just a placeholder) now hosts what
    // Data Management used to show -- Members/Tracks/Cars/Sponsors, each
    // opening its own popup from here (openMembersModal etc.) rather than
    // rendering inline -- see renderAdminSection. The standalone Data
    // Management button is gone; Admin-only accounts reach the exact same
    // tools from here instead (Matt's call: "DATA MANAGEMENT page can be
    // moved to ADMIN...admins can only access this ADMIN section").
    var adminBtn = makeNavButton('admin', 'Admin', ICON_ADMIN, 'rc-nav-admin', true, function () {
      showSection('admin');
      renderAdminSection(currentToken);
    });
    nav.appendChild(adminBtn);
    // Protests (added 2026-08-30) -- Steward and above (Matt's call:
    // "PROTESTS button above LEAGUE MANAGEMENT that stewards and above
    // can access"). Still a placeholder (see PLACEHOLDER_LABELS) -- the
    // Protests sheet/schema already exists (Core.gs) but no admin tooling
    // has been built against it yet, same "button exists, content lands
    // later" treatment Admin itself used to get.
    var protestsBtn = makeNavButton('protests', 'Protests', ICON_PROTESTS, 'rc-nav-protests', true);
    nav.appendChild(protestsBtn);
    // League Management is real content now (renderLeagueManagementSection),
    // same lazy-fetch-on-click pattern as Admin.
    var leagueBtn = makeNavButton('league', 'League Management', ICON_LEAGUE, 'rc-nav-league', true, function () {
      showSection('league');
      renderLeagueManagementSection(currentToken);
    });
    nav.appendChild(leagueBtn);
    nav.appendChild(navDivider());
    // Edit Profile is a popup, not a section -- its click handler opens a
    // modal instead of falling through to showSection(id); it reads
    // currentProfile/currentToken, set once buildFullProfileUI() actually
    // has that data (see the vars declared above). Help is an ordinary
    // in-page section again (see renderHelpSection()) -- it briefly lived
    // on its own page (help.html) so the Rulebook would have room to
    // grow, but that meant losing the sidebar/nav chrome, which read as
    // leaving the site rather than part of the account (Matt's call to
    // fold it back in).
    nav.appendChild(makeNavButton('help', 'Help', ICON_HELP, 'rc-nav-help', false, function () { showSection('help'); }));
    var settingsItem = NAV_ITEMS[NAV_ITEMS.length - 1];
    nav.appendChild(makeNavButton(settingsItem.id, settingsItem.label, settingsItem.icon, null, false, function () { openEditProfileModal(currentProfile, currentToken); }));
    nav.appendChild(makeNavButton('logout', 'Log Out', ICON_LOGOUT, 'rc-nav-logout', false, doLogout));
  }

  // Shows exactly one .rc-content-section and marks the matching sidebar
  // item active.
  function showSection(id) {
    document.querySelectorAll('.rc-content-section').forEach(function (s) { s.style.display = 'none'; });
    var target = document.getElementById('rc-section-' + id);
    if (target) target.style.display = 'block';
    document.querySelectorAll('.rc-nav-item').forEach(function (btn) {
      btn.classList.toggle('rc-nav-active', btn.dataset.section === id);
    });
    closeMobileMenu();
  }

  // ---------------------------------------------------------------------
  // PLACEHOLDER PANELS -- every section, no fake data, just a centered
  // heading + message. Replace one at a time with real content as each
  // link gets built out.
  // ---------------------------------------------------------------------
  function renderPlaceholderSections() {
    Object.keys(PLACEHOLDER_LABELS).forEach(function (id) {
      var section = document.getElementById('rc-section-' + id);
      if (!section) return;
      section.innerHTML = '';
      var wrap = el('div', 'rc-placeholder-panel');
      wrap.appendChild(el('h2', null, PLACEHOLDER_LABELS[id]));
      wrap.appendChild(el('p', 'color:var(--rc-steel);', 'Coming soon.'));
      section.appendChild(wrap);
    });
  }

  // ---------------------------------------------------------------------
  // DASHBOARD (2026-08-29) -- starting fresh. The old widget-heavy
  // dashboard from before the ECO rebuild is gone; nothing from it is
  // being restored. This is the first card back -- Registration Status,
  // in its own top row by itself (Matt's call: build/verify cards one at
  // a time, more join this row later).
  // ---------------------------------------------------------------------
  function renderDashboardSection(profile, token, dashboardData) {
    var section = document.getElementById('rc-section-dashboard');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(el('h2', null, 'Dashboard'));

    // Next Race -- full-width banner card below the two half-width cards
    // (its own .rc-quick-row so it picks up the same row spacing, just
    // with one card filling it). Gated behind registration (Matt's call)
    // -- built here, before topRow, purely so Registration Status's
    // onRegistered callback below can also swap it from the "not
    // registered" notice to the real schedule the moment a driver joins,
    // same trick already used for refreshing Current Seat.
    var nextRaceRow = el('div', 'rc-quick-row');
    nextRaceRow.appendChild(nextRaceCard(dashboardData.nextRace, dashboardData.activeSeason));
    nextRaceRow.appendChild(financesCard(dashboardData.financesReputation));

    // Reputation + Recent Results -- third row (2026-08-31, Matt's call).
    // Reputation split out of the old combined "Finances & Reputation"
    // card; Recent Results is a brand-new placeholder card sitting next
    // to it, no data wired up yet. Both are static (no live data), so
    // neither needs rebuilding on the refresh callback below the way Next
    // Race/Finances do.
    var reputationRow = el('div', 'rc-quick-row');
    reputationRow.appendChild(reputationCard());
    reputationRow.appendChild(recentResultsCard());

    var topRow = el('div', 'rc-quick-row');
    // Current Seat is built first, purely so Registration Status can wire
    // its own onRegistered callback to also refresh Current Seat -- both
    // still append to topRow in the same visual order as before.
    var seatCard = currentSeatCard(profile, token, dashboardData.currentSeat);
    var regCard = registrationStatusCard(profile, token, dashboardData.activeSeason, function () {
      if (seatCard.rcRefresh) seatCard.rcRefresh();
      // Next Race + Finances have no rcRefresh of their own (plain
      // renders, not stateful cards) -- re-fetch everything they're
      // gated/built on and just rebuild the whole row in place.
      Promise.all([
        fetchApi('getActiveSeason', { token: token }).catch(function () { return { success: false }; }),
        fetchApi('getNextRace', { token: token }).catch(function () { return { success: false }; }),
        fetchApi('getMyFinancesReputation', { token: token }).catch(function () { return { success: false }; })
      ]).then(function (results) {
        nextRaceRow.innerHTML = '';
        nextRaceRow.appendChild(nextRaceCard(results[1], results[0]));
        nextRaceRow.appendChild(financesCard(results[2]));
      });
    });
    topRow.appendChild(regCard);
    topRow.appendChild(seatCard);
    section.appendChild(topRow);
    section.appendChild(nextRaceRow);
    section.appendChild(reputationRow);
  }

  // Full-page reload after ANY popup save (added 2026-08-30, Matt's call:
  // "Whenever I'm in a popup and saves some kind of information, it
  // should reload the entire page after it saves and return to the
  // dashboard so that notifications popup and items on the screen
  // refresh"). Deliberately a real navigation, not showSection('dashboard')
  // + a local re-render -- a hard reload is the one thing guaranteed to
  // pick up EVERYTHING a save could have touched at once (this driver's
  // own profile/avatar, the header's notification bell, another section's
  // now-stale list) without maintaining a bespoke refresh path per save.
  // Account.html has no section-restore-from-URL logic, so a plain
  // navigation here already lands back on Dashboard by default -- same
  // as any fresh visit to this page.
  function rcReloadAfterSave() {
    window.location.href = 'Account.html';
  }

  function formatMoney(n) {
    n = Number(n) || 0;
    return '$' + n.toLocaleString();
  }

  // "1st"/"2nd"/"3rd"/"4th"... -- only ever fed a positive integer
  // (season standings position), so no negative/zero handling needed.
  function ordinal(n) {
    n = Number(n) || 0;
    var rem100 = n % 100;
    if (rem100 >= 11 && rem100 <= 13) return n + 'th';
    switch (n % 10) {
      case 1: return n + 'st';
      case 2: return n + 'nd';
      case 3: return n + 'rd';
      default: return n + 'th';
    }
  }

  // Three states, rendered directly from data the page already prefetched
  // in parallel with the profile itself (see the bottom of this script) --
  // this card NEVER fetches or spinners on its own, first paint or
  // otherwise (Matt's call: "no loaders in any of the cards, ever").
  //   1. No season currently open to registration -- gray X, "Unregistered."
  //   2. A season IS open and this driver hasn't joined it yet -- yellow
  //      +, clickable, opens the team-pick modal.
  //   3. This driver already has a Registrations row for the open season
  //      -- green check, "Registered," with Registered On / Class / Team.
  // Prospects (pending account approval) skip this card entirely, same
  // convention the pre-rebuild Register button used -- there's nothing
  // for them to register for yet.
  //
  // After a driver actually registers (buildRegistrationModal's onDone),
  // the card DOES need to reflect the new state -- refreshStatus() below
  // re-fetches quietly and swaps the content in once it lands, but never
  // shows a spinner in between; the old content just stays put for that
  // brief moment instead of being replaced by a loading state.
  function registrationStatusCard(profile, token, initialData, onRegistered) {
    var card = el('div', 'rc-panel rc-regstatus-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Registration Status'));
    var body = el('div', 'rc-regstatus-body');
    card.appendChild(body);

    if (profile.role === 'Prospect') {
      body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'Registration opens once your account is approved.'));
      return card;
    }

    function renderUnregistered() {
      body.innerHTML = '';
      var row = el('div', 'rc-regstatus-row');
      row.appendChild(el('div', 'rc-regstatus-icon rc-regstatus-icon-none', '&#10005;'));
      var text = el('div');
      text.appendChild(el('div', 'rc-regstatus-headline rc-regstatus-headline-none', 'UNREGISTERED'));
      text.appendChild(el('div', 'rc-regstatus-sub', 'No season is currently open for registration.'));
      row.appendChild(text);
      body.appendChild(row);
    }

    function renderOpenToRegister(data) {
      body.innerHTML = '';
      var row = el('div', 'rc-regstatus-row rc-regstatus-row-clickable');
      row.appendChild(el('div', 'rc-regstatus-icon rc-regstatus-icon-open', '+'));
      var text = el('div');
      text.appendChild(el('div', 'rc-regstatus-headline rc-regstatus-headline-open', 'REGISTER FOR ' + escapeHtml((data.seasonName || 'NEW SEASON').toUpperCase())));
      text.appendChild(el('div', 'rc-regstatus-sub', 'Click to choose your car and lock in your seat.'));
      row.appendChild(text);
      body.appendChild(row);
      row.addEventListener('click', function () {
        buildRegistrationModal(profile, token, data, function () {
          refreshStatus();
          if (onRegistered) onRegistered();
        });
      });
    }

    function renderRegistered(data) {
      body.innerHTML = '';
      var row = el('div', 'rc-regstatus-row');
      row.appendChild(el('div', 'rc-regstatus-icon rc-regstatus-icon-done', '&#10003;'));
      var text = el('div');
      text.appendChild(el('div', 'rc-regstatus-headline rc-regstatus-headline-done', 'REGISTERED FOR ' + escapeHtml((data.seasonName || 'SEASON').toUpperCase())));
      text.appendChild(el('div', 'rc-regstatus-sub', 'Your registration is complete.'));
      row.appendChild(text);
      body.appendChild(row);

      var reg = data.registration || {};
      var footer = el('div', 'rc-regstatus-footer');
      var joinedDate = reg.joinedAt ? formatDateLabel(String(reg.joinedAt).slice(0, 10)) : '—';
      [
        ['Registered On', joinedDate],
        ['Class', reg.carClass || '—']
      ].forEach(function (pair) {
        var stat = el('div', 'rc-regstatus-stat');
        stat.appendChild(el('div', 'rc-regstatus-stat-label', pair[0]));
        stat.appendChild(el('div', 'rc-regstatus-stat-value', escapeHtml(pair[1])));
        footer.appendChild(stat);
      });
      body.appendChild(footer);
    }

    function renderFromData(data) {
      if (!data || !data.success || !data.hasActiveSeason) { renderUnregistered(); return; }
      if (data.registered) { renderRegistered(data); return; }
      renderOpenToRegister(data);
    }

    // Quiet re-check after a registration completes -- no spinner, the
    // card's current content stays exactly as-is until the new data
    // actually arrives, then swaps in one shot.
    function refreshStatus() {
      fetchApi('getActiveSeason', { token: token }).then(renderFromData).catch(function () { renderUnregistered(); });
    }

    renderFromData(initialData);
    return card;
  }

  // Manufacturer logo left, team/car identity + class pill next to it,
  // Position/Points/Podiums stat row underneath. Sourced from data the
  // page already prefetched in parallel with the profile (see the bottom
  // of this script) -- like Registration Status, this card never fetches
  // or spinners on its own (Matt's call: "no loaders in any of the cards,
  // ever"). handleGetMyCurrentSeat (DataCache.gs) prefers the richest
  // source available: the most recent SeasonHistory.CurrentSeat JSON
  // blob (real season stats, written after each round's results are
  // ingested) and falls back to the live Registrations/Teams/Cars rows
  // -- with blank stats -- for a driver who just locked in a seat before
  // any round has run yet. No car photo -- unlike the reference mockup,
  // there's no car-render asset in this project, logo + text only.
  function currentSeatCard(profile, token, initialData) {
    var card = el('div', 'rc-panel rc-currentseat-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Current Seat'));
    var body = el('div', 'rc-cs-body');
    card.appendChild(body);

    if (profile.role === 'Prospect') {
      body.appendChild(el('p', 'rc-cs-empty', 'Available once your account is approved.'));
      return card;
    }

    function renderEmpty(message) {
      body.innerHTML = '';
      body.appendChild(el('p', 'rc-cs-empty', message));
    }

    function renderSeat(data) {
      body.innerHTML = '';
      var row = el('div', 'rc-cs-row');

      if (data.manufacturer && typeof manufacturerLogoSrc === 'function') {
        var logo = document.createElement('img');
        logo.className = 'rc-cs-logo';
        logo.src = manufacturerLogoSrc(data.manufacturer);
        logo.alt = data.manufacturer;
        logo.onerror = function () { logo.style.display = 'none'; };
        row.appendChild(logo);
      }

      var textCol = el('div');
      textCol.appendChild(el('div', 'rc-cs-team-name', escapeHtml(data.team || 'Unnamed Team')));
      var carLine = ['#' + (data.carNumber || '?'), data.manufacturer, data.carModel].filter(Boolean).join(' ');
      textCol.appendChild(el('div', 'rc-cs-car-line', escapeHtml(carLine)));
      if (data.carClass) {
        var colorVar = (typeof CAR_CLASS_BADGE_COLOR_VAR !== 'undefined' && CAR_CLASS_BADGE_COLOR_VAR[data.carClass]) ? CAR_CLASS_BADGE_COLOR_VAR[data.carClass] : '--rc-steel';
        var pill = el('span', 'rc-cs-class-pill', escapeHtml(data.carClass));
        pill.style.background = 'var(' + colorVar + ')';
        textCol.appendChild(pill);
      }
      if (data.carTier) {
        var tierPill = _rcCarTierBadge(data.carTier);
        tierPill.style.marginLeft = '6px';
        textCol.appendChild(tierPill);
      }
      row.appendChild(textCol);
      body.appendChild(row);

      var stats = el('div', 'rc-cs-stats');
      var posValue = (data.statsKnown && data.position) ? (ordinal(data.position) + (data.positionOutOf ? ' / ' + data.positionOutOf : '')) : '—';
      var pointsValue = data.statsKnown ? String(data.points || 0) : '—';
      var podiumsValue = data.statsKnown ? String(data.podiums || 0) : '—';
      [['Position', posValue], ['Points', pointsValue], ['Podiums', podiumsValue]].forEach(function (pair) {
        var stat = el('div', 'rc-cs-stat');
        stat.appendChild(el('div', 'rc-cs-stat-label', pair[0]));
        stat.appendChild(el('div', 'rc-cs-stat-value', escapeHtml(pair[1])));
        stats.appendChild(stat);
      });
      body.appendChild(stats);
    }

    // Quiet re-check after a registration completes (wired from
    // renderDashboardSection into Registration Status's onRegistered
    // callback) -- no spinner, current content stays put until the new
    // data actually arrives, then swaps in one shot. Stashed directly on
    // the card element since this function's only return value is the
    // element itself.
    card.rcRefresh = function () {
      fetchApi('getMyCurrentSeat', { token: token }).then(function (data) {
        if (!data || !data.success || !data.hasSeat) { renderEmpty('Not on a team yet -- register for a season to lock in a seat.'); return; }
        renderSeat(data);
      }).catch(function () { /* leave whatever was already shown */ });
    };

    if (!initialData || !initialData.success || !initialData.hasSeat) {
      renderEmpty('Not on a team yet -- register for a season to lock in a seat.');
    } else {
      renderSeat(initialData);
    }

    return card;
  }

  // Full-width "quick glance" banner, backed by action=getNextRace
  // (handleGetNextRace, DataCache.gs) -- reuses the exact same merged
  // round/special/bye entries the Calendar page computes, so this can
  // never show a different "next race" than Calendar would (Matt's call).
  // Like every other Dashboard card, this never fetches or spinners on
  // its own, first paint or otherwise -- rendered straight from data the
  // page already prefetched in parallel with the profile. Reuses the same
  // JSON shape/fields the Calendar's raceCard() already works with
  // (eventName/track/layout/startUtc/trackId/roundNum) rather than
  // inventing a second one, and the same trackImageSrc() convention for
  // the track image (assets/tracks/{TrackID}.png, silently hidden if
  // missing) -- no live location/country data exists on Tracks yet, so
  // (unlike the WEC reference mockup) there's no flag/location line here.
  //
  // Matt's call (2026-08-30): this card stays gated behind registration,
  // same as Current Seat -- a driver who hasn't joined the open season
  // gets the same "Not on a team yet" nudge rather than seeing the
  // schedule for a season they're not part of. Gated client-side off
  // activeSeasonData (the same getActiveSeason payload Registration
  // Status already renders from) rather than a second server-side check,
  // since getNextRace's schedule data isn't otherwise driver-specific.
  function nextRaceCard(data, activeSeasonData) {
    var card = el('div', 'rc-panel rc-nextrace-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Next Race'));

    var registered = !!(activeSeasonData && activeSeasonData.success && activeSeasonData.hasActiveSeason && activeSeasonData.registered);
    if (!registered) {
      card.appendChild(el('p', 'rc-cs-empty', 'Not on a team yet -- register for a season to view the next race.'));
      return card;
    }

    if (!data || !data.success) {
      card.appendChild(el('p', 'rc-cs-empty', 'Could not load the next race right now.'));
      return card;
    }
    if (!data.hasNextRace) {
      card.appendChild(el('p', 'rc-cs-empty', 'No season currently open, or the schedule has already finished.'));
      return card;
    }

    var driverTz = '';
    try { driverTz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (err) { driverTz = ''; }

    var isSpecial = data.kind === 'special';
    var body = el('div', 'rc-nextrace-body');

    // Left-justified info column (Event title, then Track/Layout, then the
    // rest), track image to the right, vertically centered against the
    // whole text block (2026-08-30, Matt's call) -- .rc-nextrace-body
    // centers this row's cross-axis so the image lines up regardless of
    // how tall the text column ends up.
    var info = el('div', 'rc-nextrace-info');
    var nameWrap = el('div', 'rc-nextrace-name');
    nameWrap.appendChild(document.createTextNode(data.eventName || (isSpecial ? 'Special Event' : ('Round ' + data.roundNum))));
    if (isSpecial) nameWrap.appendChild(withTooltip(el('span', 'rc-cal-race-star', ICON_NAV_STAR), 'Special Event -- money only, no championship points.'));
    info.appendChild(nameWrap);

    info.appendChild(el('div', 'rc-nextrace-track',
      escapeHtml(data.track || '(no track)') + (data.layout ? ' &middot; ' + escapeHtml(data.layout) : '')));

    var stats = el('div', 'rc-cal-stats');
    stats.appendChild(calStat(ICON_CLOCK, formatRaceDateTime(data.startUtc, driverTz), 'Start time, converted to your local timezone'));
    if (data.raceLengthTier) stats.appendChild(calStat(ICON_CLOCK, data.raceLengthTier, 'Race length tier'));
    info.appendChild(stats);

    if (isSpecial) {
      info.appendChild(el('span', 'rc-nextrace-pill rc-nextrace-pill-gold', 'SPECIAL EVENT'));
    } else if (data.roundNum && data.totalRounds) {
      info.appendChild(el('span', 'rc-nextrace-pill', 'ROUND ' + data.roundNum + ' OF ' + data.totalRounds));
    }
    body.appendChild(info);

    // Silently omitted if the track has no image on disk -- same onerror
    // pattern used everywhere else on the site (Matt: "if one doesn't
    // exist let it silently not show anything").
    if (data.trackId) {
      var trackImg = document.createElement('img');
      trackImg.className = 'rc-nextrace-track-img';
      trackImg.src = trackImageSrc(data.trackId);
      trackImg.alt = data.track || '';
      trackImg.onerror = function () { trackImg.style.display = 'none'; };
      body.appendChild(trackImg);
    }

    card.appendChild(body);

    // Link to the full Calendar page (2026-08-30, Matt's call) -- same
    // "show the section, then fetch it" pair the Calendar nav button
    // itself uses (see buildSidebarNav above), just reachable from this
    // card too instead of only the sidebar.
    var viewSeasonBtn = el('button', 'rc-link-btn', '← View full season');
    viewSeasonBtn.type = 'button';
    viewSeasonBtn.style.cssText = 'display:block;margin-top:14px;';
    viewSeasonBtn.addEventListener('click', function () {
      showSection('calendar');
      renderCalendarSection(currentToken);
    });
    card.appendChild(viewSeasonBtn);

    return card;
  }

  // Finances -- shares the Next Race row. Real numbers as soon as a Driver
  // account exists (see handleGetMyFinancesReputation, DataCache.gs) --
  // the starting balance lands the moment a Prospect is approved into a
  // Driver, well before they've joined a team, specifically so a driver
  // can see what they have to spend while deciding on a seat (2026-08-31,
  // Matt's call). Not gated on a round having been ingested either.
  // Balance is the headline, the delta sits on its own line right under it
  // (up = muted green, down = house red), then a bottom category row --
  // Frozen Balance / Bank Rank / Largest Win -- same "categories at the
  // bottom" shape as Current Seat's Position/Points/Podiums stats
  // (2026-08-31, Matt's call). Split out from what used to be one combined
  // "Finances & Reputation" card -- Reputation now lives on its own, see
  // reputationCard below. The only driver who still sees the empty state
  // below is a Prospect -- statsKnown is false for them on purpose, since
  // they haven't been approved into a Driver yet and have no balance.
  function financesCard(data) {
    var card = el('div', 'rc-panel rc-finrep-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Finances'));

    if (data && data.success && data.statsKnown) {
      card.appendChild(el('div', 'rc-finrep-balance', formatMoney(data.bankBalance)));
      var delta = Number(data.deltaSinceLastRound) || 0;
      if (delta !== 0) {
        card.appendChild(el('div', 'rc-finrep-delta ' + (delta > 0 ? 'rc-finrep-delta-up' : 'rc-finrep-delta-down'),
          (delta > 0 ? '+' : '') + formatMoney(delta) + ' since last update'));
      }

      var stats = el('div', 'rc-finrep-ranks');
      [
        // Frozen Balance -- the portion locked in active wagers; always a
        // dash until the wager-placement mechanic that would actually
        // freeze a stake ships (Wagers sheet exists, nothing writes to it
        // yet), never guessed.
        ['Frozen Balance', (data.frozenBalance != null) ? formatMoney(data.frozenBalance) : '—'],
        ['Bank Rank', data.globalBalanceRank ? (ordinal(data.globalBalanceRank) + (data.globalBalanceRankOutOf ? ' of ' + data.globalBalanceRankOutOf : '')) : '—'],
        // Largest Win -- biggest single positive Transaction ever, not
        // counting the StartingBalance grant. Dash until this driver has
        // actually earned one (a sponsor bonus, etc.).
        ['Largest Win', (data.largestWin != null) ? formatMoney(data.largestWin) : '—']
      ].forEach(function (pair) {
        var stat = el('div', 'rc-finrep-rank');
        stat.appendChild(el('div', 'rc-finrep-rank-label', pair[0]));
        stat.appendChild(el('div', 'rc-finrep-rank-value' + (pair[1] === '—' ? ' rc-finrep-rank-value-empty' : ''), pair[1]));
        stats.appendChild(stat);
      });
      card.appendChild(stats);
    } else {
      card.appendChild(el('p', 'rc-cs-empty', 'Your balance will appear here once your driver account is approved.'));
    }

    return card;
  }

  // Reputation -- now its OWN card, on its own row (2026-08-31, Matt's
  // call), split out of the old combined "Finances & Reputation" card.
  // Still a shell only: ECO defers the whole Reputation system to a later
  // season (see v0.3-Economy-Reputation-Design.md), so this never shows a
  // fabricated score -- just the card, present and labeled, with a
  // "Not Live This Season" pill and dash-valued bottom categories, same
  // "categories at the bottom" shape as every other dashboard card.
  function reputationCard() {
    var card = el('div', 'rc-panel rc-finrep-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Reputation'));

    var headlineRow = el('div', 'rc-finrep-rep-headline-row');
    headlineRow.appendChild(el('span', 'rc-finrep-rep-headline', '—'));
    headlineRow.appendChild(el('span', 'rc-finrep-soon', 'Not Live This Season'));
    card.appendChild(headlineRow);

    // Meter -- restored (2026-08-31, Matt's call: "add the reputation bar
    // back into the REPUTATION card exactly how it appeared in the
    // FINANCE card") exactly as it was before the Finances/Reputation
    // split: a disabled red-to-gray gradient track with Low/Mid/High
    // ticks underneath, purely decorative -- no real fill, since there's
    // no reputation number to plot yet.
    var meter = el('div', 'rc-finrep-meter rc-finrep-meter-disabled');
    meter.appendChild(el('div', 'rc-finrep-meter-track'));
    var meterTicks = el('div', 'rc-finrep-meter-ticks');
    ['Low', 'Mid', 'High'].forEach(function (label) { meterTicks.appendChild(el('span', '', label)); });
    meter.appendChild(meterTicks);
    card.appendChild(meter);

    var stats = el('div', 'rc-finrep-ranks');
    [['League Rank', '—'], ['Percentile', '—']].forEach(function (pair) {
      var stat = el('div', 'rc-finrep-rank');
      stat.appendChild(el('div', 'rc-finrep-rank-label', pair[0]));
      stat.appendChild(el('div', 'rc-finrep-rank-value rc-finrep-rank-value-empty', pair[1]));
      stats.appendChild(stat);
    });
    card.appendChild(stats);

    return card;
  }

  // Recent Results -- placeholder card, next to Reputation on the third
  // row (2026-08-31, Matt's call). No backend/data wired up yet -- just
  // holding the spot in the dashboard layout for whenever this gets built.
  function recentResultsCard() {
    var card = el('div', 'rc-panel rc-finrep-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Recent Results'));
    card.appendChild(el('p', 'rc-cs-empty', 'Coming soon.'));
    return card;
  }

  // ---------------------------------------------------------------------
  // SEASON REGISTRATION MODAL -- restored from the pre-rebuild dashboard's
  // design (Matt's call: keep the modal's look/flow, drop the pre-ECO
  // cost model it was built around). What changed vs. the old version:
  //   - No more "Season Registration Fee" (a flat per-race fee, same for
  //     every team in a class) -- the current wizard's Economy section
  //     doesn't have one anymore. A team's BuyInCost (already randomized
  //     ±20% around its Tier average -- see the Car Objectives system) is
  //     the WHOLE cost now, not a per-team add-on to a season-long fee.
  //   - No reputation-floor class gating and no beginRegistration call --
  //     Reputation isn't a real computed number yet this season (see
  //     DataCache.gs's financesReputation.reputationScore comment), so
  //     there's nothing real to gate against; every class is open to
  //     every driver.
  //   - No separate chooseClass server action/state -- picking a class is
  //     purely a client-side filter now. The one server write is joinTeam
  //     itself, which locks the team immediately (Registrations.TeamID).
  //     Sponsor picks (SponsorID1-3) are OPTIONAL as of Matt's call
  //     (2026-08-30) -- a driver can skip them here and pick them later
  //     from the Sponsors page (openChooseSponsorsModal below), any time
  //     before the season itself starts.
  //   - Team cards show this car's assigned Tier + Car Objective (name +
  //     bonus payout) instead of the old bonus/penalty perk chips -- the
  //     actual ECO-era incentive attached to a seat.
  // ---------------------------------------------------------------------

  // Shared sponsor-picking list -- every sponsor as a selectable card
  // (logo capped 140px wide / 80px tall, name, bonus + penalty numbers),
  // used identically by the registration flow's sponsor-pick step above
  // and the Sponsors page's "Choose Sponsors" modal below (Matt's call,
  // 2026-08-30: one shared listing, not two separately-built pickers).
  // Clicking a sponsor toggles it; picking a 4th bumps the oldest of the
  // current 3 rather than refusing the click, so this stays a plain
  // click-to-toggle interaction with no separate "deselect first" step.
  function buildSponsorPickerList(sponsors, preselected) {
    var wrap = el('div', 'rc-sponsor-pick-list');
    var selected = (preselected || []).slice(0, 3);
    var cardBySponsorId = {};

    function refreshSelectedLook() {
      Object.keys(cardBySponsorId).forEach(function (id) {
        cardBySponsorId[id].classList.toggle('rc-sponsor-pick-card-selected', selected.indexOf(id) !== -1);
      });
    }

    function addCard(s) {
      var card = el('div', 'rc-sponsor-pick-card rc-tooltip');
      // Fixed-width column (min 150px), logo centered inside it -- same
      // "text column's left edge lands in the same place row to row"
      // reasoning as the admin Sponsors popup's logo column, just wider
      // to fit the 140px logo cap plus breathing room either side.
      var logoCol = el('div', 'rc-sponsor-pick-logo-col');
      var logo = document.createElement('img');
      logo.className = 'rc-sponsor-pick-logo';
      logo.alt = '';
      logo.src = sponsorLogoSrc(s.Name || '');
      // Hides gracefully rather than a broken-image icon -- same pattern
      // every other sponsor/track/manufacturer logo in the site uses.
      logo.onerror = function () { this.style.display = 'none'; };
      logoCol.appendChild(logo);
      card.appendChild(logoCol);

      var textCol = el('div', 'rc-sponsor-pick-text');
      textCol.appendChild(el('div', 'rc-sponsor-pick-name', escapeHtml(s.Name || '(unnamed sponsor)')));
      var bonusAmt = Number(s.BonusAmount) || 0;
      var penaltyAmt = Math.abs(Number(s.PenaltyAmount) || 0);
      // Bonus in green / Penalty in red -- Matt's call, 2026-08-30 -- so
      // the upside and downside of a sponsor read apart at a glance.
      textCol.appendChild(el('div', 'rc-sponsor-pick-terms rc-sponsor-pick-bonus', 'Bonus: ' + escapeHtml(s.BonusType || '—') + ' (+$' + bonusAmt + ')'));
      textCol.appendChild(el('div', 'rc-sponsor-pick-terms rc-sponsor-pick-penalty', 'Penalty: ' + escapeHtml(s.PenaltyType || '—') + ' (−$' + penaltyAmt + ')'));
      card.appendChild(textCol);
      // Detailed hover tooltip -- what the bonus/penalty trigger actually
      // means in plain language, not just its catalog name (Matt's call,
      // 2026-08-30: "a detailed tooltip of what the bonus entails and
      // what the penalty entails"). sponsorTermsTooltip() (reference-
      // data.js) is the one shared place this wording is defined, so it
      // reads identically everywhere a sponsor card appears.
      card.setAttribute('data-tooltip', sponsorTermsTooltip(s));

      card.addEventListener('click', function () {
        var idx = selected.indexOf(s.SponsorID);
        if (idx !== -1) {
          selected.splice(idx, 1);
        } else {
          if (selected.length >= 3) selected.shift();
          selected.push(s.SponsorID);
        }
        refreshSelectedLook();
      });

      wrap.appendChild(card);
      cardBySponsorId[s.SponsorID] = card;
    }

    // Grouped by Tier (Safe -> Balanced -> Aggressive), same order and
    // same _rcTierBadge() chip the admin Sponsors popup already uses
    // (Matt's call, 2026-08-30: "make it obvious" which risk tier each
    // sponsor is) -- a driver picking sponsors sees the same risk-level
    // grouping an admin managing the catalog does.
    var TIER_ORDER = ['Safe', 'Balanced', 'Aggressive'];
    var byTier = {};
    sponsors.forEach(function (s) {
      var tier = s.Tier || 'Unclassified';
      if (!byTier[tier]) byTier[tier] = [];
      byTier[tier].push(s);
    });
    var tierOrder = TIER_ORDER.slice();
    Object.keys(byTier).forEach(function (t) { if (tierOrder.indexOf(t) === -1) tierOrder.push(t); });
    tierOrder.forEach(function (tier) {
      var list = byTier[tier];
      if (!list) return;
      wrap.appendChild(_rcTierBadge(tier));
      list.forEach(addCard);
    });

    refreshSelectedLook();
    return { el: wrap, getSelected: function () { return selected.slice(); } };
  }
  function buildRegistrationModal(profile, token, activeSeasonData, onDone) {
    var modal = showModal('Choose Your Class', { wide: true, onClose: function () { if (onDone) onDone(); } });
    var titleEl = modal.el.querySelector('.rc-modal-head h3');
    // pillNode is optional -- pass a real badge element (see buildClassBadge
    // below) to render "TITLE Class Pill" in the modal header, e.g.
    // "Choose Your Team LMGT3" with LMGT3 shown as its actual colored chip.
    function setTitle(t, pillNode) {
      if (!titleEl) return;
      titleEl.textContent = t + ' ';
      if (pillNode) titleEl.appendChild(pillNode);
    }
    function buildClassBadge(cls) {
      var colorVar = (typeof CAR_CLASS_BADGE_COLOR_VAR !== 'undefined' && CAR_CLASS_BADGE_COLOR_VAR[cls]) ? CAR_CLASS_BADGE_COLOR_VAR[cls] : '--rc-steel';
      var badge = el('span', 'rc-badge-chip', escapeHtml(cls));
      badge.style.background = 'var(' + colorVar + ')';
      return badge;
    }

    function fetchAllTeams() {
      return fetchApi('getAvailableTeams', { token: token, params: { seasonId: activeSeasonData.seasonId } });
    }

    function showClassScreen() {
      setTitle('Choose Your Class');
      var body = modal.body;
      body.innerHTML = '';
      body.appendChild(buildSpinner('Loading classes...'));
      fetchAllTeams().then(function (data) {
        body.innerHTML = '';
        if (!data.success) { body.appendChild(el('p', 'color:var(--rc-red);', data.message || 'Could not load classes.')); return; }
        renderClassScreenBody(data.teams || []);
      }).catch(function () {
        body.innerHTML = '';
        body.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server. Try again in a moment.'));
      });
    }

    function renderClassScreenBody(allTeams) {
      var body = modal.body;
      body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin-bottom:10px;',
        'Pick the class you’ll compete in this season. You’ll choose a specific car/team next -- each car’s Buy-In cost and Season Objective are set individually.'));

      var classesPresent = [];
      allTeams.forEach(function (t) { if (t.carClass && classesPresent.indexOf(t.carClass) === -1) classesPresent.push(t.carClass); });
      var classOrder = (typeof CAR_CLASS_LIST !== 'undefined') ? CAR_CLASS_LIST : classesPresent;
      var classes = classOrder.filter(function (c) { return classesPresent.indexOf(c) !== -1; });

      if (!classes.length) {
        body.appendChild(el('p', 'color:var(--rc-steel);', 'No cars are set up for this season yet.'));
        return;
      }

      classes.forEach(function (cls) {
        var teamsInClass = allTeams.filter(function (t) { return t.carClass === cls; });
        var openTeams = teamsInClass.filter(function (t) { return !t.taken; });
        var row = el('div', 'rc-class-pick-row');
        var label = el('div', null);
        var badge = buildClassBadge(cls);
        label.appendChild(badge);
        // Gray buy-in range pill sits right next to the class badge instead
        // of living in its own centered column (Matt's call, 2026-08-30).
        var costs = teamsInClass.map(function (t) { return t.buyInCost; });
        if (costs.length) {
          var costPill = el('span', 'rc-badge-chip rc-badge-cost-range',
            formatMoney(Math.min.apply(null, costs)) + ' – ' + formatMoney(Math.max.apply(null, costs)));
          label.appendChild(costPill);
        }
        // Inset 10px from the badge/pill above it (2026-08-30, Matt's
        // call) rather than flush with their left edge.
        label.appendChild(el('div', 'color:var(--rc-steel);font-size:12px;margin-top:4px;padding-left:10px;',
          openTeams.length + ' of ' + teamsInClass.length + ' seat' + (teamsInClass.length === 1 ? '' : 's') + ' open'));
        row.appendChild(label);

        var pickBtn = el('button', null, openTeams.length ? 'Choose' : 'Full');
        pickBtn.type = 'button';
        pickBtn.className = 'rc-btn-secondary rc-btn-sm';
        pickBtn.disabled = !openTeams.length;
        row.appendChild(pickBtn);
        if (!openTeams.length) row.classList.add('rc-class-pick-row-dim');

        pickBtn.addEventListener('click', function () { showTeamScreen(cls); });
        body.appendChild(row);
      });
    }

    function showTeamScreen(carClass) {
      setTitle('Choose Your Team');
      var body = modal.body;
      body.innerHTML = '';

      var backBtn = el('button', 'rc-link-btn', '← Choose a different class');
      backBtn.type = 'button';
      backBtn.style.cssText = 'display:block;margin-bottom:10px;';
      backBtn.addEventListener('click', showClassScreen);
      body.appendChild(backBtn);

      var contentSlot = el('div');
      body.appendChild(contentSlot);
      loadTeamsInto(contentSlot, carClass);
    }

    function loadTeamsInto(contentSlot, carClass) {
      contentSlot.innerHTML = '';
      contentSlot.appendChild(buildSpinner('Loading ' + carClass + ' teams...'));
      fetchApi('getAvailableTeams', { token: token, params: { seasonId: activeSeasonData.seasonId, carClass: carClass } }).then(function (data) {
        contentSlot.innerHTML = '';
        if (!data.success) { contentSlot.appendChild(el('p', 'color:var(--rc-red);', data.message || 'Could not load teams.')); return; }
        if (!data.teams || !data.teams.length) { contentSlot.appendChild(el('p', 'color:var(--rc-steel);', 'No cars are set up for ' + escapeHtml(carClass) + ' yet.')); return; }
        // Elite always sorts to the top regardless of its actual randomized
        // buy-in cost, then everything else by cost descending (Matt's
        // call: "Elite tier put the car at the top").
        var sorted = data.teams.slice().sort(function (a, b) {
          if (a.tier === 'Elite' && b.tier !== 'Elite') return -1;
          if (b.tier === 'Elite' && a.tier !== 'Elite') return 1;
          return b.buyInCost - a.buyInCost;
        });
        sorted.forEach(function (team) { contentSlot.appendChild(buildTeamCard(team, carClass)); });
      }).catch(function () {
        contentSlot.innerHTML = '';
        contentSlot.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server. Try again in a moment.'));
      });
    }

    // Reuses the pre-rebuild team card's exact CSS classes (.rc-team-card,
    // .rc-team-logo-box, .rc-team-perks/-perk-chip, .rc-team-card-footer
    // -- all still in style.css, never removed) so this looks like the
    // card Matt originally signed off on. What's shown inside it is new:
    // Tier + Car Objective (this car's actual ECO-era incentive) instead
    // of the old bonus/penalty perks, and one flat Buy-In cost instead of
    // a Season Registration Fee + Team Buy-In breakdown.
    function buildTeamCard(team, carClass) {
      var card = el('div', 'rc-team-card' + (team.taken ? ' rc-team-card-taken' : '') + (team.tier === 'Elite' ? ' rc-team-card-elite' : ''));

      var head = el('div', 'rc-team-card-head');
      var identity = el('div', 'rc-team-card-identity');
      var logoBox = el('div', 'rc-team-logo-box');
      if (team.manufacturer && typeof manufacturerLogoSrc === 'function') {
        var logo = document.createElement('img');
        logo.src = manufacturerLogoSrc(team.manufacturer);
        logo.alt = team.manufacturer;
        logo.onerror = function () { logoBox.style.display = 'none'; };
        logoBox.appendChild(logo);
      }
      identity.appendChild(logoBox);
      var nameCol = el('div');
      nameCol.appendChild(el('div', 'rc-team-name', escapeHtml((team.teamName || 'Unnamed Team') + (team.carNumber ? ' #' + team.carNumber : ''))));
      if (team.manufacturer || team.carModel) {
        nameCol.appendChild(el('div', 'rc-team-subtitle', escapeHtml([team.manufacturer, team.carModel].filter(Boolean).join(' '))));
      }
      identity.appendChild(nameCol);
      head.appendChild(identity);
      head.appendChild(el('div', 'rc-team-cost-total', formatMoney(team.buyInCost)));
      // Light gray line under the car header, separating it from the team
      // description below (2026-08-30, Matt's call) -- only added when
      // there's actually a description underneath to separate it from.
      if (team.teamDesc) {
        head.style.cssText = 'padding-bottom:14px;border-bottom:1px solid var(--rc-offwhite);';
      }
      card.appendChild(head);

      // Team description (Cars.TeamDesc) -- lives between the header and
      // the Tier/Objective perks below, in gray body text (Matt's call,
      // 2026-08-30). Skipped entirely if the car has no description set.
      if (team.teamDesc) {
        card.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin:8px 0;', escapeHtml(team.teamDesc)));
      }

      // Tier chip colored per-Tier (2026-08-30, Matt's call: "the colors
      // we discussed") -- same Low/Mid/High/Elite palette as the Data
      // Management Cars popup's tier pill (.rc-badge-cartier-*) and the
      // Current Seat dashboard card, just tinted light here instead of a
      // solid fill, matching this page's existing green/red perk-chip
      // style. 25% width against the objective chip's 75% (Matt's call) --
      // the objective is the more decision-relevant of the two, so it gets
      // the bulk of the row.
      var perks = el('div', 'rc-team-perks');
      var tierKey = team.tier || 'Mid';
      var tierColorClass = {
        Low: 'rc-team-perk-tier-low', Mid: 'rc-team-perk-tier-mid',
        High: 'rc-team-perk-tier-high', Elite: 'rc-team-perk-tier-elite'
      }[tierKey] || 'rc-team-perk-tier-mid';
      var tierChip = el('div', 'rc-team-perk-chip rc-team-perk-tier ' + tierColorClass);
      tierChip.appendChild(el('span', 'rc-team-perk-icon', '▲'));
      tierChip.appendChild(el('span', null, '<strong>' + escapeHtml(tierKey) + ' Tier</strong> Team'));
      perks.appendChild(tierChip);
      if (team.objectiveName) {
        var objDescMap = (typeof CAR_OBJECTIVE_DESCRIPTIONS !== 'undefined') ? CAR_OBJECTIVE_DESCRIPTIONS : {};
        var objChip = el('div', 'rc-team-perk-chip rc-team-perk-objective rc-team-perk-bonus rc-tooltip');
        if (objDescMap[team.objectiveName]) objChip.setAttribute('data-tooltip', objDescMap[team.objectiveName]);
        objChip.appendChild(el('span', 'rc-team-perk-icon', '★'));
        objChip.appendChild(el('span', null, 'Season Objective — <strong>' + escapeHtml(team.objectiveName) + '</strong> — ' + formatMoney(team.objectiveBonus) + ' bonus'));
        perks.appendChild(objChip);
      }
      card.appendChild(perks);

      var footer = el('div', 'rc-team-card-footer');
      if (team.taken) {
        footer.appendChild(el('div', 'color:var(--rc-steel);font-size:13px;', 'This seat is already taken.'));
      } else {
        var joinBtn = el('button', null, 'Join This Team');
        joinBtn.type = 'button';
        joinBtn.className = 'rc-btn-primary';
        joinBtn.addEventListener('click', function () { openSponsorPickScreen(team, carClass); });
        footer.appendChild(joinBtn);
      }
      card.appendChild(footer);
      return card;
    }

    // Sponsors are OPTIONAL here now (Matt's call, 2026-08-30) -- a driver
    // can skip picking them at registration and choose them later from the
    // Sponsors page (openChooseSponsorsModal), any time before the season
    // itself starts. The team pick is still the one thing that locks
    // immediately and can't be undone.
    function openSponsorPickScreen(team, carClass) {
      setTitle('Choose Your Sponsors');
      var body = modal.body;
      body.innerHTML = '';
      var backBtn = el('button', 'rc-link-btn', '← Back to teams');
      backBtn.type = 'button';
      backBtn.style.cssText = 'display:block;margin-bottom:10px;';
      backBtn.addEventListener('click', function () { showTeamScreen(carClass); });
      body.appendChild(backBtn);
      body.appendChild(buildSpinner('Loading sponsors...'));

      fetchApi('getSponsors', { token: token }).then(function (data) {
        body.innerHTML = '';
        body.appendChild(backBtn);
        renderSponsorPickBody(body, (data.success && data.sponsors) ? data.sponsors : [], team, carClass);
      }).catch(function () {
        body.innerHTML = '';
        body.appendChild(backBtn);
        body.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server. Try again in a moment.'));
      });
    }

    function renderSponsorPickBody(body, sponsors, team, carClass) {
      body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin:10px 0;',
        'Choose 3 sponsors for the season, or skip and pick them later from the Sponsors page -- either way, joining ' +
        escapeHtml(team.teamName || team.teamId) + ' for ' + formatMoney(team.buyInCost) + ' locks in now and can\'t be undone.'));

      var enoughSponsors = sponsors.length >= 3;
      var picker = enoughSponsors ? buildSponsorPickerList(sponsors, []) : null;
      if (picker) {
        body.appendChild(picker.el);
      } else {
        body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin-bottom:10px;',
          'Not enough sponsors are set up yet to choose 3 -- skip for now and pick them later once more are added.'));
      }

      var errorLine = el('div', 'color:var(--rc-red);font-size:13px;margin:4px 0 10px;');
      body.appendChild(errorLine);

      // Bottom-right, Skip on the left of Confirm (2026-08-30, Matt's call)
      // -- justify-content:flex-end pins both to the right edge of the
      // popup; btnRow itself is still the last thing appended to `body`
      // below, so it naturally sits at the bottom of the modal's content.
      var btnRow = el('div', 'display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px;');

      function doJoin(sponsorIds) {
        confirmBtn.disabled = true;
        skipBtn.disabled = true;
        confirmBtn.textContent = 'Locking In...';
        var joinBody = { seasonId: activeSeasonData.seasonId, teamId: team.teamId };
        if (sponsorIds.length === 3) {
          joinBody.sponsorId1 = sponsorIds[0]; joinBody.sponsorId2 = sponsorIds[1]; joinBody.sponsorId3 = sponsorIds[2];
        }
        fetchApi('joinTeam', { method: 'POST', token: token, body: joinBody }).then(function (data) {
          if (!data.success) {
            confirmBtn.disabled = false;
            skipBtn.disabled = false;
            confirmBtn.textContent = 'Confirm & Lock In';
            errorLine.textContent = data.message || (data.error === 'TEAM_TAKEN' ? 'That seat was just taken. Pick a different team.' : 'Could not complete registration.');
            if (data.error === 'TEAM_TAKEN') showTeamScreen(carClass);
            return;
          }
          // Registration itself is done the instant the API call above
          // succeeds -- everything from here down is presentation. The old
          // immediate toast+close (now moved into finishRegistration below)
          // is deferred until the driver has actually watched the signing
          // sequence and dismissed the contract recap (Matt's call,
          // 2026-08-30: "I want this to feel EPIC").
          var sponsorObjs = sponsorIds.length === 3
            ? sponsorIds.map(function (id) { return sponsors.filter(function (s) { return s.SponsorID === id; })[0]; }).filter(Boolean)
            : [];
          function finishRegistration() {
            showToast(sponsorObjs.length === 3 ? 'You’re registered! Welcome to the season.' : 'You’re registered! Pick your sponsors any time from the Sponsors page.', 'success');
            // Registering for a season dismisses its bell notification the
            // same way closing the bell after seeing it would (Matt's call,
            // 2026-08-30) -- see rcDismissSeasonNotification in header.js.
            if (typeof rcDismissSeasonNotification === 'function') rcDismissSeasonNotification(activeSeasonData.seasonId);
            modal.close();
            rcReloadAfterSave();
          }
          openSigningSequence(team, sponsorObjs, carClass, finishRegistration);
        }).catch(function () {
          confirmBtn.disabled = false;
          skipBtn.disabled = false;
          confirmBtn.textContent = 'Confirm & Lock In';
          errorLine.textContent = 'Could not reach the server. Try again in a moment.';
        });
      }

      var skipBtn = el('button', null, 'Skip For Now');
      skipBtn.type = 'button';
      skipBtn.className = 'rc-btn-secondary';
      // Real border swapped for an inset box-shadow (2026-08-30) -- a
      // border adds to an intrinsically-sized button's total rendered
      // height even under box-sizing:border-box (see the signing sequence's
      // Replay/Continue height fix, same underlying issue), so this and
      // confirmBtn below both use box-shadow-only chrome to guarantee
      // pixel-identical height at matching padding/font-size.
      skipBtn.style.cssText = 'border:none;box-shadow:inset 0 0 0 1px var(--rc-silver);';
      skipBtn.addEventListener('click', function () { doJoin([]); });
      btnRow.appendChild(skipBtn);

      var confirmBtn = el('button', null, 'Confirm & Lock In');
      confirmBtn.type = 'button';
      confirmBtn.className = 'rc-btn-primary';
      // Matches Skip For Now's own padding/font-size/width (2026-08-30,
      // Matt's call) instead of the site's default full-width/larger
      // primary-button treatment, so the two sit as an equal-height pair.
      confirmBtn.style.cssText = 'width:auto;margin-top:0;padding:8px 14px;font-size:12px;letter-spacing:0.04em;';
      confirmBtn.disabled = !enoughSponsors;
      confirmBtn.addEventListener('click', function () {
        var picked = picker ? picker.getSelected() : [];
        if (picked.length !== 3) { errorLine.textContent = 'Pick 3 sponsors, or skip for now.'; return; }
        doJoin(picked);
      });
      btnRow.appendChild(confirmBtn);

      body.appendChild(btnRow);
    }

    showClassScreen();
  }

  // ---------------------------------------------------------------------
  // SIGNING SEQUENCE (2026-08-30, Matt's call: "I want this to feel
  // EPIC") -- plays after a driver locks in a team (with or without
  // sponsors), before the old immediate "you're registered" toast. Its
  // own full-viewport overlay, stacked above the registration modal's own
  // backdrop (z-index 5000 vs. the modal's 2000) rather than replacing
  // it -- the registration modal is left open but hidden behind this
  // overlay the whole time, so closing it (and everything that used to
  // fire immediately on join: the toast, the notification dismiss,
  // onDone()) is deferred to whenever this sequence actually finishes.
  //
  // Three beats:
  //   1. SUSPENSE -- a small dark card cycles contract-flavor status
  //      lines ("Drafting team documents...") while assets/videos/
  //      signing-a-team.mp4 preloads in the background, reusing the same
  //      .rc-startlights gantry as every other loading state sitewide.
  //      Held for at least SIGNING_SUSPENSE_MIN_MS even if the video is
  //      already cached, so it never flashes past unnoticed; extended for
  //      as long as the video actually needs past that floor.
  //   2. FILM -- the card grows into a 16:9 box (capped at 1280x720,
  //      matching the video's own native size) and it autoplays muted --
  //      browser autoplay policies are the reason it can't safely
  //      autoplay WITH sound -- with a small icon-only mute/unmute control
  //      (bottom-left, standard volume glyph) fading in after a beat for
  //      anyone who wants sound. No skip button at all, by design (Matt's
  //      call) -- every driver watches the full 14 seconds.
  //      SIGNING_FAILSAFE_MS guards against a video that never fires
  //      'canplay' (a bad connection, a renamed file) by moving on anyway
  //      instead of trapping the driver on a blank screen forever. Once
  //      the video ends, it does NOT auto-advance -- a dark gradient +
  //      "Continue" button fades in over the last frame, and only that
  //      click moves on to REVEAL (Matt's call: don't move on until the
  //      driver clicks continue).
  //   3. REVEAL -- the whole dark stage collapses to a true full-viewport
  //      beat: the Race Club wordmark, "CONGRATULATIONS", and the new
  //      team's manufacturer logo/name scale up together, with "Continue"
  //      and "Replay Video" fading in. This beat HOLDS here indefinitely --
  //      no auto-advance timer -- only Continue moves on to the contract
  //      screen (Matt's call, 2026-08-30).
  //
  // From there the whole dark overlay is torn down and
  // showSigningContractModal() takes over -- a normal white modal card,
  // same popup language as the rest of the site, itemizing exactly what
  // was just signed: team identity, seat cost, tier, this season's Car
  // Objective bonus, and (if chosen) all 3 sponsor bonus/penalty terms.
  // Dismissing that card -- either its "Let's Go Racing" button or its X
  // button, both wired to the same showModal onClose -- is what finally
  // calls onFinish (finishRegistration above): the toast, notification
  // dismiss, and registration-modal close all happen there, right as the
  // driver dismisses the recap, not back when the API call first
  // succeeded.
  // ---------------------------------------------------------------------
  var SIGNING_MESSAGES_ = [
    'Drafting team documents...',
    'Securing season entry fees...',
    'Notifying the team principal...',
    'Verifying sponsorship terms...',
    'Fitting your race suit...',
    'Calibrating the seat...',
    'Finalizing your contract...',
    'Bringing the car to pit lane...'
  ];

  // Ten team-principal-to-new-driver lines for the REVEAL beat (2026-08-30,
  // Matt's ask: "feels like something a team principal would say to their
  // new driver... make it feel personal"), replacing the single generic
  // "You just earned a seat at ___. Time to make it count." One is picked
  // at random per signing (rcPickWelcomeLine_ below) -- {team} is the only
  // placeholder since a driver's own name is already all over the header
  // chrome; these are written as if spoken TO the driver, not about them.
  // Second pass, same day (Matt: "make the hype messages... only positive!
  // ... 3 sentences long and cmon give it some energy!!!") -- every line
  // rewritten as an upbeat, energetic, exactly-3-sentence quote (no mixed
  // "don't make us regret it"/challenge-toned lines from the first draft),
  // rendered inside big quotation marks with a "— Team Principal"
  // attribution underneath (see advanceToReveal below).
  var SIGNING_WELCOME_LINES_ = [
    'Welcome to {team}! We’ve been waiting for a driver like you, and we finally found one. This seat is yours — now let’s go show everyone what we can do!',
    'You earned this, plain and simple! {team} doesn’t hand out seats, we award them. Buckle up — this is going to be a season to remember!',
    'From everyone at {team}: congratulations! You’re not just joining a team, you’re joining a family that believes in you. Let’s get out there and win!',
    'This is the moment every driver dreams about, and it’s yours! {team} is fully behind you, every lap, every race. Now go make us proud!',
    'Welcome aboard, driver! We built this car for someone special, and that someone is you. Let’s make {team} history together!',
    'The whole {team} garage is buzzing about you! You’ve got the talent, we’ve got the car — together we’re unstoppable. Let’s go racing!',
    'You should be incredibly proud of yourself right now! {team} chose you because we believe you can do great things. Now it’s time to prove it!',
    'Congratulations, and welcome to the team! Every great champion started exactly where you are right now. Let’s write your story together!',
    'This seat has your name on it for a reason! {team} sees the potential in you, and we can’t wait to watch it grow. Let’s hit the track!',
    'Welcome to {team}, driver! Today you take the first step toward something incredible. Strap in — the season starts now!'
  ];
  function rcPickWelcomeLine_(team) {
    var template = SIGNING_WELCOME_LINES_[Math.floor(Math.random() * SIGNING_WELCOME_LINES_.length)];
    return template.split('{team}').join(escapeHtml(team.teamName || 'the team'));
  }
  var SIGNING_SUSPENSE_MIN_MS = 3800;
  var SIGNING_FAILSAFE_MS = 20000;

  // Standard flat mute/unmute glyphs (Feather-style "volume-2"/"volume-x")
  // for the FILM stage's sound control -- plain line icons, not the emoji
  // speakers used before (Matt: "make it a standard speaker icon, not the
  // 3d one you chose").
  function rcVolumeIconSvg_(muted) {
    var speaker = '<path d="M11 5 6 9H2v6h4l5 4V5z"></path>';
    var rest = muted
      ? '<line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>'
      : '<path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>';
    return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + speaker + rest + '</svg>';
  }

  function openSigningSequence(team, sponsorObjs, carClass, onFinish) {
