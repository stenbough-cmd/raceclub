    toggleBtn.type = 'button';
    statusWrap.appendChild(toggleBtn);
    body.appendChild(statusWrap);

    var modalHandle = showModal('Edit Sponsor', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!name.value.trim() || !bonusType.value.trim()) {
        showToast('Sponsor name and bonus trigger are required.', 'error');
        return;
      }
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      fetchApi('adminUpdateSponsor', {
        method: 'POST', token: token,
        body: {
          sponsorId: sponsor.SponsorID,
          Name: name.value.trim(),
          Tier: tier.value,
          BonusType: bonusType.value.trim(),
          BonusAmount: Number(bonusAmount.value) || 0,
          PenaltyType: penaltyType.value.trim(),
          PenaltyAmount: -Math.abs(Number(penaltyAmount.value) || 0)
        }
      })
        .then(function (data) {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          if (!data.success) {
            showToast(data.message || 'Could not save changes.', 'error');
            return;
          }
          showToast('Sponsor updated.', 'success');
          rcReloadAfterSave();
        })
        .catch(function () {
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save Changes';
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });

    toggleBtn.addEventListener('click', function () {
      toggleBtn.disabled = true;
      fetchApi('adminSetSponsorActive', {
        method: 'POST', token: token,
        body: { sponsorId: sponsor.SponsorID, active: isActive ? 'Inactive' : 'Active' }
      })
        .then(function (data) {
          toggleBtn.disabled = false;
          if (!data.success) {
            showToast(data.message || 'Could not update this sponsor.', 'error');
            return;
          }
          showToast(isActive ? 'Sponsor deactivated.' : 'Sponsor reactivated.', 'success');
          rcReloadAfterSave();
        })
        .catch(function () {
          toggleBtn.disabled = false;
          showToast('Could not reach the server. Try again in a moment.', 'error');
        });
    });
  }

      saveBtn.disabled = true;

      fetchApi('adminAddSponsor', {

  // ---------------------------------------------------------------------
  // TOP-LEVEL RENDER
  // ---------------------------------------------------------------------
  function buildFullProfileUI(profile, token, dashboardData) {
    currentProfile = profile;
    currentToken = token;

    // Cross-page bridge for the header's Edit Profile menu item
    // (2026-09-01, Matt's call) -- js/header.js runs on every page in its
    // own scope and can't reach openEditProfileModal directly (it's
    // closured inside this page's own IIFE), so it calls this instead
    // whenever it's here. See header.js's own comment for the fallback
    // path (a page where this bridge doesn't exist yet).
    window.rcOpenEditProfileModal = function () { openEditProfileModal(currentProfile, currentToken); };

    // Same bridge pattern, for the header bell's notification links
    // (2026-09-02, Matt's call: notifications should link straight to the
    // page they're about, not just carry an OK button). A plain
    // href="Account.html#admin" would only work correctly when clicked
    // from a DIFFERENT page -- clicking it while already ON Account.html
    // is a same-document hash change (no reload), which showSection() is
    // never told about, so the visible section wouldn't actually switch.
    // js/header.js calls this instead whenever it's here (this page,
    // already loaded); its own click handler falls back to a real
    // navigation (window.location.href) when this bridge doesn't exist,
    // same "call it directly if present, otherwise navigate and let the
    // other side pick it up" shape as rcOpenEditProfileModal above. Runs
    // the section's own lazy renderer too, same as an actual nav-item
    // click (see RC_LAZY_SECTION_RENDERERS/makeNavButton above) so the
    // section shows current data rather than whatever it last held (or
    // nothing, if it was never opened this page load).
    window.rcNavigateToSection = function (id) {
      showLazySection(id, currentToken);
    };

    // Same bridge, other direction -- a click on Edit Profile from a page
    // OTHER than Account.html sets this flag and navigates here; once
    // this driver's own profile/token are actually loaded (right here),
    // open the modal immediately, same one-shot "consume and clear"
    // handoff pattern raceclub_fresh_profile already uses below.
    if (sessionStorage.getItem('raceclub_open_edit_profile')) {
      sessionStorage.removeItem('raceclub_open_edit_profile');
      openEditProfileModal(currentProfile, currentToken);
    }

    buildSidebarNav();
    document.getElementById('rc-sidebar-nav').classList.remove('rc-nav-loading');
    renderPlaceholderSections();
    renderHelpSection();

    // Cumulative access hierarchy (race-club-v03-system-map.html, Section
    // 0): Driver < Steward < Organizer < Admin. Organizer's own
    // capability is "edit season info & schedule", which is exactly
    // League Management -- so Organizer unlocks that nav item too, same
    // as Admin (who has every Organizer capability plus more). Protests
    // is Steward-and-above (2026-08-30, Matt's call) -- everyone who can
    // reach League Management or Admin can also reach it, since both of
    // those sit above Steward in the hierarchy. Admin (which now hosts
    // what Data Management used to show -- Members/Tracks/Cars/Sponsors
    // popups) stays Admin-only -- that maps to Level 4 capabilities
    // ("change anyone's access level", manage reference data), not
    // anything Organizer has per the system map. Revisit if that design
    // changes.
    if (profile.role === 'Steward' || profile.role === 'Organizer' || profile.role === 'Admin') {
      document.getElementById('rc-nav-protests').style.display = 'flex';
      showUpperNavDivider();
    }
    if (profile.role === 'Admin' || profile.role === 'Organizer') {
      document.getElementById('rc-nav-league').style.display = 'flex';
      showUpperNavDivider();
    }
    if (profile.role === 'Admin') {
      document.getElementById('rc-nav-admin').style.display = 'flex';
      showUpperNavDivider();
    }

    renderDashboardSection(profile, token, dashboardData);

    // Silently prefetch Calendar and keep it loaded for the rest of the
    // session (2026-09-03, Matt's call: "silently load, and keep loaded
    // the calendar page AFTER the dashboard has completely loaded...
    // since this page will not change much throughout the season, it can
    // stay loaded for the session"). Waits on every one of the Dashboard's
    // own card fetches settling first, rather than firing alongside them
    // -- Apps Script Web Apps queue same-user fetch() calls somewhat
    // rather than truly running them in parallel (see the long comment on
    // fetchDashboardData above), so prefetching Calendar at the same time
    // would compete with, and slow down, the cards the driver is actually
    // looking at first. Reuses the exact same "loaded once, stays loaded"
    // cache showLazySection already relies on (rcLoadedLazySections) --
    // guarded so this never double-fetches if the driver manually clicks
    // into Calendar before this background prefetch gets there first.
    Promise.all([
      dashboardData.activeSeasonPromise, dashboardData.currentSeatPromise, dashboardData.financesPromise,
      dashboardData.seasonObjectivePromise, dashboardData.nextRacePromise, dashboardData.sponsorsPromise
    ]).then(function () {
      if (rcLoadedLazySections.calendar) return;
      rcLoadedLazySections.calendar = true;
      renderCalendarSection(token);
    });

    // Same-page restore after a popup save (2026-09-01, Matt's call) --
    // see rcReloadAfterSave() above for the full story. Only trusts the
    // URL hash if it names a section that both actually exists AND this
    // driver's own role currently has a visible nav button for (covers
    // Admin/League Management/Protests, which are permission-gated above
    // this point) -- anything else falls back to Dashboard, same as a
    // plain visit to this page always has.
    var restoreSectionId = 'dashboard';
    var hashSectionId = (window.location.hash || '').replace(/^#/, '');
    if (hashSectionId && document.getElementById('rc-section-' + hashSectionId)) {
      var hashNavBtn = document.getElementById('rc-nav-' + hashSectionId);
      if (!hashNavBtn || hashNavBtn.style.display !== 'none') restoreSectionId = hashSectionId;
    }
    if (RC_LAZY_SECTION_RENDERERS[restoreSectionId]) {
      rcLoadedLazySections[restoreSectionId] = true;
      RC_LAZY_SECTION_RENDERERS[restoreSectionId](token);
    }
    showSection(restoreSectionId);
    // Clean the hash off the URL bar once it's been consumed -- leaves the
    // reload's destination unmarked in history rather than piling up a
    // '#sponsors' etc. that a plain refresh or back-button visit would
    // otherwise keep re-landing on.
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname + window.location.search);
    }
  }

  // updateAdminNavDot() removed (2026-09-02, Matt's call: "get rid of
  // notification bubbles on the links" -- the sidebar Admin link used to
  // carry its own red dot for a pending sign-up, duplicating the header
  // bell's own pending-approval notification for the same event. One
  // signal (the bell) now covers it.

  // mustChangePassword forces a password change before the driver can do
  // anything else -- the sidebar/topbar stay hidden and #rc-forced-password
  // shows ONLY the passwordChangeSection() form until it succeeds.
  // passwordChangeSection now does a full rcReloadAfterSave() on success
  // (2026-08-30, Matt's call: every popup save reloads) rather than
  // removing its own box -- the reload re-fetches the profile fresh, sees
  // mustChangePassword is no longer set, and lands on the normal
  // dashboard on its own. The MutationObserver below is dead code left in
  // place as a harmless fallback (it would only ever fire if something
  // removed `box` from the DOM without a reload following) rather than
  // ripped out for a change this narrow.
  function renderProfile(profile, token, dashboardData) {
    if (profile.mustChangePassword) {
      document.getElementById('rc-sidebar').style.display = 'none';
      document.getElementById('rc-topbar').style.display = 'none';

      var lockWrap = document.getElementById('rc-forced-password');
      lockWrap.style.display = 'block';
      lockWrap.innerHTML = '';

      var container = el('div', 'rc-forced-password-wrap');
      container.appendChild(el('p', null, 'For security, please set a new password before continuing to your profile.'));
      var box = passwordChangeSection(token);
      container.appendChild(box);
      lockWrap.appendChild(container);

      var observer = new MutationObserver(function () {
        if (!document.body.contains(box)) {
          observer.disconnect();
          lockWrap.style.display = 'none';
          document.getElementById('rc-sidebar').style.display = '';
          document.getElementById('rc-topbar').style.display = '';
          profile.mustChangePassword = false;
          buildFullProfileUI(profile, token, dashboardData);
        }
      });
      observer.observe(container, { childList: true, subtree: true });
      return;
    }

    buildFullProfileUI(profile, token, dashboardData);
  }

  // ---------------------------------------------------------------------
  // LOAD PROFILE -- deliberately the LAST thing in this script (see the
  // comment near the top of the auth gate for why).
  //
  // Arriving here right after a successful login skips a second getProfile
  // round-trip: login.html's own response already IS a full profile
  // payload, stashed in sessionStorage under 'raceclub_fresh_profile'
  // right before redirecting here. It's read-once (removed immediately),
  // so any other way of arriving at this page still fetches fresh data.
  // ---------------------------------------------------------------------
  document.getElementById('rc-sidebar-nav').classList.add('rc-nav-loading');
  buildSidebarNav();

  // Dashboard cards never show their own loading state (Matt's call: "no
  // loaders in any of the cards, ever, I don't even want the
  // functionality to exist") -- every card fetch is fired here,
  // immediately, in parallel with the profile load itself.
  //
  // 2026-09-03 rewrite (Matt's ask: "instead of loading everything in on
  // the dash, have the dash populate instantly and load the cards one by
  // one like the wager card loads, fading into place"): NOTHING here
  // gates the page anymore -- not even the 3-call "priority batch" from
  // earlier the same day. All 6 dashboard-data calls fire in this same
  // breath (fetchDashboardData below) and are handed straight through as
  // still-in-flight promises; the Dashboard section is built (see
  // renderProfile -> renderDashboardSection) the instant the PROFILE
  // fetch itself resolves, and every single card fades its real content
  // in independently the moment its own fetch resolves, via
  // asyncDashCard/buildDashboardDataRows above. The only thing the
  // page-wide "Loading your dashboard..." spinner still waits on is the
  // profile fetch.
  //
  // A failed card fetch still resolves (to a {success:false} stand-in via
  // .catch) rather than rejecting, so one card's server error never
  // leaves that one card's own placeholder hanging forever or blocks any
  // other card.
  //
  // getMyWagerSummary is deliberately NOT part of this batch -- folding
  // it in here (2026-09-02) roughly DOUBLED the whole dashboard's load
  // time, because Apps Script Web Apps don't actually run several
  // fetch() calls from the same user fully in parallel server-side
  // (per-user concurrent-execution limits mean they queue up behind each
  // other to some degree). The Wager dashboard card fetches its own data
  // separately, same as it always has.
  var dashboardData = fetchDashboardData(token);

  var freshProfileRaw = sessionStorage.getItem('raceclub_fresh_profile');
  if (freshProfileRaw) sessionStorage.removeItem('raceclub_fresh_profile');
  var freshProfile = null;
  if (freshProfileRaw) {
    try { freshProfile = JSON.parse(freshProfileRaw); } catch (err) { freshProfile = null; }
  }

  if (freshProfile && freshProfile.success) {
    renderHeader(); // header fetches its own notifications now -- see js/header.js
    document.getElementById('rc-loading').style.display = 'none';
    document.getElementById('rc-profile-root').style.display = 'block';
    renderProfile(freshProfile.profile, token, dashboardData);
  } else {
    fetchApi('getProfile', { token: token })
      .then(function (data) {
        if (!data.success) {
          clearToken();
          sessionStorage.setItem('raceclub_login_message', 'Your session expired. Please log in again.');
          window.location.href = 'login.html';
          return;
        }
        setProfileCache(data.profile); // keeps the header avatar current on every other page too
        renderHeader(); // confirmed by the API -- safe to show as logged in; fetches its own notifications now
        document.getElementById('rc-loading').style.display = 'none';
        document.getElementById('rc-profile-root').style.display = 'block';
        renderProfile(data.profile, token, dashboardData);
      })
      .catch(function () {
        renderHeader({ forceLoggedOut: true });
        document.getElementById('rc-loading').style.display = 'none';
        var err = document.getElementById('rc-error');
        err.style.display = 'block';
        err.textContent = 'Could not reach the server. Check API_BASE_URL and try again.';
      });
  }
})();
</script>
</body>
</html>
