    }
    rbNav.appendChild(rbNavGrid);
    rulebook.appendChild(rbNav);
    rulebook.appendChild(rbSections);
    section.appendChild(rulebook);
  }

  // ---------------------------------------------------------------------
  // LEAGUE MANAGEMENT -- one panel, two buttons, for now (Matt's call:
  // "these will be the only two buttons in League Management for now").
  // Create a Season opens the full Season Creation Wizard below -- ported
  // back from the pre-v0.5 archive at Matt's request ("I don't like the
  // way this wizard looks... make it look identical to the previous
  // iteration -- then we can go through and remove parts we don't need").
  // The button's own label still flips to "Resume Season Draft" when a
  // local draft exists (same as the archived version) -- that's still one
  // button, not a third one, so it doesn't violate the two-button rule.
  // Edit Season is a stub -- there's no season list/edit endpoint yet, so
  // it just says so; wiring it up is future work, same shape as Create
  // once there's something to point it at.
  // ---------------------------------------------------------------------
  // Status pill for the Season Tools list (added 2026-08-30) -- same chip
  // shape/pattern as _rcClassBadge, colored per status so
  // Draft/Scheduled/Registration/Active/Completed read apart from each
  // other in a flat list. Falls back to Draft's color for a blank/unknown
  // status, same "old rows never break" convention as everywhere else a
  // status column can be empty.
  function _rcSeasonStatusBadge(status) {
    var key = status || 'Draft';
    var classMap = {
      Draft: 'rc-badge-status-draft', Scheduled: 'rc-badge-status-scheduled',
      Registration: 'rc-badge-status-registration', Active: 'rc-badge-status-active',
      Completed: 'rc-badge-status-completed'
    };
    return el('span', 'rc-badge-chip ' + (classMap[key] || 'rc-badge-status-draft'), escapeHtml(key));
  }

  // One row for a single season -- own row builder (2026-08-30) so it can
  // be dropped straight into Season Tools' own panel underneath a year
  // pill (see buildSeasonsListFragment below), same "row with an Edit
  // button on the right" shape the Data Management Cars/Tracks lists
  // already use, just under its own .rc-group-row class since it's
  // indented one level deeper (year -> season) than those lists ever go.
  function buildSeasonRow(s, races, token, reload, defaultExpanded) {
    var container = el('div', null);
    var row = el('div', 'rc-group-row');
    var info = el('div', 'rc-dm-row-info');
    var textCol = el('div', null);

    var nameLine = el('div', 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;');
    nameLine.appendChild(el('span', 'rc-dm-row-label', escapeHtml(s.name || s.seasonId)));
    var statusBadge = _rcSeasonStatusBadge(s.status);
    nameLine.appendChild(statusBadge);
    textCol.appendChild(nameLine);

    var metaParts = [];
    metaParts.push(s.classes && s.classes.length ? s.classes.join(', ') : 'No classes selected');
    metaParts.push(s.raceCount + ' race' + (s.raceCount === 1 ? '' : 's'));
    metaParts.push(s.registrationCount + ' driver' + (s.registrationCount === 1 ? '' : 's') + ' registered');
    if (s.createdAt) metaParts.push('Created ' + formatDateLabel(String(s.createdAt).slice(0, 10)));
    textCol.appendChild(el('div', 'rc-hint', escapeHtml(metaParts.join(' · '))));

    info.appendChild(textCol);
    row.appendChild(info);

    var btnGroup = el('div', 'display:flex;gap:8px;flex:none;');

    // RECOMPUTE SEASON (2026-09-08) -- only offered once the season has at
    // least one round with results (s.locked -- same "has actually raced"
    // gate End Season/Delete already use). Re-runs SeasonHistory for every
    // completed round in order, so an edit to an earlier round's results
    // (a corrected re-import, a protest ruling recorded after later rounds
    // were already imported) is reflected in every later round's numbers
    // and in Season Standings -- see handleAdminRecomputeSeason,
    // DataCache.gs.
    if (s.locked) {
      var recomputeBtn = el('button', 'rc-btn-primary rc-btn-sm rc-btn-row', 'Recompute Season');
      recomputeBtn.type = 'button';
      recomputeBtn.addEventListener('click', function () {
        recomputeBtn.disabled = true;
        fetchApi('adminRecomputeSeason', { method: 'POST', token: token, body: { seasonId: s.seasonId } }).then(function (data) {
          recomputeBtn.disabled = false;
          if (!data.success) {
            showToast(data.message || 'Could not recompute this season.', 'error');
            return;
          }
          var msg = 'Recomputed ' + data.roundsRecomputed + ' round' + (data.roundsRecomputed === 1 ? '' : 's') + '.';
          showToast(msg, 'success');
        }).catch(function () {
          recomputeBtn.disabled = false;
          showToast('Could not reach the server.', 'error');
        });
      });
      btnGroup.appendChild(recomputeBtn);
    }

    // Admin-only (2026-09-14, Matt's call: "league organizers are not
    // able to edit seasons, only import race data and deal with
    // protests etc" -- reverses the previous day's "organizers can
    // edit" call). The backend already required Admin here
    // (handleUpdateSeason, DataCache.gs, requireRole(admin, ['Admin']));
    // an Organizer viewer no longer gets a button that was never going
    // to work for them.
    if (currentProfile && currentProfile.role === 'Admin') {
      var editBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit Season');
      editBtn.type = 'button';
      editBtn.addEventListener('click', function () { openSeasonEditWizardWithLoad(token, s.seasonId); });
      btnGroup.appendChild(editBtn);
    }

    // Delete removed from this row entirely (2026-09-14, Matt's call:
    // "Remove DELETE from the Season buttons so that only EDIT SEASON
    // and the arrow is there") -- only Edit Season and the races
    // disclosure arrow remain per-row. adminDeleteSeason (DataCache.gs)
    // is untouched server-side; there's just no button wired to it here
    // anymore.

    // Races (2026-09-07) -- replaces the old standalone Race Ingestion
    // container: instead of a separate "pick a round from a dropdown"
    // panel, every race/special event for THIS season expands right here,
    // each with its own Add Results / Delete pair already scoped to that
    // race -- Matt's call: "kills two birds with one stone using the
    // already setup season list." Lazy-fetched on first expand (same
    // "nothing loads until it's actually opened" convention as every other
    // per-row expansion on this site) via action=adminGetSeasonRaces,
    // which reuses the exact same entries Calendar itself builds, so the
    // status pill shown here can never disagree with what a driver sees
    // on the Calendar page.
    // No bordered box around this (2026-09-07, Matt's call: "the line
    // below the season works well enough") -- just an indented plain
    // container, relying on .rc-group-row's own border-bottom (the season
    // row sitting right above it) as the only separator.
    // `races` already loaded (2026-09-07, Matt's call: everything loads
    // up front alongside the season list itself -- see
    // renderLeagueManagementSection's Promise.all -- so clicking this
    // toggle is pure show/hide, never a fetch). The list is built once,
    // right now, and just sits hidden until the toggle is clicked.
    // Renamed "Races (n)" -> "Show Races (n)" (2026-09-08, Matt's call) so
    // the collapsed state reads as an action ("show me") rather than just a
    // count. The most current season (defaultExpanded, passed in from
    // buildSeasonsListFragment -- seasons already arrive most-recently-
    // created first, so this is simply seasons[0]) starts already expanded
    // on page load instead of requiring a click.
    var racesBox = el('div', 'padding-left:20px;' + (defaultExpanded ? '' : 'display:none;'));
    racesBox.appendChild(buildSeasonRacesList(races || [], token, reload));
    // Triangle disclosure toggle (2026-09-13, Matt's call) -- replaces the
    // old "Show Races (n)"/"Hide Races" text button. The race count isn't
    // lost, it's already shown right above in this row's own meta line
    // (metaParts, "N races · N drivers registered"), so the button itself
    // only needs to say open/closed, which a rotating chevron does without
    // any text at all.
    var racesToggleBtn = el('button', 'rc-disclosure-btn' + (defaultExpanded ? ' rc-disclosure-open' : ''), ICON_CHEVRON_DOWN);
    racesToggleBtn.type = 'button';
    racesToggleBtn.setAttribute('aria-expanded', defaultExpanded ? 'true' : 'false');
    racesToggleBtn.setAttribute('aria-label', defaultExpanded ? 'Hide races' : 'Show races');
    racesToggleBtn.addEventListener('click', function () {
      var isOpen = racesBox.style.display !== 'none';
      racesBox.style.display = isOpen ? 'none' : '';
      racesToggleBtn.classList.toggle('rc-disclosure-open', !isOpen);
      racesToggleBtn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      racesToggleBtn.setAttribute('aria-label', isOpen ? 'Show races' : 'Hide races');
    });
    btnGroup.appendChild(racesToggleBtn);

    // End Season moved to the Admin page (2026-09-09, Matt's call: "only
    // admins should be able to create and end seasons") -- League
    // Management is visible to every member, not just admins, so an
    // irreversible action like this no longer lives on a page anyone can
    // see, only trigger if they happen to be an admin. See
    // openEndSeasonModal/renderAdminSection for the replacement (a
    // season-picker popup there, since Admin doesn't already have a
    // specific season's row in hand the way this one did).

    row.appendChild(btnGroup);
    container.appendChild(row);
    container.appendChild(racesBox);
    return container;
  }

  // One row per race/special event within a season's expanded Races box
  // (buildSeasonRow above) -- status pill reads finished/hasResults off
  // the same entries Calendar builds (adminGetSeasonRaces reuses
  // _rcBuildSeasonEntriesById_, DataCache.gs), and Add Results/Delete are
  // only offered for a real Round (a Special Event has no RoundID to
  // import against until that system is designed for real -- see Rounds'
  // schema comment in Core.gs). Bye weeks are filtered out entirely --
  // they're not a race at all.
  function buildSeasonRacesList(races, token, reload) {
    var box = el('div');
    var real = (races || []).filter(function (r) { return r.kind !== 'bye'; });
    if (!real.length) {
      box.appendChild(el('div', 'rc-dm-empty', 'No races scheduled for this season yet.'));
      return box;
    }
    real.forEach(function (r) { box.appendChild(buildSeasonRaceRow(r, token, reload)); });
    return box;
  }

  function buildSeasonRaceRow(r, token, reload) {
    var row = el('div', 'rc-group-row');
    var info = el('div', 'rc-dm-row-info');
    var textCol = el('div', null);

    var isSpecial = r.kind === 'special';
    var title = isSpecial ? (r.eventName || 'Special Event') : ('Round ' + r.roundNumber + ': ' + (r.eventName || r.track || ''));
    var roundLabel = 'Round ' + r.roundNumber + (r.track ? ': ' + r.track : '');

    var nameLine = el('div', 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;');
    nameLine.appendChild(el('span', 'rc-dm-row-label', escapeHtml(title)));

    var statusText, statusClass;
    if (!r.finished) {
      statusText = 'Scheduled'; statusClass = 'rc-badge-race-scheduled';
    } else if (isSpecial) {
      statusText = 'Completed'; statusClass = 'rc-badge-race-posted';
    } else if (r.hasResults) {
      statusText = 'Completed -- Results Posted'; statusClass = 'rc-badge-race-posted';
    } else {
      statusText = 'Completed -- No Results Posted Yet'; statusClass = 'rc-badge-race-noresults';
    }
    nameLine.appendChild(el('span', 'rc-badge-chip ' + statusClass, statusText));
    // Finalized chip (2026-09-19) -- the old Finalize/Un-Finalize button's
    // label used to be the only way to see a round's finalized status at a
    // glance; now that it's folded into the Edit & Finalize popup, this
    // row needs its own indicator so that status is still visible without
    // opening it.
    if (r.hasResults && r.resultsFinalized) {
      nameLine.appendChild(el('span', 'rc-badge-chip rc-badge-status-completed', 'Finalized'));
    }
    textCol.appendChild(nameLine);

    var metaParts = [];
    if (!isSpecial && r.track) metaParts.push(r.track);
    if (r.startUtc) metaParts.push(formatRaceDateTime(r.startUtc, ''));
    textCol.appendChild(el('div', 'rc-hint', escapeHtml(metaParts.join(' · ') || 'Date/time not set')));

    info.appendChild(textCol);
    row.appendChild(info);

    var btnGroup = el('div', 'display:flex;gap:8px;flex:none;');

    if (!isSpecial && r.roundId) {
      // No round picker in either popup below -- the click that opened
      // this row already knows exactly which round it's for (Matt's
      // call), so openImportXmlModal/openEraseRoundIngestionModal go
      // straight to the upload/erase form.
      var addBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Import Results');
      addBtn.type = 'button';
      if (r.hasResults) {
        // Grayed out once this round already has results (2026-09-07,
        // Matt's call) -- makes it obvious at a glance that this round is
        // done; Delete first (right next to it) to re-import.
        addBtn.disabled = true;
        addBtn.title = 'Results already imported for this round. Delete them first to re-import.';
        addBtn.style.cssText = 'opacity:0.5;';
      } else {
        addBtn.addEventListener('click', function () {
          openImportXmlModal(token, { roundId: r.roundId, roundLabel: roundLabel });
        });
      }
      btnGroup.appendChild(addBtn);

      // VIEW / EDIT & FINALIZE (2026-09-19, Matt's call: "the correct way
      // to handle the edit and finalize buttons are to combine them" --
      // replaces the old separate Finalize and Edit buttons) -- only
      // meaningful once a round actually has results. Sits between Import
      // Results and Delete, per Matt's spec: "IMPORT RESULTS | VIEW EDIT &
      // FINALIZE | DELETE". Always enabled, whether or not the round is
      // already finalized -- Un-Finalize now lives inside that same popup
      // (openRoundEditFinalizeModal above) instead of a separate disabled/
      // enabled button pair out here.
      if (r.hasResults) {
        var viewBtn = el('button', 'rc-btn-secondary rc-btn-row', 'View');
        viewBtn.type = 'button';
        viewBtn.addEventListener('click', function () { openRoundViewModal(token, { roundId: r.roundId, roundLabel: roundLabel }); });
        btnGroup.appendChild(viewBtn);

        var editFinalizeBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Edit & Finalize');
        editFinalizeBtn.type = 'button';
        editFinalizeBtn.addEventListener('click', function () {
          openRoundEditFinalizeModal(token, { roundId: r.roundId, roundLabel: roundLabel, resultsFinalized: r.resultsFinalized }, reload);
        });
        btnGroup.appendChild(editFinalizeBtn);
      }

      var delBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Delete');
      delBtn.type = 'button';
      if (r.hasResults) {
        // Plain gray, not red -- opens the erase popup, doesn't erase by
        // itself (see the Delete Season comment above for why).
        delBtn.addEventListener('click', function () {
          openEraseRoundIngestionModal(token, { roundId: r.roundId, roundLabel: roundLabel });
        });
      } else {
        delBtn.disabled = true;
        delBtn.title = 'No results imported yet for this round.';
        delBtn.style.cssText = 'opacity:0.5;';
      }
      btnGroup.appendChild(delBtn);
    }

    row.appendChild(btnGroup);
    return row;
  }

  // Every season, grouped by the year it was CREATED (not the season's own
  // in-game year/number) -- same black-pill-plus-indented-children shape
  // the Cars list uses for Class -> Season (2026-08-30, Matt's ask: "arrange
  // season list like cars"). A season with no CreatedAt (created before
  // that column existed) groups under "Unknown Year" rather than guessing.
  // Returns a plain fragment-like container -- buildSeasonsPanel wraps the
  // result in its own bordered .rc-panel box (2026-08-30), same as every
  // other Data Management list, rather than this function owning that
  // border itself.
  function buildSeasonsListFragment(seasons, racesBySeasonId, token, reload) {
    var wrap = el('div');
    if (!seasons.length) {
      wrap.appendChild(el('div', 'rc-dm-empty', 'No seasons yet.'));
      return wrap;
    }

    var byYear = {};
    var years = [];
    seasons.forEach(function (s) {
      var year = s.createdAt ? String(s.createdAt).slice(0, 4) : 'Unknown Year';
      if (!byYear[year]) { byYear[year] = []; years.push(year); }
      byYear[year].push(s);
    });
    // Seasons already arrive most-recently-created first (handleAdminListSeasons)
    // -- sorting years the same way keeps this year first without a second
    // pass over createdAt strings.
    years.sort(function (a, b) { return b.localeCompare(a); });

    // Seasons arrive most-recently-created first (handleAdminListSeasons),
    // so seasons[0] IS the most current one -- that's the row that starts
    // with its races already shown on page load (2026-09-08, Matt's call:
    // "have the most current season to already have their races shown upon
    // page load").
    var mostCurrentSeasonId = seasons[0] && seasons[0].seasonId;

    years.forEach(function (year) {
      var yearHead = el('div', 'rc-group-head');
      yearHead.appendChild(el('span', 'rc-badge-chip rc-badge-group', escapeHtml(year)));
      wrap.appendChild(yearHead);
      byYear[year].forEach(function (s) {
        wrap.appendChild(buildSeasonRow(s, racesBySeasonId[s.seasonId] || [], token, reload, s.seasonId === mostCurrentSeasonId));
      });
    });

    return wrap;
  }

  // The whole Seasons panel -- button row (Create/End Season) plus the
  // season list underneath it, both built together in one shot once
  // `seasons` has actually loaded. Named "Seasons" now (renamed from
  // "Season Tools", 2026-08-30), using the same card chrome as the
  // Dashboard's own cards (rc-dash-card/rc-dash-card-title) for visual
  // consistency across the site. `reload` is a full re-render of the
  // whole League Management section (see renderLeagueManagementSection)
  // rather than patching just this panel in place -- keeps "nothing shows
  // until it's loaded" true after a mutation too, not just on first load.
  // `showCreateButton` -- Create a Season / End Season only render when
  // true, i.e. only for an Admin viewer (see the renderLeagueManagementSection
  // call site below). Admin-only, same rule as everywhere else on this page
  // (2026-09-19, Matt's call: "CREATE SEASON and END SEASON... only appear
  // to admins" -- moved here from the Admin > Data Management panel,
  // right-aligned "just below" the Seasons title, same shape as the Add
  // Track/Add Car button that sits right above the list in those Data
  // Management popups).
  //
  // Resume/Clear Season Draft removed entirely (2026-09-19, Matt's call:
  // "get rid of the SAVE DRAFT functionality... and get rid of the button
  // that appears if a draft saves") -- the wizard no longer persists a
  // localStorage draft (see openSeasonWizard), so Create a Season always
  // shows the same label and there's never a second button to clear.
  function buildSeasonsPanel(seasons, racesBySeasonId, token, reload, showCreateButton) {
    var panel = el('div', 'rc-panel rc-dash-card');
    panel.appendChild(el('h3', 'rc-dash-card-title', 'Seasons'));

    if (showCreateButton) {
      var row = el('div', 'display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin-bottom:14px;');

      // Create a Season disables once any season exists that hasn't been
      // Completed yet (2026-09-19, Matt's call: "disable the CREATE A
      // SEASON button if a season is already in progress and hasn't been
      // officially 'ended' with the END SEASON button") -- only one season
      // should ever be live at a time; End Season (below) is what frees
      // this back up.
      var hasOpenSeason = (seasons || []).some(function (s) { return s.status !== 'Completed'; });
      var createBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Create a Season');
      createBtn.type = 'button';
      if (hasOpenSeason) {
        createBtn.disabled = true;
        withTooltip(createBtn, 'End the current season before creating a new one.');
      } else {
        createBtn.addEventListener('click', function () { openSeasonWizardWithLoad(); });
      }
      row.appendChild(createBtn);

      // End Season -- moved here from the Admin > Data Management row
      // (2026-09-19, same "Create/End Season live with the season list
      // they act on" reasoning) -- no single season already in hand here
      // any more than Data Management had, so this still opens the
      // season-picker popup first (openEndSeasonModal), chaining into the
      // same typed "END SEASON" confirmation before anything happens.
      var endSeasonBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'End Season');
      endSeasonBtn.type = 'button';
      endSeasonBtn.addEventListener('click', function () { openEndSeasonModal(token, reload); });
      row.appendChild(endSeasonBtn);

      // The standalone Edit Season button is gone (2026-08-30) -- editing
      // now happens per-row in the season list below, which can point at
      // ANY season instead of always whichever one is most recent.

      panel.appendChild(row);
    }

    // The season list gets its own bordered box, separate from the button
    // row above it (2026-08-30, Matt's call: "add a border around the
    // season list like every other data management list popup -- the add
    // [season] button sits outside of the box on top") -- same shape as
    // Members/Tracks/Cars/Sponsors, where each one's own Add button sits
    // in the modal above a bordered .rc-panel holding just the list.
    var listBox = el('div', 'rc-panel');
    listBox.appendChild(buildSeasonsListFragment(seasons, racesBySeasonId, token, reload));
    panel.appendChild(listBox);

    return panel;
  }

  // ---------------------------------------------------------------------
  // STEWARDING (2026-09-19) -- Steward's own page, separate from League
  // Tools (Admin/Organizer only). A running list of every round that has
  // at least one filed protest, most recently raced round first, grouped
  // so a Steward gets the round's own context (season, track, whether
  // it's already finalized) alongside each protest. Read-only for now --
  // Matt's call: "It's just a page with a running list of protests for
  // now. Eventually a UPHOLD and REJECT system will be implemented...
  // But not building that right now." Ruling on a protest still only
  // happens from League Tools' Edit & Finalize popup (Admin/Organizer/
  // Steward, enforced server-side either way).
  function renderStewardingSection(token) {
    var section = document.getElementById('rc-section-stewarding');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(buildPageSpinner('Loading protests...'));

    return fetchApi('getStewardingFeed', { token: token }).then(function (data) {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Stewarding'));

      if (!data || !data.success) {
        section.appendChild(el('p', 'color:var(--rc-red);', 'Could not load protests right now.'));
        return;
      }
      if (!data.rounds || !data.rounds.length) {
        section.appendChild(buildEmptyStatePanel('No Protests Filed', 'Nothing here yet -- protests filed against a round will show up here for review.'));
        return;
      }

      data.rounds.forEach(function (r) {
        var panel = el('div', 'rc-panel rc-dash-card');
        panel.style.cssText = 'margin-bottom:16px;';

        var headerRow = el('div', 'display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;');
        var titleWrap = el('div');
        var titleText = (r.seasonName ? r.seasonName + ' -- ' : '') + (r.eventName || ('Round ' + r.roundNumber));
        titleWrap.appendChild(el('h3', 'rc-dash-card-title', escapeHtml(titleText)));
        var metaParts = [];
        if (r.track) metaParts.push(r.track);
        if (r.startUtc) metaParts.push(formatRaceDateTime(r.startUtc, ''));
        titleWrap.appendChild(el('div', 'rc-hint', escapeHtml(metaParts.join(' · '))));
        headerRow.appendChild(titleWrap);

        var badgeWrap = el('div', 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;');
        if (r.pendingCount) {
          badgeWrap.appendChild(el('span', 'rc-badge-chip rc-badge-race-noresults', r.pendingCount + ' Pending'));
        }
        if (r.resultsFinalized) {
          badgeWrap.appendChild(el('span', 'rc-badge-chip rc-badge-status-completed', 'Finalized'));
        }
        headerRow.appendChild(badgeWrap);
        panel.appendChild(headerRow);

        r.protests.forEach(function (p) {
          var row = el('div', 'rc-panel');
          row.style.cssText = 'margin-top:10px;';
          row.appendChild(el('div', 'rc-dm-row-label', escapeHtml((p.involvedNames || []).join(', '))));
          row.appendChild(el('div', 'rc-hint', escapeHtml(p.infractionType) + ' -- Lap ' + escapeHtml(String(p.lapNumber || '')) + (p.description ? (' -- "' + escapeHtml(p.description) + '"') : '')));
          var outcome = el('div', 'rc-hint');
          outcome.style.cssText = 'margin-top:6px;';
          outcome.textContent = p.status === 'Pending'
            ? 'Pending review'
            : p.status + (p.status === 'Upheld' ? (' -- Tier ' + p.penaltyTier) : '') + (p.reviewedByName ? (' -- ruled by ' + p.reviewedByName) : '');
          row.appendChild(outcome);
          panel.appendChild(row);
        });

        section.appendChild(panel);
      });
    }).catch(function () {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Stewarding'));
      section.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server.'));
    });
  }

  function renderLeagueManagementSection(token) {
    var section = document.getElementById('rc-section-league');
    if (!section) return;
    section.innerHTML = '';

    // No "League Management" heading while loading, and buildPageSpinner
    // (not the bare buildSpinner) for the wait itself -- Matt's standing
    // call: every full-section loading state across the Account pages sits
    // at the exact same vertical height as the initial #rc-loading screen,
    // which has no heading above it either (see renderCalendarSection for
    // the same pattern). Nothing else renders until the season list has
    // actually loaded (Matt's 2026-08-30 call) -- no flash of buttons
    // appearing before the list underneath them is ready.
    section.appendChild(buildPageSpinner('Loading league tools...'));

    fetchApi('adminListSeasons', { token: token }).then(function (data) {
      if (!data.success) {
        section.innerHTML = '';
        section.appendChild(el('h2', 'margin-top:0;', 'League Tools'));
        section.appendChild(el('p', 'color:var(--rc-red);', 'Could not load seasons.'));
        return;
      }
      var seasons = data.seasons || [];
      // Every season's races load NOW, all in parallel, alongside the
      // season list itself (2026-09-07, Matt's call: "don't make me load
      // the races for the season AFTER the page has already loaded... have
      // everything loaded so I can click and it instantly pulls up the
      // races below") -- so by the time a row's Races toggle is actually
      // clicked, there's no fetch left to do, just showing/hiding DOM
      // that's already built. A season whose races call fails gets an
      // empty array rather than blocking the rest of the page.
      var racesPromise = Promise.all(seasons.map(function (s) {
        return fetchApi('adminGetSeasonRaces', { token: token, params: { seasonId: s.seasonId } })
          .then(function (r) { return (r && r.success) ? (r.races || []) : []; })
          .catch(function () { return []; });
      }));
      // League News loads alongside the season/races data (2026-09-18) so
      // the whole League Tools page is ready in one pass, same "load it
      // all up front" rule the races-per-season fetch above already
      // follows.
      var newsPromise = fetchApi('adminListNews', { token: token })
        .then(function (r) { return (r && r.success) ? (r.news || []) : []; })
        .catch(function () { return []; });

      Promise.all([racesPromise, newsPromise]).then(function (results) {
        var racesPerSeason = results[0];
        var newsRows = results[1];
        var racesBySeasonId = {};
        seasons.forEach(function (s, i) { racesBySeasonId[s.seasonId] = racesPerSeason[i]; });

        section.innerHTML = '';
        section.appendChild(el('h2', 'margin-top:0;', 'League Tools'));
        section.appendChild(buildSeasonsPanel(seasons, racesBySeasonId, token, function () { renderLeagueManagementSection(token); }, !!(currentProfile && currentProfile.role === 'Admin')));
        section.appendChild(buildLeagueNewsPanel(newsRows, token, function () { renderLeagueManagementSection(token); }));
      });
    }).catch(function () {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'League Tools'));
      section.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server.'));
    });
  }

  // ---------------------------------------------------------------------
  // CALENDAR (2026-08-29) -- visual design restored verbatim from the
  // pre-v0.5 archive (commit ab231e0: withTooltip/calStat/weatherIcon/
  // formatRaceDateTime/formatByeDate/formatPointsList/raceCard/
  // seasonDetailsPanel), but every data source is real now instead of the
  // old CALENDAR_MOCK_SEASON -- see handleGetSeasonCalendar (DataCache.gs)
  // for how Rounds + seasonDetails.specialEvents + seasonDetails.
  // byeWeekDates get merged into one chronological list server-side.
  // Fetches fresh every time the link is clicked (same pattern as Data/
  // League Management) -- Matt's "no loaders, ever" rule was specifically
  // about the Dashboard's own cards, not every section site-wide.
  // ---------------------------------------------------------------------

  // Same tooltip pattern as the wizard's Car Objectives checkboxes (.rc-
  // tooltip class + data-tooltip attribute, shown via the shared
  // rcShowTooltipBubble() system) -- there was no shared helper for it
  // before Calendar needed one in several places.
  function withTooltip(el_, text) {
    el_.classList.add('rc-tooltip');
    el_.setAttribute('data-tooltip', text);
    return el_;
  }

  function calStat(iconSvg, text, tooltip, extraClass) {
    var chip = el('span', 'rc-cal-stat' + (extraClass ? ' ' + extraClass : ''), iconSvg + '<span>' + escapeHtml(text) + '</span>');
    if (tooltip) withTooltip(chip, tooltip);
    return chip;
  }

  // 5-tier icon by rain chance -- clear/no-rain shows sun (or a partly-
  // cloudy variant if the round's Weather is set to "Cloudy" with 0% rain),
  // then cloud/rain/heavy-rain as the percentage climbs.
  function weatherIcon(race) {
    var rc = race.chanceOfRain || 0;
    if (rc <= 0) return (race.weather === 'Cloudy') ? ICON_CLOUD_PARTLY : ICON_SUN;
    if (rc <= 25) return ICON_CLOUD;
    if (rc <= 75) return ICON_RAIN;
    return ICON_RAIN_HEAVY;
  }

  function formatRaceDateTime(iso, tz) {
    if (!iso) return 'Date/time not set';
    try {
      var d = new Date(iso);
      var opts = { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' };
      if (tz) opts.timeZone = tz;
      return d.toLocaleString('en-US', opts);
    } catch (err) { return iso; }
  }

  function formatByeDate(iso, tz) {
    if (!iso) return 'Date not set';
    try {
      var d = new Date(iso);
      var opts = { weekday: 'short', month: 'short', day: 'numeric' };
      if (tz) opts.timeZone = tz;
      return d.toLocaleString('en-US', opts);
    } catch (err) { return iso; }
  }

  function formatPointsList(points) {
    return (points || []).map(function (p, i) { return 'P' + (i + 1) + ' ' + p; }).join(' · ');
  }

  // Class pills row -- built once, reused wherever a season's classes need
  // to show as a row of pills. Moved into the Calendar page's own season
  // header (2026-09-19, top-right corner, same treatment as a Dashboard
  // card's corner figure) rather than living inside Season Settings.
  // Returns null when the season has no classes selected, so callers can
  // skip appending it.
  function buildClassPillsRow(classes) {
    var classKeys = Object.keys(classes || {}).filter(function (k) { return classes[k]; });
    if (!classKeys.length) return null;
    var classesRow = el('div', 'rc-cal-classes');
    classKeys.forEach(function (k) {
      var colorVar = (typeof CAR_CLASS_BADGE_COLOR_VAR !== 'undefined' && CAR_CLASS_BADGE_COLOR_VAR[k]) ? CAR_CLASS_BADGE_COLOR_VAR[k] : '--rc-steel';
      var pill = el('span', 'rc-cal-class-pill', escapeHtml(_rcClassPillLabel(k)));
      pill.style.background = 'var(' + colorVar + ')';
      classesRow.appendChild(pill);
    });
    return classesRow;
  }

  // Season-wide settings panel -- server password, race day/frequency,
  // drop weeks, track limits, qualifying privacy, and the per-tier
  // (Sprint/Medium/Long) duration + points-list chips. Class pills used to
  // live here too -- moved to the season header row instead, 2026-09-19
  // (see buildClassPillsRow above). Every field here comes straight off
  // handleGetSeasonCalendar's seasonDetails subset (a trimmed copy of
  // Seasons.SeasonDetails).
  function seasonDetailsPanel(details) {
    var wrap = el('div', 'rc-cal-season-details');
    wrap.appendChild(el('h4', 'rc-cal-season-details-title', 'Season Settings'));

    // Class pills moved out of this panel entirely (2026-09-19, Matt's
    // call: "move the class pills to the top right of the container,
    // similar to how some cards on the dash have text or pills in the
    // right corner") -- see buildClassPillsRow below, now built into the
    // season header row instead (renderCalendarSection).

    var stats = el('div', 'rc-cal-stats');
    if (details.defaultPassword) {
      stats.appendChild(calStat(ICON_UNLOCK, 'Password Set', 'Server password: ' + details.defaultPassword));
    } else {
      stats.appendChild(calStat(ICON_UNLOCK, 'No Password', 'Server has no default password.'));
    }
    if (details.frequency) stats.appendChild(calStat(ICON_CLOCK, details.frequency, 'Race frequency'));
    stats.appendChild(calStat(ICON_FLAG, (details.dropWeeks || 0) + ' Drop Week' + (details.dropWeeks === 1 ? '' : 's'), 'Worst results dropped from the standings'));
    if (details.trackLimitsPreset) stats.appendChild(calStat(ICON_TRACK, details.trackLimitsPreset + ' Track Limits', 'Track limits enforcement preset'));
    stats.appendChild(calStat(ICON_FLAG, details.privateQualifying === 'Yes' ? 'Private Qualifying' : 'Public Qualifying', 'Qualifying session visibility'));
    wrap.appendChild(stats);

    var tierStats = el('div', 'rc-cal-stats');
    // Practice/Qualifying session LENGTH -- season-wide (seasonDetails.
    // raceSettings.practiceLengthMin/qualifyLengthMin, set once in the
    // wizard's Race Settings step). Sits BEFORE the Sprint/Medium/Long
    // race-length chips below, same row (Matt's call, 2026-08-30) -- NOT
    // the per-round in-game start times, which stay on each race card in
    // the list below.
    var raceSettingsForLengths = details.raceSettings || {};
    if (raceSettingsForLengths.practiceLengthMin) {
      tierStats.appendChild(calStat(ICON_CLOCK, 'Practice · ' + raceSettingsForLengths.practiceLengthMin + ' min', 'Practice session length (season-wide)'));
    }
    if (raceSettingsForLengths.qualifyLengthMin) {
      // rc-cal-stat-gap-after -- extra breathing room between this chip and
      // the Sprint/Medium/Long race-length chips that follow (2026-08-30,
      // Matt's call: "add a larger space between QUALIFY and SPRINT
      // length"), marking the boundary between the season-wide
      // Practice/Qualifying lengths and the per-tier race lengths without
      // widening every gap in the row via .rc-cal-stats' own gap.
      tierStats.appendChild(calStat(ICON_CLOCK, 'Qualifying · ' + raceSettingsForLengths.qualifyLengthMin + ' min', 'Qualifying session length (season-wide)', 'rc-cal-stat-gap-after'));
    }
    var tiers = ['Sprint', 'Medium', 'Long'];
    tiers.forEach(function (tier) {
      var table = (details.pointsTables || {})[tier];
      if (!table) return;
      tierStats.appendChild(calStat(ICON_CLOCK, tier + ' · ' + (table.duration || 0) + ' min', formatPointsList(table.points)));
    });
    if (tierStats.children.length) wrap.appendChild(tierStats);

    return wrap;
  }

  // One race/special-event/bye card. `entry` is one item from
  // handleGetSeasonCalendar's merged `races` array (kind: 'round' |
  // 'special' | 'bye'). driverTz is read once via Intl in the browser --
  // no need to round-trip it through the backend. raceSettings is the
  // season-wide block (fuel/tire multipliers etc.) -- Matt's call: those
  // don't vary race to race, but show on every card anyway for quick
  // reference rather than making the driver flip back to Season Settings.
  function raceCard(entry, driverTz, raceSettings) {
    if (entry.kind === 'bye') {
      var byeCard = el('div', 'rc-cal-bye', 'Bye Week');
      byeCard.appendChild(el('span', 'rc-cal-bye-date', formatByeDate(entry.startUtc, driverTz)));
      return byeCard;
    }

    var isSpecial = entry.kind === 'special';
    var card = el('div', 'rc-cal-race' +
      (entry.finished ? ' rc-cal-finished' : '') +
      (isSpecial ? ' rc-cal-race-special' : ''));

    // Round number bar, left edge of the card (2026-09-09, Matt's call) --
    // a full-height gray bar with the round number in white, replacing
    // the old giant faded number. Special Events and bye weeks don't
    // consume a round number, so they don't get this column at all --
    // their body/image start flush left.
    if (!isSpecial && entry.roundNum) {
      card.appendChild(el('div', 'rc-cal-round-number', String(entry.roundNum)));
    }

    // Everything except the track image lives in this column -- .rc-cal-race
    // is a flex row (round number + card body + track image aside) so the
    // image can sit to the right at a fixed max size regardless of how
    // tall the text side gets.
    var body = el('div', 'rc-cal-race-body');

    var head = el('div', 'rc-cal-race-head');
    var nameWrap = el('div', 'rc-cal-race-name');
    nameWrap.appendChild(document.createTextNode(entry.eventName || (isSpecial ? 'Special Event' : ('Round ' + entry.roundNum))));
    if (isSpecial) nameWrap.appendChild(withTooltip(el('span', 'rc-cal-race-star', ICON_NAV_STAR), 'Special Event -- fun race, no championship points.'));
    head.appendChild(nameWrap);
    body.appendChild(head);

    var trackLine = el('div', 'rc-cal-track');
    trackLine.innerHTML = '<strong>' + escapeHtml(entry.track || '(no track)') + '</strong>' +
      (entry.layout ? ' <span class="rc-cal-layout">· ' + escapeHtml(entry.layout) + '</span>' : '');
    body.appendChild(trackLine);

    var datetime = el('div', 'rc-cal-datetime');
    var dtSpan = el('span', null, ICON_CLOCK + '<span>' + escapeHtml(formatRaceDateTime(entry.startUtc, driverTz)) + '</span>');
    datetime.appendChild(dtSpan);
    // In-Game Race Start, Practice, and Qualifying all live on this one
    // line now (Matt's call, 2026-08-30 -- Practice/Qualifying used to get
    // their own row below) -- Practice/Qualifying trail the Race Start
    // time in muted gray text so Race Start still reads as the primary
    // figure at a glance.
    if (entry.igRaceStart) {
      var igExtras = [];
      if (entry.igPracticeStart) igExtras.push('Practice ' + escapeHtml(entry.igPracticeStart));
      if (entry.igQualifyStart) igExtras.push('Qualifying ' + escapeHtml(entry.igQualifyStart));
      var igText = 'In-Game Race Start ' + escapeHtml(entry.igRaceStart);
      if (igExtras.length) igText += ' <span class="rc-cal-igtimes-extra">(' + igExtras.join(' &middot; ') + ')</span>';
      var igSpan = el('span', null, ICON_FLAG + '<span>' + igText + '</span>');
      datetime.appendChild(igSpan);
    }
    body.appendChild(datetime);

    var stats = el('div', 'rc-cal-stats');
    stats.appendChild(calStat(weatherIcon(entry), (entry.chanceOfRain || 0) + '% Rain' + (entry.temperatureC !== null && entry.temperatureC !== undefined ? ' · ' + entry.temperatureC + '°C' : ''), 'Weather'));
    if (entry.passwordOverride) stats.appendChild(calStat(ICON_UNLOCK, 'Password Override', 'This round overrides the season default password: ' + entry.passwordOverride));
    if (isSpecial) {
      // Prize Pool stat removed entirely 2026-09-18 -- Matt's call: Special
      // Events are just fun races now, no money/prize payouts. See
      // season-1-mvp-scope.md.
    } else if (entry.raceLengthMinutes) {
      // Minutes, not the Sprint/Medium/Long tier label (2026-09-19,
      // Matt's call: "instead of labeling race length with sprint medium
      // or long, display length in mins").
      stats.appendChild(calStat(ICON_CLOCK, entry.raceLengthMinutes + ' min', 'Race length'));
    }
    // Fuel/tire wear are season-wide settings (Seasons.SeasonDetails.
    // raceSettings), not per-round -- shown on every card next to length
    // (Matt's call) rather than only in the Season Settings panel above.
    if (raceSettings && raceSettings.fuelMultiplier) {
      stats.appendChild(calStat(ICON_FUEL, raceSettings.fuelMultiplier + ' Fuel', 'Fuel consumption multiplier (season-wide)'));
    }
    if (raceSettings && raceSettings.tireWearMultiplier) {
      stats.appendChild(calStat(ICON_TIRE, raceSettings.tireWearMultiplier + ' Tire Wear', 'Tire wear rate multiplier (season-wide)'));
    }
    // Setup Rules pill (2026-09-19, Matt's call: "put the FIXED or OPEN
    // setup pills with each race's container") -- season-wide like Fuel/
    // Tire Wear above (raceSettings.setupRules, set once in the wizard's
    // Race Settings step), shown on every race card rather than only once
    // in the Season Settings summary.
    if (raceSettings && raceSettings.setupRules) {
      stats.appendChild(calStat(ICON_SETTINGS, raceSettings.setupRules + ' Setups', 'Whether car setups are locked (Fixed) or free to change (Open), season-wide'));
    }
    body.appendChild(stats);

    card.appendChild(body);

    // Track image, right side of the card -- assets/images/tracks/{TrackID}.png,
    // capped at 250px either dimension via CSS (object-fit:contain keeps
    // the image's own aspect ratio inside that box). Special Events have
    // no TrackID (they pick a track by name only, not a Tracks row), so
    // there's nothing to build a URL from -- same "silently no image"
    // outcome as a round whose track image just hasn't been uploaded yet.
    if (entry.trackId) {
      var trackImg = document.createElement('img');
      trackImg.className = 'rc-cal-track-img';
      trackImg.src = trackImageSrc(entry.trackId);
      trackImg.alt = entry.track || '';
      trackImg.onerror = function () { trackImg.style.display = 'none'; };
      card.appendChild(trackImg);
    }

    // Gray semi-transparent overlay + large bold "EVENT COMPLETED" label
    // once a round/special event's start time has passed (Matt's call) --
    // covers the whole card rather than the old faded-background + small
    // pill treatment. 2026-09-07: the label itself now says whether
    // results have actually been imported yet for a real Round (isSpecial
    // and bye entries have no RoundID to check against, so they only ever
    // get the plain label) -- hasResults comes straight off the same
    // entries _rcBuildActiveSeasonCalendar_ builds for League Management's
    // per-race Add Results/Delete buttons, so this can never disagree with
    // what an Admin sees there. 2026-09-08: a third state -- once results
    // are posted AND the round has been finalized (League Management's
    // Finalize button, adminFinalizeRound/resultsFinalized -- same field
    // the round entry already carries), the label says so explicitly
    // rather than staying at the generic "Results Posted" forever.
    if (entry.finished) {
      var completedLabel = 'Event Completed';
      if (!isSpecial) {
        if (!entry.hasResults) {
          completedLabel += ' (No Results Posted Yet)';
        } else if (entry.resultsFinalized) {
          completedLabel += ' (Results Posted and Finalized)';
        } else {
          completedLabel += ' (Results Posted)';
        }
      }
      card.appendChild(el('div', 'rc-cal-completed-overlay', completedLabel));
    }

    return card;
  }

  function renderCalendarSection(token) {
    var section = document.getElementById('rc-section-calendar');
    if (!section) return;
    section.innerHTML = '';
    // No "Calendar" heading while loading -- Matt's call: every full-
    // section loading state should sit at the exact same vertical height
    // as the initial #rc-loading screen, which has no heading above it
    // either. The heading only appears once real content replaces this.
    section.appendChild(buildPageSpinner('Loading your calendar...'));

    // `return`ed (2026-09-08), same reason as renderFinancesSection above.
    return fetchApi('getSeasonCalendar', { token: token }).then(function (res) {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Calendar'));

      if (!res || !res.success) {
        section.appendChild(el('p', 'color:var(--rc-steel);', 'Could not load the season calendar right now.'));
        return;
      }
      if (!res.hasSeason) {
        section.appendChild(buildEmptyStatePanel('No Data To Display', 'The calendar fills in once a season is open.'));
        return;
      }

      var driverTz = '';
      try { driverTz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (err) { driverTz = ''; }

      // rc-dash-card gives the whole calendar container the same chrome as
      // the Dashboard cards (Matt's call): the checkered corner, the red
      // "finish flag" top accent, and a slightly heavier drop shadow.
      var panel = el('div', 'rc-panel rc-cal-season rc-dash-card');
      var head = el('div', 'rc-cal-season-head');
      // "Season N: <name>" -- see seasonNumberLabel() above.
      var seasonNumLabel = seasonNumberLabel(res.seasonId);
      head.appendChild(el('h3', 'rc-cal-season-title', (seasonNumLabel ? 'Season ' + seasonNumLabel + ': ' : '') + res.seasonName));
      // Class pills, top-right of the header (2026-09-19, Matt's call:
      // "move the class pills to the top right of the container, similar
      // to how some cards on the dash have text or pills in the right
      // corner") -- same corner-figure idea as Current Seat's car number/
      // Next Race's round number, just a row of pills instead of text.
      var classPillsRow = buildClassPillsRow((res.seasonDetails || {}).classes);
      if (classPillsRow) head.appendChild(classPillsRow);
      panel.appendChild(head);

      panel.appendChild(seasonDetailsPanel(res.seasonDetails || {}));

      var list = el('div', 'rc-cal-race-list');
      var raceSettings = (res.seasonDetails || {}).raceSettings || {};
      (res.races || []).forEach(function (entry) { list.appendChild(raceCard(entry, driverTz, raceSettings)); });
      panel.appendChild(list);

      section.appendChild(panel);
    }).catch(function () {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Calendar'));
      section.appendChild(el('p', 'color:var(--rc-steel);', 'Could not load the season calendar right now.'));
    });
  }

  // =======================================================================
  // RESULTS (2026-09-07) -- the comprehensive breakdown the Dashboard's
  // Recent Results card links out to ("← View all results" instead of a
  // truncated "+n more" per column). Every completed, results-posted round
  // in the current season, most recent first, each with its FULL finishing
  // order (not capped to top-5/3-classes the way the Dashboard preview is)
  // plus this driver's own detailed line for that round -- reuses the same
  // .rc-recent-results-* row/column CSS the Dashboard card already
  // established, just with the caps lifted, so a driver never sees the
  // dashboard and this page disagree about a result.
  // -----------------------------------------------------------------------
  // Small labeled number for the race-conditions/headline strip below
  // (2026-09-07, Matt's call: "a plethora of numbers and stats") -- one
  // <div> per stat, label above value, so the strip reads at a glance
  // without needing a legend.
  function resultsStatBlock(label, value) {
    if (value === null || value === undefined || value === '') return null;
    var block = el('div', 'rc-results-stat');
    block.appendChild(el('div', 'rc-results-stat-label', escapeHtml(label)));
    block.appendChild(el('div', 'rc-results-stat-value', escapeHtml(String(value))));
    return block;
  }

  // Full race classification time, in M:SS.sss motorsport shape, with an
  // H:MM:SS.sss fallback since a whole race's elapsed time can genuinely
  // run past an hour on a longer endurance round (2026-09-09, Matt's
  // call: "add a total time column after fastest lap column" on the
  // Results page's per-class table).
  function _rcFormatTotalTime_(sec) {
    if (sec === null || sec === undefined || isNaN(sec)) return '';
    var abs = Math.abs(sec);
    var h = Math.floor(abs / 3600);
    var m = Math.floor((abs - h * 3600) / 60);
    var s = abs - h * 3600 - m * 60;
    if (h > 0) {
      return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s.toFixed(3);
    }
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3);
  }

  function _rcIsDnfRow_(row) {
    return !!row && /DNF|DSQ|Disqualif/i.test(row.finishStatus || '');
  }

  // Your own race summary -- position/grid/laps/best lap/total time/
  // points/pit stops/incidents-track limits-penalties, plus the pole/
  // fastest-lap/most-laps-led/clean-race callouts. Replaces the old
  // per-class all-drivers table entirely (2026-09-19, Matt's call: "the
  // RESULTS link ... should only show the player's results ... we don't
  // need a leaderboard or extra fluff in there").
  function resultsYourSummary(you) {
    var wrap = el('div', 'rc-results-you-summary');
    if (!you) {
      wrap.appendChild(el('p', 'rc-hint', 'No result recorded for you in this race.'));
      return wrap;
    }
    var grid = el('div', 'rc-results-stat-strip');
    [
      resultsStatBlock('Finish', you.position ? ('P' + you.position + (you.classPosition ? ' (Class P' + you.classPosition + ')' : '')) : (you.finishStatus || 'Not Classified')),
      resultsStatBlock('Grid', you.gridPos ? ('P' + you.gridPos + (you.classGridPos ? ' (Class P' + you.classGridPos + ')' : '')) : ''),
      resultsStatBlock('Laps', you.laps),
      resultsStatBlock('Best Lap', you.bestLapTime ? _rcFormatTotalTime_(parseFloat(you.bestLapTime)) : ''),
      resultsStatBlock('Total Time', (you.finishTimeSeconds !== null && you.finishTimeSeconds !== undefined) ? _rcFormatTotalTime_(you.finishTimeSeconds) : ''),
      resultsStatBlock('Points', you.points === null ? '' : you.points),
      resultsStatBlock('Pit Stops', you.pitstops),
      resultsStatBlock('Incidents / Track Limits / Penalties', (you.incidentsCount || 0) + ' / ' + (you.trackLimitsCount || 0) + ' / ' + (you.penaltiesCount || 0)),
      resultsStatBlock('DNF Reason', you.dnfReason)
    ].forEach(function (block) { if (block) grid.appendChild(block); });
    wrap.appendChild(grid);

    var badgeBits = [];
    if (you.wonPole) badgeBits.push('Pole');
    if (you.wonFastestLap) badgeBits.push('Fastest Lap');
    if (you.wonMostLapsLed) badgeBits.push('Most Laps Led');
    if (you.isCleanRace) badgeBits.push('Clean Race');
    if (badgeBits.length) wrap.appendChild(el('p', 'rc-hint', badgeBits.join(' · ')));
    return wrap;
  }

  // One line of readable text per RaceEvents row, keyed off EventType --
  // matches the exact Detail shapes Ingestion.gs writes (see that file's
  // EventType comment). Falls back to just the raw event type name for
  // anything unrecognized rather than hiding the row.
  function _rcFormatEventLine_(evt) {
    var d = evt.detail || {};
    switch (evt.eventType) {
      case 'Incident':
        return 'Incident' + (d.ContactWith ? ' -- contact with ' + d.ContactWith : '') + (d.SeverityValue ? ' (severity ' + d.SeverityValue + ')' : '');
      case 'TrackLimit':
        return 'Track Limit' + (d.Outcome ? ' -- ' + d.Outcome : '') + (d.CurrentPoints !== undefined ? ' (points: ' + d.CurrentPoints + ')' : '');
      case 'SimPenaltyIssued':
        return 'Penalty Issued' + (d.PenaltyType ? ' -- ' + d.PenaltyType : '') + (d.Reason ? ' (' + d.Reason + ')' : '') +
          (d.TimeSeconds ? ', ' + d.TimeSeconds + 's' : '') + (d.LapsPenalty ? ', ' + d.LapsPenalty + ' lap(s)' : '');
      case 'SimPenaltyServed':
        return 'Penalty Served' + (d.PenaltyType ? ' -- ' + d.PenaltyType : '');
      case 'Sector':
        return d.Kind === 'BestSector' ? ('Best Sector ' + (d.SectorIndex || '') + (d.Class ? ' (' + d.Class + ')' : '')) : 'Suspension Damage';
      default:
        return evt.eventType || 'Event';
    }
  }

  // Full unfiltered lap-by-lap + RaceEvents breakdown, one container per
  // session this driver actually has laps/events for (Practice/Qualify/
  // Race, whichever the round's own Sessions rows cover) -- "everything
  // the XML captured for this driver, unfiltered" (Matt's call).
  // Horizontally scrollable on its own container, same as every other
  // wide table on this page, so a narrow screen never forces the whole
  // page to scroll sideways.
  function resultsSessionsDetail(sessions) {
    var wrap = el('div', 'rc-results-sessions');
    (sessions || []).forEach(function (session) {
      if ((!session.laps || !session.laps.length) && (!session.events || !session.events.length)) return;

      var sessionPanel = el('div', 'rc-results-session');
      var label = (session.sessionType || 'Session') + (session.trackVenue ? ' · ' + session.trackVenue : '');
      sessionPanel.appendChild(el('div', 'rc-results-session-title', escapeHtml(label)));

      if (session.laps && session.laps.length) {
        var scrollWrap = el('div', 'rc-results-table-wrap');
        var table = document.createElement('table');
        table.className = 'rc-results-table rc-results-laps-table';
        var thead = document.createElement('thead');
        var headRow = document.createElement('tr');
        ['Lap', 'Pos', 'Lap Time', 'S1', 'S2', 'S3', 'Top Speed', 'Fuel', 'Fuel Used', 'VE', 'VE Used', 'Tire FL', 'Tire FR', 'Tire RL', 'Tire RR', 'Compound F', 'Compound R'].forEach(function (h) {
          var th = document.createElement('th');
          th.textContent = h;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        var tbody = document.createElement('tbody');
        session.laps.forEach(function (l) {
          var tr = document.createElement('tr');
          function td(v) {
            var c = document.createElement('td');
            c.textContent = (v === null || v === undefined || v === '') ? '—' : String(v);
            tr.appendChild(c);
          }
          td(l.lapNum); td(l.positionAtLap);
          td(l.lapTime); td(l.sector1); td(l.sector2); td(l.sector3);
          td(l.topSpeed); td(l.fuel); td(l.fuelUsed); td(l.ve); td(l.veUsed);
          td(l.tireWearFL); td(l.tireWearFR); td(l.tireWearRL); td(l.tireWearRR);
          td(l.frontCompound || [l.compoundFL, l.compoundFR].filter(Boolean).join('/'));
          td(l.rearCompound || [l.compoundRL, l.compoundRR].filter(Boolean).join('/'));
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        scrollWrap.appendChild(table);
        sessionPanel.appendChild(scrollWrap);
      }

      if (session.events && session.events.length) {
        var eventsList = el('div', 'rc-results-events-list');
        session.events.forEach(function (evt) {
          var line = el('div', 'rc-results-event-line');
          line.appendChild(el('span', 'rc-results-event-lap', evt.lapNum ? ('Lap ' + evt.lapNum) : (evt.elapsedTime || '')));
          line.appendChild(el('span', 'rc-results-event-text', escapeHtml(_rcFormatEventLine_(evt))));
          eventsList.appendChild(line);
        });
        sessionPanel.appendChild(eventsList);
      }

      wrap.appendChild(sessionPanel);
    });
    return wrap;
  }

  function resultsRoundPanel(race) {
    var you = race.you;
    var panel = el('div', 'rc-results-round');

    // Header is the round # + event name, track underneath as the
    // subheader (2026-09-08, Matt's call) -- the finishing-place corner
    // figure the Dashboard's Recent Results card shows is deliberately
    // NOT repeated here; this page's job is the comprehensive breakdown,
    // not a personal-highlight headline.
    panel.appendChild(el('h3', 'rc-results-round-title',
      (race.roundNum ? 'Round ' + race.roundNum + ': ' : '') + escapeHtml(race.eventName || race.track || 'Race')));
    if (race.track) panel.appendChild(el('div', 'rc-results-round-track', escapeHtml(race.track)));

    // Race-wide conditions/format + headline names (2026-09-07) -- winner/
    // pole/fastest lap of the whole event, track/weather/format numbers,
    // all pulled straight off DriverResults/Sessions/RoundDetails, nothing
    // guessed. Skips any stat this round's data doesn't actually have
    // (resultsStatBlock returns null and el() silently drops nulls below).
    var statStrip = el('div', 'rc-results-stat-strip');
    [
      resultsStatBlock('Winner', race.overallWinner),
      resultsStatBlock('Pole Sitter', race.overallPoleSitter),
      resultsStatBlock('Fastest Lap', race.overallFastestLapDriver ?
        (race.overallFastestLapDriver + (race.overallFastestLapTime ? ' (' + race.overallFastestLapTime + ')' : '')) : ''),
      resultsStatBlock('Finishers', race.totalFinishers),
      resultsStatBlock('Race Laps', race.totalLaps || race.mostLapsCompleted),
      resultsStatBlock('Race Length', race.raceLengthMinutes ? (race.raceLengthMinutes + ' min') : ''),
      resultsStatBlock('Track Length', race.trackLengthMeters ? (Math.round(race.trackLengthMeters) + ' m') : ''),
      resultsStatBlock('Weather', race.weather),
      resultsStatBlock('Chance of Rain', race.chanceOfRain ? (race.chanceOfRain + '%') : ''),
      resultsStatBlock('Temperature', (race.temperatureC !== null && race.temperatureC !== undefined) ? (race.temperatureC + '°C') : '')
    ].forEach(function (block) { if (block) statStrip.appendChild(block); });
    if (statStrip.childNodes.length) panel.appendChild(statStrip);

    // Your own line, then the full lap-by-lap + event breakdown -- this
    // container is only ever about this driver's own race now (2026-09-19
    // rewrite, Matt's call).
    panel.appendChild(resultsYourSummary(you));
    panel.appendChild(resultsSessionsDetail(race.sessions));

    return panel;
  }

  function renderResultsSection(token) {
    var section = document.getElementById('rc-section-results');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(buildPageSpinner('Loading your results...'));

    // `return`ed (2026-09-08), same reason as renderFinancesSection above.
    return fetchApi('getSeasonResults', { token: token }).then(function (res) {
      section.innerHTML = '';

      if (!res || !res.success) {
        section.appendChild(el('h2', 'margin-top:0;', 'Results'));
        section.appendChild(el('p', 'color:var(--rc-steel);', 'Could not load season results right now.'));
        return;
      }
      if (!res.hasSeason) {
        section.appendChild(el('h2', 'margin-top:0;', 'Results'));
        section.appendChild(buildEmptyStatePanel('No Data To Display', 'Results fill in once a season is underway.'));
        return;
      }

      section.appendChild(el('h2', 'margin-top:0;', 'Results'));

      // Explainer paragraph removed (2026-09-18, Matt's call: "remove any
      // descriptions from below the headers on the pages... we have a
      // help file for help on these sections and I want to keep it
      // clean") -- see renderHelpSection's Results entry instead.

      // One outer container for the whole page (2026-09-08, Matt's call),
      // same rc-dash-card chrome the Calendar page's season panel already
      // uses -- header is the season number + name, exactly like
      // Calendar's own season header, so the two pages read as one family.
      var panel = el('div', 'rc-panel rc-cal-season rc-dash-card');
      var head = el('div', 'rc-cal-season-head');
      var seasonNumLabel = seasonNumberLabel(res.seasonId);
      head.appendChild(el('h3', 'rc-cal-season-title', (seasonNumLabel ? 'Season ' + seasonNumLabel + ': ' : '') + escapeHtml(res.seasonName || '')));
      panel.appendChild(head);

      // No Leaderboard here anymore (2026-09-19, Matt's call: "We have a
      // League Hub page now so we don't need a leaderboard or extra fluff
      // in there") -- the public League Hub carries the whole-field
      // standings table now; this page is purely this driver's own races.
      var rounds = (res.rounds || []).slice().sort(function (a, b) {
        var at = a.startUtc ? new Date(a.startUtc).getTime() : 0;
        var bt = b.startUtc ? new Date(b.startUtc).getTime() : 0;
        return bt - at; // most recent first
      });

      if (rounds.length) {
        var list = el('div', 'rc-results-round-list');
        rounds.forEach(function (race) { list.appendChild(resultsRoundPanel(race)); });
        panel.appendChild(list);
      } else {
        panel.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'No results have been posted yet this season.'));
      }

      section.appendChild(panel);
    }).catch(function () {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Results'));
      section.appendChild(el('p', 'color:var(--rc-steel);', 'Could not load season results right now.'));
    });
  }

  // =======================================================================
  // PROTESTS (2026-09-08) -- the driver-facing Protest page. A submission
  // form (round -> lap/driver options populate from that round's own data,
  // infraction type, an optional 200-word description) above this driver's
  // own protest history (every one they've filed, newest first, with its
  // Pending/Upheld/Denied outcome). Filing a ruling on someone else's
  // protest happens from League Management's EDIT popup instead (Admin/
  // Organizer/Steward only) -- this page is purely "file one of your own,
  // see what happened to the ones you filed."
  function renderProtestsSection(token) {
    var section = document.getElementById('rc-section-protests');
    if (!section) return;
    section.innerHTML = '';
    section.appendChild(buildPageSpinner('Loading your protests...'));

    // `return`ed (2026-09-08), same reason as renderFinancesSection above.
    return Promise.all([
      fetchApi('getProtestFilingOptions', { token: token }),
      fetchApi('getMyProtests', { token: token, params: { limit: '10' } })
    ]).then(function (results) {
      var filing = results[0], mine = results[1];
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Protests'));
      // Both the lede paragraph and the "How to use this page" box that
      // used to sit here are gone (2026-09-18, Matt's call) -- see
      // renderHelpSection's Protests entry instead.

      if (!filing || !filing.success) {
        section.appendChild(el('p', 'color:var(--rc-steel);', 'Could not load the Protest page right now.'));
        return;
      }
      // Same "no season" empty state as Calendar/Results/Career
      // (2026-09-18, Matt's call: add Protests to that list) --
      // handleGetProtestFilingOptions already returns hasSeason:false
      // when there's no active season calendar, same signal Calendar and
      // Results already gate on.
      if (!filing.hasSeason) {
        section.appendChild(buildEmptyStatePanel('No Data To Display', 'Protests open up once a season is underway.'));
        return;
      }

      section.appendChild(buildProtestFormPanel(token, filing.rounds || [], filing.myProfileId, function () { renderProtestsSection(token); }));
      section.appendChild(buildMyProtestsHistoryPanel(token, mine && mine.success ? (mine.protests || []) : [], (mine && mine.totalCount) || 0, function () { renderProtestsSection(token); }));
    }).catch(function () {
      section.innerHTML = '';
      section.appendChild(el('h2', 'margin-top:0;', 'Protests'));
      section.appendChild(el('p', 'color:var(--rc-steel);', 'Could not reach the server.'));
    });
  }

  // 2026-09-08 rewrite (Matt's call): Race + Lap Number + Infraction Type
  // on one row, then three "Driver Involved" boxes on the row below --
  // box 1 always defaults to whoever's filing (so a driver naming no one
  // else, e.g. a self-report, still has a valid, non-blank box 1), boxes
  // 2/3 default to an unset "Choose Driver" placeholder and are entirely
  // optional. Only box 1 is ever required, and since it's always
  // pre-filled that's automatic -- nothing here can actually block a
  // submission over it. Same 3-equal-column .rc-wiz-field-row-3 grid for
  // both rows (style.css).
  function buildProtestFormPanel(token, rounds, myProfileId, onSubmitted) {
    var panel = el('div', 'rc-panel rc-dash-card');
    panel.appendChild(el('h3', 'rc-dash-card-title', 'File a Protest'));

    if (!rounds.length) {
      panel.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'There\'s nothing open to protest right now -- either no round you raced has posted results, or the 48-hour filing window has closed for all of them.'));
      return panel;
    }

    var roundSelect = document.createElement('select');
    rounds.forEach(function (r) {
      roundSelect.appendChild(new Option('Round ' + r.roundNumber + ': ' + (r.eventName || r.track || ''), r.roundId));
    });

    var lapSelect = document.createElement('select');
    var infractionSelect = document.createElement('select');
    PROTEST_INFRACTION_TYPES.forEach(function (t) { infractionSelect.appendChild(new Option(t, t)); });

    // Race/Lap row (2026-09-09, Matt's call: "make race dropdown box 50%
    // width and make lap number 25% width") -- reuses the same 4-column
    // .rc-wiz-field-row grid the Wager form's Opponent/Race/Condition/Stake
    // row already uses (see buildWagerForm above), with each field wrapper
    // claiming its own span (2 = half, 1 = quarter) rather than the fixed
    // 3-equal-column .rc-wiz-field-row-3 this row used before. The row's
    // 4th column is left unclaimed on purpose -- 50% + 25% is all the
    // width these two fields need.
    var raceFieldWrap = wizField('Race', roundSelect, null);
    raceFieldWrap.style.gridColumn = 'span 2';
    var lapFieldWrap = wizField('Lap Number', lapSelect, null);
    lapFieldWrap.style.gridColumn = 'span 1';
    var topRow = el('div', 'rc-wiz-field-row');
    topRow.appendChild(raceFieldWrap);
    topRow.appendChild(lapFieldWrap);
    panel.appendChild(topRow);

    var driver1Select = document.createElement('select');
    var driver2Select = document.createElement('select');
    var driver3Select = document.createElement('select');

    var driversRow = el('div', 'rc-wiz-field-row-3');
    driversRow.appendChild(wizField('Driver Involved 1', driver1Select, null));
    driversRow.appendChild(wizField('Driver Involved 2', driver2Select, null));
    driversRow.appendChild(wizField('Driver Involved 3', driver3Select, null));
    panel.appendChild(driversRow);

    // Infraction Type, moved to its own third row at 50% width (2026-09-09,
    // Matt's call: "Move infraction type box to the 3rd row and make it
    // 50% width") -- was in the Race/Lap row above, now on its own line.
    var infractionFieldWrap = wizField('Infraction Type', infractionSelect, null);
    infractionFieldWrap.style.gridColumn = 'span 2';
    var infractionRow = el('div', 'rc-wiz-field-row');
    infractionRow.appendChild(infractionFieldWrap);
    panel.appendChild(infractionRow);

    function populateForRound(roundId) {
      var round = rounds.filter(function (r) { return r.roundId === roundId; })[0];
      lapSelect.innerHTML = '';
      driver1Select.innerHTML = '';
      driver2Select.innerHTML = '';
      driver3Select.innerHTML = '';
      if (!round) return;
      round.laps.forEach(function (n) { lapSelect.appendChild(new Option('Lap ' + n, n)); });

      driver2Select.appendChild(new Option('Choose Driver', ''));
      driver3Select.appendChild(new Option('Choose Driver', ''));
      round.driverRoster.forEach(function (d) {
        var label = d.name + (d.carNumber ? (' (#' + d.carNumber + ')') : '');
        driver1Select.appendChild(new Option(label, d.profileId));
        driver2Select.appendChild(new Option(label, d.profileId));
        driver3Select.appendChild(new Option(label, d.profileId));
      });
      // Box 1 defaults to whoever's filing -- falls back to the first
      // roster entry only in the unlikely case the filer's own result
      // somehow isn't in this round's roster.
      if (myProfileId && round.driverRoster.some(function (d) { return d.profileId === myProfileId; })) {
        driver1Select.value = myProfileId;
      }
    }
    populateForRound(rounds[0].roundId);
    roundSelect.addEventListener('change', function () { populateForRound(roundSelect.value); });

    var descBox = document.createElement('textarea');
    descBox.rows = 4;
    descBox.maxLength = 2000;
    var descWrap = wizField('Description', descBox, null);
    descWrap.appendChild(el('div', 'rc-hint', '(Optional, 200 words or fewer)'));
    panel.appendChild(descWrap);

    var resultBox = el('div', 'rc-message');
    panel.appendChild(resultBox);

    var submitBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Submit Protest');
    submitBtn.type = 'button';
    submitBtn.addEventListener('click', function () {
      var words = descBox.value.trim().length ? descBox.value.trim().split(/\s+/).length : 0;
      if (words > 200) { showToast('Description must be 200 words or fewer.', 'error'); return; }
      submitBtn.disabled = true;
      resultBox.className = 'rc-message';
      resultBox.textContent = '';
      fetchApi('submitProtest', {
        method: 'POST', token: token, body: {
          roundId: roundSelect.value, infractionType: infractionSelect.value,
          lapNumber: lapSelect.value, againstProfileId: driver2Select.value,
          against2ProfileId: driver3Select.value, description: descBox.value.trim()
        }
      }).then(function (data) {
        submitBtn.disabled = false;
        if (!data.success) {
          resultBox.className = 'rc-message rc-error';
          resultBox.textContent = data.message || 'Could not submit that protest.';
          showToast(data.message || 'Could not submit that protest.', 'error');
          return;
        }
        showToast('Protest submitted.', 'success');
        if (typeof onSubmitted === 'function') onSubmitted();
      }).catch(function () {
        submitBtn.disabled = false;
        resultBox.className = 'rc-message rc-error';
        resultBox.textContent = 'Could not reach the server.';
      });
    });
    panel.appendChild(submitBtn);

    return panel;
  }

  // PROTESTS history (2026-09-08 rewrite, Matt's call: rename from "Your
  // Protests" since it now also carries protests filed AGAINST this
  // driver, not just ones they filed themselves -- last 10 either way,
  // newest first, with a "Show full history" popup once there's more,
  // same convention as the Finances page's Transaction Ledger
  // (buildLedgerPanel/openFullLedgerModal above). Only a protest THIS
  // driver filed, and still Pending, gets a Withdraw button.
  function buildProtestHistoryRow(p, token, onChanged) {
    var row = el('div', 'rc-dm-row');
    var info = el('div', null);
    info.appendChild(el('div', 'rc-dm-row-label', escapeHtml(p.roundLabel) + ' -- ' + escapeHtml((p.involvedNames || []).join(', '))));
    info.appendChild(el('div', 'rc-hint', escapeHtml(p.infractionType || '')));
    row.appendChild(info);

    var right = el('div', 'display:flex;align-items:center;gap:10px;');
    right.appendChild(_rcProtestStatusBadge(p.status, p.penaltyTier));
    if (p.isMine && p.status === 'Pending') {
      var withdrawBtn = el('button', 'rc-btn-primary rc-btn-sm', 'Withdraw');
      withdrawBtn.type = 'button';
      withdrawBtn.style.cssText = 'width:auto;padding:4px 12px;';
      withdrawBtn.addEventListener('click', function () {
        withdrawBtn.disabled = true;
        withdrawBtn.textContent = 'Withdrawing...';
        fetchApi('withdrawProtest', { method: 'POST', token: token, body: { protestId: p.protestId } }).then(function (data) {
          if (!data || !data.success) {
            showToast((data && data.message) || 'Could not withdraw that protest.', 'error');
            withdrawBtn.disabled = false;
            withdrawBtn.textContent = 'Withdraw';
            return;
          }
          showToast('Protest withdrawn.', 'success');
          if (typeof onChanged === 'function') onChanged();
        }).catch(function () {
          showToast('Could not reach the server.', 'error');
          withdrawBtn.disabled = false;
          withdrawBtn.textContent = 'Withdraw';
        });
      });
      right.appendChild(withdrawBtn);
    }
    row.appendChild(right);
    return row;
  }

  function openFullProtestHistoryModal(token, entries) {
    var listEl = el('div');
    var pagerEl = el('div', 'rc-ledger-pager');
    var body = el('div');
    body.appendChild(listEl);
    body.appendChild(pagerEl);

    var modal = showModal('Full Protest History', { bodyEl: body, wide: true });

    var page = 0;

    // A withdraw inside the popup re-fetches the full list fresh (so the
    // withdrawn protest's new status shows immediately) and also quietly
    // refreshes the page underneath, same "everything stays in sync"
    // pattern the League Management EDIT popup uses.
    function reload() {
      fetchApi('getMyProtests', { token: token, params: { full: '1' } }).then(function (data) {
        entries = (data && data.success) ? (data.protests || []) : [];
        renderPage();
      });
      renderProtestsSection(token);
    }

    function renderPage() {
      var totalPages = Math.max(1, Math.ceil(entries.length / RC_LEDGER_PAGE_SIZE));
      if (page > totalPages - 1) page = totalPages - 1;
      listEl.innerHTML = '';
      var start = page * RC_LEDGER_PAGE_SIZE;
      entries.slice(start, start + RC_LEDGER_PAGE_SIZE).forEach(function (p) {
        listEl.appendChild(buildProtestHistoryRow(p, token, reload));
      });

      pagerEl.innerHTML = '';
      var prevBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Previous');
      prevBtn.type = 'button';
      prevBtn.disabled = page === 0;
      prevBtn.addEventListener('click', function () { page--; renderPage(); });

      var pageLabel = el('span', 'rc-hint', 'Page ' + (page + 1) + ' of ' + totalPages);

      var nextBtn = el('button', 'rc-btn-secondary rc-btn-row', 'Next');
      nextBtn.type = 'button';
      nextBtn.disabled = page >= totalPages - 1;
      nextBtn.addEventListener('click', function () { page++; renderPage(); });

      pagerEl.appendChild(prevBtn);
      pagerEl.appendChild(pageLabel);
      pagerEl.appendChild(nextBtn);
    }
    renderPage();
    return modal;
  }

  var RC_PROTEST_PREVIEW_COUNT = 10;

  function buildMyProtestsHistoryPanel(token, protests, totalCount, onChanged) {
    var panel = el('div', 'rc-panel rc-dash-card rc-protest-history-panel');
    panel.style.cssText = 'margin-top:16px;';
    panel.appendChild(el('h3', 'rc-dash-card-title', 'Protests'));
    if (!protests.length) {
      panel.appendChild(el('div', 'rc-dm-empty', 'No protests filed by or against you yet.'));
      return panel;
    }
    protests.forEach(function (p) { panel.appendChild(buildProtestHistoryRow(p, token, onChanged)); });

    if (totalCount > RC_PROTEST_PREVIEW_COUNT) {
      var fullHistoryBtn = el('button', 'rc-link-btn rc-dash-card-link', '← Show full history');
      fullHistoryBtn.type = 'button';
      fullHistoryBtn.addEventListener('click', function () {
        fetchApi('getMyProtests', { token: token, params: { full: '1' } }).then(function (data) {
          openFullProtestHistoryModal(token, (data && data.success) ? (data.protests || []) : []);
        }).catch(function () { showToast('Could not load your full protest history.', 'error'); });
      });
      panel.appendChild(fullHistoryBtn);
    }

    return panel;
  }

  function _rcProtestStatusBadge(status, penaltyTier) {
    var cls = status === 'Upheld' ? 'rc-badge-race-posted' : (status === 'Denied' ? 'rc-badge-chip' : (status === 'Withdrawn' ? 'rc-badge-chip' : 'rc-badge-race-scheduled'));
    var label = status === 'Upheld' ? ('Upheld -- Tier ' + penaltyTier) : status;
    return el('span', 'rc-badge-chip ' + cls, label);
  }

  // =======================================================================
  // SEASON CREATION WIZARD -- ported back from the pre-v0.5 archive
  // (commit ab231e0), restoring its full look/behavior: 3 pages (Season
  // Details / Race Events / Season Preview), a shared requireField/
  // requireGroup hard-stop validation pattern, progressive step-unlocking,
  // and a localStorage-backed draft so a half-finished wizard survives
  // closing the tab. This is intentionally still built around the OLD
  // (pre-ECO) economy/multiclass/Special Events design -- Matt's own
  // framing for this restore was "make it look identical... then we can
  // go through and remove parts we don't need" as a second, separate pass.
  //
  // Two integration points were adapted to the CURRENT backend rather than
  // ported verbatim, since they're plumbing, not "look":
  //   1) Track/Layout are looked up against real TrackID rows (the
  //      current Tracks tab is one row per Track+Layout combo) instead of
  //      the archive's name-only WIZARD_TRACK_LAYOUTS map -- see
  //      loadWizardTrackList()/resolveTrackId() below.
  //   2) finishWizard() packs everything the current handleCreateSeason
  //      (4_DataCache.gs) doesn't look up individually -- classes,
  //      classSeasons, economy, raceSettings, specialEvents, etc. -- into
  //      one seasonDetails JSON blob, matching the SeasonDetails/
  //      RoundDetails "one JSON column" convention the rest of the site
  //      already uses, instead of the archive's flatter ad hoc payload.

  // Local-timezone YYYY-MM-DD for today -- used to default date pickers to
  // today instead of leaving them blank.
  function todayDateStr() {
    var d = new Date();
