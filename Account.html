  // already caps at the most recent 3 (see handleGetMyProtests,
  // Protests.gs) -- this card never re-slices the array itself, it just
  // renders whatever comes back. That same endpoint now also includes
  // protests filed AGAINST this driver, not just ones they filed (2026-
  // 09-08 rewrite -- see the full Protests page for the "PROTESTS"
  // history panel this mirrors). Reuses _rcProtestStatusBadge (defined
  // below, alongside the full Protests page) for the exact same Pending/
  // Upheld/Denied/Withdrawn chip look in both places.
  function protestCard(data) {
    var card = el('div', 'rc-panel rc-finrep-card rc-dash-card');
    card.appendChild(el('h3', 'rc-dash-card-title', 'Protests'));

    var protests = (data && data.success && data.protests) ? data.protests : [];

    if (!protests.length) {
      card.appendChild(el('p', 'rc-cs-empty', 'No protests filed by or against you yet.'));
    } else {
      var list = el('div', 'rc-protest-dash-list');
      protests.forEach(function (p) {
        var row = el('div', 'rc-dm-row');
        var info = el('div', null);
        info.appendChild(el('div', 'rc-dm-row-label', escapeHtml(p.roundLabel || '') + ' -- ' + escapeHtml((p.involvedNames || []).join(', '))));
        if (p.infractionType) info.appendChild(el('div', 'rc-hint', escapeHtml(p.infractionType)));
        row.appendChild(info);
        row.appendChild(_rcProtestStatusBadge(p.status, p.penaltyTier));
        list.appendChild(row);
      });
      card.appendChild(list);
    }

    var protestLink = el('button', 'rc-link-btn rc-dash-card-link', '← Go to Protests');
    protestLink.type = 'button';
    protestLink.addEventListener('click', function () {
      showLazySection('protests', currentToken);
    });
    card.appendChild(protestLink);

    return card;
  }

  // ---------------------------------------------------------------------
  // SEASON REGISTRATION MODAL -- restored from the pre-rebuild dashboard's
  // design (Matt's call: keep the modal's look/flow, drop the pre-ECO
  // cost model it was built around). What changed vs. the old version:
  //   - No more "Season Registration Fee" (a flat per-race fee, same for
  //     every team in a class) -- the current wizard's Economy section
  //     doesn't have one anymore. A team's BuyInCost (already randomized
  //     ±20% around its Tier average -- see the Car Objectives system) is
  //     the WHOLE cost now, not a per-team add-on to a season-long fee.
  //   - No reputation-floor class gating and no beginRegistration call --
  //     Reputation isn't a real computed number yet this season (see
  //     DataCache.gs's financesReputation.reputationScore comment), so
  //     there's nothing real to gate against; every class is open to
  //     every driver.
  //   - No separate chooseClass server action/state -- picking a class is
  //     purely a client-side filter now. The one server write is joinTeam
  //     itself, which locks the team immediately (Registrations.TeamID),
  //     with no sponsor IDs attached. Sponsors aren't picked at
  //     registration at all any more (Matt's call, 2026-09-01) -- a driver
  //     picks them later, any time before the season starts, from the
  //     Sponsors page (renderSponsorsSection below), which the Dashboard
  //     Sponsors card links straight to until they've picked at least one.
  //   - Team cards no longer show a Tier chip (removed entirely 2026-09-19,
  //     car Tier classification doesn't matter anymore) or a Car Objective
  //     chip (removed earlier, V1 scope cut) -- just team identity now.
  // ---------------------------------------------------------------------

  function buildRegistrationModal(profile, token, activeSeasonData, onDone) {
    var modal = showModal('Choose Your Class', { wide: true, onClose: function () { if (onDone) onDone(); } });
    var titleEl = modal.el.querySelector('.rc-modal-head h3');
    // pillNode is optional -- pass a real badge element (see buildClassBadge
    // below) to render "TITLE Class Pill" in the modal header, e.g.
    // "Choose Your Team LMGT3" with LMGT3 shown as its actual colored chip.
    function setTitle(t, pillNode) {
      if (!titleEl) return;
      titleEl.textContent = t + ' ';
      if (pillNode) titleEl.appendChild(pillNode);
    }
    function buildClassBadge(cls) {
      var colorVar = (typeof CAR_CLASS_BADGE_COLOR_VAR !== 'undefined' && CAR_CLASS_BADGE_COLOR_VAR[cls]) ? CAR_CLASS_BADGE_COLOR_VAR[cls] : '--rc-steel';
      var badge = el('span', 'rc-badge-chip', escapeHtml(_rcClassPillLabel(cls)));
      badge.style.background = 'var(' + colorVar + ')';
      return badge;
    }

    function fetchAllTeams() {
      return fetchApi('getAvailableTeams', { token: token, params: { seasonId: activeSeasonData.seasonId } });
    }

    function showClassScreen() {
      setTitle('Choose Your Class');
      var body = modal.body;
      body.innerHTML = '';
      body.appendChild(buildSpinner('Loading classes...'));
      fetchAllTeams().then(function (data) {
        body.innerHTML = '';
        if (!data.success) { body.appendChild(el('p', 'color:var(--rc-red);', data.message || 'Could not load classes.')); return; }
        renderClassScreenBody(data.teams || []);
      }).catch(function () {
        body.innerHTML = '';
        body.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server. Try again in a moment.'));
      });
    }

    // Circle-slash "not available" icon shown only on hover of a disabled
    // class button (2026-09-19, Matt's ask: "gray them out with a circle
    // and line through it on hover") -- same stroke convention as the
    // site's other inline icons (see the race-club-ui-consistency skill),
    // just white so it reads against the darkened overlay behind it.
    var RC_CLASS_LOCK_ICON = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="5.5" y1="18.5" x2="18.5" y2="5.5"></line></svg>';

    // Redesigned 2026-09-19 (Matt's call): colored buttons instead of a
    // plain list -- Green LMGT3, Purple LMP3, Blue LMP2, Red Hypercar
    // (reusing CAR_CLASS_BADGE_COLOR_VAR's existing tokens, which already
    // happen to be exactly those colors -- see reference-data.js). ALL
    // FOUR classes always render, whether or not this season actually
    // fields cars in them -- a class with no cars set up, or with every
    // seat already taken, just grays out and shows the circle-slash lock
    // icon on hover instead of disappearing from the row. A totals line
    // below the grid shows the overall open/total seat count across every
    // class in the season.
    function renderClassScreenBody(allTeams) {
      var body = modal.body;
      body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin-bottom:14px;',
        'Pick the class you’ll compete in this season. You’ll choose a specific car/team next.'));

      var classesPresent = [];
      allTeams.forEach(function (t) { if (t.carClass && classesPresent.indexOf(t.carClass) === -1) classesPresent.push(t.carClass); });
      // Always the full ladder, in order -- not filtered down to only the
      // classes this season happens to field (that filtering used to
      // decide which rows even existed; now it only decides which button
      // is clickable).
      var classes = (typeof CAR_CLASS_LIST !== 'undefined') ? CAR_CLASS_LIST : classesPresent;

      var grid = el('div', 'rc-class-pick-grid');
      var totalOpen = 0;
      var totalSeats = 0;

      classes.forEach(function (cls) {
        var present = classesPresent.indexOf(cls) !== -1;
        var teamsInClass = allTeams.filter(function (t) { return t.carClass === cls; });
        var openTeams = teamsInClass.filter(function (t) { return !t.taken; });
        totalOpen += openTeams.length;
        totalSeats += teamsInClass.length;

        var colorVar = (typeof CAR_CLASS_BADGE_COLOR_VAR !== 'undefined' && CAR_CLASS_BADGE_COLOR_VAR[cls]) ? CAR_CLASS_BADGE_COLOR_VAR[cls] : '--rc-steel';
        var canPick = present && openTeams.length > 0;

        var btn = el('button', 'rc-class-pick-btn' + (canPick ? '' : ' rc-class-pick-btn-locked'));
        btn.type = 'button';
        btn.style.setProperty('--rc-class-pick-color', 'var(' + colorVar + ')');
        btn.disabled = !canPick;

        var content = el('div', 'rc-class-pick-btn-content');
        content.appendChild(el('div', 'rc-class-pick-btn-name', escapeHtml(_rcClassPillLabel(cls))));
        var seatsLabel = present
          ? (openTeams.length + ' of ' + teamsInClass.length + ' seat' + (teamsInClass.length === 1 ? '' : 's') + ' open')
          : 'Not offered this season';
        content.appendChild(el('div', 'rc-class-pick-btn-seats', escapeHtml(seatsLabel)));
        btn.appendChild(content);

        var lock = el('div', 'rc-class-pick-btn-lock', RC_CLASS_LOCK_ICON);
        btn.appendChild(lock);

        if (canPick) btn.addEventListener('click', function () { showTeamScreen(cls); });
        grid.appendChild(btn);
      });

      body.appendChild(grid);

      // Totals line (2026-09-19, Matt's ask: "add totals below the
      // classes of how many seats are available") -- sums every class the
      // season actually fields, not the always-four button grid above.
      body.appendChild(el('div', 'rc-class-pick-totals',
        totalSeats
          ? (totalOpen + ' of ' + totalSeats + ' total seat' + (totalSeats === 1 ? '' : 's') + ' open this season')
          : 'No cars are set up for this season yet.'));
    }

    function showTeamScreen(carClass) {
      setTitle('Choose Your Team');
      var body = modal.body;
      body.innerHTML = '';

      var backBtn = el('button', 'rc-link-btn', '← Choose a different class');
      backBtn.type = 'button';
      backBtn.style.cssText = 'display:block;margin-bottom:10px;';
      backBtn.addEventListener('click', showClassScreen);
      body.appendChild(backBtn);

      var contentSlot = el('div');
      body.appendChild(contentSlot);
      loadTeamsInto(contentSlot, carClass);
    }

    function loadTeamsInto(contentSlot, carClass) {
      contentSlot.innerHTML = '';
      contentSlot.appendChild(buildSpinner('Loading ' + carClass + ' teams...'));
      fetchApi('getAvailableTeams', { token: token, params: { seasonId: activeSeasonData.seasonId, carClass: carClass } }).then(function (data) {
        contentSlot.innerHTML = '';
        if (!data.success) { contentSlot.appendChild(el('p', 'color:var(--rc-red);', data.message || 'Could not load teams.')); return; }
        if (!data.teams || !data.teams.length) { contentSlot.appendChild(el('p', 'color:var(--rc-steel);', 'No cars are set up for ' + escapeHtml(carClass) + ' yet.')); return; }
        // Elite-sorts-to-top and buy-in cost sorting both removed
        // (2026-09-19 and V1 scope cut respectively) -- teams no longer
        // carry a Tier or a BuyInCost from the backend, so this list is
        // simply arranged by car number, lowest to highest (Matt's
        // explicit ask), which handleGetAvailableTeams (DataCache.gs)
        // already sorts server-side. No client-side re-sort needed.
        data.teams.forEach(function (team) { contentSlot.appendChild(buildTeamCard(team, carClass)); });
      }).catch(function () {
        contentSlot.innerHTML = '';
        contentSlot.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server. Try again in a moment.'));
      });
    }

    // Reuses the pre-rebuild team card's exact CSS classes (.rc-team-card,
    // .rc-team-logo-box, .rc-team-card-footer -- all still in style.css,
    // never removed) so this looks like the card Matt originally signed
    // off on. The Tier chip this card used to show was removed entirely
    // 2026-09-19 (Matt's call: car Tier classification doesn't matter
    // anymore) -- the Season Objective chip was already removed earlier
    // (V1 scope cut), so this card no longer has a perks row at all.
    function buildTeamCard(team, carClass) {
      var card = el('div', 'rc-team-card' + (team.taken ? ' rc-team-card-taken' : ''));

      var head = el('div', 'rc-team-card-head');
      var identity = el('div', 'rc-team-card-identity');
      var logoBox = el('div', 'rc-team-logo-box');
      if (team.manufacturer && typeof manufacturerLogoSrc === 'function') {
        var logo = document.createElement('img');
        logo.src = manufacturerLogoSrc(team.manufacturer);
        logo.alt = team.manufacturer;
        logo.onerror = function () { logoBox.style.display = 'none'; };
        logoBox.appendChild(logo);
      }
      identity.appendChild(logoBox);
      var nameCol = el('div');
      nameCol.appendChild(el('div', 'rc-team-name', escapeHtml((team.teamName || 'Unnamed Team') + (team.carNumber ? ' #' + team.carNumber : ''))));
      if (team.manufacturer || team.carModel) {
        nameCol.appendChild(el('div', 'rc-team-subtitle', escapeHtml([team.manufacturer, team.carModel].filter(Boolean).join(' '))));
      }
      identity.appendChild(nameCol);
      head.appendChild(identity);
      // Buy-in cost total removed (V1 scope cut) -- teams no longer carry
      // a BuyInCost from the backend.
      // Light gray line under the car header, separating it from the team
      // description below (2026-08-30, Matt's call) -- only added when
      // there's actually a description underneath to separate it from.
      if (team.teamDesc) {
        head.style.cssText = 'padding-bottom:14px;border-bottom:1px solid var(--rc-offwhite);';
      }
      card.appendChild(head);

      // Team description (Cars.TeamDesc) -- lives between the header and
      // the footer below, in gray body text (Matt's call, 2026-08-30).
      // Skipped entirely if the car has no description set.
      if (team.teamDesc) {
        card.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;margin:8px 0;', escapeHtml(team.teamDesc)));
      }

      // Tier chip removed entirely 2026-09-19 (Matt's call: car Tier
      // classification doesn't matter anymore) -- the Season Objective
      // chip this row used to sit alongside was already removed earlier
      // (V1 scope cut), so there's no perks row left on this card at all.

      var footer = el('div', 'rc-team-card-footer');
      if (team.taken) {
        footer.appendChild(el('div', 'color:var(--rc-steel);font-size:13px;', 'This seat is already taken.'));
      } else {
        var joinBtn = el('button', null, 'Join This Team');
        joinBtn.type = 'button';
        joinBtn.className = 'rc-btn-primary';
        joinBtn.addEventListener('click', function () { doJoinTeamDirect(team, carClass, joinBtn); });
        footer.appendChild(joinBtn);
        var joinErrorLine = el('div', 'color:var(--rc-red);font-size:12px;margin-top:6px;');
        footer.appendChild(joinErrorLine);
        joinBtn.rcErrorLine = joinErrorLine;
      }
      card.appendChild(footer);
      return card;
    }

    // Joining a team locks in immediately on click, straight from "Join
    // This Team" into the signing sequence -- no sponsor-pick step (the
    // Sponsors system is gone entirely, V1 scope cut).
    //
    // REWORKED (2026-09-14, Matt's bug report): this used to wait on the
    // joinTeam response (a "Locking In..." disabled button) before ever
    // opening the signing sequence -- reasoned at the time (2026-09-03) as
    // the one save on this page that SHOULDN'T go optimistic, since a
    // team seat is a shared, exclusive resource someone else can grab in
    // the same instant, and there's no tasteful way to play the "EPIC"
    // signing video and then yank it back. In practice that wait was the
    // bug: Apps Script can take longer to finish a write than the
    // browser's own connection is willing to wait, so the fetch call
    // itself fails/errors out ("Could not reach the server") even though
    // Apps Script keeps running server-side and the join goes through
    // anyway -- confirmed by Matt: closing the error and reloading showed
    // him already registered into that seat. So the wait was both the
    // worse experience AND actively misleading about whether anything had
    // failed.
    //
    // Now: the joinTeam call fires immediately, but the driver is never
    // made to wait on it -- the signing sequence (suspense -> video ->
    // reveal, several seconds on its own) opens right away, in parallel,
    // giving Apps Script's response far more time to actually come back
    // before anything depends on it. The result is only checked once the
    // driver hits Continue on the reveal screen: by then it's almost
    // always already resolved, so Continue still feels instant; on the
    // rare case it's still in flight, this simply waits right there
    // instead of up front. Either a real failure (TEAM_TAKEN) or the
    // exact "connection dropped, but Apps Script may have written it
    // anyway" case above reload straight into a fresh fetch of the
    // dashboard rather than asserting success or failure from here --
    // only the Registrations sheet itself can say for sure which one
    // happened, and rcReloadAfterSave() re-fetches from it.
    function doJoinTeamDirect(team, carClass, joinBtn) {
      joinBtn.disabled = true;
      if (joinBtn.rcErrorLine) joinBtn.rcErrorLine.textContent = '';

      var joinPromise = fetchApi('joinTeam', { method: 'POST', token: token, body: { seasonId: activeSeasonData.seasonId, teamId: team.teamId } });

      function finishRegistration() {
        showToast('You’re registered!', 'success');
        // Dashboard rebuild fires first, immediately -- it's the thing the
        // driver is actually looking at and waiting on.
        rcReloadAfterSave();
        // Notification bell refresh, staggered a beat behind it
        // (2026-09-14 fix, Matt's report: "Could not reach the server"
        // right after joining a team). This used to fire in the exact
        // same breath as the dashboard reload: rcDismissSeasonNotification
        // (1 call) plus rcRefreshNotificationsNow's own 3 concurrent
        // fetches (see _rcRefreshNotifications, header.js) plus the
        // dashboard rebuild's own call -- 5 near-simultaneous Apps Script
        // requests from this one user, right on top of joinTeam's own
        // heavy write (Registration/Team/Transaction rows, sponsor
        // bookkeeping). Apps Script queues same-user requests rather than
        // truly running them in parallel, so that pileup is exactly the
        // kind of thing that produces a timed-out/failed request. None of
        // this is as time-critical as the dashboard itself, so it's
        // delayed just long enough to land after the dashboard's own
        // request is already underway instead of racing it.
        setTimeout(function () {
          // Registering for a season dismisses its bell notification the
          // same way closing the bell after seeing it would (Matt's call,
          // 2026-08-30) -- see rcDismissSeasonNotification in header.js.
          if (typeof rcDismissSeasonNotification === 'function') rcDismissSeasonNotification(activeSeasonData.seasonId);
          // Bug fix (2026-09-14, Matt's report: "no notification to
          // choose sponsors in the bell after buying a seat"). The
          // "Choose your sponsors" notification is derived live off
          // getMySponsors (see _rcFetchSponsorNotifications, header.js)
          // and only recomputed when the bell actually re-fetches --
          // normally just the 45s poll tick, same gap chooseSponsors' own
          // save already fixed itself (rcRefreshNotificationsNow below,
          // mirroring that same call). Without forcing it here, a driver
          // who checks the bell right after joining sees nothing yet,
          // same as before this fix.
          if (typeof rcRefreshNotificationsNow === 'function') rcRefreshNotificationsNow();
        }, 1500);
      }

      openSigningSequence(team, carClass, function () {
        joinPromise.then(function (data) {
          if (data && data.success) { finishRegistration(); return; }
          showToast((data && data.message) || (data && data.error === 'TEAM_TAKEN' ? 'That seat was just taken -- reloading to show what\'s still open.' : 'Could not confirm this registration -- reloading to check.'), 'error');
          rcReloadAfterSave();
        }).catch(function () {
          // The connection to Apps Script itself dropped/errored -- this
          // is the exact case from Matt's bug report, where the join had
          // actually gone through server-side anyway. No way to tell from
          // here, so reload and let the real Registrations data answer it
          // rather than telling the driver it failed when it may not have.
          showToast('Reloading to confirm your registration...', 'success');
          rcReloadAfterSave();
        });
      });
    }

    showClassScreen();
  }

  // ---------------------------------------------------------------------
  // SIGNING SEQUENCE (2026-08-30, Matt's call: "I want this to feel
  // EPIC"; reworked 2026-09-18 -- video swapped for a full-viewport class
  // welcome image, Matt: "Instead of a video playing, I have an image
  // that I want displayed across the entire website. It fades in, stays
  // up for 3 seconds, then dims to half brightness. That's when the
  // congratulations message displays with the team principal quote.")
  // Plays after a driver locks in a team (with or without sponsors),
  // before the old immediate "you're registered" toast. Its own
  // full-viewport overlay, stacked above the registration modal's own
  // backdrop (z-index 5000 vs. the modal's 2000) rather than replacing
  // it -- the registration modal is left open but hidden behind this
  // overlay the whole time, so closing it (and everything that used to
  // fire immediately on join: the toast, the notification dismiss,
  // onDone()) is deferred to whenever this sequence actually finishes.
  //
  // Two beats:
  //   1. SUSPENSE -- a small dark card cycles contract-flavor status
  //      lines ("Drafting team documents...") while the class's welcome
  //      image (see rcSigningWelcomeImageSrc_ below -- gt_welcome.jpg,
  //      prototype_welcome.jpg, or hypercar_welcome.jpg depending on
  //      carClass) preloads in the background, reusing the same
  //      .rc-startlights gantry as every other loading state sitewide.
  //      Held for at least SIGNING_SUSPENSE_MIN_MS even if the image is
  //      already cached, so it never flashes past unnoticed; extended for
  //      as long as the image actually needs past that floor.
  //   2. WELCOME -- the card grows to fill the entire viewport with the
  //      class's welcome image. It fades in (SIGNING_IMAGE_FADE_MS), holds
  //      at full brightness for SIGNING_IMAGE_HOLD_MS, then dims to half
  //      brightness -- and right as that dim starts, the reveal content
  //      (the Race Club wordmark logo, "CONGRATULATIONS", the team-
  //      principal quote, the team identity pill, and "Continue") fades
  //      in on top of the dimmed image. This beat HOLDS here indefinitely
  //      once revealed -- no auto-advance timer -- only Continue moves on
  //      to the contract screen (Matt's call, 2026-08-30, still true here).
  //      SIGNING_IMAGE_FAILSAFE_MS guards against an image that never
  //      fires 'load' (a bad connection, a renamed file) by moving on
  //      anyway instead of trapping the driver on a blank screen forever.
  //
  // From there the whole dark overlay is torn down and onFinish() (the
  // caller's finishRegistration) fires immediately -- Continue on the
  // congratulations screen goes straight to the toast + reload (Matt's
  // call, 2026-09-01), no contract-recap modal step in between. Sponsors
  // aren't picked at signing time any more either, so there was nothing
  // left for that recap to add beyond what's already on the dashboard.
  // ---------------------------------------------------------------------
  var SIGNING_MESSAGES_ = [
    'Drafting team documents...',
    'Securing season entry fees...',
    'Notifying the team principal...',
    'Verifying sponsorship terms...',
    'Fitting your race suit...',
    'Calibrating the seat...',
    'Finalizing your contract...',
    'Bringing the car to pit lane...'
  ];

  // Ten team-principal-to-new-driver lines for the REVEAL beat (2026-08-30,
  // Matt's ask: "feels like something a team principal would say to their
  // new driver... make it feel personal"), replacing the single generic
  // "You just earned a seat at ___. Time to make it count." One is picked
  // at random per signing (rcPickWelcomeLine_ below) -- {team} is the only
  // placeholder since a driver's own name is already all over the header
  // chrome; these are written as if spoken TO the driver, not about them.
  // Second pass, same day (Matt: "make the hype messages... only positive!
  // ... 3 sentences long and cmon give it some energy!!!") -- every line
  // rewritten as an upbeat, energetic, exactly-3-sentence quote (no mixed
  // "don't make us regret it"/challenge-toned lines from the first draft),
  // rendered inside big quotation marks with a "— Team Principal"
  // attribution underneath (see dimAndReveal below).
  var SIGNING_WELCOME_LINES_ = [
    'Welcome to {team}! We’ve been waiting for a driver like you, and we finally found one. This seat is yours, now let’s go show everyone what we can do!',
    'You earned this, plain and simple! {team} doesn’t hand out seats, we award them. Buckle up, this is going to be a season to remember!',
    'From everyone at {team}: congratulations! You’re not just joining a team, you’re joining a family that believes in you. Let’s get out there and win!',
    'This is the moment every driver dreams about, and it’s yours! {team} is fully behind you, every lap, every race. Now go make us proud!',
    'Welcome aboard, driver! We built this car for someone special, and that someone is you. Let’s make {team} history together!',
    'The whole {team} garage is buzzing about you! You’ve got the talent, we’ve got the car, together we’re unstoppable. Let’s go racing!',
    'You should be incredibly proud of yourself right now! {team} chose you because we believe you can do great things. Now it’s time to prove it!',
    'Congratulations, and welcome to the team! Every great champion started exactly where you are right now. Let’s write your story together!',
    'This seat has your name on it for a reason! {team} sees the potential in you, and we can’t wait to watch it grow. Let’s hit the track!',
    'Welcome to {team}, driver! Today you take the first step toward something incredible. Strap in, the season starts now!'
  ];
  function rcPickWelcomeLine_(team) {
    var template = SIGNING_WELCOME_LINES_[Math.floor(Math.random() * SIGNING_WELCOME_LINES_.length)];
    return template.split('{team}').join(escapeHtml(team.teamName || 'the team'));
  }
  var SIGNING_SUSPENSE_MIN_MS = 3800;
  var SIGNING_IMAGE_FAILSAFE_MS = 8000;
  // Image-fade timing for the WELCOME beat -- fades in, holds at full
  // brightness, then dims to half brightness as the reveal content
  // appears (Matt: "It fades in, stays up for 3 seconds, then dims to
  // half brightness. That's when the congratulations message displays").
  var SIGNING_IMAGE_FADE_MS = 900;
  var SIGNING_IMAGE_HOLD_MS = 3000;

  // Which full-viewport welcome image plays, keyed off the car class the
  // driver just signed into (Matt, 2026-09-18): GT3 seats get
  // gt_welcome.jpg, LMP2 and LMP3 get prototype_welcome.jpg, and
  // Hypercars get hypercar_welcome.jpg. CAR_CLASS_LIST (js/reference-
  // data.js) is the source of truth for the exact string values carClass
  // holds ('LMGT3', 'LMP3', 'LMP2', 'Hypercar'); prototype_welcome.jpg is
  // also the fallback for anything unrecognized rather than leaving the
  // beat with no image at all.
  function rcSigningWelcomeImageSrc_(carClass) {
    if (carClass === 'LMGT3') return 'assets/images/gt_welcome.jpg';
    if (carClass === 'Hypercar') return 'assets/images/hypercar_welcome.jpg';
    return 'assets/images/prototype_welcome.jpg';
  }

  function openSigningSequence(team, carClass, onFinish) {
    var overlay = el('div', 'rc-signing-overlay');
    var stage = el('div', 'rc-signing-stage rc-signing-stage-suspense');
    overlay.appendChild(stage);
    document.body.appendChild(overlay);

    // ---- Stage 1: SUSPENSE ------------------------------------------
    var suspenseWordmark = document.createElement('img');
    suspenseWordmark.className = 'rc-signing-wordmark-img';
    suspenseWordmark.alt = 'Race Club';
    suspenseWordmark.src = 'assets/images/Race Club (Full, Black).png';
    stage.appendChild(suspenseWordmark);
    var lights = el('div', 'rc-startlights');
    for (var i = 0; i < 5; i++) lights.appendChild(el('div', 'rc-startlight'));
    stage.appendChild(lights);
    var msgLine = el('div', 'rc-signing-message', SIGNING_MESSAGES_[0]);
    stage.appendChild(msgLine);

    var msgIndex = 0;
    var msgTimer = setInterval(function () {
      msgIndex = (msgIndex + 1) % SIGNING_MESSAGES_.length;
      msgLine.style.opacity = '0';
      setTimeout(function () {
        msgLine.textContent = SIGNING_MESSAGES_[msgIndex];
        msgLine.style.opacity = '1';
      }, 180);
    }, 1400);

    // Preloaded the same way the old video was (present in the DOM from
    // the very start, not held detached in memory) so the browser starts
    // fetching it immediately, in parallel with the SUSPENSE beat's
    // status-message cycling above.
    var welcomeImg = document.createElement('img');
    welcomeImg.className = 'rc-signing-welcome-img';
    welcomeImg.alt = '';

    var startedAt = Date.now();
    var imageReady = false;
    var advancedToWelcome = false;
    var failsafeTimer = setTimeout(function () { imageReady = true; tryAdvanceToWelcome(); }, SIGNING_IMAGE_FAILSAFE_MS);
    welcomeImg.addEventListener('load', function onReady() {
      welcomeImg.removeEventListener('load', onReady);
      imageReady = true;
      tryAdvanceToWelcome();
    });
    welcomeImg.addEventListener('error', function () { imageReady = true; tryAdvanceToWelcome(); });
    welcomeImg.src = rcSigningWelcomeImageSrc_(carClass);

    function tryAdvanceToWelcome() {
      if (advancedToWelcome) return;
      var wait = Math.max(0, SIGNING_SUSPENSE_MIN_MS - (Date.now() - startedAt));
      setTimeout(function () {
        if (advancedToWelcome || !imageReady) return;
        advancedToWelcome = true;
        clearInterval(msgTimer);
        clearTimeout(failsafeTimer);
        advanceToWelcome();
      }, wait);
    }

    // ---- Stage 2: WELCOME ---------------------------------------------
    // Grows the stage to fill the whole viewport with the class's welcome
    // image: fades in, holds at full brightness, then dims to half
    // brightness -- and the reveal content (wordmark, CONGRATULATIONS,
    // team-principal quote, team identity, Continue) fades in on top of
    // the dimmed image right as that dim starts. Holds here indefinitely
    // once revealed (Matt's call, 2026-08-30, still true here) -- only
    // the Continue button below moves on to the contract screen.
    var revealStarted = false;
    var advancedPastReveal = false;
    function advanceToWelcome() {
      stage.className = 'rc-signing-stage rc-signing-stage-welcome';
      stage.innerHTML = '';
      stage.appendChild(welcomeImg);
      // Force a reflow before adding the fade-in class so the browser
      // actually animates the opacity transition instead of starting
      // already at its end state (the element was just inserted/reparented
      // this same tick).
      void welcomeImg.offsetHeight;
      welcomeImg.classList.add('rc-signing-welcome-img-visible');

      setTimeout(dimAndReveal, SIGNING_IMAGE_FADE_MS + SIGNING_IMAGE_HOLD_MS);
    }

    function dimAndReveal() {
      if (revealStarted) return;
      revealStarted = true;
      welcomeImg.classList.add('rc-signing-welcome-img-dim');

      var overlayContent = el('div', 'rc-signing-welcome-overlay');
      var wordmark = document.createElement('img');
      wordmark.className = 'rc-signing-wordmark-img rc-signing-wordmark-img-lg';
      wordmark.alt = 'Race Club';
      wordmark.src = 'assets/images/Race Club (Full, Black).png';
      overlayContent.appendChild(wordmark);
      overlayContent.appendChild(el('div', 'rc-signing-congrats', 'CONGRATULATIONS'));
      // Big open/close quote marks + a "— Team Principal" attribution
      // underneath, right-aligned (2026-08-30, Matt: "add larger
      // quotations in front and after it to show that someone from the
      // team said it... Add emdash Team Principal underneath to the
      // right") -- reads as an actual quote from someone at the team, not
      // just hype copy.
      // Wrapped together in one block with an explicit width (rather than
      // each just being its own flex child) so the attribution's
      // text-align: right below actually has real room to align against
      // -- .rc-signing-stage's flex column otherwise shrink-wraps every
      // child to its own content width, which would leave "— Team
      // Principal" with nothing to the right of it to align away from.
      var hypeWrap = el('div', 'rc-signing-hype-wrap');
      var hypeQuote = el('div', 'rc-signing-hype');
      hypeQuote.appendChild(el('span', 'rc-signing-hype-mark rc-signing-hype-mark-open', '“'));
      hypeQuote.appendChild(el('span', 'rc-signing-hype-text', rcPickWelcomeLine_(team)));
      hypeQuote.appendChild(el('span', 'rc-signing-hype-mark rc-signing-hype-mark-close', '”'));
      hypeWrap.appendChild(hypeQuote);
      hypeWrap.appendChild(el('div', 'rc-signing-hype-attribution', '· Team Principal'));
      overlayContent.appendChild(hypeWrap);

      var identity = el('div', 'rc-signing-reveal-identity');
      if (team.manufacturer && typeof manufacturerLogoSrc === 'function') {
        var logo = document.createElement('img');
        logo.className = 'rc-signing-reveal-logo';
        logo.alt = team.manufacturer;
        logo.src = manufacturerLogoSrc(team.manufacturer);
        logo.onerror = function () { this.style.display = 'none'; };
        identity.appendChild(logo);
      }
      identity.appendChild(el('div', 'rc-signing-reveal-team',
        escapeHtml((team.teamName || 'Unnamed Team') + (team.carNumber ? ' #' + team.carNumber : ''))));
      overlayContent.appendChild(identity);

      var btnRow = el('div', 'rc-signing-reveal-btn-row');
      btnRow.style.opacity = '0';

      // Red (2026-09-19, Matt's explicit call: "Make the CONTINUE button
      // red on the CONGRATULATIONS screen after picking a team") --
      // deliberately overrides the site's usual gray-vs-red button rule
      // (color normally means "this click saves," not "this screen
      // follows a save") for this one moment specifically, since it's the
      // celebratory reveal screen and Matt wants it to read as a bigger,
      // more energetic call to action than a plain gray Continue.
      var continueBtn = el('button', 'rc-btn-primary rc-signing-continue', 'Continue');
      continueBtn.type = 'button';
      continueBtn.addEventListener('click', advanceToContract);
      btnRow.appendChild(continueBtn);

      overlayContent.appendChild(btnRow);
      stage.appendChild(overlayContent);
      // Force a reflow before fading in, same reason as the welcome image
      // above -- the overlay was just inserted this same tick.
      void overlayContent.offsetHeight;
      overlayContent.classList.add('rc-signing-welcome-overlay-visible');
      setTimeout(function () { btnRow.style.opacity = '1'; }, 1400);
    }

    // Continue on the congratulations screen goes straight to the reload
    // now (Matt's call, 2026-09-01) -- no contract-recap modal in between.
    // Team identity is already visible on the dashboard the reload lands
    // back on (Current Seat, Registration Status), and sponsors are no
    // longer picked at signing time, so that recap card had nothing left
    // to add.
    //
    // The registration modal (Choose Your Class/Team) itself was never
    // actually closed -- see the "SIGNING SEQUENCE" comment above: it's
    // deliberately left open the whole time, just visually hidden behind
    // this overlay (which stacks on top of it). That's exactly what Matt
    // saw as "something loaded for a split second" (2026-09-01 bug
    // report): overlay.remove() revealed that still-open modal -- whatever
    // screen it was last showing -- for a frame before onFinish() below
    // could navigate/refresh it away. Fix: close it here FIRST, silently
    // (skipOnClose -- its own onClose would re-fetch Registration
    // Status/Current Seat/etc. in place, which is redundant work right
    // before onFinish()'s reload and was contributing to the same flash),
    // so there's nothing left behind for overlay.remove() to expose.
    function advanceToContract() {
      if (advancedPastReveal) return;
      advancedPastReveal = true;
      if (rcActiveModalCloseFn) rcActiveModalCloseFn(true);
      overlay.remove();
      onFinish();
    }
  }

  // ---------------------------------------------------------------------
  // CHANGE PASSWORD -- kept fully functional because the forced-password
  // lock screen below depends on it directly. Not currently reachable any
  // other way, since Edit Profile itself is just a placeholder for now.
  // Result messaging goes through showToast() (js/header.js) rather than
  // its own inline status line, per Matt's sitewide toast call.
  // ---------------------------------------------------------------------
  function passwordChangeSection(token) {
    var box = document.createElement('div');
    box.className = 'rc-panel';
    box.style.borderColor = 'var(--rc-red)';
    box.appendChild(el('h3', 'margin-top:0;font-size:15px;', 'Change Password'));
    var cur = el('input'); cur.type = 'password'; cur.placeholder = 'Current password';
    var next = el('input'); next.type = 'password'; next.placeholder = 'New password (8+ characters)';
    var confirm = el('input'); confirm.type = 'password'; confirm.placeholder = 'Confirm new password';
    var btn = el('button', null, 'Update Password'); btn.className = 'rc-btn-primary rc-btn-sm'; btn.style.marginTop = '14px';

    btn.addEventListener('click', function () {
      if (next.value !== confirm.value) {
        showToast('New password and confirmation don\'t match.', 'error');
        return;
      }
      // Deliberately left waiting on the server (2026-09-03 pass): unlike
      // everything else on this page, success here genuinely depends on
      // a fact only the server can check -- whether currentPassword is
      // actually correct -- and that's a common, expected way for this
      // particular action to fail (a typo, forgetting which password),
      // not a rare edge case. There's nothing honest to show optimistically
      // before that check runs, so this one action still waits.
      fetchApi('changeOwnPassword', { method: 'POST', token: token, body: { currentPassword: cur.value, newPassword: next.value } })
        .then(function (data) {
          showToast(data.message || (data.success ? 'Updated.' : 'Failed.'), data.success ? 'success' : 'error');
          // A full reload (rather than box.remove()) covers both callers
          // at once: the forced-password lock screen (mustChangePassword
          // re-checks fresh on reload and drops the lock on its own) and
          // the Edit Profile modal's embedded copy of this form.
          if (data.success) rcReloadAfterSave();
        });
    });

    box.appendChild(cur); box.appendChild(next); box.appendChild(confirm); box.appendChild(btn);
    return box;
  }

  // ---------------------------------------------------------------------
  // GENERIC MODAL -- backdrop + centered card, Escape/backdrop-click/X all
  // close it. Reintroduced this pass (the CSS classes it needs,
  // .rc-modal-backdrop/.rc-modal/.rc-modal-head/.rc-modal-close/
  // .rc-modal-body/.rc-modal-wide, survived the v0.5.0 rebuild even though
  // this function didn't). opts.wide adds the .rc-modal-wide class for
  // content-heavier popups; opts.bodyEl is the element to place inside
  // .rc-modal-body.
  // ---------------------------------------------------------------------
  function showModal(title, opts) {
    opts = opts || {};
    var backdrop = el('div', 'rc-modal-backdrop');
    var modal = el('div', 'rc-modal' + (opts.wide ? ' rc-modal-wide' : ''));
    var head = el('div', 'rc-modal-head');
    head.appendChild(el('h3', 'margin:0;font-size:16px;', escapeHtml(title)));
    var closeBtn = el('button', 'rc-modal-close', '&times;');
    closeBtn.type = 'button';
    closeBtn.setAttribute('aria-label', 'Close');
    head.appendChild(closeBtn);
    var body = el('div', 'rc-modal-body');
    if (opts.bodyEl) body.appendChild(opts.bodyEl);
    modal.appendChild(head);
    modal.appendChild(body);
    backdrop.appendChild(modal);
    document.body.appendChild(backdrop);

    // Lock the page behind the popup -- same iOS-Safari-safe pattern the
    // mobile menu already uses (see .rc-modal-scroll-locked in
    // style.css): pin body with position:fixed (not just overflow:hidden,
    // which doesn't reliably stop touch scrolling), remembering the
    // scroll position so it can be restored on close without a jump.
    var scrollYBeforeModal = window.scrollY || window.pageYOffset || 0;
    document.body.style.top = '-' + scrollYBeforeModal + 'px';
    document.body.classList.add('rc-modal-scroll-locked');

    // Closable ONLY via the X button here, or a Cancel button the caller
    // wires up itself against the returned { close } (Matt's call,
    // 2026-08-30: "you either have to hit a cancel button or hit the X...
    // this avoids accidental clicks and nothing saves"). Backdrop-click
    // and Escape-key close are deliberately gone -- neither the dimmed
    // backdrop nor document keydown gets a listener anymore.
    // skipOnClose (2026-09-01): lets a caller tear this modal down WITHOUT
    // firing opts.onClose -- see openSigningSequence's advanceToContract,
    // which closes the registration modal silently right before a reload/
    // in-place refresh is about to happen anyway. Every other caller
    // (the X button, a Cancel button) calls close() with no argument, so
    // onClose still fires normally there.
    function close(skipOnClose) {
      backdrop.remove();
      document.body.classList.remove('rc-modal-scroll-locked');
      document.body.style.top = '';
      window.scrollTo(0, scrollYBeforeModal);
      // Only clear the tracker if THIS modal is still the one it's
      // pointing at -- guards against a theoretical stale clear if a
      // second modal somehow opened before this one's close() ran.
      if (rcActiveModalCloseFn === close) rcActiveModalCloseFn = null;
      if (opts.onClose && !skipOnClose) opts.onClose();
    }
    rcActiveModalCloseFn = close;
    closeBtn.addEventListener('click', close);

    // el: the modal card itself (not the dimmed backdrop) -- exposed so a
    // caller can add a one-off class to it, e.g. the Season Wizard's
    // shake-on-invalid-Next animation (.rc-shake).
    return { close: close, body: body, el: modal };
  }

  // Small reusable confirm popup for destructive actions (added 2026-08-30
  // for Season Tools' Delete button) -- built on showModal so it inherits
  // the same X-button-or-Cancel-only close rule. onConfirm runs when the
  // confirm button is clicked; the modal closes itself either way (Cancel,
  // X, or after onConfirm fires) rather than making every caller remember
  // to call .close().
  function openConfirmModal(title, message, confirmLabel, onConfirm) {
    var body = el('div');
    body.appendChild(el('p', 'color:var(--rc-carbon);font-size:14px;margin-top:0;', message));
    var btnRow = el('div', 'display:flex;gap:10px;justify-content:flex-end;margin-top:16px;');
    var cancelBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Cancel');
    cancelBtn.type = 'button';
    var confirmBtn = el('button', 'rc-btn-primary rc-btn-sm', confirmLabel || 'Confirm');
    confirmBtn.type = 'button';
    confirmBtn.style.cssText = 'background:var(--rc-red);';
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    body.appendChild(btnRow);

    var modal = showModal(title, { bodyEl: body });
    cancelBtn.addEventListener('click', modal.close);
    confirmBtn.addEventListener('click', function () {
      modal.close();
      onConfirm();
    });
  }

  // Heavier version of openConfirmModal for an action Matt wants real
  // deliberation behind (added 2026-08-30 for Season Tools' End Season
  // button) -- the confirm button stays disabled until the exact phrase
  // is typed into the box, same "type ERASE to confirm" weight as the
  // spreadsheet's own eraseAllSeasonDataPrompt, just as a proper popup
  // instead of a browser prompt() since this is reachable from the
  // website, not just the Apps Script menu.
  function openTypeToConfirmModal(title, message, requiredPhrase, confirmLabel, onConfirm) {
    var body = el('div');
    body.appendChild(el('p', 'color:var(--rc-carbon);font-size:14px;margin-top:0;', message));
    body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'Type ' + requiredPhrase + ' below to continue.'));
    var input = document.createElement('input');
    input.type = 'text';
    input.autocomplete = 'off';
    input.placeholder = requiredPhrase;
    input.style.cssText = 'width:100%;box-sizing:border-box;padding:9px 12px;border:1px solid var(--rc-silver);border-radius:6px;font-size:14px;font-family:var(--rc-font-body);';
    body.appendChild(input);

    var btnRow = el('div', 'display:flex;gap:10px;justify-content:flex-end;margin-top:16px;');
    var cancelBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Cancel');
    cancelBtn.type = 'button';
    var confirmBtn = el('button', 'rc-btn-secondary rc-btn-sm', confirmLabel || 'Confirm');
    confirmBtn.type = 'button';
    confirmBtn.disabled = true;
    confirmBtn.style.cssText = 'opacity:0.5;';
    // Stays grayed out (secondary style, dimmed, disabled) until the exact
    // phrase is typed -- ONLY THEN does it turn red and become clickable
    // (2026-09-07, Matt's call on the End Season button specifically, but
    // this is the one shared typed-confirm button every irreversible admin
    // action on the site uses, so the fix applies everywhere at once: it
    // used to render red from the start even while still disabled, which
    // read as already-armed when it wasn't).
    input.addEventListener('input', function () {
      var matches = input.value === requiredPhrase;
      confirmBtn.disabled = !matches;
      confirmBtn.style.cssText = matches ? 'background:var(--rc-red);opacity:1;' : 'opacity:0.5;';
    });
    btnRow.appendChild(cancelBtn);
    btnRow.appendChild(confirmBtn);
    body.appendChild(btnRow);

    var modal = showModal(title, { bodyEl: body });
    cancelBtn.addEventListener('click', modal.close);
    confirmBtn.addEventListener('click', function () {
      if (input.value !== requiredPhrase) return; // belt-and-suspenders -- button is already disabled until this matches
      modal.close();
      onConfirm();
    });
    input.focus();
  }

  // END SEASON -- moved here to the Admin page from League Management
  // (2026-09-09, Matt's call: "only admins should be able to create and
  // end seasons" -- both the League Management/Admin nav links are already
  // gated on profile.role === 'Admin', and the backend's
  // handleAdminArchiveSeason/handleCreateSeason both already call
  // requireRole(admin, ['Admin']) too, so this move just keeps every
  // irreversible season action living on the one page only admins can even
  // see, alongside Create a Season). Unlike the old per-row League
  // Management button, this page has no season already in hand when the
  // button is clicked, so a season-picker step comes first here, THEN the
  // same typed "END SEASON" confirmation every other irreversible admin
  // action on the site uses (openTypeToConfirmModal) -- two separate
  // popups in sequence, picking a season alone never ends it.
  function openEndSeasonModal(token, reload) {
    var body = el('div');
    body.appendChild(buildSpinner('Loading seasons...'));
    var modal = showModal('End Season', { bodyEl: body });

    fetchApi('adminListSeasons', { token: token }).then(function (data) {
      body.innerHTML = '';
      if (!data.success) {
        body.appendChild(el('p', 'color:var(--rc-red);', 'Could not load seasons.'));
        return;
      }
      // Same eligibility the old per-row button gated on: a season needs
      // at least one posted race result (locked) and can't already be
      // Completed -- ending a season that's already ended doesn't make
      // sense, and a season with no races yet should be Deleted instead.
      var eligible = (data.seasons || []).filter(function (s) { return s.locked && s.status !== 'Completed'; });
      if (!eligible.length) {
        body.appendChild(el('p', 'color:var(--rc-steel);font-size:13px;', 'No season is currently eligible to end -- a season needs at least one posted race result, and can\'t already be Completed.'));
        return;
      }

      body.appendChild(el('p', 'color:var(--rc-carbon);font-size:14px;margin-top:0;', 'Choose which season to end.'));
      var select = document.createElement('select');
      eligible.forEach(function (s) { select.appendChild(new Option(s.name || s.seasonId, s.seasonId)); });
      body.appendChild(wizField('Season', select, null));

      var btnRow = el('div', 'display:flex;gap:10px;justify-content:flex-end;margin-top:16px;');
      var cancelBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Cancel');
      cancelBtn.type = 'button';
      cancelBtn.addEventListener('click', modal.close);
      var continueBtn = el('button', 'rc-btn-secondary rc-btn-sm', 'Continue');
      continueBtn.type = 'button';
      continueBtn.addEventListener('click', function () {
        var chosenId = select.value;
        var chosen = eligible.filter(function (s) { return s.seasonId === chosenId; })[0];
        // skipOnClose (true) -- the second popup opens right behind this
        // one, no need to fire this modal's (nonexistent) onClose.
        modal.close(true);
        openTypeToConfirmModal(
          'End Season',
          'End "' + (chosen ? (chosen.name || chosenId) : chosenId) + '"? Ending a season is irreversible.',
          'END SEASON',
          'End Season',
          function () {
            fetchApi('adminArchiveSeason', { method: 'POST', token: token, body: { seasonId: chosenId } }).then(function (data2) {
              if (!data2.success) {
                showToast(data2.message || 'Could not end this season.', 'error');
                return;
              }
              showToast('Season ended.', 'success');
              if (typeof reload === 'function') reload();
            }).catch(function () {
              showToast('Could not reach the server -- season not ended.', 'error');
            });
          }
        );
      });
      btnRow.appendChild(cancelBtn);
      btnRow.appendChild(continueBtn);
      body.appendChild(btnRow);
    }).catch(function () {
      body.innerHTML = '';
      body.appendChild(el('p', 'color:var(--rc-red);', 'Could not reach the server.'));
    });
  }

  // Inline branded loading indicator (the "Starting Grid Lights" sequence
  // also used for full-page/section loading states) -- reused here for the
  // Season Wizard's "fetching tracks & cars" and "creating season" waits so
  // every spinner on the site looks the same.
  function buildSpinner(message) {
    var wrap = el('div', 'rc-inline-spinner-wrap');
    var lightsRow = el('div', 'rc-startlights');
    for (var li = 0; li < 5; li++) lightsRow.appendChild(el('span', 'rc-startlight'));
    wrap.appendChild(lightsRow);
    wrap.appendChild(el('div', 'rc-loading-text', escapeHtml(message)));
    return wrap;
  }

  // Standardized top-of-page loading position (Matt's call, 2026-08-29):
  // every full-section loading state -- the initial #rc-loading markup
  // AND any in-page section that fetches on click (Calendar, and any
  // future one built the same way) -- sits at the exact same vertical
  // height via .rc-inline-spinner-page's margin-top, instead of drifting
  // depending on whether a heading happened to render above it first.
  // NOT for spinners inside a modal (buildSpinner() alone is still right
  // there -- the modal card itself is already the container, and modal
  // body centering handles its own vertical position).
  // Every call site below follows the same short "Loading your
  // <page>..." shape (2026-09-18, Matt's call: keep every full-section
  // loading message in that one consistent format, but specific to
  // whichever page is actually loading -- not one long sentence naming
  // every page at once).
  function buildPageSpinner(message) {
    var wrap = buildSpinner(message);
    wrap.classList.add('rc-inline-spinner-page');
    return wrap;
  }

  // Whole-page "nothing to show" state (2026-09-18, Matt's call: "get rid
  // of the ugly containers with text saying that there is no season etc"
  // -- replaces the bordered .rc-panel + heading + sentence that Calendar/
  // Results/Career used to show when there's no season, no data, or
  // nothing else to render). One big icon (a plain "no entry" circle-
  // slash, same 24x24/stroke-1.8 icon family as everywhere else on the
  // site) sitting a shade darker than the page background -- var(--rc-
  // silver) is exactly that "one step darker than --rc-offwhite" neutral
  // already used for borders sitewide -- plus a short title underneath.
  // `subtitle` is optional, second line, smaller and lighter, for the one
  // extra sentence of context a page sometimes still needs (e.g. "Check
  // back once a new season opens").
  function buildEmptyStatePanel(title, subtitle) {
    var wrap = el('div', 'rc-empty-state');
    wrap.appendChild(el('div', 'rc-empty-state-icon',
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="5.6" y1="5.6" x2="18.4" y2="18.4"></line></svg>'));
    wrap.appendChild(el('div', 'rc-empty-state-title', escapeHtml(title || 'No Data To Display')));
    if (subtitle) wrap.appendChild(el('div', 'rc-empty-state-subtitle', escapeHtml(subtitle)));
    return wrap;
  }

  // Generic two-column field-pair row (label + field, twice) -- the plain,
  // no-hint version used across the site's other forms (Edit Profile, Edit
  // Track/Car, and most of the Season Wizard's own field pairs). The
  // wizard-specific wizFieldPairRow further down is the richer version that
  // also gives each column its own hint line.
  function fieldPairRow(labelA, fieldA, labelB, fieldB) {
    var row = el('div', 'rc-field-pair');
    var colA = el('div', null);
    colA.appendChild(el('label', 'margin-top:0;', escapeHtml(labelA)));
    colA.appendChild(fieldA);
    var colB = el('div', null);
    colB.appendChild(el('label', 'margin-top:0;', escapeHtml(labelB)));
    colB.appendChild(fieldB);
    row.appendChild(colA);
    row.appendChild(colB);
    return row;
  }

  // Fixed set of 15 preset avatar images a driver can pick from (2026-08-30,
  // Matt's ask) -- assets/avatars/avatar-01.png through avatar-15.png,
  // zero-padded to 2 digits to match the files on disk. No admin/catalog
  // sheet involved -- this is just a fixed image set, same spirit as the
  // fixed CAR_OBJECTIVE_CATALOG_/SPONSOR_*_TRIGGERS vocabularies elsewhere.
  var RC_AVATAR_FILENAMES_ = (function () {
    var list = [];
    for (var i = 1; i <= 15; i++) list.push('avatar-' + (i < 10 ? '0' + i : i) + '.png');
    return list;
  })();

  // Shared avatar circle -- an uploaded/picked image (profile.avatarFilename,
  // from assets/avatars/) when one is set, otherwise the same initials
  // fallback the header uses (_rcHeaderInitials(), global from header.js --
  // loaded before this script, so it's safe to call directly here without
  // duplicating that logic). onerror falls back to initials too, in case a
  // stored filename doesn't actually exist under assets/avatars/.
  function buildAvatarCircle(profile, extraClass) {
    var circle = el('div', 'rc-avatar-circle' + (extraClass ? ' ' + extraClass : ''));
    var initials = (typeof _rcHeaderInitials === 'function') ? _rcHeaderInitials(profile && profile.displayName) : '?';
    if (profile && profile.avatarFilename) {
      var img = document.createElement('img');
      img.className = 'rc-avatar-circle-img';
      img.alt = '';
      img.src = 'assets/avatars/' + profile.avatarFilename;
      img.onerror = function () {
        img.remove();
        circle.textContent = initials;
      };
      circle.appendChild(img);
    } else {
      circle.textContent = initials;
    }
    return circle;
  }

  // ---------------------------------------------------------------------
  // CHANGE AVATAR POPUP -- a fixed grid of the 15 preset images (5 rows of
  // 3), opened from a link inside Edit Profile. Selecting one and hitting
  // Save posts straight to updateOwnProfile with the driver's OWN current
  // field values (this action requires username/firstName/lastName/email
  // every call -- there's no avatar-only endpoint) plus the new
  // avatarFilename, so this is a genuinely standalone action: it doesn't
  // touch or depend on whatever the driver may be mid-editing in the Edit
  // Profile form behind it. onSaved(newProfile) lets the caller (Edit
  // Profile's own avatar circle) refresh immediately without a page reload.
  // ---------------------------------------------------------------------
  function openAvatarPickerModal(profile, token, onSaved) {
    var body = el('div');
    // el(tag, style, html) only takes 3 args -- this used to pass 4
    // ('rc-hint' AND a stray 'margin-top:0;' string), so the real message
    // silently got shifted out and el() rendered the literal text
    // "margin-top:0;" instead (2026-09-01 bug report: "this displays on
    // the change avatar popup"). Fixed to the intended 2-arg call.
    body.appendChild(el('p', 'rc-hint', 'Choose a profile picture. You can change this again any time.'));

    var grid = el('div', 'rc-avatar-picker-grid');
    var selected = profile.avatarFilename || null;
    var itemButtons = [];

    function refreshSelection() {
      itemButtons.forEach(function (btn) {
        btn.classList.toggle('rc-avatar-picker-item-selected', btn.getAttribute('data-filename') === selected);
      });
    }

    RC_AVATAR_FILENAMES_.forEach(function (filename) {
      var btn = el('button', 'rc-avatar-picker-item');
      btn.type = 'button';
      btn.setAttribute('data-filename', filename);
      var img = document.createElement('img');
      img.src = 'assets/avatars/' + filename;
      img.alt = 'Avatar option';
      img.loading = 'lazy';
      // Hides the button entirely instead of showing a broken-image icon if
      // a filename in RC_AVATAR_FILENAMES_ doesn't actually exist under
      // assets/avatars/ (e.g. a mismatched name on disk).
      img.onerror = function () { btn.style.display = 'none'; };
      btn.appendChild(img);
      btn.addEventListener('click', function () {
        selected = filename;
        refreshSelection();
      });
      grid.appendChild(btn);
      itemButtons.push(btn);
    });
    refreshSelection();
    body.appendChild(grid);

    var saveBtn = el('button', 'rc-btn-primary', 'Save Avatar');
    saveBtn.type = 'button';
    saveBtn.style.marginTop = '18px';
    saveBtn.addEventListener('click', function () {
      if (!selected) {
        showToast('Pick an avatar first.', 'error');
        return;
      }

      // Instant, no wait on the server (2026-09-03, Matt's call: "the
      // user should not have to wait for the sheet to save or the script
      // to run" -- his standing rule for the whole site). The picker
      // closes and the new avatar shows up everywhere on screen the
      // instant it's picked; the actual write to the sheet happens
      // silently in the background below. avatarFilename is the only
      // field genuinely changing here, and it's already known
      // client-side (it's whatever was just clicked), so there's nothing
      // to fake or leave blank.
      var previousAvatarFilename = profile.avatarFilename;
      profile.avatarFilename = selected;
      if (onSaved) onSaved(profile);
      setProfileCache(profile);
      if (typeof renderHeader === 'function') renderHeader();
      if (pickerModal) pickerModal.close();

      fetchApi('updateOwnProfile', {
        method: 'POST',
        token: token,
        body: {
          username: profile.username,
          firstName: profile.firstName,
          lastName: profile.lastName,
          suffix: profile.suffix || '',
          email: profile.email,
          location: profile.location || '',
          timeZone: profile.timeZone || '',
          avatarFilename: selected
        }
      })
        .then(function (data) {
          if (!data.success) {
            profile.avatarFilename = previousAvatarFilename;
            if (onSaved) onSaved(profile);
            setProfileCache(profile);
            if (typeof renderHeader === 'function') renderHeader();
            showToast(data.message || 'Could not save your avatar -- reverted.', 'error');
            return;
          }
          setProfileCache(data.profile);
          if (typeof renderHeader === 'function') renderHeader();
        })
        .catch(function () {
          profile.avatarFilename = previousAvatarFilename;
          if (onSaved) onSaved(profile);
          setProfileCache(profile);
          if (typeof renderHeader === 'function') renderHeader();
          showToast('Could not reach the server -- avatar change reverted.', 'error');
        });
    });
    body.appendChild(saveBtn);

    var pickerModal = showModal('Change Avatar', { bodyEl: body });
  }

  // ---------------------------------------------------------------------
  // EDIT PROFILE POPUP -- Username / First / Last / Suffix / Email /
  // Location / Time Zone, posting to the `updateOwnProfile` action, plus
  // the existing passwordChangeSection() embedded underneath so Change
  // Password lives in the same popup. DisplayName is never directly
  // editable here -- it's computed server-side from First/Last/Suffix,
  // same rule as registration.
  // ---------------------------------------------------------------------
  function openEditProfileModal(profile, token) {
    if (!profile || !token) return;

    var body = el('div');

    // Avatar circle (2x size, centered -- 2026-08-30, Matt's call) with
    // "Change Avatar" then "Delete Avatar" stacked underneath it. Rebuilt
    // in place (avatarRow.replaceChild) when the picker popup saves a new
    // avatarFilename, so the driver sees their new picture the instant
    // they close the picker, without this whole popup re-opening.
    var avatarRow = el('div', 'rc-avatar-edit-row');
    var avatarCircle = buildAvatarCircle(profile, 'rc-avatar-circle-xl');
    avatarRow.appendChild(avatarCircle);
    var changeAvatarLink = el('a', 'rc-avatar-change-link', 'Change Avatar');
    changeAvatarLink.href = '#';
    changeAvatarLink.addEventListener('click', function (evt) {
      evt.preventDefault();
      openAvatarPickerModal(profile, token, function (newProfile) {
        profile = newProfile;
        var freshCircle = buildAvatarCircle(profile, 'rc-avatar-circle-xl');
        avatarRow.replaceChild(freshCircle, avatarCircle);
        avatarCircle = freshCircle;
      });
    });
    avatarRow.appendChild(changeAvatarLink);

    // Delete Avatar (added 2026-08-30) -- sends avatarFilename: '' rather
    // than omitting the field, which is what actually clears the stored
    // filename instead of leaving it untouched (see handleUpdateOwnProfile,
    // Auth.gs). A full rcReloadAfterSave() follows success, same as every
    // other popup save, so the header avatar and this popup (on reopen)
    // both reflect "back to initials" immediately.
    var deleteAvatarLink = el('a', 'rc-avatar-delete-link', 'Delete Avatar');
    deleteAvatarLink.href = '#';
    deleteAvatarLink.addEventListener('click', function (evt) {
      evt.preventDefault();
      if (!profile.avatarFilename) return; // nothing to delete

      // Instant, no wait on the server (2026-09-03, Matt's call) -- the
      // avatar drops back to initials on screen (here and in the header)
      // the moment this is clicked; the actual clear happens silently in
      // the background. Failure just puts the old avatar back and says
      // why, same "feel instant, reconcile quietly after" pattern as
      // Save Avatar above.
      var previousAvatarFilename = profile.avatarFilename;
      profile.avatarFilename = '';
      var freshCircle = buildAvatarCircle(profile, 'rc-avatar-circle-xl');
      avatarRow.replaceChild(freshCircle, avatarCircle);
      avatarCircle = freshCircle;
      setProfileCache(profile);
      if (typeof renderHeader === 'function') renderHeader();

      fetchApi('updateOwnProfile', {
        method: 'POST',
        token: token,
        body: {
          username: profile.username, firstName: profile.firstName, lastName: profile.lastName,
          suffix: profile.suffix || '', email: profile.email,
          location: profile.location || '', timeZone: profile.timeZone || '',
          avatarFilename: ''
        }
      })
        .then(function (data) {
          if (!data.success) {
            profile.avatarFilename = previousAvatarFilename;
            var revertedCircle = buildAvatarCircle(profile, 'rc-avatar-circle-xl');
            avatarRow.replaceChild(revertedCircle, avatarCircle);
            avatarCircle = revertedCircle;
            setProfileCache(profile);
            if (typeof renderHeader === 'function') renderHeader();
            showToast(data.message || 'Could not remove your avatar -- reverted.', 'error');
            return;
          }
          setProfileCache(data.profile);
          if (typeof renderHeader === 'function') renderHeader();
        })
        .catch(function () {
          profile.avatarFilename = previousAvatarFilename;
          var revertedCircle2 = buildAvatarCircle(profile, 'rc-avatar-circle-xl');
          avatarRow.replaceChild(revertedCircle2, avatarCircle);
          avatarCircle = revertedCircle2;
          setProfileCache(profile);
          if (typeof renderHeader === 'function') renderHeader();
          showToast('Could not reach the server -- avatar removal reverted.', 'error');
        });
    });
    avatarRow.appendChild(deleteAvatarLink);
    body.appendChild(avatarRow);

    var form = el('form');
    form.appendChild(el('label', 'margin-top:0;', 'Username'));
    var username = el('input'); username.type = 'text'; username.value = profile.username || ''; username.required = true;
    form.appendChild(username);

    form.appendChild(el('label', null, 'First Name'));
    var firstName = el('input'); firstName.type = 'text'; firstName.value = profile.firstName || ''; firstName.required = true;
    form.appendChild(firstName);

    form.appendChild(el('label', null, 'Last Name'));
    var lastName = el('input'); lastName.type = 'text'; lastName.value = profile.lastName || ''; lastName.required = true;
    form.appendChild(lastName);

    form.appendChild(el('label', null, 'Suffix (optional)'));
    var suffix = document.createElement('select');
    var suffixBlank = document.createElement('option'); suffixBlank.value = ''; suffixBlank.textContent = 'None';
    suffix.appendChild(suffixBlank);
    (typeof DRIVER_NAME_SUFFIXES !== 'undefined' ? DRIVER_NAME_SUFFIXES : []).forEach(function (s) {
      var opt = document.createElement('option'); opt.value = s; opt.textContent = s;
      if (profile.suffix === s) opt.selected = true;
      suffix.appendChild(opt);
    });
    form.appendChild(suffix);

    form.appendChild(el('label', null, 'Email Address'));
    var email = el('input'); email.type = 'email'; email.value = profile.email || ''; email.required = true;
    form.appendChild(email);
    form.appendChild(el('div', 'rc-hint', 'Only used for verification and password resets.'));

    form.appendChild(el('label', null, 'Location'));
    var location = document.createElement('select');
    var locBlank = document.createElement('option'); locBlank.value = ''; locBlank.textContent = 'Select a country';
    location.appendChild(locBlank);
    (typeof COUNTRIES !== 'undefined' ? COUNTRIES : []).forEach(function (country) {
      var opt = document.createElement('option'); opt.value = country; opt.textContent = country;
      if (profile.location === country) opt.selected = true;
      location.appendChild(opt);
    });
    form.appendChild(location);

    form.appendChild(el('label', null, 'Time Zone'));
    var timeZone = document.createElement('select');
    var tzBlank = document.createElement('option'); tzBlank.value = ''; tzBlank.textContent = 'Select a time zone';
    timeZone.appendChild(tzBlank);
    (typeof getTimezoneList === 'function' ? getTimezoneList() : []).forEach(function (tz) {
      var opt = document.createElement('option'); opt.value = tz; opt.textContent = typeof timezoneLabel === 'function' ? timezoneLabel(tz) : tz;
      if (profile.timeZone === tz) opt.selected = true;
      timeZone.appendChild(opt);
    });
    form.appendChild(timeZone);

    // Email-notification opt-in (2026-09-02, Matt's ask: same checkbox as
    // registration, now editable here too -- defaults off at signup,
    // this is where a driver turns it on/off afterward). See
    // rcSendPendingNotificationEmails (DataCache.gs) for what it actually
    // gates: an automatic email for a notification still unread 24 hours
    // after it was created (season starts, account upgrades, a pending
    // wager awaiting a response).
    var emailNotifyRow = el('div', 'rc-check-row');
    emailNotifyRow.style.marginTop = '16px';
    var emailNotify = document.createElement('input');
    emailNotify.type = 'checkbox';
    emailNotify.id = 'rc-editprofile-email-notify';
    emailNotify.checked = !!profile.emailNotificationsOptIn;
    var emailNotifyLabel = document.createElement('label');
    emailNotifyLabel.setAttribute('for', 'rc-editprofile-email-notify');
    emailNotifyLabel.textContent = 'Email me about things I might miss, like season starts.';
    emailNotifyRow.appendChild(emailNotify);
    emailNotifyRow.appendChild(emailNotifyLabel);
    form.appendChild(emailNotifyRow);

    var saveBtn = el('button', null, 'Save Changes');
    saveBtn.type = 'submit';
    saveBtn.className = 'rc-btn-primary';
    saveBtn.style.marginTop = '16px';
    form.appendChild(saveBtn);

    body.appendChild(form);
    body.appendChild(el('hr', 'rc-nav-divider', null));
    body.appendChild(passwordChangeSection(token));

    var modalHandle = showModal('Edit Profile', { bodyEl: body });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      if (!username.value.trim() || !firstName.value.trim() || !lastName.value.trim() || !email.value.trim()) {
        showToast('Username, first name, last name, and email are required.', 'error');
        return;
      }

      // Instant, no wait on the server (2026-09-03, Matt's call: "the
      // user should not have to wait for the sheet to save or the script
      // to run" -- his standing rule for the whole site). The popup
      // closes the moment Save Changes is clicked, and the header's
      // name/avatar update right away too -- displayName itself is
      // computed server-side from First/Last/Suffix (never edited
      // directly here), so this builds the same "First Last Suffix"
      // shape client-side as a stand-in; the quiet background reload
      // below fills in the server's actual computed value once the save
      // lands, same "placeholder now, real value later" pattern used
      // elsewhere on this page. A failure (e.g. that username is already
      // taken) reverts the header back to what it showed before and
      // explains why via toast, since the popup is already gone.
      var previousProfileCache = (typeof getProfileCache === 'function') ? getProfileCache() : null;
      var optimisticDisplayName = [firstName.value.trim(), lastName.value.trim(), suffix.value].filter(function (s) { return s; }).join(' ');
      setProfileCache({ displayName: optimisticDisplayName, role: previousProfileCache ? previousProfileCache.role : '', avatarFilename: profile.avatarFilename || '' });
      if (typeof renderHeader === 'function') renderHeader();
      if (modalHandle) modalHandle.close();

      fetchApi('updateOwnProfile', {
        method: 'POST',
        token: token,
        body: {
          username: username.value.trim(),
          firstName: firstName.value.trim(),
          lastName: lastName.value.trim(),
          suffix: suffix.value,
          email: email.value.trim(),
          location: location.value,
          timeZone: timeZone.value,
          emailNotificationsOptIn: emailNotify.checked ? '1' : '0'
        }
      })
        .then(function (data) {
          if (!data.success) {
            if (previousProfileCache) setProfileCache(previousProfileCache);
            if (typeof renderHeader === 'function') renderHeader();
            showToast(data.message || 'Could not save your changes -- reverted.', 'error');
            return;
          }
          setProfileCache(data.profile); // keeps the header avatar/name current here and on every other page, once the reload below actually re-renders it
          rcReloadAfterSave();
        })
        .catch(function () {
          if (previousProfileCache) setProfileCache(previousProfileCache);
          if (typeof renderHeader === 'function') renderHeader();
          showToast('Could not reach the server -- changes reverted.', 'error');
        });
    });
  }

  // that show icons on the page... make it more human-friendly." This
  // briefly lived as a standalone page (help.html) so the Rulebook would
  // have more room to grow, but Matt's call was to fold it back into the
  // sidebar shell -- losing the sidebar/nav chrome on its own separate
  // page felt like leaving the site, not like part of the account.

    // points at assets/images/signature.png, which doesn't exist yet, so the
