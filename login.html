<!--
  Race Club — login.html  (v0.2.5, GitHub Pages edition)

  WHAT CHANGED VS. THE GOOGLE SITES VERSION:
  This is the source file's "LOGIN VIEW" pulled out into its own real
  page. All the Sites-only workarounds (reportHeight()/postMessage resize
  hack, scrollbar-hiding CSS, single #rc-root view-toggle div) are gone —
  see the top-level migration notes for the full list. The actual login
  logic (fetch to ?action=login with a text/plain POST body, the
  EMAIL_NOT_VERIFIED inline "Resend verification email" flow, the
  ACCOUNT_DISABLED mailto link) is preserved exactly, just reorganized:

  - On success, the token is stored via setToken() (js/auth.js) and the
    browser navigates to Account.html — the source rendered the profile
    view in place instead, since it was still the same embed/page.
  - On a "Resend verification email" click (either from a failed
    EMAIL_NOT_VERIFIED login, or a fresh registration), the ProfileID is
    stashed in sessionStorage under 'raceclub_pending_profile_id' and the
    browser navigates to verify.html, which reads it from there. The
    source kept this in a plain in-memory JS variable
    (lastRegisteredUsername) since the code-entry view lived in the same
    page; sessionStorage is the equivalent for a real page navigation and
    is cleared automatically when the tab closes.
  - A message can be queued for this page by another page via
    sessionStorage's 'raceclub_login_message' key (used by the 30-minute
    inactivity auto-logout in js/auth.js, and by verify.html after a
    successful code verification) — read once on load, then cleared.

  FLIP-BACK (this pass, Matt's direct call): login is by USERNAME again,
  not email -- email's only job now is where a password-reset code gets
  sent (reset-password.html). The field is Username, sent as the
  `username` key, matching handleLogin. The "Resend verification email"
  button now sends `username` too (handleResendVerification accepts
  username as well as ProfileID, specifically for this screen, since a
  driver who hasn't verified yet has no ProfileID typed in anywhere on
  this page) and stashes the ProfileID the server hands back for
  verify.html to use.

  ADDED (this pass): a "Forgot password?" link under the "New here?" line,
  pointing to the new reset-password.html.

  TOASTS (this pass): every plain result message on this page (queued
  cross-page messages, login failure, "could not reach the server", the
  resend-code result) now goes through js/header.js's showToast() instead
  of the old inline #rc-login-message box -- see that file's header
  comment for why. The two exceptions are ACCOUNT_DISABLED (its mailto
  link needs to stay clickable, which an auto-dismissing toast can't
  guarantee) and EMAIL_NOT_VERIFIED (its message explains the Resend
  button that appears right under it, and that button needs to still be
  legible after the toast that announced it has faded) -- both keep their
  explanatory text inline, right next to the control they belong to,
  since a toast is the wrong home for text a driver still needs to be
  reading when they act on it.

  FIX (this pass): setProfileCache() was being handed the raw login
  response ({success, token, profile}) instead of its nested .profile --
  meant every field it cached (name, role) read back out blank on every
  other page's header. Now passes data.profile through.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · Race Club</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
</head>
<body>
<div id="rc-header"></div>
<script>renderHeader();</script>
<div class="rc-auth-page">
  <div class="rc-auth-wrap">
    <h1>Login / Register</h1>

    <div id="rc-setup-warning" class="rc-message rc-error" style="display:none;text-align:center;"></div>

    <div class="rc-card" style="margin-top:24px;">
      <form id="rc-login-form">
        <label style="margin-top:0;">Username</label>
        <input id="rc-username" type="text" autocomplete="username" required>
        <label>Password</label>
        <input id="rc-password" type="password" autocomplete="current-password" required>
        <button id="rc-login-btn" type="submit" class="rc-btn-primary">Log In</button>
      </form>
      <div id="rc-login-message" class="rc-message"></div>
      <button type="button" class="rc-link-btn" id="rc-login-resend" style="display:none;margin-top:8px;">Resend verification email</button>
    </div>
    <p class="rc-auth-footer">
      New here? <button type="button" class="rc-link-btn" id="rc-show-register" onclick="window.location.href='register.html'">Create an account</button>
    </p>
    <p class="rc-auth-footer" style="margin-top:6px;">
      <a href="reset-password.html" class="rc-link-btn">Forgot password?</a>
    </p>
  </div>
</div>

<!-- Site footer -- on every page now (Matt's call), not just index.html. -->
<footer class="rc-site-footer">
  Copyright Race Club 2026. All rights reserved. Created and developed with the help of Claude AI.
</footer>

<script>
(function () {
  if (apiBaseUrlIsUnset()) {
    var warn = document.getElementById('rc-setup-warning');
    warn.style.display = 'block';
    warn.textContent = 'API_BASE_URL is not set. Edit js/api.js and paste in your Apps Script Web App URL.';
    document.getElementById('rc-login-form').querySelectorAll('input,button').forEach(function (i) { i.disabled = true; });
    return;
  }

  // If we already have a session token, don't make the user log in again.
  if (getToken()) {
    window.location.replace('Account.html');
    return;
  }

  // Message queued by another page (inactivity timeout, verify.html
  // success, reset-password.html success, etc.) -- shown once, then
  // cleared.
  var queuedMessage = sessionStorage.getItem('raceclub_login_message');
  if (queuedMessage) {
    showToast(queuedMessage, 'success');
    sessionStorage.removeItem('raceclub_login_message');
  }

  // After a successful registration+verification, register.html stashes
  // the username here (verify.html leaves it untouched, just carries it
  // forward) so it can be pre-filled here and the password field focused,
  // matching the source file's post-verify behavior of jumping straight
  // back to a ready-to-type login form. reset-password.html only ever
  // knows the driver's EMAIL, not their username, so it doesn't set this
  // -- a password reset just queues the login-message toast instead.
  var prefillUsername = sessionStorage.getItem('raceclub_prefill_username');
  if (prefillUsername) {
    document.getElementById('rc-username').value = prefillUsername;
    sessionStorage.removeItem('raceclub_prefill_username');
    document.getElementById('rc-password').focus();
  }

  document.getElementById('rc-login-form').addEventListener('submit', function (evt) {
    evt.preventDefault();
    var btn = document.getElementById('rc-login-btn');
    var msg = document.getElementById('rc-login-message');
    msg.className = 'rc-message';
    msg.innerHTML = '';
    btn.disabled = true;
    btn.textContent = 'Logging in...';

    // Lock the username/password fields for the duration of the request
    // (2026-09-01, Matt's call: "I should not be able to change anything
    // in the username or password box until I either get through or am
    // denied") -- previously only the button itself was disabled, so the
    // text could still be edited while the login call was in flight.
    // rc-field-locked (2026-09-02, Matt's call: "I want the text boxes
    // grayed out, not just locked... obvious that nothing can be
    // changed") -- same class the Edit Season wizard's own locked fields
    // already use for this exact "grayed out, not just disabled" look
    // (see .rc-field-locked in style.css), reused here instead of a
    // second one-off style.
    var usernameField = document.getElementById('rc-username');
    var passwordField = document.getElementById('rc-password');
    usernameField.disabled = true;
    passwordField.disabled = true;
    usernameField.classList.add('rc-field-locked');
    passwordField.classList.add('rc-field-locked');

    var username = usernameField.value.trim();
    var password = passwordField.value;

    // IMPORTANT: Content-Type is deliberately 'text/plain' (see
    // fetchApi in js/api.js), NOT 'application/json'. Apps Script Web
    // Apps can't handle a CORS preflight (OPTIONS) request, which
    // application/json would trigger. Do not change this.
    fetchApi('login', { method: 'POST', body: { username: username, password: password } })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = 'Log In';
        if (!data.success) {
          usernameField.disabled = false;
          passwordField.disabled = false;
          usernameField.classList.remove('rc-field-locked');
          passwordField.classList.remove('rc-field-locked');
          var resendBtn = document.getElementById('rc-login-resend');
          resendBtn.style.display = 'none';
          if (data.error === 'ACCOUNT_DISABLED' && data.contactEmail) {
            // Keeps its mailto link inline rather than a toast -- a
            // driver needs to still be able to click it after reading it.
            msg.className = 'rc-message rc-error';
            msg.innerHTML = (data.message || 'This account has been disabled.') +
              ' <a href="mailto:' + data.contactEmail + '?subject=Race%20Club%20account">Contact administrator</a>';
          } else if (data.error === 'EMAIL_NOT_VERIFIED') {
            // Stays inline too -- it explains the Resend button that
            // appears right under it, which needs to still be legible
            // after a toast would have already faded.
            msg.className = 'rc-message rc-error';
            msg.textContent = data.message || 'Please verify your email before logging in.';
            resendBtn.style.display = 'inline-block';
          } else {
            showToast(data.message || 'Login failed.', 'error');
          }
          return;
        }
        // The login response IS a full profile payload plus a token (see
        // the source file's buildProfilePayload comment) -- we don't need
        // a second getProfile round-trip here. Account.html will pick the
        // data back up itself via getProfile on load, same as any other
        // direct visit to that page.
        setToken(data.token);
        setProfileCache(data.profile); // so the header avatar has something to show immediately, site-wide
        // The login response IS the full profile payload already (see the
        // comment above) -- stash it so Account.html can render straight
        // from it instead of firing its own getProfile call right after
        // redirecting here, which was a second full Apps Script round-trip
        // back to back with the login call itself (each one can take
        // several seconds on a cold start) and was the main reason login
        // felt like it hung. sessionStorage, not localStorage, since this
        // is meant to be read exactly once by the very next page load.
        sessionStorage.setItem('raceclub_fresh_profile', JSON.stringify(data));
        window.location.href = 'Account.html';
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Log In';
        usernameField.disabled = false;
        passwordField.disabled = false;
        usernameField.classList.remove('rc-field-locked');
        passwordField.classList.remove('rc-field-locked');
        showToast('Could not reach the server. Check API_BASE_URL and try again.', 'error');
      });
  });

  // From the login screen, "Resend" sends a fresh code and jumps straight
  // to verify.html's code-entry view, rather than just firing off an
  // email and leaving the user on the login form.
  document.getElementById('rc-login-resend').addEventListener('click', function () {
    var username = document.getElementById('rc-username').value.trim();
    var btn = this;
    btn.disabled = true;
    var originalText = btn.textContent;
    btn.textContent = 'Sending...';
    fetchApi('resendVerification', { method: 'POST', body: { username: username } })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = originalText;
        if (data.success) {
          sessionStorage.setItem('raceclub_pending_profile_id', data.profileId);
          sessionStorage.setItem('raceclub_verify_message', data.message || 'We emailed you a new 6-digit code. Enter it below.');
          window.location.href = 'verify.html';
        } else {
          showToast(data.message || 'Could not send a new code.', 'error');
        }
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = originalText;
        showToast('Could not reach the server. Try again in a moment.', 'error');
      });
  });
})();
</script>
</body>
</html>
