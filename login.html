<!--
  Race Club — login.html  (v0.3, Discord OAuth edition)

  REBUILT 2026-09-13 (Matt's call): the whole username/password form is
  gone. Login is a single "Sign in with Discord" button that sends the
  browser straight to Discord's own authorize screen -- no server round
  trip needed to build that link first, since the Client ID and this
  site's redirect URL are both meant to be public (same idea as
  API_BASE_URL already being a plain, visible constant in js/api.js).

  Discord redirects back to the Apps Script Web App's bare URL (not this
  page) with ?code=..., which Core.gs's doGet hands to
  handleDiscordCallback (Auth.gs) -- THAT function does the real work
  (token exchange, membership/Steam-connection check, Users lookup,
  session token) and finally redirects the browser to
  Account.html?token=..., which js/auth.js's consumeDiscordTokenFromUrl()
  picks up. This page's only job is sending someone TO Discord in the
  first place.

  DISCORD_CLIENT_ID below is the public half of the OAuth app -- safe to
  ship in plain HTML, same as any other OAuth "Sign in with ___" button
  anywhere on the web. The Client SECRET never leaves Script Properties
  server-side and is never referenced here.

  register.html / verify.html / reset-password.html are gone too --
  there's no password to register, verify, or reset anymore.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · Race Club</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/header.js"></script>
</head>
<body>
<div id="rc-header"></div>
<script>renderHeader();</script>
<div class="rc-auth-page">
  <div class="rc-auth-wrap">
    <h1>Log In</h1>

    <div id="rc-setup-warning" class="rc-message rc-error" style="display:none;text-align:center;"></div>

    <div class="rc-card" style="margin-top:24px;text-align:center;">
      <p style="margin-top:0;color:var(--rc-steel);">Race Club accounts run through Discord — the same server you already use for the league.</p>
      <button id="rc-discord-login-btn" type="button" class="rc-btn-primary rc-discord-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:-4px;margin-right:8px;"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.099.246.197.373.291a.077.077 0 0 1-.006.128c-.598.35-1.22.645-1.873.892a.076.076 0 0 0-.04.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.056c.5-5.177-.838-9.673-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.955 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.211 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
        Sign in with Discord
      </button>
      <div id="rc-login-message" class="rc-message"></div>
    </div>
    <p class="rc-auth-footer">
      Not in the Discord yet? <a href="index.html#rc-needs-section" class="rc-link-btn">See what you'll need to join</a>
    </p>
  </div>
</div>

<!-- Site footer -- on every page now (Matt's call), not just index.html. -->
<footer class="rc-site-footer">
  Copyright Race Club 2026. All rights reserved. Created and developed with the help of Claude AI.
</footer>

<script>
(function () {
  // Public by design -- see the file header comment above.
  var DISCORD_CLIENT_ID = '1548732673240080424';
  var DISCORD_SCOPES = 'identify guilds.members.read connections';

  if (apiBaseUrlIsUnset()) {
    var warn = document.getElementById('rc-setup-warning');
    warn.style.display = 'block';
    warn.textContent = 'API_BASE_URL is not set. Edit js/api.js and paste in your Apps Script Web App URL.';
    document.getElementById('rc-discord-login-btn').disabled = true;
    return;
  }

  // If we already have a session token, don't make the user log in again.
  if (getToken()) {
    window.location.replace('Account.html');
    return;
  }

  // Message queued by another page (inactivity timeout, etc.) -- shown
  // once, then cleared.
  var queuedMessage = sessionStorage.getItem('raceclub_login_message');
  if (queuedMessage) {
    showToast(queuedMessage, 'success');
    sessionStorage.removeItem('raceclub_login_message');
  }

  document.getElementById('rc-discord-login-btn').addEventListener('click', function () {
    // API_BASE_URL (js/api.js) doubles as the OAuth redirect_uri -- it has
    // to be the EXACT string registered as a Redirect in Discord's
    // Developer Portal, which is why this isn't built with any extra
    // query params tacked on.
    var authorizeUrl = 'https://discord.com/oauth2/authorize' +
      '?client_id=' + encodeURIComponent(DISCORD_CLIENT_ID) +
      '&redirect_uri=' + encodeURIComponent(API_BASE_URL) +
      '&response_type=code' +
      '&scope=' + encodeURIComponent(DISCORD_SCOPES) +
      '&prompt=consent';
    window.location.href = authorizeUrl;
  });
})();
</script>
</body>
</html>
